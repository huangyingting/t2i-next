id: ming-gongbi-mixi-tu
description: 以晚明工笔秘戏图（亦称私密春宫图或秘戏画）的视觉语言，创作多样且有历史依据的中国情色册页主题。结合成熟人物的亲密互动、精确的细线描绘、层叠矿物色、有序的江南室内空间、华贵织物、克制的象征，以及古旧装裱画作的物质质感。呈现匿名画坊的原创构图。
modules:
- id: medium-silk-painting
  parameters: {}
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 每个成年人都须完整穿着全套晚明层叠服饰，保持衣着闭合并正确分层。允许私下交谈、交换物件、逗引的目光、交缠衣袖、共同奏乐或温柔拥抱，但须遮住乳房、臀部和生殖器，不得呈现情色自我抚触。
      frames:
      - 画面直接呈现完整穿着的人物正在进行的非情色互动。
    erotic:
      shared:
      - 不得呈现生殖器接触或色情式解剖强调。
      - 不得将界定内容的部分藏在屏风、帘、被、袖、家具、刻意裁切、远处剪影、象征花卉或诗意隐喻之后。绘画可以优雅克制，但所选内容级别在视觉上必须毫无歧义。
      - 领口、袄、裙、裤或内袍可以松开、敞开或落向一侧，但仍须可辨认。
      frames:
      - 画面直接呈现可见的感官亲密互动，保持非露骨边界。
    hardcore:
      shared:
      - 不得将界定内容的部分藏在屏风、帘、被、袖、家具、刻意裁切、远处剪影、象征花卉或诗意隐喻之后。绘画可以优雅克制，但所选内容级别在视觉上必须毫无歧义。
      - 正在发生的行为通过相容的骨盆对齐、肢体位置、支撑、可见接触及其轴线、衣物移位和身体反应保持清晰。男性身体融入完整人物构图，不作生殖部位特写或解剖细节放大。
      - 成年人可以部分或全身裸露，但保留的衣物、叠起的袍服、移位的腰带、鞋、发饰和寝具必须保持明确的历史特征及构图重要性。
      frames:
      - 画面直接呈现正在发生的明确性行为。
  themes:
    common:
    - 成果是在熟绢上绘制的历史册页画。它不是真人实拍、摄影、电影剧照、西方油画、日本浮世绘、现代插画、动漫、计算机生成图像、游戏美术、博物馆陈列，也不是装框艺术品的照片。
    - 从正面将生成图像定义为手绘古绢册页的平面档案摹本。古旧熟绢画面连续延伸至画布的每一条边，构成一张不中断的画面。周围没有桌面、墙壁、玻璃、画框、博物馆展柜、书籍模型或文物的立体展示。
    - 每个人物、衣物、物件和建筑平面都只以绢上的墨线轮廓与颜料存在。同一套可见的绢织纹、老化色调和浅微表面起伏，在留白和薄色罩染下连续延伸，使人物与环境统一在同一个实体画面上。成年人是具有个体特征的工笔肖像，成熟面部线条各有差别，成人比例可信、关节结构明确、姿态有支撑，而每一笔都仍明显是绢上的墨或矿物色。
    - 将雨、植物、家具、织物、皮肤、头发及亲密接触描述为勾画的轮廓与绘制的色形。不得要求毛孔、镜面高光、写实反射、自然主义照明、电影氛围、光学对焦或物理渲染材质。文物的绢织纹与颜料颗粒感始终是主导的表面实质。
    - 古旧熟绢画面连续延伸至画布的每一条边，绘制的建筑、留白绢地、衣物形状、枝叶或裁切的物件自然触及并越出图像边界。不得出现可见的装裱留边、卡纸、画框、边框或矩形边带。
    - 保持岁月痕迹可见，但不要勾出画面边框。边缘旧痕必须断续、变化并不规则地向内消散：一角可露出磨损的绢纤维，一侧局部可带茶褐色氧化痕，另一边可保留较洁净的暖象牙色绢地。绝不能将这些痕迹连接为连续矩形、画面内轮廓、均匀着色的边缘围框、装饰线或空白纸质围边。
    - 严格使用所要求的人物阵容，呈现汉族人物成熟的面部比例、沉稳举止和个体特征。其面部结构、体格、发型、社会角色、衣着和关系在整个主题中保持稳定。
    - 互动保持温暖，每个人物通过手、姿态、目光和身体朝向，可见地主动发起、引导、回应或调整共同动作。
    - 将每个主题设于1573至1644年间、历史上合理的江南地点，例如苏州、杭州、南京、扬州、嘉兴，或该文化区域内的运河城镇。明确年份、季节、时段、城市或城镇、房间功能和成人社会背景。轮换采用文人之家、商人宅邸、私家园林书斋、琴房、绣房、藏书家的居室、僻静客亭和雅致客栈，不要把每个环境都变成宫殿或妓院。
    - 使用相互协调的晚明建筑与陈设：白灰墙、深色木格窗、月洞门、廊庑、园石、竹帘、架子帐床、罗汉榻、卧榻、脚凳、香几、嵌入式搁架、折屏、垂帘、明式桌案、凳、柜和灯架。榫卯、尺度、木料、漆面、陶瓷、寝具和房间用途须内部一致。
    - 为成年人穿着可信的晚明汉族服饰。使用层叠袍服、袄、裙、裤、内袍、腰带、绣领，仅在符合历史时使用云肩，并使用布鞋、丝履、克制的首饰及带梳或簪的成熟盘发。即使衣物松开或脱下，也要保留所要求成年人的服装作为具体设计物件的特征。
    - 不得混入清代辫发、满族宫廷服饰、旗袍、现代旗袍、立领、西式束身衣、日本和服或腰带、唐代幻想服装、当代内衣、合成织物、现代家具、电灯或笼统的泛亚洲装饰。
    - 情绪基调应亲密、沉静而细察，而非滑稽闹剧。围绕明确的私密情境构建每个主题：宾客离去后仍在继续的音乐课、运河边亭中重逢的恋人、为避雨而关上书斋的夫妻、互赠刺绣礼物的两位女子、比看一本新装订书籍的两位男子，或共处夏日居室的可信伴侣。这些是示例，而非固定模板。
    - 赋予每个人物独立意图和可见的参与，避免一名主动者搭配一具装饰性身体。出现女性时，通过她的目光、手的位置、姿态、对衣物的控制和回应展现欲望与判断。不同性别的人物具有多样的社会角色。
    - 使用一处正在发生的小型叙事痕迹，使画面具有生活感：落下的发簪、渐冷的香、折到一半的信、移位的屏风、洒出的茶、尚未完成的绣架、松开的床帘、搁置的乐器、飘入格窗的雨，或遗在榻边的便鞋。痕迹必须辅助成年人的动作，不得变成滑稽奇观或引入未要求的旁观者。
    - 主题或画面中提及的每个人都必须属于所要求的人物阵容，并且在画中可见。不得将不在场的配偶、主人、仆人、宾客、顾客、官员、观看者或其他画外人物作为背景故事、动机、暗示的见证者或信件收件人引入。私密情境须在所描绘的成年人之间自成完整。
    - 将晚明丝绸、纱、锦、棉布与绣边作为主要图形结构。描述每个成年人的外层、内层、腰带、纹样、色系及衣着状态。以衣褶说明重力、重量、伸展范围和动作，而不是遮掩所选内容级别。
    - 保持人体解剖比例恰当、物理关系连贯。不得模仿其他情色传统中的器官放大、强烈透视缩短或怪诞夸张。使用成熟的椭圆脸、方脸、长脸和圆脸，多样体格，自然关节活动范围，以及各具特征的手、脚、发际线和表情。避免娃娃脸、千篇一律的美人、儿童比例、不可能的柔韧度和通用招贴美人姿势。
    - 使用受控的中国工笔线条，轮廓连续并体现运笔压力变化。在这张册页中，纤细如发的反复笔触也用于描绘眉、睫毛、散发、叶脉和雕刻细节。
    - 轮廓线粗细须有变化而克制。脸、手指、脚趾、衣物开口和界定内容的接触，在近看时必须保持精确。以界画的规整线法描绘床架、屏风、桌案、格窗、砖地和建筑边缘。曲线与直边须干净衔接，又不显得像矢量图般僵硬无生气。
    - 不得使用浮世绘主版轮廓、漫画勾墨、书法式泼洒痕迹、枯笔表现主义、以没骨花卉画为主的方法、徒手写意、水墨抽象、西方排线、喷绘边缘或数字线稿的均一性。
    - 使用三矾九染的视觉逻辑：反复透明施胶、染色和分层罩染，形成明润而受控的表面。将精确的固有色填涂与连续薄罩染结合。面部和身体保持在狭窄明度范围内，仅作最少的色调塑形：严格使用三种克制肤色，加上精细轮廓细节。采用浅底、一层透明暖肉色罩染和一道狭窄的重叠处线染。不得以连续渐变、冷色逆光、投影、明暗法、亮泽高光或西方体积渲染使形体圆雕化。
    - 保留矿物颜料的物质感。受保护的细节中，石青和石绿可略呈颗粒状且不透明；朱砂与胭脂保持温暖而克制；藤黄、赭石、花青、烟墨和浅蛤粉白补全层次。金粉或金线只能作为首饰、家具配件、织物或装裱细节上的小面积华贵点缀。
    - 每个主题和画面都必须明确列出由五至七个主要色系组成的晚明工笔矿物色调色方案：
    - '- 古旧暖象牙色或淡茶色的熟绢底；'
    - '- 以烟墨、焦墨或深蓝黑为线条主色；'
    - '- 一至两种暖色，如胭脂、朱砂、赭石、柿色或藤黄；'
    - '- 一至两种冷色，如石青、石绿、花青或柔和蓝绿；'
    - '- 一种安静的织物中性色，如藕荷、月白、秋香黄、檀褐或柔和靛青；以及'
    - '- 至多一种克制的蛤粉白或金粉点缀。'
    - 让暖色绢底占据最大的连续区域。将胭脂、朱砂和赭石集中于衣物、帘幕、嘴唇、脸颊和选定物件；少量使用石青或石绿平衡暖色场。自然肤色须纳入同一调色方案，不要另立美肤色彩体系。避免彩虹色、霓虹饱和度、青橙调色、均一米色、浑浊褐色单色调和日本锦绘的色块逻辑。
    - 平面画幅必须主导第一印象，缩略图尺寸下也一样。将成年人、家具、帘幕和建筑安排成与绢面平行的二至四条浅层、叠置、重叠的带状区域。身体的解剖关系保持连贯，但以剪影、衣物轮廓和封闭的固有色色形承载形体；不得呈现雕塑感、电影感或三维感。
    - 使用轮廓封闭的色域和最少的色调塑形。每块皮肤、衣物、墙、地面和家具区域都保持狭窄的明度跨度。衣物和建筑使用两至三种接近的明度；皮肤严格使用三种边界明确的色调，呈现成熟人物的个体特征。让薄胭脂罩染、狭窄衣边罩染或克制的颏下线染暗示转折，而不形成圆润体积。不得使用体积光影塑形、投影、聚光灯衰减、皮肤亮泽高光、深远暗部、大气透视或真实光线包裹身体的效果。
    - 躯干与主要肢体应大致平行或微斜于画面。避免强烈透视缩短、极低或极高视角、戏剧性纵深退缩，以及朝观者突出的物件。界画家具、窗格、屏风、榻栏和地面边缘建立浅层空间秩序，不汇聚至西方消失点。
    - 使用散点透视、斜向或略高的观看位置，以及有序的浅层重叠平面。仅通过叠置、建筑框架、织物重叠和绢地留白建立足以说明位置的纵深。不得以尺度递减或单一西方消失点制造幻真房间。让规整家具和窗格几何稳定成年人弯曲的形体，同时仍明显与绘画表面平行。
    - 优先使用近方形或横向册页；适合主题时，偶尔采用竖幅、扇面或类似手卷的横向片段。构图包含一处前景线索、占主导的中景成人互动，以及疏简的建筑或园林背景。保留有意义的空白绢地或安静墙面，使装饰不压过人物。
    - 不采用电影照明、景深、散景、摄影写实、戏剧性轮廓光、体积光或现代调色。边界明确的固有色、浅色绢地留白和克制罩染表达时刻；灯、烛、月或窗是绘画母题，不带定向投影、光晕衰减、反射光或大气纵深。
    - 不得生成可读汉字、伪书法、诗、说明文字、对话气泡、标题、签名、画家姓名、画坊名称、年款或仿题跋。题签必须留白。至多一至两枚小而褪色的抽象朱红收藏印形可接触画面下缘；不得含有可辨认或模拟的文字，也不得与脸、身体或界定内容的动作重叠。
    - 作品呈现匿名晚明江南画坊册页的面貌。
    - 岁月痕迹必须在第一眼及缩略图尺寸下可见。使作品看起来受到细心保存，却明确是一张古老册页；绘画与工笔技法约贡献三分之二的印象，可见的材料老化贡献三分之一。人物与线描保持清晰，但在细看之前，暖绢底、颜料状态、边缘磨损和经手历史就必须显现。
    - 除整体底面的老化结构外，每个主题和画面还必须包含三至五处局部且物理合理的岁月线索：
    - '- 在留白区域清晰可见的绢经纬纹、纸纤维、装裱接缝或轻微折痕；'
    - '- 石青或石绿在受保护的凹处仍如宝石，而暴露颗粒呈可见粉化或少量脱落；'
    - '- 胭脂、藤黄或浅有机染料比烟墨、朱砂、矿物绿或受保护的织物颜色自然褪色更多；'
    - '- 远离面部和界定内容的接触处，出现少许柔化的外侧墨线、颜料剥片、磨损绢纤维或轻微经手磨光；以及'
    - '- 一枚暗淡收藏印形或空白题签接触画面下缘，而不形成环绕留边。'
    - 老化必须符合暴露、经手、折叠、颜料化学和装裱构造的规律。保护脸、手、解剖结构、视线、衣物结构及界定内容的互动，避免严重损伤。重要轮廓保持清晰墨线，遮护区域保留更浓的矿物色。
    - 不得施加全局棕褐滤镜、黄罩、灰色去饱和、摄影颗粒、遍布全图的刮痕、暗角、褪色胶片效果、烧焦边缘、严重褐斑、霉菌、大面积水渍、密集虫孔、夸张撕裂、皮肤上的伪龟裂、人工墨晕或笼统污垢。不得让册页看起来像被遗弃、出土、烧灼或经过数字做旧。
    - 每个主题必须确立：
    - '- 精确的晚明年份、江南地点、季节、时刻和私密社会环境；'
    - '- 严格一致、反复出现的成年人阵容，身份、关系、成熟外貌、头发和衣着稳定；'
    - '- 由当前可见动作和相互自主性证实的所选内容级别；'
    - '- 一套从画面左至右连贯的人体位置图，具有可信支撑、接触几何、伸展范围、遮挡和肢体归属；'
    - '- 一种近方形、横向、竖向、扇页或手卷片段构图；'
    - '- 一套工笔线条层次和一种界画建筑结构；'
    - '- 一个第一眼即显平面的画幅方案，采用二至四条浅层叠置带及轮廓封闭的色域；'
    - '- 一套五至七个色系的矿物色调色方案，具有分层罩染表现；'
    - '- 一处克制的当下叙事痕迹及至多两个象征母题；'
    - '- 少量晚明家具、织物及功能物件；以及'
    - '- 一套覆盖整体画面的无边框古旧绢地结构，加上三至五处局部颜料、墨、纤维或经手线索。'
    - 变化阶层环境、城市、房间功能、季节、关系、姿态、衣着状态、织物纹样、家具、前景线索、象征母题、画幅形式、观看高度、主要对角线、主色锚点、冷色点缀、留白形状和老化模式。各主题之间不得重复同一卧房、榻上姿势、洒茶手法、牡丹象征、色彩层次或家具布局。
  frames:
    common:
    - 成果是在熟绢上绘制的历史册页画。它不是真人实拍、摄影、电影剧照、西方油画、日本浮世绘、现代插画、动漫、计算机生成图像、游戏美术、博物馆陈列，也不是装框艺术品的照片。
    - 从正面将生成图像定义为手绘古绢册页的平面档案摹本。古旧熟绢画面连续延伸至画布的每一条边，构成一张不中断的画面。周围没有桌面、墙壁、玻璃、画框、博物馆展柜、书籍模型或文物的立体展示。
    - 每个人物、衣物、物件和建筑平面都只以绢上的墨线轮廓与颜料存在。同一套可见的绢织纹、老化色调和浅微表面起伏，在留白和薄色罩染下连续延伸，使人物与环境统一在同一个实体画面上。成年人是具有个体特征的工笔肖像，成熟面部线条各有差别，成人比例可信、关节结构明确、姿态有支撑，而每一笔都仍明显是绢上的墨或矿物色。
    - 将雨、植物、家具、织物、皮肤、头发及亲密接触描述为勾画的轮廓与绘制的色形。不得要求毛孔、镜面高光、写实反射、自然主义照明、电影氛围、光学对焦或物理渲染材质。文物的绢织纹与颜料颗粒感始终是主导的表面实质。
    - 古旧熟绢画面连续延伸至画布的每一条边，绘制的建筑、留白绢地、衣物形状、枝叶或裁切的物件自然触及并越出图像边界。不得出现可见的装裱留边、卡纸、画框、边框或矩形边带。
    - 保持岁月痕迹可见，但不要勾出画面边框。边缘旧痕必须断续、变化并不规则地向内消散：一角可露出磨损的绢纤维，一侧局部可带茶褐色氧化痕，另一边可保留较洁净的暖象牙色绢地。绝不能将这些痕迹连接为连续矩形、画面内轮廓、均匀着色的边缘围框、装饰线或空白纸质围边。
    - 互动保持温暖，每个人物通过手、姿态、目光和身体朝向，可见地主动发起、引导、回应或调整共同动作。
    - 赋予每个人物独立意图和可见的参与，避免一名主动者搭配一具装饰性身体。出现女性时，通过她的目光、手的位置、姿态、对衣物的控制和回应展现欲望与判断。不同性别的人物具有多样的社会角色。
    - 使用一处正在发生的小型叙事痕迹，使画面具有生活感：落下的发簪、渐冷的香、折到一半的信、移位的屏风、洒出的茶、尚未完成的绣架、松开的床帘、搁置的乐器、飘入格窗的雨，或遗在榻边的便鞋。痕迹必须辅助成年人的动作，不得变成滑稽奇观或引入未要求的旁观者。
    - 主题或画面中提及的每个人都必须属于所要求的人物阵容，并且在画中可见。不得将不在场的配偶、主人、仆人、宾客、顾客、官员、观看者或其他画外人物作为背景故事、动机、暗示的见证者或信件收件人引入。私密情境须在所描绘的成年人之间自成完整。
    - 将晚明丝绸、纱、锦、棉布与绣边作为主要图形结构。描述每个成年人的外层、内层、腰带、纹样、色系及衣着状态。以衣褶说明重力、重量、伸展范围和动作，而不是遮掩所选内容级别。
    - 保持人体解剖比例恰当、物理关系连贯。不得模仿其他情色传统中的器官放大、强烈透视缩短或怪诞夸张。使用成熟的椭圆脸、方脸、长脸和圆脸，多样体格，自然关节活动范围，以及各具特征的手、脚、发际线和表情。避免娃娃脸、千篇一律的美人、儿童比例、不可能的柔韧度和通用招贴美人姿势。
    - 人物的具体特征来自线描与有边界的罩染，绝非光学写实。为每个成年人绘制有个体差异的成熟肖像，具有具体面部骨骼、细微面部不对称、不等的眼睑褶、不同的眉、鼻翼、唇形、下颌、发际线、耳、手指、甲床，以及符合年龄的表情。成果应令人信服地具有人性，却明确是绘画。
    - 在每块轮廓封闭的皮肤形状内，严格使用三种克制肤色：蛤粉白或淡赭底色，在脸颊、关节、掌心和接触部位施一层透明暖肉色罩染，再在下颌或重叠肢体下施一道狭窄的较深线染。过渡须明显有笔触且边界明确，绝不光亮、喷绘化、连续明暗化或带冷色高光。
    - 使用可信的成年人肩、胸廓、腹、骨盆、膝、手和足比例。通过轮廓重叠、屈曲关节几何、坐垫变形、衣物张力和手的位置表达支撑，而不是写实皮肤凹陷、肌肉渲染或雕塑体积。保留画出的细小不对称，不要将每个人物修平为理想化图示。
    - 表情通过专注的墨绘眼睛、不对称嘴部轮廓、淡胭脂颊染和有意安排的手位，传达成年人的关注及相互回应。所有赋予人物真实人性的细节都须从属于连续绢面、平面剪影与精细工笔线。
    - 添加装饰前，先把每个画面构建为一套空间上成立的布局。确立画面左侧、中央、右侧，以及前景、中景和背景。说明每个成年人的躯干与骨盆方向、脸的转向、主要支撑面、次要支撑肢体和可见的手部任务，后文不得与这些位置矛盾。
    - 对亲密或露骨接触，成年人所在的高度、距离、骨盆角度、关节活动范围和接触轴线必须相容。每个重心都必须落在可信支撑之上，例如床台、榻、凳、地面、墙、垫子，或自身支撑明确的另一位成年人。帘幕、松散袍服、屏风、扇、灯及纤巧桌案不能承受成人重量。
    - 保持每个身体独立且可追踪：每名成年人有一个头、两臂、两手、两腿和两足。身体重叠时，按所属人物和解剖左右侧标明手。每条可见肢体都必须从肩或髋连续延伸至末端。袍服围绕身体包裹、垂落、堆聚和压缩，而非穿过身体；坐垫与寝具在实际重量下变形，硬木框架则保持刚性。
    - 局部遮挡下的身体延续仍然明显，不出现无支撑身体、解剖穿插、反向关节、不可能的脊柱扭转、多余肢体、断开的手或矛盾左右方向；肢体归属与接触几何不藏在装饰家具后。
    - 使用受控的中国工笔线条，轮廓连续并体现运笔压力变化。在这张册页中，纤细如发的反复笔触也用于描绘眉、睫毛、散发、叶脉和雕刻细节。
    - 轮廓线粗细须有变化而克制。脸、手指、脚趾、衣物开口和界定内容的接触，在近看时必须保持精确。以界画的规整线法描绘床架、屏风、桌案、格窗、砖地和建筑边缘。曲线与直边须干净衔接，又不显得像矢量图般僵硬无生气。
    - 不得使用浮世绘主版轮廓、漫画勾墨、书法式泼洒痕迹、枯笔表现主义、以没骨花卉画为主的方法、徒手写意、水墨抽象、西方排线、喷绘边缘或数字线稿的均一性。
    - 使用三矾九染的视觉逻辑：反复透明施胶、染色和分层罩染，形成明润而受控的表面。将精确的固有色填涂与连续薄罩染结合。面部和身体保持在狭窄明度范围内，仅作最少的色调塑形：严格使用三种克制肤色，加上精细轮廓细节。采用浅底、一层透明暖肉色罩染和一道狭窄的重叠处线染。不得以连续渐变、冷色逆光、投影、明暗法、亮泽高光或西方体积渲染使形体圆雕化。
    - 保留矿物颜料的物质感。受保护的细节中，石青和石绿可略呈颗粒状且不透明；朱砂与胭脂保持温暖而克制；藤黄、赭石、花青、烟墨和浅蛤粉白补全层次。金粉或金线只能作为首饰、家具配件、织物或装裱细节上的小面积华贵点缀。
    - 每个主题和画面都必须明确列出由五至七个主要色系组成的晚明工笔矿物色调色方案：
    - '- 古旧暖象牙色或淡茶色的熟绢底；'
    - '- 以烟墨、焦墨或深蓝黑为线条主色；'
    - '- 一至两种暖色，如胭脂、朱砂、赭石、柿色或藤黄；'
    - '- 一至两种冷色，如石青、石绿、花青或柔和蓝绿；'
    - '- 一种安静的织物中性色，如藕荷、月白、秋香黄、檀褐或柔和靛青；以及'
    - '- 至多一种克制的蛤粉白或金粉点缀。'
    - 让暖色绢底占据最大的连续区域。将胭脂、朱砂和赭石集中于衣物、帘幕、嘴唇、脸颊和选定物件；少量使用石青或石绿平衡暖色场。自然肤色须纳入同一调色方案，不要另立美肤色彩体系。避免彩虹色、霓虹饱和度、青橙调色、均一米色、浑浊褐色单色调和日本锦绘的色块逻辑。
    - 平面画幅必须主导第一印象，缩略图尺寸下也一样。将成年人、家具、帘幕和建筑安排成与绢面平行的二至四条浅层、叠置、重叠的带状区域。身体的解剖关系保持连贯，但以剪影、衣物轮廓和封闭的固有色色形承载形体；不得呈现雕塑感、电影感或三维感。
    - 使用轮廓封闭的色域和最少的色调塑形。每块皮肤、衣物、墙、地面和家具区域都保持狭窄的明度跨度。衣物和建筑使用两至三种接近的明度；皮肤严格使用三种边界明确的色调，呈现成熟人物的个体特征。让薄胭脂罩染、狭窄衣边罩染或克制的颏下线染暗示转折，而不形成圆润体积。不得使用体积光影塑形、投影、聚光灯衰减、皮肤亮泽高光、深远暗部、大气透视或真实光线包裹身体的效果。
    - 躯干与主要肢体应大致平行或微斜于画面。避免强烈透视缩短、极低或极高视角、戏剧性纵深退缩，以及朝观者突出的物件。界画家具、窗格、屏风、榻栏和地面边缘建立浅层空间秩序，不汇聚至西方消失点。
    - 熟绢表面必须在留白和薄罩染中保持可见的连续性。空白墙、天、地及帘幕区域应读作承载绘画形状的古旧绢地，而非具有实体纵深的房间；第一印象始终是平面工笔画。
    - 使用散点透视、斜向或略高的观看位置，以及有序的浅层重叠平面。仅通过叠置、建筑框架、织物重叠和绢地留白建立足以说明位置的纵深。不得以尺度递减或单一西方消失点制造幻真房间。让规整家具和窗格几何稳定成年人弯曲的形体，同时仍明显与绘画表面平行。
    - 不采用电影照明、景深、散景、摄影写实、戏剧性轮廓光、体积光或现代调色。边界明确的固有色、浅色绢地留白和克制罩染表达时刻；灯、烛、月或窗是绘画母题，不带定向投影、光晕衰减、反射光或大气纵深。
    - 每个画面至多使用一至两个象征母题。合适的选择包括成对莲花、鸳鸯、成双蝴蝶、牡丹、海棠、石榴、葡萄、游鱼、涟漪、竹、梅花、半开帘幕、斜倚花枝或落下的发饰。象征丰富情绪和构图，但绝不能代替可见的人物动作。
    - 只选择少量功能物件：铜镜、香炉、烛台、团扇、青花瓷、漆盒、茶碗、酒壶、琴或琵琶、乐谱、书、花笺、玉佩、梳、簪、绣鞋、腰带、衣架或绣绷。每件物品必须有可信的尺度、支撑、位置和叙事作用。避免将画面变成古董清单。
    - 不得生成可读汉字、伪书法、诗、说明文字、对话气泡、标题、签名、画家姓名、画坊名称、年款或仿题跋。题签必须留白。至多一至两枚小而褪色的抽象朱红收藏印形可接触画面下缘；不得含有可辨认或模拟的文字，也不得与脸、身体或界定内容的动作重叠。
    - 作品呈现匿名晚明江南画坊册页的面貌。
    - 岁月痕迹必须在第一眼及缩略图尺寸下可见。使作品看起来受到细心保存，却明确是一张古老册页；绘画与工笔技法约贡献三分之二的印象，可见的材料老化贡献三分之一。人物与线描保持清晰，但在细看之前，暖绢底、颜料状态、边缘磨损和经手历史就必须显现。
    - 为每个画面安排一套整体底面尺度的老化结构：留白墙面、地面、天空及空白区域遍布明显不均匀的暖茶色绢地；一处断续的深茶褐边缘氧化斑从部分画缘向内消散；一角轻微磨损；一道浅旧折痕仅穿过空白绢地或建筑。受保护的矿物色须明显比暴露的外侧颜料浓郁。这套结构属于满幅出血的绢画表面，不是独立画框、装裱边、桌面、画廊陈列或摄影叠层。
    - 除整体底面的老化结构外，每个主题和画面还必须包含三至五处局部且物理合理的岁月线索：
    - '- 在留白区域清晰可见的绢经纬纹、纸纤维、装裱接缝或轻微折痕；'
    - '- 石青或石绿在受保护的凹处仍如宝石，而暴露颗粒呈可见粉化或少量脱落；'
    - '- 胭脂、藤黄或浅有机染料比烟墨、朱砂、矿物绿或受保护的织物颜色自然褪色更多；'
    - '- 远离面部和界定内容的接触处，出现少许柔化的外侧墨线、颜料剥片、磨损绢纤维或轻微经手磨光；以及'
    - '- 一枚暗淡收藏印形或空白题签接触画面下缘，而不形成环绕留边。'
    - 老化必须符合暴露、经手、折叠、颜料化学和装裱构造的规律。保护脸、手、解剖结构、视线、衣物结构及界定内容的互动，避免严重损伤。重要轮廓保持清晰墨线，遮护区域保留更浓的矿物色。
    - 不得施加全局棕褐滤镜、黄罩、灰色去饱和、摄影颗粒、遍布全图的刮痕、暗角、褪色胶片效果、烧焦边缘、严重褐斑、霉菌、大面积水渍、密集虫孔、夸张撕裂、皮肤上的伪龟裂、人工墨晕或笼统污垢。不得让册页看起来像被遗弃、出土、烧灼或经过数字做旧。
    - 每个画面都是同一主题下的一幅独立晚明工笔秘戏图册页设计，不是故事板、序列、拼贴、分屏、接触印样、多格漫画、装框博物馆物件或画作照片。
    - 满画布呈现手绘古旧晚明江南工笔秘戏图册页的平面档案摹本。熟绢形成不中断、不均匀的暖茶色底，连续延伸至每条画布边缘。人物、衣物、物件和建筑只以同一绢面上的墨线与颜料存在。
    - 人物具有个体化的成熟面部线条、可信比例、清晰关节和恰好三种有边界的肤色。平面剪影和轮廓封闭色域主导浅层空间，不使用体积明暗或投影。细游丝线、铁线轮廓、薄层矿物罩染、界画室内、可见绢织纹、柔化的外缘颜料、一处独立边缘的磨损纤维和细小旧折痕共同构成画面。
    - 每个人物在画面左、中、右及前、中、背景中的位置明确，躯干与骨盆方向、支撑面、次要支撑肢体和手部任务相容。当前行为、衣着状态、接触几何及相互回应直接可见，不以内容级别标签替代画面。
    - 每幅画面保留精确日期、地点、季节、时刻、私密情境、完整阵容、成熟面部差别、细微不对称、晚明发式、衣着、表情和视线。
    - 画帧采用三条浅层叠置带，结合前景线索、不超过三件物件、一个象征母题、绢地留白与规整建筑；五至七个色系、三种有边界肤色、线条层次与分层罩染彼此协调。
    - 满幅暖茶色绢地具有一处断续不对称边缘氧化斑、一处磨损角、一道旧折痕和恰好三处局部颜料、墨或纤维变化；各自独立的边缘痕迹分别向内消散，不构成边框。
    - 每个画面独立完整，保持主题的身份、关系、环境、家具锚点、媒介、调色逻辑及所选级别；变化人体几何、衣物节奏、观看高度、裁切、重叠、前景线索、留白形状、象征点缀和色彩重点，而非只换姓名、颜色或道具。
    - 第一印象是精细线描与矿物色构成的平面晚明工笔绢本册页，其次是具体的成熟私密场景，最后是细心保存的古旧文物；精细线条、层叠色彩、历史秩序与空间清晰度强于装饰或损伤。
