id: hero-erotic-reinterpretation
description: 创作一批以二〇〇二年中国武侠电影《英雄》为分析起点、但在人物、事件、场面和镜头上完全原创的成人情色电影剧照。提取原作的高层电影语法：战国想象中的中国武侠世界、同一事件的多重主观叙述、以红白蓝绿黑组织不同情绪真相、巨大宫殿与空旷自然形成的尺度对比、书法与剑术共享的身体节奏，以及忠诚、欺骗、牺牲和私人欲望之间的冲突。每个
  Theme 必须把这些抽象方法转化为一部从未存在过的原创成人武侠电影中的决定性静帧。
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 所有人物保持完整且不透明的成人武侠服装，通过距离、礼仪、身体方向、剑术调度、眼神和空间压力表现感官张力，不出现裸体或性接触。
    erotic:
      frames:
      - 每幅画面呈现与故事相容的当前亲密接触，不以未完成的解衣动作或事后痕迹替代。
    hardcore:
      shared:
      - 行为是武侠事件的直接结果，呈现单一静态动作、准确阵容、相互回应和可信支撑，不增加人物或画外身体部位。
  themes:
    common:
    - 人物身份、关系、行动目标、地点细节、服装结构、武器设计、当前事件、亲密互动与镜头位置形成独立的武侠情境。
    - 可以使用但不限于以下开放式转译方向：
    - '- 将多重主观叙述转化为彼此不同、互不连续的成人关系真相；'
    - '- 将书法与剑术的共同节奏转化为双方自愿的贴身身体指导；'
    - '- 将宫廷礼仪与刺杀压力转化为私密侧殿中的秘密联盟；'
    - '- 将湖面、荒漠、雨幕、庭院、书馆和巨大殿堂转化为原创地点；'
    - '- 将缴械、包扎、换衣、避雨、练字、试剑或守夜转化为情色接触的直接因果；'
    - '- 将颜色从装饰性滤镜转化为人物关系、服装、建筑、天气、实景光源和材质共同建立的叙事系统。'
    - 主题与各幅画面均呈现二〇〇〇年代初中国单色章节式诗性武侠史诗的影像特征，而非普通古装写实、考古复原、历史电视剧或泛化武侠摄影。
    - 每个 Theme 从红、白、蓝、绿、黑五个核心色彩家族中选择一个主导色。主导色必须占据约三分之二至五分之四的可见画面，并同时控制人物服装、建筑或自然环境、实景光线、空气介质与关键道具；只允许一个受控的次要强调色。不同
      Theme 可以重复同一色彩家族，但必须改变关系动力、空间几何、天气、动作和强调色。不得使用赭石工坊、灰褐废墟、杂色商帐或综合色调逃避单色章节要求。
    - 同一主题的主导色、构图秩序、人物尺度、书法性运动元素、主要材质、实景光源与院线胶片效果稳定统一。
    - 使用请求指定的准确人物数量，不得增加、删除、替换或复制人物。不得添加群众、士兵、侍从、摄影师、服务人员、镜中人物、画外参与者或没有身体来源的手与身体部位。
    - 人物为外观二十五岁以上的中国成年人，年龄外观、面孔、体型、肤色、发型、服装、配饰、身份、武艺特征和身体标记在主题内稳定；权力、身份、任务与武艺差异通过调度和相互回应表现。
    - 每个 Theme 必须建立一个与其他 Theme 明显不同的原创成人武侠电影世界，包括：
    - '- 明确的战国灵感时代与人物造型；'
    - '- 一个功能、尺度、材质、天气和出入口清楚的中国地点；'
    - '- 完整的请求人物阵容及每个人的身份、外貌与服装锚点；'
    - '- 由目光、距离与相互回应体现的独特人物关系；'
    - '- 一个正在发生、可以直接看见的武侠事件；'
    - '- 一个改变关系平衡的决定性成人亲密瞬间；'
    - '- 一种由色彩、空间、服装、表演、光源、镜头和成片媒介共同证明的原创电影视觉命题。'
    - 每个 Theme 将一种色彩叙事转化为一种不同的成人关系动力。红色可以表现双方主动释放的嫉妒、竞争或欲望；白色可以表现礼仪和克制被共同打破；蓝色可以表现平静表面下的相互试探；绿色可以表现旧日亲密关系被重新确认；黑色可以表现权力空间中的秘密联盟。颜色必须由可见的衣料、墙面、土地、植物、天气、火焰、天光、灯具和材质反射形成，不得只是覆盖全画面的单色滤镜，也不得改用赭石、金色、灰紫或杂色系统削弱五种核心色彩家族。
    - 亲密接触发生在武侠事件之中：书法训练的贴身握腕与身体校正、武器放下后的持续亲吻、私密侧殿中被打破的礼仪、湖边切磋中相互支撑的贴身姿态，或雨中湿透衣料与直接触碰。武侠动作、成人接触、表情与环境构成同一因果明确的当前瞬间。
    - 人物、地点、关系、当前武侠事件与决定性瞬间相互关联；空间几何、色彩关系、主要光源、镜头距离、调度、服装与环境材质共同形成具体电影风格。
    - 地点可为宫殿侧殿、纯色书法馆、竹林平台、空旷沙漠帷帐、镜面静水亭台、雨中轴线庭院、高墙练武场、落叶林间台地和山谷中的纯化行宫。不采用废弃工坊、灰窑、仓房、杂乱商帐、潮湿洞穴、破败民居、锈铁空间或日常器物堆积；亲密互动处于有清楚边界的私密空间。
    - 武器、书写工具、家具与建筑承担相容任务；利刃入鞘、远离接触位置，或由未进行亲密接触的手稳定握持。墨、水、雨、血迹、汗与其他液体具有可见来源并遵循重力。
    - 跨 Theme 轮换五种核心色彩家族、叙事机制、地点功能、人物身份、社会关系、情色动力、武侠活动、服装轮廓、构图系统、镜头语言、主要光源、天气、材质和成片媒介。每个 Theme 都必须保留单色章节、纪念碑式秩序和书法性动作，但不得让整批结果被红衣、飞叶、雨水、纱帘、床榻、拔剑、背光剪影、同一种男女组合或同一种支配关系垄断。
    - 成片为正式院线武侠静帧，不采用海报、广告、分镜表、幕后照、影楼古装照或低成本成人视频截图质感。
  frames:
    common:
    - 每幅画面具有二〇〇〇年代初中国单色章节式诗性武侠史诗的影像特征，而非普通古装写实、考古复原、历史电视剧或泛化武侠摄影。
    - 每个 Frame 必须同时清楚呈现以下七项视觉 DNA 中至少五项：
    - 1. 红、白、蓝、绿或黑之一形成压倒性的单色章节，颜色存在于真实衣料、墙面、植物、天空、水体、沙地、纸张、漆器或光线中，而不是后期滤镜；
    - 2. 纪念碑式轴线、严格对称、重复柱列、巨大留白或水平镜像构图，使人物与宏大空间形成清楚比例；
    - 3. 人物调度具有仪式性的静止、克制和精确距离，情色接触成为打破秩序的唯一动作焦点；
    - 4. 剑、书法笔势、长袖、帷幔、雨线、水纹、落叶、沙尘或发丝形成一条清楚的书法性运动轨迹，但人物身体保持单一可读状态；
    - 5. 丝、麻、漆木、竹、纸、墨、水、石或金属使用少量而高度纯化的材质关系，不出现杂乱生活道具；
    - 6. 大远景的史诗尺度与近距离的面孔、手、衣料和皮肤触感形成强烈对照，即使单个 Frame 只选择其中一个距离，也必须暗示另一尺度；
    - 7. 成片具有洁净、饱和、层次分明的院线胶片质感，色彩分离明确，高光克制，阴影有密度，皮肤真实，不使用粗粝脏污、灰雾去饱和或低成本电视剧质感。
    - 红、白、蓝、绿或黑占画面约三分之二至五分之四，统一衣料、建筑或自然环境、实景光线、空气介质与关键道具，仅有一种次要强调色。轴线、对称、柱列、镜面水平线或巨大留白形成纪念碑式构图，人物与当前完成态动作清楚。
    - 使用请求指定的准确人物数量，不得增加、删除、替换或复制人物。不得添加群众、士兵、侍从、摄影师、服务人员、镜中人物、画外参与者或没有身体来源的手与身体部位。
    - 人物为外观二十五岁以上的中国成年人，年龄外观、面孔、体型、肤色、发型、服装、配饰、身份、武艺特征和身体标记在主题内稳定；权力、身份、任务与武艺差异通过调度和相互回应表现。
    - 同一主题的各幅画面是独立平行静帧，不构成连续剧情、动作步骤或真相揭晓顺序；衣着、武器、伤痕、液体、姿势和接触均为各幅当前状态。
    - 人物身份、地点功能、服装逻辑、关系动力和至少五项视觉 DNA 在同一 Theme 中保持稳定。每个 Frame 必须从零建立一个完成态的独立方案，服装覆盖状态、武器位置、姿势与情色强度在该 Frame
      内自行成立，不得比另一个 Frame 更早或更晚。每个 Frame 在决定性动作、人物调度、身体接触、取景距离、观察方向、前景关系或书法性运动元素上形成明显不同的方案。只改变调色、镜头裁切、衣物脱落程度或形容词不构成有效差异。
    - 每幅图像只有一个物理成立的瞬间，时代、具体地点、当前事件、人物成熟外貌、发型、衣着、姿态、视线、表情与回应均可辨。武侠动作、身体接触及直接形变与环境层次、镜头位置、焦段、景深、主要光源和成片质感相互配合。
    - 让每个 Frame 具有完整院线武侠长片的尺度。优先使用巨大的轴线宫殿、空旷侧殿、重复柱列庭院、纯色书法馆、镜面静水亭台、单色竹林、被风塑造的沙漠、被落叶覆盖的林间平台、纯化帷幔室或高墙围合的练武场。使用可信的庭院与室内边界、极少而精确的陈设、符合时代想象的服装与器物、明确的前景—动作层—背景关系、受控遮挡、动机清楚的实景光源和塑造人物关系的调度。近景也必须通过门框、柱列、帷幕、书案、窗格、远处庭院、天气或自然元素暗示更大的世界。
    - 武器、书写工具、家具与建筑承担相容任务；利刃入鞘、远离接触位置，或由未进行亲密接触的手稳定握持。墨、水、雨、血迹、汗与其他液体具有可见来源并遵循重力。
    - 相机必须同时服务人物关系、武侠动作和情色接触的可读性。可使用克制广角、标准镜头、肖像距离或横向变形镜头语言，并在不同 Theme 与 Frame 中变化机位高度、人物相对距离、轴线、景深和负空间。避免鱼眼、偷窥视角、监控画面、任意荷兰角、严重透视畸变、切断关节的裁切、空洞大全景或让关键接触被衣料、武器和前景完全遮挡。
    - 光线必须来自可信的天光、月光、火盆、灯笼、烛台、门窗、雨幕反射或其他可见与可推断来源。明确光线方向、人物与背景分离、阴影密度、高光响应和织物反射。不要把所有画面退化为红蓝霓虹、无来源轮廓光或均匀柔光。
    - 保留真实成年皮肤的毛孔、细毛、汗意、压力痕迹和温度变化，以及丝、麻、皮革、漆木、石材、竹、纸、墨和金属的准确材质反应。避免塑料皮肤、过度磨皮、梦幻泛光、廉价成人视频截图、现代影楼古装照、舞台烟雾堆积和无动机的综合色污染。
    - 每位人物只能出现一个连贯身体实例。所有可见肢体必须能从肩或髋追踪到末端，每只手、脚、嘴和承重肢体只承担一个相容任务。人物位置、躯干方向、骨盆方向、目光目标、接触点和重量支撑必须清楚；身体重量由可信的地面、墙面、床榻、坐榻、书案边缘、柱体或其他固定结构承担。
    - 亲密接触必须处于自然可达范围。服装和武器必须避开决定性接触与承重点，不得穿透身体、悬浮或在同一静态画面中同时处于互相矛盾的穿着状态。镜面、漆面、水面、阴影、帷幕和多重叙述不得生成额外人物、重复身体或第二个动作状态。
    - 不以废弃工坊、灰窑、仓库、粗陶杂物、锈铁废墟、灰褐商帐或肮脏洞穴构成主要视觉身份。成片不是海报、广告、分镜表、幕后照、影楼古装照或低成本成人视频截图。
    - 图像不出现标题、标识、字幕、水印或画内说明文字。
