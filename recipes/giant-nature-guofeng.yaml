id: giant-nature-guofeng
description: 将真实比例的中国成年人物置于花朵、叶片、羽毛、种子、露珠与昆虫都如山川建筑般巨大的自然世界，以正在发生的天气、遭遇、迁徙、避险、互助和探索表现尺度差、人物反应与东方诗性。画面融合中国山水的空间秩序、工笔花鸟的物种观察和当代电影级实体质感，不是普通花园里摆放缩小人物，也不是只靠巨物陈列制造奇观。
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 所有人物完整穿着适合当前天气、地形和行动的服装，互动保持非情色。危险来自自然尺度、天气和动物行为，不呈现血腥伤害、捕食成功或残缺身体。
      frames:
      - 人物的面部、视线、重心、手势和衣物受力共同呈现与当前事件一致的反应，不能只站立观赏或对镜头摆姿势。
  themes:
    common:
    - 严格使用所要求数量的中国成年人物，不增加远处人影、仙童、侍从、军队、雕像、人物倒影或画中人。每个人具有稳定的年龄外貌、体格、发型、服装、随身物件、性格倾向和当前任务。
    - 人物是真实普通尺度的人类，花、叶、羽毛、真菌、果实、种子、露珠和昆虫构成原生的巨物生态。人物不是玩偶、手办、拇指姑娘、仙子或天生微型种族；场景中也没有普通尺度版本与巨型版本并列。
    - 每个主题选择一种主导巨物生态和一个决定性事件。主导对象必须参与承重、遮蔽、阻挡、牵引、弹跳、导流、漂浮、发声、振动或移动，不能只是背景装饰；事件已经发生并迫使每个人作出不同但相互关联的即时反应。
    - 花朵生态可从牡丹、莲、荷、玉兰、芍药、菊、梅、海棠、山茶、紫藤、芙蓉或其他具有明确中国地域与季节依据的植物出发。花瓣可以形成坡面、帷幕、舟、洞檐或坠落的软墙，花蕊成为柱林，花粉形成可见气流；仍保留该物种准确的花形、叶序、纹理和生长连接。
    - 叶片生态可使用荷叶、芭蕉叶、竹叶、梧桐叶、蒲叶、蕨叶、银杏叶或其他具体植物。叶脉像道路与梁架，叶缘积水、卷曲、破口和倾角改变人物路线；叶柄、枝茎与根系连续承重，不让切下的叶片无来源悬浮。
    - 羽毛生态来自一根或少量已经自然脱落的鹤羽、雁羽、孔雀羽、翠鸟羽或其他明确鸟类羽毛。羽轴可作桥脊，羽枝形成透光屏风、风障、峡谷或柔性坡面；羽根、羽轴、羽片和羽枝结构准确，不把羽毛画成树叶、布料、翅膀或无穷复制的装饰林。
    - 昆虫与小动物按同一巨型生态尺度出现，可选择螳螂、蜻蜓、蝉、甲虫、蜜蜂、豆娘、蝴蝶、蛾、萤火虫、蜗牛或青蛙。每只生物具有准确的足、翅、触角、口器、复眼、外骨骼和物种行为，不拟人化穿衣，不增加骑手装备，不无故攻击，也不把多种生物堆成怪兽群。
    - 巨型昆虫遭遇围绕一个清楚行为展开：螳螂转头审视，蜻蜓降落掀起气流，蝉鸣震动叶面，甲虫推开湿泥，蜜蜂采粉造成花粉风，蛾翼扑动遮住月光，萤火虫照亮归路，蜗牛缓慢压弯草茎。人物根据可见行为判断、避让、沟通、利用或帮助，而不是永远尖叫逃跑。
    - 天气是可作用的物理事件。暴雨时人物钻到完整荷叶或芭蕉叶下，一人用肩和双手顶住下垂叶缘，一人踩稳叶脉低处引走积水，其他人收拢衣摆、护住灯火或拉住同伴；风暴中羽毛弯曲挡风，露珠沿叶脉滚落，花瓣被雨压低，所有力向、湿痕、飞沫和衣物贴合与风雨一致。
    - 可构思但不限于：在荷叶下避雷雨、乘落瓣越过浅水、用鹤羽抵御山口强风、沿牡丹花蕊寻找失物、被蜻蜓降落的翼风压低身体、在蝉鸣震颤的树皮上彼此稳住、借萤火虫冷光穿行竹叶夜径、从滚动露珠前救回行囊、帮助甲虫移开阻路果壳、在初雪压弯的梅瓣下取暖。例子只提供因果方式，不作为重复套用的菜单。
    - 为每个主题建立一条完整因果链：季节与天气引发巨物变化，巨物变化改变路径或安全条件，人物采取可见动作，环境留下对应结果，另一人物或生物立刻回应。移除任一环节都会破坏画面逻辑。
    - 人物行动必须具有明确支撑和目的，可奔跑、急停、蹲伏、匍匐穿过叶缘、攀住叶脉、合力抬起花瓣、背靠羽轴抗风、牵手跨越裂隙、伏低躲避翼风、举灯探路、用布条固定行囊、伸手安抚同伴或回头确认生物距离。手脚接触、重心、衣摆、头发和道具方向与受力一致。
    - 每个人获得不同而必要的角色，例如探路者、承重者、观察者、保护者、引导者、记录者、伤员搀扶者或物资守护者。多人形成目光、手势与力的闭合回路，不让任何人只在背景观看，也不让所有人重复相同表情和动作。
    - 情绪来自事件进程并落实在可见身体细节。初遇巨虫可有屏息警觉、后撤半步、抬臂护住同伴和紧盯触角；确认无害后可有眉眼舒展、肩部放松、谨慎伸手和惊喜交换目光；风雨突至可有咬紧牙关、眯眼迎风、张口呼喊和压低重心；进入叶下避雨后可有急促喘息、忍俊不禁、湿发贴颊和如释重负。
    - 惊奇不等于统一张嘴，恐惧不等于僵直尖叫，宁静不等于空洞无表情。变化克制敬畏、孩子般好奇、专注判断、短暂慌乱、互相信任、顽强用力、发现路线的欣喜、脱险后的释然、面对壮景的寂静与对微小生命的体谅；表情强度匹配人物距离和事件危险。
    - 巨物尺度通过至少三类同场证据建立：人物全身与花瓣、叶脉或羽轴并列；露珠大如水囊或池塘；花粉粒、叶面绒毛、羽枝间距、昆虫足节或泥点接近人物身体尺度；弯曲结构对人物重量产生压痕、回弹和阴影。不得只用低机位仰拍或景深虚化假装巨大。
    - 人物与环境保持可信接触：鞋底压低茸毛，手掌抓住叶脉边缘，膝盖使湿花瓣凹陷，雨水沿衣袖滴落，羽枝被身体分开后回弹，昆虫足落地引起尘土或水纹。人物不悬浮、不穿透植物，不站在无承重能力的纤细花蕊或羽枝尖端。
    - 国风来自构图、材质、色彩、服装与自然观，不依赖堆叠灯笼、牌楼、祥云、龙凤和书法。人物可穿经过历史轮廓提炼的交领袍、圆领袍、短褙子、披风、窄袖行装、长裙或便于跋涉的当代东方剪裁；每个主题选择一个连贯时代语汇，不混搭汉唐宋明清服饰。
    - 每个主题选择一种主导视觉谱系：宋画式疏密与留白、工笔花鸟式物种细察、青绿山水式矿物色层次、水墨式雨雾与墨分五色、敦煌式赭石石绿节奏，或当代东方电影摄影对其中一种的实体化转译。只选一种为主，不把所有传统风格同时拼贴。
    - 若采用绘画媒介，人物、植物、羽毛、昆虫和天气都存在于同一绢本、纸本或矿物色体系中；若采用真人实拍式东方奇幻摄影，则使用真实演员、实体巨型布景、仿生生物特效、可触材料、可信光学和一致阴影。不得在同一画面混合真人摄影、动漫角色和纸面古画。
    - 色彩从具体季节和生态提取，使用二至四种主色与一种小面积强调色，例如雨荷的黛青、灰绿、月白与朱砂；秋羽的赭石、枯金、墨黑与石青；夜花的靛青、藕粉、银白与萤火黄。避免无来源霓虹、全画面金光、彩虹饱和与通用青橙电影调色。
    - 光线必须有自然来源和天气逻辑：叶片透下的绿色散射光、花瓣反射的暖色柔光、雨幕后的天光、月光穿过羽枝的条纹、萤火虫近处微光、云隙日光或雪地反光。光线揭示人物表情、巨物纹理、昆虫轮廓和行动路径，不用无来源仙气遮蔽物理关系。
    - 场景具有前景巨物切边、中景人物行动和背景生态延伸三个层次，同时保留一块安静留白供天气或远景呼吸。巨物可以越出画框以暗示延续，但人物当前支撑、危险来源、逃生方向和主要生物身体必须可辨。
    - 每个主题固定季节、时刻、天气、地域生态、主导巨物、昆虫或动物状态、决定性事件、人物身份、衣着、随身物件、角色分工、情绪转折、尺度比、视觉谱系、色板、光源和核心构图关系。
    - 主题之间变化生态物种、天气机制、地形用途、生物行为、人物目标、危险程度、合作方式、情绪温度、服装轮廓、媒介、色板和观看尺度，不只替换花名或昆虫名称。
  frames:
    common:
    - 每幅画面独立完整地呈现同一主题中已经发生的决定性事件，不组成前后连续故事。固定人物身份、巨物物种、季节天气、生物行为、衣着、随身物件、角色分工和因果结果；变化相机方位、景别、前景遮挡、纵深关系、留白、目光线路和受力细节。
    - 严格保留要求的人数与每个人的独立身体。每人只有一个头、一个躯干、两臂两腿，肢体从肩或髋连续连接；手脚、服装和头发不与叶脉、花蕊、羽枝、昆虫足或其他人物融合。
    - 每个人正在做一件与事件直接相关的事，脸、视线、手部任务、脚下支撑、躯干朝向和重心彼此相容。动作已经改变环境或帮助同伴，画面可见压痕、弯曲、拉力、飞沫、花粉流、尘土、水纹或被稳定的物件作为结果。
    - 人物表情必须各不相同且与角色认知一致：先发现危险者更警觉，承重者表现用力，受保护者同时紧张与信任，确认安全者露出克制释然。至少一个清楚的目光或手势把人物彼此连接，另一条目光连接主要昆虫、天气来源或路线。
    - 昆虫或小动物保持准确身体结构、重心和落足点。翅膀运动带来相符的空气、花粉、雨滴或衣物反应；足节压弯植物并投下接触阴影；复眼、触角和口器不变成人脸，不添加怪兽牙齿、额外肢体或恶意红眼。
    - 避雨画面同时显示降雨来源、承雨表面、叶片或羽毛的弯曲、积水与排水方向、人物所在的干湿边界及身体回应。巨大荷叶遮雨时，叶柄和主脉承担重量，叶缘因积水下垂，人物在叶下扶持、导流、护物或彼此靠拢，而不是在晴天举着一片无来源叶子摆姿势。
    - 巨型花朵画面保留花托、花瓣层次、花蕊、叶或茎的连续归属；人物与至少两种可辨植物结构同焦平面并列。花瓣受踩踏、雨压或风吹时出现局部形变，但不变成丝绸床、建筑石板或抽象彩云。
    - 巨型羽毛画面清楚区分羽轴、羽片和羽枝。人物可沿羽轴行走、躲在弯曲羽片背风侧或拨开羽枝观察，但不让羽毛独立飞行、变成完整翅膀、从人物身体长出或承担超出结构能力的重物。
    - 至少使用三项同场尺度证据，其中一项必须是人物身体与巨物结构的直接并列，一项是接触造成的物理结果，另一项是露珠、花粉、茸毛、昆虫足节、泥点或植物气孔等局部细节。人物面孔仍可读，不因大全景完全消失。
    - 全景或环境中景用于建立生态尺度和行动路径；低机位贴近叶面可强化结构高度；略高视角可展示叶脉路线、积水和人物协作；侧向中景可呈现抗风与承重。避免只用人脸特写、昆虫复眼特写、无环境微距、鱼眼畸变或极端景深模糊。
    - 构图借鉴中国山水的可游、可望与层层递进：近处结构引导视线，中段人物动作形成叙事眼，远处以雾、花影、叶海或羽枝延伸尺度。留白是天空、水面、雨雾或未照亮的生态空间，不是空白摄影棚。
    - 人物服装保持完整、连续、适合行动且符合主题选定的时代语汇。湿衣、披风、袍袖、裙摆、腰带和行囊随风雨与动作产生可信重量，不遮住关键表情、手部任务、脚下支撑或同伴间接触。
    - 当前视觉谱系贯彻整幅画面：绘画媒介保留纸绢、线描、设色与笔墨关系；实拍式影像保留皮肤、织物、植物表皮、羽毛和生物特效的实体质感。不得用发光粒子、塑料花、游戏渲染、动漫脸或泛化仙侠特效替代巨物生态。
    - 画面不依赖可读文字、题字、招牌、界面、字幕、图注、边框或水印解释故事。地点、季节、尺度、危险、人物选择和情绪转折都由可见环境、动作、表情和物理结果直接表达。
requirements:
  content_levels:
  - aesthetic
