id: giant-nature-guofeng
description: 创作具有统一东方古装奇谭风格的原创真人彩色胶片电影静帧，以胡金铨式高层空间语法、东方山水留白和工笔花鸟般的物种观察为视觉骨架；所有 Theme 与 Frame 省略人物国籍、场景国家和具体地点，不得补写或推断地理身份。来自正常古代人类世界的成年游历者进入整体尺度属于巨人国的自然国度：他们相对于此地只有手指大小，花蕊是森林，叶脉是山脊，露珠是湖泊，羽轴是长岭，昆虫如移动城楼。每个主题以一种形态优美、结构明确的巨型自然物和一项清楚可见的风雅互动为审美中心；人物随身衣物、琴箫、酒茶器、书卷、斗笠、入鞘兵器和行囊与身体同比缩小，他们在连续巨型生态中躺、坐、倚、触、垂钓、饮茶、听雨、吟诗、饮酒、抚琴、观云、漫步与休憩。整体气质宁静、清雅、惊奇、含蓄而飘逸，偶有短促自然险情或江湖警觉，但不让追兵、密函、打斗和任务叙事主导画面。
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 所有人物完整穿着适合当前天气、地形和活动的架空明代古装，互动保持非情色。主体行为是游历、赏景、雅集、休憩、互助或应对自然变化；入鞘兵器只是江湖身份点缀，极少量短促避让或轻功不得压过巨物与人物的风雅互动，不呈现血腥伤害、捕食成功或残缺身体。
      frames:
      - 人物的面部、视线、重心、手势和衣物受力共同呈现与当前事件一致的反应，不能只站立观赏或对镜头摆姿势。
      - 每幅画面的首句直接从“古风巨物美学世界”及季节、时刻、天气和巨物生态开始，不添加人物国籍、所在国家、行政地域、地理方位或具体地名；古风属性只由可见造型和环境表达。
  themes:
    common:
    - 严格使用所要求数量的成年古代人物，不增加远处人影、仙童、侍从、军队、雕像、人物倒影或画中人。每个人具有稳定的年龄外貌、体格、古代发式、完整服装、随身物件、游历身份、性格倾向和当前活动；人物可有江湖来历，但不要求每人承担护送、追踪或对敌任务。
    - 世界采用明代物质语汇与东方古装审美，但不为画面指定或输出国家、国籍、省域、城市、山川名称和具体地理坐标。主题与画面直接以“古风巨物美学世界”开场，人物的东方古代身份只通过发式、服装、器物和礼仪自然呈现。
    - 人物来自正常古风人类世界，已经跨入巨人国般的自然国度。入口或记忆中的人类世界可以有驿道、客栈、寺院、古桥与关隘；进入之后，背景优先是花蕊林、叶脉岭、根系峡谷、花瓣坡、菌伞原、种壳洞、露珠湖、羽枝谷、竹叶天幕、荷塘海与昆虫迁徙道。不能让普通尺度驿亭、寺院和道路继续主导巨物国境内的画面，也不把巨物当作科学考察项目。
    - 巨物国境内可以完全没有建筑。若出现本地建筑遗迹，则它也属于巨人尺度：门槛高过人物数倍，瓦片如广场，柱础如山台，人物无法像使用普通客栈一样推门或坐上家具；这种建筑只是可选背景，不暗示必须出现可见巨人居民。
    - 人物是真实正常成人体态的人类访客，但进入此地后相对于巨物国只有一根普通成人手指的长度；每个主题必须直接写出“人物只有手指大小”，不能只用“渺小”“微小”或比例数字代替。人物不是玩偶、手办、拇指姑娘、仙子或天生微型种族，画面也不出现巨人手掌、断手或手指作字面参照；“手指大小”只用于明确观众熟悉的绝对尺度。人物自己的古装、入鞘剑刀、斗笠、灯笼、琴箫、酒茶器、药囊、书卷和布包随人物同比缩小并保持可正常使用，花、叶、羽毛、真菌、果实、种子、露珠、昆虫以及本地遗迹均属于统一的巨人国尺度。
    - 巨物国不是单一巨型道具陈列。主导花叶之外，远近景还须延续同一尺度体系，例如巨茎穿入云雾、花蕊柱林延伸至远处、叶脉道路连接另一片叶海、露珠湖倒映菌伞、羽枝峡谷通向种壳洞、巨型昆虫在花粉荒原留下足迹。不得让一个巨型荷叶孤零零放在普通尺寸树林、驿站或庭院中。
    - 主导自然物达到山体、整片林地、巨大水面或整段山谷的尺度，而不是一件略大于人的道具。人物只有手指大小，完整头脚高度约为六至八厘米，并且只占主导巨物可见连续跨度的约二十分之一至四十分之一；一片叶、一朵花、一根羽毛或一只昆虫本身就是可供穿行的地貌。不要把“手指大小”误写成人物站在手指上或身旁出现巨人的手。
    - 使用巨人国本地的三级尺度链直接对比：人物与自己的人类尺度兵器最小，花粉粒、叶毛、羽枝、种壳纹理、昆虫足痕或露珠等局部结构构成中间层，完整花瓣、叶片、羽毛、菌伞或昆虫身体形成山谷级最大层。普通尺寸古树、庭院和驿站不作为每幅默认中间参照，观者通过同一巨物生态内部的层级就能判断人有多小。
    - 人物与主导巨物处于相同或相近景深和透视层，不把人物放在镜头前景放大、把巨物推到遥远背景缩小，也不使用强制透视制造假比例。人物全身虽小但轮廓、古装颜色、主要动作和头部朝向仍可读；局部情绪通过姿态、衣袂、手势和相互距离辅助表达。
    - 每个主题选择一种主导巨物生态和一个清楚的当前情境，同时说明人物已经身处巨物国境内哪个连续地貌区域，以及他们如何理解或适应这个陌生尺度。主导对象须参与承重、遮蔽、阻挡、牵引、弹跳、导流、漂浮、发声、振动、移动、休憩、观景或交谈，不能只是背景装饰；情境可以是迫使人物反应的突发事件，也可以是人物主动选择并正在享受的安静时刻。
    - 使用“具体巨物主体 + 具体人物互动”的简洁主题骨架。先写清巨物的物种、颜色、完整轮廓、表面结构、弯曲方式、含水状态与当前自然运动，再写每名手指大小人物如何躺、坐、倚、触、扶、饮、听、看或回应同伴。互动必须一眼可读，不能被密函、追兵、机关和多重任务抢走审美中心。
    - 巨物主体既是环境也是可接触空间：宽阔叶面形成天幕或岛屿，半开花冠以层叠花瓣围合柔软谷地，脱落花瓣顺水漂行，卷曲佛焰苞围住肉穗花序，羽片和菌伞形成背风处。人物动作顺着真实曲面、坡度、湿度和承重结构发生，不把植物变成床垫、沙发、布景道具或人为建造的房间。
    - 安静主题优先采用少而准确的动作。可让一名人物侧卧在花瓣内层凹处，以左前臂枕在脸侧，右手搭住自然卷起的花瓣边缘，裙摆沿花瓣曲线铺开；也可盘坐叶脉旁饮茶、倚着花蕊听雨、伏在羽片背风处读卷、坐在佛焰苞内侧轻触高耸肉穗花序，或在漂浮花瓣上躺卧、盘坐和远眺。姿态保持成人骨骼、衣物重量和明确承重点，不做影楼摆拍。
    - 多人闲适主题为每个人安排不同但互相回应的姿态，例如一人侧卧、一人盘坐抚琴、一人靠近花瓣边缘观景；一人轻触花蕊，另一人从花冠开口探身并与她交换柔和笑意；一人举盏听雨，另一人指向叶尖巨滴落入露珠湖形成的水纹。严格服从请求人数，不为复刻例子擅自增加第二或第三人。
    - 巨叶遮雨时，人物可以站在自然下垂或卷曲的叶缘内侧，一手只轻扶身旁已经垂落的局部薄边以保持平衡，另一手持青瓷茶盏、斗笠或油纸灯；整片巨叶的重量由叶柄和主叶脉承担。人物不能用手托起、抬动或改变覆盖山谷的叶片，雨滴从叶尖形成远大于人物的水珠和落水柱。
    - 漂浮花瓣或完整巨叶保持物种可辨的轮廓、叶脉或花脉、自然来源、吃水深度、湿痕和尾涡。人物可侧卧、盘坐、抚琴、饮酒、对谈或观景，但不划桨、不安装船具，也不把花瓣改造成普通小舟；水面和远处同尺度花叶继续证明巨物国生态。
    - 荷塘垂钓主题让手指大小人物坐在完整巨荷叶自然下垂的宽阔边缘或主叶脉附近，双脚、裙摆与钓竿各有清楚位置。细鱼线从与人物同比缩小的竹竿尖端垂入叶下真实水面，浮子、涟漪、游鱼阴影、叶柄和远处荷花共同建立空间；人物不能用鱼线拖动巨型生物，也不把荷叶改造成钓台建筑。
    - 桃花枝漫步主题保留粗大枝干、分枝节点、树皮、花梗、萼片、花瓣和嫩叶的连续植物关系。斜向延伸的枝条形成主要路线，层叠花朵与自然高低差提供停步、回望和观景位置；人物可提小竹篮、持团扇、携酒或互相牵手，但只走在足以承重的枝干和花托附近，不踩在悬空薄花瓣尖端。
    - 巨型茶园休憩主题使用准确茶树嫩枝、椭圆茶叶、锯齿叶缘、主脉和侧脉。人物可在宽阔、近水平且由枝梗承托的叶面铺开与身体同比缩小的竹席，侧卧午睡、倚着自然卷曲叶缘读卷或分享茶点；上方嫩叶筛下晨光与移动叶影，竹席和身体只使局部叶面轻微下陷。
    - 巨竹听雨主题显示粗壮竹秆、连续竹节、节间、分枝与狭长竹叶的正确连接。低垂巨竹叶可形成天然雨篷或宽阔坐面，人物在主脉附近盘坐听雨、煮茶或抚琴，茶炉、壶盏与人物同比缩小；雨水沿叶面汇向叶尖，竹叶由枝条承重并随风弹动，人物不坐在无支撑的叶尖，也不把普通竹叶画成荷叶轮廓。
    - 菌伞生态准确区分上方伞盖表面、下方菌褶、伞柄与菌丝根系。雨水落在伞盖上表面并沿弧面流向伞缘，菌褶位于下方背雨侧，不写成承接天雨的露天沟渠；人物若在伞盖上活动，只看见表皮、湿痕和伞缘，若在伞下避雨才看见头顶放射菌褶。不能把人物、棋盘同时放在伞盖上方却又让脚边出现菌褶峡谷。
    - 日常生活场景让人与天气共同塑造气氛：夏日晴空和微风适合垂钓、漫步与团扇轻摇，清晨斜光适合茶叶上铺席午睡，连绵细雨适合竹叶下听雨煮茶，黄昏暖光适合花间饮酒和抚琴。人物的发丝、衣摆、鱼线、茶烟、花枝、叶影和雨滴依同一风向产生幅度不同的动态。
    - 佛焰苞、莲花、玉兰、芍药、牡丹等围合型花朵要准确区分结构。马蹄莲等天南星科植物表现卷曲佛焰苞包围肉穗花序，不误写成普通层叠花瓣与花蕊；莲、芍药和牡丹保留各自花瓣层次、花托和花蕊关系，人物触碰只影响手边局部表面。
    - 花朵生态可从牡丹、莲、荷、玉兰、芍药、菊、梅、海棠、山茶、紫藤、芙蓉或其他符合当前季节的东方植物出发。单片花瓣长过数座亭阁并形成山坡、帷幕、舟、洞檐或坠落的软墙，单根花蕊高过人物数倍并组成柱林，花粉粒可接近头颅或斗笠大小；完整花朵或花序仍保留花托、花瓣、花蕊与枝茎的连续关系。
    - 叶片生态可使用荷叶、芭蕉叶、竹叶、梧桐叶、蒲叶、蕨叶、银杏叶或其他具体植物。一片叶可覆盖整座院落，主叶脉宽如古桥或官道，次级叶脉形成高过人物的梁脊，叶缘积水、卷曲、破口和倾角改变路线；叶柄、枝茎与根系连续承重，不让切下的叶片无来源悬浮。
    - 植物、昆虫、鸟类羽毛与服装采用准确、常用的规范中文名称，不拼接或臆造物种名、衣物名和身体特征。芭蕉叶就是芭蕉叶，萤火虫就是萤火虫；不能把相近字、古字或陌生偏旁替换进名称。
    - 开花结构使用准确植物学常用词：紫藤表现为沿总状花序下垂的蝶形花，蒲公英表现为头状花序成熟后的瘦果与冠毛，马蹄莲表现为佛焰苞与肉穗花序，桃花、玉兰、莲、牡丹分别保留自身花梗、萼片、花托、花瓣和花蕊关系。不能把所有花簇统称“花冠”，也不把总状花序、种子穹顶或佛焰苞误写成层叠花瓣。
    - 羽毛生态来自一根或少量已经自然脱落的鹤羽、雁羽、孔雀羽、翠鸟羽或其他明确鸟类羽毛。羽轴粗如廊桥或城墙脊，完整长度横跨山口或庭院，单束羽枝高过人物并形成透光屏风、风障、峡谷或柔性坡面；羽根、羽轴、羽片和羽枝结构准确，不把羽毛画成树叶、布料、翅膀或无穷复制的装饰林。
    - 昆虫与小动物按同一巨型生态尺度出现，可选择螳螂、蜻蜓、蝉、甲虫、蜜蜂、豆娘、蝴蝶、蛾、萤火虫、蜗牛或青蛙。昆虫躯干可如客栈、城门楼或渡船般庞大，一节足高过人物，一片翅能遮住院落，落足产生池塘般水纹或深过鞋面的泥坑；每只生物具有准确的足、翅、触角、口器、复眼、外骨骼和物种行为，不拟人化穿衣，不增加骑手装备，不无故攻击，也不把多种生物堆成怪兽群。
    - 巨物国中的植物、昆虫、露珠和自然结构统一属于巨物国尺度，不使用“普通尺度的巨型昆虫”“普通大小但相对巨大”或类似自相矛盾的说法。应直接写“巨物国尺度的成年萤火虫、豆娘或甲虫”，再用足节、翅宽、身体与六至八厘米人物的直接并列证明大小。
    - 物种特征在主题与全部画面中保持准确一致：昆虫均有六足，蜻蜓和豆娘有两对翅及短小触角，蝴蝶与蛾保留鳞翅，甲虫前翅形成鞘翅；荷叶具有盾状连接、放射叶脉和完整平滑的叶缘。不能先写四足后写六足，也不能为增强奇观添加物种本来没有的长触角、牙齿、锯齿叶缘或额外翅膀。
    - 昆虫在每幅画面只能处于一种一致运动状态：飞行时翅膀振动、足部离开承重面并自然收拢；降落时说明足部接触顺序与翅膀减速；停栖时六足落在同一可承重表面，翅膀静置、收拢或仅轻颤。不得写成“正在掠过却六足同时落地”，也不能让翅膀高速飞行与稳定站立同时发生。
    - 巨型昆虫遭遇围绕一个清楚行为展开：螳螂转头审视，蜻蜓降落掀起气流，蝉鸣震动叶面，甲虫推开湿泥，蜜蜂采粉造成花粉风，蛾翼扑动遮住月光，萤火虫照亮归路，蜗牛缓慢压弯草茎。人物根据可见行为判断、避让、沟通、利用或帮助，而不是永远尖叫逃跑。
    - 天气是可作用的物理事件。暴雨时人物钻入荷叶或芭蕉叶覆盖整座驿亭的巨大阴影下，沿高如堤岸的叶脉躲避水流，在局部裂口用剑鞘、木楔或绳索改变一股支流并护住灯火；人物不能用肩膀或双手顶起整片叶缘。风暴中羽毛整体弯曲挡风，露珠沿叶脉滚落，花瓣被雨压低，所有力向、湿痕、飞沫和衣物贴合与风雨一致。
    - 可构思但不限于：完整巨叶如岛屿漂在江中，人物卧看云天；巨荷叶边垂钓，鱼线穿过叶下倒影；桃花枝上提篮持扇漫步；茶叶上铺席午睡；竹叶下听雨煮茶；半开花冠中侧卧、抚琴或联句；羽轴背风处展卷；露珠湖边洗剑；萤火虫迁徙时提灯相送；突来翼风使人物按住斗笠并相视而笑。例子只提供统一气质和因果方式，不作为固定菜单。
    - 不让巨物相遇默认成为挡路、暴雨、抢救、追踪和对峙。优先表现只有手指大小的古代人物在花冠中听雨、倚着花蕊吟诗联句、花粉轻落时饮酒、乘花瓣缓慢漂水、在巨大荷叶下对弈、靠着羽轴吹箫、借羽毛阴影午睡、在菌伞下展卷或侧卧于半开花朵围合的内层曲面，以风雅、温柔、诙谐、宁静和惊喜建立统一古装奇谭气质。
    - 雅集与独处必须具有具体可拍的古风动作，不只把“吟诗作对、喝酒弹琴”写成抽象标签。吟诗者可迎风持杯、抬手指向云外花冠、缓步击节或仰首念句，听者侧耳含笑、以杯沿轻叩节拍或接续下一句；饮酒者解下葫芦、斟入小盏、举杯邀月、与同伴碰盏或醉卧花瓣；抚琴者把普通人用尺度的七弦古琴横放膝前或安置在平稳花瓣凹处，一手按弦一手拨弦，听者倚叶脉而坐；吹箫、吹笛、弹琵琶、弈棋、焚香、展卷、写信、看云、赏月和煮茶也须呈现正确器物、手势、坐姿与视线关系。
    - 怡然自得的情境具有具体生活动作和独立可信的环境变化：人物抚琴只使琴弦和琴穗响应，不使花粉、露珠、花瓣或昆虫移动；吟诗与酒香不推动花粉；吹箫不支配巨型昆虫行为。花粉只由风、重力、雨滴、植物自身运动或昆虫直接接触带动，茶汤可被移动叶影染绿，花瓣可随自身弹性与气流缓慢起伏，披风可铺在羽片背风处，剑与斗笠安稳放在手边。人物活动与环境可以诗意呼应，但不得虚构不成比例的直接因果。
    - 露珠、叶尖汇聚的雨滴和滚落水珠始终大过人物全身，或形成可环行的池塘、湖泊和透明水壁。人物只能站在边缘观察倒影、用剑尖或竹竿轻触表面、从外溢细流取水，不能伸手接住、托住、捧住、握住任何完整露珠或水珠，不能放入茶盏，也不能写成胸前、掌边或膝下的小水滴；滚动水珠足以改变路径，人物必须避让而不能徒手截停。只有雨滴撞击巨物后形成的细小飞沫可以落在手背和衣袖上。
    - 古风雅趣器物始终随手指大小的人物同比缩小，包括七弦古琴、洞箫、竹笛、琵琶、酒葫芦、陶壶、小盏、茶具、棋盘、棋子、香炉、书卷、笔墨和包袱；器物造型与使用方法准确，不把古琴画成筝，不凭空出现现代酒瓶、玻璃杯、钢琴、吉他或舞台。纸卷可见墨迹浓淡但不得依赖可读诗句、题字或字幕讲故事。
    - 展开的手卷或书卷若悬在空中，必须由左右手分别握住两端；若人物需要腾出一手指向、扶稳或持杯，则书卷必须平放在膝上、竹席、花瓣或叶面，并由卷轴自重、小镇纸或仍在卷端的手固定。不能单手把整幅展开手卷悬空，不能同一只手既展卷又支撑身体，也不能让“背着小书卷”与当前手中展开的卷册变成两份复制品。
    - 漂叶游江是一种重要的闲适方向：完整叶片保持可辨物种轮廓，宽阔如江中岛屿，叶柄拖在水后，水流沿叶缘形成长尾涡和细小浪纹；一至数名只有手指大小的古装人物位于叶心或主叶脉旁，醉卧、盘坐、对月举杯、吟诗联句、抚琴吹箫、看云或枕着包袱休息，入鞘兵器与斗笠安稳放在身边。人物不划桨、不奋力求生，也不把叶片改造成木船。
    - 为每个主题建立一条完整可见关系：突发情境可由季节与天气引发巨物变化，巨物变化改变路径或安全条件，人物行动帮助自己或同伴稳定下来；闲适情境则让光线、巨物自然运动和人物生活动作在同一时刻形成呼应，例如叶影移动时人物抬眼、茶烟随风偏转、花瓣自身起伏带动坐姿调整、昆虫经过时人物停箫观察，或剑尖触及露珠湖边缘后只产生接触点附近的小圈水纹。
    - 人物行动必须具有明确支撑和当前目的，可倚着叶脉坐下、在花瓣凹处煮茶、靠羽轴吹笛、擦拭入鞘长剑、铺席午睡、分享干粮、枕臂看云、提灯漫步、轻扶卷曲叶缘、牵腕跨越湿滑花脉或伸手接住花粉；遇到自然变化时才短促急停、伏低避风、借叶脉变向或用斗笠挡花粉。人物只能影响脚边局部组织、细小支流或松动羽枝，不能靠身体力量抬起、顶住、拖动或改变整片山体尺度的花叶羽毛。
    - 每个人获得服务于统一雅游气质的身份，例如游侠、女侠、文士、乐师、画师、药师、僧人、旅人、隐士、采茶人或身份含蓄的江湖客。多人通过目光、手势、琴箫茶酒、团扇书卷和共同受力形成闭合互动，不让任何人只在背景观看，也不让所有人重复相同表情和动作。
    - 情绪来自事件进程并落实在可见身体细节。初遇巨虫可有屏息警觉、后撤半步、抬臂护住同伴和紧盯触角；确认无害后可有眉眼舒展、肩部放松、谨慎伸手和惊喜交换目光；风雨突至可有咬紧牙关、眯眼迎风、张口呼喊和压低重心；进入叶下避雨后可有急促喘息、忍俊不禁、湿发贴颊和如释重负。
    - 惊奇不等于统一张嘴，恐惧不等于僵直尖叫，宁静不等于空洞无表情。变化克制敬畏、孩子般好奇、专注判断、短暂慌乱、互相信任、顽强用力、发现路线的欣喜、脱险后的释然、面对壮景的寂静与对微小生命的体谅；表情强度匹配人物距离和事件危险。
    - 闲适人物可以松开肩颈、自然屈膝倚坐、以手托腮、闭目听风、低头浅笑、悠然饮酒、抬手吟句、专注抚琴、横箫吹奏、赤手拨弄近处花粉或与同伴交换会意目光。放松不等于呆坐摆拍；呼吸、衣袖、酒面、琴弦、茶烟、发丝、叶影和身边昆虫的细微变化共同证明时间正在流动。古风飘逸来自轻风下有重量的衣袂、裙摆、披风、鬓发和剑穗，不是全身衣物无故腾空。
    - 巨物尺度通过至少四类同场证据建立：人物全身与高过数倍身高的花蕊、叶脉或羽轴并列；古代亭阁、寺门或桥梁与主导巨物并列；露珠大过人物全身或形成池塘；花粉粒接近头颅、叶面绒毛如草丛、羽枝间距如巷道、昆虫足节如塔柱；人物接触只改变松散花粉、细绒、浮尘、茶烟或极细水流，主巨物表皮与整体不因人物重量产生可见形变。不得只用低机位仰拍、形容词或景深虚化假装巨大。
    - 人物与环境保持可信接触：鞋底可压低脚边少量茸毛或浮尘，手掌可贴住叶脉表面凸棱，雨水可沿衣袖滴落，人物可拨开一束足够纤细的羽绒后让它回弹；膝盖、棋盘、琴和脚掌不能在山体尺度花瓣、叶片、羽轴或根皮上压出凹坑和脚印。昆虫足落地可以引起远大于人物步幅的尘浪或水纹。人物不悬浮、不穿透植物，不站在无承重能力的纤细花蕊或羽枝尖端。
    - 国风来自古代空间、武侠调度、材质、色彩、服装与自然观，不依赖堆叠灯笼、牌楼、祥云、龙凤和书法。男性与女性均可穿名称清楚的交领长衫、圆领袍、窄袖短褐、曳撒式长袍、披风、护腕、腰带、长裤和布靴，外加一件斗笠、包袱或旧斗篷；内外衣层、系带、衣襟、袖口和下摆连续可信，不混搭其他朝代、现代汉服影楼造型或仙侠盔甲。
    - 男性头发束成古代发髻或以头巾、幞巾固定，女性使用盘发、高髻、低髻或长发束起，发式适合行走、坐卧、风中活动及偶发短促动作；灰发与白发仍按古代方式束起。不得出现现代短寸、齐肩沙龙发、高马尾、现代刘海、染发或披散却纹丝不乱的造型；人物发式不用意义含混的自造髻名。
    - 每个主题逐人交代符合架空明代物质语汇的完整穿戴组合：发色与发式、固定发髻的头巾或簪钗，贴身中衣，交领长衫、圆领袍或窄袖短褐等外衣，腰带与系带，长裤或裙装，布靴、皂靴、草鞋或僧鞋，以及披风、护腕、斗笠、剑鞘、药囊、酒葫芦等佩戴位置。鞋履必须完整穿在脚上并适合湿叶、花瓣、泥地或羽轴地形，不赤脚、不穿现代皮鞋、高跟鞋、运动鞋或时代混搭靴。
    - 古装具有轻重分明的飘逸层次：贴身中衣与腰带稳定身体轮廓，外层长衫、披风、裙摆、袍袖、窄幅飘带、斗笠垂纱或剑穗承担动势。丝、纱、绫、薄麻和较厚棉布各自呈现不同重量、折痕、透光与回落速度，不把所有衣料画成同样轻薄的无重量长纱。
    - 发式整体固定在发髻、头巾或束带中，只让鬓边碎发、颈后发丝、发辫末端或少量松开发束随动作飞舞。风向、发丝、衣摆、飘带、剑穗、花粉和落花保持同一受力逻辑；头发不脱离头皮、不无限延长、不变成烟雾或触手，也不遮住双眼、持械手和兵器轨迹。
    - 每个主题选择一种主要动势来源，例如山口横风、竹林穿堂风、昆虫翼流、人物急停转身、轻功起落、花瓣下坠、叶片回弹、雨幕斜落或水面上升气流。动势已经作用于人物与环境，在衣袂、发丝、花叶、尘沙和水滴上留下方向一致但幅度不同的结果；不能让衣服和头发无风自动漂浮。
    - 随身物统一服务古装雅游，可使用入鞘剑刀、短杖、绳索、斗笠、油纸伞、灯笼、酒葫芦、陶壶茶盏、团扇、七弦古琴、洞箫、竹笛、琵琶、棋盘、香炉、书卷、竹篮、布包、药囊或木匣。每件物件有唯一主人、携带位置和当前用途；兵刃通常收入鞘中，不悬空、不穿过巨物或人物身体。
    - 视觉固定为受胡金铨电影高层空间语法启发的原创真人实拍古装奇谭院线静帧：先以山水、巨物结构和留白建立空间，人物从竹、岩、花叶、羽枝和雾气间进入调度；克制静止、偶发短促动作、横向移动、纵深遮露、戏曲化手眼身法和空阔自然共同形成节奏。只提取这种高层电影语法，不复制任何现有作品的角色、服装、布景、动作或镜头。
    - 东方水墨意境只转化为空间组织与观看节奏，不把成片变成水墨画。以天空、云海、山雾、静水、雨幕、未照亮的林间和宽阔巨物表面形成真实摄影中的留白；让人物和巨物互动集中在有限区域，空处承接视线、风向、远游路径、未说出口的诗意或面对奇观的寂静。
    - 留白具有真实空气透视、天气层次、胶片颗粒和现场光，不出现宣纸底色、绢纹、墨晕、皴法、毛笔笔触、题跋、印章、国画边框或绘制人物。画面始终是有真实演员、实体古装、实景山林与水域、实体巨型花叶羽毛和仿生昆虫的彩色胶片古装奇谭电影剧照。
    - 巨型花叶、羽毛和昆虫不必填满整个画框，但必须呈现足够长的连续结构来证明体量。允许叶缘、羽枝、花蕊、翅影和被雾遮去一部分的巨大轮廓越出画框；越框处与人物和连续巨物生态同场并列，保留安静空域，使奇观服从诗性互动而不是变成拥挤的生物图鉴。
    - 采用二十世纪六七十年代华语院线古装片的彩色胶片质感、实体古装、真实演员、山林水域外景、实体巨型花叶羽毛和仿生昆虫。色彩克制浓郁而不艳俗，日光、火光与雨雾具有胶片宽容度，动作边缘可有轻微运动模糊；不使用数字锐化、现代商业广告光、仙侠粒子、游戏渲染、动漫脸、纸面古画或现代电视剧磨皮。
    - 色彩从具体季节和生态提取，使用二至四种主色与一种小面积强调色，例如雨荷的黛青、灰绿、月白与朱砂；秋羽的赭石、枯金、墨黑与石青；夜花的靛青、藕粉、银白与萤火黄。色彩来自真实服装、植物、土石、木构、天空和现场光，不因为追求水墨意境而退化成黑白灰或后期墨色滤镜；避免无来源霓虹、全画面金光、彩虹饱和与通用青橙电影调色。
    - 光线必须有自然来源和天气逻辑：叶片透下的绿色散射光、花瓣反射的暖色柔光、雨幕后的天光、月光穿过羽枝的条纹、萤火虫近处微光、云隙日光或雪地反光。光线揭示人物表情、巨物纹理、昆虫轮廓和行动路径，不用无来源仙气遮蔽物理关系。
    - 动感强弱匹配统一的宁静雅游气质。微风、人物转身、昆虫翼流或叶片回弹可让披风与裙摆形成舒展弧线，袍袖和发丝产生克制滞后；饮茶、吹笛、观云和休憩场景只用缓慢抬起的衣角、轻摆剑穗、掠过脸侧的发丝和间歇飘落的花瓣表现时间，不把闲适变成风暴或动作大片。
    - 漂叶游江的动势来自水流而非人物发力：叶片整体缓慢旋转或顺流平移，人物衣角、裙摆、发丝和剑穗只受江风轻抬；叶柄后的尾涡、水面反光、漂过的花粉和远处巨型叶影共同显示安静移动，不添加激流、翻覆、追兵或突然危险。
    - 场景具有前景巨物结构切边、中景古代人物互动和背景连续生态三个层次，同时保留显著而安静的真实环境留白供天气、视线和远景呼吸。竹干、巨型花蕊、叶缘、羽枝和菌褶可形成多重框景，但人物当前支撑、器物位置、互动对象、观看方向和主要生物身体必须可辨。
    - 每个主题根据巨物形态和人物活动选择一种主要经典摄影构图，再选择一种不抢主导的辅助构图。主要方法可为对角线、引导线、S形曲线、三角构图、框中框、三分法、非对称平衡或大面积负空间；不能在同一画面平均堆叠所有构图术语，也不能让形式压过巨物尺度和人物互动。
    - 斜向生长的桃枝、横跨山口的羽轴、倾斜叶柄、雨线与人物衣袂优先形成有起点和终点的对角线，将视线从前景手指大小人物引向巨物深处。对角线须来自真实结构与运动方向，不靠随意倾斜地平线或旋转相机制造动感。
    - 放射叶脉、竹节序列、花蕊排列、菌褶、水面尾涡、脚印与鱼线可作为引导线。线条从画面边缘或前景进入，经过人物手势、茶盏、琴弦或接触点，最终指向完整花冠、叶海、露珠湖、昆虫或远方留白；引导线不能在人物之前突然中断，也不能把视线带出画外的无关空处。
    - 卷曲花瓣、藤蔓、长叶边缘、漂叶尾涡和裙摆可形成舒缓S形曲线，连接近处材质、中景互动和远景生态，强化古风飘逸与可游可望的空间。曲线保持植物或水流的自然结构，不把直叶、竹秆和羽轴强行扭曲成装饰曲线。
    - 两至三名人物可利用头部、手势、视线和器物形成稳定或略偏斜的三角关系，三角顶点落在主要互动者或接触点；人数超过三人时分成前后呼应的小组，不把人物排成合影横线。单人画面可由人物、巨物局部和远方完整轮廓形成尺度三角。
    - 花瓣开口、卷曲叶缘、竹叶间隙、羽枝、菌褶和可选古代门窗可形成框中框，遮住次要区域并集中视线，但不同时遮掉人物脸、持物手、承重点和巨物关键结构。前景框景必须属于现场空间，具有厚度、焦点变化和正确遮挡，不是后期边框。
    - 三分法与非对称平衡用于安置小人物和巨大主体：人物通常位于下方或侧方交点，完整巨物、光线或环境运动占据相对的大面积，另一侧用雾、水、天空或暗林留白平衡。不得为了三分法裁断人物承重脚或切掉证明物种的关键结构，也避免证件照式完全居中与机械左右对称。
    - 前景承担触觉尺度，可见被裁切的叶缘、花瓣、羽枝、水滴或器物；中景承担人物互动和明确接触；远景承担完整或继续延伸的同类巨物生态、天气与留白。三层通过遮挡、空气透视、色温、清晰度和光线逐渐变化，不用三条互不相干的平面横带拼接空间。
    - 构图中的最高明暗或综合色对比优先落在人物与巨物的主要接触点，人物可用月白、朱砂、石青或赭黄等克制古装色从巨物表面分离；背景不以同等亮度和饱和度争抢视线。人物虽小，头向、手势和衣袂轮廓仍能被第一或第二视觉落点发现。
    - 每个主题确立一种能直接证明尺度反差的主视角策略，而不是只写“巨大”与“渺小”。可用高空鸟瞰完整叶片、花序或昆虫轮廓；侧向环境远景把人物贴在高耸花蕊、叶脉断面或昆虫足节根部；人物高度的贴地仰视让巨物结构越过林梢进入云雾；或侧向压缩视角把人物、局部结构和远处完整巨物安排在可比较的空间层次。视角必须同时服务巨物尺度、人物动作和水墨式留白。
    - 每个主题固定季节、时刻、天气、巨物生态、主导物种、昆虫或动物状态、决定性互动、人物身份、衣着、随身物件、角色分工、情绪转折、尺度比、视觉谱系、色板、光源和核心构图关系，但不分配或输出具体地点、地域、国家和国籍。
    - 每个主题的标题、前提和风格都让“巨物主体 + 人物互动”成为第一视觉记忆，例如深莲绿色巨荷叶下扶叶饮茶、半开粉莲花瓣凹处侧卧听雨、玉兰花瓣漂湖时不同坐卧姿态、白色马蹄莲佛焰苞内触碰淡黄肉穗花序并相视微笑、盛夏荷叶边垂钓、巨桃枝上提篮持扇漫步、晨光茶叶上铺席午睡，或雨中竹叶下听雨煮茶。例子只说明清楚程度与互动方式，每轮仍随机选择不同物种、姿态和关系。
    - 主题组整体均衡变化完整花冠与花蕊世界、叶片与叶脉世界、羽毛结构、果实种子、草穗真菌及昆虫栖息地，不让荷叶避雨、雨后叶面探路或同一种植物连续主导。完整花朵本身应成为可进入、可穿行、可承重和会随天气变化的空间，而不只是叶片旁的点缀。
    - 主题之间变化生态物种、巨物地貌、天气机制、生物行为、人物关系、风雅活动、自然变化强度、合作方式、情绪温度、古装轮廓、雅趣器物、色板和观看尺度，不只替换花名或昆虫名称。人物活动充分变化吟诗联句、对月饮酒、花间抚琴、横箫观虫、垂钓、漫步、铺席午睡、对弈、焚香展卷、听雨、赏花、观云、洗剑、分享干粮和醉卧休憩；不让现代职业、科学考察、紧张任务或正邪对峙进入默认主题。
    - 每次生成都重新随机组合主题，不沿用固定菜单、固定顺序或上一轮常见搭配。分别从主导巨物生态、季节时刻、天气、人物人数与关系、游历身份、风雅活动、自然动势、情绪温度、服装轮廓、色板和最强尺度视角中选择，再把互相成立的元素组合为新主题；示例只用于启发，不复用上一轮的物种、活动与构图组合。
    - 同一批五个主题必须彼此明显不同：不得重复主导物种或巨物类别、核心活动、决定性互动、人物姓名、人物关系、主要情绪、主要色板和主尺度视角中的大多数项目。至少覆盖三类不同巨物生态，并让纯粹闲适雅趣主题的数量在三至五个之间变化；其余只能是温和探索、相互帮助或应对短促自然变化。不能用同一构图和人物动作只替换花名、昆虫名或衣服颜色。
    - 随机选择仍须服从物种、时代和物理逻辑。优先产生有新鲜因果的跨维度组合，例如在蒲叶浪尖联句、于玉兰花冠抚琴、借蝉翼阴影弈棋、沿芭蕉叶脉踏月、在蒲公英种子伞下饮酒或靠孔雀羽眼斑观云，但不把这些新例子变成下一轮固定清单；若随机元素无法形成可信承重、动作和环境回应，则重新选择组合而不是生硬拼接。
  frames:
    common:
    - 每幅画面独立完整地呈现同一主题中已经发生的决定性事件，不组成前后连续故事。固定人物身份、巨物物种、季节天气、生物行为、衣着、随身物件、角色分工和因果结果；变化相机方位、景别、前景遮挡、纵深关系、留白、目光线路和受力细节。
    - 每幅画面都完整展开季节、时刻与天气、主导巨物的物种结构、自然变化、每个人的外貌服装、逐人的支撑动作与表情、人物之间的回应、至少三项尺度证据、相机位置与景别、前中后景、色板、光源和材质反应。开头直接说明“古风巨物美学世界”，不输出具体地点、地域、国家和国籍，也不能用“同前”“仍然如此”或概括性短句省略可见事实。
    - 每幅画面逐人重复并完整交代年龄、面部特征、体格、发色、明确古代发式及其固定物，内外衣名称与颜色、腰带系法、裤装或裙装、鞋履种类与落脚状态、披风护腕等穿戴层次，以及兵器、乐器、酒具、斗笠、药囊或包袱的主人和佩戴位置。不能只写“古装人物”“衣袂飘飘”或省略脚上穿什么；服饰与发型必须符合架空明代物质语汇、天气、身份和当前动作。
    - 每幅画面逐人交代当前情绪及其可见依据：眉形、眼神、嘴角或呼吸，头部朝向、肩颈松紧、躯干倾斜、手势、双脚承重和衣物受力必须互相一致。视线须明确落在同伴的脸或手势、琴弦酒盏、巨型生物、天气来源、前进路线或远景奇观上，不能写成无对象的“望向远方”。
    - 每幅画面把人物与巨物的接触点作为叙事焦点，清楚说明哪一只手触碰哪一处叶缘、花瓣卷边、花蕊、羽轴或器物，身体由臀、膝、脚、肘或背部的哪些位置承重，裙摆、袍袖和披风如何沿巨物曲面自然铺开或垂落。不能让手掌悬空、身体漂浮、衣物穿入植物，或用含糊的“依偎其中”代替姿态。
    - 多人画面必须形成至少一条清楚可见的互动链，例如一人举杯吟句、另一人含笑接句并以杯沿击节；一人抚琴、另一人倚叶脉看向拨弦手并交换目光；一人牵腕跨越叶脉、另一人回首确认落脚点。互动只通过画面可见的目光、手势、身体朝向、器物交接或共同受力闭合，不把琴声、箫声、吟句内容和低声交谈本身当作视觉互动证据。
    - 每幅画面至少出现三种方向一致、幅度有别的动态元素，其中至少一种来自动作或呼吸、至少一种来自衣袂或发丝、至少一种来自巨物环境。可组合抬起的披风和裙摆、滞后的袍袖、飞舞鬓发、轻摆剑穗、震颤琴弦、倾斜茶烟、晃动酒面、飘散花粉、滚动露珠、回弹叶缘、掠过羽枝的风浪、昆虫翼流或水面尾涡；必须交代共同动力来源和前后延迟，不让所有元素同幅度悬浮。
    - 开头天气与后文动力保持一致：写“无风”时，后文不得再以微风、横风或山风推动衣摆、发丝、灯穗、花粉和叶缘，只能使用人物呼吸、手部动作、重力、水流或昆虫翼流；若后文需要风驱动，开头必须明确同一阵风的方向和强弱。
    - 同一主题的不同画面具有不同叙事视觉重点，可分别突出生态全貌、人物互动、生物行为、天气机制、器物动作或安静情绪联系。至少改变机位高度、观察侧别、景别、主要经典构图、前景框景、主体在画面中的占比、主要尺度参照、焦点和留白形状中的五项；不能只是交换近义词、调整句序或重复同一构图。
    - 每幅画面首先让人相信人物已经进入巨物国般的连续自然世界，而不是在普通尺度场景旁遇见一个放大的道具。前景展示人物脚边的巨型表面细节，中景展示正在穿行的花瓣坡、叶脉岭、羽轴脊、菌伞原或昆虫足下区域，远景继续延伸同尺度的巨茎、叶海、花蕊林、露珠湖、羽枝峡谷或种壳山；三层不能退回普通尺寸树林和庭院。
    - 每幅画面在人物外貌展开之前，用独立完整句子准确写一次“画面中的人物只有手指大小。”随后说明人物完整身高约六至八厘米、只占主导巨物可见连续跨度的约二十分之一至四十分之一；不得拼成“她人物只有手指大小”、重复多次，或只写“很小”“渺小”和比例数字。主巨物的一个结构单元，如单片花瓣、主叶脉、羽轴横截面、昆虫一节足或翅片宽度，也明显大于人物全身。手指大小只是尺度说明，画面不得出现巨人手掌或把巨物结构缩成人物可抱住、顶起或当作普通家具的尺寸。
    - 人物、巨物局部结构和巨物整体位于相同或相近摄影距离。人物自己的剑、斗笠、灯笼、琴箫、酒具、竹筒或包袱与手指大小的身体同比缩小，提供最小尺度；花粉、叶毛、羽枝、种壳纹路、露珠边缘或昆虫足痕提供中间尺度；连续花冠、叶海、羽轴、菌伞或昆虫身体提供最大尺度。只有主题本来位于巨人遗迹时才使用巨型门洞、柱础、瓦片或桥栏，不强制任何建筑。
    - 使用环境大全景或宽阔中远景建立压倒性尺度，人物以小而清楚的古装色块和动作剪影出现。不得用贴近镜头的人物大前景搭配远处巨物，不采用把人物拍成半身或近景、却裁掉巨物连续结构的构图；人物面部情绪可由清晰头向、肩颈张力、手势和衣袂辅助，不为看清脸而破坏比例。
    - 高空鸟瞰或斜俯大全景优先用于展示完整巨叶、花冠、羽毛、菌伞或昆虫身体的总轮廓。人物必须与巨物处于同一表面或相邻接触面，像一枚小而醒目的古装色点；叶柄尾涡、花瓣层数、羽轴长度、翅影或足迹路线从人物旁延伸至画面大部，直接给出投影比例。
    - 侧向远景优先用于展示垂直尺度。人物完整全身位于花蕊柱、叶脉崖、羽轴断面、菌柄或昆虫足节底部，同一焦平面可见其顶部继续越框、没入雾层或高过远处巨型生态；人物的剑、斗笠和衣摆提供手指大小访客的随身尺度，不能用低机位本身代替真实并列。
    - 人物高度的贴地仰视用于沉浸巨物国，但必须保留至少两级向上延伸的结构，例如脚边叶毛、上方主叶脉和更远叶片天幕，或足边花粉、花蕊柱和高处花冠。人物占画面面积仍然很小，不让仰角把人物腿脚夸张放大，也不用鱼眼、超广角拉伸和极端透视制造虚假高度。
    - 侧向或斜侧压缩视角可拉近人物、局部结构和远处完整巨物的视觉关系，让人物与高大花蕊、昆虫足节、羽轴和叶海在相近清晰度中形成层层比例。空间压缩不能消除真实前后关系，仍保留接触阴影、遮挡顺序、空气透视和落脚面。
    - 同一主题的不同画面使用互补的尺度视角：一个画面优先交代完整巨物轮廓和人物在其上的微小位置，另一个画面优先从人物附近表现局部结构如何像山崖、森林或天幕压过身体。更多画面可变化侧向远景、空间压缩和高位斜俯，但不能连续重复同一种机位和构图。
    - 每幅画面明确一种主构图和一种辅助构图，并用可见结构说明，而不是只写构图名称。例如“桃枝从左下斜向右上形成主对角线，层层花梗作为辅助引导线，把视线带到人物团扇与回望处”；不能写成没有物体承载的“采用对角线和引导线构图”。
    - 每幅画面的视觉阅读顺序清楚控制为二至四步，例如前景叶尖雨滴、手指大小人物与茶盏、中景放射叶脉、远景荷塘留白；或前景羽枝框景、中景抚琴者与倾听者、沿羽轴延伸的远方雾谷。眼神方向、手势、明暗对比和结构线条共同支持同一阅读顺序，不产生多个互相争抢的中心。
    - 拍摄角度必须选择当前巨物形态下最能体现巨大对比的一种，并在画面中说明选择结果：完整而横展的荷叶、花冠、菌伞和翅面优先高空垂直鸟瞰或高位斜俯，让手指大小人物落在完整轮廓内部；高耸花蕊、菌柄、叶脉断崖和昆虫足节优先侧向环境远景，让人物与垂直结构在同一焦平面直接并列；横跨山口的羽轴、漂行巨叶和昆虫长身优先高位斜侧远景，显示起点、终点与人物位置；需要沉浸时才用贴地仰视，并同时保留远处完整结构。不得为了新奇选择削弱比例证据的平视中景、人物近景或无环境特写。
    - 严格保留要求的人数与每个人的独立身体。每人只有一个头、一个躯干、两臂两腿，肢体从肩或髋连续连接；手脚、服装和头发不与叶脉、花蕊、羽枝、昆虫足或其他人物融合。
    - 每个人的左手与右手各自只承担一个当前动作或持有一件物品，逐手说明完毕后，后文的互动链、构图、动态和总结不得再为任一只手添加、替换或按“随后、再、又”串联第二动作；不得让同一只手同时扶地、持杯、触碰腰间器物、指向远景或操作第二件器物。双手之外的稳定由臀部、双脚、膝部、背部或宽阔支撑面完成，但同一肢体不同时承担精细操作与主要承重。
    - 每个人只选择二至三个清楚的主要承重点，并形成可以画出的稳定支撑链，例如臀部与双脚、单膝与另一只脚、背部与臀部、双脚与一只扶稳手。承重点只能是该人物的臀部、背部、膝、小腿、大腿、脚、前臂或明确扶稳的手，叶面、花瓣、羽轴、凹槽和平台是另行说明的承重表面，不能并列成人体承重点；不得写“臀部、一侧大腿和叶面承重”。不要同时罗列臀部、双膝、双脚、肘部和手掌全部承重，也不要让盘坐者同时以双脚踩地、让同一侧肘部承重而该手又进行精细操作，或让未说明位置的腿脚消失。
    - 坐姿名称与承重点严格一致：盘坐以臀部和交叠的小腿外侧接触支撑面，双脚不另作承重点；跪坐以双膝、小腿和臀部靠近脚跟承重；侧坐以臀部、一侧大腿或小腿承重；普通屈膝坐姿必须以臀部与双脚承重，双膝只保持弯曲而不接触支撑面。不得写“屈膝坐，以臀部与双膝承重”，也不能一边写盘坐或跪坐，一边又写双脚分踏地面。
    - 乐器按照真实演奏方式占用双手：七弦古琴必须一手按弦、一手拨弦；洞箫和竹笛必须左手、右手分别按住不同音孔并由口部吹奏，不能让一只手只托箫尾、持箫尾或空出；琵琶必须一手按品、一手弹拨。演奏期间两手不能再扶羽轴、端酒、指路或支撑身体，身体依靠稳定坐姿、背靠面或双脚保持平衡；若环境要求腾手避险，人物必须停止演奏并明确把乐器收稳。古琴由干燥近水平的花瓣凹台、叶脉平台、竹席或人物膝前稳定承托，不直接放在湿润花瓣上，也不得写成“古琴由人物的臀部、双脚、双膝承重”；人体承重点只支撑人物。
    - 酒茶动作遵守器物数量与手部占用：一手持杯时另一手可以持壶斟倒、扶稳身体或做手势三者之一；斟酒结束后才可举杯或指向远景。只有两名人物各自用手持有一只独立杯盏时才可写碰杯、杯沿相触或轻叩；放在琴旁、地面、叶面或花瓣上的杯盏不能被另一只手持杯碰触，对方双手演奏或画面只有一只杯盏时也不得写杯沿接触。棋局中落子手只持一枚棋子，另一手只能支撑身体或稳定棋盘之一。不得在同一决定性瞬间连续叠加先后动作。
    - 完成逐人动作后清点全部器物：每只酒盏、茶盏、灯笼、团扇、棋盘、书卷和乐器都只有一个明确主人或一个明确的双人交接关系，数量与已写出的持有动作一致。不得在总结句凭空增加“三盏酒”“第二卷书”或未分配的器物，也不得把同一件物品同时写在腰间、背后和手中；古琴、箫、书卷或画板一旦正在膝前、平台上或双手中使用，人物外貌段就不能再写正背着、腰挂或收在包中。
    - 棋盘必须置于近似水平、干燥且稳定的巨物局部表面，或铺在防滑竹席上；雨中的斜叶面、光滑花瓣和菌伞弧坡若没有天然水平凹台与防滑垫，就不安排对弈。棋盘及其重量不能稳定人物、固定路线或压住山体尺度结构，人物各自依靠坐姿和落脚点保持平衡。
    - 每个人正在做一件与当前情境直接相关的事，脸、视线、双手分工、脚下支撑、躯干朝向和重心彼此相容。自然变化场景中的动作帮助自己或同伴稳住身体、器物或衣物；闲适场景中的茶烟、琴弦、衣摆、花粉、水面和叶影各自由真实的手部动作、环境微风、重力或水流驱动，不让琴声、箫声、乐器出口气流和气味推动衣袖、花粉、露珠、花瓣或昆虫，也不让人物重量压弯山体尺度结构。
    - 人物表情必须各不相同且与角色认知一致：先发现危险者更警觉，承重者表现用力，受保护者同时紧张与信任，确认安全者露出克制释然。以眉、眼、嘴、呼吸、肩颈张力和头部朝向形成可见差别；至少一个清楚的目光或手势把人物彼此连接，另一条目光连接主要昆虫、天气来源或路线。
    - 偶发短促动作停在决定性的可读瞬间：翼风来时压低重心、借叶脉迈过水沟、转身按住斗笠、落在羽轴时屈膝卸力、牵住同伴衣袖或收稳将倾的茶壶。动作保留戏曲式手眼身法和明确节拍，但四肢关节、器物主人、受力方向、承重点与落点都可信；闲适场景不人为加入拔剑、追兵或戒备姿态。
    - 衣袂与发丝为动作延迟提供第二节拍：身体已经急停而披风仍向前掠，人物刚转身而裙摆沿圆弧展开，落地屈膝时袍袖和发辫末端仍在下落，安坐后衣角才被微风轻轻抬起。运动轨迹围绕现有人体展开，不复制衣袖、裙摆、飘带、头发或兵器，不把飘动织物误认成额外肢体。
    - 昆虫或小动物保持准确身体结构、重心和落足点。昆虫统一写“六只分节足”或“六足”，不写容易误解为六个足节的“六节足”。翅膀运动带来相符的空气、花粉、雨滴或衣物反应；足节压弯植物并投下接触阴影；复眼、触角和口器不变成人脸，不添加怪兽牙齿、额外肢体或恶意红眼。
    - Theme 只建立一只主昆虫时，每幅 Frame 只保留这同一只昆虫，不在远景、雾中、倒影或画外再增加第二只同类昆虫；若 Theme 明确建立昆虫群，才可按其数量关系呈现多个个体。
    - 昆虫在每幅画面只能处于一种运动状态：飞行时翅膀振动、六足离地收拢；降落时只写正在斜降或落足，明确前足或中足先接触、其余足节依次靠近且翅膀减速，不使用“停在、停栖、伏在”；停栖时六足全部落在承重面，翅膀收拢或仅轻颤。不得在同一瞬间混写飞行、降落与停栖。
    - 避雨画面同时显示降雨来源、承雨表面、叶片或羽毛的弯曲、积水与排水方向、人物所在的干湿边界及身体回应。巨大荷叶遮雨时，叶柄和主脉承担重量，叶缘因积水下垂，人物在叶下扶持、导流、护物或彼此靠拢，而不是在晴天举着一片无来源叶子摆姿势。
    - 巨型花朵画面保留花托、花瓣层次、花蕊、叶或茎的连续归属；完整人物小于单根主要花蕊，单片花瓣形成跨越视野的山坡或谷壁，完整花序或花朵的其他部分继续进入远景和云雾。人物踩踏只扰动表面浮尘、花粉或细绒，天气和花朵自身运动才造成花瓣整体弯曲；花瓣不变成丝绸床、普通屋顶、建筑石板或抽象彩云。
    - 巨型羽毛画面清楚区分羽轴、羽片和羽枝。羽轴横截面高过人物，长度跨越桥谷或整座院落；人物可沿羽轴表面行走、躲在弯曲羽片背风侧或拨开一束较细羽枝观察，但不让羽毛独立飞行、变成完整翅膀、从人物身体长出或承担超出结构能力的重物。
    - 至少使用四项同场尺度证据：人物身体与高过自身的巨物局部结构直接并列；人物自带物、巨物表面细节与巨物整体形成三级对比；接触处只显示人物投下的窄小阴影以及表面细绒、叶毛或羽枝暂时弯曲，巨物主体保持原有曲率和连续表面；远景继续出现同一巨人国尺度的生态结构。只写正向可见事实，不在成片提示词里复述“没有压痕、凹陷或脚印”等禁令和合规证明，也不用“大得惊人”“极其渺小”等形容词代替尺度证据。
    - 全景或环境中景用于先建立巨物生态、压倒性尺度和人物活动路线；低机位贴近叶面可强化结构高度，略高视角可展示叶脉或地形调度，透过竹林、花蕊和羽枝的侧向中景可呈现相视、休憩、雅集或短促自然反应。保持较深景深和清楚空间层次，避免人脸特写、昆虫复眼特写、无环境微距、鱼眼畸变、炫技旋转机位或极端景深模糊。
    - 不在画面提示词中输出镜头焦段、镜头毫米数或具体镜头型号。只说明机位高度、俯视或仰视方向、观察侧别、远景或中远景、空间压缩、透视关系和前中后景；保持垂直线、花朵与叶片轮廓、昆虫身体比例自然，避免鱼眼畸变、贴脸透视、倾斜地平线和夸张近大远小。
    - 构图借鉴东方山水的可游、可望、虚实相生与层层递进，但使用摄影透视和真实景物，并具有胡金铨式空间调度：近处门柱、竹叶或巨物结构遮露人物，中段动作形成叙事眼，远处驿道、寺院、雾、花影、叶海或羽枝暗示另一条进入路线。人物可被建筑和自然短暂遮挡，但脸、器物、承重脚与动作结果不能同时消失。
    - 同一主题的不同画面改变留白的形状、位置与叙事功能：可让大面积天空压在人物上方，让雾谷或静水横向展开，让空院、白墙或暗林占据一侧，或让远处空路成为目光终点。留白不能被随机飞叶、粒子、鸟群、云纹、字幕和无关道具填满，也不能成为没有地面与空间边界的白色摄影棚。
    - 允许高空俯视、鸟瞰或接近垂直的顶视构图，特别适合漂叶游江、花冠谷地、叶脉路线和露珠湖。高空画面同时显示巨物的完整或接近完整轮廓、人物在其表面的微小位置、水流或地形路线及宽阔留白；人物不靠近镜头放大，古装颜色、躺卧或盘坐姿态、斗笠和入鞘兵器构成人类尺度标记。
    - 人物古装保持完整、连续、适合坐卧行走且属于同一架空明代语汇。湿衣、斗篷、袍袖、裙摆、腰带、包袱和剑穗随微风、雨水、转身与坐卧产生可信重量，不遮住关键表情、持物手、脚下支撑或同伴间接触。
    - 构图保留一条主运动曲线，可由人物转身、扬起披风、展开裙摆、飞舞发丝、斜落雨线、弯曲叶脉或掠过的花瓣共同形成。脸、眼神、持械手、兵器方向和承重脚位于相对清晰的焦点，衣袖外缘、裙摆末端、发丝与落花可出现克制的胶片运动模糊，不能把整个人物抹糊。
    - 真人实拍古装奇谭视觉贯彻整幅画面：彩色胶片颗粒、皮肤、旧织物、木石建筑、植物表皮、羽毛和仿生昆虫处于同一摄影现实。不得用发光粒子、塑料花、数字仙气、游戏渲染、动漫脸、现代电视剧磨皮或泛化仙侠特效替代巨物生态和空间调度。
    - 画面不依赖可读文字、题字、招牌、界面、字幕、图注、边框或水印解释故事。季节、时刻、尺度、自然变化、人物选择和情绪转折都由可见环境、动作、表情和物理结果直接表达。
requirements:
  content_levels:
  - aesthetic
