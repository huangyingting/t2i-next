id: giant-nature-guofeng
description: 创作受胡金铨武侠电影高层视觉语法启发、但人物、故事和镜头完全原创的古代中国巨物武侠电影剧照。来自正常古代人类世界的成年侠客已经进入一个整体尺度属于巨人国的自然国度：花蕊是森林，叶脉是山脊，露珠是湖泊，羽轴是长岭，昆虫如移动城楼。人物只有衣物、兵器和行囊保持普通人类尺度，他们在连续的巨型生态中游历、休憩、追踪、护送、过关与相救，表现压倒性尺度差、人物反应和东方诗性。画面结合中国山水的空间秩序、工笔花鸟的物种观察、戏曲化武打调度与二十世纪六七十年代华语院线武侠片的实体质感，不是普通古代场景里摆放一个孤立巨物，也不复刻任何现有电影的角色、场面或构图。
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 所有人物完整穿着适合当前天气、地形和行动的古代武侠服装，互动保持非情色。可有持械对峙、追逐、格挡、点穴、夺信、护送和轻功动作，但不呈现血腥伤害、捕食成功或残缺身体。
      frames:
      - 人物的面部、视线、重心、手势和衣物受力共同呈现与当前事件一致的反应，不能只站立观赏或对镜头摆姿势。
  themes:
    common:
    - 严格使用所要求数量的中国成年武侠人物，不增加远处人影、仙童、侍从、军队、雕像、人物倒影或画中人。每个人具有稳定的年龄外貌、体格、古代发式、完整服装、兵器、随身物件、江湖身份、性格倾向和当前任务。
    - 世界是以明代物质语汇为基础的架空古代中国，不出现现代职业、现代机构、现代道路、玻璃幕墙、电力设施、塑料、拉链、相机、手电、现代测绘工具、现代背包、防雨胶靴或当代剪裁。人物不知道未来时代，也不把巨物当作科学考察项目。
    - 人物来自以明代物质语汇为基础的正常古代中国，已经跨入巨人国般的自然国度。入口或记忆中的人类世界可以有驿道、客栈、寺院、古桥与关隘；进入之后，背景优先是花蕊林、叶脉岭、根系峡谷、花瓣坡、菌伞原、种壳洞、露珠湖、羽枝谷、竹叶天幕、荷塘海与昆虫迁徙道。不能让普通尺度驿亭、寺院和道路继续主导巨物国境内的画面。
    - 巨物国境内可以完全没有建筑。若出现本地建筑遗迹，则它也属于巨人尺度：门槛高过人物数倍，瓦片如广场，柱础如山台，人物无法像使用普通客栈一样推门或坐上家具；这种建筑只是可选背景，不暗示必须出现可见巨人居民。
    - 人物是真实普通比例的人类访客，不是玩偶、手办、拇指姑娘、仙子或天生微型种族。只有人物自己的古装、剑刀、斗笠、灯笼、药囊、竹筒密函和布包属于人类尺度；花、叶、羽毛、真菌、果实、种子、露珠、昆虫以及本地遗迹均属于统一的巨人国尺度。
    - 巨物国不是单一巨型道具陈列。主导花叶之外，远近景还须延续同一尺度体系，例如巨茎穿入云雾、花蕊柱林延伸至远处、叶脉道路连接另一片叶海、露珠湖倒映菌伞、羽枝峡谷通向种壳洞、巨型昆虫在花粉荒原留下足迹。不得让一个巨型荷叶孤零零放在普通尺寸树林、驿站或庭院中。
    - 主导自然物达到山体、整片林地、巨大水面或整段山谷的尺度，而不是一件略大于人的道具。人物完整头脚高度只占主导巨物可见连续跨度的约十五分之一至三十分之一；一片叶、一朵花、一根羽毛或一只昆虫本身就是可供穿行的地貌。
    - 使用巨人国本地的三级尺度链直接对比：人物与自己的人类尺度兵器最小，花粉粒、叶毛、羽枝、种壳纹理、昆虫足痕或露珠等局部结构构成中间层，完整花瓣、叶片、羽毛、菌伞或昆虫身体形成山谷级最大层。普通尺寸古树、庭院和驿站不作为每幅默认中间参照，观者通过同一巨物生态内部的层级就能判断人有多小。
    - 人物与主导巨物处于相同或相近景深和透视层，不把人物放在镜头前景放大、把巨物推到遥远背景缩小，也不使用强制透视制造假比例。人物全身虽小但轮廓、古装颜色、主要动作和头部朝向仍可读；局部情绪通过姿态、衣袂、手势和相互距离辅助表达。
    - 每个主题选择一种主导巨物生态和一个清楚的当前情境，同时说明人物已经身处巨物国境内哪个连续地貌区域，以及他们如何理解或适应这个陌生尺度。主导对象须参与承重、遮蔽、阻挡、牵引、弹跳、导流、漂浮、发声、振动、移动、休憩、观景或交谈，不能只是背景装饰；情境可以是迫使人物反应的突发事件，也可以是人物主动选择并正在享受的安静时刻。
    - 花朵生态可从牡丹、莲、荷、玉兰、芍药、菊、梅、海棠、山茶、紫藤、芙蓉或其他具有明确中国地域与季节依据的植物出发。单片花瓣长过数座亭阁并形成山坡、帷幕、舟、洞檐或坠落的软墙，单根花蕊高过人物数倍并组成柱林，花粉粒可接近头颅或斗笠大小；完整花冠仍保留花托、花瓣层数、花蕊与枝茎的连续关系。
    - 叶片生态可使用荷叶、芭蕉叶、竹叶、梧桐叶、蒲叶、蕨叶、银杏叶或其他具体植物。一片叶可覆盖整座院落，主叶脉宽如古桥或官道，次级叶脉形成高过人物的梁脊，叶缘积水、卷曲、破口和倾角改变路线；叶柄、枝茎与根系连续承重，不让切下的叶片无来源悬浮。
    - 植物、昆虫、鸟类羽毛与服装采用准确、常用的规范中文名称，不拼接或臆造物种名、衣物名和身体特征。芭蕉叶就是芭蕉叶，萤火虫就是萤火虫；不能把相近字、古字或陌生偏旁替换进名称。
    - 羽毛生态来自一根或少量已经自然脱落的鹤羽、雁羽、孔雀羽、翠鸟羽或其他明确鸟类羽毛。羽轴粗如廊桥或城墙脊，完整长度横跨山口或庭院，单束羽枝高过人物并形成透光屏风、风障、峡谷或柔性坡面；羽根、羽轴、羽片和羽枝结构准确，不把羽毛画成树叶、布料、翅膀或无穷复制的装饰林。
    - 昆虫与小动物按同一巨型生态尺度出现，可选择螳螂、蜻蜓、蝉、甲虫、蜜蜂、豆娘、蝴蝶、蛾、萤火虫、蜗牛或青蛙。昆虫躯干可如客栈、城门楼或渡船般庞大，一节足高过人物，一片翅能遮住院落，落足产生池塘般水纹或深过鞋面的泥坑；每只生物具有准确的足、翅、触角、口器、复眼、外骨骼和物种行为，不拟人化穿衣，不增加骑手装备，不无故攻击，也不把多种生物堆成怪兽群。
    - 物种特征在主题与全部画面中保持准确一致：昆虫均有六足，蜻蜓和豆娘有两对翅及短小触角，蝴蝶与蛾保留鳞翅，甲虫前翅形成鞘翅；荷叶具有盾状连接、放射叶脉和完整平滑的叶缘。不能先写四足后写六足，也不能为增强奇观添加物种本来没有的长触角、牙齿、锯齿叶缘或额外翅膀。
    - 巨型昆虫遭遇围绕一个清楚行为展开：螳螂转头审视，蜻蜓降落掀起气流，蝉鸣震动叶面，甲虫推开湿泥，蜜蜂采粉造成花粉风，蛾翼扑动遮住月光，萤火虫照亮归路，蜗牛缓慢压弯草茎。人物根据可见行为判断、避让、沟通、利用或帮助，而不是永远尖叫逃跑。
    - 天气是可作用的物理事件。暴雨时人物钻入荷叶或芭蕉叶覆盖整座驿亭的巨大阴影下，沿高如堤岸的叶脉躲避水流，在局部裂口用剑鞘、木楔或绳索改变一股支流并护住灯火；人物不能用肩膀或双手顶起整片叶缘。风暴中羽毛整体弯曲挡风，露珠沿叶脉滚落，花瓣被雨压低，所有力向、湿痕、飞沫和衣物贴合与风雨一致。
    - 可构思但不限于：一片完整巨叶如岛屿漂在江中，古装侠客躺卧或倚坐于叶面，随水流悠然远去；女侠在荷叶下护送密函避过箭雨般的暴雨；剑客沿鹤羽羽轴越过山口追兵；蒙面人藏入牡丹花蕊等待接头；蜻蜓落叶掀起翼风打乱对峙阵形；蝉鸣震动竹梢暴露伏兵方位；萤火虫冷光照出荒寺后的秘径；滚动露珠冲走腰牌；甲虫推果封住去路；初雪压弯梅瓣让两名对手被迫共同承重。例子只提供情境与因果方式，不作为重复套用的菜单。
    - 不让每次巨物相遇都成为挡路、暴雨或抢救。也可表现侠客在花冠中听雨候人、花粉轻落时安静饮茶、乘花瓣缓慢漂过护城浅水、在巨大荷叶下对弈、靠着羽轴吹笛、于露珠池边洗剑、借羽毛阴影午睡、观察萤火虫穿过荒寺回廊、发现秘径后的克制笑意，或敌友共同帮助生物完成普通行为，以温柔、诙谐、宁静和惊喜扩展武侠情绪温度。
    - 怡然自得的情境具有具体生活动作和细微环境回应：茶汤被叶影染绿，笛声让停栖昆虫转动触角，花瓣随呼吸般轻轻起伏，披风铺在羽片背风处，剑与斗笠安稳放在手边，露珠映出天空和古寺屋脊。人物仍属于江湖，但此刻没有追兵、伏击、兵刃相向或迫在眉睫的任务。
    - 漂叶游江是一种重要的闲适方向：完整叶片保持可辨物种轮廓，宽阔如江中岛屿，叶柄拖在水后，水流沿叶缘形成长尾涡和细小浪纹；一至数名古装人物位于叶心或主叶脉旁，躺卧、盘坐、饮茶、吹笛、看云或枕着包袱休息，入鞘兵器与斗笠安稳放在身边。人物不划桨、不奋力求生，也不把叶片改造成木船。
    - 为每个主题建立一条完整可见关系：突发情境可由季节与天气引发巨物变化，巨物变化改变路径或安全条件，人物行动留下结果，另一人物或生物立刻回应；闲适情境则由地点、光线、巨物的自然运动和人物生活动作互相影响，例如叶影移动、茶烟偏转、花瓣承重、笛声引来虫影或露珠被剑尖轻触后荡开水纹。
    - 人物行动必须具有明确支撑和当前目的，可踏叶疾行、急停回身、伏低藏踪、借叶脉变向、沿羽轴纵跃、以剑鞘撬动花瓣的一小处折边、用斗笠挡花粉、躲在羽轴背风侧、牵腕跨越裂隙、提灯寻路和护住密函；也可倚着叶脉坐下、在花瓣凹处煮茶、靠羽轴吹笛、擦拭入鞘长剑、铺开包袱分享干粮、枕臂看云或伸手接住花粉。人物只能影响脚边局部组织、细小支流或松动羽枝，不能靠身体力量抬起、顶住、拖动或改变整片山体尺度的花叶羽毛。
    - 每个人获得不同而必要的江湖角色，例如持信人、护送者、追踪者、伏击者、探路人、受伤剑客、游侠、女侠、僧人、药师、客栈主人、镖师或身份未明的对手。多人形成目光、手势、兵器方向与力的闭合回路，不让任何人只在背景观看，也不让所有人重复相同表情和动作。
    - 情绪来自事件进程并落实在可见身体细节。初遇巨虫可有屏息警觉、后撤半步、抬臂护住同伴和紧盯触角；确认无害后可有眉眼舒展、肩部放松、谨慎伸手和惊喜交换目光；风雨突至可有咬紧牙关、眯眼迎风、张口呼喊和压低重心；进入叶下避雨后可有急促喘息、忍俊不禁、湿发贴颊和如释重负。
    - 惊奇不等于统一张嘴，恐惧不等于僵直尖叫，宁静不等于空洞无表情。变化克制敬畏、孩子般好奇、专注判断、短暂慌乱、互相信任、顽强用力、发现路线的欣喜、脱险后的释然、面对壮景的寂静与对微小生命的体谅；表情强度匹配人物距离和事件危险。
    - 闲适人物可以松开肩颈、自然屈膝倚坐、以手托腮、闭目听风、低头浅笑、悠然饮茶、专注吹笛、赤手拨弄近处花粉或与同伴交换安静目光。放松不等于呆坐摆拍；呼吸、衣袖、茶烟、发丝、叶影和身边昆虫的细微变化共同证明时间正在流动。
    - 巨物尺度通过至少四类同场证据建立：人物全身与高过数倍身高的花蕊、叶脉或羽轴并列；古代亭阁、寺门或桥梁与主导巨物并列；露珠大过人物全身或形成池塘；花粉粒接近头颅、叶面绒毛如草丛、羽枝间距如巷道、昆虫足节如塔柱；局部组织对人物重量产生很小压痕，而主巨物整体不因人物发力移动。不得只用低机位仰拍、形容词或景深虚化假装巨大。
    - 人物与环境保持可信接触：鞋底只压低脚边一小片茸毛，手掌抓住叶脉表面凸棱，膝盖仅使花瓣局部出现浅凹，雨水沿衣袖滴落，单束细羽枝被身体分开后回弹，昆虫足落地引起远大于人物步幅的尘浪或水纹。人物不悬浮、不穿透植物，不站在无承重能力的纤细花蕊或羽枝尖端。
    - 国风来自古代空间、武侠调度、材质、色彩、服装与自然观，不依赖堆叠灯笼、牌楼、祥云、龙凤和书法。男性与女性均可穿名称清楚的交领长衫、圆领袍、窄袖短褐、曳撒式长袍、披风、护腕、腰带、长裤和布靴，外加一件斗笠、包袱或旧斗篷；内外衣层、系带、衣襟、袖口和下摆连续可信，不混搭其他朝代、现代汉服影楼造型或仙侠盔甲。
    - 男性头发束成古代发髻或以头巾、幞巾固定，女性使用盘发、高髻、低髻或长发束起，发式适合奔跑和打斗；灰发与白发仍按古代方式束起。不得出现现代短寸、齐肩沙龙发、高马尾、现代刘海、染发或披散却纹丝不乱的造型；人物发式不用意义含混的自造髻名。
    - 古装具有轻重分明的飘逸层次：贴身中衣与腰带稳定身体轮廓，外层长衫、披风、裙摆、袍袖、窄幅飘带、斗笠垂纱或剑穗承担动势。丝、纱、绫、薄麻和较厚棉布各自呈现不同重量、折痕、透光与回落速度，不把所有衣料画成同样轻薄的无重量长纱。
    - 发式整体固定在发髻、头巾或束带中，只让鬓边碎发、颈后发丝、发辫末端或少量松开发束随动作飞舞。风向、发丝、衣摆、飘带、剑穗、花粉和落花保持同一受力逻辑；头发不脱离头皮、不无限延长、不变成烟雾或触手，也不遮住双眼、持械手和兵器轨迹。
    - 每个主题选择一种主要动势来源，例如山口横风、竹林穿堂风、昆虫翼流、人物急停转身、轻功起落、花瓣下坠、叶片回弹、雨幕斜落或水面上升气流。动势已经作用于人物与环境，在衣袂、发丝、花叶、尘沙和水滴上留下方向一致但幅度不同的结果；不能让衣服和头发无风自动漂浮。
    - 兵器和随身物只使用古代武侠世界可成立的剑、刀、长棍、短杖、剑鞘、弓、箭囊、飞镖、绳索、斗笠、油纸伞、灯笼、葫芦、布包、药囊、腰牌、竹筒密函或木匣。每件物件有唯一主人、携带位置和当前任务；兵刃轨迹清楚，非攻击时收入鞘中，不悬空、不穿过巨物或人物身体。
    - 视觉固定为受胡金铨武侠电影启发的原创真人实拍院线静帧：山林与建筑先建立空间，人物从门、柱、竹、岩、花叶和羽枝间进入调度；克制的静止、突然的短促动作、横向移动、纵深伏击、戏曲化手眼身法和空阔自然共同形成节奏。只提取这种高层电影语法，不复制《侠女》《龙门客栈》《空山灵雨》等现有作品的角色、服装、布景、动作或镜头。
    - 东方水墨意境只转化为空间组织与观看节奏，不把成片变成水墨画。以天空、云海、山雾、静水、雨幕、白墙、空院、未照亮的林间和宽阔地面形成真实摄影中的留白；让人物、古代建筑和巨物集中在有限区域，空处承接视线、风向、追兵来路、逃生方向或人物未说出的心理压力。
    - 留白具有真实空气透视、天气层次、胶片颗粒和现场光，不出现宣纸底色、绢纹、墨晕、皴法、毛笔笔触、题跋、印章、国画边框或绘制人物。画面始终是有真实演员、实体古装、实景山林、搭景建筑和仿生巨物的35毫米彩色武侠电影剧照。
    - 巨型花叶、羽毛和昆虫不必填满整个画框，但必须呈现足够长的连续结构来证明体量。允许一条叶缘、大片羽枝、一整簇花蕊、跨越林梢或可选屋脊的翅影，以及被雾遮去一部分的巨大轮廓越出画框；越框处与人物及普通自然环境或可选建筑参照同场并列，保留安静空域，使奇观服从武侠悬念而不是变成拥挤的生物图鉴。
    - 采用二十世纪六七十年代华语武侠片的35毫米胶片质感、实体古装、真实演员、山林外景、搭建的古代建筑、实体巨型花叶羽毛和仿生昆虫。色彩保持饱和但不艳俗，日光、火光与雨雾具有胶片宽容度，动作边缘可有轻微运动模糊；不使用数字锐化、现代商业广告光、仙侠粒子、游戏渲染、动漫脸、纸面古画或现代电视剧磨皮。
    - 色彩从具体季节和生态提取，使用二至四种主色与一种小面积强调色，例如雨荷的黛青、灰绿、月白与朱砂；秋羽的赭石、枯金、墨黑与石青；夜花的靛青、藕粉、银白与萤火黄。色彩来自真实服装、植物、土石、木构、天空和现场光，不因为追求水墨意境而退化成黑白灰或后期墨色滤镜；避免无来源霓虹、全画面金光、彩虹饱和与通用青橙电影调色。
    - 光线必须有自然来源和天气逻辑：叶片透下的绿色散射光、花瓣反射的暖色柔光、雨幕后的天光、月光穿过羽枝的条纹、萤火虫近处微光、云隙日光或雪地反光。光线揭示人物表情、巨物纹理、昆虫轮廓和行动路径，不用无来源仙气遮蔽物理关系。
    - 动感强弱匹配情境。追逐、格挡和翼风场景可让披风与裙摆形成清楚弧线，袍袖和发丝出现短促滞后；饮茶、吹笛、观云和休憩场景只用缓慢抬起的衣角、轻摆剑穗、掠过脸侧的发丝和间歇飘落的花瓣表现微风，不把闲适变成风暴。
    - 漂叶游江的动势来自水流而非人物发力：叶片整体缓慢旋转或顺流平移，人物衣角、裙摆、发丝和剑穗只受江风轻抬；叶柄后的尾涡、水面反光、漂过的花粉和远处巨型叶影共同显示安静移动，不添加激流、翻覆、追兵或突然危险。
    - 场景具有前景巨物或古代建筑切边、中景武侠人物行动和背景生态、驿道或寺观延伸三个层次，同时保留显著而安静的真实环境留白供天气、潜在追踪方向或远景呼吸。门框、窗格、柱列、竹干、巨型花蕊和羽枝可形成多重框景，但人物当前支撑、兵器轴线、危险来源、逃生方向和主要生物身体必须可辨。
    - 每个主题固定季节、时刻、天气、地域生态、主导巨物、昆虫或动物状态、决定性事件、人物身份、衣着、随身物件、角色分工、情绪转折、尺度比、视觉谱系、色板、光源和核心构图关系。
    - 主题组整体均衡变化完整花冠与花蕊世界、叶片与叶脉世界、羽毛结构、果实种子、草穗真菌及昆虫栖息地，不让荷叶避雨、雨后叶面探路或同一种植物连续主导。完整花朵本身应成为可进入、可穿行、可承重和会随天气变化的空间，而不只是叶片旁的点缀。
    - 主题之间变化生态物种、古代地点、天气机制、生物行为、江湖关系、任务目标、危险程度、合作方式、情绪温度、古装轮廓、兵器、色板和观看尺度，不只替换花名或昆虫名称。人物目的变化送信、护镖、追踪、逃亡、接头、寻药、还剑、赴约、试探、过关、救人，也变化饮茶、听雨、吹笛、对弈、赏花、观云、洗剑、分享干粮和短暂休憩；不让现代职业、科学考察、紧张任务或同一种正邪对峙主导整组。
  frames:
    common:
    - 每幅画面独立完整地呈现同一主题中已经发生的决定性事件，不组成前后连续故事。固定人物身份、巨物物种、季节天气、生物行为、衣着、随身物件、角色分工和因果结果；变化相机方位、景别、前景遮挡、纵深关系、留白、目光线路和受力细节。
    - 每幅画面都完整展开地点与天气、主导巨物的物种结构、事件引发的环境变化、每个人的外貌服装、逐人的支撑动作与表情、人物之间的回应、至少三项尺度证据、相机位置与景别、前中后景、色板、光源和材质反应。不能用“同前”“仍然如此”或概括性短句省略这些可见事实。
    - 同一主题的不同画面具有不同叙事视觉重点，可分别突出生态全貌、人物协作、昆虫行为、天气机制、危险距离或脱险后的情绪联系。至少改变机位高度、观察侧别、景别、前景框景、主体在画面中的占比、主要尺度参照、焦点和留白形状中的四项；不能只是交换近义词、调整句序或重复同一构图。
    - 每幅画面首先让人相信人物已经进入巨物国般的连续自然世界，而不是在普通古代地点旁遇见一个放大的道具。前景展示人物脚边的巨型表面细节，中景展示正在穿行的花瓣坡、叶脉岭、羽轴脊、菌伞原或昆虫足下区域，远景继续延伸同尺度的巨茎、叶海、花蕊林、露珠湖、羽枝峡谷或种壳山；三层不能退回普通尺寸树林和庭院。
    - 每幅画面中，人物完整头脚高度只占主导巨物可见连续跨度的约十五分之一至三十分之一；主巨物的一个结构单元，如单片花瓣、主叶脉、羽轴横截面、昆虫一节足或翅片宽度，也明显大于人物全身。不得把花瓣、叶脉、羽轴或昆虫足缩成人物可抱住、顶起或当作普通家具的尺寸。
    - 人物、巨物局部结构和巨物整体位于相同或相近摄影距离。人物自己的剑、斗笠、灯笼、竹筒或包袱提供普通人类尺度；花粉、叶毛、羽枝、种壳纹路、露珠边缘或昆虫足痕提供中间尺度；连续花冠、叶海、羽轴、菌伞或昆虫身体提供最大尺度。只有主题本来位于巨人遗迹时才使用巨型门洞、柱础、瓦片或桥栏，不强制任何建筑。
    - 使用环境大全景或宽阔中远景建立压倒性尺度，人物以小而清楚的古装色块和动作剪影出现。不得用贴近镜头的人物大前景搭配远处巨物，不采用把人物拍成半身或近景、却裁掉巨物连续结构的构图；人物面部情绪可由清晰头向、肩颈张力、手势和衣袂辅助，不为看清脸而破坏比例。
    - 严格保留要求的人数与每个人的独立身体。每人只有一个头、一个躯干、两臂两腿，肢体从肩或髋连续连接；手脚、服装和头发不与叶脉、花蕊、羽枝、昆虫足或其他人物融合。
    - 每个人正在做一件与当前情境直接相关的事，脸、视线、手部任务、脚下支撑、躯干朝向和重心彼此相容。紧张场景中的动作已经改变环境或帮助同伴；闲适场景中的身体重量、茶具、乐器、入鞘兵器、食物或衣物仍与巨物形成可见接触，并留下压痕、轻微弯曲、茶烟、花粉流、水纹、移动叶影或停栖生物的回应。
    - 人物表情必须各不相同且与角色认知一致：先发现危险者更警觉，承重者表现用力，受保护者同时紧张与信任，确认安全者露出克制释然。以眉、眼、嘴、呼吸、肩颈张力和头部朝向形成可见差别；至少一个清楚的目光或手势把人物彼此连接，另一条目光连接主要昆虫、天气来源或路线。
    - 武打场景停在决定性的可读瞬间：起跳前压低重心、借叶脉蹬地、空中短促转身、落在羽轴时屈膝卸力、剑鞘格挡、隔着花蕊互相试探或收势后回望。动作体现戏曲式手眼身法和明确节拍，但四肢关节、兵器主人、攻击方向、承重点与落点都可信；闲适场景无需人为加入拔剑、追兵或戒备姿态。
    - 衣袂与发丝为动作延迟提供第二节拍：身体已经急停而披风仍向前掠，人物刚转身而裙摆沿圆弧展开，落地屈膝时袍袖和发辫末端仍在下落，安坐后衣角才被微风轻轻抬起。运动轨迹围绕现有人体展开，不复制衣袖、裙摆、飘带、头发或兵器，不把飘动织物误认成额外肢体。
    - 昆虫或小动物保持准确身体结构、重心和落足点。翅膀运动带来相符的空气、花粉、雨滴或衣物反应；足节压弯植物并投下接触阴影；复眼、触角和口器不变成人脸，不添加怪兽牙齿、额外肢体或恶意红眼。
    - 避雨画面同时显示降雨来源、承雨表面、叶片或羽毛的弯曲、积水与排水方向、人物所在的干湿边界及身体回应。巨大荷叶遮雨时，叶柄和主脉承担重量，叶缘因积水下垂，人物在叶下扶持、导流、护物或彼此靠拢，而不是在晴天举着一片无来源叶子摆姿势。
    - 巨型花朵画面保留花托、花瓣层次、花蕊、叶或茎的连续归属；完整人物小于单根主要花蕊，单片花瓣形成跨越视野的山坡或谷壁，完整花冠的其他部分继续进入远景和云雾。人物踩踏只造成脚边浅凹，天气和花朵自身运动才造成花瓣整体弯曲；花瓣不变成丝绸床、普通屋顶、建筑石板或抽象彩云。
    - 巨型羽毛画面清楚区分羽轴、羽片和羽枝。羽轴横截面高过人物，长度跨越桥谷或整座院落；人物可沿羽轴表面行走、躲在弯曲羽片背风侧或拨开一束较细羽枝观察，但不让羽毛独立飞行、变成完整翅膀、从人物身体长出或承担超出结构能力的重物。
    - 至少使用四项同场尺度证据：人物身体与高过自身的巨物局部结构直接并列；人物自带物、巨物表面细节与巨物整体形成三级对比；人物接触只造成局部微小结果；远景继续出现同一巨人国尺度的生态结构。尺度证据必须直接可见，不用“大得惊人”“极其渺小”等形容词代替。
    - 全景或环境中景用于先建立古代地点、巨物尺度和伏击路线；低机位贴近叶面可强化结构高度；略高视角可展示叶脉、院落或栈道调度；透过门窗、竹林、花蕊和羽枝的侧向中景呈现对峙与短促动作。使用克制的24–50毫米等效视角、较深景深和清楚空间层次，避免人脸特写、昆虫复眼特写、无环境微距、鱼眼畸变、炫技旋转机位或极端景深模糊。
    - 构图借鉴中国山水的可游、可望、虚实相生与层层递进，但使用摄影透视和真实景物，并具有胡金铨式武侠空间调度：近处门柱、竹叶或巨物结构遮露人物，中段动作形成叙事眼，远处驿道、寺院、雾、花影、叶海或羽枝暗示另一条进入路线。人物可被建筑和自然短暂遮挡，但脸、兵器、承重脚与动作结果不能同时消失。
    - 同一主题的不同画面改变留白的形状、位置与叙事功能：可让大面积天空压在人物上方，让雾谷或静水横向展开，让空院、白墙或暗林占据一侧，或让远处空路成为目光终点。留白不能被随机飞叶、粒子、鸟群、云纹、字幕和无关道具填满，也不能成为没有地面与空间边界的白色摄影棚。
    - 允许高空俯视、鸟瞰或接近垂直的顶视构图，特别适合漂叶游江、花冠谷地、叶脉路线和露珠湖。高空画面同时显示巨物的完整或接近完整轮廓、人物在其表面的微小位置、水流或地形路线及宽阔留白；人物不靠近镜头放大，古装颜色、躺卧或盘坐姿态、斗笠和入鞘兵器构成人类尺度标记。
    - 人物古装保持完整、连续、适合行动且属于同一架空明代语汇。湿衣、斗篷、袍袖、裙摆、腰带、包袱和兵器穗随风雨与武打动作产生可信重量，不遮住关键表情、持械手、脚下支撑或同伴间接触。
    - 构图保留一条主运动曲线，可由人物转身、扬起披风、展开裙摆、飞舞发丝、斜落雨线、弯曲叶脉或掠过的花瓣共同形成。脸、眼神、持械手、兵器方向和承重脚位于相对清晰的焦点，衣袖外缘、裙摆末端、发丝与落花可出现克制的胶片运动模糊，不能把整个人物抹糊。
    - 真人实拍武侠视觉贯彻整幅画面：35毫米胶片颗粒、皮肤、旧织物、木石建筑、植物表皮、羽毛和仿生昆虫处于同一摄影现实。不得用发光粒子、塑料花、数字仙气、游戏渲染、动漫脸、现代电视剧磨皮或泛化仙侠特效替代巨物生态和武侠调度。
    - 画面不依赖可读文字、题字、招牌、界面、字幕、图注、边框或水印解释故事。地点、季节、尺度、危险、人物选择和情绪转折都由可见环境、动作、表情和物理结果直接表达。
requirements:
  content_levels:
  - aesthetic
