- id: seed-05
  themes:
  - 场景：月球或火星定居点设施。
  - 环境构想：月尘去污凹间：墙面支架、滞留灰尘、脱弃的工作衣层、格栅地板和冷色去污光。
  - 当请求的总人数为一名成年人时，动作构成为：可穿戴刺激器，控制部件可见且快速释放装置无遮挡
  - 当请求的总人物构成包含两名或更多成年人时，动作构成为：带衬垫的腕部或踝部束缚，结合伴侣的手动刺激
