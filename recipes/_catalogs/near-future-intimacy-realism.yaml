- id: seed-02
  themes:
  - 场景：工业、工坊或轮班生活室内。
  - 环境构想：下班后的胶囊全息：工厂睡眠舱、完整光身体、折叠铺位、工作制服、处理器箱和走廊噪声。
  - 当请求的总人数为一名成年人时，动作构成为：手指内部刺激，同时另一只手进行外部刺激
  - 当请求的总人物构成包含两名或更多成年人时，动作构成为：双方各自自慰，每名成年人都明显刺激自己的身体部位
