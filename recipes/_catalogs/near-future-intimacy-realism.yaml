  - 场景：地面交通或货运交通工具的私人舱室。
  - 环境构想：卧铺列车稳定床位：代理体与本地伴侣使用卧铺导轨、带雨痕的玻璃、行李和运动补偿。
  - 当请求的总人数为一名成年人时，动作构成为：一只手明显握持的小型非阴茎形外用振动器
  - 当请求的总人物构成包含两名或更多成年人时，动作构成为：口交，施予者、接受者、嘴、手、膝盖和支撑清楚明确
