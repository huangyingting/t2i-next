- id: seed-06
  themes:
  - 场景：海底、气候控制或声学栖居空间。
  - 环境构想：海底栖居舱压力室：骨盆鞍座和墙面握把在承压肋架、湿装备、冷凝水和过滤后的蓝绿光之间运作。
  - 当请求的总人数为一名成年人时，动作构成为：通过穿在身上的压力服异步回放触觉接触
  - 当请求的总人物构成包含两名或更多成年人时，动作构成为：手掌拍打、软拍板或柔软鞭具与臀部或大腿外侧的接触
