  - 当请求的总人数为一名成年人时，动作构成为：用一个带衬垫的腕部或踝部束环进行自我束缚，另一只手保持自由，能够同时操作刺激与释放
  - 当请求的总人物构成包含两名或更多成年人时，动作构成为：由伴侣控制的外用振动器、可穿戴刺激器、套筒或触觉代理体动作；对于一名女性和一名男性，使用小型非阴茎形振动器，由一名伴侣清楚可见地握在手中，贴着女性的外部身体部位
