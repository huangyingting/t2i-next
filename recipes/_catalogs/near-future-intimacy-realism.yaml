id: near-future-intimacy-realism
entries:
- id: seed-01
  themes:
  - 场景：都市家居或短住房间。
  - 环境构想：雨中延迟全息汽车旅馆：破旧汽车旅馆中的有色光远程伴侣，周围有挂雨的玻璃、发射器轨道、潮湿毛巾和不稳定延迟。
  - 当请求的总人数为一名成年人时，动作构成为：手指外部刺激，保留从肩部到指尖的连续路径
  - 当请求的总人物构成包含两名或更多成年人时，动作构成为：伴侣引导的自慰，另一名成年人主动控制、触摸响应式技术，或作为该技术的具身形象
