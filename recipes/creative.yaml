id: creative
description: '创作多样化、具有获奖水准的超写实六区域广告概念板。每个主题都将同一组反复出现的微缩成年人物置于真实的日常环境中，其中一个或多个熟悉的物件显得庞大无比。人物从外部与完整的物件互动，绝不居住在物件内部。设想这些成年人确实以微缩尺度生活在人类的日常用品之间，而不是来参观某个孤立的巨型道具。


  这是一份非叙事性的视觉创意简报。每个主题都需要一个一眼就能看懂、并在六幅图像中逐步丰富的创意。仅有巨大的道具、繁复的背景设定、性感姿势或精美的材质研究，还算不上一个创意。'
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 人物与内容级别：- 优雅、适合公开刊载的身体感知与互动。
    erotic:
      shared:
      - 人物与内容级别：不得将要求的内容强度淡化成中性图像。
    hardcore:
      shared:
      - 人物与内容级别：不得将要求的内容强度淡化成中性图像。
      - 人物与创意：解剖结构、接触、物理关系以及高概念命题必须保持精确。
  themes:
    common:
    - 画面构成：一个占主导地位的熟悉物件，或两到五个熟悉物件构成的协调组合。
    - 画面构成：每个主题、画帧和区域中，所有人的身体始终位于所有物件之外。
    - 画面构成：每个重要物件的完整形态和日常身份立即可辨。
    - 画面构成：人物主动与特定物件或物件关系互动，动机可见。
    - 画面构成：一个出人意料的命题具有六个视觉上明显不同的例证。
    - 构图：每个画帧呈现一个完整的竖幅 2 列 3 行网格。
    - 画面构成：图像内没有标题、图注、区域标签、文字排版、标志、水印、边框文字、界面元素或解释性图示。
    - 主题多样性：单物件与多物件组合形成均衡变化，不拼凑无关物件。日常用途覆盖梳洗、缝纫、紧固、文具、包装、厨具、衣物、玩具、电子产品、家具或运动用品等不同类别。
    - 主题多样性：常规物件尺度从指尖、口袋、手掌、前臂、躯干延伸至家具、家电或更大尺度，包含明显大于手掌的物件，主导材质体系与外部轮廓各有区别。
    - 主题多样性：微小配饰、紧固件、弹性环、细长工具、包装、抛光金属，或仅便于抓握、按压、跨坐、摩擦、平衡的物件不主导整组主题。
    - 单物件与多物件模式：单物件主题赋予一个熟悉物件鲜明而标志性的轮廓，并从其日常行为中提炼出多种不同后果。
    - 单物件与多物件模式：组合主题使用两到五个能合理共存于同一真实场景的物件，例如早餐桌、针线盒、浴室台面、书桌抽屉、洗衣区搁架、工具箱、野餐毯、购物袋、工作台、床头柜或其他日常环境中的物件。这些例子不是供逐项选取的菜单。物件必须彼此作用，或为人物提供不同的路线、工具、危险、资源、社会角色或尺度参照。不要散放无关的巨型道具作为装饰。
    - 单物件与多物件模式：微缩人物应呈现为真实日常环境中的小居民。他们可以在物件之间移动，跨物件协调行动，用一个物件改变另一个，或利用物件之间形成的间隙、阴影、反射、摩擦、流动、杠杆作用或日常运作。外表面可以成为通路或工作区，但每个物件都必须保留其熟悉而完整的身份。
    - 概念因果：熟悉的物件或组合变得庞大，其日常行为或相互作用造成不可能的视觉后果，位于外部的人物以这种布置特有的方式追求具体愿望。
    - 概念因果：三个层次共同可见：
    - 概念因果：1. 物件本真特性——特定布置的可辨认用途、运动、故障、痕迹、变化、材质行为、文化联想或关系。
    - 概念因果：2. 人物切身诉求——明确想要、冒险押上、交换、隐瞒、庆祝、修复、表演、保护或选择的事物。
    - 概念因果：3. 概念驱动机制——将物件特性与人物诉求绑定的不可能因果。
    - 概念因果：图像本身揭示三个层次，物件与人物均不可替换为泛泛摆设，不依靠图注、可读文字、数字、日期、屏幕内容、标签或背景设定解释。
    - 创意驱动机制的多样性：自由选择主要概念驱动机制。可能性包括日常使用的碰撞、视觉隐喻的具象化、不可能的产品功效、尺度喜剧、物件角色化、协作手工、家务动作化作天气、强制透视错觉、物质交换、角色互换、私人行为转化为公共服务、巧妙的恶作剧，或同样有力且为该物件特有的发明。这是灵感，不是供逐项选取的菜单。
    - 创意驱动机制的多样性：各主题采用实质不同的主要驱动机制，不让竞赛、测试、经济体系、许可制度、法庭、拍卖、等级体系、仪式或典礼主导整组概念。争夺控制权、赢得亲密、交换脆弱、互相救援、为监视而表演或共同操作机器等关系模式形成变化。
    - 创意驱动机制的多样性：改变情绪温度，例如俏皮、温柔、华丽、淘气、冷面幽默、荒诞地务实、欢庆、令人不便、诱惑、诡异、带来转变，或其他贴合物件的基调。不要让每个主题都肃穆、对抗、仪式化、危险，或都围绕证明自身价值展开。
    - 创意表现：无需文字即可读懂物件特有的日常身份、转化后用途、双人切身诉求与真实材质因果，六种不同图像带来的惊喜不止于尺度或情色接触。
    - 创意表现：人物不只是倚靠巨物摆姿势，六图不只是部件、纹理或机位巡览。技术操作、仪式包装、可移植的竞赛或市场、随机天气、鸟影、起重机及无关机器不替代物件本身引出的视觉命题，感官诱惑或标题也不替代创意。
    - 日常使用的碰撞：物件必须主动发挥作用，不能只是只有微缩人物才会操作的废弃纪念碑。在六个区域中的至少两个区域里，外部常规尺度的手、身体、配套物件、环境力或真实机构，以一眼就能认出是日常使用的方式使用该物件。微缩人物始终留在外部，利用、改变方向、配合、打断或适应由此产生的力。
    - 日常使用的碰撞：让介入方式贴合物件本身：外部常规尺度的使用者或作用力可以转动、折叠、倾倒、擦拭、卷绕、盖印、挤压、摇动、滚动、扣紧、穿戴、投掷、插接、充气、切割、打开、关闭，或以其他符合设计用途的方式使用物件。至少一次日常使用的碰撞必须成为概念板最有力的视觉包袱。在组合主题中，让一个物件的日常使用明显改变另一个物件以及人物。不要在不同主题中将同一种碰撞固定放在同一个区域。
    - 仅限外部的尺度契约：每个人都位于所有物件表面朝向周围环境的一侧。人物可以横越外表面，在物件旁边或之间工作，操作从外部能够触及的部件，乘坐外部运动部件，改变向外流动的方向，或回应释放到周围空间的效应。
    - 仅限外部的尺度契约：绝不将任何身体置于物件内部、空腔或容器空间内、外壳下方、剖切面后方，也不得越过通向内部的边缘、口部、接缝、舱口、口袋、袖筒、夹口间隙、开口或门槛。绝不使用内部视角。对于袋子、盒子、容器、衣物、家电、车辆及其他具有包围结构的物件，要么保持物件关闭，要么让每个人都明显远离开口并留在其外侧。日常使用绝不构成进入内部的许可。
    - 仅限外部的尺度契约：不要将物件内部改造成建筑、房间、洞穴、隧道、舱室或自成一体的栖居地。物件外部及多个物件之间的普通环境可以充当微缩地形，但不得消解成无法辨认的泛化景观。打开、剥开、破损或切开的物件可以露出材质截面，但任何人都不得进入或占据暴露出来的空间。
    - 仅限外部的尺度契约：单物件主题中，至少三个区域要展示其完整或接近完整的外轮廓。组合主题中，至少三个区域要展示完整的主要物件及至少一个能清楚辨认的次要物件。加入熟悉的外部尺度参照，使物件身份、物件之间的关系以及人物与物件的比例一目了然。
    - 六个例证，而非六个部件：六个视觉巧招是同一个命题的六个例证，而不是部件巡览，每个都能独立作为广告主视觉，同时明显属于同一概念。
    - 六个例证，而非六个部件：六个视觉巧招应包含以下功能，顺序不限：
    - 六个例证，而非六个部件：- 一幅能立即传达创意的标志性完整物件图像或协调的物件组合图像；
    - 六个例证，而非六个部件：- 一次来自外部常规尺度、且贴合物件的日常使用碰撞；
    - 六个例证，而非六个部件：- 一次亲密的双人协商，双方各自的手势和回应清晰可见；
    - 六个例证，而非六个部件：- 一次对残留物、包装、反射、阴影、声音、热量、气流、废弃物或其他次生效应的巧妙利用；
    - 六个例证，而非六个部件：- 一次角色互换、视角逆转或权力转移；并且
    - 六个例证，而非六个部件：- 一个无需依赖时间顺序就能改变观众对命题理解的点睛结果。
    - 六个例证，而非六个部件：至少四个视觉巧招必须改变人物的目标、角色、策略或后果，而不只是改变接触的部件、机位、姿势或材质状态。即使移除全部性感内容，至少两个仍须具有吸引力。
    - 六个例证，而非六个部件：避免让三个或更多视觉巧招重复同一种互动模式：抓握借力、将皮肤压在表面上、在部件上保持平衡、引导液体流过身体、将残留物转移到皮肤上、攀爬、斜倚、将表面当作家具，或读取测量值。
    - 主题设计：熟悉物件或协调组合具有庞大完整的外形，人物位于外部；物件本真特性、人物切身诉求、概念驱动机制与视觉因果关系明确。
    - 主题设计：恰好六个不同的视觉巧招各具人物目标或角色、具体外部动作、物件响应与可见后果。媒介、配色、照明、材质表现和视觉节奏构成统一广告风格，创意与两人的诉求可由画面直接理解。
    - 人物与内容级别：严格使用所要求数量的成年女性和成年男性。网格中的重复视图不增加人物数量。在主题的全部六个区域和所有画帧中，保持每个人明确的成年年龄、面孔、体型、头发、身体细节和造型一致。
    - 人物与内容：用既定的可见内容要求诠释命题，不得让内容强度决定物件选择或替代创意。
    - 明亮洁净的色彩标准：使用明亮、洁净的高调色彩，让皮肤、物件、服装和背景清晰分离。优先采用清新的白色、明亮的日光、精致的粉彩、鲜艳的物件色彩、干净的原色以及有意设计的互补色对比。饱和度可以大胆，但必须保持高级、自然并符合材质特性，而非霓虹或人工合成感。
    - 明亮洁净的色彩标准：在较为简洁且形成对比的背景上，为物件布置赋予一眼可读的主导色彩关系或图形纹样。物件允许时，优先采用彩色珐琅、染色塑料、涂漆、纸张、织物、食物色彩、半透明色彩或其他真实的明亮表面处理。对于天然中性色的金属、玻璃、木材或白色物件，使用大胆的周围色块和清晰的轮廓光，而非灰上加灰的写实处理。
    - 明亮洁净的色彩标准：避免让不锈钢灰、米色、黑色、棕色、蒸汽白或低饱和度环境色主导概念板。不要让浅色皮肤、浅色服装、浅色物件和浅色背景处于同一色调区间。在保留所要求内容级别的同时，为人物配置能使身体与主体物件及背景都清晰分离的服装或配饰。
    - 明亮洁净的色彩标准：像精心制作的商业桌面广告一样为概念板布光：宽广柔和的主光、清晰受控的高光、保留可见细节的通透暗部，以及将每个微缩身体牢牢落在表面上的小范围接触阴影。保持背景简洁，并在有助于画面时使用色块。每个主题可以选择不同的明亮配色，但同一画帧中的六个区域必须属于同一套洁净的广告视觉体系。
    - 摄影材质标准：以高品质实拍摄影呈现不可能的景象，使重力、尺度、光学、皮肤、纤维、颗粒、反射、阴影、接触形变、外部纵深线索和材质微观纹理可信。即使用移轴对焦夸大尺度，也要保留真实的面孔与解剖结构。使用一套协调一致的广告视觉语言，同时提供足够的构图对比，使网格富有活力。避免奇幻薄雾、装饰性杂物、卡通物理、内部剖视、泛泛的奇观，以及六个几乎相同的视图。
