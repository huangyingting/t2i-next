id: shanhaijing-colossal-divine-beast
description: 创作以《山海经》东方神话为根基的原创真人外景电影画面，唯一主导神兽为【神兽】。指定神兽以天地级巨物姿态真正进入古代东方山河：镜头像真实摄影组在自然天气中偶然捕捉到无法完整入镜的生命体，而不是完整展示怪兽的游戏海报。神兽轮廓优美恢弘，形态遵循传统核心特征，毛发、羽毛、鳞甲、骨角与皮肤具有真实重量、缺陷和受光差异；它与厚重云海、天光、山河和水域发生可追溯的大尺度物理作用。画面以远处极小古人、舟船、山门或楼阁作为尺度参照，形成凡人如尘、神兽如天的关系。整体采用自然曝光、真实空气透视、克制色彩和统一光场，呈现可信的东方神话真人电影摄影。
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 所有可见人物均为成年人，完整穿着符合古代身份、天气和地形的服装；人物与神兽之间表现敬畏、观察、祭告、守望、迎候或安静对视，不呈现情色、血腥伤害、捕食成功或残缺身体。
      - 每幅成片明确采用真实外景摄影语汇：自然天气中的现场底片、单一主光源、有限动态范围、轻微镜头柔化、细腻胶片颗粒、真实空气雾化、符合距离的景深与局部运动模糊。神兽、人物、建筑、云和水处于同一曝光、白平衡、颗粒与空气层次中。
      - Theme 与 Frame 只写实际可见的正向画面事实。全部排除项仅用于内部选择，不在成片文本中复述“没有、不出现、绝无、并非、而非、拒绝、避免”等合规证明，也不列举画面外不存在的错误风格、错误生物、错误材质、错误肢体或特效。
      - 未指定人数时，成片中恰有一名完整可见的极小古人，称为成年古人、成年男子或成年女子；人物身份通过远景可读的古代发式轮廓、外层服装、鞋履、器物和行为表达，面部合并为自然的小尺度明暗。空旷区域只描写真实可见的地形、云雾、建筑、水面与光影。
      - 成片全文使用流畅简体中文，镜头单位写“毫米”，色名使用深琥珀色、象牙白、灰青、青黑、暗金、赤金等中文词；交付前把材质、浪峰、构图、镜头与色彩中的拉丁字母词全部改写为准确中文。画外延展、云后延续和人物视线各选择当前画面最清楚的一项可见证据，用单一确定句写出具体结构、方向与对象；成片不照抄备选项，不使用“或、而非、并非、不是”构成选择或排除句。应龙羽翼的根部结构称为翼根，羽毛中央支撑称为羽轴。
      frames:
      - 每幅画面是独立可渲染的16:9东方神话电影静帧，完整交代指定神兽、云海、环境作用、极小人物尺度参照、相机角度、光源、色板与材质。
  themes:
    common:
    - 每个主题只表现同一只指定神兽，不增加第二种神兽、西方龙、普通巨兽、坐骑、神仙军团或无关怪物。多首、多尾、多翼或多足只在指定神兽传统形态本来如此时出现，并保持准确固定数量与连接关系。
    - 输入只指定一种神兽时，全部主题围绕该神兽变化场景；输入为与主题数量相同的神兽列表时，按输入顺序逐项分配，每个主题恰好使用一种且不重复、不串换，Theme 标题、premise 与两幅 Frame 都明确写出当前神兽名称。
    - 先依据指定神兽的传统核心描述建立一套清楚稳定的解剖设计，再贯穿主题全部画面。不得为套用通用美兽模板擅自增加不存在的角、翼、鳞、毛、眼、头、足、尾或人脸；帝江等无面目形态不强加眼睛，相柳保留有秩序的九首结构，应龙才具有符合东方龙体的翼。
    - 指定神兽为九尾狐时，固定为一首、四足、九条各自连接尾根的长尾和真实狐科骨骼，银白至暖白长毛随肌肉与风向自然分束，九尾以不同远近层次延伸并保持数量可追溯。
    - 指定神兽为白泽时，固定为一首、四足、一尾、一对自然骨角的白色古老瑞兽，采用鹿与大型猫科之间的厚重四足比例、分层白色鬃毛和可信关节受力，同一主题保持这一原创解释。
    - 指定神兽为毕方时，固定为一首、长喙、一条承重长腿、一对羽翼和一尾的鹤形神鸟，灰蓝与青黑羽毛带少量暗赤金色，单腿在飞行、停驻和收拢姿态中始终保持准确连接。
    - 指定神兽为穷奇时，固定为一首、四足、一尾和一对羽翼的巨型虎兽，头颈统一称为“虎首”和“虎颈”，虎科吻部、耳廓、肩背、脊柱与足爪承重真实，羽翼从肩胛后方连续生长，深灰虎纹、暗褐毛发和克制冷金羽缘保持同一设计。
    - 指定神兽为夔时，固定为一首、无角、单足、短尾的青黑巨牛形神兽，厚重胸肩、牛首、湿润青黑粗皮、短硬牛毛和唯一承重后肢形成稳定轮廓；近景材质只描写粗皮、牛毛、水痕、泥痕和关节皱褶，风雨与低沉水波表现其力量。
    - 指定神兽为应龙时，所有输出统一称为“应龙”，形态表述固定使用“具有一对羽翼的东方龙体”：一首、修长龙首、骨角、长颈、四足、单尾与层叠真实羽片构成同一连续骨骼，对头部统一称为“龙首”。每个 Theme 与 Frame 都写出确定句“应龙固定为一首、四足、单尾和一对羽翼”。一对羽翼按镜头方位分别称为“近侧翼”和“远侧翼”；近侧翼写成“粗壮翼骨、羽轴、主飞羽、次级飞羽和覆羽逐层展开”，远侧翼用连续羽缘交代位置与延展方向。
    - 传统记载存在多种解释时，选择一种最适合真人电影实体化且内部一致的原创解释，不混合互相冲突的版本，不复制现有影视、游戏、插画或雕塑中的具体造型。
    - 指定神兽首先必须好看。美感来自舒展恢弘的整体轮廓、准确骨骼与肌肉支撑、克制而高贵的姿态、清楚的头颈躯干关系、具有节奏的毛羽鳞片走向，以及神兽与云海山河形成的完整负形；不是通过人类化五官、浓妆、首饰堆砌、卡通圆脸或刻意萌化获得。
    - 即使指定神兽属于凶兽，也表现为威严、危险、古老、华美和不可直视，而不是龇牙咧嘴、腐烂脏污、黏液遍身、血盆大口、恶魔化尖刺、骷髅拼接或低级恐怖。压迫感主要来自体量、静止、目光、阴影和环境反应。
    - 有眼睛的神兽以深邃、古老、克制的目光越过山河、云谷或人物所在区域，瞳孔、眼睑、湿润角膜和眼窝结构服从自然光，眼内只保留环境反射；天地级视线不与微小人物精确对眼或朝镜头摆姿态。无眼神兽用朝向、姿态、气流与环境回应表达神性。
    - 指定神兽达到天地级巨物尺度，主体投影约占画面面积的80%至95%。镜头只捕捉龙首局部、长颈一段、翼根与部分羽缘、足爪局部、鳞脊或尾迹中的两至三项，至少三分之一结构自然越出画框，无法在同一画面看见完整全身；体量来自看不完的身体延续和山河级遮挡。
    - 神兽体量至少通过四级空间证据证明：远处极小古代人物或无人舟船；更大一级的山门、楼阁或城墙；再大一级的山峰、海岸或云墙；神兽局部跨越前三者并继续出框。翼流、尾迹、呼吸或身躯移动造成云浪、水浪、树海倾伏和巨大阴影，各尺度参照按真实距离递减，不把人物与龙眼摆成海报式并列。
    - 严格保留请求所要求的成年人物数量；请求未指定人数时，每个主题只使用一名极小古代人物并随机选择性别，不增加远处人影、军阵、祭司群、守卫、神仙、雕像化人物、倒影人物或云中人脸。人物高度约占画面高度0.3%至0.8%，位于底部远中景或环境边缘，作为山河中的微小剪影；人物绝不靠近镜头充当英雄前景，也不与神兽组成角色海报式双主体。
    - 人物穿戴符合统一的山海经东方古代物质语汇，逐人固定发髻或头巾、交领长衫或圆领袍、腰带、长裤或裙装、布靴或皂靴，以及斗笠、剑、灯笼、礼器或酒葫芦中的少量随身物。服装不采用现代汉服影楼造型、仙侠盔甲、暴露礼服、欧洲披风、现代鞋或游戏角色套装，不在成片提示词中额外输出人物国籍标签。
    - 人物以现实中的本能反应回应巨物：在山门后停步、扶墙保持平衡、伏低身体躲避翼风、跪坐完成祭告、护住灯火、回头确认退路或屏息仰望；动作幅度克制，重心与落脚面可信，情绪通过轮廓、停顿和受力表现。
    - 云海是与神兽并列的第二主角，占据大面积画面并具有山脉和海洋般的真实体积。云层形成翻滚层次、云墙、云浪、风暴眼、天光裂隙或深邃云谷，不是薄雾滤镜、平面烟饼、棉花团或普通蓝天白云。
    - 指定神兽约45%至65%的入镜身体被云海、山雾、海雾、暴雨、山体或逆光暗部真实遮挡，画框之外还延续更大体量。遮挡遵守前后空间顺序，通过相连轮廓、巨大阴影、局部鳞羽走向和云层受力判断身体延续，空气透视使远处身体自然降低对比度、饱和度和细节。
    - 神兽必须改变天地环境，而不是贴在背景上。巨翼扇动使云海向两侧卷开，长身穿云留下跨越天际的流动轨迹，巨尾搅动云浪或海潮，低头使山河落入阴影，落足令水面形成远超舟船的环形波，呼吸推动雾墙；只选择符合指定神兽身体与属性的一至两种主要作用，避免全部特效同时爆发。
    - 属性现象服从指定神兽传统气质：火性可使天幕和云底染上克制赤金火光，雷与风可沿云墙和翼缘发展，水性可牵引海潮雨幕，神圣气质可使云层裂开并倾泻天光。没有相应依据的神兽不强加火焰、闪电、冰霜、光环或法术阵。
    - 每个主题选择一个决定性但克制的神兽行为，例如从云墙后低头、穿过日轮前方、展开一侧巨翼、长身绕过山脊、九尾卷动云层、多首依次从不同云层探出、在海面上方停驻或闭目俯听祭告。避免统一张嘴咆哮、扑向镜头、战斗冲锋和Boss登场姿势。
    - 每次生成随机变化古代东方地域地貌、季节、时刻、天气、云海形态、神兽姿态、环境作用、人物身份、尺度参照、主色、逆光来源和压顶构图，但保持指定神兽核心解剖与审美一致。同一批主题不得只替换天空颜色或人物服装来重复同一构图。
    - 地貌可选择云海山岭、高原天门、海上孤岛、峡谷祭坛、古城外原野、雪峰、盐泽、江河入海口、火山荒原或森林山谷；建筑只作为极小尺度参照，符合古代木石结构并受当地地形支撑，不出现摩天楼、科幻城市、悬空游戏宫殿或无来源巨型牌坊。
    - 构图锁定16:9电影宽银幕、低机位仰视、超大全景和神兽压顶关系。优先使用18至28毫米广角，让地平线、建筑垂直线、人物比例和神兽骨骼保持自然；镜头像纪录现场一样从山门、石堤、林隙或舟岸后方观察，允许前景岩石、屋檐、树枝和云层自然遮住部分主体，避免无畸变依据的夸张贴脸透视。
    - 神兽主体通常偏离几何中心，头部、翼缘、长身、尾迹、日轮和极小人物形成清楚的三角形、对角线或大弧线；大片云海与暗部提供东方式留白。避免证件照式正面居中、完全左右对称、把全部结构等距塞满，以及粒子、飞鸟和装饰纹样填满负空间。
    - 光影采用低饱和灰青、青黑或深灰环境，配暖金、赤金逆光及少量冷白高光。约65%的画面处于有层次的深阴影，约25%为中间调，约10%为高光；比例服务于视觉秩序而非机械分区，暗部仍保留鳞羽结构和云层体积。
    - 高光只落在朝向光源的少量骨角、湿鳞高点、羽缘和云层裂口，眼睛保留湿润角膜反射而不主动发光。逆光边缘会被云、羽毛和身体结构自然打断，主体大部沉在有层次的阴影和空气雾化中，人物与建筑接受同方向的环境反射。
    - 主色克制统一于墨青、青灰、灰蓝、象牙白、雾白、黑褐和深灰。乳白毛发神兽可用淡金暖白，应龙等有翼神兽可用灰白与赤金，火性神兽可用暗红、熔金和深褐，水风类可用铁青与冷白；属性色只作局部点睛，不出现荧光蓝、紫粉霓虹、RGB彩光或五颜六色法术。
    - 毛发类神兽具有浓密、顺滑、分束明确且服从肌肉与风向的真实长短毛层，边缘逆光呈丝绸和云雾般的高贵质感，但不是毛绒玩具、宠物写真或无结构毛球。
    - 羽翼类神兽清楚区分主飞羽、次级飞羽、覆羽、羽轴和羽片，羽毛具有厚度、磨损、光泽及空气动力弯曲；巨翼整体产生可信下洗气流，不复制翅膀、不把羽毛画成金属刀片或装饰扇面。
    - 鳞甲类神兽的鳞片沿身体曲面自然生长，大小随头颈、躯干、关节和尾部变化；近处少量鳞片可见磨损、污渍、缺口、泥水和不均匀粗糙度，远处鳞片被空气雾化合并成大块明暗，不在全身逐片刻画高亮边线。
    - 角、爪、喙、牙与面部骨骼具有天然骨质、角质、岁月风化和受力结构，不使用金属镀层、塑料光泽、机械关节或无根尖刺。爪足与地面、山体、云层或水面保持可信空间关系，不悬空穿透。
    - 真人外景电影质感贯彻全画面：先建立真实山河、建筑、人物和天气的摄影底片，再让神兽像真实巨型动物一样进入同一光场。保留镜头边缘轻微柔化、远景低对比、暗部噪点、局部运动模糊、潮湿空气散射和自然曝光压缩；画面首先像摄影，其次才显出神话生物。
    - 震撼来自巨大留白云海、优美主轮廓、一眼可读的尺度差、强明暗关系与整体克制，不来自越多越乱的特效。每个主题保持一个主视觉中心、一个主要环境作用和一条主运动曲线，做到大而不乱、华丽而不俗、神秘而不脏、危险而不恐怖。
  frames:
    common:
    - 每幅画面独立完整地重述指定神兽的稳定解剖、天地级体量、当前姿态、云海遮挡、环境作用、人物尺度参照、构图、光源、色板与材质，不使用“同前”“仍然”“继续”等依赖其他画面的省略表达。
    - 同一主题的不同画面固定神兽形态、地域、季节、核心事件与同一名人物。第一帧建立一条人物连续性锚点，写明性别、年龄、发式轮廓、头饰、外层服装配色、鞋履、唯一随身器物和身份；第二帧原样复用这些属性，只改变人物在同一事件中的机位位置、受力姿态、手势和视线。至少改变相机与神兽的相对方位、头部或身体越框位置、前景尺度参照、云海开口、留白形状、人物位置、主要遮挡和高光区域中的五项，不生成近义改写的重复画面。
    - 神兽投影约占画面面积80%至95%，人物高度固定为画面高度百分之零点五或零点六，山门或楼阁高度约为百分之一至百分之三。每幅 Frame 明确写出人物的这一小数比例并复核小数点；神兽必须无法完整入镜，只清楚看见两至三项相连的巨大解剖局部、它们向云后或画框外延续的证据、远处极小人物或建筑参照，以及环境被改变的结果。
    - 使用18至28毫米广角、低机位仰视和超大全景建立神兽压顶感；相机位于山门内侧、石堤后方、林隙、舟岸或岩壁遮挡处，前景保留真实环境切边。人物落在底部远中景，不靠近镜头，神兽与云海占据绝大多数天空，画面呈现真实外景摄影师面对突发巨物时的有限视野。
    - 近镜头的神兽局部自然越框，透视缩短符合相机方位，左右结构、关节、头颈、翼根和尾根通过少量可见连续线索追溯。画面不同时展示完整龙首、完整躯干、完整四足、完整双翼和完整尾部，只让当前事件所需的局部进入摄影机视野。
    - 云海具有清楚的前云、中层云墙与远处云谷，每幅画面约五成入镜身体被真实云层、山体、雨幕和空气暗部遮挡，局部遮挡可接近六成。翼流、长身、尾迹或呼吸只改变局部云层，其他云体保持厚重安静；远处神兽轮廓随空气透视自然变软，云层保留真实含水重量与受光梯度。
    - 每幅画面建立人物或舟船、建筑、山峰或海岸、神兽局部的四级尺寸阶梯；神兽局部跨越山体与云墙后继续出框，巨大阴影、翼流、尾迹或水浪再横跨更大范围。各参照物位于可信的前中后景距离中，人物保持为远处微小剪影。
    - 每幅画面只保留请求中的人物。逐人固定古代发式、完整衣袍、腰带、鞋履与唯一随身物；人物在远中景以落脚面、身体朝向、抬头视线、手势、重心和衣袂轮廓表达敬畏情绪，面部只保留符合距离的有限信息，人物不摆出持剑迎战、遮额眺望等游戏角色宣传姿势。
    - 神兽有眼且眼睛入镜时，瞳孔、眼睑、湿润角膜和眼窝结构服从自然光，目光越过人物所在区域落向山河、云谷或画外天际；天地级神兽不与微小人物精确对眼。眼睛在当前取景外时，由头颈朝向、翼尾姿态和环境运动建立注意方向。
    - 动态元素共享同一物理来源并呈现不同延迟：巨翼先改变云层，继而压低树海和人物披风；长身穿云先推出云浪，随后水面与舟船响应；尾部搅动天际时远云、近雾、旗幡和衣摆按距离依次变化。避免毛发、云、火、闪电、海浪和人物衣服各自无关地乱动。
    - 光线具有唯一明确来源。自然天光从云隙、阴天穹顶、日轮或暴风后的裂口照入，先照亮朝向光源的云层与少量神兽表面，再由地面、水面和云海提供微弱反射；轮廓光会被身体和云层打断，人物、建筑和神兽共享同一曝光，不为展示造型额外补光。
    - 保持约65%深阴影、25%中间调和10%高光的克制结构，高光不同时占满眼睛、全身鳞片、全部云层和所有建筑。属性色只影响邻近云层、材质边缘和空气，不形成游戏能量条、魔法UI、满屏粒子或霓虹光污染。
    - 毛发、羽毛、鳞片、角爪和皮肤按指定神兽实际拥有的材质分别展开。焦点平面附近只有少量结构清晰，近处高速羽缘和雨丝带轻微运动模糊，远处材质因空气与景深合并成大块明暗；局部污渍、磨损、缺口和不均匀湿度取代全身均匀锐利的数字雕刻。
    - 构图以不完全对称的压顶关系、受环境遮挡的对角线、大弧线和宽阔负空间组织神兽、天光、云海与人物。主体像进入既有山河摄影画面，而非在中央摆姿态；日轮、山门和人物分散为真实环境节点，不形成角色海报式中心舞台。
    - 画面中不出现西方恶魔、西方龙、欧美盔甲、机械生物、机甲、赛博朋克、科幻城市、网游Boss、廉价玄幻舞台、卡通、动漫、Q版、普通动物写真、腐烂血腥、邪典肢解或恐怖猎奇。
    - 画面中不出现高饱和彩虹、荧光蓝、紫粉霓虹、RGB光效、满屏法术粒子、过量闪电、过量火焰、薄片云、空洞背景、无来源烟雾、塑料CG、蜡像质感、过度HDR、过度锐化或失真的鱼眼边缘。
    - 画面不依赖可读文字、题字、经文、招牌、字幕、Logo、水印、UI、边框或图注解释神兽身份；其东方神话属性通过准确形态、古代山河、人物反应、云海、天光和环境作用直接呈现。
