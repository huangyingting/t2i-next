id: shanhaijing-colossal-divine-beast
description: 创作以《山海经》东方神话为根基的原创真人外景电影画面，唯一主导神兽为【神兽】。指定神兽以天地级巨物姿态真正进入古代东方山河：镜头像真实摄影组在明朗自然天气中偶然捕捉到无法完整入镜的生命体，而不是完整展示怪兽的游戏海报。神兽轮廓优美恢弘，形态遵循传统核心特征，毛发、羽毛、鳞甲、骨角与皮肤具有真实重量、缺陷和受光差异；它与厚重云海、天光、山河和水域发生可追溯的大尺度物理作用。画面以只有手指大小的古人与神兽之间的骑乘、抚触、依偎、同行、引路、对望或守护建立情感核心，同时用舟船、山门或楼阁强化凡人如尘、神兽如天的尺度关系。整体采用明亮自然曝光、通透空气透视、清雅东方色彩和统一光场，呈现可信而温暖的东方神话真人电影摄影。
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 所有可见人物均为成年人，完整穿着符合古代身份、天气和地形的服装；人物与神兽之间表现敬畏、信任、好奇、欣喜、安宁或彼此守护，以骑乘、抚触、依偎、同行、引路、奉茶、奏乐、仰望或回应建立可读互动，不呈现情色、血腥伤害、捕食成功或残缺身体。
      - 每幅成片明确采用真实外景摄影语汇：明朗自然天气中的现场底片、符合场景的自然主光、宽广但真实的动态范围、轻微镜头柔化、细腻胶片颗粒、通透空气层次、符合距离的景深与局部运动模糊。神兽、人物、建筑、云和水处于同一曝光、白平衡、颗粒与空气层次中。
      - 每幅成片必须具有一眼可读的整体光效结构：依据当前时刻、天气、地貌和神兽属性自由设计贯穿前中后景的主光、环境散射、神兽投影、山河明暗层次与自然反射。光效是一套开放的画面关系，不固定为某种光柱、颜色、比例或路径，也不只停留在角尖、眼睛和羽缘的局部高光。
      - 描写解剖与轮廓时只使用当前指定神兽、真实动物结构和自然材质的准确名称，不借用龙首、龙身、龙骨、虎面等其他物种作修辞类比，避免文字联想把神兽串种。
      - Theme 与 Frame 只写实际可见的正向画面事实。全部排除项仅用于内部选择，不在成片文本中复述“没有、不出现、绝无、并非、而非、拒绝、避免”等合规证明，也不列举画面外不存在的错误风格、错误生物、错误材质、错误肢体或特效。
      - 未指定人数时，成片中恰有一名完整可见的极小古人，称为成年古人、成年男子或成年女子；人物身份通过远景可读的古代发式轮廓、外层服装、鞋履、器物和行为表达，面部合并为自然的小尺度明暗。空旷区域只描写真实可见的地形、云雾、建筑、水面与光影。
      - 成片全文使用流畅简体中文，镜头单位写“毫米”，色名使用深琥珀色、象牙白、灰青、青黑、暗金、赤金等中文词；交付前把材质、浪峰、构图、镜头与色彩中的拉丁字母词全部改写为准确中文。画外延展、云后延续和人物视线各选择当前画面最清楚的一项可见证据，用单一确定句写出具体结构、方向与对象；成片不照抄备选项，不使用“或、而非、并非、不是”构成选择或排除句。应龙羽翼的根部结构称为翼根，羽毛中央支撑称为羽轴。
      frames:
      - 每幅画面是独立可渲染的16:9东方神话电影静帧，完整交代指定神兽、云海、环境作用、极小人物尺度参照、相机角度、光源、色板与材质。
  themes:
    common:
    - 每个主题只表现同一只指定神兽，不增加第二种神兽、西方龙、普通巨兽、其他坐骑、神仙军团或无关怪物。指定神兽可以基于彼此信任托载极小人物，但始终保持神圣、独立和有自主意志的生命状态。多首、多尾、多翼或多足只在指定神兽传统形态本来如此时出现，并保持准确固定数量与连接关系。
    - 输入只指定一种神兽时，全部主题围绕该神兽变化场景；输入为与主题数量相同的神兽列表时，按输入顺序逐项分配，每个主题恰好使用一种且不重复、不串换，Theme 标题、premise 与两幅 Frame 都明确写出当前神兽名称。
    - 先依据指定神兽的传统核心描述建立一套清楚稳定的解剖设计，再贯穿主题全部画面。不得为套用通用美兽模板擅自增加不存在的角、翼、鳞、毛、眼、头、足、尾或人脸；帝江等无面目形态不强加眼睛，相柳保留有秩序的九首结构，应龙才具有符合东方龙体的翼。
    - 下列物种条目是按名称调用的独立造型档案。每个主题只读取当前指定神兽对应的一条档案，其余神兽名称、器官、颜色、能力和祥凶寓意不进入画面，不把不同条目拼接成混合生物。
    - 指定神兽为九尾狐时，固定为一首、四足、九条各自连接尾根的长尾和真实狐科骨骼，银白至暖白长毛随肌肉与风向自然分束，九尾以不同远近层次延伸并保持数量可追溯。
    - 指定神兽为白泽时，固定为一首、四足、一尾、一对自然骨角的白色古老瑞兽，头部统一称为“白泽兽首”，额骨、吻部和耳廓采用鹿与大型猫科之间的厚重比例，配分层白色鬃毛和可信关节受力，同一主题保持这一原创解释。
    - 指定神兽为毕方时，固定为一首、长喙、一条承重长腿、一对羽翼和一尾的鹤形神鸟，灰蓝与青黑羽毛带少量暗赤金色，单腿在飞行、停驻和收拢姿态中始终保持准确连接；翼面统一使用翼根、翼骨、羽轴、主飞羽、次级飞羽、覆羽和羽缘这些结构名称。
    - 指定神兽为穷奇时，固定为一首、四足、一尾和一对羽翼的巨型虎兽，头颈统一称为“虎首”和“虎颈”，虎科吻部、耳廓、肩背、脊柱与足爪承重真实，羽翼从肩胛后方连续生长，深灰虎纹、暗褐毛发和克制冷金羽缘保持同一设计。
    - 指定神兽为夔时，固定为一首、无角、单足、短尾的青黑巨牛形神兽，厚重胸肩、牛首、湿润青黑粗皮、短硬牛毛和唯一承重后肢形成稳定轮廓；近景材质只描写粗皮、牛毛、水痕、泥痕和关节皱褶，风雨与低沉水波表现其力量。
    - 指定神兽为应龙时，所有输出统一称为“应龙”，形态表述固定使用“具有一对羽翼的东方龙体”：一首、修长龙首、骨角、长颈、四足、单尾与层叠真实羽片构成同一连续骨骼，对头部统一称为“龙首”。每个 Theme 与 Frame 都写出确定句“应龙固定为一首、四足、单尾和一对羽翼”。一对羽翼按镜头方位分别称为“近侧翼”和“远侧翼”；近侧翼写成“粗壮翼骨、羽轴、主飞羽、次级飞羽和覆羽逐层展开”，远侧翼用连续羽缘交代位置与延展方向。
    - 指定神兽为相柳时，依据原典固定为九首人面、青色蛇身的水泽凶神；九条长颈从同一宽阔肩躯有序分出，九首各有完整连接和清楚空间层次，蛇身盘绕山泽，毒水只以荒芜水色、退避草木和沉重雾气表达。
    - 指定神兽为烛龙时，依据原典固定为人面、赤色蛇身的天象巨神，身体沿山脉般延伸，直目开合对应天地明暗，呼吸牵动风雨；面部古老庄严，赤色鳞皮在自然天光中呈岩层与霞光般层次。
    - 指定神兽为帝江时，依据原典固定为浑圆黄囊般躯体、丹火般赤色、六足、四翼、无面目的异神；四翼与六足分别具有可追溯根部和稳定节奏，神性通过舞动姿态、羽翼气流、云层回应和声音意象表达。
    - 指定神兽为陆吾时，依据原典固定为虎身、九尾、人面、虎爪的昆仑神；头部在 Theme 与每幅 Frame 中统一称为“陆吾人面”，人类额骨、眉眼、鼻梁、口部与虎颈自然连接，九尾分别连接尾根，虎躯与虎爪承担山岳重量，不使用虎首、虎面或龙首替代人面。
    - 指定神兽为英招时，依据原典固定为马身、人面、虎纹和一对鸟翼的山神；马科胸肩、四肢和蹄部真实承重，虎纹沿肌肉转折变化，鸟翼从肩背连续生长，人面呈克制守护神情。
    - 指定神兽为天吴时，依据原典固定为虎身、八首人面和十尾的水神；八首沿宽阔肩背形成清楚前后层次，十尾分别连接尾根并随海风展开，虎躯承担主体重量，水浪与云雾表现其海神气质。
    - 指定神兽为驺吾时，依据原典固定为大如虎的五彩瑞兽和一条长于身体的巨尾；每幅 Frame 明确写出巨尾从尾根延伸并长于完整躯干，猫科骨骼、厚实足爪和长尾保持优雅速度感，五色分布为顺毛流生长的自然斑纹，人物可在长尾、肩背或伏低前肢上互动。
    - 指定神兽为狰时，依据原典固定为赤豹形体、五尾和额上一角；豹科头颈、四肢与足爪修长有力，五尾分别连接尾根，单角为自然骨角，击石般鸣声通过山谷回响和碎石轻震表现。
    - 指定神兽为朱厌时，依据原典固定为猿形、白首和赤足的巨兽；长臂、肩背、手掌与足部遵循大型灵长类受力，白色头毛与赤色手足形成清楚识别，古老警觉感取代嗜战咆哮。
    - 指定神兽为夫诸时，依据原典固定为通体洁白的巨鹿和四支自然鹿角；四支角拥有四个分别连接额骨的独立角根，前后错落生长并在每幅 Frame 中明确写出四角总数与可追溯位置，修长四足与分蹄真实承重，白色短毛和颈部较长毛层在水汽中明亮通透，水泽上涨作为环境响应。
    - 指定神兽为驳时，依据原典固定为白色马身、黑尾、额上一角、虎齿和虎爪；马科头颈与躯干、单角、黑色长尾和四只虎爪形成同一连续骨骼，鼓声般足音通过地面震动与尘浪表现。
    - 指定神兽为酸与时，依据原典固定为蛇身、四翼、六眼和三足的有翼蛇形异兽；四翼分成两对并各有独立翼根，六眼沿蛇首两侧有秩序分布，三足在停驻与起飞时保持可追溯连接，长蛇身负责平衡整体轮廓。
    - 指定神兽为旋龟时，依据原典固定为龟身、鸟首和蝮蛇般长尾的水兽；厚重龟甲具有自然生长纹与水蚀痕，鸟喙和颈部从甲壳前端连续伸出，蛇尾从后端入水，游动造成宽阔而缓慢的水纹。
    - 指定神兽为文鳐鱼时，依据原典固定为鱼身、一对鸟翼、白首、赤喙和青色斑纹的海天异兽；胸鳍位置生长真实羽翼，鱼尾与鳞身保持水生流线，掠海与夜飞时水珠、翼流和海面反光共同交代运动。
    - 指定神兽为凤凰时，依据原典固定为鸡形基础上的大型神鸟，通体具有分区清楚的五彩天然羽纹，长喙、冠羽、双翼、双足与长尾羽保持鸟类骨骼；鸣唱和自舞通过舒展翼尾、林木回响与祥和天光表达。
    - 指定神兽为当康时，依据原典固定为巨型野猪形瑞兽、粗壮四足、鬃毛、长吻和成对獠牙；肩背隆起、蹄部陷入土地，鸣声与成熟谷浪、翻起沃土和飞散草籽共同表现丰年征兆。
    - 传统记载存在多种解释时，选择一种最适合真人电影实体化且内部一致的原创解释，不混合互相冲突的版本，不复制现有影视、游戏、插画或雕塑中的具体造型。
    - 指定神兽首先必须好看。美感来自舒展恢弘的整体轮廓、准确骨骼与肌肉支撑、克制而高贵的姿态、清楚的头颈躯干关系、具有节奏的毛羽鳞片走向，以及神兽与云海山河形成的完整负形；不是通过人类化五官、浓妆、首饰堆砌、卡通圆脸或刻意萌化获得。
    - 即使指定神兽属于凶兽，也表现为威严、危险、古老、华美和不可直视，而不是龇牙咧嘴、腐烂脏污、黏液遍身、血盆大口、恶魔化尖刺、骷髅拼接或低级恐怖。压迫感主要来自体量、静止、目光、阴影和环境反应。
    - 有眼睛的神兽以深邃、古老、温和而克制的目光关注山河、云谷或极小人物所在位置，瞳孔、眼睑、湿润角膜和眼窝结构服从自然光，眼内保留环境反射；神兽通过低头、侧耳、放缓脚步、垂下尾端、收拢羽翼或托起人物回应互动，不朝镜头摆姿态。无眼神兽用朝向、姿态、气流与环境回应表达神性。
    - 指定神兽达到天地级巨物尺度，比山峰更加高大，身体跨越山脉、云海或整片海岸并压住大部分视野。镜头只捕捉兽首、鸟首或龙首局部，颈部一段、翼根与部分羽缘、足爪局部、背脊、尾根或尾迹中的两至三项，大量结构自然越出画框，无法在同一画面看见完整全身；体量来自看不完的身体延续和山河级遮挡。
    - 神兽体量至少通过四级空间证据证明：只有手指大小的极小古人与毛束、羽轴、鳞片、爪趾或角面形成第一重对比；山门、楼阁、舟船或城墙形成第二重对比；山峰、海岸或云墙形成第三重对比；神兽局部跨越前三者并继续出框。翼流、尾迹、呼吸或身躯移动造成云浪、水浪、树海倾伏和巨大阴影，各尺度参照按真实距离递减。
    - 每个主题必须建立两条直接可见且不可误读的尺度事实。第一条表现人极小：人物完整身体小于神兽的一枚爪甲、一块鳞片、一束毛、一根主羽轴或一段角面，站在其旁只像米粒或尘点。第二条表现神兽极大：神兽一颗头颅高过附近山峰，一只足爪覆盖山门、楼阁或石桥，一片巨翼遮住整座山谷，躯干宽过河道并连续跨越数道山脊；根据当前神兽解剖选择最可信的两项。
    - 不同材质使用对应尺度证据：毛兽让一束毛粗过人物、一枚爪趾大过楼阁；羽兽让一片覆羽托住人物、单根羽轴像高塔、翼面覆盖山谷；鳞兽让一块鳞片宽过人物立足面、颈身横跨河流与山脊；鹿马牛猪类让单蹄压过石桥、角枝越过峰顶；龟鱼类让甲壳隆起如山岭、翼鳍或尾部跨过整片水域。
    - 严格保留请求所要求的成年人物数量；请求未指定人数时，每个主题只使用一名完整可见的极小古代人物并随机选择性别，不增加远处人影、军阵、祭司群、守卫、神仙、雕像化人物、倒影人物或云中人脸。人物在巨兽与山河之间极其渺小，远看如指尖、米粒或尘点，一束毛、一枚羽片、一块鳞片或一节爪趾都远大于人物；人物位于中景或远中景，即使落在神兽肩背、翼根、前肢、巨爪、尾端或低垂头部上，相机也与人物保持足够远的观察距离。
    - 人物穿戴符合统一的山海经东方古代物质语汇，逐人固定发髻或头巾、交领长衫或圆领袍、腰带、长裤或裙装、布靴或皂靴，以及斗笠、剑、灯笼、礼器或酒葫芦中的少量随身物。服装不采用现代汉服影楼造型、仙侠盔甲、暴露礼服、欧洲披风、现代鞋或游戏角色套装，不在成片提示词中额外输出人物国籍标签。
    - 每个主题建立一个清楚、温暖且符合解剖与地形的核心互动。人物可以骑坐在肩背或羽翼根部并抓稳毛束，站在巨爪或低垂尾端上被托起，沿伏低的前肢走近兽首，双手抚触鼻端、额角或羽片，在翼下避雨，倚着温暖毛层饮酒吟诗，坐在背脊奏琴吹箫，与落足的神兽并肩穿过山谷，或从舟岸仰望并举灯回应。具体动作随神兽身体结构自由变化，不把所有神兽统一成同一种骑乘姿势。
    - 人物的互动具有现实受力和连续反应：骑乘时跨坐稳定承重点并抓住毛束、羽轴邻近覆羽或天然背脊，不悬浮在光滑表面；抚触时双脚有落点、身体前倾、手掌接触准确；仰望时颈部、躯干和视线共同朝向神兽；飞行或风浪中伏低重心并让衣袂顺同一气流运动。人物情绪通过姿态表达敬畏、惊喜、信任、平静、专注或自由感。
    - 每个主题先建立清楚的“相机—人物—神兽”空间三角：明确相机位于人物身后、侧后、侧面或神兽一侧，人物双脚和躯干朝向哪里，神兽头部或互动部位位于人物哪个方向。人物的身体、头部、视线、手势、接触点和神兽回应必须沿同一条可追溯空间关系连接。
    - 人物面对神兽时，面部可见程度严格服从相机方位：相机在人后只能看见后脑、发髻和背影；相机在侧后只能看见少量侧脸；相机在人物侧面可以看见侧脸；相机位于神兽一侧并反拍人物时，人物转头望向神兽，可看见三分之二侧脸或小幅正面。人物极其渺小时，只保留与距离相符的脸部朝向和明暗，不放大五官。
    - 人物不作为近景、前景英雄或第二主视觉中心。镜头不能为了看清人物脸部而靠近人物，也不使用人物占据画面下半部的过肩构图；人物脸部可见性只表达朝向关系，人物始终保持为巨大山河和神兽表面上的微小完整身影。
    - 神兽必须对人物动作作出可见回应，例如低下头颈让人物触碰、收拢翼流保护人物、以尾端搭成通路、放慢脚步等待、用宽阔羽翼遮雨、托住人物越过水面、侧耳倾听琴箫或将视线温和落向人物附近；互动形成双向因果，不只是人物单方面摆姿势。
    - 云海与雾气是和神兽并列的第二主角，占据大面积画面并具有山脉、海洋和天气系统般的真实体积。近处湿雾、中层厚重云墙、远处云谷和高空薄云形成多层遮挡，云层可翻滚、堆叠、下沉、开裂、漫过山脊或被巨兽缓慢推开。
    - 神兽必须在云海雾气中若隐若现，入镜身体的大半被前云、山雾、海雾、雨幕、飞雪、山体或自然暗部遮住。兽首可从一处云隙短暂显露，颈肩随即消失在厚云中，远处翼缘、尾部、背脊或足爪再从另一层雾后隐约出现；这些局部以连续骨骼方向、毛羽鳞片走向、巨大投影和云层受力保持同一身体的可追溯关系。
    - 若隐若现来自真实空间遮挡与空气透视，不使用均匀半透明滤镜。靠近镜头的局部保留少量湿润材质，进入中层云墙后迅速降低对比度、色彩和细节，远端只留下庞大暗影、模糊轮廓或被扰动的云浪；画面不把巨兽完整外轮廓清清楚楚描在天空上。
    - 神兽必须改变天地环境，而不是贴在背景上。巨翼扇动使云海向两侧卷开，长身穿云留下跨越天际的流动轨迹，巨尾搅动云浪或海潮，低头使山河落入阴影，落足令水面形成远超舟船的环形波，呼吸推动雾墙；只选择符合指定神兽身体与属性的一至两种主要作用，避免全部特效同时爆发。
    - 属性现象服从指定神兽传统气质：火性可使天幕和云底染上克制赤金火光，雷与风可沿云墙和翼缘发展，水性可牵引海潮雨幕，神圣气质可使云层裂开并倾泻天光。没有相应依据的神兽不强加火焰、闪电、冰霜、光环或法术阵。
    - 每个主题选择一个决定性但克制的神兽行为，并让它直接服务于人与神兽的互动，例如从云墙后低头迎接抚触、展开一侧巨翼为人物挡雨、伏低前肢让人物登上肩背、以九尾托起古舟、在海面上方停驻等待人物攀上羽背、闭目倾听背脊上的琴箫，或放慢脚步陪人物穿过山谷。互动方式根据当前神兽解剖和性情重新创造。
    - 每次生成随机变化古代东方地域地貌、季节、时刻、天气、云海形态、神兽姿态、环境作用、人物身份、互动方式、尺度参照、明亮主色、自然光场和构图关系，但保持指定神兽核心解剖与审美一致。同一批主题的地貌大类、季节、时刻、天气、建筑节点、互动方式、相机方位、主色与光场尽量各不相同，不只替换天空颜色或人物服装来重复同一画面。
    - 场景可从云海山岭、高原天门、海上孤岛、峡谷祭坛、古城外原野、雪峰冰湖、盐泽、江河入海口、火山荒原、森林山谷、竹海、喀斯特峰林、丹霞赤壁、芦苇湿地、梯田稻浪、古渡口、海蚀崖、沙漠绿洲、石林、瀑布群、潮汐滩涂、天坑洞口、洞窟天窗、群岛海峡、高山草甸、巨杉古林或茶山云谷中自由选择，也可创造符合古代东方自然地理的其他环境；这些只是灵感示例，不构成固定清单。
    - 建筑只作为极小尺度参照，并随地貌采用可信古代木石结构，例如山门、栈道、渡亭、烽燧、石桥、水门、临崖楼阁、祭坛、堤岸、渔舟或田间草亭；建筑必须由山体、河岸或地面真实支撑，不形成悬空游戏宫殿或无来源巨型牌坊。
    - 构图采用16:9电影宽银幕和超大全景，以最能体现互动与尺度差的机位组织画面。可采用地面低机位仰视、山门或舟岸后的侧向远望、从神兽背脊看向山河的高位俯瞰、贴近巨爪或尾端的引导线视角、由羽翼和长尾形成的框中框；优先使用18至35毫米自然广角，让地平线、建筑垂直线、人物比例和神兽骨骼保持可信。
    - 神兽主体通常偏离几何中心，头部、翼缘、长身、尾迹、日轮和极小人物形成清楚的三角形、对角线或大弧线；大片云海与暗部提供东方式留白。避免证件照式正面居中、完全左右对称、把全部结构等距塞满，以及粒子、飞鸟和装饰纹样填满负空间。
    - 每个主题自由设计一种贯穿全景的自然主光效，并随当前环境发展出独特光场。可参考云隙暖光、雨后澄澈天光、晨雾漫射、雪地回光、月色云辉、落日映水、林冠漏光、湖海粼光、日轮薄云透射等方向，也可根据地貌与神兽属性创造其他可信光效；这些仅为灵感例子，不构成固定清单、顺序或主题配额。
    - 画面总体明亮、清透、富有呼吸感，保留足够中间调与亮部来读清人物互动、神兽材质、云海层次和山河纵深。阴影承担立体塑形而不吞没主体，亮部范围可以覆盖大面积天空、云海、水域或受光山体，曝光保持真实并保留高光纹理。
    - 高光落在朝向光源的毛羽鳞片、骨角、湿润表面、云层与人物衣袂上，眼睛保留湿润角膜反射。轮廓光、顺光、侧光、顶光、漫射光和环境回光根据现场条件自然组合，人物与建筑接受同方向、同色温的环境照明。
    - 主色使用清雅而明亮的东方自然色，可围绕天青、湖蓝、松绿、莲叶绿、月白、象牙白、浅金、杏色、淡朱、桃粉、银灰与温润木色组织统一色板；神兽固有色保持准确，属性色与环境色彼此渗透。整体色彩丰富但协调，保持真实材质和自然曝光。
    - 毛发类神兽具有浓密、顺滑、分束明确且服从肌肉与风向的真实长短毛层，边缘逆光呈丝绸和云雾般的高贵质感，但不是毛绒玩具、宠物写真或无结构毛球。
    - 羽翼类神兽清楚区分主飞羽、次级飞羽、覆羽、羽轴和羽片，羽毛具有厚度、磨损、光泽及空气动力弯曲；巨翼整体产生可信下洗气流，不复制翅膀、不把羽毛画成金属刀片或装饰扇面。
    - 鳞甲类神兽的鳞片沿身体曲面自然生长，大小随头颈、躯干、关节和尾部变化；近处少量鳞片可见磨损、污渍、缺口、泥水和不均匀粗糙度，远处鳞片被空气雾化合并成大块明暗，不在全身逐片刻画高亮边线。
    - 角、爪、喙、牙与面部骨骼具有天然骨质、角质、岁月风化和受力结构，不使用金属镀层、塑料光泽、机械关节或无根尖刺。爪足与地面、山体、云层或水面保持可信空间关系，不悬空穿透。
    - 真人外景电影质感贯彻全画面：先建立真实山河、建筑、人物和天气的摄影底片，再让神兽像真实巨型动物一样进入同一光场。保留镜头边缘轻微柔化、远景低对比、暗部噪点、局部运动模糊、潮湿空气散射和自然曝光压缩；画面首先像摄影，其次才显出神话生物。
    - 震撼来自巨大留白云海、优美主轮廓、一眼可读的尺度差、明亮通透的空间层次和人与神兽之间的情感联系。每个主题保持一个主视觉中心、一个核心互动、一个主要环境作用和一条主运动曲线，做到大而不乱、华丽而不俗、神秘而不脏、温暖而不幼稚。
  frames:
    common:
    - 每幅画面独立完整地重述指定神兽的稳定解剖、天地级体量、当前姿态、云海遮挡、环境作用、人物尺度参照、双向互动、构图、整体光场、明亮色板与材质，不使用“同前”“仍然”“继续”等依赖其他画面的省略表达。
    - 同一主题的不同画面固定神兽形态、地域、季节、核心事件与同一名人物。第一帧建立一条人物连续性锚点，写明性别、年龄、发式轮廓、头饰、外层服装配色、鞋履、唯一随身器物和身份；第二帧原样复用这些属性，并把互动推进到下一个自然瞬间，例如从仰望到登上前肢、从伸手到触及鼻端、从坐稳背脊到迎风奏乐、从翼下避雨到随神兽走出云层。至少改变相机与神兽的相对方位、头部或身体越框位置、前景尺度参照、云海开口、留白形状、人物位置、主要遮挡和受光区域中的五项。
    - 神兽比山峰更高大，庞大局部压住画面大部分空间；人物极其渺小，在神兽身边如指尖、米粒或尘点，山门、楼阁和舟船也明显小于神兽足爪、羽片、鳞片或尾部。每幅 Frame 都用这些直接可见的实物对比表达尺度，不写人物高度、画面占比或任何尺寸百分比；神兽必须无法完整入镜，只清楚看见两至三项相连的巨大解剖局部、它们向云后或画框外延续的证据，以及山河被改变的结果。
    - 每幅 Frame 必须写出一组人物与神兽局部的同层直接对比：完整人物紧邻正在接触或站立的一枚爪甲、一束毛、一片覆羽、一根羽轴、一块鳞片、一节角面或一条掌纹，二者处于同一景深和同一承重点，明确写出该单一结构仍比人物整具身体更宽、更高或更粗。不能把人物放在近景、神兽放在远景后依靠透视制造虚假大小。
    - 每幅 Frame 还必须写出一组神兽与山河的同框对比：兽首从相邻峰顶上方升起，足爪跨过山门和石桥，翼面遮住山谷，背脊高过数道山岭，或长身横断大河与海湾。山体、建筑与神兽之间要有真实遮挡、投影或接触关系，使“巨兽比山更大”成为画面事实。
    - 成片先建立人物—单一毛羽鳞爪局部的微观对比，再建立建筑—山峰—神兽头颈躯体的宏观对比，两个尺度证据同时出现。人物服饰、动作和面部朝向不能挤占尺度描述的篇幅。
    - 使用18至35毫米自然广角和超大全景建立神兽压倒山河的尺度。相机根据互动选择地面低机位仰视、远岸侧望、沿巨大神兽肢体形成的引导线视角或从背脊望向云海的高位俯瞰；前景保留山门、石堤、林隙、舟岸、岩壁、巨型毛束或羽片的真实切边。相机与人物保持远距离，人物无论站在地面还是骑坐神兽，都只是山河巨幅画面中极其渺小的一点。
    - 近镜头的神兽局部自然越框，透视缩短符合相机方位，左右结构、关节、头颈、翼根和尾根通过少量可见连续线索追溯。画面不同时展示完整龙首、完整躯干、完整四足、完整双翼和完整尾部，只让当前事件所需的局部进入摄影机视野。
    - 云海具有清楚的前云、中层厚云墙、远处云谷与高空薄云，神兽入镜身体的大半被真实云层、山体、雨幕、飞雪和空气暗部遮挡。每幅画面明确写出一个短暂显露的近处结构、一个在中层云墙中逐渐消失的相连结构、一个从远雾后隐约重现的轮廓证据，让巨兽呈现若隐若现而不是完整展示。
    - 云雾遮挡具有前后顺序和局部浓淡：云前结构较清楚，进入厚云后轮廓断续，远端只保留低对比暗影或云浪变形。翼流、长身、尾迹或呼吸只改变经过身体附近的局部云层，其他云体保持厚重安静；人物、建筑和前景不被无来源白雾全部抹平。
    - 每幅画面建立人物或舟船、建筑、山峰或海岸、神兽局部的四级尺寸阶梯；神兽局部跨越山体与云墙后继续出框，巨大阴影、翼流、尾迹或水浪再横跨更大范围。各参照物位于可信的前中后景距离中，人物保持为远处微小剪影。
    - 每幅画面只保留请求中的人物。未指定人数时全景恰有一名完整可见的成年古人，远景尺度参照只使用舟船、建筑、山峰、树木和地貌，不增加第二个人影、巡山身影、人形剪影、雕像或倒影。逐人固定古代发式、完整衣袍、腰带、鞋履与唯一随身物；人物以可信落脚面、身体朝向、抬头或回望视线、双手动作、重心和衣袂轮廓表达敬畏、信任、惊喜、安宁或自由感，面部只保留符合距离的有限信息。人物与一束毛、一枚羽片、一块鳞片或一节爪趾的直接尺寸对比清楚可见。
    - 每幅 Frame 明确写出相机相对人物的位置、人物相对神兽的位置、人物朝向和镜头实际看见的面部范围。背对镜头仰望神兽时只写后脑、发髻、颈背和背影；侧向仰望时写侧脸轮廓；从神兽一侧反拍时才写人物三分之二侧脸或小幅正面。面部可见范围与人物的肩线、脚尖方向、转头角度和视线一致。
    - 神兽有眼且眼睛入镜时，瞳孔、眼睑、湿润角膜和眼窝结构服从自然光，目光温和落向人物附近、前进方向或共同注视的山河；人物通过仰头、侧身、伸手或回望回应其注意。眼睛在当前取景外时，由低垂头颈、收拢羽翼、托举肢体、尾端姿态和环境运动建立回应方向。
    - 动态元素共享同一物理来源并呈现不同延迟：巨翼先改变云层，继而压低树海和人物披风；长身穿云先推出云浪，随后水面与舟船响应；尾部搅动天际时远云、近雾、旗幡和衣摆按距离依次变化。避免毛发、云、火、闪电、海浪和人物衣服各自无关地乱动。
    - 每幅画面按当前时刻、天气、地貌与神兽材质设计一套自然统一的光场。明确主要天光方向、空气中的明暗层次、人物与神兽的共同受光、地表或云海的环境回光以及投影关系；光场可以柔和、清澈、绚丽、空灵或带戏剧性，表现方式由场景自由决定。
    - 整体光效必须贯穿天空、神兽、人物与山河，但不规定固定光路、明暗百分比、色温或高光位置。成片优先保持明亮中间调、通透空气和可读互动，在日出、白昼、雨后、月夜、雪原、林谷、湖海等条件下分别形成不同而可信的亮度结构；属性色自然影响邻近云层、材质和空气。
    - 毛发、羽毛、鳞片、角爪和皮肤按指定神兽实际拥有的材质分别展开。焦点平面附近只有少量结构清晰，近处高速羽缘和雨丝带轻微运动模糊，远处材质因空气与景深合并成大块明暗；局部污渍、磨损、缺口和不均匀湿度取代全身均匀锐利的数字雕刻。
    - 构图以不完全对称的压顶关系、受环境遮挡的对角线、大弧线和宽阔负空间组织神兽、天光、云海与人物。主体像进入既有山河摄影画面，而非在中央摆姿态；日轮、山门和人物分散为真实环境节点，不形成角色海报式中心舞台。
    - 同一批不同主题优先分别使用山岳、森林、水域、雪地、荒漠、湿地、洞窟、农田或海岛中的不同环境类别，并轮换低机位仰视、远岸侧望、林隙框景、洞口向外、贴水视角、背脊俯瞰和沿肢体引导线等机位，确保场景结构与空间体验真正不同。
    - 画面中不出现西方恶魔、西方龙、欧美盔甲、机械生物、机甲、赛博朋克、科幻城市、网游Boss、廉价玄幻舞台、卡通、动漫、Q版、普通动物写真、腐烂血腥、邪典肢解或恐怖猎奇。
    - 画面中不出现高饱和彩虹、荧光蓝、紫粉霓虹、RGB光效、满屏法术粒子、过量闪电、过量火焰、薄片云、空洞背景、无来源烟雾、塑料CG、蜡像质感、过度HDR、过度锐化或失真的鱼眼边缘。
    - 画面不依赖可读文字、题字、经文、招牌、字幕、Logo、水印、UI、边框或图注解释神兽身份；其东方神话属性通过准确形态、古代山河、人物反应、云海、天光和环境作用直接呈现。
