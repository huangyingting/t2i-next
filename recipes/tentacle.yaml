id: tentacle
description: 电影感、超写实成人幻想摄影，让构造繁复的活体触手成为视觉中心。身体互动、奢华历史氛围与精巧构图共同形成多样场景、姿势、视角和照明。保持精确中国成年人阵容；触手属于幻想环境生物，不是额外人类。每人握住、引导、改变触手方向、抵住触手支撑自己或作出回应，脸与手清楚可见。
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 触手仅与建筑、家具、服装，以及成年人的手或身体外轮廓互动。让成年人衣着完整，运用惊奇、张力、质感及尺度，不出现性接触。
    erotic:
      shared:
      - 允许部分或完全的艺术裸体、对四肢或躯干的感官性缠绕、成年人之间的相互触碰，以及亲密的身体压力。
    hardcore:
      shared:
      - 每幅画面呈现一种已经发生、清晰可见且涉及触手的成人性互动，当前动作、接触几何、身体反应与每人的引导动作相互关联。
  themes:
    common:
    - 以奢华或历经岁月的中式室内空间为默认场景：绣床、雕花木屏风、格窗、漆器家具、丝绸帘幕、铜镜、灯笼、天鹅绒靠垫、彩绘墙壁、私密浴室、隐蔽宫室、幽静宅邸、戏剧化妆间，或同样丰富的等效场景。变化中国历史时期、房间用途、陈设、材料、季节、天气及一天中的时间，同时保持世界内部连贯。除非明确要求，否则不得把场景移至其他国家。
    - 每个 主题 都要确立一组请求指定的成人阵容、一间私密的历史幻想房间、一种与内容级别对应的互动、一种触手形态及排列、一种稳定的衣着状态、一种情感动态，以及一个摄影主旨。各 主题 在所有这些维度上都须有显著区别，而不是仅改变相机。
    - 在各 主题 之间变化成年人的外貌、发型、体格、服装、情感动态、房间、触手形态、姿势、相机、配色及光线。
  frames:
    common:
    - 触手数量要足以形成强烈构图，但又不能多到无法辨读每条路径。为每条触手赋予一个连续的源头、渐细形态、方向、接触作用及可见的反作用力。保持可信的缠绕、压力、重量、遮挡、表面压缩、织物张力、流体行为及镜面反射。
    - 为每位成年人安排一种物理上可行、具有稳定支撑的保持姿势。将每条可见肢体追溯到其所属者，并让所有关键接触保持可见。触手不得造成脱离身体的解剖部位、不可能的结、无法解释的重复、没有支撑的身体或相互矛盾的接触路径。
    - 每个 画面 都是基于 主题 不变前提的一张独立照片。在一个定格瞬间中展示已经可见的关键互动。保留角色身份、房间、衣着锚点、触手形态及视觉风格，同时变化身体几何、触手路径、视点、裁切、焦点层次及照明。不得在一幅图像中描述准备、升级、转变、撤出、事后状态或一个连续过程。
    - 优先采用亲密的中景或中近景摄影，包括后侧方、适度低角度、侧面、俯拍、镜面辅助及精心取景的正面视点。运用前景物体、层次纵深、建筑框景、帘幕、家具及不对称触手群，同时不得隐藏面部、支撑或关键接触。
    - 探索冷青色、月光、磷光绿或蓝色轮廓光，与暖琥珀色、烛光、火光、灯笼红或金色室内照明之间受控的组合。精确呈现皮肤毛孔、细汗、湿发、丝绸、天鹅绒、雕木、凝结水珠及湿润的镜面反射表面，避免高光过曝、暗部死黑、塑料皮肤或浑浊色彩。
    - 人物数量准确，关键接触可见，解剖与触手路径连续，支撑可信。触手形态具体且构图清晰，画面差异体现在身体几何、环境、视点与光线中。
