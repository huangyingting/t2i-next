    - 姿势规范化：- 说明支撑身体的真实地板、墙面、平台、方台、椅子、长凳、床或垫子。绝不虚构不可见的支撑物或缺席的伴侣。
    - 姿势规范化：- 说明在应用相应内容级别的遮盖后，为何最终身体几何结构仍具有明确无误的性意味。
    - 姿势规范化：- 用符合所选内容级别的精确面部表情、视线方向、肩部姿态、呼吸状态和手部位置，替代情绪简写。
    - 姿势规范化：- 将极端关节角度、无支撑后弯、颈部压迫、不稳定平衡或扭曲动作降低至可信的成人活动范围。
    - 姿势规范化：- 保留一个捕捉到的瞬间。不得加入挺动、研磨、骑动、弹跳、摩擦、滑动、摇摆、爬行、插入或其他动作序列。
    - 姿势规范化：不得描述女性如何进入或离开姿势。绝不在同一区域内组合连续姿势、运动轨迹、身体重影、前后状态，或与缺席参与者的接触。
    - 姿势蓝图约定：主题层级的六种姿势蓝图，每一种都必须说明：
    - 姿势蓝图约定：1. 支撑基底和确切的承重接触点；
    - 姿势蓝图约定：2. 骨盆高度、倾斜、展示方式及朝向；
    - 姿势蓝图约定：3. 脊柱曲线、躯干旋转与双肩关系；
    - 姿势蓝图约定：4. 分别说明左腿和右腿的位置，包括膝部与脚部的摆放；
    - 姿势蓝图约定：5. 分别说明左臂和右臂的位置，包括肘部与手部接触点；
    - 姿势蓝图约定：6. 头部角度、下巴位置、视线方向和具体表情；
    - 姿势蓝图约定：7. 形成的具有性暗示的外轮廓，以及由此显露的服装或人体部位；以及
    - 姿势蓝图约定：8. 稳定的人体结构与平衡，姿势能够保持；
    - 姿势蓝图约定：9. 镜头方位、最近的可见身体侧面、机位高度、仰拍或俯拍角度，以及标准或中短焦透视；以及
    - 姿势蓝图约定：10. 从该确切视角仍可看见哪些支撑接触点、骨盆线索、大腿开合、脊柱曲线与面部线索。
