  themes:
    common:
    - 只呈现一位外貌成熟的中国女性，零名男性。重复描绘同一女性六次是同一人物的设计参考，不添加伴侣、不可见身体、不存在的接触对象、同伴、助手、人群、人影、人体模型、玩偶、他人的倒影或脱离身体的部位。
    - 姿势特征：可见定格形态至少组合以下两种身体线索：
    - 姿势特征：- 骨盆被明确展示、抬高、打开、前推或朝向观看者；
    - 姿势特征：- 两侧大腿张开、不对称打开、抬起、环绕真实支撑物，或呈现可辨认的性姿势几何结构；
    - 姿势特征：- 脊柱、躯干与支撑构成接受、展示、跨坐、骑跨或主导轮廓；
    - 姿势特征：- 一只不承重的手进行符合级别的亲密触碰；或
    - 姿势特征：- 即使没有面容、服装、标题和情境提示，姿势仍有强烈性暗示。
    - 姿势特征：身体力学本身承载性意图，不仅依赖裸体、内衣、表情或镜头强调，也不退化为普通拉伸、锻炼、舞蹈、时尚专题、睡眠或随意闲躺。
    - 姿势组合：每个主题恰好六种不同姿势，涵盖至少四个姿势类别，区域排列不套用姿势库顺序或固定预设。
    - 姿势差异：六种姿势在以下维度均有所不同：
    - 姿势差异：- 支撑基底与承重接触点数量；
    - 姿势差异：- 站立、坐、跪、蹲、仰卧、侧卧、俯卧或手膝支撑等身体层位；
    - 姿势差异：- 躯干朝前、侧、后、上或下的方向；
    - 姿势差异：- 骨盆高度、倾斜、展示方式和朝向；
    - 姿势差异：- 腿部伸直、弯曲、张开、环绕、叠放或抬起的几何；
    - 姿势差异：- 紧凑、斜向、垂直、水平、拱起、扭转或伸展的外轮廓；
    - 姿势差异：- 手位、视线及接受、展示或主导的侧重点。
    - 姿势组合：避免近似重复的姿势，不以同一种后向弯身、张膝斜倚、宽跪、骨盆桥或手膝支撑的细微变化填满参考板。
    - 姿势组合：不同主题的六姿势组合、主导姿势、类别分布、顺序和轮廓节奏不同；同一主题保留六姿势蓝图，可重排区域位置并变化表情、镜头重点、照明与背景。
    - 镜头角度选择：选好六种姿势后，独立地从精选镜头角度库中分配恰好六种不同的镜头角度蓝图。姿势选择与镜头选择是两个独立决策：不得将某一姿势类别永久绑定于某一视角，也不得用镜头角度代替具有性意味的身体力学。
    - 镜头角度选择：六个区域须满足：
    - 镜头角度选择：- 在正面、前侧四分之三、正侧面、后侧四分之三与正后方中，使用至少四种不同的方位类别；
    - 镜头角度选择：- 至少包括一个偏前方视角、一个正侧面或近正侧面视角，以及一个偏后方视角；
    - 镜头角度选择：- 在低位、身体同高位和适度高位中，使用至少三个机位高度或俯仰角度带；
    - 镜头角度选择：- 不得两次分配相同的方位、机位高度与俯仰角组合，即使左右镜像也不行；
    - 镜头角度选择：- 在姿势的人体结构仍然清晰的前提下，改变女性哪一侧更靠近镜头；以及
    - 镜头角度选择：- 让角度与姿势匹配，使骨盆朝向、大腿分离、脊柱曲线、面部以及真实支撑接触点同时清晰可读。
    - 镜头角度选择：使用克制的标准或中短焦透视，约等效于全画幅50-85毫米。低位指约膝部至髋部高度，仅略微仰拍；高位指约头部高度，仅略微俯拍。绝不使用地板高度的生殖器构图、天花板俯拍、偷拍机位、鱼眼畸变、极端倾斜构图，或将全身姿势研究变为孤立身体部位裁切的视角。
    - 自我触碰选择：选好六种基础姿势后，独立地从精选自我触碰库中选择符合内容级别的手势。自我触碰强化性意图，但不能代替合格的身体力学。加入触碰时，须保留基础姿势的支撑接触点、重心、骨盆方向和轮廓。
    - 自我触碰选择：同一参考板中，同一种自我触碰手势不得用于多个区域。改变触碰部位、使用左手还是右手、压力、手指形状、视线和情绪重点。绝不可仅为增加亲密感而让承重的手离开支撑物。
