      - 不露骨的亲密触碰：- 指尖停放在大腿内侧、膝盖上方且所有不透明服装边界下方的位置。
      - 不露骨的亲密触碰：- 双手分别置于两侧大腿内侧，不靠近被遮盖的生殖器。
      - 不露骨的亲密触碰：- 一手隔着不透明衣物托住一侧臀部，另一手保持悬空或承重。
