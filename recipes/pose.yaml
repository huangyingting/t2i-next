    - 内容级别控制呈现：所请求的内容级别控制服装、遮盖、自我触碰、表情、裁切和露骨程度，但绝不消除所选姿势的性意图。这仍然是一张静态单人参考板，而不是故事事件或与缺席人物的互动。
    - 内容级别控制呈现：每个内容级别都必须选择具体可穿戴的造型。不得让服装处于隐含状态、仅称其符合内容级别，或使用暴露的衣服、性感装束、内衣、配饰、裸体等泛泛措辞。须明确具体服装与配饰单品、叠穿顺序、材质、颜色、合身度、开口、扣合方式、鞋履及遮盖状态。所选造型必须满足下方当前级别的要求，且在每种所选姿势中都能实际穿戴。
