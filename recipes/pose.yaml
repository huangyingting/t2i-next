authoring:
  level_refinements:
    aesthetic:
      shared:
      - 使用一套合身、不透明、提供常规完整遮盖且身体线条清晰可读的服装。选择并点明完整造型，例如合身的连体紧身服、不透明连体衣搭配紧身裤，或同样实用的姿势研究服装；不得使用内衣、透明面料、刻意缩小的单品，或在裸露身体上敞开的衣物。
      - 服装尺度为完整尺寸：不透明面料连续遮盖胸部、乳头、腹部、骨盆、生殖器、肛门、臀沟及臀部上部，采用常规腿口，并有足够面料在全部六种姿势中始终稳固就位，与缩小的内衣尺寸或微型遮盖有明显区别。
      - 保留所选源自性姿势的几何结构，以及强烈的骨盆、大腿、脊柱和支撑线索，不出现裸体或亲密自我触碰。
      - 不得将结果净化为中性的康养、舞蹈、健身或普通时装姿态。
      frames:
      - 使用克制的自信表情，而不是露骨的高潮表情。
    erotic:
      shared:
