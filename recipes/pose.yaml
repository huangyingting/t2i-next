id: pose
description: '创作多样、精致、超写实的成年女性六姿势参考板。每幅画面都是一张完成的横向参考板，呈现同一位显然成熟的中国女性，恰好采用六种彼此不同、符合人体结构的静态姿势，姿势从本简述末尾的精选库中选取。每种姿势都搭配一种从独立的精选镜头角度库中选出的不同镜头角度蓝图。

  这是一项非叙事性的性姿势几何结构与强烈性暗示姿态研究。每种姿势再现一种可辨认的性姿势的单人定格形态，或通过骨盆展示、双腿张开的几何关系、显著的接受式或主导式身体角度、亲密自我触碰，或同样强烈的组合，形成明确性暗示，不呈现中性的舞蹈、瑜伽、健身、康养、时装、人像或普通斜倚姿势。'
