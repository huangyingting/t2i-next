      frames:
      - “BDSM”器具规范：主导人像可展示所选器具或产品的佩戴或携带状态，采用放松、从容自主的时尚参考姿势。正面、背面和侧面视图必须露出所有贴合、连接和释放点，不得将手腕绑在一起、捆绑肢体、让颈部承重、限制呼吸、悬吊重量、强迫关节活动范围，或暗示器具由另一个人控制。
      - “BDSM”器具规范：对于佩戴的乳夹，明确宽大的硅胶衬垫夹头、低张力调节限位、释放拉片和放松的贴合状态，周围皮肤保持不变。对于佩戴的球形口塞、衔杆式口塞、片式口塞或中空口塞，明确柔软的医用级硅胶、通气结构或开放呼吸通道、宽松带子、不受遮挡的鼻部、放松的下颌和可立即触及的侧面释放装置。无法满足这些可见贴合条件的产品必须移至配饰特写或材质平铺图，而不是佩戴。
      - “BDSM”器具规范：配饰特写必须清楚展示衬垫、缝线、搭扣、夹扣、调节孔、释放拉片和安全的边缘处理。材质平铺图必须包含完全相同的器具清单，包括每组成对束环或带子的两个成员，不得增加额外束缚物或替代产品。
