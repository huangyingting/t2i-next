    - 服装规范：- 领口、肩部、袖子、腰部、臀部、下摆和背部结构；
    - 服装规范：- 开合位置与五金件；
    - 服装规范：- 面料重量、垂坠性、不透明度、表面与饰面；
    - 服装规范：- 颜色分布；
    - 服装规范：- 仅描述可见位置的接缝、裁片、撑骨、褶裥、抽褶、镂空、饰边和边缘处理；
    - 服装规范：- 鞋履的形状、材质、鞋跟或鞋底以及固定方式；以及
    - 服装规范：- 内容级别规定的遮盖范围与产品强度边界。
    - 服装规范：每件服装在每个视图中都必须贴合同一个身体。正面、背面和侧面结构必须一致。一个视图中可见的开合件、接缝、带子、镂空、开口或饰物，必须在所有其他视图中处于对应的实际位置。
    - 服装规范：使用物理上可信的面料表现。厚重材质保持结构，柔软材质自然垂坠，弹性材质顺应张力，轻透材质保持透明，反光材质反射周围环境，扣件承受合理负载。
    - 服装规范：不得使用物理上不可能的面料、没有支撑的刚性形状、随意漂浮的布料、无缘由的服装变形、相互矛盾的开合结构、融合的衣层，或无法从设定板中理解的复杂装饰。
    - 配饰规范：选择二至五件属于同一设计语言的配饰。为每件配饰指定固定的身体位置、尺度、朝向、材质、颜色、固定方式及其与服装的关系。
    - 配饰规范：可选类别包括头饰、发饰、耳饰、眼镜、颈饰、颈圈、肩饰、手套、束环、戒指、腰带、腰链、身体首饰、袜装、腿饰、鞋履，以及一件手持时尚物件。每个级别也可使用其强度约定允许的成人穿戴物和道具。这些是开放类别，并非必选物品。
    - 配饰规范：不得在每个身体区域都堆满配饰。保持面部、廓形、服装结构和内容级别所规定的遮盖范围清晰可辨。
    - 配饰规范：配饰不得在不同视图间换边、增殖、消失、移位、穿过身体、悬浮、刺入非预期身体部位，或变成另一种设计。成对配饰必须始终成对。
    - 成人道具规范：对每件允许使用的成人道具，固定以下信息：
    - 成人道具规范：- 产品类别与外形轮廓；
    - 成人道具规范：- 相对尺度与朝向；
    - 成人道具规范：- 材质、硬度、表面与饰面；
    - 成人道具规范：- 颜色与五金设计语言；
    - 成人道具规范：- 可见的控制件、接缝、接合处或充电部件；
    - 成人道具规范：- 穿戴贴合方式、与服装的连接、套袋、盒子、支架或收纳位置；以及
    - 成人道具规范：- 主导人像、配饰特写和材质平铺图中的对应位置。
    - 成人道具规范：产品类别、可见形态、材质、饰面、控制件、贴合、固定、快拆、连接、套袋、盒子、支架和收纳清晰。每件产品保持清洁、完整并有实际支撑，不作性器官特写，不呈现体内放置、插入、刺激、体液或性行为。
    - 成人道具规范：同一道具在各视图中必须保持数量、尺寸、颜色、材质、控制件和连接方式不变。不得把穿戴物变成另一种物件，也不得无缘无故增加重复件。
    - 产品形态：可见形状、佩戴位置、连接逻辑和尺度共同保留产品的商业身份，不以固定在其他位置的装饰物替代。
    - 产品形态：- 乳夹以衬垫接触面、张力限制器和释放系统贴合乳头；蕾丝、束身衣边缘、皮革饰边、带子等服装表面上的衣夹不替代乳夹。
    - 产品形态：- 佩戴的球形、衔杆式、片式或中空口塞清楚位于口部，呼吸设计和侧面释放装置可见；挂在颈圈、腰带或手上时呈携带状态。
    - 产品形态：- 可穿戴振动器位于专用外部服装或束带固定座，完整轮廓和释放装置可见，不隐藏或置于体内。
    - 产品形态：- 穿戴式固定带以稳定前置底板支撑可拆卸产品，产品不融入服装或人体。
    - 产品形态：- 体外展示的插入式玩具都由明确支架、托座、盒子、托盘或套袋支撑完整外形。
    - 产品陈列：人物视图中的贴合和接触点清楚；独立产品在配饰特写或材质平铺图中有完整展示，不用夹在衣服上或隐藏接触点伪装佩戴。
    - 性玩具产品规范：外部可穿戴性玩具可在人物视图中装配于服装或专用束带、口袋、套袋、腰带固定座、链条固定座或服装裁片上。将其视为静态的产品装配展示：产品保持关机，置于服装遮盖边界之外，除非其外部轮廓必须保持可见，并且与任何性行为无关。
    - 性玩具产品规范：可以命名和展示插入式产品类别，但必须完全位于体外。仅在贴合套袋、透明盒、充电托座、展示支架、密封托盘或整齐的材质平铺图中呈现。不得通过姿态、位置、服装开口、身体接触、隐藏的鼓起、线缆方向、遥控器或表情暗示插入。
    - 性玩具产品规范：每件性玩具的商业类别、外形轮廓、相对尺度、材质、硬度或柔韧性、纹理、颜色、接缝、控制件、充电部件、可拆卸连接件、盒子或固定座清晰，并在主导人像、配饰特写和材质平铺图中对应出现。所有视图保持相同的产品数量、尺寸、饰面、控制件以及收纳或穿戴贴合状态。
    - 结构与连接完整性：除非有可见连接件将它们实际连接起来，否则每件服装、手套、靴子、颈圈、束环、束带、腰带和道具都应保持为可独立制作的物件。通过明确命名的带子、链条、裁片、环扣、搭扣或接缝，沿两个部件之间的实际距离交代每条连接。
    - 结构与连接完整性：不得说颈圈无缝延伸成手套、腰部结构变成肩饰，或两个不相邻的部件在没有可见中间结构的情况下融合。任何带子或链条都不得在身体后方消失，再出现时却连到无关部件上。连接关系必须在正面、背面、侧面、四分之三角度、特写和平铺视图中保持一致。
    - 六视图设定板约定：每个画面都是一张横向角色设定板，恰好包含六个互不重叠的视图区：
    - 六视图设定板约定：1. 主视图区——从头到脚的主导全身时尚人像，采用四分之三观察角度，而非四分之三身长裁切，约占画布百分之四十；
    - 六视图设定板约定：2. 正面区——全身正面正投影视图；
    - 六视图设定板约定：3. 背面区——全身背面正投影视图；
    - 六视图设定板约定：4. 侧面区——全身侧视图；
    - 六视图设定板约定：5. 配饰区——与主体关联的特写，展示面部、头发、珠宝、开合结构和配饰连接；
    - 六视图设定板约定：6. 材质区——整齐平铺衣层、布样、五金件、鞋履、可拆卸配饰及所选级别的成人道具。
    - 六视图设定板约定：全部五个人物视图都描绘同一次设计展示中、保持同一服装状态的同一位女性。重复视图是对同一个人的参考，不是新增人物。
    - 六视图设定板约定：清晰的编辑式网格以主导人像区为主，其余五区较小。不同画面的区域比例可变化，但不重叠、不融合身体、不裁掉必需部位，也不让同一身体跨越区域边界。
    - 六视图设定板约定：使用克制的栏间距、对齐的基线和保留完整的留白。不得把设定板变成漫画页、胶片条、接触印样、剪贴簿、情绪板或备选服装合集。
    - 取景与姿态：主导人像、正面、背面和侧面区均展示从头部到鞋履的完整身体。相机接近腰部高度，使用正常透视，使比例可相互比较。
    - 取景与姿态：时尚参考姿势稳定且鲜明。正面和背面平衡承重、双臂放松，不遮挡服装结构或必需身体部位；侧面保持真正侧面廓形；主导人像可采用夸张但符合人体结构的时尚站姿和强化表情，不把服装扭曲成另一种设计。
    - 取景与姿态：每个视图中的女性只采用一种人体结构上可实现的姿势。肢体走向清楚，关节自然，双手完整，双脚着地，体重具有可见支撑。不得使用运动、行走、旋转、风驱动的动作、杂技、极端透视缩短或姿势转换。
    - 取景与姿态：材质平铺图必须展示两只鞋、两只手套，以及每组成对束环、长袜、带子、夹具、耳饰或其他成对物品的两个成员。绝不能用一个样品代表一对；穿戴设计使用成对物品时，也绝不能写成一只手套、一只靴子或一只鞋。
    - 身份与服装连续性：在所有人物视图中精确保留：
    - 身份与服装连续性：- 脸型与五官；
    - 身份与服装连续性：- 年龄与肤色；
    - 身份与服装连续性：- 体格与身体比例；
    - 身份与服装连续性：- 头发长度、发质、分缝与造型；
    - 身份与服装连续性：- 妆容与指甲处理；
    - 身份与服装连续性：- 服装数量、叠穿顺序、合身程度、颜色、材质、接缝、开口和开合结构；
    - 身份与服装连续性：- 配饰数量、所在侧、固定方式和位置；以及
    - 身份与服装连续性：- 内容级别规定的遮盖范围、穿戴物强度和成人道具清单。
    - 身份与服装连续性：不得在同一区域内复制这位女性，不得凭空增加肢体或身体结构，不得将不对称细节镜像到错误一侧，也不得展示不可能属于同一件服装的正背面结构。
    - 风格、光线与材质：采用超写实时尚摄影与产品设计的清晰度。每个主题选择一套统一的视觉体系：精准的摄影棚呈现、强调触感的工坊记录、克制的电影式世界营造、档案式高级定制展示、工艺奢华、仪式般的冷峻、哥特式华丽、工业感剪裁、戏剧式奢华，或同等明确的原创体系。
    - 风格、光线与材质：整张设定板共用一套具有合理光源依据的照明。每个区域的肤色、服装颜色、材质响应和配饰饰面保持一致。辅助特写可以增加细节，但不得改变光线方向或色温。
    - 风格、光线与材质：背景必须有助于分离廓形并清晰呈现材质。避免与服装争夺注意力的景物、装饰性尘埃、雾、火花、粒子、戏剧化天气或遮蔽结构的氛围效果。
    - 无文字设定板：不得将主题标题或区域名称呈现为可见文字。规划设定板时，区域名称仅作为内部版式参考。
    - 无文字设定板：各区由空间位置和视觉功能区分，分别为主导全身四分之三角度人像、全身正面、背面和侧面视图、与主体保持关联的配饰特写及整齐的材质平铺图，不显示区域名称或标题。
    - 无文字设定板：成图不得包含文字排版、字母、数字、尺寸标注、品牌名称、标志、标语、说明文字、伪字母、水印、签名或其他可见文字。
    - 主题与画面：同一主题中的画面，是同一位女性和同一完整造型的平行设定板版式方案。保留身份、服装、配饰、成人道具、遮盖范围、配色、材质体系和角色表现方向。变化呈现方式，而不是设计事实。
    - 主题与画面：同一主题的各幅画面保留设计本身，至少在以下四项形成实质差异：主导人像朝向、承重站姿、手位、主导区域位置与比例、三个正投影视图排列、配饰特写目标、材质平铺几何、背景材质、主光方向、阴影形状或图形化留白。
    - 主题与画面：不得描述在不同视图或画面之间穿衣、脱衣、打开、移除、添加、更换、调整或变换服装。
    - 完整设定板：精致、无文字的女性六视图角色设定板铺满横向画布，每幅独立呈现稳定身份、完整服装、固定配饰、所选级别产品、六区域位置与功能、姿态与裁切、材质、背景和共用照明。
    - 产品结构：衬垫、通气结构、圆润边缘、限张力五金件与快拆扣清楚可见。
    - 所选强度通过服装、器具、产品、姿态、材质与光线呈现，不以级别标签代替画面。
    - 所选级别包含任何成人产品时，至少让一件选定产品在主导人像或配饰特写中具有明确的视觉作用。
    - 成人道具是时尚产品元素，绝不是表演者或人体结构的替代物。依据商业产品形态和控制设计语言使用清晰的产品类别，例如棒式按摩器、遥控振动器、硅胶塞具、成对乳夹、口塞、束缚环，或同样清晰可辨的原创类别。
    - 配饰特写可以在上躯干部位裁切，每个可见身体部位都与同一女性连接。
    - 材质区域不包含身体部位或人体模特，展示每组成对服装、鞋履或配饰的两个成员，不含穿戴造型之外的备用、备选或替换物品。
