id: dress
description: '创作多样、精致、超写实的女性时尚角色设定板。每个画面都是一张完整的六视图设定板，呈现同一位成年中国女性、一套完整统一的服装、配饰、在允许时使用的成人道具，以及结构、材质和对应内容级别的造型强度。


  这是服装、配饰与产品设计，不是叙事场景、故事分镜、变身过程、解剖研究或性互动。指定的内容级别决定服装遮盖范围、感官强度、可穿戴成人配饰、成人玩具的有无及产品细节的强调程度，不作性器官特写。


  每个主题都定义一位不同的女性，以及不同的服装概念、配饰语言、材质体系、配色、环境灵感和时尚态度。'
cast:
  female_count: 1
  male_count: 0
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 将强度尺度的起点设为明显性感但不露骨的时尚，而非普通日常服装。
      - 围绕内衣、连体衣、敞开长袍、轻透叠穿、镂空、吊带衬裙、束身衣、袜装或同等明确的原创服装构建造型。
      - 展示较大面积的成年肌肤，同时让关键部位稳定的服装遮盖在每个视角下都保持一致，不得因角度变化而意外暴露。
      - 通过廓形、衣层敞开程度、透明度、纹理、贴合程度和配饰位置表现性感，不作性器官特写。
      - 当颈圈、柔软束环、吊袜带结构、身体链饰或轻量束带元素属于这套时尚体系时，允许使用这些克制的成人意味穿戴物。
      - 允许零至一件视觉克制的外部成人产品，作为洁净的展示或收纳物出现在主导人像、配饰特写和材质平铺图中，其形态始终从属于以内衣为主导的时尚造型。
      - 保持本级别以时尚为主导：不得使用厚重的恋物五金件、束缚系统、“BDSM”器具、成组堆积的产品，也不得暗示产品使用。
    erotic:
      shared:
      - 构建具有明确成人属性的产品与穿戴物时尚体系，不得简化为内衣加一件象征性配饰。
      - 协调选用敞开式服装、束带结构、身体首饰、手套、长袜、鞋履、头饰、腰带、颈圈、束环、带子或同等明确的原创物件。
      - 包含一至三件设计明确的成人产品或性玩具，作为同一服装体系的核心设计元素。外形轮廓、相对尺度、材质、颜色、表面、控制件、固定方式、套袋、盒子、支架或收纳位置清晰。外部可穿戴产品可装配在服装上，插入式产品仅限展示。
      - 穿戴部件只能连接在明确命名且不涉及性器官的区域，例如颈部、肩部、手腕、躯干、腰部、大腿、脚踝或服装五金件。
      - 在每个人物视图中保持关键部位的服装遮盖一致，并通过直白的产品语言、更醒目的五金件和更强烈的穿戴造型表现更高级别，而不是依靠人体结构描述。
      - 服装、穿戴物和产品必须组成一套经过设计的体系，而不是在内衣造型上事后添加无关物件。
      - 不使用完整的“BDSM”束缚套装、限制活动的连接结构、悬吊五金件或击打器具。
    hardcore:
      shared:
      - 构建具有完整、协调的“BDSM”器具体系的服装设计板，而不只是更强烈的成人产品造型或普通束带造型，更绝不是对“BDSM”活动的描绘；不得依靠受缚姿势、痛苦状态或模拟场景表现“BDSM”设计语言。
      - 以敞开式服装、束身衣、结构化束带、颈圈、快拆束环、束缚灵感腰带、身体链饰、手套、长袜、大腿或脚踝带、高筒靴、面具或眼罩以及协调的五金件，构建一套统一的恋物时尚体系。
      - 总共包含三至六个“BDSM”专属设计元素，其中至少两件外部可穿戴器具和至少一件可佩戴、携带、放入套袋或展示的明确“BDSM”产品。适合的类别包括快拆束缚环、乳夹、球形口塞、衔杆式口塞、中空口塞、展示牵引绳、装饰绳组、带衬垫的姿态杆，或同样清晰可辨的原创设计。
      - 除三至六件“BDSM”物品外，再从精选性玩具产品类别中加入一至三件明确命名的性玩具。其中至少一件可以是外部可穿戴产品；每件插入式产品都必须清楚可见地位于体外，放在套袋、贴合盒、展示支架或材质平铺图中。
      - 说明每个元素的材质、颜色、尺度、五金件、固定方式、调节范围、快拆部件、身体位置或展示位置，以及与服装体系的视觉关系。
      - 所选的任何产品都可在人物视图中以佩戴状态出现，前提是完整贴合方式、连接、安全释放装置和可见产品形态均清晰可辨。每件穿戴物都应不承重、低压力，并具有可见的释放方式。
      - 佩戴的夹具产品必须使用宽大的衬垫或硅胶包覆接触面、可见的低张力限制器和即时释放拉片，不得有夹痕、变色、变形或疼痛反应。
      - 佩戴的口塞产品具有柔软材质、通气孔道或中空结构、宽松且贴合下颌的轮廓，以及可立即触及的快拆扣；鼻部与可见呼吸通道保持畅通。
      - 其他道具可佩戴在预定且可见的贴合位置，也可携带、放入套袋、盘卷、装盒、安装在展示支架上，或整齐摆在配饰特写与材质平铺图中。
      - 保持一种有意设计的服装状态，只允许为展示所选佩戴产品的贴合方式而需要的稳定可见范围；服装结构与产品设计应比人体结构更突出。
      - 保持静态单人产品设计展示：肢体不互相捆连，身体不悬吊，颈部不承重；不呈现击打、亲密触摸、插入、刺激、体液、伴侣、性行为或叙事事件。
      - “BDSM”器具规范：协调使用皮革、涂层织带、缎面、金属、硅胶等材质，统一重复使用一种五金饰面和一种开合设计语言。
      - “BDSM”器具规范：每个颈圈、束环、带子、腰带、束带、面具、眼罩、夹具组或口塞，都必须展示宽度或尺度、衬垫或接触面处理、调节方法、扣合方向和可见快拆部件。每条牵引绳、每套绳组以及每件姿态杆、盒子、套袋或支架都必须具有可见支撑，且不涉及任何承重或限制活动的用途。
      themes:
      - 视觉冲击：每个主题具有一眼可辨、缩成缩略图仍然强烈的廓形。时尚比例、材质对比、有节制的五金密度、图形化带子几何、明确色彩层级和一个主导器具造型重点共同构成视觉冲击，不依靠裸露、产品数量、随意带子、视觉杂乱、痛苦状态或模拟活动。
      - 造型组合：服装原型、器具体系、性玩具产品方向和材质配色形成统一设计。各主题的四部分组合、主导廓形、五金分布、产品类别系列和色彩层级各有区别。
      - 视觉对比：每套造型至少组合以下三个维度：
      - 视觉对比：- 硬挺束身结构与柔软垂坠；
      - 视觉对比：- 亮面与哑光材质；
      - 视觉对比：- 宽幅结构带与细链或窄带；
      - 视觉对比：- 深色主导区域与一处高饱和度或浅色点缀；
      - 视觉对比：- 包覆的肩颈与敞开的躯干几何；
      - 视觉对比：- 修长纵向元素与宽大腰臀结构；
      - 视觉对比：- 抛光金属与皮革、天鹅绒、缎面、乳胶或涂层织带；
      - 视觉对比：- 超大廓形核心与较小辅助配饰。
      - 造型层级：一个主导重点、两个次级结构和克制的辅助细节。主导重点可以是雕塑感束身衣、宽幅躯干束带、戏剧性颈圈与披肩、建筑感臀带、高筒靴廓形或其他可穿戴核心，具有可制作结构、不承重，正面、背面、侧面和四分之三角度均清晰。
      - 造型语言：当代、哥特、仪式、马术、工业、闺房、剧场、夜店、工坊和历史高级定制；不使用机械改造身体部件、发光电路、全息影像、动力装甲、航天器造型、数字界面或科技造型服装部件。
