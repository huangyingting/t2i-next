id: precise-intimate-activity-geometry
description: 独立的照片级写实成人亲密图像，以精确、简洁的身体几何、接触和支撑关系呈现清楚可读的当前动作。
authoring:
  themes:
    common:
    - 主题保持人物、房间、主要活动、基本身体排列和必要支撑稳定；各幅画面拥有自身的相机侧向、镜头、取景、前景与遮挡关系。
    - 阵容恰好包含 female_count 名成年女性和 male_count 名成年男性，各人身份与性别在主题内固定，不增加旁观者。
    - '性动作库：在不同主题间变化动作。选择一个明确的主要活动，至多再加两个次要接触：'
    - '性动作库：1. 在另一名自愿的成年人观察或引导下独自自慰；'
    - '性动作库：2. 由伴侣引导的自慰或相互手淫；'
    - '性动作库：3. 亲吻、舔舐、吮吸乳房，或用手刺激乳房；'
    - '性动作库：4. 舔阴或吮阴茎；'
    - '性动作库：5. 阴道或肛门插入；'
    - '性动作库：6. 使用手持外用振动器或假阴茎，并让其所属者可见；'
    - '性动作库：7. 由另一名成年人控制的穿戴式刺激；'
    - '性动作库：8. 面对面、后入、侧卧、坐姿、站姿或被托举时的性行为；'
    - '性动作库：9. 在手腕或脚踝使用带衬垫的束缚，同时进行手部、口部、玩具或插入式性行为；'
    - '性动作库：10. 自愿的打屁股、软拍、眼罩、高潮边缘控制、张开身体的姿势、跪姿臣服或对身体安全的绳缚。'
    - '性动作库：每名可见成年人都通过动作、支撑职责、控制、相互触碰或明确反应参与。若有三名或更多成年人，为每人分配独立动作和独立轮廓位置。说明谁触碰谁；不要把群体描述成一个混合整体。'
    - 外观随取景呈现：可见体型与皮肤、面部、发型、仪容、妆容、表情和鞋履服从相机遮挡。服装与动作相容，移位衣物具有唯一可见位置，不借造型展示隐藏或画外部位。
  frames:
    common:
    - 精确保持 female_count 名成年女性与 male_count 名成年男性，身份、年龄外观与国籍形象稳定。每个可见面部、头、躯干、骨盆、臂、手、腿、脚、乳房、嘴、舌与生殖器结构都具有唯一人物归属。
    - '精确人物构成与身体归属：每名请求中的成年人都有一个连贯的身体：一个头部、一个躯干、一个骨盆、两条手臂、两只手、两条腿、两只脚和一套解剖一致的生殖器，无论全身可见还是部分位于画外。身体完整性是拓扑要求，不是全身取景要求。当可见肢体靠近同一区域时，说明左右。用可辨认的轮廓和小片负空间分隔可见的手、嘴、玩具、生殖器、支撑装置及重叠肢体。'
    - 执行动作、承重或决定姿势的可见肢体，从身体连接处连续延伸至手、脚或画框边缘，各承担一个职责；隐藏肢体不透过遮挡显现。
    - 画面只有一名中心人物，具有清楚位置、朝向、身体轴线、接触、支撑与可见反应：
    - '中心人物锁定：1. 画面位置：画面中央、偏左中央、偏右中央、上部中央或下部中央；'
    - '中心人物锁定：2. 朝向：面向相机、背向相机、左侧面、右侧面或四分之三侧向；'
    - '中心人物锁定：3. 身体高低姿态与轴向：站立、跪姿、坐姿、仰卧、俯卧、侧卧、被托举、水平、垂直或斜向；'
    - '中心人物锁定：4. 每条可见身体链和每个指名的遮挡体积；'
    - '中心人物锁定：5. 精确动作、可见的动作执行部位和可见支撑点；'
    - 中心人物面部可见时，表情与视线清晰。
    - 同一瞬间每条肢体只有一个位置、支撑职责和主动接触，不形成先后移动的多个状态。
    - '中心人物锁定：将可见面部放在无遮挡的轮廓位置。为动作中心赋予相机场景图选定的可见或被遮挡状态。对于接触边界可见的明确生殖器动作，将骨盆保持在画面中部或中下部的三分之一区域。对于可见的口乳接触，将胸部和嘴保持在中间三分之一区域。对于托举姿势，让悬空骨盆、每个承重接触点以及托举者稳固支撑的躯干可见。'
    - 其他人物各有独立的远近与左右位置、朝向、身体高低姿态、躯干轴线、骨盆位置、可见肢体链、支撑点、遮挡体积和动作。头部角度、视线与表情服从实际面部可见性。
    - '其他人物描述块：每种支撑状态都应内部互斥。平放的脚，其脚跟、前脚掌和脚趾都接触表面。抬起脚跟时，只有前脚掌和脚趾接触表面。整只抬起的脚不接触任何表面。支在表面上的膝盖不能同时抬起，伸直的肘部也不能同时落在表面上充当支撑。为每只承重的手、膝盖或脚指明支撑表面。'
    - 其他人物与中心人物的空间关系清楚：旁边、后方、前方、上方、下方、双腿之间、胸部处、骨盆处、支撑背部或从下方托举；重叠时仍可辨双方身体归属。
    - '二维投影与表面可见性：将画帧视为从指定相机位置得到的单一不透明二维投影。只描述无遮挡视线能到达的身体结构和接触。身体体积、服装、家具和较近的成年人会遮挡后方表面；绝不把身体结构描述为透过另一表面可见。'
    - 相机侧向位置、高度、观察方向、镜头、取景尺度与近侧可见表面保持唯一，遮住主要接触的近侧体积明确；不在一幅图像混合视角。
    - 可见身体、接触边界、支撑和道具均处于同一相机投影范围；姿势、动作、造型、光线和焦点服从这套遮挡关系。仅露出侧面边缘时，只有该表面小片可见，不把整个部位显露出来。
    - 主要接触边界只处于可见或被近侧身体体积遮挡的一种状态；遮挡时由身体对齐关系表现动作，不展示内部结构。隐藏与画外部位不同时获得可见表面、接触细节或焦点。
    - '二维投影与表面可见性：- 正面视角中，胸部和躯干前侧可以可见，但完整臀部和臀沟不可见；转向的边缘处只能略微露出臀部外轮廓。'
    - '二维投影与表面可见性：- 背面视角中，背部和臀部可以可见，但双乳、乳头、腹部和前侧生殖器不能完整可见。'
    - '二维投影与表面可见性：- 严格侧面视角中，只展示侧面轮廓和近侧肢体；不要声称前后身体结构同时完整可见。'
    - '二维投影与表面可见性：- 四分之三侧视角中，展示近侧的前表面或后表面，另加仅在解剖上合理的远侧边缘轮廓。绝不把完整正面胸部和双臀完整后视图结合起来。'
    - '二维投影与表面可见性：- 转头会改变面部可见性，但不会让躯干、骨盆、乳房或臀部转向相机。'
    - '二维投影与表面可见性：身体重叠时，明确说明近侧与远侧的遮挡顺序。若选定角度使主要接触藏在大腿、骨盆、躯干、手、衣物、坐垫或家具边缘之后，就移动相机或改变姿势。不要用透明身体、不可能的扭转、第二视角或未说明的镜子解决遮挡。已说明的镜子只能以一个物理一致的反射展示另一表面，并须具有自身明确的位置和反射角；直接视图和反射不得合并成一个身体。'
    - '二维投影与表面可见性：接触边界可见时，不要只声称其视线畅通。要通过指明观看窗口来证明：相机侧向位置、近侧身体边界、远侧身体边界，以及两者之间的接触边缘。应用以下针对动作的投影规则：'
    - 阴茎口腔插入采用侧后方或后侧四分之三视角，执行者头部与所属者骨盆重叠，头部或近侧大腿遮住口部接触边界，局部阴茎、龟头、嘴唇、舌与口腔不外露。外部生殖器舔舐采用侧视角，一个舌头与外表面的接触边界可见。
    - '二维投影与表面可见性：- 对于口乳接触，使用侧面或四分之三侧向角度，展示动作执行者嘴部的侧面和被接触的近侧乳房。嘴部遮住唇下的中央区域；只描述可见的嘴唇、舌头、乳头边缘和周围乳房的反应。'
    - '二维投影与表面可见性：- 对于插入，使用侧向或四分之三侧向视角，透过近侧大腿间的空隙观看。只展示外部根部、接受方开口的近侧边缘和外部插入交界。在该交界处结束可见链条，省略内部部分。正前方或正后方视角不能穿过较近的骨盆暴露完整交界。'
    - '二维投影与表面可见性：- 对于托举插入，要么选择偏正面视角展示面部、胸部和外部骨盆交界，要么选择偏背面视角展示臀部和托举支撑。若要同时展示外部骨盆交界和一个臀部支撑点，应使用真正的侧向四分之三角度；远侧臀部和远侧支撑接触仍被遮挡。绝不声称双臀、两个臀下接触点、完整正面胸部及插入交界都能在一个直接视图中清晰可见。'
    - '二维投影与表面可见性：- 对于手部或玩具接触，将执行动作的手或玩具放在目标旁边，而非直接盖在其上。至少保留一个可见目标边缘，位于接触的手指或装置之外。'
    - '二维投影与表面可见性：- 一名成年人直接站、跪或坐在另一人身后时，正面相机看不到后方成年人的骨盆，也看不到夹在两个躯干或骨盆之间的任何接触。将两人错开并使用侧向四分之三相机视角，或从可见描述中省略隐藏接触。'
    - 每处接触只具有一种拓扑状态：
    - '接触状态不变量：1. 分离：两个结构之间存在可见间隙；'
    - '接触状态不变量：2. 外部接触：两个外表面在一个可见边界相接；'
    - '接触状态不变量：3. 插入：接受方边界环绕主动结构，其近端外部段与指名所属者保持连续，并终止于该边界。'
    - '接触状态不变量：同一接触不能在同一画帧中处于两种状态。对于插入状态，只描述所属者、连续的近端部分和接受方边界；省略该边界以外的所有远端结构。不要为嘴内或身体开口内的身体结构命名、定位、布光、对焦或赋予运动。'
    - 接触边界两侧共享同一画面位置和深度平面；手、脚、身体表面、墙面及家具接触点处于相连关节可达范围，不穿过其他实心体积。
    - 阴茎口部活动只呈现外部舔舐或口腔插入之一：前者阴茎在嘴外、舌头接触外表面；后者头部与所属者骨盆对齐，接触边界和局部结构被遮挡。手部接触形成独立动作链，不打断身体归属。
    - 可见接触具有明确执行者、连续相连的身体部位或手持物、目标人物及身体位置、动作方向和可见反应；接受方的全身反应不形成第二套接触结构或重复肢体。
    - 被遮挡的接触由双方身体对齐、近侧遮挡体积与可见全身反应呈现，不展示隐藏接触或内部状态。
    - 每条接触链只有一个主要动作，可为舔舐、吮吸、亲吻、按压、抚弄、打圈、摩擦、抓握、分开、握持、抬起、支撑、插入、接受、摇动、抽送或振动。
    - '动作接触链：所需精确度示例：'
    - '动作接触链：- 舔乳：Mina 跪在画面下部中央，面朝右侧；Mina 的舌头从 Mina 的嘴中可见地伸出，平贴着 Lian 的左乳头向上移动，同时 Lian 将胸部拱向 Mina。'
    - '动作接触链：- 手部刺激：Jun 的右肩连续连接到他弯曲的右肘、手腕、手掌以及两根可见手指，手指在 Mei 的阴蒂上打圈；Mei 的双腿保持张开，骨盆朝他的手倾斜。'
    - '动作接触链：- 被遮挡的口腔插入：An 跪在 Bo 张开的大腿之间，为其吮阴茎；侧后方相机使 An 的头部轮廓与 Bo 的耻部重叠，Bo 的近侧大腿遮住他们的接触边界，An 的双手都放在 Bo 的大腿上。'
    - '动作接触链：- 插入：插入部位与其所属者的骨盆保持可见连续；相连根部从该成年人的耻部伸出，接受方的耻部在同一接触平面与之相接，接受方开口的近侧边缘在外部插入交界处与阴茎体相接。说明躯干朝向、耻部对耻部接触、腿部位置、节奏和支撑。在接受方边界处结束可见描述，省略内部部分。绝不让插入部位终止于腹部、大腿、衣物、坐垫或空处。'
    - '动作接触链：- 玩具动作：指明握持或佩戴玩具的成年人、抓握玩具的手、玩具形状与朝向、被接触的身体结构、线缆或控制器位置，以及可见的材质反应。'
    - 一条肢体只承担一个物理职责：握腕的手不同时支撑大腿，承重的肘或前臂不同时握持、按压、分开、抚弄或束缚另一人；嘴接触乳房时，舌与唇保持在该乳房处。
    - '托举与支撑几何关系：当另一名成年人托举中心人物时，说明：'
    - '托举与支撑几何关系：- 谁在托举，从哪个画面位置托举；'
    - '托举与支撑几何关系：- 每条托举前臂和每只手在何处接触中心人物身体；'
    - '托举与支撑几何关系：- 哪个部位承重：上背部、胸廓、腰部、臀部、大腿外侧或膝盖；'
    - '托举与支撑几何关系：- 中心人物的身体轴向、弯曲关节、自由肢体、头发方向，以及距地板或家具的高度；'
    - '托举与支撑几何关系：- 托举者的站姿、双脚间距、屈膝程度、脊柱角度、平衡方式和视线；'
    - '托举与支撑几何关系：- 任何第二名支撑者及其独立承重点。'
    - '托举与支撑几何关系：示例：Tao 站在画面偏左中央，双脚与肩同宽，膝盖弯曲；他的右前臂穿过 Rui 近侧臀部下方，右手支撑她的远侧臀部，左前臂则横托她的上背部。Rui 面向 Tao，身体略呈斜向、直立地被举起，左臂环绕 Tao 的肩膀，右臂伸展，双大腿环绕他的髋部，双膝弯曲，双脚均离地。'
    - '托举与支撑几何关系：对于托举插入，使用力学相容的轴向。接受方保持垂直或斜向并面朝托举者，大腿环绕托举者髋部，双脚离地；托举者的一条前臂和手支撑双臀，另一条手臂支撑上背部。两人的耻部在双方腹部下方的一个可见接触平面相接。不要将被托举者描述为水平或横躺在托举者身上，同时又让双大腿环绕托举者腰部。'
    - '托举与支撑几何关系：对于束缚、悬吊、家具或机械支撑，将承重路径从指名的身体部位，经衬垫、束环、手臂、吊带或表面，追踪到可见的墙、床、地板或天花板锚点。展示触手可及的释放装置，保持颈部和气道不受阻碍。'
    - 完整室内环境具有地板、墙壁、天花板、主要家具、入口、窗户或建筑开口，以及 3–6 件位置明确的道具。有场景依据的光源、方向、柔软度、色彩、高光和阴影形成三个景深层次。取景保留主动接触和支撑链，全部表面服从同一相机与遮挡关系。
