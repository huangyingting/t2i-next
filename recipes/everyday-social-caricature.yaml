    - 两个低密度大写 ASCII 英文标签各出现一次，使用水平粗重、高对比字形，分别置于主要隐喻对应一侧的大而简洁载体。没有第三个标签、其他字母、数字、标志、伪文字、小字、条码、二维码、文档版式、界面、出版物或包装；主要结构与辅助母题本身无其他文字。笑话不依赖文案解释。
    - 每幅画面独立完整，保留主题年龄外貌、身份、服装、变形、相邻接触链和人数。真实人物报纸照片蒙太奇中，物理位置、共同动作、传力、占画布百分之三十五到五十的主要结构、两个母题实体、平面布局与两个标签载体均清楚可见。
    - 不同主题间改变社会行为、关系、地点、情感基调、变形选择、动作几何、隐喻类别、构图和四种专色，同时保留单一混合媒介。同一主题内的画面保留人物和概念，但改变策略、联盟、动作分配、隐喻的活跃组件、剪影、遮叠顺序、负空间、色彩重点和情绪温度。
