id: furry-mythic-interactions
description: 创作多样的真人实拍幻想摄影，兽人是有形、活生生、有成熟社会角色的智慧拟人化存在，不是背景装饰。精确成年女性与男性名额涵盖人类与兽人，每个名额对应一个身体。每个主题恰好一名兽人，其余为人类；只有一种性别时兽人占用该性别名额，两种性别均有且数量不同时占用较小正数对应的性别名额，两种正数相等时占用男性名额。传统神话、民间传说、原创高幻想及英雄原型提供情境灵感；通过构图、镜头、布景、材料、配色、氛围和有来源的光线定义视觉风格。
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 所有人完整着装，行动保持非情色，表现冒险、幽默、竞争、外交、友谊、敬畏、怀疑、救援、仪式或社会讽刺。
      frames:
      - 每幅画面独立确立精确地点、国家、季节或日期，以及当前时间和光线。
    erotic:
      shared:
      - 只在接触所需处敞开、松开、提起、解开或移开服装，另一个明确服装部分保持可辨；兽人不是仅有毛皮的全裸身体。服装避开关节、尾巴、翅膀、承重点、嘴及接触路径。
      - 表现浪漫张力、部分裸体、成年皮肤或毛皮、相互拥抱、亲吻、感官梳理和非露骨亲密接触，不呈现插入、生殖器接触或性体液。
      frames:
      - 每幅画面独立确立精确地点、国家、季节或日期，以及当前时间和光线。
    hardcore:
      shared:
      - 只在接触所需处移开服装，保留另一明确服装部分；兽人不是仅有毛皮的全裸身体。服装避开关节、尾巴、翅膀、承重点、嘴及接触路径。
      - 呈现一种已经发生的明确成年人性行为，不以打斗、握手、救援、物件交换或强烈非性相遇代替。
      - 使用普通成年类人性解剖结构。兽人的毛皮、动物头、趾行腿、爪足、利爪、尾巴、角与翅膀保留物种形态；接触只使用类人的嘴、舌、手、手指和性器官。吻部形态、喙、角、利爪、尾巴、翅膀、爪垫、触手、武器、魔法或环境物件不作刺激工具；利爪收起，牙齿远离皮肤。
      - 多人场景中每人都与另一人发生当前接触，不只在背景旁观；单人场景只呈现唯一兽人触碰自身解剖部位。行为匹配固定性别解剖，例如外阴或阴蒂手部接触、头部形态相容的舔阴或直接外阴接触。
      themes:
      - 共同支撑面宽阔、干燥、水平、防滑，足够容纳所有人，如床、软垫台、宽长凳或铺地毯地面。根据身高、尺度、动作、关系、衣着和附近结构创造斜躺、坐、跪、蹲、倚靠、转身、相对或错开的姿势，关节和承重点自然可见。
      - 变化骨盆与躯干角度、面向、身高、前后顺序、横向错位、肢体接触、承重点、负空间与相机侧别，不只变换地点、物种、服装或机位来重复同一身体布局。
      frames:
      - 每人有独立无遮挡的头、躯干、骨盆、两臂、两腿、支撑链、轮廓和接触角色；脸、骨盆与接触点处于同一可辨构图。多人自我触碰可补充但不代替彼此接触，不以观看、等待、持衣或无关道具算作参与。
      - 两名女性与一名男性的阵容固定为两名人类女性和一名男性兽人。男性兽人的阴茎位于第一名女性阴道内，第二名女性的手直接接触第一名女性阴蒂，或男性兽人的阴茎或阴囊；三人组成同一当前接触链。
      - 每幅画面保留精确人数、性别、人类与兽人类别、姓名及相应动作。单人兽人使用自己的手接触自身部位；多人形成同一生殖器、口部或手部接触链。性交、口交与手部刺激均清楚显示具体部位归属及连接。
      - 画面保留真人实拍幻想摄影质感，并明确地点、国家、季节或日期、当前时间和光线。
      - 不采用站立插入、压墙、单脚或踮脚平衡、抬起或抱持、悬吊，或兽人趾行站立俯身于跪着人类上方的布局；骨盆高度匹配，不靠拉长大腿、扭曲膝髋、过度弯脊柱或藏住下半身解决身高差。
      - 每人骨盆朝向与支撑面可辨，左右肩、臂、手及左右大腿、膝、小腿、脚分别可追踪；每只手有独立可及的接触或支撑，承重与放松肢体清楚分离。
      - 人类手臂与兽人前肢不直接叠合，手腕不藏入毛皮，人手与爪不融合，两手不挤在难分辨的同一点；长毛不遮肘、膝、踝、髋。每手或前爪有五个可辨指头，传统物种固定指头数量不同时保持一致。
      - 兽人在亲密构图中有两臂两腿，肩、肘、腕、骨盆、髋、膝、踝与脚结构连贯；趾行腿呈现同一支撑平面上的成对抬起脚跟、跗关节、踝和前脚，不增加腿、膝、反向关节或无主肢体。
      - 尾巴不承重，静置骨盆后方或旁边，与腿、手臂、生殖器和人类轮廓分离，不缠绕建筑、家具或身体，不朝向接触区。翅膀、长袍、毯子和长毛避开关节及接触路径。
      - 有喙、扁喙、僵硬吻部、獠牙、大尖牙或突出动物颌部的兽人不采用口部与生殖器接触；动作匹配可见头部解剖。
      - 非口部行为中，手、手指、前爪、利爪、尾巴、服装与物件都在嘴外，不压、拉、遮或抚摸嘴边面孔；支撑手置于锁骨下方、共同支撑面、髋、腰、肩头、上臂或大腿外侧。嘴唇、牙齿、舌、下颌与吻部和手清楚分离。
      - 只有口部行为才呈现对应性器官越过唇线，不增加舔手、吮指、咬或朝手伸舌。颌关节自然、嘴唇不变形、牙齿可辨且只有一条舌，所有手、爪、尾巴、衣物与道具远离嘴。
      - 使用 35–65 毫米四分之三身或全身视图，承重手、膝、小腿及脚入镜；斜置相机分离重叠肢体，不采用正面轮廓堆叠、极端缩短、裁骨盆或隐藏支撑链的近景，精确接触仍清楚可见。
  themes:
    common:
    - 每个主题有具体动作、冲突、交易、考验、救援、仪式、调查、表演、旅程或逆转；一名主要主角以已经发生的身体动作发起、转向、拒绝或解决行动。单人时唯一兽人即为主角。
    - 固定名额映射：一女零男为女性兽人；零女一男为男性兽人；一女一男为人类女性与男性兽人；两女零男为人类女性与女性兽人；三女零男为两名人类女性与女性兽人；一女两男为女性兽人与两名人类男性；两女一男为两名人类女性与男性兽人。同性交互群体只有一名同一性别兽人，其余均为人类。
    - 每个人固定姓名、性别、物种类别、国籍、面孔、身高、体格、服装、识别细节、动机和主动角色，不因偏好动作而改变。全男性不混入女性性器官，全女性不混入男性性器官或精液。
    - 人类保留完整人类身体，不添加兽耳、吻部、毛皮、尾巴、爪足、蹄、翅膀、鳞片、角或变身。兽人以直立成年躯干、两条相连手臂、两腿、可抓握手或前爪、明确动物头为主；传统物种特征可有翅膀、尾巴、角、鹿角或第二对神话手臂，所有连接可追溯。
    - 兽人是具有职业、社会角色、姓名、面孔、体格、衣着和动机的成年智慧角色，不是兽首面具、吉祥物扮演者、毛绒玩具、兽装、标本或粘上耳尾的人类。人类神话角色使用人类名额，兽人诠释保留明确动物头和完整物种设计。
    - 兽人吻部长度、耳形、眼色、毛皮图案、尾巴、手、脚、身高、体格、疤痕、角和其他锚点在主题内稳定，不随机混合物种。精确阵容外不增加人群、守卫、仆人、肖像、雕像、倒影、屏幕人物、尸体或背景人形。
    - 原创高幻想可有瓷羽储存破碎誓言的鹤档案员、对记忆征税的雪豹桥梁执法官、盔甲展开成脚手架的犀牛救援工程师、递送密封梦境的渡鸦信使、水獭运河工程师、狐宫廷辩护人或宇宙兽首仲裁者。每人具有职业、私下愿望、矛盾、材料语汇与限制，不只是物种加盔甲。
    - 主角通过可见发起、选择、拒绝、谈判、引导、救援、挑战、欺骗、保护、释放或完成行动处于中心，不降为旁观者、匿名视点或可替换冒险者。
    - 每名兽人至少穿戴一件清楚可见、适应物种的设计服装或可穿戴元素，表达职业、文化、地位、任务和品味。工作服、长袍、礼服、旅行服、防护装备等轮廓、覆盖、材料、扣件、磨损、颜色与配饰随角色和环境变化。
    - 人类与兽人共享真实布景、镜头、光线、重力和接触阴影。毛发逐根可辨、有生长方向、底绒与护毛、关节聚束、长度色差、情境造成的湿尘；眼睛湿润反光、耳缘半透明、鼻部皮面有纹理、胡须根和物种牙舌可信。
    - 面孔由物种颅骨、吻部、脸颊、眉、眼睑及颌骨构成，耳角、眼睑、眉、吻部张力、嘴唇、鼻孔、胡须和头部姿态共同表达情绪，不只是覆盖毛皮的人脸。
    - 领口容纳颈毛，袖口适应手腕与前爪，裤、袍和甲适应趾行或跖行腿且设尾部开口，帽盔容纳耳、角或鹿角；呈现压毛、推毛、接缝、搭扣、重量、摩擦和接触，不悬浮服装部件。
    - 采用实体生物特效、假体面部、细腻机械仿生、真实织物、风化金属、雕木、皮革、陶瓷、羽毛与现场氛围；眼、嘴、尾和翅膀细化仍服从拍摄的材料真实感，不用动画、漫画、插画、概念艺术、赛璐珞、毛绒玩具感、塑料皮肤、游戏渲染或无重量数字毛发。
    - 神话灵感可来自西游记、八仙、中国民间传说、天使恶魔、希腊罗马、埃及美索不达米亚、北欧、日本韩国、南亚东南亚、非洲、大洋洲及美洲传统。每个主题使用连贯文化或原创世界语境，以具体传统属性、物件与道德张力形成新衣物、材料、配色、身体设计和情境，不拼贴无关服饰与建筑。
    - 可构思天庭通行证谈判、修复誓言炉、兽首档案员、渡鸦先知、检验誓言、修复神话机械、翻译预言、揭穿伪造奇迹、拒绝契约、归还被盗姓名或交换工艺。
    - 主要主角与其余角色各有不同具体结果需求，或单人面对物理障碍；实体物件、结构、路线、仪式、文书、机器、餐食、表演或自然力使愿望相遇。主角的决定已通过身体动作落实，其他人即时回应，改变的力量关系在静态图像中清晰。
    - 优先相互作用而不是泛化战斗；战斗情境仍有明确决定点、稳定支撑和武器归属。每个人触碰、携带、拉动、抵住、阻挡、交换或操作同一核心物件或力量，或受到其机械作用，接触、力向、重量、平衡与反应可辨。
    - 主题锁定主角、精确阵容、来源或原创世界、国家、地点、时代、季节、时间、社交场合、核心互动、愿望冲突、已完成决定、即时回应、物理关键物件、每人衣着材质与可见情感主旨。构图、镜头与照明共同形成独立清楚的视觉风格。
    - 变化来源传统、物种、主角、职业、场景、关系、目标、物件、动作、姿势几何、配色、相机与光线，不只换动物名称重复王座厅谈判。
  frames:
    common:
    - 每幅画面是独立真人实拍幻想照片，完整呈现精确女性与男性总数、唯一兽人和其余人类。逐人明确姓名、性别、物种类别、角色及动作，保留主题的确定性名额映射；单人只呈现对应性别的唯一兽人。
    - 独立确立主要主角、每位参与者、神话或原创世界、精确国家、地点、时代、季节、时间、社交场合、当前动作、衣着、身体支撑、接触、电影风格、摄影机与光线。
    - 固定身份、物种解剖、动机、核心物件、戏剧前提、日期、时间窗口、天气、决定状态、物件状态和动作阶段。画面是共同决定性瞬间的平行重排，不是时间推进；变化调度、手势、接触几何、前景、视点、景别、焦点层次和光向。
    - 主角已经以身体动作执行决定，核心物件出现对应改变，其他角色或单人主角立即作出可见身体回应；不是选择前停顿、等待或未来行动。
    - 主角的脸、作出决定的手或身体动作以及产生后果的接触处于最清晰焦平面。另一人可体量更大，但不取代主角的视觉中心。
    - 接触或支撑依赖四肢、尾巴、翅膀或趾行腿时，完整身体可追溯；近景只裁去与当前动作无关部位。毛皮、衣物、烟、家具或暗部不遮主角决定、兽人回应或核心接触。
    - 除传统物种固定差异外，每人一个头、一个躯干、两臂两腿，每条肢体只有唯一主人。人类手臂与兽人前肢、人手与爪、左右肢体及各接触处清楚分离，不多余、缺失、重复、脱离、融合或反向。
    - 身高差、重心、脚位、趾行平衡、家具承重、毛皮压缩、布料张力、抓握、反冲与投影可信；大翅膀或尾巴影响平衡和附近材料。
    - 保留独立左右手脚及支撑链，不以毛皮掩盖关节。亲密接触中的尾巴不承重、不缠绕身体或建筑、不混入腿或接触区，兽类附属结构、武器和环境物件不参与刺激。
    - 口部行为匹配头部解剖；喙、扁喙、硬吻、獠牙、大尖牙或突出动物颌部不与生殖器接触。非口部动作中手、爪、尾、衣物和物件与嘴完全分离。
    - 有来源的现场光使眼睛和面孔可读，兽人毛皮、鳞片、羽毛、鼻纹、湿润眼睛与胡须，以及人类毛孔、细毛、汗、疤痕和织物处于同一摄影现实。
    - 画面中的动作、身体覆盖与接触保留主题的视觉强度，不以互不相关的并排摆姿、泛化盔甲、废墟或魔法光芒代替故事；变化体现真实调度而非只有措辞不同。
