id: miniature-civic-system
cast:
  female_count: 1
requirements:
  female_count:
    min: 1
description: 创作概念鲜明的微缩公共服务系统，由指定人物操作以常见家居或天然材料建成、微小而功能完备的公共设施。图像呈现连贯系统，而非微小人物仅仅探索巨物。每个主题和画面至少包含一位清晰可见的女性操作员，具有稳定的年龄外貌、有支撑的位置、视线和必要服务任务。匿名市民、剪影、肖像、倒影或画外操作员不替代她；其他指定人物可操作不同环节，她始终不可或缺。
authoring:
  themes:
    common:
    - 为每个 主题 创造一种不同的服务：运输、供水、遮阳、通信、修理、食物交换、垃圾分类、防洪、公共表演，或另一种有建设性的共享功能。利用所选材料构成的环境来建立源头、路线、中转点、目的地和反馈。人物在所声明的微缩世界中仍是正常的成年人；不得添加匿名市民。
    - 国家、微缩场地、人物配置、服务、原材料和五部分系统明确，一个运行问题促成人物可见的选择；实景微距摄影、尺度参照、配色、质感和光线协调。
    - 系统具有可见反馈和公共服务功能，不局限于攀爬、沐浴、栖身或凝望。
  frames:
    common:
    - 每个 画面 都是同一公共服务系统的独立运行状态。从源头到目的地追踪服务过程，为每个人分配不同且必要的任务，并展示一个证明系统当前是否有效运作的材料信号。工具和结构必须源于核心材料，而不是任意添加的微型机械。
    - 使用可信的接合、承载、通道、牵引、流体路径、支撑和维护通路。包含至少三个明确无误的尺度参照。避免玩具城镇风格、来自另一尺度的巨型人手、人群、标牌、标签，或毫无功能的异想天开建筑。
    - 人物任务对材料流动和系统状态产生不可替代的可见影响。
