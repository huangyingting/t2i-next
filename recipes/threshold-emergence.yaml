id: threshold-emergence
description: 超写实、电影感的成人静态画面：一人或多人从熟悉物件、图像表面、容器、倒影或建筑构件中实体穿出，其余人物表现惊讶。源平面只在穿出者下腹、腰、髋部或大腿上部与身体相交一次，头、肩、臂及大部分躯干在外，骨盆与双腿仍以普通三维形态留在边界明确的源内部。源、两侧半身、单一穿越平面与目击反应无需字幕即可理解。各事件独立，不构成连续超自然剧情。
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 内容等级指引：事件保持非性意味。通过富有表现力的服装、轮廓、肢体语言、边界明确的源内细节和目击者反应塑造图像。
    erotic:
      shared:
      - 内容等级指引：若属于到来事件的一部分，允许成年裸体、性感服装和自愿的非露骨接触。门槛不得夹压、束缚、遮蔽或取代所需的身体互动。
    hardcore:
      shared:
      - 穿出与接触：将露骨互动融入单一穿出画面，而非把露骨接触放在无关的传送门奇观旁边。所有关键身体结构都应无遮挡、自然对齐、有支撑且位于刚性边缘之外；门槛绝不能充当性器具、束缚或接触表面。
  themes:
    common:
    - 核心视觉等式：每个主题和画帧都必须让以下等式可见：
    - 核心视觉等式：一个可辨认的源 + 一次解剖连续的穿越 + 一处边界明确的源内后半身视图 + 一条人类反应链 = 一次决定性的不可能到来
    - 核心视觉等式：穿出是主要事件，而非背景装饰。至少一名请求中的成年人必须可见地占据同一门槛的两侧：足够多的身体在外，使其可读为到来，同时一条不间断的解剖路径仍将人物连接到源开口。图像必须展示此人从哪里来、正进入哪里。
    - 核心视觉等式：源必须保留其日常身份。电视仍看得出是电视，影院银幕仍是投影银幕，肖像仍是装框的平面图像，镜子仍是反光玻璃，自动售货机仍是自动售货机。不要把源替换为泛化的发光矩形、暗洞、烟雾传送门或抽象圆环。
    - 核心视觉等式：源内部居于次要地位，并严格受源物件边界约束。可以在骨盆和双腿后方展示一个简单的地面、房间、风景、天气、季节或光照条件，但绝不能成为第二个完整构图。人物在两侧保持相同的自然皮肤、头发、服装、体积和照片写实感。
    - 阵容人数与性别准确，每人具有成熟面孔，年龄外观、头发、体型、衣物及其他外观特征在主题内稳定。
    - 人物与角色约定：穿出者与目击者合起来就是请求中的完整人物阵容：
    - 人物与角色约定：穿出女性 + 目击女性 = 请求的女性；穿出男性 + 目击男性 = 请求的男性；所有穿出者 + 所有目击者 = 请求的总人数
    - 人物与角色约定：绝不把请求中的人物全部当作目击者后，再添加穿出者。对于两女一男的请求，有效分配包括一名女性穿出、另一名女性和一名男性目击，或一名男性穿出、两名女性目击。三名目击者再加第四名穿出者无效。
    - 穿出者来自既有阵容。访客、演员、舞者、肖像模特、旅行者、游泳者、微型居民或源内人物均是既有角色，不构成额外人物；各人身份、性别、年龄外观与穿出或目击角色固定。
    - 人物与角色约定：每个可见或暗示存在的人都计入人物数量，包括背景顾客、工作人员、路人、观众、人群、剪影、源内图像中的人、肖像、屏幕人物、倒影、雕像、人体模型和人形阴影。除请求中的穿出者和目击者外，不展示这些人形内容。改用空座椅、建筑、植物、车辆、物件、光线、天气或抽象非人图像充实纵深。
    - 人物与角色约定：为每名请求中的人物在同一次到来中分配一个不可或缺的角色：
    - 人物与角色约定：- 一人或多人正在穿过源向外出现；
    - 人物与角色约定：- 其余所有人都是直接目击者，其姿态、视线、手部和附近移位的物件让惊讶可见；以及
    - 人物与角色约定：- 多人穿出时，各身体使用独立通行空间或简单可读的先后排列，不重叠，也不造成解剖混乱。
    - 人物与角色约定：若请求中只有一人，就只让此人处于穿越中心，并通过其自己的回望、支撑的手、警觉表情以及环境的物理反应表达惊讶。不要虚构目击者。有两人或更多人时，至少一名目击者必须直接对穿出者作出反应，而不是看向相机。
    - 人物与角色约定：反应必须具体且多样，而非一排相同的张嘴表情。可采用悬停在爆米花桶上方的手、双脚仍稳站但肩膀后缩、手指紧抓影院座椅、购物袋掉在鞋旁、饮料倾斜却尚未洒出、拉低眼镜再看一眼、一名目击者本能地扶稳另一人、怀疑地向开口探身、欣喜大笑或震惊地静止。这些是灵感，不是菜单。
    - 表情优先为惊讶、难以置信、好奇、欣喜、喜剧式惊慌、敬畏或诡异的认出感。
    - 内容等级指引：在所有等级中，穿越始终是概念中心，每名请求中的成年人都具有主动、可读的角色。
    - 源类型：自由选择熟悉的源类型，组合相容特征，或发明无关的同类替代。这些例子是开放式灵感，而非预设或标识符分配。
    - 图像与表演表面：- 深夜公寓中一台无品牌的阴极射线管电视；
    - 图像与表演表面：- 位于一排排惊讶观众上方的影院银幕；
    - 图像与表演表面：- 悬于停放车辆上方的汽车影院投影；
    - 图像与表演表面：- 雨后明亮路口上方的户外 LED 广告牌；
    - 图像与表演表面：- 仅在尺度对比有意为之且物理上可辨时使用的平板大小显示屏；
    - 图像与表演表面：- 纸面展开为完整纵深的自拍亭照片；
    - 图像与表演表面：- 舞台背景幕、皮影幕或投影播放的家庭影片；
    - 图像与表演表面：- 装框照片、时尚海报、公共交通广告或接触印样；
    - 图像与表演表面：- 漫画格、绘本跨页、地图插画或建筑蓝图，其图形世界仍在开口周围可见。
    - 反射与透明源：- 倒影呈现不同天气或时间的更衣室镜子；
    - 反射与透明源：- 映出一个并不存在于其上方的地点的水洼；
    - 反射与透明源：- 抛光电梯墙、商店橱窗、镀铬雕塑或深色列车玻璃；
    - 反射与透明源：- 另一侧是干燥房间的水族箱壁；
    - 反射与透明源：- 玻璃陈列柜、雪景球、博物馆展柜或温室玻璃；
    - 反射与透明源：- 静水池、装饰喷泉或覆满雨水的天窗；
    - 反射与透明源：- 按人体尺度搭建为安全实体布景的相机镜头、超大眼镜或放大镜。
    - 日常物件与容器：- 衣柜、冰箱、洗衣机舷窗式开口、行李箱、旅行大箱、碗柜、烤箱形舞台道具或独立柜体；
    - 日常物件与容器：- 自动售货机取货口、街机机柜、点唱机、唱片封套、扬声器锥盆或大型收音机刻度盘；
    - 日常物件与容器：- 被有意放大为戏剧道具的包裹、礼盒、手提包、麦片纸盒、外卖容器或粉盒；
    - 日常物件与容器：- 具有可理解尺度设定的茶杯、瓶子、书桌抽屉、文件柜、伞面、灯罩或钟面；
    - 日常物件与容器：- 薄表面获得精确三维门槛的书、信封、黑胶唱片、折叠报纸、明信片或胶卷。
    - 建筑、自然与不可能边缘：- 彩绘壁画、马赛克墙、浮雕、剧院帷幕或墙纸图案；
    - 建筑、自然与不可能边缘：- 通向不相容世界的电梯门口；
    - 建筑、自然与不可能边缘：- 不依赖可读文字而变成空间开口的地铁线路图、车站海报、发车信息板或站台时钟；
    - 建筑、自然与不可能边缘：- 没有对应实体门的门口影子；
    - 建筑、自然与不可能边缘：- 树篱、树洞、花心、瀑布、云墙、沙堡、雪堆或垂直雨幕；
    - 建筑、自然与不可能边缘：- 巨大蛋糕切片、宴会桌中央摆件、冰块、折叠布料、成堆衣物或叠放行李构成的墙；
    - 建筑、自然与不可能边缘：- 居民跨越到人体尺度的博物馆立体场景、玩偶屋立面、模型铁路景观、微缩城市或桌面建筑模型；
    - 建筑、自然与不可能边缘：- 意外具有纵深的粉笔画、剥落漆层、撕开的墙纸缝、地面图案或一片彩色光。
    - 源类型与场所功能多样，不限于屏幕、框架、门或镜子；喜剧、华丽、温柔、诡异、欢庆、日常、浪漫与壮观均可成为情感基调，不默认阴暗恐怖。
    - 概念驱动机制：只有尺度和穿出还不够。为每个主题提供一个专属于源的命题。可用机制包括：
    - 概念驱动机制：- 源类型碰撞：某人将平面通俗剧、野生动物节目、静默肖像、天气播报或微缩模型的视觉规则带入不相容的真实地点；
    - 概念驱动机制：- 观众反转：表演者探身出来观察观众，使观看者成为奇观所观察的对象；
    - 概念驱动机制：- 私人图像化为在场：熟悉的照片或倒影产生一名原创成年人，其当前姿态直接回应目击者；
    - 概念驱动机制：- 尺度错位的到来：微型居民在穿越处变成真人大小，或真人大小的成年人小心试探桌面世界；
    - 概念驱动机制：- 源的纵深：熟悉的平面源变成真实开口，具有足够可见纵深，容纳同一正常渲染身体的后半部分；
    - 概念驱动机制：- 天气外泄：属于源内的风、干树叶、雪、温暖阳光、气泡、彩纸或舞台雨越过边界，恰好足以改变目击者的头发、服装和附近松散物件；
    - 概念驱动机制：- 社交活动被打断：到来打断婚礼排练、安静通勤、产品演示、晚餐、画廊参观、理发、健身课、桌游之夜或另一项具体成年人活动；
    - 概念驱动机制：- 角色交换：肖像人物面对策展人，投影舞者邀请坐着的目击者，时尚肖像人物朝两位朋友穿出，或地图居民用手势向旅行者问路；
    - 概念驱动机制：- 孔口力学：只有一个窄小、腰部大小的开口围绕身体分开、弯曲或泛起波纹，而源表面其余部分保持平整完好；
    - 概念驱动机制：- 不可能的延续：源内建筑、家具、道路标线、波浪或光线条，与外侧实体结构精确对齐。
    - 每个主题只有一个主要机制与至多一个次要机制；源独有的形状、材质和功能直接决定穿越构图，而非通用矩形加人物。
    - 门槛几何关系：源边界是最重要的空间证据。展示精确的孔口、分开的表面、有弹性的图像平面、抬起的纸页、液体弯月面、帷幕裂口、物件舱口或对齐的建筑开口。边界只在腰、髋部或大腿上部的一条窄带穿过身体，不在其他任何位置相交。不得描摹完整轮廓、包围头部和肢体、覆盖全身，或在已经完全位于外侧的人周围制造波纹。
    - 主题约定：每个主题确立一个反复呈现的门槛事件，具有一个精确国家和地点、一个时代或年份、完整请求人物阵容、稳定人物锚点、一个可辨认的源、一个边界明确的源内部、一个连续外侧场所、一个概念驱动机制、一种情感基调和一种电影感身份。除非请求明确指定其他国家，每个主题都发生在中国的不同场景中。
    - 场景、精确成人阵容、日常活动、源与角色分工共同形成穿越事件。专属于源的不可能对比、穿越几何、可见内侧身体延续与共同反应清楚。
    - 调色、制作设计、源光、镜头距离、纵深、材质与实体特效共同构成摄影风格；各幅图像是同一视觉构想的平行照片，而非连续穿出阶段。
    - 选集多样性：不同主题之间变化以下所有方面：
    - 选集多样性：- 源类型及其日常功能；
    - 选集多样性：- 外侧地点及其中的人类活动；
    - 选集多样性：- 边界明确的源内部视觉逻辑；
    - 选集多样性：- 主要概念驱动机制；
    - 选集多样性：- 穿出者的数量与姿态；
    - 选集多样性：- 目击者关系和反应模式；
    - 选集多样性：- 喜剧、诡异、温柔、华丽、浪漫、仪式、日常或壮观的情感基调；
    - 选集多样性：- 时代、季节、时段、建筑和材质配色；
    - 选集多样性：- 门槛轮廓和形变；
    - 选集多样性：- 相机距离、高度、纵深和构图方向；以及
    - 选集多样性：- 光照依据和摄影成像质感。
    - 场景可来自以下不同日常环境：
    - 选集多样性：1. 一个家庭、晚餐、聚会或其他私人社交场景；
    - 选集多样性：2. 一个影院、剧院、音乐会、体育、游戏或其他集体休闲场景；
    - 选集多样性：3. 一个花园、公园、海滩、山地、农场或其他户外自然场景；
    - 选集多样性：4. 一个列车、车站、渡轮、机场、公路停靠点或其他旅行场景；以及
    - 选集多样性：5. 一个商店、办公室、工作室、实验室、作坊、服务柜台、专业厨房或其他工作场所。
    - 低位电视或影院银幕可形成腰部高度的开口，其后保留可见骨盆和双腿。源类型、社会环境、机制、情绪、门槛、反应、相机、光线与成像质感多样，不默认长发、恐怖、蓝光、正面爬行、掉落爆米花或对称成排目击者。
