    - 人物与角色约定：- 多人穿出时，各身体使用独立通行空间或简单可读的先后排列，不重叠，也不造成解剖混乱。
    - 人物与角色约定：若请求中只有一人，就只让此人处于穿越中心，并通过其自己的回望、支撑的手、警觉表情以及环境的物理反应表达惊讶。不要虚构目击者。有两人或更多人时，至少一名目击者必须直接对穿出者作出反应，而不是看向相机。
    - 人物与角色约定：反应必须具体且多样，而非一排相同的张嘴表情。可采用悬停在爆米花桶上方的手、双脚仍稳站但肩膀后缩、手指紧抓影院座椅、购物袋掉在鞋旁、饮料倾斜却尚未洒出、拉低眼镜再看一眼、一名目击者本能地扶稳另一人、怀疑地向开口探身、欣喜大笑或震惊地静止。这些是灵感，不是菜单。
    - 表情优先为惊讶、难以置信、好奇、欣喜、喜剧式惊慌、敬畏或诡异的认出感。
    - 内容等级指引：在所有等级中，穿越始终是概念中心，每名请求中的成年人都具有主动、可读的角色。
    - 半入半出轮廓：将源视为通向纵深的真实开口，而非印在完整前景人物上的图像。穿出者具有一个连续、有体积且垂直于源平面的身体。外侧半身向房间和相机伸出；内侧半身退入屏幕、图画、镜子、容器壁或孔口后方边界明确的源内部。
    - 半入半出轮廓：有力的爬行布局将低位电视、影院银幕、装框图像、柜体开口或其他门槛放在穿出者后方。头部、头发、肩膀、双臂、胸部及可能的腹部已经在房间内；双掌或一掌一前臂按在外侧宽阔稳定的地面或台沿上；脊柱向前倾斜；腰或髋部穿过屏幕开口；骨盆、双膝、小腿和双脚留在屏幕后方、边界明确的源内部。躯干后方可见边框，外侧身体朝目击者投下真实阴影。
    - 半入半出轮廓：站立布局使一只脚和大部分躯干处于外侧，骨盆跨过门槛，后腿留在内侧。探身布局使手臂、肩膀、胸部和腹部处于外侧，髋部和双腿留在内侧。每种布局中，身体约百分之四十至六十处于每一侧，使图像立即可读为穿越，而非肖像、投影、倒影、材质变形或站在源前方的人。
    - 半入半出轮廓：对于电视、影院银幕、绘画、照片、海报、镜子或广告牌等平面源，图像表面只在腰部或髋部像深孔一样分开。屏幕图像在身体后半部分后方继续存在。不要把完整人物贴在图画上，不要让全身半透明，也不要用液态玻璃扭曲包围整个人物。
    - 参考爬行编排：使用以下原创、通用的电视出口作为最清晰的空间原型：一台低位、无品牌阴极射线管电视位于穿出者后方；屏幕是通向可见房间或风景的开口。成年人头朝前、垂直于屏幕爬出。其头部、头发、肩膀、胸部、双臂和双手已经进入真实房间。双掌按在电视前方较远处的真实地板上，肘部和肩膀承担前半身重量。腹部穿过屏幕中央，腰部周围的边框保持完整可见，而骨盆、弯曲双膝、小腿和双脚以正常三维形态留在边界明确的电视内部。前半身在地板上投下阴影；后半身只接受电视屏幕内部的光线。目击者站在两侧，直视腰部穿越处。
    - 参考爬行编排：这是几何参考，不是强制要求的恐怖情绪、服装、发型、角色、电视或复制场景。将同样的头朝前爬行、探身退出或单腿在外的空间逻辑应用于原创源和情感基调。
    - 单场景渲染约定：最终图像包含一个相机、一个连续外侧地点，以及该地点内的一个源物件。外侧地点占据画面大部分。源内部只出现在电视屏幕、影院银幕、画框、镜框、窗户、舱口或开口的精确限定区域内。尽可能展示平面源的四条边，使其有限尺寸明确无误。
    - 单场景渲染约定：源内部绝不扩展到目击者后方，不替换外侧背景，不成为门口大小的第二套布景，也不以并排面板出现。不要创建分屏、双联画、拼贴、剖视图、前后对比、平行场景、反射复制体或第二相机视图。目击者、穿出者外侧半身和源物件都共享同一外侧地板、透视、镜头和光照空间。
    - 单场景渲染约定：源内部保持视觉简洁：一个地板或地面平面、一种背景颜色或浅层环境，除穿出者后半身外没有其他人。其存在只为证明骨盆和双腿仍在门槛后方。避免只有天空的背景、复杂的第二房间、远方全景、繁密景观或与外侧地点争夺注意力的源内场景。
    - 单场景渲染约定：对于镜子，完全抑制普通倒影。镀银镜面在一个腰部大小开口周围保持不透明且可辨认；只有该开口展示身体后半部分。不要展示第二个全身倒影、目击者的另一个副本，或用门口替换镜子。
    - 单场景渲染约定：对于主要穿出者，头、颈、肩、躯干、骨盆及可见肢体必须可追踪为一个连续身体。每只手和脚赋予一个明确功能：抓握安全框架、按压柔性表面、伸向目击者、在宽阔源台沿上保持平衡，或落在外侧地板上。关节保持自然活动范围，重叠肢体彼此分开。
    - 外侧身体伸出足够远，投下阴影、带动空气或松散材料并占据目击者空间；腰或髋部交点清楚，相当一段躯干在外，骨盆及至少一条完整相连腿在源内部直接可见。源内身体保留真实皮肤、服装、关节和体积，可受局部光线与天气影响，但不压平、绘画化、像素化、溶解、剪影化或化为源材质。地图线路、数据、箭头、雾、阴影、文字、抽象图形、笔触和空白背景不替代身体结构。食物、盒子、墙或容器作为源时，具有宽敞敞开正面、透明部分或可见内部，不以暗腔、裁切或仅露颈部的孔洞藏住后半身；不出现脱离躯干、缺失骨盆、重复人物、多余肢体、不可能弯折或贴在源上的人。
    - 单场景渲染约定：每人只使用一种身体状态。倒影、照片、屏幕图像、影子或海报不得创造穿出者的第二个副本，除非它是同一姿势的物理正确反射。不要同时展示内侧版本和外侧克隆体。
    - 单场景渲染约定：不要依靠完全不透明的传送门光辉、烟云、水花、布料、前景物件、目击者身体或浅景深来遮蔽穿越处。源边缘、穿出身体结构、支撑点、目击者面部和视线关系必须同时可读。
    - 不可能事件具有真实布景的高级实体特效质感。刚性源通行空间宽裕圆润，台沿宽阔承重，摄影棚加固结构隐于物件内，底部稳定接地；柔性源围绕服装和身体外轮廓形变而不压缩身体体积。
    - 材料可为完整安全玻璃、亚克力、柔软布景泡沫、布料、纸、水、光或可脱落的布景材料。
    - 电器与车辆源为搭建舞台外壳，通行空间清楚，内部机械静止。
    - 安全实体奇观：材质效果必须符合定格瞬间。布料从可见接触处拉伸，纸沿有支撑的折痕弯曲，水遵循重力，投影光落在表面上，头发和宽松衣物沿同一气流运动，每道投影都与光向一致。不要用任意魔法火花、能量环、闪电或失重碎屑代替专属于源的证据。
    - 每幅图像为独立满画幅照片，姿势、物件、洒落物、衣物和穿出程度是各自当前状态，不构成时间线。
    - 画帧约定：每个画帧都必须独立重述：
    - 画帧约定：- 完整请求成年人阵容、女性与男性各自的精确数量，以及稳定外观锚点；
    - 画帧约定：- 将主题中已经计数的同一角色作为穿出者，使用该角色现有姓名和性别，而非添加源内角色；
    - 画帧约定：- 可辨认的源及足以识别它的日常周边环境；
    - 画帧约定：- 哪些人穿出、哪些人目击；
    - 画帧约定：- 一个精确、解剖连续的门槛姿势；
    - 画帧约定：- 一个连续外侧地点，源内部仅在源物件边界明确的开口内可见；
    - 画帧约定：- 每名目击者独特的视线、手部动作、平衡姿态和面部反应；
    - 画帧约定：- 源边缘的材质表现，以及每个可见支撑点；
    - 画帧约定：- 相机距离、角度、镜头表现、纵深、照明、调色和成像质感；
    - 画帧约定：- 一个明确的前景到背景层级；以及
    - 画帧约定：- 不渲染解释性文字。
    - 每幅画面独立呈现源、外侧头臂与躯干、单一腰髋交点及开口内骨盆双腿，目击者与环境反应围绕同一穿越几何展开。
    - 单一外侧地点、边界明确源物件和连续人物同处一幅构图，上半身在外，腰部只与源相交一次，骨盆和双腿在内，无重复人物或分割场景。
    - 相机高度、侧向、距离、穿出姿态、目击者排列、反应基调、源边缘形变、外侧活动、源内细节、前景、光线与纵深可形成不同组合，同时保持源、人物身份、角色分配、地点、时代、机制和电影风格。
    - 画帧约定：不要通过将到来过程从头部推进到躯干再到脚、更换源物件、增加人物，或用改写的反应重复同一构图来实现变化。每个画帧都展示完全可读的决定性穿越。
    - 相机与视觉层级：第一视觉关注点是穿出者的面部和身体，第二是门槛边缘，第三是最近目击者的反应，第四是小而边界明确的源内部。使用视线、手部指向、座椅排、建筑、投影光、倒影或移位的松散物件，将这些关注点结合成一个构图。
    - 相机与视觉层级：优先使用标准镜头或克制的广角镜头，无畸变地展示身体连续性和目击者间距。只有在源身份和至少一个完整反应仍明显可辨时才使用近景。避免鱼眼畸变、极端透视缩短、压平穿越的陡峭俯拍、严重倾斜机位、裁断关键关节，或让面部和门槛处身体结构消失的远距离广角全景。
    - 相机与视觉层级：人脸保持清晰且只有一个。运动只可出现在爆米花、水滴、发梢、票、帷幕边缘或掉落围巾等次要松散材料中，并具有一个明确物理原因。不要模糊、复制穿出者身体、目击者身体、面部、手或门槛边缘，也不要给它们加拖影。
    - 相机与视觉层级：边界明确的源内部光线可以不同于外侧地点，同时保持可信肤色。屏幕光、投影溢光、镜面反射光、柜内实景灯、日光、钨丝灯具、招牌灯泡、画廊射灯、街道反光或家用灯具可作为这一区域性分隔的依据。源内部光线止于源边缘，落在穿出者身体上的部分除外。避免泛化的传送门光辉、无细节黑暗、浓雾以及抹去材质身份的色彩效果。
    - 无文字图像约定：渲染图像中不得包含标题、说明文字、对话气泡、字幕、标志、品牌、水印、界面、可读海报文案、可读屏幕文案或解释性排版。源为报纸、地图、广告、书、票、控制面板或显示屏时，使用抽象图形标记、图画、色块和不可辨读的纹理。概念必须不依赖文字也可读。
    - 无文字图像约定：不要先承诺有文字，再在别处否定。时刻表没有可读目的地、时间或数字；白板没有词语、标签、箭头或数据图；购物袋和产品没有店铺标记或标志；杂志和海报没有标题；屏幕没有界面。这些表面只描述非语言的颜色、几何、纹理和图画。
