id: multi-view
description: 创作多样化、精致的超写实成人摄影主题，以富有动感的满版多视图图像呈现。每幅图像包含两个、三个或四个不同的分镜视图，展现同一组人物在同一地点、同一次拍摄中的情景。同一幅图像中的各视图可以采用不同的姿势、动作、表情、机位或相邻时刻。
authoring:
  level_refinements:
    hardcore:
      frames:
      - 主要互动视图呈现已经建立、正在进行的露骨接触：可见的生殖器、肛门、口部或玩具插入，或主动直接的生殖器刺激，相关解剖部位与完整接触路径清晰；不以对齐、入口处按压、展示、乳房触摸、准备、脱衣、即将接触、普通裸露或被动事后状态替代。每位参与者的主动动作与回应均可见。
  themes:
    common:
    - 人物与连续性：指定的中国人物具有成熟外貌、主动动作和相互回应，不增加背景人物、旁观者、人群、人形剪影、人像、屏幕人物、人体模特、镜子或人物倒影；身体附近采用哑光表面。
    - 人物、成年身份与连续性：主要模特是一位 25 岁的中国女性，身高 170 厘米，腰细、身材纤瘦，乳房天然丰满且下垂，皮肤白皙，没有可见妆容，深色长发细软，刘海侧分，无阴毛。让每位指定成年人都具有鲜明且稳定的外貌。在所有视图中保持身份、成熟年龄、面孔、头发、身体比例及其他锚定特征一致。
    - 人物、成年身份与连续性：至少一个视图必须使全体人物及其身体关系清晰无误。其他视图可以为特写而有意裁切人物。
    - 在不削弱多视图概念的前提下，变化布局、造型、情绪、互动、照明和表现重点。
  frames:
    common:
    - 人物与连续性：指定的中国人物具有成熟外貌、主动动作和相互回应，不增加背景人物、旁观者、人群、人形剪影、人像、屏幕人物、人体模特、镜子或人物倒影；身体附近采用哑光表面。
    - 人物、成年身份与连续性：主要模特是一位 25 岁的中国女性，身高 170 厘米，腰细、身材纤瘦，乳房天然丰满且下垂，皮肤白皙，没有可见妆容，深色长发细软，刘海侧分，无阴毛。让每位指定成年人都具有鲜明且稳定的外貌。在所有视图中保持身份、成熟年龄、面孔、头发、身体比例及其他锚定特征一致。
    - 人物、成年身份与连续性：至少一个视图必须使全体人物及其身体关系清晰无误。其他视图可以为特写而有意裁切人物。
    - 满版多视图布局：明确视图的精确数量，并使用完全相同数量、互不重叠的矩形区域覆盖画布的 100%；所有行列比例相加必须覆盖完整宽度和高度。双视图的灵感包括水平、垂直和不等分切分；三视图的灵感包括丁字形、一大加两块堆叠或一宽加两块的布局；四视图的灵感包括两行两列、一宽加三块或一大加三块堆叠的布局。变化区域大小、对齐方式以及竖幅、横幅或正方形裁切形状，不要默认使用等宽列。
    - 满版多视图布局：两个、三个或四个视图各自填满矩形区域，在硬切边界直接紧贴邻区，共同覆盖整张画布，没有间隙或跨视图延续。不使用沟槽、边框、外边距、内边距、分隔线、画框、衬边、阴影、空白区域、悬浮图块、重叠或画中画。
    - 满版多视图布局：每个视图都是独立的分镜镜头，而不是连续全景的一部分。身体、肢体、家具、建筑和背景绝不得跨越硬切边界融合、拉伸或延续。
    - 各视图的物理与解剖：每个视图是一次曝光，人物具有唯一当前位置、朝向、视线、动作、接触和支撑关系；不同视图可呈现不同时刻，单个视图不叠加动作过渡或同一部位的连续位置。
    - 各视图的物理与解剖：一个视图内，每位指定人物最多只能出现一个清晰实例。采用正常的解剖结构、自然的手指和脚趾、能够实际触及的接触，以及直接对齐的骨盆与插入轴线。让生殖器和完整接触路径清晰可见，不被衣物遮挡。身体只能在宽阔且固定的地面、床、长凳、沙发或墙面上承重；道具不得支撑、悬吊、卡住或分开肢体。为每只可见的手、脚、嘴以及每条承重肢体安排一项相容的任务。肢体必须能从肩部或髋部一路追溯至末端，并尽量减少含糊的重叠。每处疤痕、印记、衣物和身体特征都必须保持属于原本的人物。让挽具、腰带、绳索、机械、尖锐结构、楼梯、狭窄凸缘和移动道具远离身体路径；避免卡挤、扭曲、交叉肢体或杂技式支撑。插入时不要让阴茎弯折抵住腹部，也不要将内部解剖结构描述为从外部可见。
    - 各视图的物理与解剖：特写可以聚焦面孔、乳房、乳头、臀部、外阴、阴茎、阴囊、肛门、嘴、手、触觉细节或直接性接触。裁切可以使部分身体延伸至图块边缘之外，但每个可见部位都必须明确属于一个已确立的人物，并与其来源身体自然连接。不得通过镜子、屏幕、海报、阴影、重影、双重曝光、运动拖影或跨边界图像，制造脱离身体、来源不明、重复或多余的解剖部位。
    - 镜头组合：每幅图像必须包含一个主要互动视图和至少一个辅助视图。根据所选视图数量选择其余镜头，变化它们的图块位置和大小，并仅按镜头用途或图块位置标识它们；绝不为人物分配字母标签。
    - 镜头组合：- 主要互动：使用中近景或中景，展示全体人物、关键的露骨接触、每位参与者的反应，以及稳定的支撑。
    - 镜头组合：- 环境交代：使用中景或中全景，交代地点、人物关系、身体几何关系和支撑。
    - 镜头组合：- 可选空间细节：用补充视图澄清肢体路径、骨盆对齐、接触、家具和道具。
    - 镜头组合：- 可选特写：有明确归属锚点的面部、手、乳房、臀部、生殖器、肛门、口部、触觉或接触细节。
    - 机位与多样性：让各视图在方向、高度、距离、裁切或光学透视上具有实质差异。灵感包括正面、四分之三侧面、侧面、背面、越肩、轻度俯视、眼平、腰平、膝平和适度仰视。空间视图使用约 35-85 毫米的正常透视，特写使用焦距较长、介于标准与人像焦段的镜头。
    - 机位与多样性：有意识地在躯干或肢体中段的干净位置裁切，绝不切过面孔、颈部、关节、手、脚或关键接触，也绝不裁切得过紧，以致解剖部位失去来源。避免极端广角、鱼眼、严重透视缩短、陡峭俯拍造成的压缩、贴地仰视畸变、穿过身体的前景，或遮挡面孔、支撑或接触的杂物。
    - 机位与多样性：每个画帧都从同一套未改变的房间、服装和道具基准状态开始。不要在画帧之间延续状态，也不要提及进展、脱衣、首次接触、重复接触、此前或此后的事件，或事后状态。变化视图数量、图块拼排、镜头组合、机位、稳定姿势类别、露骨互动、表情、配色和照明，不要重复固定的数字循环。
modules:
- id: layout-multiview
  parameters:
    layout: collage
    min_views: 2
    max_views: 4
