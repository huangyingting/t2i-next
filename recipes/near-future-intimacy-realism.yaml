    - 将周围环境描述成完整的有人使用的空间，而非通用背景。指出房间类型、地板、墙壁、天花板、入口、窗户或承压开口、主要家具、公用基础设施和大型未来结构，再明确其材质、颜色、状态及与成年人之间的空间关系。至少包含八个紧凑现实锚点，总体涵盖床品或织物、卫生或安全用品、收纳、一件私人物品、气候或资源证据、维护历史、身体痕迹，以及成本或匮乏证据。
    - 除正在起作用的技术外，至少包含六件独立且视觉可辨的道具。每件道具均有具体物品身份、材质、颜色、大小印象、状态和精确位置。将它们分布在前景、中景和背景的独立轮廓位置。使用合理物品，如折叠或移位的衣物、鞋履、毛巾、密封润滑剂、储水容器、租赁箱、清洁用品、收纳模块、床品、私人物品、安全设备或紧凑家用工具。道具支持人物、近期活动、经济状况和地点；其重要性低于成年人，绝不与主要身体结构重叠，也不形似额外肢体或生殖器结构。
    - 未来视觉强度来自功能尺度、材质对比、空间工程、一体化照明和可见维护。结果须是真实使用中的环境，而非赛博朋克、太空歌剧、幻想艺术、精美广告、游戏过场、无瑕实验室或奢华展厅。通过微划痕、清洁条纹、褪色饰面、更换紧固件、修补隔音织物和不配套但完好的面板展现安全的使用磨损。承重导轨、天花板锚点、缆线和滑车在结构上保持洁净完好。
    - 将环境、光线、氛围和色彩作为四个主动叙事系统。环境建立社会与物质背景；光线揭示身体和技术响应；氛围使热、气流、压力、隐私、劳动和匮乏变得物理可见；色彩统一未来设计语言。
    - 使用中广角的完整场景照片，采用等效 35-50 mm 的直线投影镜头和 f/5.6-f/11 景深。姿势允许时展现完整身体，并保留房间边界、正在作用的技术、载荷路径和环境背景。特写、微距、脸部主导、浅景深、鱼眼和超广角构图均不符合要求。
    - 组织前景、中景和背景。每一层至少提供两个可辨物体或结构，分别占据独立轮廓位置。用清晰留白分隔肢体、手、缆线、支撑和道具。任何重要元素都不得并入身体或遮挡主要接触。
    - 至少使用一处有合理来源的 5200K-6500K 建筑或功能性主光。说明其位置、方向、软硬、衰减，以及对皮肤、汗液、冷凝水、半透明材料和房间纵深的影响。功能装置的点缀光保持小面积且从属。
    - 配色以冷色为主：石墨色、冷银、冰蓝、青色、蓝绿色、低饱和玉色、蓝绿、柔和紫和月白。人体皮肤保持自然且比房间稍暖以便分离，带中性高光和蓝灰或紫色阴影。暖色床头灯、钨丝灯、日落橙、钠灯黄、琥珀调色、古铜肤色和金色高光绝不占主导。
    - 至少八个紧凑现实细节来自不同类别：
    - '- 家居：凌乱床品、待洗衣物、毛巾、洗漱用品、收纳、食物；- 基础设施：通风口、插座、过滤器、排水槽、密封件、管道、电池；- 维护：补片、磨痕、更换螺丝、清洁过的接缝、磨损衬垫；- 经济：租赁箱、重复使用的织物、不配套模块、计量资源；-
      隐私：薄隔断、走廊光、共用墙、狭窄围护空间；- 身体：汗液、压痕、冷凝水、黏胶痕迹、疲劳。'
    - 氛围具有物理性：潮湿空气、冷却气流、冷凝水、密封件处的尘埃、振动、循环空气的干燥感、织物运动、走廊噪声或有限隐私。通过目光、下颌、眉头、呼吸、抓握或姿势展现一种尚未化解的情绪，而非解释它。
    - 硬件与所选技术形态一致，不混入无关系统。
    - 模块：合成或代理成年人
    - 使用一个完整且有响应的成年人身体，具有稳定的身份、脸、骨盆、肢体、目光和独立自主性。展现连贯的关节接缝、柔性皮肤边缘、人造虹膜、触感垫、局部执行器、充电或数据接口，以及一个相互连接的系统。租用或维修过的身体显露替换面板和磨损，同时保持安全且功能完备。
    - 远程伴侣通过一个实际在场、能够执行所述动作的全身代理体出现。生物原身在图像之外。延迟、电机校正、散热和数据路由通过克制的物理响应显现，而非界面文字。
    - 模块：触觉体积光成年人
    - 将请求的远程成年人呈现为一个完全由连续单色体积光构成的完整真人大小身体。选择冰蓝、青色、青紫或冷淡紫。使用 55-70% 的光学密度，使背景仍隐约可见，同时脸、眼睛、嘴唇、头发轮廓、五指双手、骨盆、生殖器和肢体均完整清晰。
    - 内部光密度平滑，轮廓较亮、面部平面更密实，具有细微视差、柔和全身辉光及同色接触压缩。投影轨道、力反馈发射器、冷却系统和处理器位于房间；场提供稳定重量、触觉、阻力与连续人形结构。全身均为同一青色、青紫或冷淡紫的连续体积光，光学密度 55–70%。
    - 光体不呈现盔甲、金属骨骼、体内执行器、硬关节、电路皮肤、网格、多边形、点、扫描线、星星、闪粉、彩虹粒子或体素点，不是扁平幽灵或残缺身体，接触高光不溢出。
    - 模块：触觉或神经系统
    - 使用可洗压力服、贴合皮肤的电极、分段智能织物通道、紧凑执行器节点、感官替代表面或共享有线枢纽。展现附着点、电力和数据路径、同步材料响应、清洁证据、压力痕迹和可触及的停止装置。在正在进行的接触中，该系统直接改变感觉或节奏。
    - 模块：主动悬吊
    - 追踪每项载荷：从身体经过宽支撑、受压衬垫、吊带连接点、托架、反作用力臂、缆线、滑车、导轨、龙门架或升举场包络，传递至床架、墙壁、天花板或地板。展现合理的重心、投影、头发和软组织的重力响应、冗余防坠装置及可触及的释放装置。悬起的肢体不接触普通表面。
    - 技术创造出在普通床上无法维持的姿势。它改变支撑平面、身体角度、重力响应、活动范围或接触机制，而非仅把常规姿势抬高。
    - 使用宽石墨色胸廓衬垫和大腿外侧翼作为可见身体支撑。所有缆线和织带均置于腹股沟及身体间接触区之外。每条带子都保持宽、平、深色，且明显连到支撑垫；每个把手都保持青色，并明显属于机械部件。两具悬吊身体下方的完整空床表面须始终可见。
    - 模块：自适应床或交通工具卧铺
    - 自适应床是家用家具而非医疗椅，宽大连续床垫下的低矮一体升降单元承托骶骨与大腿外侧，并有细微压力响应。双方回握、髋部对齐、肌肉张力与相互目光或表情清楚。
    - 对于侧卧后入的卧铺，将接受方成年人完全置于一侧，上侧膝盖向前并抬高，再将插入方成年人直接置于其身后、朝同一侧侧卧，胸骨对齐对方背部，裸露髋部紧贴接受方骨盆。将完全脱下的长裤和内裤放在墙钩、收纳架、空座位或地板上，完全远离双方腿部。稳定衬垫置于胸廓、骶骨或大腿外侧下方，直接接触的耻部皮肤保持无遮挡。调整窗户和光亮面板的角度，使其以抽象倒影呈现雨、交通光线或空的建筑结构。
    - 模块：冷却悬吊
    - 由四片物理上分离的柔性支撑翼构成双人冷却系统：两片宽胸廓翼和两片大腿外侧翼。在直接相接的骨盆周围留出 30-40 厘米的椭圆接触开口。每片支撑均在该开口之前终止，每条肢体保留清晰轮廓。
    - 将完整身体和支撑翼悬在独立空床或软垫地板上方 50-80 厘米处。每只手、每只脚、每条肢体和每处支撑下方都呈现连续空气带。四条拉紧缆线从不同翼角向上接入天花板导轨或支撑环；所有载荷传入可见天花板结构。
    - 淡青色冷却液经透明翼内通道和透明软管流入哑光矩形或分段式换热器。使用折射、冷凝水、接头处冷雾和淡压痕，而非发光橙色。轮廓应读作彼此分离的工程支撑翼，而非椅子、躺椅、病床、健身器材、按摩装置或吊床。
    - 对于同向后入，将前方伴侣侧卧，脊柱朝向后方伴侣。后方伴侣平行地朝同一侧侧卧，胸骨贴着前方伴侣背部，两张脸朝向房间同一边界，两个头部平行。使用骨盆高度的后侧四分之三视角，呈现接触开口、完整受力路径、四只悬空的脚、空床及冷却响应。
    - 模块：轨道龙门架
    - 使用两条独立配重平衡的身体轴线，连接到一条横跨房间的天花板导轨。一名成年人以 30-40 度后倾，由独立肋部和大腿外侧支撑托住。另一名以 35-50 度前倾，由胸部和大腿上部支撑托住。双方耻部在一个清楚中心直接接触；所有支撑均在该中心之前终止。
    - 追踪双方载荷经过受压支撑、关节臂、两台可见天花板滑车、共用导轨和承压壳体肋架。两具完整身体和每只脚都保持在空床上方，每条肢体下方有独立阴影与空气。松弛的防坠带和各自释放装置位于身体轮廓之外。安全织带使用柔和紫或石墨色，机械释放把手使用青色。
    - 使用磨损的经济型服务舱，配有哑光壳体面板、可更换通风模块、小型防护舷窗、修补隔音织物、货网、冷凝水和计量资源。房间保持紧凑务实，而非全景奢华度假村或英雄式飞船舰桥。
    - 插入接触中双方骨盆直接相接，耻部皮肤相贴；根部从插入方骨盆连续延伸，接受方在同一平面包覆，不形成分离间隙或额外连接器。
    - 使用空白纯色租赁箱，以及由青色、冰蓝或柔和紫弧形构成、仅含图标的资源指示器。在最终画面中，可见的经济与状态信号仅使用这些正向材质和颜色。
    - 模块：轨道微重力
    - 使用把手、脚环、宽腰部系绳、气流、软垫墙、吸水织物和受表面张力影响的液滴来管理反作用力。每个力都有对抗的抓握、系绳或伴侣接触。展现紧凑生命维持设施、餐包、网状收纳、修补隔音毯和有限隐私。
    - 模块：有智慧的后人类伴侣
    - 虚构后人类为成熟、具有语言与智能表现的人物，生物结构完整稳定，呼吸及环境需求与支撑、接触几何相容。
    - 每人具有独特体型、五官、发型、仪容或妆容、可见表情、衣物鞋履状态与一至三件配饰。单人阵容只有一个身体、脸和轮廓；所选合成、代理或体积光形态替代而非复制生物原身。
    - 每个生物人类只有一头、一躯干、一骨盆、两臂、两手、两腿、两脚及一套解剖一致的生殖器。阴茎形玩具由可见的手持有，不安装在男性骨盆或形成第二根阴茎，不与生物结构重叠。
    - 反光玻璃、面板和深色窗呈现抽象光线或空建筑，不出现第二个人体轮廓；悬起人物下方的床从一侧至另一侧均为空，只保留投影与普通床品。
    - 支撑不经过腹股沟或耻部中心；杆、缆、带、支撑及其阴影呈深色非人体材质，与生殖器轴线分离。结构墙板、天花板与承重锚点完整，不呈现锈蚀、腐蚀、剥落灰泥或水渍。
    - 保留冷峻生活写实，不采用赛博朋克、幻想、精美广告、奢华奇观、白色实验室或只添小装置的当代卧室质感。亲密动作而非照护、维修、治疗、校准或普通产品演示占据视觉中心。
    - 仅有躯干的代理体可以支持接吻、触摸、手动刺激或触觉接触，但绝不能进行阴道或肛门插入。
