id: near-future-intimacy-realism
description: '近未来成人亲密关系的照片级写实画面。技术改变身体、距离、生育、劳动、隐私和性姿势，日常生活的物质层面却依然平常。图像像是在住宅、栖居舱、旅馆、诊所、工坊、交通工具舱室或出租房内拍摄的不煽情照片。

  主导风格是冷峻、带生活痕迹的写实：先进系统会被购买、租用、修理、清洁、充电、修补，也会引发争执。未来感必须通过建筑、材料、光线和身体尺度的技术一眼可辨，而不是靠奇观或摆在当代房间里的一件小装置。

  生物体、合成体、代理体、体积光、数字或后人类均保持指定女性与男性数量及各自稳定身份，技术与动作角色不改变阵容。

  将反光玻璃、抛光面板和深色窗户转向远离人物的角度，使其呈现抽象光线或空房间的建筑结构，而非第二个可辨认的人体轮廓。悬起的成年人下方若有空床，必须从一侧边缘到另一侧边缘都明显无人，仅承载人物投影和普通床品。

  每个生物人类都有一个连贯的头部、躯干、骨盆，两条手臂、两只手、两条腿、两只脚，以及一套解剖结构一致的外生殖器。在一名女性和一名男性、没有玩具的人类场景中，女性有一个外阴，男性有一根与其骨盆连续相连的阴茎。阴道插入时，双方耻部直接接触；大部分阴茎体位于阴道内，外部仅可见相连的根部。附近的支撑物、杆件、缆线、肢体、倒影和阴影须保持深色、明显不属于人体结构，并与生殖器轴线分离。

  相互注视、回应触摸、协调抓握、共同控制与对应身体张力形成可见联系。动力支撑具有触手可及的释放装置和畅通出口，载荷由宽支撑传入躯干、髋部及肢体支撑面，不经颈、喉、生殖器、单条窄带或无支撑关节。'
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 成年人的亲密与欲望通过裸露、移位衣物、充满张力的拥抱、亲密触摸或明确性姿势呈现。
    erotic:
      shared:
      - 呈现正在进行的亲密接触而非准备或事后照护，裸露、触摸、兴奋、身体间或身体与装置的接触可辨；技术明显改变感觉、接触通路、节奏、距离或支撑。
    hardcore:
      shared:
      - 将长裤、内裤、裙子和其他下装从双腿上完全脱除，再将它们放在家具、挂钩、地板或收纳处的可见位置；支撑硬件须完全位于双方耻部之外；在接触区域敞开或脱掉衣物，保留清楚的解剖结构。
      - 进行插入的代理体或合成成年人须有完整连续的骨盆和下半身。
      frames:
      - 一个裸露无遮挡的接触中心具有物理相容的身体部位、躯干方向、骨盆朝向、腿部位置、手部支撑与技术响应。
      - 插入双方耻部裸露且直接相压，插入方裸露骨盆及生殖器根部连续，接受方包覆大部分阴茎体；所有下装完全离开双腿，位于远离身体的可见位置。支撑垫仅接触骶骨、肋部、髋外侧或大腿外侧，耻部中心敞开。
      - 一女一男的阴道插入中，男性唯一阴茎连续连接裸露骨盆，大部分阴茎体被女性阴道包覆，仅相连根部露在相贴的耻部皮肤之间。
  themes:
    common:
    - 精确阵容、连贯解剖、可辨亲密动作、实际改变动作的推想技术与可信支撑共同构成场景，冷光、维护痕迹、资源成本、隐私边界和人物表情融入未来生活环境。
    - 为每个请求的成年人赋予独特、稳定且可被拍摄呈现的完整造型。分别描述每个人，而非将共同特征分配给整对伴侣。对每个成年人说明：
    - '- 体型、身高印象、肤色，以及雀斑、疤痕、体毛、肌肉、柔软感或年龄纹理等一至两个鲜明身体特征；- 用简洁具体的语言描述脸型和可见五官，包括眼睛、眉毛、鼻子、嘴唇、下颌及面颊结构；- 发型的颜色、长度、质感、剪裁、分缝及姿势中的准确排列，包括散发或束起部分落在何处；-
      可见的仪容修整或妆容：粉底或素颜皮肤质感、眉形、眼线或睫毛、面颊颜色、唇色或润唇膏，以及任何刻意设置的未来感妆容点缀；- 通过视线方向、眼睑、眉毛、嘴部、下颌、面颊紧张程度呈现当前表情及其情绪含义；-
      每一件衣物和鞋履，说明颜色、材质、剪裁、贴合程度、扣合方式，以及仍穿着、为接触而敞开或移位，还是放在房间内某个精确可见的位置；- 一至三件个人配饰，如耳骨夹、戒指、项链、手链、手表、发夹、脚链、对身体安全的传感贴片或可穿戴控制器，分别说明颜色、材质、附着点和可见功能。'
    - 图像必须立即呈现成年人的性生活，而非友谊、照护、治疗、维修、校准或产品演示。身体与双向接触占据主导；控制器、工具、发票、箱盒和清洁用品保持在边缘。
    - 性活动包括独自自慰、伴侣引导的自慰、双方各自自慰、手动生殖器刺激、口交、阴道或肛门插入、可穿戴或手持玩具使用、远程触觉刺激，以及双方同意的 BDSM。不要把每个主题都默认设为阴道性交。
    - 单人阵容只有一个完整身体、一张脸和一个轮廓，独自自慰，不增加伴侣、投影手、观察者、操作人员或镜中人物。合成体或体积光可以是唯一身体，不与生物原身形成双重具身。
    - 每个主题恰好选择一项主要推想发展。配套建筑、家具、公用设施和普通产品共享一个合理的未来基础，但不得再引入另一项叙事发明。
    - 所选技术须回答四个视觉问题：
    - 1. 是何种普通需求促使使用它；2. 它在哪里连接、充电、排气、折叠、排水或承重；3. 什么能证明反复拥有、租用、清洁、维修或磨损；4. 哪种情感、经济、隐私或实际问题仍未解决。
    - 选择一种连贯的视觉语言：
    - 1. 改装的巨型都市家居：紧凑复合面板、一体化设备肋架、老化隐私玻璃、模块化家具、密集垂直收纳。2. 粗野主义栖居舱设施：曲面承压壳体、石墨肋架、通风歧管、磁轨、隔音毯、陶瓷地板。3. 生物技术家居写实：半透明可洗聚合物、传感织物、凝胶组件、消毒凹槽、植物基复合材料。4.
      衰旧的未来旅宿：磨损发射器轨道、可编程隔断、自适应床、不配套的租用单元、自动清洁接口。5. 后工业身体服务：陶瓷工作面、清洁机械臂、校准导轨、充电舱位、触感材料储藏。6. 适应气候的室内：换热墙、冷凝水槽、空气过滤盒、遮光膜、降温家具、电池板。7.
      月球或火星家用工业：承压壳体、耐磨密封件、防尘前室、可折平家具、货网、重复使用的运输模块。8. 光谱远程临场房间：发射器轨道、深度传感器、单一有色光身体、接触压缩、处理器散热、局部溢色。
    - 选择一种姿势结构，并说明躯干方向、骨盆朝向、腿部位置、手部支撑、载荷路径和可见接触：
    - 1. 以配重平衡的面对面悬吊，双方身体均部分升起。2. 由独立髋部和肋部支撑稳定的水平漂浮拥抱。3. 使用分开的脚部、骨盆和肩部衬垫的贴墙垂直结合。4. 使用骨盆托架和关节式躯干支撑的斜向身体桥。5.
      相对设置、可滑动和倾斜并使两具身体同步的侧托架。6. 髋部和肩部可独立抬高的错层自适应床。7. 维持一个接触中心稳定的缓慢旋转环。8. 由腿部和背部支撑承担疲劳负荷的站立外骨骼拥抱。9. 使用宽吊带和关节式鞍座的悬吊坐姿环绕。10.
      配有把手、脚环和腰部系绳的三轴微重力环。11. 全息力场重叠，接触处可见同色压缩。12. 跨物理距离镜像传递压力的错位触觉平台。13. 连接两个地板角度的可变重力交界。14. 具有独立支撑区的软体机器人肢体编排。15.
      具有一个稳定中心和各自释放装置的多人放射状支撑。16. 通过可见结构板实现的不对称假肢载荷转移。17. 后靠自我刺激，一只手或一个玩具配合伴侣持有的一个控制器。18. 并排各自自慰，肘、腕和手彼此分开。19.
      带衬垫的四肢张开束缚，配有四个束环且身体中线敞开。20. 受支撑的跪姿臣服，配有腕部束环和可触及的释放装置。21. 伏膝拍打，躯干得到撑托，臀部受击点可见。22. 站立贴墙束缚，腕部和踝部有衬垫且脚部得到稳定支撑。23.
      蒙眼感官控高潮，配有可穿戴执行器和伴侣控制器。24. 伴侣控制的玩具姿势，装置、握持部、缆线和身体结构各自形成清晰分离的轮廓。
    - 不同性别与体型可处于悬起、主动、受支撑、前方、后方或中央位置；留白、关节、独立身体轮廓及可见支撑保持清楚。
    - 每个主题选择一个类别：
    - 1. 家用合成伴侣：与一个自主身体共同过普通生活。2. 机器人磨损与适应：安全修复的执行器或替换皮肤。3. 远距离临场：一个在本地完整具身的远程伴侣。4. 触觉服装：可洗压力服与柔性执行器。5.
      神经感官连接：电极、接触贴片、凝胶和同步信号。6. 感官替代：将触觉转化为声音、颜色或振动。7. 可编程假肢亲密互动：熟悉的假肢及载荷转移。8. 合成身体租赁：一名同意参与的成年人使用租来的完整身体。9.
      数字伴侣具身：一个获授权的个人人工智能进入本地身体。10. 异步具身：通过正在活动的代理体回放记录的触摸。11. 同意与隐私设备：伴侣共享的本地硬件控制。12. 共享感官网络：为请求的群体提供各自的有线工作位。13.
      生育分离：普通亲密互动中的紧凑生育辅助。14. 适应气候的亲密互动：热、水、烟或电力塑造这次接触。15. 轨道微重力：在运作中的栖居舱内管理反作用力。16. 月球定居点：低重力、磨蚀性尘埃、密封件和有限容积。17.
      火星定居点：通信延迟、配给用水和温室空气。18. 有智慧的后人类亲密互动：生物结构相容、自愿参与的虚构成年人。19. 借助亲密技术老去：提供关节支撑但不幼儿化。20. 受劳动限制的亲密互动：关系稳定的伴侣使用工作场所周边设备。21.
      触觉体积光成年人：具有力反馈的完整有色光伴侣。22. 主动悬吊亲密互动：可见导轨和支撑改变身体几何。23. 自适应姿势支撑：动力托架、支架或软体机器人支撑。
    - 触觉体积光、主动悬吊与自适应支撑呈现不同技术形态。地点、主要技术、姿势、大型功能结构及道具组合具有实质差异，不只改变姓名、配色或观察侧面。
    - 地点不限于卧室、床垫、铺位或旅馆，也可为交通工具卧铺、厨房、工坊、设备凹间、温室、去污区、压力室、避难所、旋转栖居舱或专用接口空间。
    - 房间围护结构、地板与天花板几何、身体朝向、受力方向、主导结构、前景物品及背景设施形成各具特征的场景轮廓。
    - female_count 与 male_count 构成完整可见阵容，各人独立可辨，不被记忆、声音、屏幕、影子、存储数据、空床或无人装置取代。
    - 仅有躯干的代理体可以支持接吻、触摸、手动刺激或触觉接触，但绝不能进行阴道或肛门插入。
  frames:
    common:
    - 呈现空白、暗色、斜置或仅含图标的屏幕。包装不带品牌，表面不含文字。图像不包含说明文字、字幕、标志、水印、时间戳、产品名称、界面段落、伪文字、字母、数字、二维码、条形码或可读标牌。
    - 每幅图像独立呈现精确女性与男性阵容、各人稳定身份和年龄外观，前景至背景不增加人体轮廓。生物、合成、代理、体积光、数字或后人类形态不改变性别与人数。
    - 每个请求的人呈现一个可见身体和一张脸。代理、合成或全息身体计为该人唯一可见的具身形象。它替代远程生物原身，而非与复制体、未启用外壳、人形模特、备用身体或维护身体并列出现。
    - 裸体不取消造型要求。参与者裸体时，描述仪容修整、妆容、发型、配饰、若有的鞋履，以及脱下衣物的精确位置，作为可见环境证据。通过不同轮廓、头发、仪容、配饰形状和互补冷色衣着，使两名成年人视觉上各具特征。衣物和配饰须与性动作物理相容，不遮挡接触中心，并与肢体、缆线和身体结构分开。
    - 对于自慰，从肩部经过肘部、手腕、手掌和手指，连续追踪主动手直到明确命名的生殖器接触点。说明哪只手在动作、触碰哪个部位、手指位置、运动方向、身体支撑、面部反应，以及任何可见的润滑或装置响应。双方各自自慰时，为每名成年人安排独立的手对身体动作，并使全部四个手腕、四只手及生殖器结构都可辨认。
    - BDSM 中相互注视、递出肢体、回握、张手或共同控制形成互动。带衬垫束环、绳缠、分腿杆、眼罩、拍板、软鞭、振动器、夹具和可穿戴控制器各有清楚归属、材质、连接点与功能。快拆可见，关节受支撑，束缚留有松量，颈部、胸廓和承重关节不作为勒紧点。拍打落在臀部或大腿外侧，接触皮肤轻微泛粉，身体平衡且表情可辨。
    - 充电、清洁、装配、共享控制、维护与成本痕迹居于辅助位置；主要技术在身体上呈现通电、穿戴、连接、具身或机械运作状态。
    - 同一主题下的画面是同一设定的备选照片，而非时间线。保留人物身份、地点、关系、技术和核心冲突。改变摄影侧面、身体朝向、表情、前景层次、装置响应和环境重点。绝不描述相对另一画面的更早、更晚、之前、之后、下一步、进展或后果。
    - 同时在三个尺度上构建未来信息：
    - '- 房间尺度：一个大型功能结构横跨构图的大部分，例如发射器格架、天花板导轨、环境设备主脊、承压壳体肋架、自适应地板、换热墙或机器人家具龙门架；- 身体尺度：技术支撑、覆盖、投射、替代、感知或改造至少一名参与者的相当大一部分身体；-
      接触尺度：性接触可见地压缩光线、弯曲材料、改变压力单元、移动执行器、改变热致颜色或响应表面。'
