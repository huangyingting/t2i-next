id: angel
description: >-
  根据指定成年人物阵容，创作原创真人实拍奇幻长片剧照，以真实演员、具有实体质感的羽翼、
  可穿戴服装和可信环境呈现天使。每个主题恰好有一位核心天使，计入阵容，不额外添加；
  核心天使可为女性或男性，拥有恰好一对翅膀，其余人物为无翼人类。
  每个人保留二十五至七十九岁之间的具体外观年龄和稳定身份。
  黑暗庄严、明亮空灵、朴素日常、荒野孤寂与华丽庆典均可成为视觉方向，不把天使固定为
  大教堂中正面站立、白翼全展的披甲人物。人物关系、场所尺度、羽翼形态、服饰、色彩和光线共同建立主题。
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 每位成年人穿着完整不透明衣物，以服装轮廓、人物姿态、表情、羽翼与环境关系构成画面。
      themes:
      - 人物可以行走、停留、工作、休憩、交谈或照料随身物件；动作来自角色与场所，不限定为英雄式站姿或礼仪展示。
      frames:
      - 完整的不透明衣物在雨、浸水、汗、雾和逆光中仍保持不透明；面部、颈部、手臂或腿部可依正常服装剪裁自然露出，不以透视衣料改变穿着状态。
    erotic:
      shared:
      - 采用非露骨的成年人亲密互动：相互脱衣、拥抱、接吻、涂抹身体油、沐浴、斜躺、乳房或大腿触摸，以及平衡的贴近姿势。
      frames:
      - 敞开、移位、半透明或脱下的衣物遵循姿势与重力，始终归属于其主人，绝不创造额外肢体或遮住关键身体连接。
      - 通过目光、触摸、姿态和动作使相互回应可见。
      themes:
      - 可选造型：以极简且可实际穿戴的礼仪饰物衬托裸露成年皮肤。
    hardcore:
      shared:
      - 呈现一项清晰可见、已在进行的成年人性行为，具有解剖上精确的接触、受支撑的体重、与当前动作相符的可见身体关系、普通人类性解剖结构和实际可行的翅膀净空。翅膀、羽毛、盔甲、家具边缘和道具与性接触路径保持分离。
      frames:
      - 仅描述可见的当前瞬间，并保留电影真实感。
      - 敞开、移位、半透明或脱下的衣物遵循姿势与重力，始终归属于其主人，绝不创造额外肢体或遮住关键身体连接。
      - 保留精确人物阵容、核心天使身份和参与动作的普通人类解剖结构。性交时，清楚呈现哪位成年人的阴茎位于哪位成年人的阴道或肛门内；口交或手部性行为时，清楚呈现哪张嘴或哪只手接触哪一生殖器。正在发生的接触及参与动作的解剖结构可见，不以裸体拥抱或暗示性身体对齐代替。
      - 通过目光、触摸、姿态和动作使相互回应可见。
      themes:
      - 可选造型：以极简且可实际穿戴的礼仪饰物衬托裸露成年皮肤。
  themes:
    common:
    - 以真人实拍的演员表演、皮肤纹理、羽毛层叠、织物组织、金属反射和真实光学表现建立奇幻电影感，而不是插画、角色设定板或服装展示。
    - Theme 固定人物身份、外观年龄、角色关系、羽翼类型、服装体系、地点及同一时间窗口内的基本情境；姿态、双翼开合、具体接触布局、景别、机位、焦点和局部照明留给各 Frame 独立设计。
    - 不同主题通过角色目的、人物关系、场所尺度、环境状态与视觉语言形成实质差异，不只替换道具、颜色或盔甲饰边。
    - 从指定阵容中选择核心天使，不另添人物。混合阵容中的核心天使性别不固定，其余人物各有与情境相符的角色；单人阵容只呈现核心天使。
    - 角色可以来自旅行、修缮、照料、研究、外交、守望、庆典或日常生活，也可发展其他与场所相符的原创身份；这些方向不是封闭职业清单，不要求每位天使都是统帅或战士。
    - 变化脸型、体型、肩宽、肤色、发质、发长、仪容与表情；身份通过个体外观和当前行为呈现，不让女性、男性、披甲者或长袍者各自只有一种固定气质。
    - 羽翼保持有机羽毛、上背部连接和一对左右匹配的基本结构；翼形、羽毛密度、长短、色泽与自然斑纹可以变化。紧凑、修长或宽阔的羽翼均可成立，尺度与人物、服装和场地净空相容。
    - 服装可采用盔甲、旅行装、日常剪裁、礼服、职业服或垂坠织物，也可组合其他结构可信的材料。暗淡古金、明亮抛光金属、浅色亚麻、深色皮革或鲜明染色织物都是可选方向，不要求每套服装低饱和或做旧。
    - 场所可为宏伟建筑、普通居所、狭窄工作间、街巷、庭院、海岸、林地、山地或其他原创空间。尺度可以亲近也可以壮阔，实物细节与人物活动相互解释，不限定为权力中心或宗教建筑。
    - 环境可以平静，也可以由天气、人物活动、机械或自然变化形成视觉事件。日常停留和细微反应本身可以成为画面中心，不要求每个主题都有大型场面事件；出现事件时，其光线、材料与运动后果属于同一个可理解的情境。
    - 色彩可采用低饱和近中性色、清透浅色、浓郁织物色、冷暖对照或其他与场景相符的组合；明亮、中间调或暗调曝光均可成立，不预设色相数量、色彩面积或阴影比例。
    - 光线可来自直射日光、阴天天光、门窗反射、灯火、场内灯具或多光源交织。色温、反差和光源高度由地点、时刻及情绪决定，不默认单一顶光、天窗光束或蓝灰琥珀配色。
    - 构图可强调人物与宏大环境的比例、近距离关系、横向并置、纵深、负空间、图形轮廓或材质细节；前景、中景、背景按画面需要组织，而不是每幅都使用相同的三层舞台结构。
  frames:
    common:
    - 每幅画面保持完成版真人实拍奇幻长片的质感，延续 Theme 已确定的人物身份、外观年龄、羽翼类型、服装体系、地点与基本情境；不把前一个 Frame 的姿态、镜头或布光当作下一幅的固定模板。
    - 同一主题的 Frame 是同一时间窗口中的平行画面方案，可变化站、坐、行进或倚靠姿态、双翼开合、人物距离、动作布局、取景方向、景别、焦点和局部光线；变化仍符合原有人物关系、场所与当前时刻，不构成先后发生的动作序列。
    - 核心天使保留普通成年类人身体及恰好一对匹配羽翼，由一只左翼和一只右翼组成，连接在上背部肩胛区域。翼根、关节、羽毛层叠、衣物开口与受力关系相容，不从其他人物、家具或错误身体部位生出翅膀。
    - 多人阵容中的其余人物保持无翼人类身份，不能把暂时被遮挡的翅膀当作另一人的身体特征；镜面或投影也不增加新的身份。
    - 双翼可收拢、下垂、半展、左右非对称开合或充分展开，实际可行的翅膀净空随当前姿态确定；折翼不要求场地能够容纳完全展开的翼展。
    - 侧身、背身、局部裁切与自然遮挡都可使用。画面提供足以理解人物身份、羽翼归属、支撑和当前动作的可见证据，不要求每幅同时展示面孔、两个翼根、双手和全部羽毛；遮挡不能制造多余肢体或互相矛盾的连接。
    - 人物重心、接触面、肢体职责和服装受力与当前姿态一致；翅膀与饰物不承担另一人的体重。地面、座椅、台阶或其他支撑物的材质、位置和空间与人物动作相容。
    - 环境层次可以舒展、压缩、留白或融入柔和背景；近景不必另加宏伟建筑和大型事件，远景也不必把每个面部细节都写成同样清晰。
    - 摄影机可采用环境广角、自然透视中景、近景或长焦压缩，焦距与距离服务于所需空间关系，不限定为一组固定数值。高低机位、侧向视角、正面或背面取景均由动作和羽翼形态决定。
    - 焦点可落在表情、动作端点、羽毛、服装或人与环境的关系上；必要的身份与动作证据保持可读，其他区域可自然虚化。光线可通过明度、色彩、轮廓或材质反射区分羽翼、身体和背景，不要求所有部位同时受到聚焦高光。
    - 延续主题的色彩与时刻，在其允许范围内调整反差、反射光、局部色彩重心与光源方向。皮肤、金属和羽毛保留各自的真实表面反应，不统一处理成灰暗材质或塑料光泽。
    - 环境事件若存在，其风、雨、尘、织物和羽毛运动具有可解释的关系；若场景平静，则以姿态、目光、材料与空间关系承载画面，不强行添加奇观。
