id: angel
description: >-
  根据指定成年人物阵容，创作原创真人实拍奇幻长片剧照，以真实演员、具有实体质感的羽翼、
  可穿戴服装和可信环境呈现天使。每个主题恰好有一位核心天使，计入阵容，不额外添加；
  核心天使可为女性或男性，拥有恰好一对翅膀，其余人物为无翼人类。
  每个人保留二十五至七十九岁之间的具体外观年龄和稳定身份。
  黑暗庄严、明亮空灵、朴素日常、荒野孤寂与华丽庆典均可成为视觉方向，不把天使固定为
  大教堂中正面站立、白翼全展的披甲人物。人物关系、场所尺度、羽翼形态、服饰、色彩和光线共同建立主题。
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 每位成年人穿着完整不透明衣物，以服装轮廓、人物姿态、表情、羽翼与环境关系构成画面。
      themes:
      - 人物可以行走、停留、工作、休憩、交谈或照料随身物件；动作来自角色与场所，不限定为英雄式站姿或礼仪展示。
      frames:
      - 完整的不透明衣物在雨、浸水、汗、雾和逆光中仍保持不透明；面部、颈部、手臂或腿部可依正常服装剪裁自然露出，不以透视衣料改变穿着状态。
    erotic:
      shared:
      - 每个 Theme 和每幅画面都通过部分或完整裸体、持续的裸露肌肤接触、相互脱衣、充满张力的拥抱或接吻、涂抹身体油、共同沐浴、斜躺、乳房或大腿触摸，以及平衡的贴近姿势，确立清楚可见且非露骨的成年人情色状态。完整着装、并肩站立、普通工作、救助或搀扶、单向凝视、仅靠近身体及浪漫气氛本身不足以满足该级别。
      frames:
      - 敞开、移位、半透明或脱下的衣物遵循姿势与重力，始终归属于其主人，绝不创造额外肢体或遮住关键身体连接。
      - 每幅画面的冻结瞬间已经建立一项明确的双向亲密互动，裸露状态、直接肌肤接触、双方动作和身体反应清楚可见；不把情色接触推迟到画外、下一刻或其他 Frame。
      - 通过目光、触摸、姿态和动作使相互回应可见；每位成年人参与同一项亲密互动、支撑其身体关系或作出明确回应，不执行取水、绘画、劳作、观察环境等独立任务来取代情色动作。
      - 每幅画面至少让一位主要参与者的面部表情清楚可读，并使双方神态分别符合当前亲密动作、主动或回应角色、身体受力和人物关系；不用相同的半闭眼、张嘴、仰头或泛泛“沉醉”表情套用所有姿势。
      themes:
      - 可选造型：以极简且可实际穿戴的礼仪饰物衬托裸露成年皮肤。
      - Theme 阶段直接建立上述清楚可见且非露骨的成年人感官状态，不把内容强度推迟到 Frame。premise 明确当前正在发生的双向亲密互动、每人的参与方式、身体遮盖状态、接触关系与可行支撑；style 用相机距离、构图、光线和焦点使该互动成为视觉中心。
      - 场景目标、环境阻碍、角色职业与天使羽翼共同塑造亲密互动，但不能成为与情色无关的主要动作；移除当前亲密接触后，Theme 的核心画面关系应不再成立。
    hardcore:
      shared:
      - 每个 Theme 和每幅画面都呈现一项清晰可见、已经发生且正在进行的成年人性行为，具有解剖上精确的接触、受支撑的体重、与当前动作相符的可见身体关系、普通人类性解剖结构和实际可行的翅膀净空。翅膀、羽毛、盔甲、家具边缘和道具与性接触路径保持分离。
      - 必须用具体参与者、具体动作和具体接触部位陈述当前行为；“成年人性行为”“亲密结合”“交缠”“可见端倪”或只描述身体贴近与节奏都不是有效替代。
      - 性姿势与动作布局采用开放集合，可按人物阵容、主要行为和场所选择跪姿、站姿、前后朝向或后入式排列、坐姿或骑乘、躺卧或侧卧、抱举或抬起、倚靠稳定家具，以及使用成年人性器具；这些只是可扩展的方向，不是封闭清单，不要求按固定顺序出现，也不把多个互不相容的姿势叠进同一冻结瞬间。
      frames:
      - 仅描述可见的当前瞬间，并保留电影真实感。
      - 敞开、移位、半透明或脱下的衣物遵循姿势与重力，始终归属于其主人，绝不创造额外肢体或遮住关键身体连接。
      - 需要分开双腿或暴露骨盆接触中心时，闭环下装在行为开始前已经完全脱离双腿，并放在远离接触中心的一个明确可见位置；不让裤子、内衣、裙身或其他衣物停在大腿、膝盖或脚踝处限制姿势，也不让衣物穿过身体或接触边界。
      - 每幅画面的性行为已经建立并占据视觉中心，不以裸体、脱衣、亲吻、拥抱、准备姿势、事后休息、被身体或羽翼隐藏的接触，或与性行为并行的环境任务代替。
      - 保留精确人物阵容、核心天使身份和参与动作的普通人类解剖结构。性交时，清楚呈现哪位成年人的阴茎位于哪位成年人的阴道或肛门内；口交或手部性行为时，清楚呈现哪张嘴或哪只手接触哪一生殖器。正在发生的接触及参与动作的解剖结构可见，不以裸体拥抱或暗示性身体对齐代替。
      - 每幅画面逐字写明一种当前动作及其参与者归属：插入时同时写明阴茎、阴道或肛门与插入关系；口部或手部动作同时写明执行者、嘴或手、所接触的生殖器与正在进行的刺激。不能只写“性行为正在持续”“结合部位”“下腹接触”或“动作清晰”。
      - 身体内部结构始终不可见。插入行为只通过外部接触边界、双方骨盆方向、相连的生殖器根部与身体压力证明；大部分阴茎位于体内时，不同时描述其阴茎体完整外露或透过身体可见。
      - 同一 Theme 有多个 Frame 时，不只改变机位或措辞；在保持同一主要行为、人物关系与时间窗口的前提下，使任意两个 Frame 在身体朝向、跪立坐卧层级、承重点、腿部安排、抱举关系或器具互动中至少有两项明确差异，并为每种变化重新核对接触连续性与受力路径。
      - 抱举或抬起姿势必须说明承重者双脚所在的稳定表面、躯干重心和双臂或双手的唯一支撑位置，也说明被抬起者的骨盆、大腿、背部或手臂由何处支撑；不使用单点悬空、关节反向、无支撑腾空或羽翼承重来制造姿势。
      - 使用床、椅、桌沿、台阶、扶手、支架或成年人性器具时，说明其稳定位置、与哪位人物哪个身体部位接触以及承担支撑或刺激的唯一作用。器具保持一个连续形体和一条可见接触路径，不复制、不悬空、不穿过肢体或家具，也不与已经占据同一身体开口的其他身体部位或器具重叠。
      - 通过目光、触摸、姿态和动作使相互回应可见。
      - 每幅画面至少让一位主要参与者的面部表情清楚可读，并使每人的神态分别对应当前具体行为、动作角色、身体受力、呼吸状态和人物关系。执行、承受、支撑或使用器具的人不复制同一表情，也不用固定的半闭眼、张嘴、仰头或泛泛“狂喜”代替与动作相符的反应。
      themes:
      - 可选造型：以极简且可实际穿戴的礼仪饰物衬托裸露成年皮肤。
      - Theme 阶段直接建立上述已经发生且正在进行的成年人性行为，不把该行为推迟到 Frame。premise 用具体解剖词明确指定一项主要性行为、每位参与者的动作角色、身体排列、接触部位、承重支撑、衣物位置与羽翼净空；style 选择能让动作中心和必要身体关系可读的机位、构图、光线与焦点。不能只用“成年人性行为”“亲密结合”或其他泛称占位。
      - 地点用途、环境状态与羽翼形态必须改变性行为的可行姿势、支撑或画面轮廓，但不引入取代当前性行为的第二项主要任务。
      - 比较同一请求中已经接受的 Theme，不重复“主要行为、姿势类别、双方朝向、承重表面与器具使用”组合。请求不少于六个 Theme 时，在与阵容和主要行为相容的前提下，至少覆盖跪、立、坐或骑乘、躺卧或侧卧、抱举或抬起、稳定家具或成年人性器具参与中的四个不同类别；每个类别仍须形成一个完整可行的姿势，而不是只在文字中点名。
  themes:
    common:
    - 以真人实拍的演员表演、皮肤纹理、羽毛层叠、织物组织、金属反射和真实光学表现建立奇幻电影感，而不是插画、角色设定板或服装展示。
    - Theme 固定人物身份、外观年龄、角色关系、羽翼类型、服装体系、地点及同一时间窗口内的基本情境；姿态、双翼开合、具体接触布局、景别、机位、焦点和局部照明留给各 Frame 独立设计。
    - 不同主题通过角色目的、人物关系、场所尺度、环境状态与视觉语言形成实质差异，不只替换道具、颜色或盔甲饰边。
    - 每个 Theme 分别明确人物目的、关系结构、空间用途、环境状态、羽翼形态、服装体系与视觉语言；将这些维度组成相互解释的原创情境，而不是从清单中随机拼贴元素。
    - 比较同一请求中已经接受的 Theme，不重复使用相同的“人物关系、空间用途、主要动作、环境状态与光线方向”组合，也不让相邻主题只改变其中一个维度。
    - 每个 Theme 建立一个能从画面直接读出的当前目标、阻碍或异常状态，并让人物反应、环境痕迹、服装状态与羽翼姿态共同呈现其物理后果，不依赖画外背景故事解释场景。
    - 大教堂、王座、神殿、战场、白色羽翼、金色盔甲、居中站立和强逆光可以按情境使用，但不把其中任何一项或其组合当作默认天使母题；避免连续 Theme 重复时代感、建筑尺度、天气、主色调、羽翼开合方式或人物权力关系。
    - 从指定阵容中选择核心天使，不另添人物。混合阵容中的核心天使性别不固定，其余人物各有与情境相符的角色；单人阵容只呈现核心天使。
    - 角色可以来自旅行、修缮、照料、研究、外交、守望、庆典或日常生活，也可发展其他与场所相符的原创身份；这些方向不是封闭职业清单，不要求每位天使都是统帅或战士。
    - 变化脸型、体型、肩宽、肤色、发质、发长、仪容与表情；身份通过个体外观和当前行为呈现，不让女性、男性、披甲者或长袍者各自只有一种固定气质。
    - 羽翼保持有机羽毛、上背部连接和一对左右匹配的基本结构；翼形、羽毛密度、长短、色泽与自然斑纹可以变化。紧凑、修长或宽阔的羽翼均可成立，尺度与人物、服装和场地净空相容。
    - 服装可采用盔甲、旅行装、日常剪裁、礼服、职业服或垂坠织物，也可组合其他结构可信的材料。暗淡古金、明亮抛光金属、浅色亚麻、深色皮革或鲜明染色织物都是可选方向，不要求每套服装低饱和或做旧。
    - 场所可为宏伟建筑、普通居所、狭窄工作间、街巷、庭院、海岸、林地、山地或其他原创空间。尺度可以亲近也可以壮阔，地点具有可见用途并影响人物活动、姿态与羽翼净空，实物细节与人物活动相互解释，不限定为权力中心或宗教建筑。
    - 环境可以平静，也可以由天气、人物活动、机械或自然变化形成视觉事件。日常停留和细微反应本身可以成为画面中心，不要求每个主题都有大型场面事件；出现事件时，其光线、材料与运动后果属于同一个可理解的情境。
    - 色彩可采用低饱和近中性色、清透浅色、浓郁织物色、冷暖对照或其他与场景相符的组合；明亮、中间调或暗调曝光均可成立，不预设色相数量、色彩面积或阴影比例。
    - 光线可来自直射日光、阴天天光、门窗反射、灯火、场内灯具或多光源交织。色温、反差和光源高度由地点、时刻及情绪决定，不默认单一顶光、天窗光束或蓝灰琥珀配色。
    - 构图可强调人物与宏大环境的比例、近距离关系、横向并置、纵深、负空间、图形轮廓或材质细节；前景、中景、背景按画面需要组织，而不是每幅都使用相同的三层舞台结构。
  frames:
    common:
    - 每幅画面保持完成版真人实拍奇幻长片的质感，延续 Theme 已确定的人物身份、外观年龄、羽翼类型、服装体系、地点与基本情境；不把前一个 Frame 的姿态、镜头或布光当作下一幅的固定模板。
    - 同一主题的 Frame 是同一时间窗口中的平行画面方案，可变化站、坐、行进或倚靠姿态、双翼开合、人物距离、动作布局、取景方向、景别、焦点和局部光线；变化仍符合原有人物关系、场所与当前时刻，不构成先后发生的动作序列。
    - 同一 Theme 的任意两个 Frame 至少在景别、机位高度、取景方向、人物距离、动作布局、焦点对象、羽翼轮廓和局部光线中的三项形成明显差异，不以轻微改写同一构图充当新画面。
    - 同一 Theme 至少生成三个 Frame 时，整组画面分别覆盖环境关系、人物互动或动作端点，以及侧面、背面、遮挡、反射或前景框景形成的空间组织；这些方向不按固定顺序分配，也不改变同一时间窗口。
    - 核心天使保留普通成年类人身体及恰好一对匹配羽翼，由一只左翼和一只右翼组成，连接在上背部肩胛区域。翼根、关节、羽毛层叠、衣物开口与受力关系相容，不从其他人物、家具或错误身体部位生出翅膀。
    - 每名成年人保持一个连续身体：一个头部、一个躯干、一个骨盆、两条手臂、两只手、两条腿、两只脚，以及与其性别和身体一致的一套解剖结构。裁切和遮挡不改变该拓扑，也不复制头、躯干、骨盆、肢体或身体部位。
    - 每条可见的手臂和腿从所属人物的躯干或骨盆连续延伸至对应的左手、右手、左脚或右脚；多人肢体靠近时，明确左右、人物归属与前后层次，并以轮廓或小片负空间分隔容易混淆的手、脚和接触点。
    - 冻结瞬间中，每条肢体只有一个位置、一个关节状态和一个主要职责。执行动作、承重、抓握、触摸或整理衣物的手脚不能同时出现在另一位置，也不同时承担互不相容的任务。
    - 表情由当前动作阶段、人物角色、身体受力、呼吸节奏和彼此关系共同决定，用视线方向、眼睑张力、眉形、嘴唇或下颌状态及面颊或颈部肌肉等可见迹象呈现，不只写抽象情绪标签。同一 Theme 的多个 Frame 改变动作布局时同步调整表情，不重复同一组面部反应。
    - 多人阵容中的其余人物保持无翼人类身份，不能把暂时被遮挡的翅膀当作另一人的身体特征；镜面或投影也不增加新的身份。
    - 双翼可收拢、下垂、半展、左右非对称开合或充分展开，实际可行的翅膀净空随当前姿态确定；折翼不要求场地能够容纳完全展开的翼展。
    - 左翼和右翼分别从对应翼根连续延伸至翼尖，具有唯一空间路径和前后层次；羽骨、羽毛和翼尖不穿过天使身体、另一人、另一侧羽翼、衣物、地面、墙壁或家具。羽翼若接触表面，说明接触位置及其只承担羽翼自身重量的作用。
    - 羽翼不是人体的第三支点，不为天使或其他人物提供辅助支撑、平衡、承重、托举或稳定三角形；人物姿势仅由自己的手、膝、脚、背部、骨盆和实际家具或地面支撑。翼尖接触地面时仍保持松弛，不改变人体重心或载荷路径。
    - 侧身、背身、局部裁切与自然遮挡都可使用。画面提供足以理解人物身份、羽翼归属、支撑和当前动作的可见证据，不要求每幅同时展示面孔、两个翼根、双手和全部羽毛；遮挡不能制造多余肢体或互相矛盾的连接。
    - 将画面视为从唯一相机位置得到的单一不透明二维投影，只描述无遮挡视线能够到达的表面。正面视角不同时完整展示背部和臀部，背面视角不同时完整展示胸腹和前侧骨盆，严格侧面只呈现近侧轮廓及合理露出的远侧边缘。
    - 身体、羽翼、衣物和家具重叠时，明确从相机到远处的遮挡顺序。若当前角度遮住必要的身份、支撑或接触证据，则改变机位或姿势，不使用透明身体、穿透表面、不可能扭转、未说明的镜面或第二视角补出被遮挡部位。
    - 表情服从人物朝向和可见性：没有视线通路时不声称双方对视，背向、俯身或被遮挡的人不为面向摄影机而反向扭颈；看不见的面部细节不作描述，改用合理机位呈现至少一张关键面孔，并保留动作与支撑证据。
    - 人物重心、接触面、肢体职责和服装受力与当前姿态一致。为每个承重的手、膝、脚、背部或骨盆指明实际支撑表面，抬起的肢体不承重，并使重量通过这些接触点传至地面、座椅、台阶或其他稳定结构；翅膀与饰物不承担另一人的体重。
    - 敞开、移位或脱下的每件衣物只有一个明确位置、形状与所属者，遵循扣合结构、关节活动范围和重力；衣物不占据人体、羽翼、家具或人物接触已经占据的空间。
    - 环境层次可以舒展、压缩、留白或融入柔和背景；近景不必另加宏伟建筑和大型事件，远景也不必把每个面部细节都写成同样清晰。
    - 摄影机可采用环境广角、自然透视中景、近景或长焦压缩，焦距与距离服务于所需空间关系，不限定为一组固定数值。高低机位、侧向视角、正面或背面取景均由动作和羽翼形态决定。
    - 焦点可落在表情、动作端点、羽毛、服装或人与环境的关系上；必要的身份与动作证据保持可读，其他区域可自然虚化。光线可通过明度、色彩、轮廓或材质反射区分羽翼、身体和背景，不要求所有部位同时受到聚焦高光。
    - 延续主题的色彩与时刻，在其允许范围内调整反差、反射光、局部色彩重心与光源方向。皮肤、金属和羽毛保留各自的真实表面反应，不统一处理成灰暗材质或塑料光泽。
    - 环境事件若存在，其风、雨、尘、织物和羽毛运动具有可解释的关系；若场景平静，则以姿态、目光、材料与空间关系承载画面，不强行添加奇观。
    - 正文使用完整、自然的目标语言表达强度、气氛和摄影概念，不混入 intensity、mood、cinematic 等未翻译英文词。
