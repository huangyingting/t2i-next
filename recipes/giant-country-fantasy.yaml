id: giant-country-fantasy
description: 在巨人国的具体日常地点，正常人类世界的成年访客与唯一巨人原住民进行以尺度差为必要条件的亲密互动。以手指长度的微型尺度访客、巨人国原生日用品、完整巨人身体和地点原生机制表现尺度、因果与相互回应。
