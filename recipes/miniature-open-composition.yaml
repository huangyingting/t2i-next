id: miniature-open-composition
description: '创作纲要: 创作具有移轴微距电影感的小人国情色幻想主题：微型人物与巨大人物，在尺度差异悬殊的场景中的性相关互动，凸显情色感官层面的刺激。'
authoring:
  themes:
    common:
    - '角色: 所有人物均设定为东亚人种，包括来自中国、日本、韩国、香港、台湾和新加坡等地。所有人物身材比例都匀称。微型人物必须具有清晰可辨的外貌、服装、姿态、视线和表情。'
    - '互动设计: 每个主题可聚焦于在巨大体型反差下的非常规形式的性活动：内容可包括如性器官、臀部、胸部敏感区域或其他私密部位的裸露、特写、触碰、摩擦、亲吻、舔舐、吸吮、刺激或刻意展示；以手、口、身体其他部位、器具、服装、家具或环境实施的性刺激或模拟性交的动作；包括任何性交、口交、肛交、群体性行为、性玩具使用、恋物性接触，或微型人物借助道具进行的性互动。'
    - '互动构图: 更衣、洗浴、身体局部与巨大物件构成尺度错觉；私密部位取景、裸露、姿势及人物与玩具般环境的对比形成视觉重点。'
    - '互动变化: 尺度差、隔衣接触、道具、隐喻及拟态形成不同的可见接触与空间关系。'
    - 第三方巨手、匿名旁观者和文字标识是允许的可选元素，不是每帧必须添加的元素。巨手的主人和旁观者计入同一总阵容及请求的女性、男性数量；这些元素不增加八名不同人物的核心容量。
  frames:
    common:
    - '角色: 所有人物均设定为东亚人种，包括来自中国、日本、韩国、香港、台湾和新加坡等地。所有人物身材比例都匀称。微型人物必须具有清晰可辨的外貌、服装、姿态、视线和表情。'
    - '互动设计: 每个主题可聚焦于在巨大体型反差下的非常规形式的性活动：内容可包括如性器官、臀部、胸部敏感区域或其他私密部位的裸露、特写、触碰、摩擦、亲吻、舔舐、吸吮、刺激或刻意展示；以手、口、身体其他部位、器具、服装、家具或环境实施的性刺激或模拟性交的动作；包括任何性交、口交、肛交、群体性行为、性玩具使用、恋物性接触，或微型人物借助道具进行的性互动。'
    - '互动构图: 更衣、洗浴、身体局部与巨大物件构成尺度错觉；私密部位取景、裸露、姿势及人物与玩具般环境的对比形成视觉重点。'
    - '互动变化: 尺度差、隔衣接触、道具、隐喻及拟态形成不同的可见接触与空间关系。'
    - '画面契约: 画面背景必须保持干净，纯色，不出现杂乱或无关元素，人物服饰需鲜亮醒目，以增强视觉层次。每个画面呈现同一段亲密互动中的独立瞬间。为人物分配主动且不可替代的行为，每一画面都需同时体现在巨大尺度差异下表现出的非常规极致的感官张力与幻想尺度。'
    - '画面契约: 保持人物的年龄、发型、服装、体型比例与环境的一致性。允许在画面中加入突兀的第三方巨手、匿名旁观者、文字标识或其他可能打破沉浸感的元素，以强化表现层次。'
    - 第三方巨手、匿名旁观者和文字标识是允许的可选元素，不是每帧必须添加的元素。巨手的主人和旁观者计入同一总阵容及请求的女性、男性数量；这些元素不增加八名不同人物的核心容量。
