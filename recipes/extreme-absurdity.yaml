id: extreme-absurdity
description: 创作多样、超写实、电影感的成年人静帧，让所要求的内容等级演绎极端荒诞。
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 除非请求明确另有说明，否则所有人保持着衣，互动保持非色情。人物阵容的合作、竞争、礼仪、家庭、社交或实用身体互动本身必须同时体现普通功能与相反的荒诞功能。不得加入裸露乳房或生殖器、性触摸、性交或色情姿态。
      - 自承重物件可以是人物共同非色情动作的一部分。
      frames:
      - 共同着衣动作及其主要物件至少占据画面三分之一。
      - 将标签附在主要自承重物件上。
    erotic:
      shared:
      - 所要求的身体接触占据画面中央的一半。每位参与者的肢体都服务于该接触、身体支撑或相互回应；没有参与者操作单独控制件或执行第二个任务。
      - 所要求的内容等级接触仍为直接人体接触，同时一位参与者的非生殖器身体表面也必须与主要道具直接机械接触，作为同一受支撑姿态的一部分。此道具接触不是第二项任务：它是可见的承重、支撑、按压、抓握或控制点，将共享身体几何连接至道具当前状态。道具不得触碰生殖器或肛门、进入身体、向体内输送物质、遮住必需接触、束缚人物或充当性参与者。
      - 保留所有构成等级资格的直接人体接触。用空闲手、前臂、肘、肩、上背、腰、髋外侧、膝、小腿前侧或脚接触道具。该肢体还必须为共享身体姿态提供支撑或传力，使触碰道具成为唯一互动中不可缺少的一部分，而非并行任务。
      - 所要求的裸露保持完全可见，但不得有人呈现为没有造型的普通裸体。使用鲜艳敞开夹克、垂披长袍、移位裙子、解扣衬衫、长袜、靴子、手套、腰带、珠宝或其他不遮挡的服装配饰，其确切位置须在物理上与姿态相容。衣物不得进入必需接触、捆绑肢体、遮住解剖、覆盖人与道具接触或中断可见力路径。
      frames:
      - 冻结瞬间中，裸露皮肤与直接无中介的亲密接触已建立，裸露表面明显相触，衣物、家具和道具不介入决定性接触。嘴、躯干、背、腰、肩、乳房或大腿外侧可相触，但不涉及生殖器或肛门，也不呈现握弄、插入、口部与生殖器接触或直接生殖器刺激。同一接触几何同时体现普通亲密功能及相反荒诞功能，不是荒诞物件旁的普通亲密。
      - 被动证据保持从属。
      - 将它们附在附近的一个被动证据表面上，分处直接接触的相对两侧，绝不附于皮肤或衣物。箭头可指向该接触的两种相反功能。
      - 当前接触是唯一人类动作，直接构成荒诞矛盾的因果来源。
    hardcore:
      shared:
      - 所要求的身体接触占据画面中央的一半。每位参与者的肢体都服务于该接触、身体支撑或相互回应；没有参与者操作单独控制件或执行第二个任务。
      - 所要求的内容等级接触仍为直接人体接触，同时一位参与者的非生殖器身体表面也必须与主要道具直接机械接触，作为同一受支撑姿态的一部分。此道具接触不是第二项任务：它是可见的承重、支撑、按压、抓握或控制点，将共享身体几何连接至道具当前状态。道具不得触碰生殖器或肛门、进入身体、向体内输送物质、遮住必需接触、束缚人物或充当性参与者。
      - 保留所有构成等级资格的直接人体接触。用空闲手、前臂、肘、肩、上背、腰、髋外侧、膝、小腿前侧或脚接触道具。该肢体还必须为共享身体姿态提供支撑或传力，使触碰道具成为唯一互动中不可缺少的一部分，而非并行任务。
      - 所要求的裸露保持完全可见，但不得有人呈现为没有造型的普通裸体。使用鲜艳敞开夹克、垂披长袍、移位裙子、解扣衬衫、长袜、靴子、手套、腰带、珠宝或其他不遮挡的服装配饰，其确切位置须在物理上与姿态相容。衣物不得进入必需接触、捆绑肢体、遮住解剖、覆盖人与道具接触或中断可见力路径。
      frames:
      - 冻结瞬间已建立直接可见的露骨接触，涉及的解剖部位、插入或刺激、身体压力及参与者控制的玩具均明确。普通功能及相反的荒诞功能在同一接触几何中共存，不以仅裸体、准备、对齐、靠近、隐藏接触或独立任务替代。
      - 被动证据保持从属。
      - 将它们附在附近的一个被动证据表面上，分处直接接触的相对两侧，绝不附于皮肤或衣物。箭头可指向该接触的两种相反功能。
      - 当前接触是唯一人类动作，直接构成荒诞矛盾的因果来源。
  themes:
    common:
    - 这是选集，而非一个连续世界。每个主题必须采用不同的人物目标、非理性法则、关系结构、地点功能、可见后果、创作者参考、情绪基调和电影语言。
    - 每个主题和画面必须实现一个不可分割的静态等式：
    - 所选内容等级的互动 + 一个非理性条件 = 一个自我否定的当前状态
    - 所选内容等级的互动是唯一的人类动作，也是荒诞的来源。它不得表现为合规、装饰、氛围，或独立荒诞机器旁的另一个层面。
    - 自我否定针对互动的普通关系功能或目标，绝不针对构成内容等级资格的事实本身。最终场景中，所要求的接触必须已明显建立、直接且无阻挡。不得声称同一表面同时接触又分离，或障碍物恰好占据要求直接接触的间隙。
    - 有效图像满足以下所有不变量：
    - 1. 完整人物阵容共享一个适合所选内容等级的具体关系目标。
    - 2. 每位参与者执行同一个内容等级互动中不可缺少的一部分。
    - 3. 一个非理性条件直接作用于该互动。
    - 4. 普通功能及其相反的荒诞功能在同一接触中同时可见。
    - 5. 一个当前材料或空间状态直接否定关系目标。
    - 6. 互动、非理性条件和否定状态共存，没有转化或先后顺序。
    - 7. 移除所选内容等级的互动，就会移除矛盾。
    - 8. 移除正文与标签，不会移除视觉可辨的矛盾。
    - 只有同一人际互动，不并列无关的机器、工具、文件、仪式或道具任务。
    - 严格保留指定中国人物阵容，无额外人物；成熟外貌、年龄、面部、头发、体型、服装和其他身份特征在主题内稳定，人物主动且相互回应。
    - 荒诞条件可以否定温暖、互惠、隐私、通达、识别、交换、构成等级资格的接触之外的亲近，或其他普通关系功能，但必须保留所选内容等级要求的每个可见事实。任何被动证据都必须留在决定性接触的旁边、周围、下方、后方或更远处，而非进入或取代它。
    - 非理性法则改变互动的功能后果，不改变解剖、身体重力、支撑、自然伸及范围、关节逻辑或肢体连接。
    - 所选互动必须是承载矛盾的唯一人际关系。
    - 内容等级接触、非理性条件和否定状态之间所有必需关系必须同时可见。被动证据只能对应中央互动中已存在的接触、压力、重量分配、对齐、支撑或位移。把所有材料与关系表述为完整的当前事实。不得描述触发、转换、扩散、生长、积累、随时间流动、隐藏传感器、画外原因、不可见转移、无法解释的自动化、魔法或依赖文字的因果关系。
    - 至多两件辅助道具；人物互动与环境后果不可分离，关系几何在剪影中即可呈现自我否定，而非普通接触旁的独立荒诞装置。
    - 矛盾不得只是短缺、碰撞、瓶颈、共享控制、道路受阻、争夺物件，或通过轮流、停止一名参与者、移除障碍、使用更大表面就能解决的不便。
    - 每个主题和画面必须包含一个主要的自承重道具、装置、家具部件、建筑控制件或证据表面，并由一位明确指名的参与者直接触碰。仅在近旁、隐含、自动或未被触碰的道具无效。
    - 对每处人与道具接触，明确具体参与者、具体身体部位、具体道具表面、接触方向及持续施力。适用时指定左或右。说明身体部位是在按压、抓握、支撑、倚靠、承重搁置、克服阻力拉动，还是把控制件保持在固定限位。展示该确切接触点相应的压缩、凹陷、重量位移、绷紧联动件、压下控制件、旋转关节、受支撑负载或接触阴影。
    - 从人体接触点到道具当前状态，追踪一条不中断、可见的力传递路径。命名路径上的每个承重表面、杠杆、铰链、杆、缆索、齿轮、环、轨道或刚性联动件。如果一个道具呈现两种相反功能或设置，则为每种状态安排各自可见的人体接触点，或安排一个清晰可见且实际同时产生两种状态的机械联动。不得从身体接触直接跳到远处结果。
    - 对相机，明确谁的手或受支撑身体表面接触快门释放按钮、光圈环、对焦环、过片装置、三脚架云台或其他命名部件。对家具，说明哪处身体表面向哪个边缘、坐垫、把手、踏板、横杆或接头施加负载。对机器，说明哪个解剖表面按压或抓握哪个控制件，并展示通向机器状态的可见联动。在没有此实体接触链时，绝不声称亲密行为只是给道具供能、启动、触发、校准、扫描、记录或控制它。
    - 为每位成年人提供可见的身高和体型。给主要道具提供以厘米计的具体整体尺寸，或同等精确的相对身体尺寸。当尺寸决定伸及、抓握、杠杆作用、支撑或净空时，命名被接触部件的宽度、直径、高度或行程距离。
    - 展示完整姿态在物理上适合该道具。说明参与者受支撑的肩或髋到接触部件的伸及距离、承重面积、关节及其他人周围的空隙，以及接触点到所产生机械状态之间的距离。人物不能穿过另一身体伸手、跨越未说明的间隙、站在过小家具内部、向不足以容纳姿态的表面施加负载，或用普通人体操作微型或超大部件。
    - 为每位参与者提供独特、稳定且可拍摄的完整造型。说明冻结姿态中可见的确切服装与配饰配置、饱和色彩、材质、饰边、开口、扣合、垂褶、鞋履及珠宝。使用大胆宝石色、高亮电光色、漆面、金属点缀或强烈对比色块，而非泛化黑色、灰色、米色、纯白或未说明的衣着。
    - 为每位参与者提供夸张但物理可信的发型，具有可辨剪影、结构、色彩处理和装饰：雕塑波浪、建筑式编辫、高耸马尾、漆亮发卷、扇形波波头、鲜艳接发、宝石发针、丝带或相当的原创设计。说明重力、接触及保持姿态如何影响头发。头发不得遮住面部、目光、嘴、身体接触、道具部件或标签。
    - 为每位参与者明确可见妆容：眼线形状、眼影颜色、睫毛、眉毛处理、唇色与质感、腮红或高光，以及可选指甲颜色。使用鲜亮、夸张、高对比的配色，同时保持实际涂抹化妆品的可信感。多人场景中，分配互补颜色与不同剪影，使每张脸和每条肢体的归属立即可辨。
    - 对每个主题：
    - 1. 选择一个私密或有门禁的中国地点，其普通功能支持所选关系目标。
    - 2. 先定义确切内容等级互动，再选择荒诞机制。
    - 3. 将一个非理性法则施于该互动，而非添加另一个动作。
    - 4. 为每位参与者安排共享接触中一个物理相容且不可或缺的角色。
    - 5. 为一位参与者指定主要道具上的精确非生殖器接触点，该接触同时支撑共享姿态。
    - 6. 从该身体部位经明确命名机械部件追踪可见力路径，直到道具相反的当前状态。
    - 7. 安排一种静态几何，使该接触同时保持其普通功能、相反荒诞功能以及否定性的材料或空间状态。
    - 8. 保持装置自承重，并从属于人物。
    - 9. 让矛盾仅凭身体几何、人与道具接触、力传递、材料状态及物体位置即可读懂。
    - 10. 除唯一的非理性法则外，所有内容都保持社会上可辨识、材料上可信、物理上精确。
    - 不解释法则为何存在。不得指认为梦、幻觉、隐喻、实验、恶作剧、魔法原因、未来技术或隐藏机构。成年人将矛盾视为日常、必要、礼貌、亲密或略微不便的事。
    - 每个主题使用一个主要创作者参考。这些参考只提供抽象机制与视觉纪律，绝非复制作品、完整个人标志风格，或违反上述规则的许可。
    - '- "René Magritte — single impossible relation"：一种平静、熟悉的关系包含唯一不可能的功能事实。'
    - '- "Marcel Duchamp — functional reassignment"：重新分配一种普通功能，使其正确使用反而挫败自身。'
    - '- "Luis Buñuel — self-negating etiquette"：真诚亲密或社交仪式在物理上摧毁它所保护的结果。'
    - '- "Jacques Tati — system choreography"：身体、家具与建筑构成一张宽阔、可读的因果图。'
    - '- "Samuel Beckett — static futility"：一种稀疏、保持不动的互动包含完整的循环失败，无需重复。'
    - '- "Franz Kafka — administrative impossibility"：许可与禁止成为同一种关系中同时存在的材料状态。'
    - '- "Erwin Wurm — body-object inversion"：普通物件逆转一种解剖可信、保持不动的姿态的功能。'
    - '- "Roy Andersson — deadpan tableau"：平静面孔与正面深焦使最强烈的矛盾显得正常。'
    - '- "Giorgio de Chirico — metaphysical spatial mismatch"：一种普通关系占据否定自身功能的空间。'
    - '- "M. C. Escher — closed circulation"：一种局部可信的静态关系将其源头与终点连接为同一状态。'
    - '- "Remedios Varo — alchemical domestic machinery"：亲密的家庭接触同时被赋予生产与消耗。'
    - '- "Buster Keaton — deadpan body-machine predicament"：熟练保持的接触同时启用和禁用同一功能。'
    - '- "Peter Greenaway — taxonomic baroque order"：一种身体关系被明显划入互斥类别。'
    - '- "Sandy Skoglund — repetition obstruction"：一种重复的材料后果阻断产生它的关系。'
    - '- "Fischli & Weiss — everyday causal chain"：一条完全可见的静态链把互动连接到相反的当前状态。'
    - '- "Jan Švankmajer — tactile object rebellion"：密集的家居材料在接触点交换错误功能。'
    - '- "Eugène Ionesco — proliferating obstruction"：重复的材料证据已占据并取消定义它的关系。'
    - '- "Daniil Kharms — physical non sequitur"：一种直白材料关系毫不解释地连接互不相容的功能。'
    - '- "David Lynch — domestic signal wrongness"：一种熟悉互动向错误接收者发送具体信号。'
    - '- "Yorgos Lanthimos — rule-bound social choreography"：精确身体间隔与保持接触使亲密自我挫败。'
    - '- "Kōbō Abe — identity-container displacement"：一个指定位置与一种实际存在的关系互相拒绝。'
    - '- "Joan Fontcuberta — false evidence"：一份严谨可见记录被产生它的接触证伪。'
    - 各主题的创作者参考机制、互动、非理性条件、静态关系、否定状态、地点功能与关系动态形成多样组合，不重复完整概念。
    - 以视觉上的严肃性拍摄互动。使用克制构图、有动机的照明、可信材料、平静表情和决定性空间关系。非理性法则自然属于该世界，而非显得像奇观、梦境意象或视觉特效。
    - 独特电影视觉支持而不制造矛盾；光源方向、配色、机位高度、镜头表现、景深、空间密度和材料层级形成变化。
    - 不依赖夸张反应、不可能解剖、重复人物、变形、随机巨物、无支撑身体或家具、无关动物、融化建筑、万花筒重复、梦境雾气或视觉混乱。
    - 当前静态场景中，环境、完整稳定阵容、所选级别的互动、非理性条件、普通与相反功能、自我否定的材料或空间状态同时可见，不构成转化步骤或独立机制。
