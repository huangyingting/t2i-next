id: standard-story
authoring:
  themes:
    common:
      - 保留明确指定的国籍；未指定时，每个人物分别默认为中国籍。不得根据地点、姓名、语言、肤色或外貌推断国籍，必须在每个 Theme 的 premise 中明确写出人物国籍。
      - 保留明确指定的国家，或能明确确定所在国家的地点；否则场景国家默认为中国。必须在每个 Theme 的 premise 中明确写出场景所在国家。
  frames:
    common:
      - 保留明确指定的国籍；未指定时，每个人物分别默认为中国籍。不得根据地点、姓名、语言、肤色或外貌推断国籍，必须在每个 Frame 中明确写出人物国籍。
      - 保留明确指定的国家，或能明确确定所在国家的地点；否则场景国家默认为中国。必须在每个 Frame 中明确写出场景所在国家。
