id: lifestyle-story
policy: standard-story
validation:
  frames:
    checks:
    - type: ascii
      when_language: english
    - type: word_count
      when_language: english
      min_words: 180
      max_words: 360
description: 创作精致、多样的生活方式摄影故事，从 Instagram 和小红书的视觉语言中汲取灵感。每个 主题 呈现一个可信的成年人社交时刻，具有吸引人的造型、具体的现实地点、值得分享的活动，以及精心制作的社交信息流图像般亲切的成片质感。这是为想象中的生活方式帖子或轮播图拍摄的照片，而非任一应用程序的真实屏幕截图。绝不呈现应用界面、个人主页、用户名、说明文字框、话题标签、点赞数、评论、轮播圆点、通知、设备边框、平台标志、水印、二维码或虚构的可读文字。严格使用要求数量的成年女性和成年男性。不得添加旁观者、工作人员、人群、倒影中的陌生人、屏幕人物、海报、人体模型、玩偶，或看似额外人物肢体的无主手部。多人时，通过相互注视、共同活动、协调动作、交换物品或自然的身体接近，让他们的关系在视觉上清晰可辨。不得把同伴降格为模糊的背景装饰。当指定人物配置为一位女性和零位男性时，她是整张图像中唯一的人，也是可见动作所暗示的唯一人物。当照片需要解释拍摄方式时，使用伸臂自拍、镜面自拍、定时拍摄、三脚架或固定相机。不得虚构附近的朋友、同伴、摄影师、恋人、助手、倒影中的人物、第二具身体或无主的手。每个人都必须保持清醒、自愿、能作出回应且能够随时停止。排除未成年人、年龄显得过于年轻而含糊不清的情况、胁迫、醉酒或药物影响、受伤、隐蔽拍摄、窥视或非自愿暴露。绝不在
  主题 的标题、情境说明、风格或最终 画面 中写出 "Instagram" 或 "Xiaohongshu"。应把选定方向转化为可见的摄影、造型、活动、光线、色彩和材料语言。在要求的内容级别下，保留同样精致的社交生活方式摄影语言。
authoring:
  content_levels:
    aesthetic:
    - '"- Aesthetic:" 面向公众的成年人生活方式图像，采用完整不透或有品位的性感造型，不含露骨性行为。'
    erotic:
    - '"- Erotic:" 私密的成年人生活方式魅力或闺房图像，包含部分裸露、敞开或透视服装、亲密自我触碰，或相互进行的非露骨接触。不得暗示其适合公开发布。'
    hardcore:
    - '"- Hardcore:" 私密的露骨成年创作者摄影，清晰呈现要求的自愿行为，同时服装、妆容、地点、个人物品、社交摄影取景和精致光线仍须经过有意安排。不得呈现应用界面或宣称获得平台认可。'
  themes:
    common:
    - 为每个 主题 选择一个方向，并让它决定地点、造型、活动、取景、光线、配色和表面质感。
    - '"INSTAGRAM EDITORIAL"（Instagram 编辑风格）'
    - '- 令人向往但可信的生活方式摄影，具有强有力的主视觉图像；- 自信的构图、选择性的景深、丰富的自然色彩以及统一的编辑式调色；- 具有表现力的时尚、旅行、餐饮、建筑、健康生活、美妆或创意工作场景；-
      日落暖光、窗光、黄昏闪光、强烈的城市阳光、画廊般柔和的日光，或克制的夜生活色彩；- 精致的自然感：即使服装、地点和光线经过仔细协调，图像也应像捕捉到真实的一刻；以及 - 具有国际化的视觉表达能力，但不复制真实创作者、广告活动或帖子。'
    - '"XIAOHONGSHU LIFESTYLE"（小红书生活方式）'
    - '- 明亮、干净、看起来实用的生活方式图像，带有亲密的日记气息；- 通透日光、清新肌肤、柔和色彩、清晰材质和易于辨认的日常细节；- 每日穿搭、咖啡馆探访、城市漫步、周末旅行、居家日常、美妆准备、美食发现、购物收获、健身、爱好或工作空间；-
      营造一种让观众觉得自己也可以到访该地点、尝试该造型或重现该活动的亲切感；- 细致关注服装、配饰、妆容、食物、室内环境、包装形状和有触感的物品，但不把图像变成商品目录；以及 - 友善的精致感，不使用幼稚姿势、刻意卖萌、过度美白、塑料皮肤或泛化的美颜滤镜脸。'
    - '"HYBRID SOCIAL EDITORIAL"（混合社交编辑风格）'
    - 融合 Instagram 更强烈的主视觉构图和自信用色，以及小红书明亮的亲密感、实用细节和日常亲和力。成片应具有个人创作感而非企业宣传感，但又比偶然快照更有意图。
    - 为每个 主题 选择或创造一个具体场合。合适的方向包括：
    - '- 早午餐、展览、音乐会、约会、上班或晚间活动前的每日穿搭；- 探索视觉特色鲜明的咖啡馆、面包店、餐厅、茶室、市场摊位或屋顶；- 在拱廊、老街区、水滨、设计街区、花园、书店或建筑地标中城市漫步；-
      周末酒店住宿、乡间度假、海滩清晨、山间小屋、火车旅程、公路停靠点，或具有当地文化特色的旅行；- 居家早晨、烹饪时段、阅读角、插花、聆听唱片的仪式、没有宠物的安静夜晚，或整洁的工作空间；- 作为成年人日常活动展示的护肤、化妆、发型整理、香氛、珠宝、美甲或穿衣准备；-
      陶艺、绘画、摄影、音乐、缝纫、舞蹈练习、园艺、收藏、写日记，或其他在视觉上有动作表现的爱好；- 瑜伽、普拉提、跑步、骑行、网球、游泳、徒步，或运动后平静的一刻；- 品尝一种具体的菜肴或饮品，具有可信的盛器、质地、蒸汽、凝结水珠、碎屑或其他新鲜的物理迹象；或
      - 围绕同一地点和活动组织起来的朋友、情侣或小组时刻。'
    - 避免在未明确指定的豪华房间里泛泛摆拍。地点和活动必须提供具体证据，说明这一刻为何值得分享。
    - 使用真实、连贯的地点，细节足够让人觉得可亲自到访，但不得杂乱到淹没人物。变化使用独立咖啡馆、公寓、酒店客房、街道、花园、画廊、工作室、商店、交通空间、餐厅、海岸线、乡村、文化性室内空间和当代公共建筑。
    - 描述几种具有辨识度的材料和物品：瓷砖、灰泥、木材、不锈钢、亚麻、玻璃、石材、陶瓷、纸张、花卉、食物、包袋、书籍、运动器材、美妆工具或旅行用品。每件物品都应服务于活动、造型、配色或构图。避免随意添加奢侈道具、不可信的产品堆积以及毫无生活气息的展厅式完美。
    - 为每个人设计完整且适合场合的造型。按实际可见情况指明服装单品、廓形、叠穿层次、颜色、材质、鞋履、包袋、珠宝、眼镜、头饰及其他配饰。变化使用休闲剪裁、柔软针织、连衣裙、牛仔、运动服、度假叠穿、晚间造型、街头服饰、复古单品、极简基础款以及适合当地的服装，而不是重复一种网红制服。
    - 为每位女性描述连贯的成年妆容方向，涵盖底妆质感、腮红、眉毛、眼部处理、睫毛和嘴唇。为每位男性描述头发、面部毛发或干净剃须、肤质以及上镜的仪容整理。保留毛孔、细小毛发、衣料压迫、轻微不对称和自然肤色变化。美貌可以精致，但绝不能蜡质化、玩偶化、经过重度滤镜处理或改变解剖结构。
    - 如果产品是这一刻的核心，应保持其为虚构且无品牌的设计，除非 故事描述 明确要求可见文字。描述形状、材质、颜色、尺度、拿取方式及其与活动的关系，而不是编造标志或促销宣称。
    - 让光线源于地点本身：大窗户、开阔阴影、清晨或下午较晚时的直射阳光、阴天、咖啡馆实景灯泡、浴室镜灯、商店照明、日落、路灯，或有品位的直接闪光。说明光线方向及其如何影响皮肤、织物、食物、玻璃、金属和房间。
    - 由服装与环境共同形成一种连贯配色。合适的方向包括奶白中性色搭配一种水果色、暖木色与奶油色、清爽蓝白、鼠尾草绿与石色、樱桃红与炭灰、奶油黄与牛仔蓝、柔和玫瑰色与可可色、海岸青色与沙色，或原创且具有当地依据的配色。保持白色自然、肤色可信。
    - 加入细小的生活痕迹：移位的袖子、被风拂动的头发、玻璃杯上的凝结水珠、半开的托特包、起皱亚麻、移动的窗帘、掠过地板的阳光、糕点旁的碎屑、湿雨伞，或正面朝下的购物小票。只使用支持这一时刻的细节。
    - 不要让每个场景都奢华得不可能、空无一物得完美，或显得刻意摆拍。不得使用毫无缘由的假装抓拍式大笑。表情应回应活动：专注、安静的愉悦、好奇、觉得有趣、交谈、食欲、运动后的平静，或直面镜头、从容自持的摆姿。
    - 每个 主题 须定义：
    - '- 一个以精致编辑风格、明亮生活日记或有意融合的混合风格表达的社交摄影方向，生成字段中不得出现平台名称；- 一个具体场合、地点、活动和值得分享的视觉吸引点；- 严格按要求指定的人物配置，以及稳定的成年人身份和关系；-
      一套完整的服装、配饰、妆容和仪容系统；- 一种拍摄方式、取景类别、光线设计和配色；- 少量承载活动的物品和生活细节；以及 - 与邻近 主题 不同的鲜明特征。'
    - 主题 应通过场合、地点、活动、造型、拍摄方式、配色、情绪和社交视角形成差异，而不只是替换一个道具或背景颜色。
    - '"Instagram" 和 "Xiaohongshu" 这两个词仅用作不可见的艺术指导。不得在图像中呈现或描述它们的界面、商标、标志、说明文字、用户账号、话题标签、互动计数或水印。不得输出标题、标签、项目符号、备选方案、实施注释或合规说明。'
    - 每个人都明确为二十五岁或以上。为每个 主题 设定不同的虚构成年人，具有确切年龄、面部结构、体格、肤色、发型和个人造型。绝不因受外国启发的服装、活动、建筑、食物、姓名或视觉风格而推断另一种国籍。在该
      主题 的所有 画面 中保持每个人的身份。不得点名、模仿或高度近似真实网红、名人、模特、公众人物或私人个体。
    - 指明可信的城市、地区、景观或室内背景。
    - 在不改变人物指定国籍的前提下，让不同 主题 的地区和城市特色有所变化。
  frames:
    common:
    - 每个 画面 都是一张满版照片。除非 故事描述 要求其他格式，否则采用竖向社交摄影。不得创建拼贴、情绪板、接触印样、手机截图、多格页面、广告版式或可见边框。
    - 选择属于这一时刻的拍摄方式：
    - '- 由附近朋友手持拍摄、眼神接触放松的人像，仅当该朋友属于要求的可见人物配置时可用；- 主体进行活动时由同伴拍摄的抓拍，仅当该同伴属于要求的可见人物配置时可用；- 手机距离和透视可信的伸臂自拍；-
      具有一个物理上连贯的倒影且没有额外人物的镜面自拍；- 定时或固定相机拍摄的全身穿搭人像；- 同时呈现人物与目的地的环境人像；- 带有食物、饮品、书籍或创意作品的桌边坐姿人像；- 越肩活动视角；-
      低位或高位斜角时尚视角；- 行走、门口、电梯、楼梯、窗边或过街人像；- 脸部、头发、珠宝、双手或妆容的近距离美妆细节；或 - 干净的桌面或物品细节，仅当要求的人物配置仍在同一张照片的其他位置清晰可见时可用。'
    - 当人物配置为一位女性和零位男性时，只能选择伸臂自拍、镜面自拍、定时拍摄、三脚架或固定相机。绝不把视角称作 "nearby-friend"、"companion-taken"、"photographer-taken"
      或 "observer-shot"，即使是作为比较或已否决的备选方案也不行。
    - 在一批中变化使用全身、四分之三身、腰部以上、近距离人像、环境广景、桌面邻接、镜面以及由运动引导的取景。避免重复居中平视摆姿、同一张咖啡馆桌子、同一种镜面自拍，或同一只手触碰头发。
    - 使用可信的现代手机相机或便携相机光学效果：自然透视、受控的高光过渡、真实的 HDR、适中景深、眼睛或活动物体上的清晰焦点，以及合理的边缘细节。可选的直接闪光可以显得有意且时尚。避免极端鱼眼畸变、虚假的微缩模糊、过度散景、生硬锐化、过曝高光、浑浊阴影，或合成感的电影式青橙调色。
    - 保持每个人的解剖结构普通、相连且易于辨读。每条可见手臂或腿必须从肩膀或髋部，经正确关节连续连接到一只手或脚。绝不生成脱离、来源不明、重复、融合或多余的肢体，也绝不让前景的手、脚、小腿或大腿看起来属于另一具身体。
    - 在每个展示下半身的坐姿、跪姿或斜躺 画面 中，分别描述左腿和右腿，具有相容的髋、膝、踝、脚以及支撑位置；仅用类似 "her legs are parted"（她双腿分开）的整体短语不够。使用简单的不对称，并在重叠肢体之间保留清晰的负空间。不得在同一姿势中同时组合抬膝、交叉双腿、向前景伸出的腿、强烈透视缩短和织物遮挡。毯子、袍子、靠垫、家具、裁切和阴影只有在肢体起点与延续明确无误时才能遮叠肢体；绝不能在展示孤立的下肢或脚时隐藏连接关节。
    - 以身体为主导的 画面 优先采用适中的 35-85mm 透视。避免横跨身体的前景肢体、脚侧极低角度、严重透视缩短、不可能的骨盆旋转、反向关节、无支撑的重量，或从关节、手、脚、决定性接触处裁切。如果姿势或相机角度会使肢体数量含糊，应简化姿势或移动相机，而不是增加装饰性的复杂度。
    - 同一 主题 中的多个 画面 构成视觉连贯的社交轮播图，但它们是并列的成片备选，而不是按时间顺序排列的步骤。每个 画面 都必须独立重述完整人物配置、身份、造型、地点、活动、相机方式、光线以及渲染所需的所有可见内容。绝不引用其他
      画面、前一张图像或之前发生的事。
    - 返回每个 画面 前，若任一可见肢体无法追溯到其所属身体、肢体数量含糊、单人拍摄暗示另一个人，或相机方式自相矛盾，应默默剔除并重写。对于每一种坐姿、跪姿或斜躺的下半身姿势，核实分别描述左腿和右腿后，能确立恰好两条相连的腿以及两条相容的支撑路径。要求英语时，画面
      必须包含字面短语 "left leg" 和 "right leg" 以供此项核验；仅提及脚、膝盖、大腿或笼统的双腿均不满足要求。
    - 在保留 主题 的人物、关系、场合、服装系统、地点、配色和时间范围的同时，变化取景、手势、视线、身体朝向、活动细节、前景层次和焦点层级。
    - 把每个最终 画面 写成一段使用所要求语言的流畅自然语言，可直接用作文生图提示词。以可见人物、活动和地点开头，而非标题、平台名称或规则说明。按自然的视觉顺序融入造型、表情、姿势、物品、构图、拍摄方式、光线、色彩和材质细节。每个英语
      画面 以 220-300 个单词为目标，并保持在 180 至 360 个单词之间，360 为绝对硬上限；若要求其他语言，则使用等量细节。返回英语 画面 前，统计单词数，若总数超出硬性范围则重写。
    - 要求英语时，只使用纯英语 ASCII 文字。返回前改写畸形字符、替代字形、非英语文字和翻译残片，包括描述中文姓名和场景时。
    - 每个 画面 都必须自然地指明每位成年人的指定国籍。
    content_levels:
      hardcore:
      - 当人物配置为一位女性和零位男性时，展示已经进行中的独自自慰：她自己的手或一个清晰可见、对身体安全的玩具直接刺激她的外生殖器，或一个对身体安全的玩具明显处于插入状态，同时保持物理支撑和解剖上的连贯。让主动接触部位与她的成年面容都保持可见。不得添加伴侣、协助的手、嘴、倒影中的人物或暗示的画外参与者。对于任何其他指定人物配置，严格描绘该配置，绝不为强化行为而增加参与者。
      - 每个 露骨级 画面 都必须直接指明正在动作的手或玩具、被接触的生殖结构，例如阴蒂、外阴、阴道口、阴茎或肛门，以及当前的接触或插入。仅有湿润的手指、性唤起、分开的双腿、阴毛、夹在大腿之间的物体或委婉描述的动作是不够的。
