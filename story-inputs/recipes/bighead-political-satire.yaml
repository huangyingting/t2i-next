id: bighead-political-satire
description: 创作以大头人物为主导的原创讽刺图像，人物身体与符合所选内容级别的定格动作共同构成笑料。图像在缩略图尺寸下有趣，细看更加尖锐。政治只是题材之一，家庭生活、工作、金钱、学校、医疗、媒体、食物、时尚、友谊、婚姻和日常摩擦形成多样主题，不重复同一套部委仪式。
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 表情候选池——仅限社会和公共生活：恼怒、假装欢快、自鸣得意的履责、惊慌、无聊、戏剧化怜悯。不得有暗示性、卧室式神态或高潮表情。
      - 用完全不透明的服装和非性动作表现笑料：搬运、盖章、烹饪、阻挡、鼓掌、计数、等待、服务、购物、持印或拒绝移动。通过剪裁、填充和拉扯显露身体组合，绝不通过裸体或性接触。
    erotic:
      shared:
      - 不得使用仅适合公共生活的表情。
      - 表情候选池——暗示性，而非高潮。按当下需要选择，例如：舔上唇或唇峰；牙齿咬住下唇；舌尖藏在齿后；朝喉部吐息；一根手指放在自己嘴角；从一侧下垂眼睑上方看人；望向嘴或喉部后迅速移开；知道自己被注视的假笑；强咽一下；屏息；眼下轻颤。将挑逗与被撞破搭配，或将渴望与假装不在乎搭配。不得要求每张脸都舔唇。不得使用翻白眼、高潮时垂舌或千篇一律张嘴发情。舌头接触自己的嘴唇是表情，不是口交，也不接触他人的胸部、乳头或生殖器。
      - 任何剩余服装仍须属于该国籍。不得默认普通西式西装、相同黑色制服或与所述国籍矛盾的服装。
      - 以明确属于成年人的非露骨感官展示和接触表现笑料。社会事实必须从谁暴露、谁观看、谁被观看、谁靠近、谁克制触碰以及谁承担姿势所需努力中可见。每位请求的成年人都在这一感官回路内。不得只是给普通公共或家务任务敞开一件衣服。在盖章、做饭或等待的场景中略露皮肤不符合此级别，露骨性行为同样不符合。
      - 不得看见阴茎、睾丸、外阴、肛门或精液。嘴不得接触乳房、乳头或生殖器。手可以支撑胸部，但不得将嘴放在胸部上。不得描述脸上或乳房上滴落液体。扩音器形的张嘴是表情，不是口交。不得出现多余生殖器或阴茎状乳头。
    hardcore:
      shared:
      - 表情候选池——由当前行为引起的高潮、临近高潮、用力、控制或余震。按当下需要选择，例如：咬紧牙关与湿润睫毛；无声的方形嘴；压在喉中的断续呻吟；用力造成的张嘴啜泣呼喊；带笑的苦相；一只眼翻转、一只眼专注；未能持续咬住的上唇；眉头紧压而嘴张开；下颌松弛的余震。一位成年人可以失控，而另一位保持专注或得意。不要给每个头部复制相同的高潮失神表情。不得使用孩童般高潮面孔。精液不是表情。
      - '- 仅已有的外生殖器：男性的阴茎和睾丸、女性的外阴'
      - 同样须写明生殖器尺度；不得将生殖器保留为未描述的默认状态。混合选择，使同一主题中没有两个人共用同一套方案。有效反差包括线状细腿上的教堂般巨大头部、几乎无腰之上的鼓胀胸部、木桩般手臂末端的硬币小手、占据唯一椅子的巨大臀部，或拒绝离开阳台的柱状双脚。
      - 任何剩余服装仍须属于该国籍。不得默认普通西式西装、相同黑色制服或与所述国籍矛盾的服装。
      - 将笑料表现为一个清晰可见、已经发生的自愿成年性行为。写明当前行为及身体精确的接合方式，让观众能定位每个骨盆、嘴、手和支撑。位置、重量以及谁承担劳动就是讽刺隐喻。每位请求的成年人都参与。不得只写“接纳他”“站立姿势”或“行为发生”而没有接触几何关系。若主要衣物遮住行为，不得仍全部穿好。
      - 将已有生殖器作为身体组合的一部分加以夸张。阴茎可以巨大、微小、极长、短粗、粗壮或细瘦；睾丸和外阴也可同样放大、缩小或重塑。尺度必须承担笑料作用：权威者教堂般巨大的头部之下是一根微小阴茎；巨大器官依然不承担劳动；膨大的外阴充当唯一座位。仅使用成年人本来拥有的解剖部位：男性一根阴茎，不得从女性胸部、乳头或背部长出。不得将生殖器、性别或偏好视为天生低劣。
      themes:
      - 每位人物的外生殖器尺度与完整身体组合一致，参与视觉比例反差。
      frames:
      - 按视觉顺序描述每位成年人时，在完整身体组合中包含生殖器尺度。
  themes:
    common:
    - 每个人都是头部硕大的成年人。头部锁定后，身体其余部分可自由组合：躯干、胸部、腰部、臀部、手臂、手、腿和脚均可分别为大、小、长、短、粗壮或细瘦。身体本身就是论点。服装、家具和象征物只补全身体已经坦白的内容。
    - 人物为中国人、日本人或韩国人，穿对应国籍服装。官署、家庭、工作、欲望、地位、照料、功劳、时尚和言行落差构成行为讽刺。
    - 每位可见成年人的头部都是其身体中最大的体块，头部所占身体比例约为正常头部占比的两到三倍。头部是一张讽刺面具：醒目、易读，但仍是真实的成年面孔，有两只眼睛、一个鼻子、一张嘴和两只耳朵。五官可以肿胀、挤紧或歪斜，但必须保持连接在同一个头部上。
    - 为每个巨大头部选择适合这一瞬间的具体表情，不要使用默认面具。下列清单为候选池。选择最适合人物、作用力和内容级别的组合。不要按顺序轮用候选池，也不要让两个人使用同一组合。
    - 五官候选池——按需混合各类：
    - '- 眼睛：一只瞪出、一只眯成缝；双眼圆睁凝视；双眼缩成短横线；沉重下垂的眼睑；看不见虹膜；或严厉的侧目'
    - '- 眉毛：一边弯钩、一边飞扬；连成一条横杠；内侧眉峰纠结；或眉毛上挑至发际线'
    - '- 嘴：菱形呐喊、下钩状苦相、咬紧般的小 O 形、只露上齿的矩形苦相、露出一颗犬齿的歪嘴假笑、向内吸的嘴唇、舔上唇的舌头、碰触犬齿的舌头、被牙齿咬住的下唇，或微张嘴缓慢吐息'
    - '- 面颊和下颌：一侧脸颊鼓起、另一侧凹陷；下颌错移；下巴缩进颈部；或宽到挤向耳朵的下颌'
    - '- 鼻子和耳朵：挤紧的鼻梁、被推向一侧的圆鼻头、仅一侧鼻孔张开，或因承担倾听而更大的一只耳朵'
    - '- 当下用力的表面迹象：一道泪痕、一颗汗珠、一根太阳穴青筋或唇边唾液——绝非精液'
    - 写明情绪和实际采用的五官特征。相邻成年人必须不同。不同主题间不得重复上一主题的眼睛与嘴部组合。温和微笑、沉着平静、空洞礼貌或所有人同一张脸都不够。一个头部必须恰有两只眼睛、一个鼻子、一张嘴和两只耳朵。
    - 候选池的选择须匹配内容级别。不得越级；不要把候选池的全部特征堆在每张脸上。
    - 巨大头部必须完整可见。头发、帽子、勋章和麦克风可装饰头部，但不得取代头部或遮住承载笑料的面孔。
    - 头部确定后，自由组合每个人身体的其余部分。对每位成年人，独立选择下列各区域的尺度和粗细：
    - '- 躯干'
    - '- 胸部'
    - '- 腰部'
    - '- 臀部和髋部'
    - '- 手臂'
    - '- 手'
    - '- 腿'
    - '- 脚'
    - 每个区域可以巨大、微小、极长、短粗、粗壮或细瘦。为每位成年人逐一写明所有区域；不得用笼统的躯干暗示胸部、腰部、臀部、手或脚。
    - 身体组合可以违背普通比例，但不得违背人体拓扑。每位成年人保留恰好一个头部、一段连续躯干、两条手臂、两只手、两条腿和两只脚。关节保持连接，并向清晰可辨的方向弯曲。不得有多余肢体、缺失肢体、脱离部位、第二个骨盆、融合人物或断裂关节。不得从胸部、乳头、腹部或背部长出阴茎、多余乳房或多余生殖器。乳头仍是乳头；膨大的胸部仍是胸部。双脚保持可见。衣服、绶带和盔甲顺应身体体积，而非矫正它们。
    - 让每个所选体积承担笑料的作用。微小的手拿不住印章、刀，或声称是劳动的儿童规模小任务。细瘦手臂举不起其声称承载的人或盘子。膨大的胸部可遮住背后正在完成的工作。针状细腿若无讲台、桌子、同伴或象征物就站不住。巨大臀部可占据家中、工作场所或官署里唯一的椅子。
    - 严格保留指定女性与男性数量，人物具有稳定姓名、中国、日本或韩国国籍、硕大头部、成熟面容、夸张表情、国籍特征服装和独特身体组合，贯穿同一主题。多人混合这些国籍，服装不同。角色可为文书、部长、守卫、捐赠者、主播、助理、选民、仪式主持人、配偶、伴侣、主人、客人、店主、表演者、同事、官员、秘书、医生或病人。身体与足形完整，不采用缠足、婴儿化脸或奶瓶、安抚奶嘴、婴儿床等道具。
    - 服装必须能辨识为对应国籍的服饰，并按身体组合和情境剪裁：中山装、旗袍、刺绣长袍或立领上衣；和服、纹付、袴或工作法被；韩服、周衣或现代韩国剪裁。家庭或商业讽刺允许中日韩日常服装；礼服用于官方或仪式性笑料。
    - 请求的某性别数量为零时，不得虚构该性别人物。不得添加儿童、人群、额外围观者、人形雕像或背景市民。若笑料需要“公众”，用物品表现：空鞋、一面麦克风墙、一叠相同帽子、空椅子、纸浪或一只巨大耳朵。
    - 地点具有虚构寓言场景的面貌，人物为中国人、日本人或韩国人。
    - 每个主题都由一个可见等式构成：
    - 一项公开主张 + 一个私人动机 + 已经说出真相的身体 + 一个以请求内容级别落实主张的动作 + 一件象征物 = 一个观众看得见的社会事实
    - 选择一个领域。允许政治题材，且应偶尔出现，但它不是默认选项。轮换采用：
    - '- 政治和官僚仪式'
    - '- 婚姻、家庭和家务劳动'
    - '- 职场功劳和等级'
    - '- 金钱、购物和地位展示'
    - '- 学校、考试和资历'
    - '- 医疗、照料和等待'
    - '- 食物、待客和食欲'
    - '- 媒体、名气和观看'
    - '- 友谊、竞争和琐碎的日常摩擦'
    - 讽刺须通过行动表现，而非靠说明文字。
    - 不要先构思穿衣场景再脱掉衣服。移除体现内容级别的动作后，笑料必须瓦解。
    - 遮住文字后，笑料仍须成立。构思新鲜情境，不要仅换帽子就重复一场发布会、一场厨房争吵或一个购物笑料。可用的张力包括仪式与劳动、发声与沉默伙伴、印章与其宣称之事、索取照料与拒绝照料、功劳远离实际劳动、无人进食的盛宴、取代人物的镜子，以及永不前进的队伍。
    - 所有人都参与同一动作，不设旁观者。各主题的机械性笑料不同，不让身体作桌、身体作椅或喂食主导整组概念。
    - 每位成年人都必须与象征物或同一动作中的另一位成年人直接接触并承力。举手祝福、指点或对着空中都不算。写明每只手、每只脚和每个支撑表面的接合位置。
    - 不可能的比例仍需可能的平衡。追踪每个身体的重量如何经髋部、腿、手、家具或自愿伙伴传到地板。若有人站、坐、跪、拱身或举起，须表现反作用力。除非两处接触表面和重量路径都明显，否则不得将站立者堆叠在秤、椅子或桌子上的身体之上。不得隐藏一只脚，也不得让肢体无所承担。
    - 每个主题设在一处符合所选领域并可容纳请求内容级别动作的虚构空间：部委会议室、广场、厨房、用餐角落、商店柜台、教室、诊所、更衣区、直播角落或私人房间。地点保持稀疏：几面墙、一块地板，以及动作所需物品。不得塞入额外家具或房间之外的城市。地点必须服务动作；不得将情色或性行为直接塞进未经改变的公共仪式。
    - 为笑料设置一件与身体同台的象征物：印章、讲台、账本、蛋糕、电话、秤、文凭、购物袋、奖杯、遥控器、椅子，或由该笑料产生的其他物品。象征物可支撑身体、承受作用力，或成为所有人假装没注意到的东西。同一情境至多保留一件小型辅助物品。
    - 若画面有任何文字，每个可见字符都必须为英文：仅用大写 ASCII 字母 A 到 Z、空格和简单标点。在象征物或动作中已穿戴的绶带上锁定一个由一到三个大写单词组成的简短英文标签。不得出现汉字、日文假名或汉字、韩文、拼音、双语文字、数字、标志或乱码。将标签绘、印、缝或刻在物品上。不得添加悬浮说明、对话气泡、字幕、报纸栏或额外标语牌。若未锁定标签，则图像不得有文字。
    - 人物、身体、衣服、物品、房间和实际光源共同构成画面。不同级别的动作承载不同讽刺；官署、诊所和等级呈现为寓言扮装。
    - 每个主题拥有一组完成设计的人物和一个讽刺笑料。制作任何画面之前，锁定：
    - '- 请求的确切成年人、姓名、国籍和角色'
    - '- 每个硕大头部、夸张表情、带国籍特征的服装和完整身体组合'
    - '- 领域和虚构地点'
    - '- 表现笑料的对应内容级别动作'
    - '- 象征物'
    - '- 社会事实'
    - '- 可选英文标签，或无文字的决定'
    - 国籍、角色、巨大头部、表情特征、服装和完整身体组合保持鲜明与稳定；虚构地点、当前动作、象征物及可见社会事实共同组成一个笑料，房间表面与实体光源协调。
