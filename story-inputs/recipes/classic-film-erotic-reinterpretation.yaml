id: classic-film-erotic-reinterpretation
policy: standard-story
description: 创作一批具有经典电影名场面感染力的原创成人情色电影剧照。每个 Theme 从一种广为人知的经典电影场面原型出发，提取它的戏剧机制、人物距离、空间压力、视觉节奏和情绪转折，再将其转译为全新的成年人物、地点、时代、关系和当前事件。结果必须像从一部制作完整、从未存在过的院线长片中截取的决定性静帧，而不是对现成影片的复刻、戏仿截图、海报、分镜板或摄影棚模仿秀。
authoring:
  themes:
    common:
    - 经典性来自电影语法，不来自受保护元素。不得使用真实电影片名、真实演员肖像、受版权保护角色、原片对白、独特服装、标志性道具或可逐镜对应的构图；不得声称“某电影风格”或“重拍某场面”。可以转译雨中重逢、舞池试探、列车告别、镜前整理、密室对峙、宴会越界、后台换装、旅馆相认、危险营救后的拥抱、车内沉默、楼梯擦肩、窗边坦白等开放式场面原型，但必须重新发明全部具体事实。
    - 每个 Theme 必须建立一个彼此不同的原创电影世界，包括明确的年代、位于中国的具体地点、社会环境、完整的请求人物阵容、人物关系、一个正在发生的可见事件、一个改变关系平衡的决定性瞬间，以及一套可由场景设计、服装、表演、构图、光源和成片处理共同证明的电影视觉命题。
    - 使用请求指定的准确人物数量，不得增加群众、摄影师、服务人员、镜中人物或画外身体部位。每个人都必须是外观明确二十五岁以上、清醒、自愿、能够停止并对互动主动回应的中国成年人。为每名人物建立稳定的年龄、面孔、体型、发型、服装、配饰和身份锚点，并在同一 Theme 的所有 Frame 中保持一致。
    - 每个 Theme 选择一种经典场面原型，但必须把原型转化为原创冲突和独特的情色关系动力，例如克制转为主动、公开身份与私人欲望冲突、礼仪被双方自愿打破、竞争转为亲密协作、久别后的身体确认、角色权力暂时倒置，或一个日常动作获得明确的成人感官含义。不得只更换年代、职业、房间、服装或调色来伪装相同故事。
    - 为每个 Theme 创建一个简洁原创标题、一个完整而具体的 premise，以及一个原创电影风格名称。style 必须通过可见的空间几何、色彩关系、主要光源、镜头距离、材质和人物调度定义该风格，不得使用现成电影、导演、演员或泛泛的“电影感”作为风格名称。
    - 跨 Theme 轮换场面原型、时代、地点功能、社会关系、情绪动力、人物调度、服装轮廓、构图系统、镜头语言、主要光源、色彩结构和成片媒介。不得让整批结果被黑暗旅馆、雨夜、床铺、红蓝霓虹、黑色内衣、背光剪影或同一种支配关系垄断。
    - 静默拒绝并重写以下结果：能够辨认出具体电影或演员；仅靠服装、道具或调色区别 Theme；把情色内容延迟到画外；将多个 Frame 写成前后连续动作；增加请求之外的人物或身体部位；出现胁迫、恐惧、昏迷、醉酒失去判断能力或无法退出的互动；人物结构、支撑、接触轴线、镜像或服装状态互相矛盾；成片像海报、广告、剧本、分镜表、幕后照或低成本成人视频截图。
  frames:
    common:
    - 经典性来自电影语法，不来自受保护元素。不得使用真实电影片名、真实演员肖像、受版权保护角色、原片对白、独特服装、标志性道具或可逐镜对应的构图；不得声称“某电影风格”或“重拍某场面”。可以转译雨中重逢、舞池试探、列车告别、镜前整理、密室对峙、宴会越界、后台换装、旅馆相认、危险营救后的拥抱、车内沉默、楼梯擦肩、窗边坦白等开放式场面原型，但必须重新发明全部具体事实。
    - 同一 Theme 的多个 Frame 是同一宽泛前提下彼此独立的平行静帧，不是连续剧情、动作前后步骤或故事板。人物身份、地点功能、服装逻辑和视觉 DNA 保持稳定，但每个 Frame 必须重新完整说明当前可见事实，并在决定性动作、人物调度、取景距离、观察方向、前景关系、光线几何或材质重点上形成明显不同的方案。
    - 每个 Frame 只呈现一个物理成立的当前瞬间。先自然建立 Theme 的原创电影风格、年代、具体地点和当前事件，再完整描写所有可见人物的成熟外貌、服装状态、姿态、视线、表情与主动回应；随后融入最重要的身体接触、接触造成的直接可见结果、环境层次、镜头位置、焦距倾向、景深、主要光源和成片质感。所有句子都必须能转化为可见或可摄影控制的信息，不解释象征意义，不讲述画外历史，不评价观众应有的感受。
    - 每位人物只能出现一个连贯身体实例。所有肢体必须能从肩或髋追踪到末端，每只可见的手、脚、嘴和承重肢体只承担一个相容任务；接触必须处于自然可达范围，身体重量必须由可信的地面、墙面、床、座椅或其他固定结构承担。镜面、玻璃和阴影不得生成额外人物或矛盾身体状态。
    - 让每个 Frame 具有院线长片规模：使用有功能的建筑层次、经过选择的陈设、可信年代材料、明确的前景—动作层—背景关系、受控遮挡、动机明确的实景光源和塑造人物关系的调度。近景也必须暗示画外存在完整世界。
    - 相机必须服务人物关系和情色动作的可读性。可使用克制广角、标准镜头、肖像距离或横向变形镜头语言，但避免鱼眼、偷拍视角、监控画面、任意荷兰角、严重透视畸变、切断关节的裁切或让关键接触被服装和道具完全遮挡。保留真实皮肤毛孔、细毛、汗意、压力痕迹、织物褶皱和材质反应，避免塑料皮肤、廉价色情截图、过度柔焦和无动机的综合色污染。
    - 静默拒绝并重写以下结果：能够辨认出具体电影或演员；仅靠服装、道具或调色区别 Theme；把情色内容延迟到画外；将多个 Frame 写成前后连续动作；增加请求之外的人物或身体部位；出现胁迫、恐惧、昏迷、醉酒失去判断能力或无法退出的互动；人物结构、支撑、接触轴线、镜像或服装状态互相矛盾；成片像海报、广告、剧本、分镜表、幕后照或低成本成人视频截图。
    - 每个最终 Frame 必须是一个无换行、无字段标签、可独立渲染的自然语言段落。不得包含标题、编号、电影片名、演员名、导演名、版权角色、原片对白、Logo、字幕、水印、画内说明文字、备选方案、创作解释或实现指令。中文 Frame 目标长度为 450 至 600 个汉字，不得超过 700 个汉字；返回前删去重复锚点、背景故事、抽象评价和次要装饰。
