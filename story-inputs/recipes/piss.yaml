id: piss
description: '创作超写实、直接、带轻微荒诞感的东亚成年人中国蹲式厕所地面仰拍摄影，场景为明亮、整洁但普通的中国公共卫生间。拍摄设备位于画框之外，不出现在镜子、金属、瓷砖或积水反射中。多人画面中，每人有独立身体、独立手机或明确空手姿势、独立地面槽位和清楚可见的脸。只有一人执行主要体液动作；其余人物稳定反光板或以相邻深蹲回应，不控制拍摄设备，不形成第二喷流或无关性行为。'
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 人物保持完整不透明衣着，以双腿适度分开且膝脚垂直对齐的低位蹲姿、中国式蹲便器地面仰拍和自然比例制造大胆时尚感。可整理鞋带、扶膝、按冲水按钮或抽取厕纸。生殖器、阴毛和体液不可见；蹲便器便池保持干燥。
    erotic:
      shared:
      - 骨盆可裸露并保留自然阴毛。阴毛可自然生长、局部修剪成几何边界、短辫、染色或湿润聚束，但必须属于真实皮肤表面，不得变成织物、触手或额外肢体。短裤、裙摆或内衣停留在明确位置，不得复制成额外骨盆或遮断腹部到大腿的解剖连接。
      - 所有裤子、短裤、内裤和裙子都必须已经完全离开腰部、臀部和骨盆，统一褪到膝盖以下、小腿或脚踝处并清楚可见；这些下装保持静止并与双手分离，不得被手提回膝盖或大腿。不得仍穿在腰臀上，不得只解开、掀起或停留在大腿中段。允许低头撩起上衣、展示臀部、整理阴毛，以及明确挑逗性的低位蹲姿。最多显示一个自然成人外部生殖区域，但不出现排尿、喷射、插入或露骨自慰。
      - 所有下装与内裤仍必须全部褪到膝盖以下、小腿或脚踝，且与皮肤和鞋履清楚分离。
      frames:
      - 下装全部静止于膝盖以下、小腿或脚踝，与双手分离；不呈现喷射、排尿、插入或多重露骨动作。
    hardcore:
      shared:
      - 骨盆可裸露并保留自然阴毛。阴毛可自然生长、局部修剪成几何边界、短辫、染色或湿润聚束，但必须属于真实皮肤表面，不得变成织物、触手或额外肢体。短裤、裙摆或内衣停留在明确位置，不得复制成额外骨盆或遮断腹部到大腿的解剖连接。
      - 所有裤子、短裤、内裤和裙子都必须已经完全离开腰部、臀部和骨盆，统一褪到膝盖以下、小腿或脚踝处并清楚可见；这些下装保持静止并与双手分离，不得被手提回膝盖或大腿。不得仍穿在腰臀上，不得只解开、掀起或停留在大腿中段。允许自然成人外阴、阴茎或肛门清楚可见，并从以下动作中只选一个：正在发生的排尿或其他单一体液喷射；用厕纸擦拭外部肛门或外阴；一只手分开外部褶皱，另一只手扶膝；或用一至两根清楚归属同一只手的手指进行可见外部自慰。手指动作必须发生在唯一接触区域，另一只手只承担扶膝、撩衣或稳定身体之一，不得同时叠加排尿、擦拭和自慰。
      - 所有下装与内裤仍必须全部褪到膝盖以下、小腿或脚踝，且与皮肤和鞋履清楚分离。
      frames:
      - 下装全部静止于膝盖以下、小腿或脚踝，与双手分离，保留皮肤、衣料和鞋履的清楚边界。
      - 液体必须从一个解剖正确的可见来源形成连续喷流，受重力影响落入正下方中国式蹲便器的中央陶瓷便池和排污口，产生真实飞溅、积液和湿痕。不得让液体落在脚踏区或从皮肤、衣物和空气中无来源出现，不得让喷流逆重力折返，也不得遮住人物骨盆、双腿或完整身体链。
  themes:
    common:
    - 每个 主题 选择一个不同的中国卫生间空间：机场、酒店、夜店、电影院、办公楼、购物中心、体育馆、温泉更衣区、后台化妆间、画廊或复古车站。空间保持真实可用，核心设施始终是人物脚下的中国式蹲便器，并包含少量明确参照，如隔间板、冲水阀、洗手台、镜面边缘、墙砖、地砖、吊顶网格和圆形筒灯。蹲便器可轮换白色或米色陶瓷、椭圆或长椭圆便池、前挡水罩、后置冲水口和不同防滑脚踏纹，但不得替换成西式坐便器、独立地漏或长排水沟。不得堆砌杂物或添加其他人物。
    - 主题 简短锁定： 1. 精确人物数量、性别与成年人身份。 2. 卫生间类型、中国式蹲便器的陶瓷颜色、便池形状、左右脚踏纹与空间主色。 3. 每个人固定的骨盆居中、双腿紧凑近并、膝盖朝前且膝脚垂直对齐的低位蹲姿、髋部前倾程度、季节、场合、服装类别与配色、鞋、发型、妆容、表情及一至三件配饰。
      4. 当前唯一主要互动、双手分工，以及人物看向自己的动作、地面视点或可选手机的眼神。 5. 内容等级 对应的遮挡、裸露和体液状态。 6. 画面视点位于中国式蹲便器对应方位的外缘地面高度，并从正面、左侧、右侧、背面或三分之四方向中明确选择一个；拍摄设备本体完全在画框外。
    - 人物外貌必须是清楚的成年人，可为年轻成年、中年或老年；体型可为肥胖厚重、柔软丰满、精瘦、宽壮或肌肉型。保留真实皮肤纹理、毛孔、膝部色差、皱纹、腹部褶皱、妊娠纹、橘皮组织、静脉、痣、疤痕和自然不对称。不得默认所有身体年轻、纤瘦、对称和无瑕。
    - 每人外观年龄具体且在同一主题内稳定，年轻、中年与老年形象都有变化，不集中于 25–39 岁。50 岁以上人物保留相应面部细纹、皮肤松弛、手部纹理、体型变化、灰白发丝或自然染发痕迹，姿势与身体活动能力相符。
    - 每个 主题 必须选择一套不同且协调的完整人物造型，并锁定到全部 画面。季节至少轮换盛夏、春秋和寒冬：夏季可用吊带、背心、短袖衬衫、轻薄连衣裙或亚麻上衣；春秋可用针织开衫、衬衫、薄夹克或风衣；冬季可用高领毛衣、厚针织衫、羊毛外套、羽绒服或围巾。场合至少轮换都市日常、办公室通勤、正式晚宴、夜店派对、旅行机场、酒店休闲、运动休闲、温泉更衣、后台演出和复古约会。所有造型仍须符合卫生间室内场景；外套可以敞开或留在上身。
    - 发型变化包括精灵短发、齐耳短发、直长发、自然卷、波浪卷、高低马尾、高低发髻、侧辫、双辫、盘发、湿发和灰白发丝，长度、分缝和扎法各有差异。妆容可为素颜、透明自然妆、办公室柔和妆、复古红唇、烟熏眼妆、彩色眼线、珠光派对妆或成熟低饱和妆。表情可专注、从容、自信、调皮、轻笑、惊喜、害羞但主动、挑逗、严肃或疲惫后放松，眉眼聚焦、嘴角与呼吸自然。
    - 鞋履至少轮换平底凉鞋、细带高跟凉鞋、经典尖头高跟鞋、粗跟鞋、坡跟鞋、乐福鞋、芭蕾平底鞋、运动鞋、帆布鞋、踝靴、长靴和季节性保暖靴，并轮换皮革、漆皮、麂皮、帆布、透明材质和金属饰面。鞋必须成对一致、完整可见、真实承重并与褪下的衣物分离，衣物不得融合或覆盖鞋型关键结构。配饰每人选择一至三件，轮换细框或粗框眼镜、耳钉、垂坠耳环、项链、手链、腕表、戒指、发夹、发带、围巾和腰链，不得堆满全身。手机仅是可选道具，出现时最多一部；不得出现自拍杆、手袋或无关道具。
    - 批量 主题 轮换卫生间年代、墙砖颜色、中国式蹲便器的陶瓷颜色、便池形状、脚踏纹、主要互动、视角方向、季节、场合、服装类别、主辅配色、材质、鞋型、发型、妆容、表情、配饰组合、可选手机、年龄和体型。整批必须均衡覆盖
      正面视角、左侧视角、右侧视角、背面视角、前侧四分之三视角 和 后侧四分之三视角；至少覆盖蹲便器前缘、左侧缘、右侧缘、后缘及前后侧三分之四地面仰拍。相邻 主题 不得重复相同视角方向、季节、场合、服装类别、主色、鞋型、发型、妆容或表情；整批不得反复回到正面视角，也不得反复回到黑色短上衣、牛仔短裤和金属高跟凉鞋这一默认组合。
    - 服装颜色不得默认黑色或连续重复单色。轮换象牙白、奶油色、驼色、焦糖色、酒红色、砖红色、珊瑚色、橙色、芥末黄、橄榄绿、祖母绿、青绿色、天蓝色、海军蓝、薰衣草紫、梅子紫、粉色、银色、金色及多色印花；每个
      主题 写清主色、辅色和材质。下装可为西装裤、牛仔裤、短裤、铅笔裙、百褶裙、开衩裙、连衣裙下半部、运动裤或保暖打底裤。
  frames:
    common:
    - 同一 主题 的全部 画面 固定人物身份、体型、年龄特征、服装、鞋、发型、配饰、卫生间、中国式蹲便器和当前动作。不同 画面 只改变地面视点的横向位置、方位、俯仰、滚转和人物看向手机或视点的瞬间，不写成前后发展的故事。
    - 每幅画面独立呈现精确东亚成年阵容，不在镜子、隔间缝隙或背景中增加脸、身体、手脚或摄影者。
    - 地面视点在中国陶瓷蹲便器对应外缘、低于鞋底高度，以 35 毫米直线透视仰拍。成人比例和缩短可信，头部小于肩宽及躯干，视点设备不入画或形成阴影、反射。
    - 蹲便器直接嵌在人物脚下，中央椭圆便池、排污口、后置冲水槽和左右防滑踏板可见，完整匹配的双鞋分别落在踏板，液体只落入便池。
    - 每人骨盆居中于双脚中点上方，双大腿独立且紧凑，几乎平行下降至朝前双膝。膝内缘和鞋内缘空隙等宽且不宽于一只前掌；髌骨对准对应第二脚趾，小腿为相近的垂直平行柱，双鞋纵轴与蹲便器纵轴平行，脚尖与脚跟间距相等，髋至踝保持中立旋转。
    - 臀部低位、躯干从髋部折至近乎平行地面，肩在膝前，头颈自然延续脊柱且不伸向视点。每人稳定保留年龄、体型、发型、妆容、上装、对应级别的下装位置、配饰、配对鞋履与蹲便器设计；只变化地面视点、目光、细微表情与单一手部互动。
    - 方位选择蹲便器前缘正面、左侧缘、右侧缘、后缘背面、前侧四分之三或后侧四分之三之一，保留指定方位，不在同一画面混合多个方向。
    - 构图必须同时显示： - 左右脚或鞋分别完整踩在中国式蹲便器左右防滑脚踏区，双侧髌骨均对准对应鞋的第二脚趾；两只鞋的纵向中心线朝正前方，彼此平行并与蹲便器前后长轴平行，脚尖间距与脚跟间距完全相同。鞋底不得悬空或踏入中央便池；双膝内缘与双鞋内缘之间的空隙等宽，并且不超过一只鞋前掌的宽度。
      - 两条腿从脚踝、膝盖、大腿连续连接至同一个骨盆。 - 骨盆、腹部、胸部、肩膀、双臂、双手、颈部与脸属于同一连续且从髋部前倾的身体。 - 双手均清楚可见并各有一个固定任务；手机不是必需品，出现时最多一部，手指数量及手机屏幕、背面方向合理。
      - 正面视角显示完整脸、眼睛和表情；侧面视角显示清楚的自然侧脸；背面视角以背部、臀部和后脑为主，只允许自然回头露出部分脸部轮廓，不得为了露脸扭曲颈部。手、衣物、厕纸或可选手机不得遮住该视角应有的面部信息。
      - 中国式蹲便器的中央椭圆陶瓷便池、冲水沟槽和排污口位于画面下方，并与任何液体轨迹准确对齐。
    - 姿势必须是稳定的骨盆居中、双腿紧凑、趋于并拢但不互相接触的低位蹲姿加极强髋部前倾。骨盆中心位于双脚中点正上方；左右髋关节和大腿保持解剖独立，但两条大腿从髋部向下几乎平行，仅轻微向内收至朝正前方的双膝。双膝内缘之间与双鞋内缘之间保留同一条狭窄空隙，该空隙不宽于一只鞋的前掌，并从大腿内侧经过膝间、小腿间连续向下，不得在膝部突然向左右张开。每侧髌骨中心必须位于对应鞋第二脚趾正上方；两只鞋的纵向中心线笔直朝前、彼此平行并平行于蹲便器长轴，脚尖间距等于脚跟间距，髋关节、膝关节和踝关节保持中立旋转。正面或背面投影中，两条小腿形成彼此靠近的垂直平行柱及窄直缝，侧面投影中可前后重叠但关节关系不能改变。使用这些正向轮廓防止宽
      V 形、菱形、蛙式蹲、M 字腿或内八字。臀部下降，骨盆保持低位。躯干从髋关节整体向前折叠到胸腹近乎平行地面，胸腹自然压在大腿上方，肩膀在三维位置中越过膝盖。头颈沿前倾脊柱自然延伸并与地面视点保持正常距离；双肩、胸腹和骨盆必须清楚可见并共同形成比头部更宽、更有体量的身体主体。头发、项链、上衣下摆和松散布料受重力垂向地面视点，作为前倾不可误读的证据。肥胖或柔软体型显示可信的腹部压缩与皮肤褶皱。头、颈、胸不保持竖直，不仅低头、弯颈、把头伸向视点或单独伸出手机来假装前倾。身体重心仍落在双脚形成的支撑范围内，不抬高臀部变成站立俯身、向后仰、双脚完全相碰、双脚远宽于肩部、膝盖外展、悬浮、跪在空气中、双腿融合、骨盆断裂、额外脚趾、扭转膝盖或高跟鞋失去接触。
    - 使用 35 mm 等效直线投影，保持自然低角度透视。视点位于中国式蹲便器对应外缘的地面高度，不高于鞋底上缘，并从地面向上倾斜 35–55 度；画面底缘必须出现紧邻视点的陶瓷蹲便器边缘、中央便池和至少一部分防滑脚踏区。每个
      画面 只选择一个明确方位：正面视角位于蹲便器前缘和人物脚尖前方；左侧或右侧视角位于蹲便器对应侧缘 80–100 度；背面视角位于蹲便器后缘和脚跟后方 160–180 度；三分之四视角位于蹲便器前侧或后侧外缘
      35–55 度。不得在同一 画面 混合正面、侧面和背面，也不得用镜面制造第二视角。视点与人物保持足够取景距离，人物完整蹲姿位于画面中央区域，双肩、胸腹或背部、骨盆、双膝和双脚必须同时可见，不让脚、膝、手或头进入画面边缘的畸变区域。正面和背面视角中，骨盆位于双脚中点上方，两条大腿几乎平行下降至紧凑朝前的双膝，膝间与鞋间是同宽的窄直缝，膝盖以下两侧小腿形成靠近的垂直平行柱；侧面视角中，近侧腿完整可见，远侧腿在同一狭窄横向走廊内部分错开而非融合，膝盖仍垂直位于对应脚踝和脚上方，中央陶瓷便池保持可辨认。投影尺度按视点距离连续变化：鞋脚和小腿比臀胯、大腿适度显大，肩膀和胸腹或背部保持主体体量；头部不是距离视点最近的物体，其投影宽度小于双肩和躯干。人物视线与所选方位一致，中国卫生间隔间板、墙砖和吊顶形成背景。禁止手持、自拍、腰部高度、膝盖高度、眼平、俯拍或远处长焦视角。禁止鱼眼、超广角、边缘拉伸、桶形畸变和夸张强制透视；透视只改变各部位的合理投影大小，不能改变骨骼长度、关节连接、头身比、肩髋关系或左右对称性。画面任何位置都不得出现相机机身、镜头、手机拍摄设备、三脚架、支架、操作人员、设备阴影或设备反射；不得把腿复制成四条，不得把道具融合进手掌。
    - 构图接近竖幅 3:4 或 4:5。骨盆居中，两条大腿解剖独立但紧凑近并，几乎平行地向下延伸到朝前的双膝；双膝和双鞋之间均保留一条狭窄、等宽、连续的可见空隙。每侧髌骨对准对应鞋第二脚趾，两条小腿呈靠近的平行竖柱，两只鞋的纵轴与蹲便器前后轴构成三条平行线，脚尖和脚跟保持等距。正面视角强调胸腹、骨盆、紧凑对称双腿和蹲便器前缘；侧面视角强调前倾背线、腹部压向大腿、同一狭窄横向走廊中的近远腿层次及蹲便器侧面轮廓；背面视角强调背部、臀部、紧凑后侧大腿、双脚和蹲便器后缘，并让头自然回转不超过肩线；三分之四视角同时保留身体纵深、窄直腿间空隙、膝脚对齐和完整蹲便器。中国式蹲便器位于脚下和画面底部区域，必须清楚显示中央椭圆陶瓷便池、排污口与左右防滑脚踏区；画面不是贴脸特写，必须保留完整肩线、胸腹或背部、骨盆、双鞋、蹲便器、前倾身体、卫生间边界和至少三盏顶灯。正确的视觉层级是下方鞋脚略大、腿部向上合理收缩、臀胯和躯干连贯、肩膀与胸腹或背部宽于头部、面部或后脑大小自然；不允许头宽达到或超过肩宽、头遮挡身体、头大身小、鞋脚占据大半画面、腿异常粗长、躯干塌成短块、头部微小或手掌巨大。
    - 光线使用卫生间顶部的三至五盏白色筒灯，形成强烈顶光、皮肤高光和地砖反射。允许轻微手机相机锐化、真实高 ISO 纹理和边缘色散；禁止电影棚柔光、奶油散景、塑料皮肤、过度磨皮、插画、动漫或三维渲染感。
    - 互动必须多样且在当前瞬间清楚发生，每个 画面 只选一个主要互动：低头并用一只手撩起上衣、另一只手扶膝；从卷筒抽取厕纸并在臀部或外部肛门区域进行明确擦拭；整理、梳开或轻拉阴毛；调整高跟鞋带；按下墙面冲水按钮；或扶住隔间板并向地面视点展示姿势。已经褪下的裤子、内裤或裙子是静止衣物，只能堆叠在膝盖以下、小腿或脚踝，双手不得抓住它们并提回膝盖或大腿。不得使用摄影机遥控器、三脚架或任何会暗示拍摄设备进入画面的道具。动作必须改变上衣、皮肤、纸张或其他道具的可见形态，不能只是拿着、等待或摆姿。
    - 人物脚下必须是一具嵌入地面的中国式陶瓷蹲便器：长轴前后延伸，中央椭圆便池与排污口清楚可见，左右各有带防滑纹的承重脚踏区。画面视点位于蹲便器前缘外侧的鞋底以下高度并向上观察，但任何拍摄设备都在画框之外。人物在蹲便器上方保持骨盆居中、双腿紧凑且趋于并拢但不互相接触的低位蹲姿并从髋部明显前倾：左右脚分别完整踩在对应脚踏区，左右髋关节与两条大腿的解剖归属清楚，大腿几乎平行向下并仅轻微向内收至朝正前方的双膝，双膝内缘和双鞋内缘之间形成等宽、狭窄、连续的竖直空隙，每侧膝盖在对应脚踝和脚的正上方，两侧小腿形成靠近的垂直平行柱；两只鞋的纵向中心线均朝正前方并彼此平行，也与蹲便器前后长轴平行，脚尖间距与脚跟间距完全相同。胸腹压向大腿，头颈沿前倾脊柱自然延伸但不向视点伸出。使用直线投影形成自然、适度且符合物理规律的地面仰拍透视。人物真实解剖保持正常成人头身比、肩宽、躯干长度及四肢比例，真实头高约为完整身高的七分之一至八分之一。画面投影体现距离层次：最近的鞋脚和小腿适度显大，臀胯和大腿保持中间尺度，肩膀和胸腹构成中央主体；头部与视点维持自然距离，投影宽度必须小于可见肩宽和躯干宽度，不能出现头大身小。
    - 图像不添加文字、字幕、标识、水印或拼贴边框。
