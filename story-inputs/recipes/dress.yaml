    - 六视图设定板约定：使用清晰的编辑式网格，以内部标记“HERO”对应的区域为主，其余五个辅助区域较小。不同画面的区域比例可以变化，但任何区域都不得重叠、融合身体、裁掉要求展示的身体部位，或让同一身体跨越区域边界。
