    common:
    - 决策顺序：每个主题和画面都按以下顺序确定：准确的人物配置与六视图设定板；所选内容级别的物品清单；产品真实性与可见的安全性；身份、服装与位置的连续一致；夸张鲜亮的角色造型；呈现方式的变化；输出语言与无文字要求。后续选择绝不能削弱前面的要求。
    - 人物配置：只使用一位年龄为25岁或以上、明显成熟的中国女性，不出现其他人。她神志清醒、从容自主，身体安全。不得添加男性、同伴、人群、助理、人形剪影、人像、人体模特、玩偶或人物倒影。
    - 人物配置：这份单模特角色设定板简报要求一名女性、零名男性。文件名或请求中提到其他人物配置，不会使设定板变成多人设计；不得以不兼容的人数执行此简报。
    - 人物配置：每个主题都设定一位稳定不变的女性，明确年龄、面部结构、肤色、身体比例、头发长度、发质和发型。在属于该主题的每个视图和每个画面中，完整保留她的身份和身体特征。
    - 人物配置：不得将她理想化为千篇一律的时装模特。不同主题应变化成年年龄、脸型、身高、体格、比例和气质，同时保持人体结构真实且内部一致。
    - 内容级别决定服装：所选内容级别既是这张非叙事角色设定板的服装与遮盖约定，也是配饰与道具的强度尺度。不得为了满足级别而虚构性器官、伴侣、性行为、故事事件或无关动作。
    - 主题设计：每个主题定义一个完整的时尚身份：
    - 主题设计：1. 一个以指定输出语言命名的原创内部造型名称，在本次运行中独一无二；
    - 主题设计：2. 一个具有稳定身体识别特征的成熟女性身份；
    - 主题设计：3. 一种服装原型与廓形；
    - 主题设计：4. 一套从身体向外的精确叠穿顺序；
    - 主题设计：5. 一种主导材质与一种对比材质；
    - 主题设计：6. 一套由二至四种明确命名的颜色组成的有限高彩度配色；
    - 主题设计：7. 一套开合与结构逻辑；
    - 主题设计：8. 二至五件相互协调且身体位置固定的配饰，以及仅限所选级别允许的成人道具；
    - 主题设计：9. 一种能露出重要服装与配饰细节的雕塑感发型；
    - 主题设计：10. 一个适用于所有面部可见视图的强化表情方向；以及
    - 主题设计：11. 一种支持造型、但不发展成故事的摄影棚或环境设计灵感。
    - 主题设计：不同主题应变化廓形类别、身体遮盖范围、领口、肩部处理、腰部结构、袖型逻辑、下摆几何形态、鞋履类别、配饰尺度、材质表现、配色冷暖、时代灵感和社会态度。
    - 主题设计：不得只给同一件礼服换几种颜色，不得重复同一套束身衣配长袜的公式，不得默认每个主题都是婚礼高级定制，也不得只改变发型和珠宝。
    - 夸张鲜亮的角色造型：每个主题和画面都必须让女性的发型、服装设计、穿搭造型和可见面部表情大胆夸张、生动且视觉鲜亮。使用具有雕塑感和强烈视觉冲击的发型、放大却可实际制作的服装廓形与层次呈现、材质对比清晰的高彩度色块，以及在面部可见处都能一眼读懂的强化表情。整体处理应精致、成熟、可实际穿戴、符合人体结构，在所有视图中保持一致，并与所选内容级别兼容。绝不能只靠明亮灯光或遮蔽服装结构来满足此规则。
    - 服装规范：将服装描述为可实际制作的物件。说明：
    - 服装规范：- 服装类别与廓形；
    - 服装规范：- 精确的叠穿顺序；
    - 服装规范：- 领口、肩部、袖子、腰部、臀部、下摆和背部结构；
    - 服装规范：- 开合位置与五金件；
    - 服装规范：- 面料重量、垂坠性、不透明度、表面与饰面；
    - 服装规范：- 颜色分布；
    - 服装规范：- 仅描述可见位置的接缝、裁片、撑骨、褶裥、抽褶、镂空、饰边和边缘处理；
    - 服装规范：- 鞋履的形状、材质、鞋跟或鞋底以及固定方式；以及
    - 服装规范：- 内容级别规定的遮盖范围与产品强度边界。
    - 服装规范：每件服装在每个视图中都必须贴合同一个身体。正面、背面和侧面结构必须一致。一个视图中可见的开合件、接缝、带子、镂空、开口或饰物，必须在所有其他视图中处于对应的实际位置。
    - 服装规范：使用物理上可信的面料表现。厚重材质保持结构，柔软材质自然垂坠，弹性材质顺应张力，轻透材质保持透明，反光材质反射周围环境，扣件承受合理负载。
    - 服装规范：不得使用物理上不可能的面料、没有支撑的刚性形状、随意漂浮的布料、无缘由的服装变形、相互矛盾的开合结构、融合的衣层，或无法从设定板中理解的复杂装饰。
    - 配饰规范：选择二至五件属于同一设计语言的配饰。为每件配饰指定固定的身体位置、尺度、朝向、材质、颜色、固定方式及其与服装的关系。
    - 配饰规范：可选类别包括头饰、发饰、耳饰、眼镜、颈饰、颈圈、肩饰、手套、束环、戒指、腰带、腰链、身体首饰、袜装、腿饰、鞋履，以及一件手持时尚物件。每个级别也可使用其强度约定允许的成人穿戴物和道具。这些是开放类别，并非必选物品。
    - 配饰规范：不得在每个身体区域都堆满配饰。保持面部、廓形、服装结构和内容级别所规定的遮盖范围清晰可辨。
    - 配饰规范：配饰不得在不同视图间换边、增殖、消失、移位、穿过身体、悬浮、刺入非预期身体部位，或变成另一种设计。成对配饰必须始终成对。
    - 成人道具规范：对每件允许使用的成人道具，固定以下信息：
    - 成人道具规范：- 产品类别与外形轮廓；
    - 成人道具规范：- 相对尺度与朝向；
    - 成人道具规范：- 对身体安全的材质、硬度、表面与饰面；
    - 成人道具规范：- 颜色与五金设计语言；
    - 成人道具规范：- 可见的控制件、接缝、接合处或充电部件；
    - 成人道具规范：- 穿戴贴合方式、与服装的连接、套袋、盒子、支架或收纳位置；以及
    - 成人道具规范：- 明确在内部区域标记“HERO”、“ACCESSORIES”和“MATERIALS”中是否出现。
    - 成人道具规范：通过产品类别、可见形态、材质、饰面、控制件、贴合方式、固定方式、快拆、连接、套袋、盒子、支架和收纳来描述成人道具。除允许使用的标准商业产品名称外，不得描述性器官、身体开口、体内放置、插入、刺激、体液或性行为。每件产品都应保持清洁、完整，并有实际支撑。
    - 成人道具规范：同一道具在各视图中必须保持数量、尺寸、颜色、材质、控制件和连接方式不变。不得把穿戴物变成另一种物件，也不得无缘无故增加重复件。
    - 产品真实性检查：每件被命名的产品都必须通过可见形状、预定佩戴位置、连接逻辑和尺度，保留其真实的商业产品身份。不得将一个可识别的产品名称用在实际固定于其他位置的装饰物上。
    - 产品真实性检查：- 佩戴的乳夹应以已明确规定的衬垫接触面、张力限制器和释放系统夹在乳头上。夹在蕾丝、束身衣边缘、皮革饰边、带子或其他服装表面的夹子属于衣夹，不得称为乳夹。
    - 产品真实性检查：- 佩戴的球形口塞、衔杆式口塞、片式口塞或中空口塞，必须清楚可见地位于口部，且呼吸设计和侧面释放装置清晰可辨。挂在颈圈、腰带或手上的口塞是携带的产品，不是佩戴的口塞。
    - 产品真实性检查：- 可穿戴振动器必须位于专为其制作的外部服装或束带固定座上，完整产品轮廓和释放装置均应可见。不得暗示隐藏放置或体内放置。
    - 产品真实性检查：- 穿戴式固定带必须以稳定的前置底板清楚可见地支撑其可拆卸产品。不得将产品融入服装或人体。
    - 产品真实性检查：- 每件在体外展示的插入式玩具都必须有明确的支架、托座、盒子、托盘或套袋，清楚可见地支撑其完整外形。
    - 产品真实性检查：如果无法清晰、可信地展示规定的贴合方式，就将产品移至配饰特写或材质平铺图。绝不能通过把物件夹在衣服上、隐藏接触点或改变类别来伪造产品使用状态。
    - 性玩具产品规范：外部可穿戴性玩具可在人物视图中装配于服装或专用束带、口袋、套袋、腰带固定座、链条固定座或服装裁片上。将其视为静态的产品装配展示：产品保持关机，置于服装遮盖边界之外，除非其外部轮廓必须保持可见，并且与任何性行为无关。
    - 性玩具产品规范：可以命名和展示插入式产品类别，但必须完全位于体外。仅在贴合套袋、透明盒、充电托座、展示支架、密封托盘或整齐的材质平铺图中呈现。不得通过姿态、位置、服装开口、身体接触、隐藏的鼓起、线缆方向、遥控器或表情暗示插入。
    - 性玩具产品规范：每件性玩具都应说明准确的商业类别、外形轮廓、相对尺度、对身体安全的材质、硬度或柔韧性、表面纹理、颜色、接缝、控制件、充电部件、可拆卸连接件、盒子或固定座，以及在主导人像、配饰特写和材质平铺图中的对应出现情况。所有视图都应保持相同的产品数量、尺寸、饰面、控制件以及收纳或穿戴贴合状态。
    - 结构与连接完整性：除非有可见连接件将它们实际连接起来，否则每件服装、手套、靴子、颈圈、束环、束带、腰带和道具都应保持为可独立制作的物件。通过明确命名的带子、链条、裁片、环扣、搭扣或接缝，沿两个部件之间的实际距离交代每条连接。
    - 结构与连接完整性：不得说颈圈无缝延伸成手套、腰部结构变成肩饰，或两个不相邻的部件在没有可见中间结构的情况下融合。任何带子或链条都不得在身体后方消失，再出现时却连到无关部件上。连接关系必须在正面、背面、侧面、四分之三角度、特写和平铺视图中保持一致。
    - 精选性玩具产品类别：- 一支固定在塑形大腿套袋中的全尺寸棒式按摩器，带有哑光硅胶头、金属控制件和可拆卸的配套电源底座。
    - 精选性玩具产品类别：- 一个装入透明腰部束带口袋的掌上振动器，带有光滑硅胶外壳、可见控制件和磁吸开启翻盖。
    - 精选性玩具产品类别：- 一个安装在专用前部束带面板上的外部可穿戴振动器，硅胶轮廓可见，固定座可拆卸，不存在隐藏的身体接触。
    - 精选性玩具产品类别：- 一个连接在腰带展示托架上的吸吮刺激器，带有柔软硅胶边缘、可见控制面和快拆托座。
    - 精选性玩具产品类别：- 一套在外部承载可拆卸硅胶假阳具的穿戴式固定带，配有宽幅衬垫腰带、稳定底板和前置快拆扣。
    - 精选性玩具产品类别：- 一件竖直安装在加重展示支架上的经典硅胶假阳具，具有光滑哑光表面、外扩底座和贴合保护盒。
    - 精选性玩具产品类别：- 一个展示在模制充电支架上的兔形振动器，具有柔软硅胶表面、清晰分立的控制件和配套硬壳盒。
    - 精选性玩具产品类别：- 一个嵌有宝石的硅胶肛塞，安装在依形制作的展示凹槽中，具有外扩底座、抛光饰物和专用保护盒。
    - 精选性玩具产品类别：- 一套按大小渐变的肛珠，整齐放在密封模制托盘中，具有柔性硅胶连接段、拉取环和贴合旅行盒。
    - 精选性玩具产品类别：- 一组成对的凯格尔球，收纳于珠宝盒式充电盒中，具有光滑硅胶外壳、拉取环和小型控制模块。
    - 精选性玩具产品类别：- 一个带纹理的自慰套，展示在刚性圆柱形盒中，配有可拆卸盖子、柔软内层材质和协调的外部饰面。
    - 精选性玩具产品类别：- 一组成对展示的振动阴茎环，置于贴合的金属与天鹅绒收纳盒中，具有柔性硅胶环带和可拆卸控制模块。
    - 精选性玩具产品类别：- 一件紧凑型往复运动玩具，以折叠锁定状态展示在有结构支撑的设备箱内，控制件和衬垫支撑可见，且无身体接触。
    - 身份与服装连续性：在所有人物视图中精确保留：
    - 身份与服装连续性：- 脸型与五官；
    - 身份与服装连续性：- 年龄与肤色；
    - 身份与服装连续性：- 体格与身体比例；
    - 身份与服装连续性：- 头发长度、发质、分缝与造型；
    - 身份与服装连续性：- 妆容与指甲处理；
    - 身份与服装连续性：- 服装数量、叠穿顺序、合身程度、颜色、材质、接缝、开口和开合结构；
    - 身份与服装连续性：- 配饰数量、所在侧、固定方式和位置；以及
    - 身份与服装连续性：- 内容级别规定的遮盖范围、穿戴物强度和成人道具清单。
    - 身份与服装连续性：不得在同一区域内复制这位女性，不得凭空增加肢体或身体结构，不得将不对称细节镜像到错误一侧，也不得展示不可能属于同一件服装的正背面结构。
    - 风格、光线与材质：采用超写实时尚摄影与产品设计的清晰度。每个主题选择一套统一的视觉体系：精准的摄影棚呈现、强调触感的工坊记录、克制的电影式世界营造、档案式高级定制展示、工艺奢华、仪式般的冷峻、哥特式华丽、工业感剪裁、戏剧式奢华，或同等明确的原创体系。
    - 风格、光线与材质：整张设定板共用一套具有合理光源依据的照明。每个区域的肤色、服装颜色、材质响应和配饰饰面保持一致。辅助特写可以增加细节，但不得改变光线方向或色温。
    - 风格、光线与材质：背景必须有助于分离廓形并清晰呈现材质。避免与服装争夺注意力的景物、装饰性尘埃、雾、火花、粒子、戏剧化天气或遮蔽结构的氛围效果。
    - 风格、光线与材质：不得模仿具名的在世设计师、摄影师、时装品牌、广告企划、受版权保护的角色或现成服装。
    - 主题与画面：主题代表不同的女性和时尚概念，而不是同一个故事中的场景。
    - 主题阶段输出：- 字段“title”：以指定输出语言给出的独特内部造型名称，用于指导设计，但不显示在设定板上；
    - 主题阶段输出：- 字段“premise”：最多两个简洁句子，固定女性身份、所选造型强度、完整服装与叠穿顺序、固定配饰和允许使用的成人道具；
    - 主题阶段输出：- 字段“style”：用一个简洁句子固定共用的设定板版式语言、配色、材质、背景、图形层级和照明。
    - 主题阶段输出：不得包含画面草稿、逐视图文字、计数值、模式结构说明或后续阶段指令。
    - 重写任何混用不同级别强度规则的主题或画面。
    - 成人道具是时尚产品元素，绝不是表演者或人体结构的替代物。依据商业产品形态和控制设计语言使用清晰的产品类别，例如棒式按摩器、遥控振动器、硅胶塞具、成对乳夹、口塞、束缚环，或同样清晰可辨的原创类别。
