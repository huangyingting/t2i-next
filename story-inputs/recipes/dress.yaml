      - 精选硬核级材质与配色体系：- 午夜蓝天鹅绒、黑色涂层织带、银色钢材和一处冷白缎面点缀。
      - 精选硬核级材质与配色体系：- 深棕马具皮革、奶油色丝绸、做旧黄铜和黑色抛光靴。
      - 精选硬核级材质与配色体系：- 黑色小牛皮、祖母绿天鹅绒、金色五金件和轻透炭灰袜装。
      frames:
      - “BDSM”器具规范：主导人像可展示所选器具或产品的佩戴或携带状态，采用放松、从容自主的时尚参考姿势。正面、背面和侧面视图必须露出所有贴合、连接和释放点，不得将手腕绑在一起、捆绑肢体、让颈部承重、限制呼吸、悬吊重量、强迫关节活动范围，或暗示器具由另一个人控制。
      - “BDSM”器具规范：对于佩戴的乳夹，明确宽大的硅胶衬垫夹头、低张力调节限位、释放拉片和放松的贴合状态，周围皮肤保持不变。对于佩戴的球形口塞、衔杆式口塞、片式口塞或中空口塞，明确柔软的医用级硅胶、通气结构或开放呼吸通道、宽松带子、不受遮挡的鼻部、放松的下颌和可立即触及的侧面释放装置。无法满足这些可见贴合条件的产品必须移至配饰特写或材质平铺图，而不是佩戴。
      - “BDSM”器具规范：配饰特写必须清楚展示衬垫、缝线、搭扣、夹扣、调节孔、释放拉片和安全的边缘处理。材质平铺图必须包含完全相同的器具清单，包括每组成对束环或带子的两个成员，不得增加额外束缚物或替代产品。
      - 硬核级视觉冲击检查：硬核级照明必须让主导人像立即具有戏剧性。采用定向主光、硬边聚光、受控轮廓光、深邃侧光或其他具有合理光源依据的高对比布光，区分皮肤、面料、皮革、金属和硅胶。辅助正投影视图和细节视图可使用克制的补光以便看清，但整张设定板不得退化为平淡、无阴影的商品目录照明。
      - 硬核级视觉冲击检查：硬核级应避免普通的中灰墙面、灰色金属板、简单米色背景和均一无缝背景纸。选择经过设计的深色、高饱和度、有纹理、漆面、天鹅绒、木材、石材或具有强烈对比的浅色背景，在不遮蔽廓形的前提下强化所选配色。
      - 性玩具中至少一件产品应足够大或外形足够醒目，能在主导人像、配饰特写或材质平铺图中清楚辨认。“BDSM”产品或性玩具如果只在材质平铺图中作为小物件出现，就不满足产品强调要求。
      - 每个设计都有一个主导重点、两个次级结构、至少三个对比维度、富有戏剧性且能分离廓形的光线、经过设计的背景，并且不使用科技造型服装语言。
      - 可以展示任何所选硬核级佩戴产品的贴合与释放细节，仅包含让产品清晰可辨所必需的有限身体区域，不强调人体结构，也不呈现性行为。
