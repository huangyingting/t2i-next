    - 取景与姿态：材质平铺图必须展示两只鞋、两只手套，以及每组成对束环、长袜、带子、夹具、耳饰或其他成对物品的两个成员。绝不能用一个样品代表一对；穿戴设计使用成对物品时，也绝不能写成一只手套、一只靴子或一只鞋。
    - 身份与服装连续性：在所有人物视图中精确保留：
    - 身份与服装连续性：- 脸型与五官；
    - 身份与服装连续性：- 年龄与肤色；
    - 身份与服装连续性：- 体格与身体比例；
    - 身份与服装连续性：- 头发长度、发质、分缝与造型；
    - 身份与服装连续性：- 妆容与指甲处理；
    - 身份与服装连续性：- 服装数量、叠穿顺序、合身程度、颜色、材质、接缝、开口和开合结构；
    - 身份与服装连续性：- 配饰数量、所在侧、固定方式和位置；以及
    - 身份与服装连续性：- 内容级别规定的遮盖范围、穿戴物强度和成人道具清单。
    - 身份与服装连续性：不得在同一区域内复制这位女性，不得凭空增加肢体或身体结构，不得将不对称细节镜像到错误一侧，也不得展示不可能属于同一件服装的正背面结构。
