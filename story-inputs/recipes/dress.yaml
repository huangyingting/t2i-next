    - 风格、光线与材质：背景必须有助于分离廓形并清晰呈现材质。避免与服装争夺注意力的景物、装饰性尘埃、雾、火花、粒子、戏剧化天气或遮蔽结构的氛围效果。
    - 风格、光线与材质：不得模仿具名的在世设计师、摄影师、时装品牌、广告企划、受版权保护的角色或现成服装。
    - 无文字设定板：不得将主题标题或区域名称呈现为可见文字。规划设定板时，区域名称仅作为内部版式参考。
    - 无文字设定板：在最终画面文字中，通过空间位置和视觉功能来指明区域：主导的全身四分之三角度人像、全身正面视图、全身背面视图、全身侧面视图、与主体保持关联的配饰特写，以及整齐的材质平铺图。不得包含大写区域名称的字面标记，也不得将设定板描述为带有标题。
    - 无文字设定板：成图不得包含文字排版、字母、数字、尺寸标注、品牌名称、标志、标语、说明文字、伪字母、水印、签名或其他可见文字。
    - 主题与画面：同一主题中的画面，是同一位女性和同一完整造型的平行设定板版式方案。保留身份、服装、配饰、成人道具、遮盖范围、配色、材质体系和角色表现方向。变化呈现方式，而不是设计事实。
    - 主题与画面：同一主题中的每个画面都必须是实质不同的呈现，而不是对前一画面换一种说法。在保留设计本身的同时，至少改变以下四项：主导人像朝向、承重站姿、手部位置、主导区域位置与比例、三个正投影视图的排列、配饰特写目标、材质平铺几何布局、背景材质、主光方向、阴影形状或图形化留白。不得只替换同义词，却沿用相同的开头节奏、区域顺序、主视图姿势、背景和照明。
    - 主题与画面：不得描述在不同视图或画面之间穿衣、脱衣、打开、移除、添加、更换、调整或变换服装。
    - 画面阶段输出：使用指定输出语言写一个紧凑、可直接成像的段落。共用的身份、服装、配色和物品清单事实只陈述一次，然后仅描述各区域不同的信息。不得为每个视图重复完整的服装或产品规范，不得提及字段“theme.title”，也不得插入内部标签标记来指明区域。
    - 画面阶段输出：开头使用指定输出语言说明，一张精致、无文字的女性六视图角色设定板铺满横向画布。随后说明女性稳定的身份、完整服装结构、固定配饰、允许使用的成人道具、六区域网格、每个区域的空间位置与视觉功能、各视图的姿态与裁切、材质细节、背景和共用照明。
    - 画面阶段输出：完全通过可见服装、器具、产品、姿态、材质和光线表达所选强度。不得写出内部级别名称“aesthetic”、“erotic”或“hardcore”；不得写出“content level”（内容级别）、“hardcore
      level”（硬核级别）、“compliant”（合规）、“safety requirement”（安全要求）或“validation”（验证）等措辞。标准类型缩写“BDSM”在必要时最多出现一次。指定输出语言不是英语时，不得夹带“anchored”（有明确依附位置）、“coiled”（盘卷）、“hero”（主视图）、“accessories”（配饰）、“materials”（材质）或“flat
      lay”（平铺）等未翻译的英语工作流程词汇；应以指定语言自然描述位置与功能。
    - 画面阶段输出：通过衬垫、通气结构、圆润边缘、限张力五金件和快拆扣等可见结构细节体现安全性。不得用“inactive”（未启动）、“unused”（未使用）、“no contact”（无接触）、“no
      load”（无负载）、“no pressure”（无压力）、“not inserted”（未插入）、“not stimulating”（不产生刺激）、“harmless”（无害）或“safe”（安全）等合规式否定措辞填充最终文字。
    - 画面阶段输出：只描述最终可见的设定板。不得包含备选方案、可选措辞、设计理由、背景故事、象征意义、先后过程、穿衣动作、内部指令，也不得说明产品未使用或某种禁止行为没有发生。
    - 最终验证：任何主题或画面只要有一项检查未通过，就静默重写：
    - 最终验证：1. 只出现一位年龄为25岁或以上的成年中国女性；每个人物视图都是同一个人，没有额外人物或类人物件。
    - 最终验证：3. 女性的发型、服装设计、穿搭造型和可见面部表情，都通过角色设计而非仅靠照明，呈现大胆夸张、生动鲜亮的效果。
    - 最终验证：4. 身份、发型、服装状态、叠穿顺序、结构、配色、遮盖范围、配饰和产品清单在所有视图中保持一致；每条实际连接都可制作且可追溯。
    - 最终验证：5. 每件被命名的产品都有真实形状和预定贴合方式，每件展示产品都有可见支撑，每件佩戴产品都展示规定的身体安全贴合方式与释放装置，不出现性行为、痛苦或伤害。
    - 最终验证：6. 设定板恰好包含六个互不重叠的区域：四个完整的头到脚人物视图、一幅与主体相连的配饰特写，以及一幅不含身体的材质平铺图，其中准确包含完整物品清单和每件成对物品。
    - 最终验证：7. 每个姿势都静止、着地、符合人体结构、无遮挡，并有助于理解设计。
    - 最终验证：8. 每个画面都在至少四个允许变化的呈现维度上区别于同主题的其他画面，且不改变设计事实。
    - 最终验证：10. 最终文字绝不陈述内部内容级别、合规措辞、安全式否定语或内部区域标记；“BDSM”最多出现一次，且不残留未翻译的工作流程文字。
    - 最终验证：11. 完成的设定板不含可见标题、区域标签、文字排版、字母、数字、标志、说明文字、伪文字或水印。
    - 最终验证：12. 主题字段严格遵循其模式结构；画面文字使用指定语言，开头指明六视图设定板，共用事实只陈述一次，并以完整句子的标点结尾。
    - 重写任何混用不同级别强度规则的主题或画面。
    - 确认遮盖范围和物品清单只满足所选级别的服装与产品规则。
    - 所选级别包含任何成人产品时，至少让一件选定产品在主导人像或配饰特写中具有明确的视觉作用。
    - 成人道具是时尚产品元素，绝不是表演者或人体结构的替代物。依据商业产品形态和控制设计语言使用清晰的产品类别，例如棒式按摩器、遥控振动器、硅胶塞具、成对乳夹、口塞、束缚环，或同样清晰可辨的原创类别。
    - 内部标记“ACCESSORIES”对应的配饰特写可以在上躯干部位裁切，但必须让每个可见身体部位都与同一位女性保持连接。
    - 内部标记“MATERIALS”对应的材质区域不包含身体部位或人体模特，展示每组成对服装、鞋履或配饰的两个成员，且不包含穿戴造型中没有的任何备用、后备、备选或替换物品。
validation:
  themes:
    mode: report
  frames:
    mode: report
requirements:
  allowed_casts:
  - female_count: 1
    male_count: 0
modules:
- id: layout-multiview
  parameters:
