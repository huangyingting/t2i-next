    common:
    - 决策顺序：每个主题和画面都按以下顺序确定：准确的人物配置与六视图设定板；所选内容级别的物品清单；产品真实性与可见的安全性；身份、服装与位置的连续一致；夸张鲜亮的角色造型；呈现方式的变化；输出语言与无文字要求。后续选择绝不能削弱前面的要求。
    - 人物配置：只使用一位年龄为25岁或以上、明显成熟的中国女性，不出现其他人。她神志清醒、从容自主，身体安全。不得添加男性、同伴、人群、助理、人形剪影、人像、人体模特、玩偶或人物倒影。
    - 人物配置：这份单模特角色设定板简报要求一名女性、零名男性。文件名或请求中提到其他人物配置，不会使设定板变成多人设计；不得以不兼容的人数执行此简报。
    - 内容级别决定服装：所选内容级别既是这张非叙事角色设定板的服装与遮盖约定，也是配饰与道具的强度尺度。不得为了满足级别而虚构性器官、伴侣、性行为、故事事件或无关动作。
    - 夸张鲜亮的角色造型：每个主题和画面都必须让女性的发型、服装设计、穿搭造型和可见面部表情大胆夸张、生动且视觉鲜亮。使用具有雕塑感和强烈视觉冲击的发型、放大却可实际制作的服装廓形与层次呈现、材质对比清晰的高彩度色块，以及在面部可见处都能一眼读懂的强化表情。整体处理应精致、成熟、可实际穿戴、符合人体结构，在所有视图中保持一致，并与所选内容级别兼容。绝不能只靠明亮灯光或遮蔽服装结构来满足此规则。
    - 服装规范：将服装描述为可实际制作的物件。说明：
    - 服装规范：- 服装类别与廓形；
    - 服装规范：- 精确的叠穿顺序；
    - 服装规范：- 领口、肩部、袖子、腰部、臀部、下摆和背部结构；
    - 服装规范：- 开合位置与五金件；
    - 服装规范：- 面料重量、垂坠性、不透明度、表面与饰面；
    - 服装规范：- 颜色分布；
    - 服装规范：- 仅描述可见位置的接缝、裁片、撑骨、褶裥、抽褶、镂空、饰边和边缘处理；
    - 服装规范：- 鞋履的形状、材质、鞋跟或鞋底以及固定方式；以及
    - 服装规范：- 内容级别规定的遮盖范围与产品强度边界。
    - 服装规范：每件服装在每个视图中都必须贴合同一个身体。正面、背面和侧面结构必须一致。一个视图中可见的开合件、接缝、带子、镂空、开口或饰物，必须在所有其他视图中处于对应的实际位置。
    - 服装规范：使用物理上可信的面料表现。厚重材质保持结构，柔软材质自然垂坠，弹性材质顺应张力，轻透材质保持透明，反光材质反射周围环境，扣件承受合理负载。
    - 服装规范：不得使用物理上不可能的面料、没有支撑的刚性形状、随意漂浮的布料、无缘由的服装变形、相互矛盾的开合结构、融合的衣层，或无法从设定板中理解的复杂装饰。
    - 配饰规范：选择二至五件属于同一设计语言的配饰。为每件配饰指定固定的身体位置、尺度、朝向、材质、颜色、固定方式及其与服装的关系。
    - 配饰规范：可选类别包括头饰、发饰、耳饰、眼镜、颈饰、颈圈、肩饰、手套、束环、戒指、腰带、腰链、身体首饰、袜装、腿饰、鞋履，以及一件手持时尚物件。每个级别也可使用其强度约定允许的成人穿戴物和道具。这些是开放类别，并非必选物品。
    - 配饰规范：不得在每个身体区域都堆满配饰。保持面部、廓形、服装结构和内容级别所规定的遮盖范围清晰可辨。
    - 配饰规范：配饰不得在不同视图间换边、增殖、消失、移位、穿过身体、悬浮、刺入非预期身体部位，或变成另一种设计。成对配饰必须始终成对。
    - 成人道具规范：对每件允许使用的成人道具，固定以下信息：
    - 成人道具规范：- 产品类别与外形轮廓；
    - 成人道具规范：- 相对尺度与朝向；
    - 成人道具规范：- 对身体安全的材质、硬度、表面与饰面；
    - 成人道具规范：- 颜色与五金设计语言；
    - 成人道具规范：- 可见的控制件、接缝、接合处或充电部件；
    - 成人道具规范：- 穿戴贴合方式、与服装的连接、套袋、盒子、支架或收纳位置；以及
    - 成人道具规范：- 明确在内部区域标记“HERO”、“ACCESSORIES”和“MATERIALS”中是否出现。
    - 成人道具规范：通过产品类别、可见形态、材质、饰面、控制件、贴合方式、固定方式、快拆、连接、套袋、盒子、支架和收纳来描述成人道具。除允许使用的标准商业产品名称外，不得描述性器官、身体开口、体内放置、插入、刺激、体液或性行为。每件产品都应保持清洁、完整，并有实际支撑。
    - 成人道具规范：同一道具在各视图中必须保持数量、尺寸、颜色、材质、控制件和连接方式不变。不得把穿戴物变成另一种物件，也不得无缘无故增加重复件。
    - 产品真实性检查：每件被命名的产品都必须通过可见形状、预定佩戴位置、连接逻辑和尺度，保留其真实的商业产品身份。不得将一个可识别的产品名称用在实际固定于其他位置的装饰物上。
    - 产品真实性检查：- 佩戴的乳夹应以已明确规定的衬垫接触面、张力限制器和释放系统夹在乳头上。夹在蕾丝、束身衣边缘、皮革饰边、带子或其他服装表面的夹子属于衣夹，不得称为乳夹。
    - 产品真实性检查：- 佩戴的球形口塞、衔杆式口塞、片式口塞或中空口塞，必须清楚可见地位于口部，且呼吸设计和侧面释放装置清晰可辨。挂在颈圈、腰带或手上的口塞是携带的产品，不是佩戴的口塞。
    - 产品真实性检查：- 可穿戴振动器必须位于专为其制作的外部服装或束带固定座上，完整产品轮廓和释放装置均应可见。不得暗示隐藏放置或体内放置。
    - 产品真实性检查：- 穿戴式固定带必须以稳定的前置底板清楚可见地支撑其可拆卸产品。不得将产品融入服装或人体。
    - 产品真实性检查：- 每件在体外展示的插入式玩具都必须有明确的支架、托座、盒子、托盘或套袋，清楚可见地支撑其完整外形。
    - 产品真实性检查：如果无法清晰、可信地展示规定的贴合方式，就将产品移至配饰特写或材质平铺图。绝不能通过把物件夹在衣服上、隐藏接触点或改变类别来伪造产品使用状态。
    - 性玩具产品规范：外部可穿戴性玩具可在人物视图中装配于服装或专用束带、口袋、套袋、腰带固定座、链条固定座或服装裁片上。将其视为静态的产品装配展示：产品保持关机，置于服装遮盖边界之外，除非其外部轮廓必须保持可见，并且与任何性行为无关。
    - 性玩具产品规范：可以命名和展示插入式产品类别，但必须完全位于体外。仅在贴合套袋、透明盒、充电托座、展示支架、密封托盘或整齐的材质平铺图中呈现。不得通过姿态、位置、服装开口、身体接触、隐藏的鼓起、线缆方向、遥控器或表情暗示插入。
    - 性玩具产品规范：每件性玩具都应说明准确的商业类别、外形轮廓、相对尺度、对身体安全的材质、硬度或柔韧性、表面纹理、颜色、接缝、控制件、充电部件、可拆卸连接件、盒子或固定座，以及在主导人像、配饰特写和材质平铺图中的对应出现情况。所有视图都应保持相同的产品数量、尺寸、饰面、控制件以及收纳或穿戴贴合状态。
