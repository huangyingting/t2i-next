id: film-post
policy: standard-story
description: 为虚构长片创作原创院线电影海报 Theme。每个 Theme 先构思一个引人入胜的故事概念和英语片名，再创作独立并行的海报设计，每张都可自由发展自己的宣传语和宣传重点。每个结果都必须是完成的、高冲击力且排版与画面一体化的单页海报，而非电影剧照、分镜、技术调色演示、标题卡或事后添加文字的普通照片。
generation:
  output_language: english
requirements:
  output_languages:
  - english
modules:
- id: design-visible-copy
  parameters:
    product: poster
    copy_language: english
    ascii: required
validation:
  frames:
    checks:
    - type: ascii
authoring:
  themes:
    common:
    - 海报内每个可读词和每个最终提示词都必须使用合乎语法的英语，包括道具、文件、标牌、地图、戳记、印章、屏幕、服装、建筑及环境图形。只使用英语拉丁字母、阿拉伯数字和标准标点；绝不出现其他文字系统、乱码、伪字母或占位文案。
    - 在任一阶段返回前，将 U+2018 和 U+2019 替换为直撇号，将 U+201C 和 U+201D 替换为直双引号，将 U+2013、U+2014 和 U+2011 替换为普通连字符，将 U+00B7 替换为逗号，将 U+00A0 替换为普通空格；改写所有剩余的非 ASCII 字符。
    - 生成 Theme 时，标题、前提和风格也必须使用仅含 ASCII 字符的英语。
    - 以下所有清单都是开放式灵感，而非菜单、枚举、预设库、配额、顺序或多选指令。根据故事需要选择、组合、转化或发明方法。只有使用“必须”“每个”“精确”或“不得”等措辞的陈述才是强制要求。
    - 严格使用指定阵容，不得增加人物。每位指定人物都必须明确出现在每个 Theme 前提和每张海报中；不得用缺席、物体、文字、阴影或画外暗示替代人物。每位被描绘者都必须明显是至少 25 岁的成熟中国成年人，清醒、自愿、能够回应且随时可以停止。遵守请求的内容级别。在同一个 Theme 内保持身份、年龄、面容、头发、身体比例、伤疤、衣着及其他决定性锚点。
    - 虚构电影内容和海报核心创意都必须专门为请求的内容级别生成。该级别必须塑造前提、冲突、动作、象征、构图、排版、视觉重点及情绪语气；不得复用其他级别的概念，仅改变标签、姿态、衣着或孤立细节。
    - 每个 Theme 必须定义完整的指定中国成年阵容；具体的中国地点、时期、季节及社会环境；一个具有情感和现实利害的即时冲突或两难抉择；一个令人难忘的关系、秘密、物体、地点或母题；明确的类型和基调；以及一至五个词的虚构英语片名。
    - 让概念即刻可理解，同时足够具体，能够启发象征表现。通过不寻常的场景、矛盾、职业、仪式、物体或后果改造泛化前提。片名应源自故事，并在整个 Theme 中保持完全一致。让每张海报创作一句独特的三至十二词英语宣传语，适合其具体创意方向。不得使用现有电影片名、系列作品、受版权保护的角色、真实制片厂或可识别的虚构世界。
    - 在不同 Theme 之间变化类型、冲突、地点、时期、季节、职业、关系、母题、配色、排版、印刷语言、构图、主角尺度及情感承诺。类型必须控制视觉逻辑，而非仅作为标签出现。
  frames:
    common:
    - 海报内每个可读词和每个最终提示词都必须使用合乎语法的英语，包括道具、文件、标牌、地图、戳记、印章、屏幕、服装、建筑及环境图形。只使用英语拉丁字母、阿拉伯数字和标准标点；绝不出现其他文字系统、乱码、伪字母或占位文案。
    - 在任一阶段返回前，将 U+2018 和 U+2019 替换为直撇号，将 U+201C 和 U+201D 替换为直双引号，将 U+2013、U+2014 和 U+2011 替换为普通连字符，将 U+00B7 替换为逗号，将 U+00A0 替换为普通空格；改写所有剩余的非 ASCII 字符。
    - 无论请求的输出语言为何，Frame 全文必须使用英语。完整 Frame 的每个字符都必须位于 ASCII 码点 0 至 127。
    - 可见文案的序列化不得改变海报设计。字符串数量和排版区域数量不固定。保留原有院线文案组合和排版自由：片名、宣传语、上映信息、演职员表、署名、环境文案、竖排或透视文字、碎片文字、手写字及文字图像都仍可使用。
    - 所有其他可承载文字的表面都必须使用在该处声明的精确英语文案，或保持空白或不可读。演职员表、署名、证据、地图、表单、票券及档案碎片都仍可使用，但须完整指定文字行，不得使用填充内容、乱码、畸形文字或不可读微小文字。
    - 以下所有清单都是开放式灵感，而非菜单、枚举、预设库、配额、顺序或多选指令。根据故事需要选择、组合、转化或发明方法。只有使用“必须”“每个”“精确”或“不得”等措辞的陈述才是强制要求。
    - 虚构电影内容和海报核心创意都必须专门为请求的内容级别生成。该级别必须塑造前提、冲突、动作、象征、构图、排版、视觉重点及情绪语气；不得复用其他级别的概念，仅改变标签、姿态、衣着或孤立细节。
    - 将每个 Frame 视为同一电影自成一体的并行海报提案，绝非时间顺序场景或分镜节点。海报之间没有信息继承，任何海报都不得引用其他 Frame 或暗示前后推进。每张必须重述独立渲染所需的故事锚点，同时保持片名、核心冲突和母题；当有助于更强概念时，可见阵容、主角重点、宣传语和宣传口吻可以变化。
    - 大幅变化核心图形创意、构图、尺度、配色、图文关系及情绪重点。仅改变摄影角度、调色、服装或背景不算变化。
    - 每张海报围绕一个主导创意手法构建，只保留让其明确可辨所需的辅助元素。可用方向包括但不限于：
    - 标志性物体隐喻：一个故事物体变成具有情绪力量的符号、景观、门口、伤口、时钟、笼子、地图，或容纳主角的不可能容器；
    - 负空间揭示：空白形成第二幅图像、隐藏的脸、身体轮廓、地点、威胁或关系，在第一眼阅读后才显现；
    - 人物主导的精品肖像：心理刻画精确的面容或身体剪影承载宣传，并配一个打破稳定的道具、阴影、反射、色域或排版干预；
    - 环境叙事场景：主角在广阔地点中很小却具有决定性，其建筑、天气、缺席的人群或实景光揭示冲突；
    - 不可能尺度：真实人物面对放大的物体、压缩的城市、无尽房间、纪念碑般的服装，或衍生自故事母题的建筑；
    - 超现实转化：头发变成烟、织物变成地形、雨变成线、房间折叠为物体，或用其他原创转化表达故事，同时人体保持单一且解剖清晰；
    - 分裂世界张力：一个连贯图像包含两个不相容的空间、季节、社会角色或情绪现实，由有意义的实体边界分隔，而非泛化对角切分；
    - 证据与档案：收据、信件、地图、接触印样、涂黑删节、图表、戳记或案卷材料形成直接关联剧情的受控编辑构图；
    - 触感印刷物：丝网印刷、凸版印刷、撕纸、压凸金属箔、渗墨、新闻纸、孔版印刷、绘制的单页海报、木刻式雕刻或做旧院线石版印刷赋予海报实体身份；
    - 文字作为图像：片名字母变成建筑、投下阴影、穿行于主角前后、在场景中切开窗口、遵循透视、从烟中浮现，或作为场景中的真实材料；
    - 色域极简：极端受限的配色、单一剪影或物体，以及精确空间比例制造张力，而非装饰性空洞；
    - 分层概念摄影蒙太奇：精确遮罩的摄影元素组合成一个不可能但可读的隐喻，不复制或扭曲阵容；
    - 类型颠覆：以法证秩序呈现爱情、以居家柔和呈现惊悚、以严峻现代主义几何呈现历史剧情，或其他植根故事的刻意矛盾；
    - 视觉替换：关键物体、开口、阴影、服装或建筑特征替代另一个预期形态，形成与剧情精确关联的视觉双关；
    - 嵌套世界：房间、景观、记忆或冲突出现在故事物体、字形、瞳孔、窗、容器、伤口形空洞或其他有意义边界内部；
    - 剪影容器：一个单一人物或物体剪影容纳电影的场景、威胁、记忆或对立情绪现实，不复制阵容；
    - 缺席与印记：空椅子、压过的床铺、缺失瓷砖、擦除的肖像、人形灰尘空隙、湿脚印或褪色矩形，让缺席力量比直接描绘更强；
    - 图案中断：重复的非人物物体、窗、文件、瓷砖、线、座位、工具或灯光构成场域，被一个有意义的异常打断，编码主角的选择；
    - 物体星丛：若干剧情物体只有在观看海报的距离下才形成脸、地点、人物关系、类似汉字的几何或更大象征图像；
    - 视觉等式：两三幅精心选择的图像像命题、矛盾、原因、代价或两难抉择般排列，而非装饰拼贴；
    - 视觉回文：构图从上到下、从左到右或第二眼阅读时含义不同，同时保持一张连贯海报；
    - 可逆图底：前景和背景交换意义，让观众无需旋转海报或复制人物就发现第二个故事图像；
    - 遮罩与孔口：门、撕紙、钥匙孔、帘、屏风、机器、窗、标题字腔或有机形状只揭示主角或场景中对故事关键的部分；
    - 门槛构图：整个宣传围绕主角必须跨越、拒绝、守护、藏身其后或转化的一道边界组织；
    - 不可能室内：真实房间暗中遵循故事中某个物体、身体轮廓、字母、时钟、地图、乐器或情绪状态的几何；
    - 建筑隐喻：走廊、阶梯、桥、庭院、脚手架、架子、隧道、公寓楼或工厂结构体现压力、分隔、重复、逃离或社会等级；
    - 制图叙事：街道、交通线、河流系统、等高线、产权平面图、星图或手绘路线与主角决策及片名设计融合；
    - 剖切或剖面：建筑、物体、车辆、房间、服装或象征容器打开为故事世界的精确剖面；
    - 法证图解：测量、编号证据、轨迹、时间线、涂黑删节或技术注释创造悬念，同时保持视觉优雅且对应具体剧情；
    - 审查与抹除：黑条、刮除乳剂、移除姓名、遮住的窗、缺失线条、烧纸或涂覆区域，恰好隐藏故事视为危险的内容；
    - 反射矛盾：玻璃、水、抛光金属、漆面、镜子、屏幕或湿路面揭示不同情绪真相，不产生无解释的重复身体；
    - 折射与透镜：棱镜、瓶子、雨、纹理玻璃、冰、热浪、水或光学仪器只弯曲图像中与故事相关的部分；
    - 阴影叙事：物理可信的投影揭示可见人物无法直接展现的威胁、欲望、秘密、片名形状、另一角色或后果；
    - 投影图像冲突：电影、幻灯片、监控、地图、手写字、建筑图纸或自然图案投射在主角和环境上，作为正在发挥作用的故事证据；
    - 强制透视隐喻：摄影机位置将远近元素对齐为一个不可能关系，从海报视点可清晰理解；
    - 从微观到史诗尺度：皮肤、织物、纸张、食物、机械、工艺或天气的极近细节变成故事景观，不失材料真实感；
    - 微缩世界张力：具有触感的比例模型、立体布景、玩偶屋式建筑、桌面重建或模型城市体现控制、记忆、监控或脆弱；
    - 日常物体纪念碑化：普通剧情物体获得压倒性尺度，迫使主角与它形成视觉戏剧性关系；
    - 宇宙与家居碰撞：星辰、日月食几何、天气系统、地质形态或辽阔黑暗因故事特定原因与亲密的居家物体或动作相遇；
    - 时间压缩：季节痕迹、老化材料、重复非人物物体、时钟几何、曝光层或腐朽表面把时长浓缩为一张非连续图像；
    - 悬置后果：在决定性的情绪压力点，碎片、雨、灰烬、纸、玻璃、尘土、线、花瓣或实景碎屑冻结于一个稳定人体状态周围；
    - 极端裁切：面容、手、背部、服装或物体的激进但解剖清晰的局部变得宏大，由排版补全缺失视觉信息；
    - 边缘主角：主角位于意外的边缘或角落，中央空洞、建筑、物体或文字承载冲突；
    - 底部重心的纪念碑感：图像体量和主角落于低处，上方是大面积气氛或文字场，创造尺度、恐惧、崇敬或释放；
    - 顶部重压：标题、建筑、天气、机械或象征性体量从上方压下，同时保留刻意的呼吸空间；
    - 一点透视陷阱：走廊、道路、架子、隧道、电缆、床、窗或文字行汇聚到故事关键人物或空洞；
    - 环形或轨道系统：物体、文字、光、建筑或环境痕迹围绕中心缺席、面容、物体或决定运行；
    - 螺旋下降或上升：构图和排版引导视线经历一个不断收紧或展开的空间运动，不描绘时间连续场景；
    - 非对称编辑网格：严谨的分栏、线条、裁切、留白和图像模块在机构秩序与人的失序之间制造张力；
    - 模块化证据场：同一故事世界的若干非连续碎片组成一套设计过的信息系统，具有一个主导图像且不重复阵容身体；
    - 框中框：窗、屏幕、包装、照片、文件、门洞、帘、搁架或片名字形形成嵌套注意力与受控揭示；
    - 边界侵入：图像、物体、阴影、天气或排版刻意突破海报隐含边缘，表达逃离、污染、记忆或压力；
    - 极端竖向性：高耸建筑、下落织物、雨、烟、标题列、悬挂物体或身体线条，使单页海报形式成为创意不可或缺的一部分；
    - 竖版中的极端横向性：一条窄电影画带、地平线、桌、床、桥或文字横线穿过大片竖向场域，形成受控张力；
    - 对角力系统：阶梯、光、身体线、天气、排版或建筑形成一个主导方向推力，而非任意倾斜构图；
    - 文字巨石：片名像纪念碑物体般占据海报大部，主角、场景或故事证据实体般嵌入字母或穿行其中；
    - 文字空洞：片名由缺失材料、擦除建筑、负空间、光缝、剥落油漆、缺失瓷砖或未印刷纸张形成；
    - 文字阴影：不可见的片名字母仅通过投影、投射光、反射、压凸或表面变形变得可读；
    - 文字透视：片名和宣传语遵循地板、墙、道路、架子、窗、水、织物或建筑的真实透视；
    - 文字遮挡：精心选择的图像元素遮住大字母的小部分，保留即时可读性并创造深度；
    - 文字转化：一个片名字母变为剧情物体、房间、门口、对身体安全的剪影、工具、路线、地平线或象征性伤口；
    - 文字节奏：重复间距、错列基线、竖向堆叠、压缩、扩展或受控套准偏差表达电影的情绪压力；
    - 手写证据：某角色虚构的笔迹、注释、改正、签名或划掉的句子，成为专业排印片名的有限对位；
    - 仅限英语的环境排版：标牌、标签、印章、地图、表单、手写字、包装、屏幕及建筑文字可支持地点与剧情真实性，但所有可读词都必须保持合乎语法的英语；
    - 摄影剪纸拼贴：清晰剪切的摄影平面以可见纸边和受控阴影重叠，创造深度而非杂乱剪贴簿；
    - 撕层考古：剥离的纸、壁纸、海报、织物、油漆、乳剂或印刷层揭示与故事相关的更旧视觉信息；
    - 半透明覆盖：硫酸纸、描图纸、磨砂塑料、丝绸、玻璃、X 光片、投影透明片或湿织物跨不同深度平面承载图文；
    - 模切幻觉：表面上的孔、狭缝、齿孔、折叠、插舌或冲切字形揭示第二图像层，同时仍是可印刷海报概念；
    - 压凸或压凹极简：掠过实体凸起或凹陷片名、母题、地图、疤痕式线条或物体轮廓的光成为核心视觉事件；
    - 金属箔与反射干预：克制的金属、珠光、镜面或全息材料只标记故事中不稳定或珍贵的元素；
    - 丝网印刷化简：两至五种平涂油墨、大胆陷印、叠印及有意识的形状节制，将故事简化为标志性院线图像；
    - 孔版印刷套准偏差：受限的荧光或低饱和油墨、可见网点、叠印和受控偏移创造有活力的独立发行身份；
    - 凸版压力：深压痕、油墨扩散、粗棉纸及触感标题层级，让语言具有实体后果；
    - 做旧石版单页海报：绘画写实、手工分色、风化纸张、笔刷纹理及戏剧性文字唤起虚构发行历史，不复制现有海报；
    - 新闻纸紧迫感：粗半色调、窄分栏、涂黑删节、撕裂标题及有限油墨覆盖，让植根公共信息的剧情具有即时感；
    - 蓝晒或蓝图逻辑：深蓝上的白线和摄影剪影将建筑、证据、规划、记忆或隐藏结构变成宣传系统；
    - 红外、热成像、紫外或 X 光隐喻：具有科学依据的替代成像模式只揭示故事隐藏的热、结构、痕迹或材料差异；
    - 接触印样秩序：一个主导画格周围只有稀疏技术标记或被舍弃的非人物细节，把摄影流程作为剧情证据，而非展示重复人物；
    - 胶片条或放映机逻辑：齿孔、烧片痕迹、换片标记、光锥或光学计时标记成为与记忆、监控、表演或遗失片段关联的结构图形元素；
    - 拓印材料性：石、木、金属、纺织品、刻字、建筑浮雕或现成表面转印为场景特定的强烈触感图像；
    - 剪纸剪影：分层剪纸深度、清晰正负形及受控色彩，把故事物体和建筑变成大胆象征系统；
    - 皮影几何：有关节的物体剪影、半透明幕光及可见支撑逻辑启发构图，不把人物变成畸形木偶；
    - 刺绣与线迹制图：针脚、散线、结、缝及编织网格形成与故事相关的路线、伤口、边界、建筑、天气或片名笔画；
    - 篆刻体块：块状正负形的红色与米白色启发标题和图像结构，不复制历史印章或现有书法；
    - 漆面与金色干预：深邃反光黑、朱砂式红、克制金箔、裂纹及层叠抛光，围绕相关物体或仪式创造奢华张力；
    - 水墨气氛对抗硬朗文字：流动的单色空间、洇染边缘、干笔纹理和一套精确现代排版系统，让传统与当下冲突形成刻意对立；
    - 陶瓷开片网络：釉色、开片纹、修补接缝及烧制纹理组织碎裂、传承、压力或修复；
    - 纺织网格构图：织机结构、褶、格纹、网、蚊帐、编织席或工业织物创造被故事打断的图形矩阵；
    - 植物标本秩序：压制植物、根、种子、标签、季节痕迹或药材处理形成与地点及后果关联的严谨象征档案；
    - 食物与居家材料隐喻：蒸汽、油、面粉、茶渍、米粒、果皮、瓷器、切砍痕或腌藏食材成为情绪精确的图形语言；
    - 工业材料隐喻：锈、油脂、焊光、警示漆、电缆、混凝土灰尘、机器图解、冲孔钢或工厂编号把社会环境带入海报；
    - 水系统构图：潮汐、运河网格、凝水、被淹房间、倒映标牌、涟漪、排水或雨水路径构建图像和排版；
    - 天气作为文字：雪隙、雨迹、烟的断口、云边、霜、尘、灰烬或阳光实体般形成或擦除片名元素；
    - 纯光图像：受控光束、实景光池、投射矩形、反射、阴影边缘或被照亮的尘埃，以最少直白描绘暗示人物和场景；
    - 单色加一种叙事色：一种精确强调色只属于决定性物体、对身体安全的细节、片名元素或后果；
    - 双色或三色冲突：两三种油墨编码对立角色、时间、空间、机构、温度或情绪力量；
    - 近黑色彩海报：极暗但可区分的色调、选择性光泽、一处可读高光和精确排版，鼓励近看但不失缩略图识别；
    - 过曝白场海报：过曝气氛、浅淡材料细节、微弱剪影和一个受控深色文字锚点创造不安或超越感；
    - 彩色剪影：强烈色彩且解剖连贯的侧面或身体形状，成为内部图像、文字或环境证据的主要场域；
    - 反肖像：通过姿势、手、衣物、工具、房间痕迹、阴影或占据空间表现主角，而非传统正面肖像；
    - 直视对峙：一张成熟面孔以心理意图明确的目光面对观众，排版和单一母题打破表面的简单；
    - 受遮挡肖像：玻璃、织物、凝水、物体、阴影、文字或建筑只遮蔽面部与故事相关的部分，同时保持身份清晰；
    - 史诗尺度环境肖像：极小主角锚定宏大的天气、建筑、景观、机械或机构空间，其形状讲述冲突；
    - 亲密物体肖像：双手和一个剧情物体承载身份、职业、关系及利害，不把海报缩减为产品照片；
    - 社会角色碰撞：衣着、工具、地点、姿态和文字有意组合前提中两个不相容的公共身份或职责；
    - 仪式性对称：正面平衡、重复物体、受控手势和正式文字暗示仪式、权力、审判或不可避免；
    - 破坏对称：一个位移物体、斜向视线、缺失字母、改变的光或非对称身体位置，动摇原本严格的仪式系统；
    - 冷面喜剧：僵直构图、平凡细节、情绪中性表情和时机精确的片名位置创造黑色或荒诞幽默，而非卡通式杂乱；
    - 爱情克制：距离、平行线、未发生的触碰、共享负空间、成对物体或中断文字传达欲望，不依赖泛化柔焦图像；
    - 日常中的恐怖：平静日光、居家秩序、整洁排版和一个不可能细节制造恐惧，不使用血腥、尖叫面孔或常规黑暗；
    - 信息驱动惊悚：地图、时间表、证据、空间系统、监控痕迹及缺失数据制造张力，而非武器或爆炸；
    - 历史与现代碰撞：符合时代的人物和场景遇见刻意现代的图形系统，阐明故事张力而不往场景加入时代错误的物体；
    - 精品重映诠释：简约的档案自信、修复的摄影深度、精确排版和一个新发现的象征解读，将虚构电影呈现为文化上历久不衰；
    - 地下宣传：粗粝实体制作、复印层、手工标记、拼贴接缝、有限油墨和急迫层级暗示秘密流通，同时保留设计感；
    - 奢华克制：出色的材料细节、精确间距、精致文字和一个受控图像创造价值，不用泛化黑金装饰；
    - 极繁但受控的密度：大量故事特定物体、纹理和文字碎片形成有意层级，并有一个主导焦点图像，而非无方向视觉噪声。
    - 如果请求的 Frame 数量超过这些示例，发明更多故事特定方向，而非重复布局。不得默认使用悬浮头部、景观上居中全身人物、泛化双重曝光、随机拼贴、脸部蒙太奇、发光地平线、青橙调色、爆炸碎屑或常规流媒体缩略图。
    - 每张海报都必须可见地包含 Theme 的精确英语片名、为该设计原创的英语宣传语、原样文字 "COMING SOON" 或一句简短英语上映信息，以及紧凑的虚构英语演职员表。虚构所有署名姓名和公司；绝不使用真实演员、导演、制片厂、电影节、奖项、影评人、品牌、标志、分级、桂冠、评论、网址或社交账号。
    - 让片名主导、宣传语从属。指定字体类别、精确位置、尺度、对齐、间距、层级、颜色、材料或印刷行为、图像互动及足够对比。排版必须参与概念，而非漂浮在未用空间中。文案保持克制且完全可读。
    - 除非另有请求，使用竖版院线单页海报。在缩略图和完整尺寸下都建立清晰的第一阅读、第二阅读及文字路径。让故事特定的透视、光、建筑、天气、材料、服装、道具和后期工艺支持一个主导构想。规模感可来自克制、象征、负空间、排版或空间隐喻，而非奇观。
    - 保持摄影皮肤、头发、织物和材料可信。将每张海报视为一个物理状态：每条可见肢体拥有一个位置、朝向、视线、稳定姿态及相容任务，具有自然可及范围和可见支撑。转化环境、文字、阴影、负空间、衣物边缘、物体或非具象材料，绝不转化人体解剖。不得制造多余肢体、重复面孔、幽灵身体、镜像克隆、畸形文字或冲突状态。
    - 每个最终提示词写成一个简洁英语段落。先写故事钩子，再描述一个海报概念、阵容、构图、象征手法、场景、照明、配色、排版和位置、上映信息、虚构演职员表及可见印刷或后期工艺特征，暂不写出精确文案。以采用冒号和分号条目的专用图中文字段落结尾。优先呈现一个难忘的核心构想。结果必须明确是专业设计的院线海报，而非加字剧照。
    - 返回前默默确认 Frame 仅使用 ASCII 英语正文；每个片名、宣传语、上映行、演职员行、署名、标牌、标签、文件及环境词都在最终图中文字段落中以精确拼写和位置声明一次；文案外无引号；不出现未声明、非英语、畸形、占位或乱码文字；所有承诺的文案保持可读；原有院线设计特征完整保留。
