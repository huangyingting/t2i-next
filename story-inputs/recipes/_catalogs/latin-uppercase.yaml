- id: z
  themes:
  - Z：3 名成年人，分别构成上横杠、下行斜线和下横杠。
  - Z：一条上方水平线、一条下行斜线和一条下方水平线通过两个清晰拐角连接。严格使用三名身体完整且伸直的成年人，每人构成一条笔画。第一人横卧，头位于左上端点，并拢双脚位于右上拐角。第二人斜卧，头在第一人的双脚旁，并拢双脚位于左下拐角。第三人横卧，头在第二人的双脚旁，并拢双脚位于右下端点。每人都保持双臂贴紧躯干、双腿并拢。两个拐角都保留可见的小间隙。绝不能让一个人弯曲横跨两条笔画、使肢体断离、创造第四人的局部身体，或沿边缘放置孤立的一对腿或手臂。
  frames:
  - Z：3 名成年人，分别构成上横杠、下行斜线和下横杠。
  - Z：一条上方水平线、一条下行斜线和一条下方水平线通过两个清晰拐角连接。严格使用三名身体完整且伸直的成年人，每人构成一条笔画。第一人横卧，头位于左上端点，并拢双脚位于右上拐角。第二人斜卧，头在第一人的双脚旁，并拢双脚位于左下拐角。第三人横卧，头在第二人的双脚旁，并拢双脚位于右下端点。每人都保持双臂贴紧躯干、双腿并拢。两个拐角都保留可见的小间隙。绝不能让一个人弯曲横跨两条笔画、使肢体断离、创造第四人的局部身体，或沿边缘放置孤立的一对腿或手臂。
  - 对于由三名成年人构成的 Z，额外核验：三具不同的完整伸直身体分别构成上横杠、斜线和下横杠。如果一个人横跨两条笔画、任何肢体断离，或暗示存在第四人的局部身体，则拒绝该画面。
  cast:
    total: 3
    min_female: 1
    min_male: 1
