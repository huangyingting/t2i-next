  - Y：两条上方斜线在一个中央接点相接，并继续成为一条下方竖笔。
  frames:
  - Y：3 名成年人，分别构成两条上方斜线和一条下方竖笔。
  - Y：两条上方斜线在一个中央接点相接，并继续成为一条下方竖笔。
