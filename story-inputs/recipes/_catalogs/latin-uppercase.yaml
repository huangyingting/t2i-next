- id: v
  themes:
  - V：2 名成年人，分别构成左斜线和右斜线。
  - V：两条长斜线向下收束到一个狭窄低点。两具完整伸直的人体各构成一条斜线：左侧成年人的头部位于左上端点，并拢的双脚终止于下方中央顶点；右侧成年人的头部位于右上端点，并拢的双脚终止于同一下方中央顶点。两对双脚几乎相接，但留有可见的小间隙。两人都保持双臂伸直贴紧躯干、双腿并拢。手、手指、手肘、肩或头部均不得构成下方顶点。不得将手臂举过头顶或向外伸展，不得分腿、交叉身体、让躯干相触，也不得形成 X 形或星形姿态。
  frames:
  - V：2 名成年人，分别构成左斜线和右斜线。
  - V：两条长斜线向下收束到一个狭窄低点。两具完整伸直的人体各构成一条斜线：左侧成年人的头部位于左上端点，并拢的双脚终止于下方中央顶点；右侧成年人的头部位于右上端点，并拢的双脚终止于同一下方中央顶点。两对双脚几乎相接，但留有可见的小间隙。两人都保持双臂伸直贴紧躯干、双腿并拢。手、手指、手肘、肩或头部均不得构成下方顶点。不得将手臂举过头顶或向外伸展，不得分腿、交叉身体、让躯干相触，也不得形成 X 形或星形姿态。
  - 对于由两名成年人构成的 V，额外核验：两颗头分别位于两个上端点，两对并拢双脚几乎相接于唯一的下方顶点，四条手臂都贴紧两具躯干，且没有指尖、手、头或交叉身体构成该顶点。
  cast:
    total: 2
    min_female: 1
    min_male: 1
