- id: x
  themes:
  - X：4 名成年人，分别构成在留空中心周围相汇的四条半斜线。
  - X：四条半斜线向一个留空的中央小菱形周围汇聚。严格使用四名身体完整且伸直的成年人，每人构成一条射线。左上成年人的头部位于外侧左上端点，并拢双脚在抵达中心之前停下；右上成年人采取镜像路径。左下和右下成年人将头部置于两个外侧下端点，并拢双脚在抵达中心之前停下。四对双脚围绕一小块菱形空地面，但不得进入其中。每人都保持双臂贴紧躯干、双腿并拢。任何身体都不得穿过中心、与其他身体重叠、分腿、将手臂向外伸展或形成星形姿态。
  frames:
  - X：4 名成年人，分别构成在留空中心周围相汇的四条半斜线。
  - X：四条半斜线向一个留空的中央小菱形周围汇聚。严格使用四名身体完整且伸直的成年人，每人构成一条射线。左上成年人的头部位于外侧左上端点，并拢双脚在抵达中心之前停下；右上成年人采取镜像路径。左下和右下成年人将头部置于两个外侧下端点，并拢双脚在抵达中心之前停下。四对双脚围绕一小块菱形空地面，但不得进入其中。每人都保持双臂贴紧躯干、双腿并拢。任何身体都不得穿过中心、与其他身体重叠、分腿、将手臂向外伸展或形成星形姿态。
  - 对于由四名成年人构成的 X，额外核验：四具不同的完整伸直身体在留空的中央菱形周围形成四条半斜线。如果有躯干穿过中心、任意两具身体重叠、任何手臂或双腿向外张开，或者呈现的完整人物少于四名，则拒绝该画面。
  cast:
    total: 4
    min_female: 1
    min_male: 1
- id: y
  themes:
