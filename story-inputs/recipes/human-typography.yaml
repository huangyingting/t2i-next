    - 画面验收：12. 恰好存在一种微动，且不改变字形；以及
    - 画面验收：13. 字母作为平面剪影，在缩略图尺寸下仍可辨认。
    - 画面验收：任何主题或画面如果出现错误字母、多个字母、多余或缺失的人物、装饰性旁观者、不完整笔画、缺失字腔、封闭开口、没有字形功能的普通瑜伽姿态、含糊肢体位置、不安全叠压、断离的解剖结构、斜机位、瑜伽垫、图案地面、道具笔画、阴影笔画、印刷字母，或没有视觉依据的可读性声明，都必须拒绝并重写。
    - 不得在标题、前提、风格或画面正文中提及主题标识符或字母序号。只能使用输入计划为该主题分配的字母。
    - 使用所分配字母规定的精确最低成年总人数。
