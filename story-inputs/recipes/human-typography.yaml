id: human-typography
description: |
  创作一套完整的视觉字母表，由风格多样、精致、超写实的成年人照片组成。每个主题围绕 A 至 Z 中的一个大写英文字母，以该字母规定的最少成年人数，通过完整身体、协调姿态、人与人之间的间距和负空间共同构成字形。

  这是人体姿态造字，不是拼写单词，也不是常规文字排版。每幅画面只包含一个字母。人体本身必须让该字母在缩略图尺寸下仍清晰无误。
generation:
  theme_count: 1
  frames_per_theme: 6
  output_language: chinese
  content_level: aesthetic
authoring:
  themes:
    common:
    - 字形优先：每个主题和画面都必须严格遵循以下优先顺序：
    - 字形优先：1. 唯一指定的大写字母在缩略图尺寸下清晰可读；
    - 字形优先：2. 每名选定成年人对该字母都具有可见且不可替代的作用；
    - 字形优先：3. 躯干、手臂、双腿、接触和负空间符合字母的拓扑结构；
    - 字形优先：4. 完整成年人的数量符合该字母规定的笔画人数；
    - 字形优先：5. 解剖、支撑、成年身份和身体安全保持清楚；
    - 字形优先：6. 表情、时装、光线和氛围赋予字母原创的广告视觉身份。
    - 字形优先：如果造型削弱辨识度，就简化造型。漂亮却无法读成指定字母的群像无效。
    - 阵容契约：每名选定人物都必须是年满 25 岁、明确成熟且具有原创身份的成年人。一个字母使用两人或更多人时，至少包含一名女性和一名男性。在三人和四人字母之间变化女性占多数、男性占多数和人数均衡的组合，避免整套字母表重复一种性别安排。
    - 阵容契约：每个字母严格使用其分配目录条目规定的成年总人数，不得增加人物、重复形象、倒影、肖像、屏幕、剪影或背景人物。每个人只以完整全身出现一次，并且恰好承担一条不可替代的主要竖笔、横杠、斜线、平滑弧线或尾笔。手臂和双腿可以细化该人物承担的笔画，但不得形成第二条空间上分离的笔画。
    - 阵容契约：不得把参与者作为旁观者或装饰性配角。任何人都不得被复制、同时占据两个不相容的位置、变成脱离身体的局部，或消失在另一名参与者身后。
    - 字母专属人数：不得要求一名成年人占据两条笔画来减少人数，也不得为了让姿态更容易实现而增加人数。精确人数以及一个完整身体对应一条主要笔画的关系都是字母身份的一部分。
    - A 至 Z 的字母拓扑：以下拓扑是不可妥协的视觉骨架。人体姿态可以柔化几何形状，但所有明确命名的笔画、曲线、接点、开口、字腔和末端都必须可见。
    - 人体姿态构造：将各字形拓扑转化为解剖可信的成年人姿态。以躯干和并拢双腿构成有力的竖笔；以伸直的手臂构成横杠和斜线；以弯曲的手肘、膝盖、侧向蜷曲、弧形双臂和协调的人体弧线构成圆腹与曲线；以刻意安排的人体间隙构成字腔和开口。
    - 人体姿态构造：明确每名参与者承担的一条主要笔画或平滑弧线。每条肢体都必须能够从肩或髋连续追踪到手或脚。手臂和双腿在视觉上必须从属于该条指定笔画，并与之连续相连。
    - 人体姿态构造：每名参与者的贡献必须由实际相邻的身体部位形成一条空间连续的解剖路径。即使两条笔画在肩、肘、髋或膝处相接，也不得让同一个人承担两条主要笔画。不得先用某人的躯干构成上方或左侧笔画，再将其肢体重复用于与躯干分离的远处下方或右侧笔画。不得在完整身体的主人无法实际占据的位置描述手、臂、脚、腿、骨盆或局部躯干。
    - 人体姿态构造：接点处的手、脚、肩或安全的肢体外侧可以接近或轻微主动接触。任何参与者都不得站、跪、坐在他人的头、颈、脊柱、胸、腹、骨盆或无支撑的关节上，也不得对这些部位施加硬性压力。任何身体都不得叠躺在另一具身体上。
    - 人体姿态构造：曲线字母可以用数具协调排列的身体形成平滑弧线，但曲线必须保留符合拓扑的明确开口或字腔。不得用印刷轮廓、绳索、丝带、道具、阴影、烟迹或说明文字替代难以形成的曲线。
    - 人体姿态构造：拒绝使用“suggests,”、“evokes,”、“resembles,”、“hints at,”或“approximately forms.”等含糊表述。明确写出完成字形的躯干轴线、手臂方向、双腿方向、弯曲、接点、端点和负空间。
    - 语义美术指导：赋予每个字母一种原创的情绪与视觉诠释。字母的发音联想、熟悉象征、拓扑或动势特征可以启发概念，但仍禁止可见的常规单词和说明文字。
    - 语义美术指导：整套字母表的情绪方向应多样，包括坚定、轻快、好奇、戏剧化、充满电流般活力、强烈、优雅、和谐、标志性、欢欣、富于动势、明亮、宏伟、夜色感、开放、顽皮、质疑、反叛、感性、舞台化、振奋、胜利、狂放、对抗、渴望或其他具体基调。不得机械地把这些例子绑定到对应的首字母。
    - 语义美术指导：为每名成年人设计不同但协调的表情和视线，例如克制的微笑、抬眉、平静专注、挑衅般直视、欣喜而睁大的目光、内向凝视或其他精确表演。保持字形要求的头部位置。
    - 语义美术指导：不同主题采用不同服装材质，例如漆亮弹力织物、天鹅绒、金属质感针织、缎面、哑光氯丁橡胶、细密亮片、不透明底层上的半透明罩层，或其他不破坏轮廓的纺织物。为整组人物选择统一色相体系，并与字形背景保持强烈对比。
    - 语义美术指导：以柔和正面补光配合一种互补色轮廓光或边缘强调光。可选择深红配青色边缘、钴蓝配琥珀色、翠绿配金色、紫罗兰配酸绿，或其他有意设计的对比。阴影保持紧凑，绝不能让阴影代替缺失的字母笔画。
    - 外围氛围与微动：装饰性氛围只允许出现在字母外接边界之外的周边和角落负空间中。可用少量金属彩屑、花瓣、羽毛、树叶、彩色薄雾、微小反光碎片，或不含线条与文字的柔和投影色光。
    - 外围氛围与微动：恰好加入一种克制的微动，在不改变字母几何结构的前提下强化主题，例如同步绷直脚尖、手指张力、共同呼吸造成的可见衣物张力、受控微风带动的局部发梢，或沿一条清晰向量飘动的外围颗粒。
    - 外围氛围与微动：不得加入人体运动模糊、随意肢体移动、大幅布料拖迹、粉末、水、烟、绳索、丝带或穿过字母的道具。去掉任何进入字腔、封闭开口、制造虚假笔画或削弱轮廓的效果。
    - 主题契约：每个主题定义一套完整的人体字母系统：
    - 主题契约：一个精确的大写字母；
    - 主题契约：分配目录条目规定的该字母精确成年总人数，每名参与者承担一条不可替代的主要笔画或弧线；
    - 主题契约：完整的字母拓扑与人体到笔画的映射；
    - 主题契约：一套安全的支撑与接触系统；
    - 主题契约：一个无缝、高对比的字形背景；
    - 主题契约：一套协调的时装材质和色板；
    - 主题契约：一个正投影俯拍或完全正面的机位；
    - 主题契约：一套表情与视线编排；
    - 主题契约：一套补光与互补色轮廓光系统；
    - 主题契约：一种仅位于外围的氛围处理；以及
    - 主题契约：一种克制的微动。
    - 主题契约：为主题拟定简洁原创的标题，不得只用字母本身，也不得让标题出现在画面中。在不超过两句的前提中，写明字母、精确成年总人数、性别组合、身体几何、接点、字腔和支撑。风格必须定义情绪方向、服装材质、色板、机位、光线、外围氛围和微动。
    - 完成整套字母覆盖后再次使用字母时，为重复字母赋予显著不同的姿态、情绪、服装、灯光和环境系统。
    - 不得在标题、前提、风格或画面正文中提及主题标识符或字母序号。只能使用输入计划为该主题分配的字母。
    - 根据所分配字母的精确成年总人数以及最低女性、男性人数，独立确定每个主题的阵容。不得给 A 至 Z 统一套用同一种人数或性别比例。
    - 使用所分配字母规定的精确最低成年总人数。
