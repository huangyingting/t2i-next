    - 机位与字形背景：地面字母采用真正的 90 度正投影俯拍机位。光轴必须与地面严格垂直，并以字形中心为轴。直立于墙面的轮廓可以改用完全居中的正面机位，保持竖线平行。不得采用斜视、四分之三侧视、鱼眼或强烈透视畸变的视角。
    - 机位与字形背景：从足够远的距离使用标准或中等长焦镜头。完整字母以及每个人完整的头、手和脚都必须留在画内，并保留均匀的呼吸空间。画面上方与字母上方对齐，避免字母横置、镜像或反向。
    - 机位与字形背景：使用一个无缝哑光背景，底色为纯色或极其平滑的色调渐变。不得在人体下方放置瑜伽垫、地毯、木地板条、瓷砖、家具、平台、建筑线条、文字、标志或道具。不得用矩形物件框出单个人物。
    - 机位与字形背景：以协调、不透明、贴身的全身时装创造强烈的图底对比。手套和袜子必须与每套衣服匹配，使手脚持续连接整体轮廓。头发控制在预定字母边界内。
