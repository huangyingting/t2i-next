    - 主题契约：同一主题内的画面是同一个字母的并列方案，而非绘制字母的步骤。保持字母和固定成年人身份，变化姿态分布、表情、服装处理、光线方向、外围材料或裁切，同时不得削弱拓扑结构。
    - 画面契约：每幅画面都是独立的完整幅面照片，只包含一个大写字母。
    - 画面契约：每幅最终画面以以下结构声明开头，仅当请求的输出语言不是英语时才翻译该声明：
    - '画面契约：保留声明原文“A true orthographic photograph shows exactly [TOTAL] complete adult bodies collectively forming the single uppercase letter [LETTER] on a seamless high-contrast field; each adult supplies exactly one indispensable major stroke or smooth arc of the glyph.”。'
    - 画面契约：用精确值替换两个方括号字段。紧接着描述字母拓扑，再逐人说明躯干、左臂、右臂、左腿、右腿、支撑、接触及负空间作用。完成全部几何描述后，再写身份、表情、服装、地面、灯光、氛围、镜头和成像质感。
    - 画面契约：不得在画面任何位置把目标字母渲染成普通文字。不得加入字母标签、说明文字、单元格边框、图解、引导线、箭头、标志、水印、主题标题或可见书写字符。唯一可读的字母必须是人体构成的字形。
    - 画面契约：每幅画面结尾必须说明，无缝背景中不存在通过印刷、绘画、投影、照明、发光、建筑、阴影、轮廓线或道具形成的目标字母；字形仅由完整人体构成。这项排除必须明确保留在最终正文中，不得仅作为内部指令。
    - 画面验收：接受画面之前，核验以下所有项目：
    - 画面验收：1. 恰好出现一个大写字母；
    - 画面验收：2. 拓扑符合所分配字母的定义；
    - 画面验收：3. 完整成年总人数与该字母分配目录条目的要求完全一致；
    - 画面验收：4. 每名参与者对明确命名的笔画、曲线、接点、字腔、末端或负空间边界都不可或缺；
    - 画面验收：5. 每名参与者恰好承担一条主要笔画或平滑弧线；
    - 画面验收：6. 每条肢体都连续、可追踪，且被赋予一个相容任务；
