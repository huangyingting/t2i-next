id: motion
requirements:
  content_levels: [hardcore]
description: '创作多样化、超写实、具有电影感的成人硬核色情摄影主题，以强劲且具有物理动因的运动模糊为特征。每幅图像都应仿佛捕捉于爆发性的一瞬间，具有诱惑性的视觉冲击、富于想象力的动作、丰富的环境、连贯的人体结构，同时没有真实伤害或失控。


  以下所有列表均为灵感，而非菜单、枚举、预设库或多项选择指令。可以组合相容的示例、加以变换或创作新的等效方案。只有使用“必须”（"must,"）、“每个”（"every,"）、“精确”（"exact,"）或“不得”（"do not"）的陈述才是强制要求。


  严格使用所要求的阵容，不得增加任何人。每个人都必须是明确成熟、年满 25 岁、具有原创面孔的中国成年人。不得描绘未成年人、外貌年轻的虚构角色、名人、公众人物或其他可识别的真实人物，也不得使角色与其相似。


  每位参与者都必须保持清醒、主动自愿、相互回应并能够停止。通过有意的眼神接触、引导的手、相互抓握、自行选择的姿势和协调运动表现这一点。不得使用失去意识、醉酒或药物影响、惊恐、受伤、出血、真正痛苦、被迫无助、非自愿窥视或无法逃脱的束缚。'
authoring:
  themes:
    common:
    - '每个主题均置于中国境内不同的私密场所或封闭片场。灵感包括霓虹酒店套房、老上海公寓、镜面舞蹈室、废弃剧院、营业时间以外的夜总会、风暴中的温室、瓷砖浴室、摄影棚、列车包厢布景、货运电梯布景、工业阁楼式空间、雕塑工作室、传统宅邸、私人影院，或为该主题创造的协调混合空间。'
    - '为每个主题创作一个简洁且共用的情境设定、阵容、地点和视觉语言。将每幅所要求的画面视为同一场成人拍摄中的独立备选捕捉，而非前后相继的序列。'
    - '在主题之间变化外貌、体型、头发、服装、关系动态、露骨行为、动作编排、运动方向、模糊来源、曝光、相机、配色、照明、地点、季节、天气和时间。避免普通卧室、居中的目录式构图、被动斜躺、静态跪姿、重复的后入姿势、固定平视机位和相同的闪光处理。'
  frames:
    common:
    - '每幅画面都必须已经呈现完整明确的成人硬核色情互动，绝不以准备、暗示、普通裸体或被动事后状态替代。每位所要求的成年人都必须在自愿的插入、口部或手部刺激、玩具使用或其他适合所要求阵容的露骨互动中，具有可见的主动角色。'
    - '任何文字未直接点明并可视化描述相关人体部位及当前露骨接触的画面，都必须拒绝并重写。亲吻、拥抱、撕扯衣物、裸体、身体仅仅紧贴，或朝被遮蔽的“连接点”看去，都不合格。开篇时露骨行为必须已经在进行。衣物和脱衣可以对运动作出反应，但绝不能替代硬核色情中心。'
    - '每幅画面都必须呈现可辨的运动模糊因果链：点明运动中的发梢、衣物、道具、液体、光线、家具或相对相机运动的背景；说明其运动方向和物理原因；仅沿该非人体结构路径设置定向模糊。通过闪光或跟随摇摄，使两个完整人体及决定性接触保持为单一、锐利的视觉锚点。'
    - '绝不在头部、面孔、颈部、躯干、乳房、骨盆、生殖器、臀部、手臂、手、手指、腿、脚或任何人体轮廓上使用模糊、重影轨迹、重复轮廓、双重曝光或多重曝光状态。每位所要求的人物只呈现一个身体：一个头、一个躯干、两条手臂、两只手、两条腿和两只脚，关节与手脚指趾正常。运动模糊绝不能遮蔽人数、人体结构、支撑、接触或插入路径。'
    - '保持人体结构和物理关系连贯：插入深度、骨盆对齐、四肢、平衡、重量转移、支撑点、布料张力、头发方向、反射和液体轨迹都必须符合运动与重力。不得出现矛盾手势、不可能的关节、漂浮身体或无支撑姿势。'
    - '将每幅画面视为一个瞬间的一次曝光。将每个人固定在一个位置、距离、身体朝向、凝视目标和当前姿势上。每只手、脚、嘴以及每条承重肢体只安排一项相容任务。所有接触保持在自然可及范围内，目光与头部朝向一致。'
    - '在描述运动效果之前，仅一次描述最终人体姿势。保持每条肢体都可从肩部或髋部追踪到手或脚，关节彼此分离且可见。使用展开的轮廓与简单的接触路径。接受文字前，追踪身体之间及身体与道具之间的接触关系图；只有每次伸展、肢体分工、接触、目光和支撑均明确无歧义才接受。'
    - '每幅画面赋予一个主导运动矢量，以及一个克制、清楚可辨的人体动作。身体以闪光凝固在一个稳定的最终姿势中，而发梢、衣物、液体、道具、灯光或背景承载可见模糊。不得描述重复的人体轮廓或身体运动的多个阶段。'
    - '使用简单、稳定且易于图像生成器理解的动作编排：双脚着地站立、坐姿、跪姿、侧卧、仰卧、俯卧，或由家具牢固支撑且四肢清晰分开的姿势。每位成年人都在宽阔固定的地板、床、座椅或墙面上支撑自己的身体。双脚、双膝，或整个背部或躯干稳稳贴在该表面。膝盖和脚保持普通的低位活动范围。让每位成年人有一只清楚可见的支撑手，以及一只清楚可见的互动手。将想象力投入环境、光线、表情、头发、布料、液体和道具，同时保持人体几何简单。'
    - '头发、衣物、液体和道具必须响应拍摄瞬间明显正在作用的力，例如固定风扇、敞开的窗户、风暴气流、落水、重力、振动或移动光线。不得用先前发生的身体运动解释当前模糊。没有同时可见的原因，任何物体都不得漂浮或形成拖影。'
    - '使用明确的视觉层级：首先是锐利、情绪强烈的面孔与目光；其次是露骨互动和干净的身体轮廓；第三是最强烈的非人体结构运动轨迹；第四是产生反应的道具与建筑。使两人作为独立身体保持可辨，肢体重叠尽量少。至少一张脸必须通过近距离、聚光或无遮挡的对角线占据主导，而不是通过重复倒影实现。'
    - '表情必须强烈、诱人、具体、不对称，并与动作峰值相连。灵感包括猎食般的眼神接触、扩张瞳孔、权力变化时扬起的眉毛、紧咬下颌间浮现的咧嘴笑、屏住呼吸时张开的嘴唇、刻意抵住牙齿的舌头、张开的鼻翼、面颊紧张、湿润双唇、绷紧的颈部肌腱和硬闪光眼神光。避免空洞凝视、泛化的闭眼快感、反复张嘴、可互换的表情，或所有可见成年人均无目的地望向别处。'
    - '根据物理合理性，通过弯曲用力的手指、发白的指节、紧绷的大腿、抬起的脚跟、压缩的坐垫、移位家具、拉伸布料、汗水、潮红皮肤、可见呼气、唾液丝或定向液滴表现用力。'
    - '使用后帘或前帘同步闪光、克制的慢快门拖影或轻柔跟随摇摄，创造可信的机内运动效果，同时保持每个人体全身锐利且只有一个。优先选择约 35-85mm 镜头带来的正常透视中景或中近景。避免极端广角畸变、严重透视缩短、陡峭俯视压缩、横扫身体的甩镜、旋转相机、横穿身体的前景，以及穿过关节的裁切。'
    - '使用可触的模拟影像质感，而非干净的商业渲染：增感 35mm 颗粒、中画幅纹理、过期或交叉冲洗胶片、混合光下的钨丝灯型胶片、跳漂、光晕、闪光泛光、色差、漏光、划痕或高 ISO 彩色噪点。仅使用相容的效果。'
    - '以一个主色和一个对比强调色构建强烈配色，例如琥珀对青黑、钨丝橙对石油蓝、漆红对深绿、洋红对冷钢色、酸绿对紫色，或月光青对烛光金。使用闪光、场景实用灯、霓虹、灯笼、投影仪、移动聚光灯、火光、月光或水面反射光，在湿润皮肤、玻璃、金属、丝绸和液滴上产生锐利面部眼神光与移动高光。'
    - '通过前景、动作平面和背景分层，使环境丰富而可辨。通常放置五到九件协调的道具。每幅画面必须包含一件明显移动的动态道具或元素、一种不呈现人物的光反应材质、一处使动作可信的宽阔结构支撑，以及一件通过位置变化记录故事的连续性道具。'
    - '道具灵感包括停放并锁定在远离身体处的行李车、迷你吧、浅碟香槟杯、转盘电话、折屏、吊扇、固定的天鹅绒躺椅、衣架、垂帘、追光灯、迪斯科球、服装挂杆、落地风扇、投影仪、彩带、置于身体区域之外的 C 型灯架、亚克力棱镜、闪光灯头、铜盆、喷雾喷嘴、藤蔓、灯笼群、珠帘、系缎带的铃铛、镀铬栏杆、警示灯、雨幕和地灯。依据地点组合或创作道具；不得使用镜子或反光表面呈现第二张脸、第二条肢体、第二个躯干或完整人体。'
    - '让一个主要动作引发一个可辨的非人体结构反应：长袍擦过珠帘、落地风扇吹起布料，或落水击中固定板后分散为闪光照亮的液滴。所有道具均置于肢体路径之外，避免移动平台、滚动支撑、秋千、不安全机械、危险高度、失控人群或不知情旁观者。'
    - '每幅画面都以完整稳定的姿势开始，直接呈现自身的露骨互动。画面之间变化表情、相机、衣物、光线、液体、道具和简单姿势类别，但最终文字中绝不提及此前画面、先前身体位置、姿势改变、过渡或事后。'
    - '在整个主题中保持身份、成熟外貌、建筑、服装逻辑、主要道具和视觉语言一致。赋予每幅画面自身的当前布局，不解释物体或身体如何到达那里。不同画面之间改变非人体结构的模糊载体和简单轮廓，而不是重复同一种效果。'
    - '每条最终提示词都必须明确传达当前非人体结构运动的原因和方向、局部定向模糊、每位所要求人物作为具备正常人体结构的单一锐利身体、锐利面孔与目光、自愿信号、直接点明的可见人体部位及硬核色情接触、单一瞬间的空间逻辑、宽阔独立支撑、正常透视相机、分层道具和每位参与者的主动反应。独立核验每幅画面。仅接受单一当前姿势，配以展开可追踪的四肢、干净轮廓、一个令人难忘的表情、一种出人意料的环境运动，以及一个明显作出反应的环境。'
