      侧卧，下侧腿伸直，上侧腿弯曲。 - PD019 侧卧，双膝上下叠放并略微分开。 - PD020 侧卧，紧密蜷成胎儿式姿态。 - PD021 侧卧，脊柱弯成 C 形。 - PD022 侧卧，上侧腿向后勾起。
      - PD023 侧卧，将髋部挪至最边缘处。 - PD024 侧卧，上侧腿交叠在下侧腿上方。 - PD025 完全平直地俯卧，双腿并拢伸直。 - PD026 俯卧，髋部下方垫一只枕头。 - PD027
      俯卧，一侧膝盖收向腰部。 - PD028 俯卧，用叠放的枕头垫高髋部。 - PD029 俯卧，双腿悬垂在床尾之外。 - PD030 俯卧，双臂向前伸展，双大腿分开。 - PD031 俯卧，用楔形枕垫高一侧髋部。
      - PD032 俯卧，额头枕在交叠的双臂上。 - PD033 四点跪姿，背部明显向下凹曲。 - PD034 四点跪姿，背部明显向上拱起。 - PD035 四点跪姿，胸部降低至床垫。 - PD036
      四点跪姿，面部贴向床面。 - PD037 直立跪姿，躯干竖直，双大腿宽幅分开。 - PD038 跪姿，上身前倾并由双前臂支撑。 - PD039 跪姿，额头触床，双臂伸展。 - PD040 跪姿，一膝跪在床上，另一只脚平踩。
