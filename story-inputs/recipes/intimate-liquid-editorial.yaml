    - 自然雨只能直接落在露天空间、无顶庭院、开启的天窗或明确敞开的屋面缺口下。完整 玻璃顶、封闭车顶、实体屋檐或密闭窗户外侧的雨水只能沿其外表面流动，不能同时穿过 屏障落到室内人物或地面。室内冷凝水只能贴着玻璃或墙面缓慢下流，不能变成空中雨幕。
