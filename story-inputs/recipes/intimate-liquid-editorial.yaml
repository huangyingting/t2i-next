      硬质湿滑场景中必须由手或稳定底座持续控制，不能自由滚落。
    - 同一 主题 的全部 画面 是同一视觉概念的平行拍摄方案，不按时间推进。人物身份、 地点、承载面、服装、主要姿势、液体来源和灯光逻辑保持一致；不同 画面 可以在 正上方俯视、高位、平视、低角度仰视、侧面轮廓、四分之三视角、水面线
      和 细节 视点家族之间切换，也可以改变相机高度、绕人物方位、主体裁切尺度、可达手势、视线、 表情强度、液体瞬间、液滴密度、道具落点和受控运动轨迹。
    - 每个 画面 必须独立完整重述全部可见事实，包括：
    - 水、尿液、阴道液体、精液、玩具储液、汗和其他湿润高光必须在视觉上相互可区分且 来源明确。不得把喷嘴、软管、控制器或支架固定为每张图的必选元素， 也不得让设备遮住面部、关键姿势、液体起点、接触中心或退出路径。
    - '- 所有成年人物各自唯一且前后一致的精确整数年龄、性别、外观、服装与角色；'
    - '- 地点、边界、入口、承载面和安全状态；'
    - '- 液体或器具为何属于该地点、如何供给或产生、如何触发以及如何排走或收集；'
    - '- 视点家族、相机高度、俯仰角、绕人物方位、焦段、主体比例、空间层次与构图；'
    - '- 完整可追踪的头—躯干—骨盆—四肢关系和所有承重点；'
    - '- 主要液体的准确类别、解剖或装置来源、连续路径、形态、重力、反光和落点；'
    - '- 性玩具的完整可见形态、握持或固定点、控制方式、接触或插入边界，以及与液体来源的 单一关系；'
    - '- 至少三项身体—材质—空间接触；'
    - '- 主光、色温关系、曝光冻结或运动策略和调色；'
    - '- 当前 内容等级 的可见衣着与动作；'
    - '- 至少四项可见面部表情线索。'
    - 相邻 主题 不得重复年龄段、体型、脸型、发型、妆容、服装轮廓、造型主色组合、姿势家族、双腿关系、支撑手或相机方位。不得退化为同一白色软垫、床头、白衣仰卧 V 形及中央水冠的换色、换妆或换水滴；也不得整批只有年轻纤瘦、平坦腹部、黑色波波头及紧身连体服。
    - 每个地点至少具有三项可见环境证据，不用“摄影棚”“房间”“床”或“平台”标签代替。人物身体液体或成人玩具仅在私人浴室、酒店浴室、独立湿房、私人水疗套间、带地漏淋浴区、封闭私人泳池湿区、具有集液盘和排水口的原生专业湿景棚，或完整防水并铺吸水层的私人卧室床、酒店套房床出现。
    - 不得用私人、锁闭、僻静、临时封场、废弃地点、艺术装置或拍摄现场等词将中庭、温室、广场、街道、农地、屋顶、装卸区、舞蹈室、健身房、文化场所、交通工具或雪地变为兼容地点；不得先选这些地点再改名为临时、封闭、私人、电影或专业湿景棚。场景合理性高于地点、水型、器具和构图多样性，宁可重复兼容湿区。
    - 每幅画面只有一个活动液体来源、一个可见喷流、流束、喷雾、倾倒或液体运动事件，禁止两源组合、交叉、合并、汇合或同步。人体液体流动时，淋浴喷头、软管、水龙头、环境喷雾和储液玩具须关闭；静止背景水不产生第二个事件。不出现多个互不相关的露骨接触中心。
    - 液体来源、器具连接或解剖起点、人物动作和排水落点须全部可见且连续。来源及器具必须属于场所正常用途，不得为喷射凭空增加雨淋管、吊桶、喷头阵列、倾倒板、软管或复杂水路。临时湿景装置必须同时显示储水、低压供水、固定、触发、防滑和排水，不用“艺术装置”“时尚拍摄”或“定时释放”跳过物理因果。
    - 雨水不得穿过完整玻璃顶、封闭窗户、车顶或实体屋檐落到室内；室内液体须落入可见地漏、排水沟、池体、浴缸、淋浴盘、坐便器、洗手盆、集液盘或吸水材料，不得无排水而在地面大量聚集。禁止冷冻舱、干冰、极端温度、危险环境或无法退出的空间。
    - 液体不得逆重力、穿过身体或物体、遮没全部面部或被误读为另一来源；水滴具有透明度、折射、高光和落点。体液可作强烈、夸张、径向的编辑表现，但限于受保护落点与局部动作尺度，不变成高压管道、工业水炮、无支撑间歇泉或房间级洪水。
    - 批次轮换正上方俯视、高位、平视、低机位、侧面、四分之三、水面线和细节视点，并实际改变方位、高度、焦段、裁切及主体落点，不只改角度数字或全部固定居中 50mm 俯拍。灯光不得整批固定为 5500K 硬顶光。机位与姿势须匹配床面、浴缸、湿滑地面、池沿或平台；不得让大腿、缸壁、床头、手臂、水花、反光遮住主要动作或液体轨迹，也不得截断关键肢体。
    - 服装、鞋履、材质与季节和地点相符；喷嘴、软管、控制器、纸钞、粉色腕带、白衣、厚底高跟鞋及黑色竖杆都不是必选物。道具不得带可读文字、品牌、货币面额、人物肖像或标识，也不得悬浮、复制或穿透身体。
    - 使用性玩具时只保留一件或一套不可分离系统，明确类别、材质、颜色、尺寸、控制、握持或固定、接触或插入的底座、方向与边界，且匹配场景、姿势、机位及当前内容边界。不能只写笼统玩具标签、相邻重复同一种透明假阴茎，或让身体、水面、衣物遮住玩具；吸盘不能粘床单或软床垫，湿区玩具须防水且无市电连接。
    - 储液玩具须显示储液腔、通路、出液口、触发与落点，只在近源流出或滴落，并清楚进行外部刺激或单一插入，不能仅向裸体流液。
    - 画面明确主视觉服装或配饰、主辅色、主导材质、发型妆容、布光及调色；不得退化为业余色情视频截图、网络摄像头、闭路监控、偷拍、自拍、后台花絮、临床检查、医疗或法证记录、器材测试照或无美术指导的普通色情记录。
    - 请求人数是每幅画面必须准确可见的人数，不是上限或可选角色；不得漏人、移至画外或用玩具替代，也不得为玩具、动作、液体、姿势或机位增加伴侣。零男性请求没有男性、男性身体部位、画外或暗示男性及精液。
    - 每个 画面 至少组合眉形、眼睑、瞳孔方向、脸颊张力、鼻翼、嘴唇、下巴和头部角度 中的四项。人物保持清醒、主动和协调；不得表现疼痛、无助、恐慌或失去意识。
