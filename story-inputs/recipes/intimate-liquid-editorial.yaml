      范围内变化，也可使用有意设计的混合色温。
    - 每个 主题 明确主光方向、光质、色温关系、补光策略、阴影密度和水滴高光。曝光可用 短促闪光冻结水冠，也可让部分外围水线保留受控运动轨迹；人物面部、关键手脚、服装 结构和主要水路必须保持可读。调色可高反差中性、明亮高调、低调深色、柔和彩色、
