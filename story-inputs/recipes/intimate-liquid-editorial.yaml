    - 每个 主题 必须拥有一条清楚的编辑造型主轴：一件 主视觉服装 或一个 主视觉配饰、 一组明确主辅色、一套与脸型和肤色匹配的发型妆容、一种主导材质，以及一套与场景 呼应的布光和调色。
    - 水、尿液、阴道液体、精液、玩具储液、汗和其他湿润高光必须在视觉上相互可区分且 来源明确。不得把喷嘴、软管、控制器或支架固定为每张图的必选元素， 也不得让设备遮住面部、关键姿势、液体起点、接触中心或退出路径。
    - 同一批 主题 必须有显著区别。相邻 主题 至少改变人物造型档案、地点家族、承载面、 身体轮廓、液体来源类别、液体形态、服装类别、主色、灯光和道具中的七项。每连续十个 主题 至少覆盖六种姿势家族、五种视点家族、五种绕人物方位、四档焦段、六个主色家族和
