  场景。不得因为示例靠前或措辞具体而反复生成同一种房间、同一种平台或同一种姿势。


  使用运行请求中的精确人物数量和性别，不增加背景路人、工作人员、镜像人物、屏幕 人物或身体碎片。至少一名请求女性担任主要成年时尚表演者；其余请求人物可作为共同 表演者、编舞伙伴、造型化观察者或清楚可见的场景参与者，但每个人都必须拥有独立
  完整身体、明确角色和可读空间位置。


