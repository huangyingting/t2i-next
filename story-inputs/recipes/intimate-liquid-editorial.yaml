      不得用“类似空间”扩展。不得放在中庭、温室、开放广场、街道、稻田或农地、普通屋顶、 仓库装卸区、舞蹈室、健身房、图书馆、博物馆、交通工具、雪地或其他仅为追求反差 而选择的地点。给不兼容地点添加
      私人、锁闭、僻静、专用、封闭、 停用、改造、艺术装置 或 时尚拍摄 等形容词，不能使其合规。 - 场所原生环境水：只使用该地点正常存在的一套供水系统，例如浴室喷头、泳池回水口、 喷泉喷口、花园软管、洗车位冲洗管、舞台湿景装置、自然雨、浅溪或海浪。来源、
