    - 道具不是必需品。每个 主题 使用零至五类与地点和概念有关的道具，例如花瓣、叶片、 彩纸、透明薄膜、金属圆片、布带、气球、镜面球、空白卡片、无字包装、运动器材、 餐具、灯具、织物、石块、冰块、果实或抽象纸张。不得固定使用纸钞状道具、床头竖杆
