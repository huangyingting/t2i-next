    - 为完整视觉事件拟定简短原创英文标题；明确承载面、至少三项身体—材质—空间接触，以及至少四项可见面部表情线索。直接描述人物的实际衣着与动作，不输出衣着证明、等级声明或合规摘要。
    - 规则优先级从高到低依次为：场景功能与物理逻辑、液体来源和解剖准确性、成年人安全 与自愿、内容等级 动作与衣着、人物与摄影多样性、视觉新奇度。任何要求发生冲突 时，必须舍弃更奇怪的地点、器具、水型或构图，保留更简单、更日常、更可信的组合；
