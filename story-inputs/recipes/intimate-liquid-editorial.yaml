    - '- 环境清水：自然雨水、向下落水、瀑布薄幕、缓慢出水口、倾倒水幕、浅池拨动、 水面波纹、波浪或身体接触产生的被动飞溅； - 手持清水工具：只用于向下流动或倾倒的低压软水管、手持花洒、挤压水瓶或透明
