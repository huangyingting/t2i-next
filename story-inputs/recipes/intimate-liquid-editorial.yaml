      第一句必须直接从具体地点、人物或相机视点开始，不得先写主题编号、画面编号、标题或 “the image depicts” 一类元叙述。全文不输出衣着证明、等级或液体类别声明、许可声明、合规摘要及否定合规清单；衣着与动作由可见事实表达。
    - 每个 画面 至少写出三项可见接触证据：软垫压陷、织物受拉、湿发贴肤、鞋底抓地、 水滴附着、皮肤压痕、浅水涟漪、沙粒位移、草叶弯折、衣摆受水流推动、反射变化或 支撑面留下的潮湿轮廓。接触必须符合重量、重力、材质和水流方向。
