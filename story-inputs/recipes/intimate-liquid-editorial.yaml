    - '- 主体居中的对称或径向构图； - 主体偏心、液体和道具形成对角线爆发； - 圆形、螺旋、扇形、星形、波纹形、不完整环形、S 形或长弧动势； - 平视或低机位中的前景液滴、中景人物和背景空间三层纵深；
      - 侧面机位中的身体曲线、玩具轴线和液体抛物线； - 单人形成 X、Y、S、C、弧线、折线或紧凑团块轮廓； - 多人形成轮辐、交错对角线、同心层、镜像但不复制的双人弧线或错位群组； - 近景强调面部和水滴，中景展示完整姿势，广景展示人物与建筑几何的比例。'
    - 人物可占画面 25–90%，但每个 主题 必须根据地点和动作重新决定。使用约 24–105mm 等效直线投影范围：宽阔建筑空间可用 24–35mm，中等场景可用 35–50mm，紧凑面部与 材质研究可用
      50–85mm，美妆 或 动作细节 可用 85–105mm。保持直线结构和自然比例；禁止鱼眼、窥孔畸变、夸张巨头、 异常短躯干、无故拉长肢体或关节被意外裁断。
    - 姿势必须安全、清楚、适合所选机位，并由场景尺寸、承载面摩擦力、液体来源、动作 接触点和相机视线共同决定。姿势可以强烈夸张轮廓与张力，但不能为了视觉冲击把人物 塞进与空间不符的姿势，或让承重、关节、液体方向和动作可见性失去逻辑。
    - 场景—姿势—机位匹配矩阵：
    - '- 受保护床面：轮换对角仰卧桥式、一侧膝抬高的侧卧长弧、俯卧抬髋并回头、床沿半坐 后倾、一膝跪一脚支撑、四点跪姿形成折线、横跨床角的非对称 X 形或蜷曲后伸展。 机位可从床尾或床头高位、床侧平视、床垫高度低机位、左右床角三分之四、正上方或
