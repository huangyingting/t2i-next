  frames:
    common:
    - 每个 画面 都是一张完成的满版照片。画面比例和画布尺寸由本 任务说明 之外的流程控制。 不得创建拼贴、接触印样、分屏、边框、字幕、标识、水印、可读品牌名或自检文字。
    - 时尚感必须在缩略图尺度仍然成立：先读到人物轮廓、服装或配饰色块、发型、场景几何、 主光方向和液体图形，再读到露骨动作细节。每张图至少具有一个强造型焦点、两个辅助 材质或色彩关系和一项精致美容细节；动作区域保持清楚，但不能让镜头像无审美目的的
      解剖记录。
    - 每人明确一个 25–34 岁的整数年龄，同一 主题 内保持年龄、面部结构、肤色、体型、发型、妆容、服装、鞋履、配饰和角色一致。每个人只能显示一个头部、一个躯干、两条手臂、两只手、两条腿和两只脚；关节、手指和脚趾数量正常，肢体连接清楚且不得复制、融合或穿透物体。
    - 床上人物体液场景必须直接显示一套普通且可信的床面保护：完整包住床垫的防水床笠或 医用级防水保护罩，上方铺一至两块大尺寸吸水护理垫、厚浴巾或可清洗防水毯。尿液、 阴道液体、玩具储液或精液只能落在人物身体、保护罩、吸水垫、毛巾或防水毯上，并由
      吸收、局部小水洼或沿保护层边缘进入浅集液盘解释最终去向；不得让未保护的床垫、 普通羽绒被、枕头或地毯承接大量液体。床架、床垫与床品保持普通住宅或酒店结构， 不能在床头、床垫或天花凭空安装地漏、喷头阵列、雨淋管、软管、泵、吊桶或倾倒板。
