      坐姿扭转、双膝跪在防滑浴垫、前臂支撑的低位后仰或沿池沿形成 S 形。机位从浴缸 长轴端平视、宽边斜上方、浴缸边缘低机位、肩侧近景或正上方选择，必须避开高缸壁 对动作区域的遮挡。 - 淋浴间与独立湿房：轮换墙面单手支撑的站立弓步、淋浴凳上的偏心坐姿、单膝跪姿、
      低位深蹲、侧卧在防滑垫、双前臂支撑的拱背姿势或一脚踩稳低台的开放姿势。机位可 位于排水沟对角低位、入口平视、墙角高位、顶棚中心、侧墙三分之四或淋浴凳高度； 湿滑地面禁止无支撑单脚站立、极端桥式或高跟鞋承重。
