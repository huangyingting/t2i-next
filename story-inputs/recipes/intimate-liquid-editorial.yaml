      移动到头侧、脚侧、左右对角、眼平侧面、平台高度低机位或垂直中心，并在 24–105mm 内根据装置尺度选择，不固定为 50mm 正俯拍。 - 其他场所原生环境水：姿势必须来自该地点的正常身体活动，例如雨中站立转身、花园
      软管旁稳定跪姿、洗车位低弓步、浅溪坐姿或海边侧卧；机位服从真实可站立、架设或 固定的位置，可选择平视、低机位、高位或远距离侧面，不能虚构不存在的吊点、透明 屋顶或危险悬空位置。'
