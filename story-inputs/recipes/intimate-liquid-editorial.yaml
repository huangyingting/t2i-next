      中轮换：
    - '- 70–90 度 正上方俯视 或顶视：强调床面、平台、池体、液体图形和四肢平面几何； - 25–65 度 高位斜视 高位斜拍：同时显示人物、承载面、环境纵深与液体落点； - 接近水平的 平视
      平视：强调人物表情、身体轮廓、服装层次和前后景关系； - 从床垫、浴缸边、地面或水面高度向上观察的 低角度仰视 低机位：强调身体张力、 液体弧线和场景高度，但不得造成窥视、巨头、异常肢体或动作遮挡；
