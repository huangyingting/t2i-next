    - 同一主题内的画面是平行替代方案，而非时间顺序步骤。每个画面都独立确立相同人物阵容、地点、关系目标、所选内容等级互动及非理性法则。
    - 变化稳定布局、被动证据、否定状态、相机距离、视觉中心和电影化处理。绝不让一个画面成为另一个画面的铺垫、延续、升级、释放或事后状态。
    - 不沿袭任何衣物、体液、道具、损伤或姿态状态。拒绝连续性捷径，以及基于重复、时长、习惯、积累、过去尝试、未来失败或想象循环的矛盾。
    - 在每个画面的前两句内，展示：
