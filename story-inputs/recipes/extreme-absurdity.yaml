    - 2. 每位参与者不可或缺的身体角色；
    - 3. 具有确切解剖部位与道具部件的人与道具接触点；
    - 4. 从该接触点到道具状态的可见力路径；
    - 5. 人与道具的尺度、伸及距离、支撑面积和净空；
    - 6. 每位参与者的面部朝向、目光、表情和保持姿态；
    - 7. 每位参与者鲜亮的服装状态、夸张发型和可见妆容；
    - 8. 在该接触中共存的普通功能与相反功能；
    - 9. 以可见几何呈现的最终自我否定材料或空间状态；以及
    - 10. 一组相反的英文标签。
    - 使用能让内容等级接触、相反功能及否定状态同时可读的机位和景深。不得把必需证据藏在面孔、浅焦、前景装饰、黑暗、烟、霾或裁切之后。
    - 静态场景必须通过两项视觉测试：
    - '- 无内容测试：移除所选互动，矛盾随之消失。'
    - '- 无文字测试：移除所有文字，矛盾依然视觉可读。'
    - 每个画面恰好包含一组简短英文标签，每个标签包含一至两个大写单词。此组标签命名内容等级互动中已可见的互斥关系状态或相反功能。不同主题不得重复同一标签组。
    - 两个标签都必须大、无遮挡、拼写正确，并在与互动相同的焦平面上可读。它们确认矛盾，但绝不创造或解释矛盾。不得添加标题、副标题、图注、标语、句子、指令、对话、创作者姓名或其他可读画内文字。
    - 以视觉上的严肃性拍摄互动。使用克制构图、有动机的照明、可信材料、平静表情和决定性空间关系。非理性法则自然属于该世界，而非显得像奇观、梦境意象或视觉特效。
    - 不依赖夸张反应、不可能解剖、重复人物、变形、随机巨物、无支撑身体或家具、无关动物、融化建筑、万花筒重复、梦境雾气或视觉混乱。
    - 每个画面写成一个紧凑、可直接成像的段落，无字符数或单词数目标，不凑字、不截断。以完整句末标点结尾。
    - '开头重复主题确切的“荒诞主义参考：...”或“Absurdist reference: ...”分句，包括创作者的确切拉丁字母姓名及机制。'
    - 立即说明所选内容等级互动，以及其中共存的普通功能、相反荒诞功能和否定状态。随后按最自然的视觉顺序确立完整人物识别点、静态身体力学、被动证据、确切标签组、相机及光线。
    - 在前两句内说明人与道具接触点：谁以哪个确切身体部位、朝哪个方向、在何种持续施力下触碰哪个命名道具部件。接着沿可见机械联动描述到道具固定状态。不得将此几何推迟到相机或照明描述之后。
    - 每句话都必须描述可见或摄影上可控的事物。不得陈述意图、信念、记忆、历史、未来动作、象征、道德意义、观众反应或事件为何荒诞。
    - 默默重写未通过以下任一检查的主题或画面：
    - 1. 内容等级证据：确切的所要求人物阵容与所选内容等级互动完全可见。
    - 2. 内容整合：所选互动是唯一的人类动作，并同时体现普通功能和非理性条件。
    - 3. 内容保留：每处构成等级资格的接触都保持直接、无遮挡且实际存在；没有句子同时声称同一接触点存在分离、中介、遮掩或替代。
    - 4. 依赖性：移除所选互动就移除矛盾。
    - 5. 无并行任务：不存在独立荒诞的装置、程序、文件、仪式或道具。
    - 6. 物理写实：每个身体都具有可能的解剖、稳定支撑、自然伸及范围、每条肢体一致的角色，且不暗示姿态之间移动。
    - 7. 道具接触：一位指名参与者的确切身体部位明显接触命名道具表面，并有可辨压力、支撑或阻力。
    - 8. 力路径：从人体接触点到道具当前状态的每一步机械传递都可见、被命名且实际连接。
    - 9. 尺度与适配：所述人体与道具尺寸允许所示伸及、接触、净空、支撑及杠杆作用。
    - 10. 目击描述：每个面部、目光、表情、保持动作、接触点和最终道具状态都在一幅冻结图像中直接可见。
    - 11. 造型：每位参与者都有独特鲜亮衣着配置、夸张可见发型及明确高对比妆容配色，同时保留全部必需证据。
    - 12. 静态曝光：接触、相反功能及否定状态此刻共存，无触发、转化、扩散、准备、顺序、重复、时长或事后状态。
    - 13. 视觉证据：移除全部标签和解释文字后，矛盾依然存在。
    - 14. 极端性：内容等级关系是自我挫败、互斥或因果闭合，而非仅仅不便。
    - 15. 文字：恰好出现一组相反英文标签，不出现其他画内文字。
    - 16. 语言：除确切创作者姓名、机制短语和带引号的标签组外，每个词都使用所要求的输出语言，且不含畸形片段。
    - 17. 完整性：画面以必需参考分句开头，以完整句末标点结尾。
