      ID，也不假设固定主题数。自然适配仍优先于多样性；否决牵强的新奇，而非添加无关载体。
    - 场景生成与多样性：编写单个主题前规划完整主题批次。任意两个主题之间，以下方面至少三项实质不同：出入条件、空间功能、围合或建筑、支撑几何、人群逻辑和场所固有活动。新城市名、装饰风格、家具或房间标签并不会创造新场景类型。普通私人住宅内的多个房间仍属同一住宅类型。只要还有其他物理可信场景类型未使用，就不要重复该类型。
    - 场景生成与多样性：只有场景和当前活动通过日常生活逻辑检验后，才推导活动或运行环境已然造成的唯一运动。若选择地点仅为容纳方便的模糊效果，就舍弃它，生成另一场景。
    - 主题与最终审核：每个主题锁定人物、地点、服装、人群、运动模式、载体、曝光逻辑和调色。画帧变化合理的姿势、表情、取景、光线平衡和载体位置，不使用连续性语言。主题之间只在仍然自然的前提下变化。
    - 主题与最终审核：除非标题、设定和风格都指向同一个唯一模式与载体，否则在生成任何画帧前否决主题。标题只命名一个运动创意，而非 "X and Y"、"X with Y" 或两个运动名词。设定中只能有该载体处于运动中。风格只能描述该载体所需的摄影技术。
    - 主题与最终审核：对于 "FLASH-FROZEN" 主题，人物与其唯一由动作引发的载体运动；所有无关人物和环境系统保持静止或不存在。对于 "STILL ANCHOR" 主题，人物、衣物、手、头发、道具和灯光都保持静止；只有选定环境载体运动。每条次要通路、天气效果、流体系统、动力系统、实景灯和可移动物品都保持静止或不存在。
    - 主题与最终审核：不要把私人室内与正常运行的公共室外混合，并声称每个远处路人或车辆都是自愿参与的制作临时演员。要么使用完全受控、仅有一个布置载体的公共布景，要么使用性活动不会被普通公共空间看见的私人室内。不要把搭建的复制布景称为具有真实运行的在用公共基础设施；应使用获授权关闭的真实场所，或让复制布景在物理上自成一体。
    - 保持从手到拖迹再到凝固衣物的一条不间断可见因果链。拖迹从释放点开始，到达衣物记录位置，中间没有无法解释的清晰空气间隙。释放点到当前位置的距离、载体速度、快门已历时部分和所述拖迹长度必须一致。短拖迹不能解释离手远得多的物体。清晰端须匹配前帘或后帘同步时机。若这种几何关系无法容纳在一次曝光内，物体就不是有效凝固载体。不要仅因必需的标志性眼镜、太阳镜或丝巾已在清单中，就把它们用作腾空物。
    - 只有倒水、清洗、沐浴、降雨、喷泉或另一项现有场景活动需要液体时，液体才有效。展示来源和去向。一只手可以从易于掌控的容器中倾倒约 250 毫升至一升液体。更大的容器在倾斜时仍需支撑。亲密接触期间，绝不抛掷装满的水桶、十升水、玻璃器皿、家具或其他危险重物。
    - 以可见动作满足既定内容边界，不以衣物覆盖程度判定或替代动作要求。
  frames:
    common:
    - 方案检查顺序：1. 日常场景逻辑、解剖、受力、支撑和摄影物理；2. 精确的请求人物构成和内容边界；3. 一个大范围、立即可读的运动事件；4. 完整的可见人物、服装、表情、人群和光线细节。所有要求均须满足，不得通过改动人物构成或放宽内容边界来解决冲突。
    - 若相机设置无法产生描述的最终图像，或运动只为制造奇观而存在，就舍弃概念并重写。不要通过增加另一个物件、载体、光源或例外来解决冲突。
    - 输出约定：每个画帧返回为一个自足的英文段落，不少于 700 词。目标为 850-1200 词。返回前计数，低于 700 词时静默重写。使用一个连续段落，不含标题、标签、项目符号、字段名或评论。
    - 输出约定：对画帧执行最终词汇渲染门槛，而不仅仅对主题执行。返回段落中以下词语出现次数必须为零："camera body"、"camera mounted"、"tripod"、"gimbal"、"flash
      head"、"flash unit"、"softbox"、"light stand"、"umbrella"、"reflector"、"capture cable"、"shutter trigger"、"capture
      monitor"、"production crew"、"photographer"、"lighting assistant"、"production personnel" 或 "equipment
      outside the frame"。将它们改写为锁定视点、摇摄视点、画外脉冲、宽广柔和入射光、狭窄硬质入射光或曝光结果。不要输出不存在器材的否定清单。
    - 输出约定：使用紧凑、高密度、电报式图像提示词文风。优先用分号连接简短主谓宾分句。每个事实只说一次。使用精确名词、测量值、归属、接触、深度和方向。删去隐喻、背景故事、悬念、填充语、主题阐释和重复总结。简洁只去除冗余，绝不去除必要信息。
    - 输出约定：先排列可见事实：地点和背景人群；选定运动模式及可见载体结果；每名主要成年人的档案；服装与物品状态；姿势与接触拓扑；实景光线。摄影解释放在最后部分：不可见视点几何、镜头与对焦、画外照明、快门与脉冲时机、中性密度滤镜，以及这些选择如何记录所述清晰度、浅景深和运动。
    - 输出约定：只使用当前图像。绝不使用 "same"、"unchanged"、"previous"、"next"、"again"、"before this image"、"after this image"，也不引用其他主题或画帧。不渲染可读标牌、屏幕、标签、标志、水印、数字、时钟或说明文字。
    - 请求中的女性和男性数量严格适用于主要成年主体；背景成年人遵循下述人群规则，不改变请求中的主要人物数量。绝不假定固定数量、ID 或固定输出顺序。
    - 运行时输入：所有描绘的人都必须是明显成熟、年龄不低于 25 岁的成年人。每名主要成年人都可见地参与。不添加前景旁观者、脱离身体的肢体、倒影中的参与者或画外参与者。
    - 多成年人角色与深度拓扑：请求超过两名主要成年人时，在写主题或画帧前建立内部角色台账。为每名有姓名的成年人记录一个当前明确角色、精确的一名或多名搭档、主动或接受方身体结构、一个外部接触边界、左手任务、右手任务、身体支撑、承重路径和相机距离。写正文前协调好完整台账。不要输出台账。
    - 多成年人角色与深度拓扑：为每名成年人赋予一个力学稳定的当前姿势。追踪谁支撑谁的重量，确保支撑肢体没有同时被分配给衣物、配饰、另一接触或第二个身体。保持身体在空间上分离；指明从左到右及由近到远的顺序，使肢体、归属和接触不会混合。多对人物构图中，在画面上将各对分开，同时让两对都处于可读的主体深度层内。
    - 多成年人角色与深度拓扑：大光圈群体场景仍要求每名主要成年人的身份和接触可读。通过将群体大体平行于传感器平面排列，把所有必需面部和关键边界放在声明的主体深度层内。不要把一对放在另一对后方数米处，却声称在
      f/1.4-f/2 下都极致清晰。三名或更多成年人时，通常使用 35-50mm 镜头、约 f/2-f/2.8，以及足以覆盖群体的相机距离，同时前景和背景仍明显柔化。只有所述前后跨度确实落在计算景深内，更长镜头或更大光圈才有效。闪光凝固运动，绝不扩展景深。
    - 主要成年人档案：在主题内为每名主要成年人锁定一份档案，并在每个画帧中完整重复：精确年龄和以厘米为单位的身高；体型、肩部、躯干、腰部、髋部、腿部和重量分布；女性的自然乳房大小、形状、前突程度和比例；男性的胸宽、胸肌体型、腰部、髋部和比例；脸型、眉部、眼睛及其颜色、鼻子、脸颊、嘴唇、颌部、下巴，以及一处自然不对称；精确肤色与底色、毛孔、质感和有依据的高光；发色、长度、浓密度、质地、分缝、发际线和精确发型；每件衣物、内衣层、袜类、鞋、首饰、眼镜、围巾和配饰；一个精确表情，通过视线目标、眼睑、眉毛、鼻孔、嘴唇、颌部、脸颊、下巴、颈部张力、警觉性、自主性和同意来表达；一个当前动作阶段，追踪头部、躯干、骨盆、双臂、双手、双腿、双脚、支撑、平衡和接触。
    - 主要成年人档案：使用原创面孔。不要以 "beautiful"、"attractive"、"fashionable"、"sexy"、"muscular"、"cinematic"、"dramatic"、"intense"
      或类似泛化标签替代细节。
    - 服装与物品状态：为每名主要成年人建立连贯清单：上装与下装、内衣、使用时的袜类、一整双鞋、至少一件首饰，以及至少一件从眼镜、太阳镜或丝巾中选取的非首饰标志物。在主题内保持所属关系、结构、颜色和材质。
    - 服装与物品状态：清单中每件物品都要有其精确可见颜色。对每件衣物、内衣层和袜类，指明底色、辅色、饰边以及存在时的图案位置。对鞋履，分别指明左鞋和右鞋的鞋面、鞋底、鞋跟、五金件、鞋带或系带颜色。对首饰，指明金属色、宝石色和表面质感。对眼镜或太阳镜，指明镜框、镜腿、五金件和镜片颜色。对围巾，指明底色、纹样颜色、边框颜色和织物光泽。这些颜色在穿戴、移位、脱下、手持和腾空状态中保持不变。绝不以
      "matching"、"coordinated"、"dark"、"light"、"neutral"、"colorful"、"metallic" 或 "same color" 代替实际颜色名称。
    - 服装与物品状态：每件物品恰好具有一种可见当前状态：穿戴着；连贯地敞开、掀起、拉低或拨向一侧；从指名肢体上部分脱下；由所属者指定的一只手握持；完全脱下并处于一个精确、可单独追踪的落点；或刚被所属者松手后腾空。同一物品不能同时穿戴和脱下、手持和腾空，或位于两个位置。裸体成年人仍有完整的已脱衣物和鞋履清单。
    - 服装与物品状态：脱下的衣物必须看起来是画中脱衣动作刚刚自然丢下的，而非为陈列折叠或刻意布置。为每件物品给出精确占地范围、朝向、重力支撑形状、褶皱，以及扭转腰带、衣身部分翻里、塌陷罩杯、拖垂袖子或不齐下摆等脱下证据。在所属者路径附近使用随意且分开的落区。只有每件参与物品和重叠边界都仍明确可辨时，才允许有限的局部重叠。绝不默认采用
      "neatly folded"、"laid flat"、"stacked"、"aligned"、"symmetrically arranged"、"side-by-side"、"parallel"、"showroom-like"
      或 "color-coordinated" 的摆放。不要把内衣放在裤子上、衬衫放在另一件衣物上、眼镜放在衣服上，或衣服放在鞋上。鞋不必整齐成双：分别定位左鞋和右鞋，具有可信的踢脱朝向和距离。只有整理打包本身是可见当前活动时才允许有序收纳，亲密行为期间绝不允许。
    - 服装与物品状态：衣物结构必须真实。套头衫没有门襟；纽扣衬衫只沿门襟打开；裤子在腰头和裤门襟处打开；吊带裙有肩带，不得虚构前门襟。布料遵循重力和姿势。覆盖动作部位的任何衣物都必须可见地移开精确接触边界；绝不描述穿过完整布料或位置含糊布料的插入。
    - 服装与物品状态：鞋履应与支撑相符。站立时鞋通过鞋底接触地面。跪姿时鞋可以通过鞋尖、鞋面或侧缘接触，而非双鞋底同时平贴。若赤脚，定位完整配对的两只鞋。眼镜不能同时戴在脸上或头上又已摘下。
    - 服装与物品状态：一只手只执行一个任务。用于支撑、抓握、触碰、拿物、掀衣或松手释放物品的手，不做其他事。完整段落写完后审核所有手。
    - 一个必要运动系统：每个主题恰好选择一种运动模式和一个载体系统。自然适配优先于多样性；重复可信模式好过强行使用另一种。载体运动须由可见的当前活动造成；若删除载体后活动不变，它就是装饰性的，必须重写设定。
    - 一个必要运动系统：选择一种：
    - 闪光凝固动作峰值：使用锁定相机。一个必要动作产生一条衣物、液体、头发、布料、粉末或轻型道具轨迹。短闪光凝固一个决定性位置；环境曝光记录同一载体的一条相连拖迹。面部、身份、支撑和关键接触保持可读。
    - 闪光凝固动作峰值：所属者就是释放者。在同一图像中，将此人的松手呈现为可见当前动作：指名手臂仍沿路径伸展；张开的释放手仍处于轨迹起点的合理可及范围；分开的手指、手腕角度和手臂随动都与方向及旋转一致。载体拖迹从这只手开始。此人尚未把手臂收回到另一个姿势或任务。若没有主要成年人可见地松开衣物，就不能有腾空物；选择另一载体。绝不暗示不可见的投掷、画外释放者或在动作阶段之间凭空出现在半空的衣物。不要只为让它飞起而添加围巾、衬衫、夹克、内衣或长袜。
    - 静止锚点、运动世界：使用锁定相机。主要成年人保持一个真正稳定、有支撑的姿势。恰好一种附近环境运行提供载体。从地点当前正常功能、路线、天气暴露、流体流动或动力运行中推导它；不要因地点符合熟悉运动示例而选择该地点。载体遵循其真实边界、路线和方向。车辆或交通工具提供运动时，展示其真实路径和一个连续周边环境，而非合并不相容的地点。
    - 静止锚点、运动世界：运动中的背景成年人采用普通路线、服装和行为。不要为制造拖迹而给他们手持物件或编排手势。宽广运动区域需要足够多的平行路径占据该区域；单列队伍不能填满宽阔区域。横向行进产生平行于画面的拖迹。朝向或远离相机行进产生沿纵深汇聚的拖迹，绝不是垂直帘幕。
    - 运动可读性：单一运动系统是两个最大视觉体块之一，占画面约 30-70%。观看者先识别运动，再识别服装细节。将它放在前景或中景，或作为宽阔的相邻背景带。说明起止区域、画面方向、占据区域、拖迹长度、密度和边缘特征。
    - 运动可读性：否决微弱模糊、孤立散景、微小远处交通、小道具或只有细看才可见的运动。同样否决大到遮住面部、关键身体结构、接触、支撑或地点的运动。
    - 场景与力学：闭合两个物理回路：
    - 场景与力学：- 场景回路：地点、运行状态、时间、天气、人群、服装、道具和活动通常能共存。封闭房间保持干燥；玻璃外的雨留在外面；风吹雨只有通过可见开口才能到达有遮盖的地面，并留下对应湿痕。
    - 场景与力学：- 力学回路：力有可见来源；质量与力相符；肢体通过正常关节可达；重量有足够支撑；释放物从释放手开始，经过最高点后遵循重力；路径不穿过面部或关键接触。
    - 场景与力学：湿滑支撑需要可见防滑纹理、固定扶手或干燥承重表面。不要在缺少足够摩擦和支撑的湿滑瓷砖上放置跪着的膝盖、着地的脚或承重成年人。每个关键接触边界都保持在不透明或扰动水面之上，视觉无遮挡；不要声称浸水边界清晰可见。
    - 场景与力学：长曝光期间，不要把走路、清理、交谈、操作器材或调整衣物描述为清晰。这些成年人要么保持一个明确静止姿势，要么他们的运动就是选定载体。
    - 相机、曝光与记录结果：闭合成像回路：相机支撑或摇摄、焦距、相机距离、光圈、对焦距离、快门时间、闪光时长、帘幕同步时机、环境与闪光比例、载体速度和光线位置，必须能产生所声称的最终清晰度和模糊。
    - 相机、曝光与记录结果：拍摄技术是非渲染元数据，绝不是可见场景内容。先描述完整可见场景。在最后部分，用一个紧凑的方法句，只解释图像如何拍成。使用以下原文句式："Captured from a [height],
      [distance], [azimuth], [pitch] viewpoint with a [focal length] lens at [aperture], focused at [distance];
      a [shutter] ambient exposure records [carrier path]; a [t.1 duration] off-frame pulse from [screen
      direction] freezes [selected plane]; [ND strength when needed] controls ambient exposure; no capture
      apparatus is visible." 只调整数值，不改变结构。
    - 相机、曝光与记录结果：绝不赋予拍摄装置可见位置、材质、支撑、深度、轮廓、反射或阴影。解释视点和入射光，而非硬件立在哪里。封闭制作并不能成为图像中出现制作器材的理由。若故事描述明确将摄影描绘为可见当前活动，任何叙事内摄影物件都属于该活动，与拍摄这幅图像的不可见系统分开。
    - 相机、曝光与记录结果：每个画帧说明一个精确虚拟视点：传感器距支撑地板高度、到最近主要人物的距离、围绕人物的水平方位角、垂直俯仰角、水平或有意倾斜、横幅或竖幅、镜头轴线目标，以及从最近可见身体点到最远纳入场景边界的裁切。使用厘米、米和度数等具体几何量，而非只说低角度、平视、近距离或四分之三侧视。这描述图像几何，而非可见物体。视点必须展示最近主要人物的眼睛或面部平面、身体支撑、关键接触、运动起点、完整可见载体路径和落区或目的区域，且各元素不相互遮挡。避免压缩手到载体距离或使运动方向含糊的透视缩短。重要身体结构远离画面边缘裁切，避免无意前景遮挡。
    - 相机、曝光与记录结果：不可见视点必须对应画外一个真实、安全、可到达的空间和稳定支撑表面。绝不将其放在墙内、无防护立面之外、竖井或机械净空内、穿过实心玻璃、无支撑空中，或人物或载体实际经过的位置。锁定相机相对于一个声明的参照系锁定。若承载人物的房间、舱室、升降机、船舶或车辆移动，应将不可见拍摄系统安全安装在同一结构上，使主体距离和取景保持恒定；外部静止视点会记录人物平移，不能同时表现为内部锁定视点。视点距离、传感器高度、焦距、画幅方向和裁切必须在几何上符合可见身体范围和场景边界。
    - 相机、曝光与记录结果：使视点匹配运动模式。对于 "FLASH-FROZEN ACTION PEAK"，从清晰侧面或斜角观看释放路径，使释放手、拖迹、凝固物体和目的地占据独立可读的画面位置。对于 "STILL ANCHOR"，将稳定人物安排在一个主导深度层，将环境载体作为宽阔相邻层或框景层，路径无遮挡。若身体、肢体、家具或载体几何会遮住关键关系，不要使用正面位置。
    - 相机、曝光与记录结果：在场景允许时，不同主题变化相机高度、方位角、俯仰角、画幅方向和取景；不要默认每幅图像都是站立眼高的正面相机。视点多样性绝不凌驾于物理可读性、安全身体支撑或所选运动逻辑之上。
    - 相机、曝光与记录结果：使用合理范围：
    - 相机、曝光与记录结果：- 闪光凝固动作加拖迹：约 1/15 至 1/2 秒；
    - 相机、曝光与记录结果：- 静止锚点与运动世界：约 1/4 至 1 秒。
    - 相机、曝光与记录结果：更长曝光需要异常缓慢的载体和真正能保持静止的姿势。根据速度和快门时间估计位移。步行一秒约移动一至一点五米。没有有效的距离和速度解释，不要把两秒与三厘米拖迹配对，也不要把
      1/30 秒与一米长的缓慢步行模糊配对。
    - 相机、曝光与记录结果：快门时间和闪光时长不同。快门控制环境曝光累积。闪光时长凝固闪光照亮的瞬间。对于快速布料、水滴、头发或肢体，使用约 1/2000 至 1/10000 秒的合理 t.1 闪光时长。绝不把
      1/200 或 1/250 秒称为闪光脉冲。
    - 相机、曝光与记录结果：闪光只凝固其强烈照亮的表面。若运动中的主要成年人必须在慢快门下呈现为一个清晰闪光影像，其皮肤和衣物上的连续环境曝光至少比闪光曝光低三档；否则必然出现重影或拖糊。不要将运动人物置于明亮阳光、天窗光或强实景光中，却声称仅靠闪光即可消除环境重影。相机闪光不能凝固超出有效距离的远处雨水或人群；应在远处载体当地布光，或将其记录为环境光模糊。
    - 相机、曝光与记录结果：前帘闪光把清晰影像放在拖迹开端，拖迹沿行进方向延续。后帘闪光把清晰影像放在先前拖迹末端。使用一个清晰位置，而非两端都有清晰副本。使释放点、拖迹、凝固位置、方向和目的地与帘幕时机一致。
    - 相机、曝光与记录结果：固定相机模式下，建筑和静止道具保持没有方向性运动条纹。位于浅景深之外时，它们可以光学柔化。模糊只属于选定载体及其直接反射。静止灯映在静止地板上，不会仅因快门慢就产生拖迹。景深柔化、散景、雾、光晕和浅焦都不是运动模糊。
    - 相机、曝光与记录结果：在 "STILL ANCHOR" 中，每名主要成年人在整个环境曝光期间保持所述唯一姿势。不要使用 "rocking"、"grinding"、"thrusting"、"pumping"、"bouncing"、"repeated
      strokes"、"swaying hair" 或 "repositioning" 语言。当前接触以保持不动的瞬间可见；只有选定环境载体运动。
    - 相机、曝光与记录结果：只在所述镜头、光圈、对焦距离、主体间距和相机距离的合理景深内声称清晰。不要把近处眼睛、远处人群和更远建筑都称为大光圈下极致清晰。
    - 相机、曝光与记录结果：默认视觉语言为大光圈和明显浅景深。全画幅上优先约 f/1.4-f/2.8；只有必要主体平面无法以其他方式保持可读时才使用 f/3.2-f/4。不要仅为把每个细节都列为清晰，就默认
      f/5.6、f/8 或更深景深。其他画幅上，选择具有相当全画幅浅景深表现的光圈。明亮环境光、慢快门和大光圈同时使用时，说明所需中性密度滤镜、基础或低 ISO，以及闪光功率关系，使曝光仍可实现。
    - 相机、曝光与记录结果：每个画帧必须说明一个浅景深设计：指明精确焦平面、最近和最远可接受清晰的主体特征、前景过渡和背景过渡。使最近主要眼睛或共享面部平面极致清晰。在姿势允许范围内，使第二张脸、支撑手和关键接触尽量靠近该平面。接触必须在解剖上可读，但可以进入轻柔对焦过渡，而非被虚称为刀锐般清晰。至少一个实质性的前景或背景平面必须明显光学柔化；绝不把整个场景描述为均匀清晰。缩小光圈前，先改变相机位置、主体对齐或对焦距离。将光学失焦与载体运动分开描述；散景、景深柔化和运动拖迹不可互换。
    - 相机、曝光与记录结果：景深必须主动组织运动结果。对于 "FLASH-FROZEN ACTION PEAK"，使释放手、轨迹起点和凝固载体位置处于或非常靠近焦平面；相连运动拖迹保持方向性，其远端边缘可柔和地过渡到失焦。对于 "STILL ANCHOR"，对焦最近主要眼睛或共享面部平面。环境载体可以远在景深之外而光学柔化，但其长且连贯的轨迹、画面方向、对比和占据区域必须仍明确由运动造成。绝不将失焦环境载体称为
      "crisp"、"structurally resolved" 或 "frozen"。将最强光学柔化放在能分离层次而不抹去载体路线、身体支撑或场景逻辑的位置。
    - 相机、曝光与记录结果：说明相机到载体的距离，并与声明的景深近界和远界比较。声称被闪光凝固的动作载体必须与可接受对焦范围相交。该范围外的环境载体应描述为光学柔化的方向性运动，绝不是清晰解析的结构。若凝固动作载体与其释放手处在相距很远的深度，调整构图对齐或选择另一动作；不要缩小光圈以获得深景深，也不要靠文字修补矛盾。
    - 相机、曝光与记录结果：用画面宽度或高度百分比描述位移，或针对声明的输出尺寸使用像素；绝不声称拖迹在整幅宽度约 36 毫米的全画幅传感器上长达数厘米。
    - 照明：对于可见实景灯，说明真实发光灯具的精确数量。一组四盏灯算四个光源；墙面、地板或其他反射表面不是发光体。对每盏可见实景灯，给出灯具、场景位置、色温或色相、表观大小、光质软硬、强度、作用、照亮表面、高光和阴影。
    - 照明：只在最终方法句中将非渲染拍摄照明描述为入射光：画外脉冲数量、画面方向、颜色、宽广或狭窄照明形态、光质软硬、相对环境光强度、照亮平面、眼神光、高光及所产生阴影。不要命名或定位硬件、控光附件或等效装置。可见实景发光体属于环境；拍摄照明不属于环境。不要只为制造拖迹而添加手持灯、隐藏光束、移动标牌或投影效果。连续主光只有在人物真正静止时才使其保持清晰。运动中的主要动作使用短时长画外闪光，并遵守环境曝光低于闪光曝光的规则。
    - 背景人群：每个画帧说明一种人群状况：
    - 背景人群：保持主题所选人群状况和人数区间。在该区间内给出大致可见背景人数；输入计划的允许范围不是预先分配的实际人数。
    - 背景人群：- 私人、住宅、受控、关闭或非营业时段：背景成年人为零，除非受控制作需要临时演员；
    - 背景人群：- 安静公共场所：2-5 名背景成年人；
    - 背景人群：- 正常活跃公共场所：6-15 名；
    - 背景人群：- 拥挤的交通场所、市场、节庆或活动：16-30 名。
    - 背景人群：人数非零时，给出大致人数、成年人身份、位置、深度、日常活动、服装、方向以及清晰或载体状态。临时演员保持匿名、次要、空间分离，不参与触碰，也不成为重点。
    - 背景人群：北京或任何其他指定城市中正常营业的公共场所，若其当前功能通常需要有人，就不能空无一人。使用可信的人群数量，除非可见的关闭、恶劣天气、受控制作或非营业状态能作出解释。
    - 三脚架防止相机抖动，但不能凝固人物。快门时间慢于 1/4 秒时，不要仅因相机锁定就称面部极致清晰。使用短闪光并压低人物身上的环境曝光，缩短快门时间，或允许轻微人物运动。
    - 保持从手到拖迹再到凝固衣物的一条不间断可见因果链。拖迹从释放点开始，到达衣物记录位置，中间没有无法解释的清晰空气间隙。释放点到当前位置的距离、载体速度、快门已历时部分和所述拖迹长度必须一致。短拖迹不能解释离手远得多的物体。清晰端须匹配前帘或后帘同步时机。若这种几何关系无法容纳在一次曝光内，物体就不是有效凝固载体。不要仅因必需的标志性眼镜、太阳镜或丝巾已在清单中，就把它们用作腾空物。
    - 只有倒水、清洗、沐浴、降雨、喷泉或另一项现有场景活动需要液体时，液体才有效。展示来源和去向。一只手可以从易于掌控的容器中倾倒约 250 毫升至一升液体。更大的容器在倾斜时仍需支撑。亲密接触期间，绝不抛掷装满的水桶、十升水、玻璃器皿、家具或其他危险重物。
    - 以可见动作满足既定内容边界，不以衣物覆盖程度判定或替代动作要求。
    - 最后在草稿中搜索 "pile"、"heap"、"bundle"、"scattered"、"fully inserted"、"visibly inserted"、"fully visible penis"
      和 "fully visible externally"。返回前重写任何匹配的物品摆放或身体结构描述。对于脱下物品的摆放，还要搜索 "neatly folded"、"folded into a
      rectangle"、"laid flat"、"stacked"、"evenly aligned"、"symmetrically arranged"、"paired side-by-side"
      和 "display-like parallel placement"。除非当前可见活动就是有意打包，否则将这些状态替换为精确、自然的脱下后位置。不要否决自身翻折的腰带、塌成褶皱的布料或自然折在另一裤腿下的空裤腿；这些是脱下后的物理形状，不是有序收纳。当可见地点的普通当前功能确实需要时，显示器、线缆或设备架仍有效；绝不将其描述为不可见拍摄系统的一部分。"Crew
      cut" 和 "crew-neck" 仍是有效的外观与衣物结构用语。对于 "STILL ANCHOR"，搜索 "rocking"、"grinding"、"thrusting"、"pumping"、"bouncing"、"stroke"、"sway"
      和 "reposition"。将任何主要身体运动重写为一个保持不动的瞬间，或选择另一运动模式。
