id: jav-dvd-wrap
policy: standard-story
description: 创作原创、可直接投入制作的成人视频 DVD 环绕封套 Theme 和完成的包装 Frame。以日本成人视频零售包装密集、多彩的视觉语言作为宽泛设计灵感，不复现任何真实片名、表演者、制片厂、标志、产品代码、照片、角色或现有包装。每个
  Frame 都必须展示一张完整的平面横向封套：左侧封底、中央窄书脊、右侧封面。
generation:
  output_language: english
requirements:
  output_languages:
  - english
modules:
- id: design-visible-copy
  parameters:
    product: sleeve
    copy_language: english
    ascii: required
validation:
  frames:
    checks:
    - type: ascii
    - type: word_count
      min_words: 500
      max_words: 1300
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 在 aesthetic 级别，使用完整不透明衣着创作挑逗性的成人时尚包装。强调大胆姿势、贴身轮廓、光亮衣着、挑逗眼神、多彩零售图形，以及暗示性但非性的互动。不得出现裸体、透明生殖器遮蔽或性玩具。
    erotic:
      shared:
      - 在 erotic 级别，包装造型可采用半透明内衣、敞开或部分脱下的衣物、跨坐、分腿或后向姿势，以及湿润皮肤。通过姿势、裁切、布料、手部位置或另一具身体，让生殖器细节保持含蓄或被遮住。
    hardcore:
      shared:
      - 在 hardcore 级别，每张剧照只用一个清晰可读的主要动作、物理可信的接触几何、可追溯肢体，以及主动成年参与的表情。不得把无关行为堆在一个身体团块中，也不得用装饰文字遮挡正在参与的身体部位。所有插入物都必须是明确为生殖器或肛门使用设计、对身体安全的性玩具。绝不插入瓶子、食物、家居物品、摄影棚工具、武器或临时拼凑的道具。
  themes:
    common:
    - 结果是完全正面观看的最终印刷设计本身。它不是 DVD 盒样机、产品照片、打开的小册子、立起的盒子、倾斜包装、透视渲染、接触印样、分镜、网页或分开的封面与封底图像。
    - 生成 Theme 时，标题、前提和风格也必须使用仅含 ASCII 字符的英语。
    - 封套任何位置印出的每个可读词，都必须是精确且合乎语法的英语，只使用无重音拉丁字母、阿拉伯数字、空格及标准 ASCII 标点。不得出现日语假名或汉字、中文字符、韩文字母、西里尔字母、带重音字母、伪字母、自造字形、无意义拉丁占位文、占位文案、畸形词、随机符号或乱码。
    - 在任一阶段返回前，将弯引号替换为直 ASCII 引号，将每个短破折号、长破折号和不换行连字符替换为普通连字符，将不换行空格替换为普通空格，并改写所有剩余的非 ASCII 字符。
    - 严格使用指定人物阵容，不得增加任何人。每位表演者都必须明显是成熟的中国成年人，有一个至少 25 岁的精确年龄。所有表演者都清醒、自愿、相互回应且随时可以停止。表情和肢体语言必须传达主动参与、自信、愉悦、玩心或有意识的表演，而非恐惧、痛苦、困惑、睡眠、醉酒、丧失自主的束缚或苦恼。
    - 在一个 Theme 内保持每位表演者身份不变。每个人都须有独特面容、发型、体型、衣着或脱衣状态、姿势角色和反应。多人构图中，头部分离，手可追溯至所属人物，肢体解剖连续，接触点物理可信。
    - 当请求阵容是一名女性、零名男性时，所有封面、封底及嵌入照片都严格为单人。只展示她自己的自我触摸、自慰，或使用一个为所描绘接触专门设计的身体安全性玩具。不得提及、暗示、裁去或展示任何伴侣、恋人、来宾、观察者、摄影师、镜头外参与者、第二具身体、多余手部、局部头部、嘴、阴茎、朝向另一人的穿戴式假阳具，或与照片之外某人的互动。片名、宣传语、剧情简介、卖点标签和前提都必须描述单人自主行为，不得包含复数恋人或双人行动。
    - 不得使用学校场景、与未成年人关联的制服、青少年化语言、家庭角色性化、胁迫、偷拍构图、失去行为能力、人口贩运、缺乏明确热情的羞辱、窒息、伤害、血液、武器或危险插入。
    - Theme 和 Frame 阶段必须严格遵守请求的内容级别。内容级别控制虚构制作前提、主图、嵌入图选择、衣着、姿势、互动、标题语气、宣传语、卖点标签和视觉重点。
    - 每个 Theme 发明一部原创虚构成人影片，并锁定：
    - 一个简洁英语产品标题和一句简短宣传承诺；
    - 精确指定阵容，具有固定成年年龄、身份、体型和角色；
    - 一个内容级别特定的前提、场景家族、关系动态和表演概念；
    - 一个封面主图动作及一组相容的封底剧照；
    - 一套独特零售配色，使用两种主色、一种强调色、黑色及白色；
    - 一种展示字体策略、一套边框和间隔系统，以及一种印刷工艺；
    - 一个虚构英语制片厂标识、产品代码模式、片长范围、卖点词汇和条码编号；以及
    - 一种精确平面封套几何，具有封底、书脊和封面的层级。
    - 虚构所有姓名、标题、标签、代码、公司和署名。不得使用真实表演者姓名、制片厂、发行商、网站、社交账号、商标、认证标志、受版权保护的片名或可识别包装布局。
    - 不同 Theme 之间变化前提、关系、布景、季节、时段、人物造型、体型、主图动作、嵌入图动作、配色、标题构造、边框形状、版面节奏、产品家族、照明、镜头和印刷工艺。不得让同一种发型、黑色内衣、白床、红色标题、以乳房为中心的裁切或相同缩略图网格主导一批方案。
  frames:
    common:
    - 结果是完全正面观看的最终印刷设计本身。它不是 DVD 盒样机、产品照片、打开的小册子、立起的盒子、倾斜包装、透视渲染、接触印样、分镜、网页或分开的封面与封底图像。
    - 无论请求的输出语言为何，Frame 全文必须使用合乎语法的英语。完整 Frame 的每个字符都必须位于 ASCII 码点 0 至 127。
    - 封套任何位置印出的每个可读词，都必须是精确且合乎语法的英语，只使用无重音拉丁字母、阿拉伯数字、空格及标准 ASCII 标点。不得出现日语假名或汉字、中文字符、韩文字母、西里尔字母、带重音字母、伪字母、自造字形、无意义拉丁占位文、占位文案、畸形词、随机符号或乱码。
    - 在任一阶段返回前，将弯引号替换为直 ASCII 引号，将每个短破折号、长破折号和不换行连字符替换为普通连字符，将不换行空格替换为普通空格，并改写所有剩余的非 ASCII 字符。
    - 最终段落中未声明的所有可承载文字表面必须保持空白，不得有类似字母的标记。不得用不可读微小文字作纹理。通过边框、色块、半色调网点、线条、星、心、箭头、几何爆发图形、摄影版块和印刷工艺实现视觉密度，而非伪造文字。
    - 使用一张连续横向画布，宽高比介于 1.9:1 和 2.15:1。四边完整裁切线必须可见。封底约占宽度的百分之 43 至 46，书脊占百分之 6 至 8，封面占百分之 47 至 50。两条笔直竖向折线分隔三个区域。所有关键面孔、身体部位、标题、产品代码和条码静区都须远离折线和裁切边缘。
    - 封底、书脊和封面必须共享同一产品身份、标题、阵容、配色、字体家族、印刷工艺和内容级别。它们必须呈现为一套协调的零售封套，同时各自职责明确不同：
    - 封面：一眼可见的主图、主导标题、简短宣传语、表演者标识和一个紧凑产品代码；
    - 书脊：精确标题、虚构制片厂标识、产品代码及一个小型抽象品牌标记，全部按书架阅读需求对齐；
    - 封底：一张次级主图剧照、六至九张有边框的嵌入剧照、简短剧情简介、两三个卖点标签、技术信息、成人提示、虚构署名和一个整洁条码区。
    - 封面使用一张主导成年主图照片，约占其面积的百分之 55 至 72。指定阵容必须立即可读，面孔区分明确、人体连贯且关系有意设计。使用强烈直接对视、邀请性的表演手势或明确的内容级别动作。大胆裁切，但保留理解姿势和互动所需的所有身体部位。
    - 将封面标题构建为大型一体化形状，而非漂浮在照片上的普通文字。可使用膨胀展示字体、描边窄体、叠词、弯曲基线、亮面高光、半色调阴影、彩色挖空、心、星、箭头或有活力的速度线。保持标题完全可读，不得覆盖眼睛、嘴、手、乳房、生殖器或主要身体互动。
    - 只使用一至两个辅助文字群。保持清晰的首读顺序：主图面容与身体，然后标题，再到宣传语和产品代码。不得在所有空白区域填字。
    - 从同一虚构制作中选择一张较大的次级剧照及六至九张较小剧照。将其排列于受控两栏或三栏网格中，尺寸有意识地变化。每张剧照必须具有完整可见的矩形、圆角、圆形或撕纸边框，以及实心间隔。任何身体、面容、手、肢体、道具、体液或衣物都不得从一张剧照跨入另一张。
    - 每个嵌入图是一个独立摄影瞬间，具有自身连贯的摄影机位置、背景、照明、人体和裁切。绝不在一个嵌入图内混合两个场景。相邻面孔和身体之间至少保持一个可见间隔宽度。不得将面孔局部置于另一版块之下、让皮肤与边框融合、让肢体跨越间隔延续、复制眼睛、创建共享躯干，或让排版像多余身体部位。
    - 同一批指定成年人可在分开的剧照中反复出现，但身份锚点须稳定：精确年龄、面容、头发、身体比例、皮肤标记和角色。不得发明额外表演者、观众、工作人员、反射人物、屏幕人物、印刷肖像、剪影或背景人物。多人阵容可在各张封底剧照中共同出现或以子集出现，但每位指定成年人都必须明确出现在封面上，并在封底剧照中至少出现两次。
    - 在封底一角附近预留一个干净矩形条码区。渲染外观有效的黑白条码，具有静区边缘，并在最终文字段落中声明一个精确虚构的 13 位数字编号。条码与面孔、身体、折线和装饰图案分离。
    - 严格使用指定人物阵容，不得增加任何人。每位表演者都必须明显是成熟的中国成年人，有一个至少 25 岁的精确年龄。所有表演者都清醒、自愿、相互回应且随时可以停止。表情和肢体语言必须传达主动参与、自信、愉悦、玩心或有意识的表演，而非恐惧、痛苦、困惑、睡眠、醉酒、丧失自主的束缚或苦恼。
    - 当请求阵容是一名女性、零名男性时，所有封面、封底及嵌入照片都严格为单人。只展示她自己的自我触摸、自慰，或使用一个为所描绘接触专门设计的身体安全性玩具。不得提及、暗示、裁去或展示任何伴侣、恋人、来宾、观察者、摄影师、镜头外参与者、第二具身体、多余手部、局部头部、嘴、阴茎、朝向另一人的穿戴式假阳具，或与照片之外某人的互动。片名、宣传语、剧情简介、卖点标签和前提都必须描述单人自主行为，不得包含复数恋人或双人行动。
    - 不得使用学校场景、与未成年人关联的制服、青少年化语言、家庭角色性化、胁迫、偷拍构图、失去行为能力、人口贩运、缺乏明确热情的羞辱、窒息、伤害、血液、武器或危险插入。
    - Theme 和 Frame 阶段必须严格遵守请求的内容级别。内容级别控制虚构制作前提、主图、嵌入图选择、衣着、姿势、互动、标题语气、宣传语、卖点标签和视觉重点。
    - 每个 Frame 都是当前 Theme 的自成一体、完整环绕封套。各 Frame 是并行宣传变体，而非连续故事节点、替代页面、仅有封面或封底的半幅，或前后对比视图。每个 Frame 都必须重述渲染完整封底—书脊—封面封套所需的一切视觉信息，不引用其他
      Frame。
    - 同一个 Theme 内，保持标题、阵容、成年年龄、身份、前提、内容级别、虚构制片厂、产品代码、条码编号及核心配色。充分变化主图裁切、封底网格、展示字体、辅助母题、嵌入图选择、主导色和印刷处理，让每个
      Frame 都是真正不同的包装提案。
    - 绝不使用表示相同、完全一致、再次、先前、保持不变、继续、不同角度、替代版本、较早 Frame、另一个 Frame 或另一视图的措辞。只描述当前完成的封套。
    - 照片必须像在真实成人制作环境拍摄，而非合成。使用有动机的实景光或摄影棚光、真实皮肤纹理、毛孔、细毛、织物张力、压痕、材料反射和可信深度。保持面孔跨版面可辨认，但不要让每个表情完全相同。
    - 每个版面内部使用正常摄影透视。主图优先使用 35 至 85 毫米等效镜头，群体剧照使用 35 至 50 毫米。避免鱼眼畸变、巨头、小肢体、重复身体、悬浮手、不可能关节、融合人体、融化衣物、皮肤与家具合并，以及不一致的生殖器位置。
    - 将封套渲染为亮面涂布纸上的专业胶印。允许受控半色调网点、局部亮光、金属箔、压凸标题边缘、轻微网点扩大、叠印、纸张纹理及精确模切对齐。不得添加随机损伤、重折痕、塑料盒反光、透视扭曲或样机阴影。
    - 通过层级而非失控拼贴捕捉参考的活跃零售密度。使用大胆有限配色、粗描边、带框照片说明、棱角缎带、爆发形、圆点、心、星、斜线，以及交替的黑、白和饱和色域。保持一张主导封面主图、一张主导封底主图，以及穿过嵌入图网格的可读路径。
    - 不得模仿特定现有封套。避免每个 Theme 都使用固定红白黑公式。轮换洋红—青—黄、珊瑚—藏青—奶油色、紫罗兰—青柠—银、猩红—粉—黑、钴蓝—橙—白、祖母绿—金—梅紫，以及其他适合前提的高对比组合。
    - 可见文案保持足够简洁，以便干净渲染。每个 Frame 都必须包含：
    - 一个二至六个英语词的精确标题，出现在封面并在书脊重复；
    - 一句三至九个词的封面宣传语；
    - 每位指定成年人一个使用英语 ASCII 的虚构艺名；
    - 一个由六至十个大写字母、数字或连字符组成的虚构产品代码，在封面、书脊和封底重复；
    - 一条三至八个词的封底标题；
    - 一句八至十六个词的英语剧情简介；
    - 恰好两至三个简短卖点标签；
    - 一行片长、一行格式，以及一处原样写着 `ADULTS 25+` 的成人提示；
    - 一行紧凑的虚构制片厂及署名；以及
    - 一个精确虚构的 13 位数字条码编号。
    - 不得添加影评引文、奖项、真实分级、价格、网址、二维码、社交媒体、电话号码、法律套话或密集段落。文字必须留在指定版面内，绝不能跨越折线。
    - 不得让同一种发型、黑色内衣、白床、红色标题、以乳房为中心的裁切或相同缩略图网格主导一批方案。
    - 任何 Theme 或 Frame 出现以下情况，都必须拒绝并改写：
    - 1. 缺少完整封底、书脊或封面；
    - 2. 输出分开的图像，而非一张平面连续封套；
    - 3. 使用非英语文字、非 ASCII 字符、畸形词、占位内容、伪文字或乱码；
    - 4. 复制真实表演者、制片厂、标志、片名、代码、照片或包装；
    - 5. 改变指定阵容或引入额外人物；
    - 6. 描绘任何未满 25 岁者或使用青少年化造型；
    - 7. 违反请求的内容级别；
    - 8. 合并分开的嵌入场景、让人体跨越间隔，或将人物与版框、道具、衣物或另一身体融合；
    - 9. 裁掉主要动作、创造不连贯人体或使手无法归属；
    - 10. 让标题或装饰遮住面容、手、生殖器或关键接触；
    - 11. 缺少条码静区、产品代码重复、成人提示或版面特定层级；
    - 12. 渲染盒装样机、倾斜包装、光盘、小册子、网页、海报、杂志、接触印样或分镜；
    - 13. 使用回指措辞或描述另一个 Frame；或
    - 14. 在最终专用图中文字段落之前任何位置印出精确文案。
    - 每个 Frame 写成一个详细的英语 ASCII 段落。目标为 700 至 1000 词，严格限定为 500 至 1300 词，包括专用图中文字段落。开头说明这是一张完成的、平面、正面朝向的横向
      DVD 封套，封底在左、书脊居中、封面在右。描述版面比例、精确指定成年阵容、内容级别前提、封面主图、封底主图和嵌入网格、分隔间隙、照明、人体、配色、排版行为、条码区及印刷工艺。封面主图描述少于
      160 词，封底主图少于 100 词，每张嵌入图描述少于 40 词。共享照明、身份、边框和印刷行为只说明一次，不要在每张剧照中重复。
    - 以专用图中文字段落结尾。每个实体出现位置都须声明一次精确可读字符串，包括重复的标题和产品代码位置。完整 Frame 最后一个字符必须是 ASCII 分号。
    - 返回前默默确认：一张完整平面封套；精确阵容；每位成年人至少 25 岁；正确内容级别；连贯人体；分隔的嵌入图；稳定身份；原创产品身份；仅含 ASCII 的英语正文；所有可见文案都声明精确载体及版面位置；无未声明字母或乱码；并以
      ASCII 分号结束。
    - 返回前统计完整 Frame 的词数。拒绝并改写任何少于 500 词或多于 1300 词的 Frame、任何暗示另一个人的单人 Frame，以及任何缺少最终专用图中文字段落或该段落不以 ASCII
      分号结尾的 Frame。
