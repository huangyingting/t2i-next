id: jav-dvd-wrap
description: 创作原创、可直接投入制作的成人视频 DVD 环绕封套 Theme 和完成的包装 Frame。采用日本成人视频零售包装密集、多彩的视觉语言。每个
  Frame 都必须展示一张完整的平面横向封套：左侧封底、中央窄书脊、右侧封面。
modules:
- id: design-visible-copy
  parameters:
    product: sleeve
    copy_language: english
    ascii: required
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 使用完整不透明衣着创作挑逗性的成人时尚包装。强调大胆姿势、贴身轮廓、光亮衣着、挑逗眼神、多彩零售图形，以及暗示性但非性的互动。不得出现裸体、透明生殖器遮蔽或性玩具。
    erotic:
      shared:
      - 包装造型可采用半透明内衣、敞开或部分脱下的衣物、跨坐、分腿或后向姿势，以及湿润皮肤。通过姿势、裁切、布料、手部位置或另一具身体，让生殖器细节保持含蓄或被遮住。
    hardcore:
      shared:
      - 每张剧照只用一个清晰可读的主要动作、物理可信的接触几何、可追溯肢体及主动参与的表情。不得把无关行为堆在一个身体团块中，也不得用装饰文字遮挡正在参与的身体部位。
  themes:
    common:
    - 结果是完全正面观看的最终印刷设计本身。它不是 DVD 盒样机、产品照片、打开的小册子、立起的盒子、倾斜包装、透视渲染、接触印样、分镜、网页或分开的封面与封底图像。
    - 封套任何位置印出的每个可读词，都必须是精确且合乎语法的英语，只使用无重音拉丁字母、阿拉伯数字、空格及标准 ASCII 标点。不得出现日语假名或汉字、中文字符、韩文字母、西里尔字母、带重音字母、伪字母、自造字形、无意义拉丁占位文、占位文案、畸形词、随机符号或乱码。
    - 严格使用指定人物阵容，不得增加任何人。表演者具有成熟的中国人外貌，表情和肢体语言传达主动参与、自信、愉悦、玩心或有意识的表演。
    - 在一个 Theme 内保持每位表演者身份不变。每个人都须有独特面容、发型、体型、衣着或脱衣状态、姿势角色和反应。多人构图中，头部分离，手可追溯至所属人物，肢体解剖连续，接触点物理可信。
    - 当阵容是一名女性、零名男性时，封面、封底及嵌入照片都严格为单人，只展示她自己的自我触摸、自慰或性玩具使用。画面不含伴侣、镜头外参与者、第二具身体或他人的局部身体，也不呈现与照片之外某人的互动。片名、宣传语、剧情简介及卖点标签均围绕单人行为，不指向复数恋人或双人行动。
    - Theme 和 Frame 阶段必须严格遵守请求的内容级别。内容级别控制虚构制作前提、主图、嵌入图选择、衣着、姿势、互动、标题语气、宣传语、卖点标签和视觉重点。
    - 每个 Theme 发明一部原创虚构成人影片，并锁定：
    - 一个简洁英语产品标题和一句简短宣传承诺；
    - 精确指定阵容，具有固定成年年龄、身份、体型和角色；
    - 一个内容级别特定的前提、场景家族、关系动态和表演概念；
    - 一个封面主图动作及一组相容的封底剧照；
    - 一套独特零售配色，使用两种主色、一种强调色、黑色及白色；
    - 一种展示字体策略、一套边框和间隔系统，以及一种印刷工艺；
    - 一个虚构英语制片厂标识、产品代码模式、片长范围、卖点词汇和条码编号；以及
    - 一种精确平面封套几何，具有封底、书脊和封面的层级。
    - 姓名、标题、标签、代码、公司和署名共同形成虚构影片的产品身份。
    - 不同 Theme 之间变化前提、关系、布景、季节、时段、人物造型、体型、主图动作、嵌入图动作、配色、标题构造、边框形状、版面节奏、产品家族、照明、镜头和印刷工艺。不得让同一种发型、黑色内衣、白床、红色标题、以乳房为中心的裁切或相同缩略图网格主导一批方案。
  frames:
    common:
    - 结果是完全正面观看的最终印刷设计本身。它不是 DVD 盒样机、产品照片、打开的小册子、立起的盒子、倾斜包装、透视渲染、接触印样、分镜、网页或分开的封面与封底图像。
    - 封套任何位置印出的每个可读词，都必须是精确且合乎语法的英语，只使用无重音拉丁字母、阿拉伯数字、空格及标准 ASCII 标点。不得出现日语假名或汉字、中文字符、韩文字母、西里尔字母、带重音字母、伪字母、自造字形、无意义拉丁占位文、占位文案、畸形词、随机符号或乱码。
    - 文案之外的表面保持空白，不添加类似字母的标记或不可读微小文字纹理。通过边框、色块、半色调网点、线条、星、心、箭头、几何爆发图形、摄影版块和印刷工艺实现视觉密度，而非伪造文字。
    - 使用一张连续横向画布，宽高比介于 1.9:1 和 2.15:1。四边完整裁切线必须可见。封底约占宽度的百分之 43 至 46，书脊占百分之 6 至 8，封面占百分之 47 至 50。两条笔直竖向折线分隔三个区域。所有关键面孔、身体部位、标题、产品代码和条码静区都须远离折线和裁切边缘。
    - 封底、书脊和封面必须共享同一产品身份、标题、阵容、配色、字体家族、印刷工艺和内容级别。它们必须呈现为一套协调的零售封套，同时各自职责明确不同：
    - 封面：一眼可见的主图、主导标题、简短宣传语、表演者标识和一个紧凑产品代码；
    - 书脊：精确标题、虚构制片厂标识、产品代码及一个小型抽象品牌标记，全部按书架阅读需求对齐；
    - 封底：一张次级主图剧照、六至九张有边框的嵌入剧照、简短剧情简介、两三个卖点标签、技术信息、成人提示、虚构署名和一个整洁条码区。
    - 封面使用一张主导成年主图照片，约占其面积的百分之 55 至 72。指定阵容必须立即可读，面孔区分明确、人体连贯且关系有意设计。使用强烈直接对视、邀请性的表演手势或明确的内容级别动作。大胆裁切，但保留理解姿势和互动所需的所有身体部位。
    - 将封面标题构建为大型一体化形状，而非漂浮在照片上的普通文字。可使用膨胀展示字体、描边窄体、叠词、弯曲基线、亮面高光、半色调阴影、彩色挖空、心、星、箭头或有活力的速度线。保持标题完全可读，不得覆盖眼睛、嘴、手、乳房、生殖器或主要身体互动。
    - 只使用一至两个辅助文字群。保持清晰的首读顺序：主图面容与身体，然后标题，再到宣传语和产品代码。不得在所有空白区域填字。
    - 从同一虚构制作中选择一张较大的次级剧照及六至九张较小剧照。将其排列于受控两栏或三栏网格中，尺寸有意识地变化。每张剧照必须具有完整可见的矩形、圆角、圆形或撕纸边框，以及实心间隔。任何身体、面容、手、肢体、道具、体液或衣物都不得从一张剧照跨入另一张。
    - 每个嵌入图是一个独立摄影瞬间，具有自身连贯的摄影机位置、背景、照明、人体和裁切。绝不在一个嵌入图内混合两个场景。相邻面孔和身体之间至少保持一个可见间隔宽度。不得将面孔局部置于另一版块之下、让皮肤与边框融合、让肢体跨越间隔延续、复制眼睛、创建共享躯干，或让排版像多余身体部位。
    - 同一批指定成年人可在分开的剧照中反复出现，但身份锚点须稳定：精确年龄、面容、头发、身体比例、皮肤标记和角色。不得发明额外表演者、观众、工作人员、反射人物、屏幕人物、印刷肖像、剪影或背景人物。多人阵容可在各张封底剧照中共同出现或以子集出现，但每位指定成年人都必须明确出现在封面上，并在封底剧照中至少出现两次。
    - 在封底一角附近预留一个干净矩形条码区。渲染外观有效的黑白条码，具有静区边缘和精确虚构的 13 位数字编号。条码与面孔、身体、折线和装饰图案分离。
    - 严格使用指定人物阵容，不得增加任何人。表演者具有成熟的中国人外貌，表情和肢体语言传达主动参与、自信、愉悦、玩心或有意识的表演。
    - 当阵容是一名女性、零名男性时，封面、封底及嵌入照片都严格为单人，只展示她自己的自我触摸、自慰或性玩具使用。画面不含伴侣、镜头外参与者、第二具身体或他人的局部身体，也不呈现与照片之外某人的互动。片名、宣传语、剧情简介及卖点标签均围绕单人行为，不指向复数恋人或双人行动。
    - Theme 和 Frame 阶段必须严格遵守请求的内容级别。内容级别控制虚构制作前提、主图、嵌入图选择、衣着、姿势、互动、标题语气、宣传语、卖点标签和视觉重点。
    - 每个 Frame 都是当前 Theme 的自成一体、完整环绕封套。各 Frame 是并行宣传变体，而非连续故事节点、替代页面、仅有封面或封底的半幅，或前后对比视图。每个 Frame 都必须重述渲染完整封底—书脊—封面封套所需的一切视觉信息，不引用其他
      Frame。
    - 同一个 Theme 内，保持标题、阵容、成年年龄、身份、前提、内容级别、虚构制片厂、产品代码、条码编号及核心配色。充分变化主图裁切、封底网格、展示字体、辅助母题、嵌入图选择、主导色和印刷处理，让每个
      Frame 都是真正不同的包装提案。
    - 照片必须像在真实成人制作环境拍摄，而非合成。使用有动机的实景光或摄影棚光、真实皮肤纹理、毛孔、细毛、织物张力、压痕、材料反射和可信深度。保持面孔跨版面可辨认，但不要让每个表情完全相同。
    - 每个版面内部使用正常摄影透视。主图优先使用 35 至 85 毫米等效镜头，群体剧照使用 35 至 50 毫米。避免鱼眼畸变、巨头、小肢体、重复身体、悬浮手、不可能关节、融合人体、融化衣物、皮肤与家具合并，以及不一致的生殖器位置。
    - 将封套渲染为亮面涂布纸上的专业胶印。允许受控半色调网点、局部亮光、金属箔、压凸标题边缘、轻微网点扩大、叠印、纸张纹理及精确模切对齐。不得添加随机损伤、重折痕、塑料盒反光、透视扭曲或样机阴影。
    - 通过层级而非失控拼贴捕捉参考的活跃零售密度。使用大胆有限配色、粗描边、带框照片说明、棱角缎带、爆发形、圆点、心、星、斜线，以及交替的黑、白和饱和色域。保持一张主导封面主图、一张主导封底主图，以及穿过嵌入图网格的可读路径。
    - 避免每个 Theme 都使用固定红白黑公式。轮换洋红—青—黄、珊瑚—藏青—奶油色、紫罗兰—青柠—银、猩红—粉—黑、钴蓝—橙—白、祖母绿—金—梅紫，以及其他适合前提的高对比组合。
    - 可见文案保持足够简洁，以便干净渲染。每个 Frame 都必须包含：
    - 一个简短醒目的英语标题，出现在封面并在书脊重复；
    - 一条简短的封面宣传语；
    - 每位指定成年人一个使用英语 ASCII 的虚构艺名；
    - 一个由大写字母、数字或连字符组成的紧凑虚构产品代码，在封面、书脊和封底重复；
    - 一条简短的封底标题；
    - 一段低密度英语剧情简介；
    - 恰好两至三个简短卖点标签；
    - 一行片长、一行格式，以及一处原样写着 `ADULTS 25+` 的成人提示；
    - 一行紧凑的虚构制片厂及署名；以及
    - 一个精确虚构的 13 位数字条码编号。
    - 不得添加影评引文、奖项、真实分级、价格、网址、二维码、社交媒体、电话号码、法律套话或密集段落。文字必须留在指定版面内，绝不能跨越折线。
    - 不得让同一种发型、黑色内衣、白床、红色标题、以乳房为中心的裁切或相同缩略图网格主导一批方案。
    - 每个 Frame 独立呈现完整的平面横向 DVD 封套，封底在左、书脊居中、封面在右；版面比例、指定阵容、所选级别内容、两张主图、嵌入网格、分隔间隙、照明、人体、配色、排版、条码区及印刷工艺共同形成完整包装。画面不是光盘、海报或杂志。
