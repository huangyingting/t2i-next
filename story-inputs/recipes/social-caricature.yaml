authoring:
  level_refinements:
    aesthetic:
      shared:
      - 所有成年人穿完整不透明服装，不实施性行为。
    erotic:
      shared:
      - 每位成年人都明显与另一位请求的成年人相互给予和接受感官接触；显示裸露的乳房或臀部，但绝不称其为露骨行为，也不直接刺激生殖器。
      frames:
      - 每位人物都可见地给予和接受相互感官接触。
    hardcore:
      shared:
      - 同一露骨行为已在进行且无遮挡，每位指定人物以与他人的插入、口与生殖器接触或直接生殖器刺激参与，确切部位和接触路径清晰；观看、亲吻、扶肩、等待或拿道具不替代参与。
      frames:
      - 所有指定人物已共同参与同一正在进行的露骨行为。
  themes:
    common:
    - 画面构成：
    - 1. 指定阵容、稳定身份、成熟外貌、清楚衣着与接触；
    - 2. 一条将身体、讽刺、隐喻和标签连接起来的闭合因果受力链；
    - 3. 明显不可能但连续的人体结构，每人一项夸张；
    - 4. 无环境纵深的平面真人摄影剪贴；
    - 5. 恰好两个可读英文标签，没有其他图中文字。
    - 人物具有成熟外貌和稳定当地姓名，保留中国大陆、台湾、香港、日本、韩国或新加坡华人的身份，场景位于这些地区之一。严格保留指定女性、男性和总人数，不添加旁观者、倒影、肖像、人体模型或类人背景人物。
    - 移位衣物清楚，不遮盖或穿越接触；人物相互回应并有物理支撑。
    - 构建一条闭合因果受力链，而非放在象征道具旁的性场面：
    - 1. 中心女性的亲密动作施加一个可见的定向力；
    - 2. 另一参与者的身体将同一作用力传入主要隐喻；
    - 3. 主要隐喻因身体作用而发生可见的机械状态变化；
    - 4. 改变后的机构将压力重新传给每位其余参与者；
    - 5. 每个反应延续接触并改变群体剪影。抬起/放下、推/拉、打开/关闭、给予/索取、承载/释放、进入/阻挡或保持/让步等成对动作贯穿身体、机构、夸张特征和两个标签。至少两人直接触碰、加载、抓握、支撑、阻挡、倾斜、打开、关闭、拉伸或压缩主要机构，身体互动与机构的可见变化相互依赖。
    - 劳动、功劳、隐私、地位、关注、照料、欲望、礼仪、消费、家庭、友谊或工作的矛盾通过熟悉物品的功能呈现：秤称重、门控制准入、传送带转移、磁铁吸引、伞遮护或桌子分隔。机构占画布百分之三十五到五十，支撑、分隔、承载、围住人物或改变其方向。同一隐喻类别恰有一个实体辅助物品，没有第二件道具、堆、成对物、碎屑、散落食物或泼洒液体；辅助物不是文件、卡片、通行证、面板、量表、刻度盘或印刷物。笑话由动作和几何直接可读。
    - 每人是完整摄影人物：一个头、一个躯干、两条相连手臂、两手、两条相连腿、两脚，从头到脚不裁切、不融合、不重复或隐藏部位。每人恰有一项不依赖镜头透视的不可能比例：一只相连手或一条手臂为正常二点五到三倍；整体头发与头部为一点五倍；一条连续肢体长近两倍；全身剪贴高一点五倍或宽五分之三；或头发、衣物体积宽三倍。夸张剪影主导机构，并通过抓握、称重、阻挡、支撑、倾斜或转向承力。关节、皮肤和归属连续，不分离、粘贴、悬浮、拼接、折叠、融化或放大孤立器官；不以身体恐怖、孩童体态、巨眼或性器官作为夸张重点。
    - 真人照片构成正面完整人物硬边剪贴，置于单一哑光色域和正投影海报平面，均匀无影棚光、硬外缘、窄接触阴影与零环境纵深。保留毛孔、自然皮肤半透明感、细发、织纹和真实眼睛，不出现盒状房间、地板线、墙角、天花板、广角、俯仰透视、透视缩短、散景、插画、动画、计算机生成质感或玩偶脸。
    - 两个简短低密度的大写 ASCII 英文标签表达相反力量，同一主题各幅画面的准确文案一致。
    - 不同主题的生活领域、关系、机构、受力动作、布局、配色和情感基调具有实质变化。
