    - 清晰说明移位衣物；衣物不得遮盖或穿越接触。所有人都清醒、自愿、积极回应、有支撑且能停止。不得有胁迫、羞辱、束缚、伤害、醉酒或药物影响、睡眠、危险悬吊、武器，或靠近身体的不安全物品。
    - 构建一条闭合因果受力链，而非放在象征道具旁的性场面：
    - 1. 中心女性的亲密动作施加一个可见的定向力；
    - 2. 另一参与者的身体将同一作用力传入主要隐喻；
    - 3. 主要隐喻因身体作用而发生可见的机械状态变化；
    - 4. 改变后的机构将压力重新传给每位其余参与者；
