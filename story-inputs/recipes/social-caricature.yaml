    - 每个人都是年满二十五岁的虚构成年人。允许的身份为中国大陆人、台湾人、香港华人、日本人、韩国人和新加坡华人。场景设在这些地区之一，使用合理的当地 ASCII 拉丁字母姓名，绝不以身份为笑点。阵容数量仅来自生成请求。不得推断、默认或硬编码女性数量、男性数量或总数。不得添加旁观者、倒影、肖像、人体模型、儿童或类人背景人物。无论请求何种语言，所有主题字段和画面都用英文编写。仅用
