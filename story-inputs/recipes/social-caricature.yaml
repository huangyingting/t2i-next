  level_refinements:
    aesthetic:
      shared:
      - 所有成年人穿完整不透明服装，不实施性行为。
    erotic:
      shared:
      - 每位成年人都明显与另一位请求的成年人相互给予和接受感官接触；显示裸露的乳房或臀部，但绝不称其为露骨行为，也不直接刺激生殖器。
      frames:
      - 动态阵容声明之后，下一句严格以此开头："All requested adults visibly give and receive reciprocal sensual contact:"。
    hardcore:
      shared:
      - 显示一个已在进行且无遮挡的自愿露骨行为。每位请求的参与者都必须通过与另一位请求参与者的插入、口与生殖器接触或直接生殖器刺激而参与。观看、亲吻、扶肩、等待或拿道具都不足够。每次接触都重复明确的人体部位名词；仅有动作词无效。
      frames:
      - 动态阵容声明之后，下一句严格以此开头："All requested adults are already joined in one consensual explicit act:"，并在八十个英文单词内涵盖每位参与者。
