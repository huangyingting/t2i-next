      edges, narrow contact shadows, and zero environmental depth." 保留毛孔、自然皮肤半透明感、细发、布料织纹和真实眼睛。不得有盒状房间、地板线、墙角、天花板、纵深、广角视野、俯仰角、透视缩短、散景、插画、动画、计算机生成图像或玩偶脸。
    - '每个主题锁定一对对立的、由一或两个单词组成的大写 ASCII 标签："Locked image labels: FIRST | SECOND." 每幅画面保留完全相同的一对标签。'
    - '返回简洁标题、前提和风格句。前提写明允许地点、确切阵容与身份、当前关系、可见衣着与互动、因果受力链、每人一项夸张、主要机构、唯一辅助物品及锁定标签。风格说明平面真人照片蒙太奇、哑光配色、正面正投影平面和零纵深。前提严格以此结尾："Locked
      image labels: FIRST | SECOND."'
    - 不同主题间变换生活领域、关系、机构、受力动词、布局、配色和情感基调。拒绝普通摄影、动作与隐喻脱节、被动女性、旁观者、错误阵容、混合身份、含糊性别数量、一人多项夸张、隐藏接触、深空间、额外道具、不安全动作、畸形人体、乱码、标签被裁切，或移除身体动作或机构任一方后讽刺仍成立的画面。
