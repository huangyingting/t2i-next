authoring:
  level_refinements:
    aesthetic:
      shared:
      - 每位成年人穿完整不透明服装，互动不含情色。
      - 通过直接接触或力的传递将每位成年人与主要结构相连。写明每个接触点、力的方向、即时物理变化，以及返回到另一人身上的影响。
    erotic:
      shared:
      - 露出至少一处成年人的乳房或臀部，并显示相互感官接触；不得直接刺激生殖器。
      - 如实描述移位衣物。所有人保持清醒、相互回应、明显自愿且能停止。讽刺针对非性的社会矛盾；行为是独立选择的娱乐，绝不是证据、付款、入门仪式、惩罚、要挟手段，或就业、金钱、成绩、资助、住房、准入、地位或安全的条件。无人索要、要求、强迫、购买、交换、奖赏或记录该行为。排除胁迫、施压、受损同意能力、伤害、呼吸受限、危险悬吊、武器，以及未请求的绑缚支配施虐受虐或性玩具。裸体和人体解剖绝不是笑点。
      - 移位或剩余衣物仍保留造型，但不得遮盖所需人体部位或接触。
      - 通过直接接触或力的传递将每位成年人与主要结构相连。写明每个接触点、力的方向、即时物理变化，以及返回到另一人身上的影响。
    hardcore:
      shared:
      - 显示一个已经进行的自愿露骨成年行为，并写明每位参与者的人体部位与接触角色。每位参与者必须持续以生殖器、嘴或手接触另一位参与者所涉及的裸露性部位；观看、记录、拿无关物品、指导姿势或触碰衣物均不算。三人或以上时，按
        A > B > C 并继续排列阵容，仅允许相邻配对的性接触，接触总数恰为人数减一。三人时，Contact 1 为 A 的一个部位接触 B 的一个部位；Contact 2 为 B 的另一个部位接触
        C 的一个部位；C 绝不接触 A，且无人实施或接受第二次性接触。每只主动的手、每张嘴和每个生殖器各指定一个专属目标；绝不增加自我刺激或装饰性性接触。
      - 如实描述移位衣物。所有人保持清醒、相互回应、明显自愿且能停止。讽刺针对非性的社会矛盾；行为是独立选择的娱乐，绝不是证据、付款、入门仪式、惩罚、要挟手段，或就业、金钱、成绩、资助、住房、准入、地位或安全的条件。无人索要、要求、强迫、购买、交换、奖赏或记录该行为。排除胁迫、施压、受损同意能力、伤害、呼吸受限、危险悬吊、武器，以及未请求的绑缚支配施虐受虐或性玩具。裸体和人体解剖绝不是笑点。
      - 移位或剩余衣物仍保留造型，但不得遮盖所需人体部位或接触。
      - 露骨行为是唯一正在进行的人类动作；主要结构则支撑、分隔、压缩、倾斜、框定相连身体或使其失衡，让隐喻与接触不可分离。为每位具名成年人提供一个可见的接触—力—结果分句。旁观、拿无关物品或执行独立任务不算参与。
      - 硬边只能接触脚、膝、手或前臂。宽阔平面可无压迫地支撑背部或坐部；任何结构都不得挤压、楔住、困住或横切头、颈、肩、躯干、髋、骨盆或性接触路径。
      themes:
      - '在前提的 "Staging:" 分句之后、锁定文字对之前，直接列出 A > B > C 链及编号接触，不加等级或证明标题。三人时，Contact 1 写明 A 的哪个部位接触 B 的哪个部位，Contact 2 写明 B 的另一个部位接触 C 的哪个部位，并明确没有其他性接触；更大阵容沿用相邻链与编号扩展，仍恰有人数减一处接触。'
      frames:
      - 拒绝含旁观者的结果。
  themes:
    common:
    - 每个主题和画面按以下顺序处理：请求的确切阵容；允许的身份和地点；衣着与接触边界；中心女性的能动性；一次共同互动；动作与隐喻的因果关系；强烈的身体夸张；统一混合媒介；精确可见文字；装饰细节。后面的选择绝不能削弱前面的选择。
    - 严格采用脚本请求的女性和男性数量。不得推断、采用默认值或硬编码人数。不得添加旁观者、儿童、人群、肖像、倒影、屏幕人物、雕像、人体模型或类似另一个人的身体碎片。
    - 每位可见人物都是虚构、自愿、清醒、年满二十五岁的东亚成年人。为每人从此列表逐字选用恰好一个身份短语："mainland Chinese"、"Taiwanese"、"Hong Kong Chinese"、"Japanese"、"South
      Korean" 或 "Singaporean Chinese"。不得添加第二个国籍、公民身份、侨民身份、混合身份或矛盾身份。场景设在中国大陆、台湾、香港、日本、韩国或新加坡，并使用合理的 ASCII
      拉丁字母姓名。明确写出每人的性别，姓名采用正常的首字母大写格式，绝不用全大写姓氏。身份和自然特征绝不是笑点。
    - 无论请求何种语言，每个主题和画面都只用英文 ASCII 编写。返回前，将智能标点、乘号及非英文字符替换为普通 ASCII。大写单词仅保留给两个计划中的可见文字字符串。
    - 为每位成年人提供从头到脚醒目的社论式造型：一种大胆服装轮廓、高对比色块、显眼的构造或材质，以及一种雕塑感发型或可穿戴细节。在四色系统内使每人造型各异，强化社会角色，但不能变成另一种变形、标签、符号或隐喻。拒绝通用默认办公服、朴素基础款、怯弱的中性色和可互换的服装。
    - 背景保持干净：一片宽广哑光色域，加至多两个指示地点的简单几何线索。不得有房间陈设清单、杂乱装饰、标牌、屏幕、远处人物、纵深建筑、附带家具、零散道具或氛围效果。阵容、主要结构和成对母题主导图像。
    - 每位中心女性获得恰好两个协调的变形层次：
    - 1. 一组连贯的面部夸张，至少改变眼睛、眉毛、脸颊、嘴、下颌、鼻子和发型中的两项；以及
    - 2. 一只手、一只脚、一条手臂、一条腿、躯干或全身比例沿纵向拉长、沿横向加宽或均匀放大至正常尺度的二到四倍；或沿纵向缩短、沿横向收窄或均匀缩小至正常尺度的二分之一到四分之一。
    - 明确写出两项面部改变。每项身体或肢体改变都只能采用一个允许的动词与轴向组合及一个数值尺度，并在主题和画面中完全一致。绝不能混合相反的尺寸动词或改变第二条轴。泛化表情或未量化形容词不合格。对应肢体和相邻部位保持普通；绝不通过改变另一部位来补偿某项改变。脸、下颌、头发、颈部、表情和透视均不能满足所需的非面部层次。画面不得创造、扩散、加强或转移其主题未包含的变形。
    - 其余每位成年人恰好获得一种不同的次级面部、身体或肢体变形，以揭示其在同一互动中的角色。只能选择一组面部特征或一项身体或肢体改变，不可兼有。若选身体或肢体，面部保持普通；若选面部，所有身体比例保持普通。姿势、视线和表情可辅助所选变形，但绝不能变成另一项改变特征。
    - 每项变形都应体现人物通过行为表现的缺陷、策略、欲望或反应。面部、身体、手势和动作必须传达同一种特质。不得只是把写实人物放在巨型道具旁，也不得把泛化的震惊当作夸张。矛盾在黑色剪影和缩略图尺寸下仍须明显。
    - 每个身体都须保持成年、人类且解剖结构可追踪：一个可识别的头部和躯干、两条连接的手臂和两条连接的腿。在允许刻意不可能的尺度和比例时，仍须保持关节、接触、平衡及归属可读。尺度改变在指定关节处明确停止，绝不使相邻部位变形。排除多余肢体、重复面孔、融合身体、断裂手指、脱离器官、融化人体、孩童比例、可爱玩偶特征、意外身体恐怖，以及放大的乳房、臀部或生殖器。
    - 构建一个不可分割的视觉等式：一次日常互动 + 一种不对等欲望或虚假表演 + 一个闭合反应回路 + 一个宏大的实体隐喻 = 一个立即可读的社会笑话。
    - 中心女性的决定发起或改变互动方向。其余每位成年人都在同一回路中行动或反应。使用一个占画布百分之三十五到五十的主要隐喻结构。它必须支撑、分隔、压缩、倾斜、弯曲、拉、推、加载、阻挡人物，或以其他方式改变人物，而不是闲置在旁。
    - 描述一个定格瞬间。动作之前，确定每位成年人的左右及遮叠位置、朝向、承重支撑和接触顺序。每次接触须写明两个解剖上可相互到达的表面。保持一致的空间占用图：无实体重叠、无肢体穿过身体或结构、无无支撑悬浮，且空间、姿势、关节、接触顺序和受力方向均不矛盾。任何身体不得穿串、环绕、包缠、编织穿过开口、框架、栏杆、网、家具或结构，也不得被它们横切；整个身体留在一侧，仅接触暴露的外表面。反光道具只显示抽象眩光，绝不重复人物或人体部位。变形只改变尺度，不改变连接、平衡、伸达路径、碰撞或载荷传递。
    - 若场面无法在物理上重建，须重新设计。
    - 对三人链 A > B > C，B 必须位于实际空间中央，并直接邻接两个端点。左右顺序必须是 A-B-C 或 C-B-A，与链条匹配。每个接触面朝向其相邻者。任何人或肢体均不得越过第三个人，或从其后方、周围、上方、下方或体内绕行来接触。
    - 只使用一个辅助母题，以两个相关实体呈现。两者都强化主要隐喻，不引入第二个观念。场景限于两到三个简洁、能识别地点的形状。若去掉人物或主要结构中的任何一方，笑话仍完整，则重新设计场景。
    - 使用一种统一媒介：由分别拍摄的真实成年表演者和物品组成的平面社论式照片蒙太奇，呈现为大胆的成人报纸丝网印刷。每个变形剪贴内的人体皮肤、眼睛、头发、手和布料均保留摄影纹理。拼合的海报采用棱角分明的墨迹式外缘、粗半色调、粗糙新闻纸颗粒、轻微套印错位、窄接触阴影，以及在自然皮肤和头发之外恰好四种主导平面专色色域。
    - 将所有剪贴置于同一浅层海报平面。使用左、中、右、遮叠顺序和负空间，而非自然房间纵深。受控的图形透视缩短可强化变形肢体，但所述二到四倍尺度必须不依赖镜头远近而仍不可能。排除普通生活方式摄影、深远电影空间、光滑修图、柔和散景、完全手绘或画出的角色、动画、漫画、幼体化角色、计算机生成角色和三维吉祥物。
    - 每个完整身体都保留在画框内且视觉上可追踪。允许有意的接触遮叠，但每张脸、关键变形、关键手部、重要接触点和当前动作都须可读。
    - '选择一对对立英文标签，指明两股社会力量。每个标签由一或两个大写 ASCII 单词组成。通过让主题前提严格以下列字符串结尾来锁定该对标签："Locked image labels: FIRST
      LABEL | SECOND LABEL."'
    - '仅返回一个原创标题、一个完整前提段落及一个风格句。前提内按顺序使用以下分句。"Cast:" 列出每个人首字母大写的姓名、至少二十五岁的年龄、明确的女性或男性、一个精确身份和独特衣装。"Deformations:"
      使用格式 "CENTRAL NAME - FACE(feature plus alteration; feature plus alteration), BODY(one nonfacial
      part, allowed verb-axis pair, and valid scale);"，然后为其他每人列出 "NAME - FACE(one altered cluster)"，仅用面部项，或仅用
      "BODY(one part, allowed verb-axis pair, and valid scale)" 身体项。其余前提固定地点、场合、中心目标、矛盾、反应回路、主要隐喻、成对母题和干净背景。"Consent:"
      声明每位成年人都自由选择了与社会利害无关的娱乐。"Staging:" 固定 A-B-C 或 C-B-A 空间顺序、B 居中、各人朝向、支撑及阵容链条。以锁定文字对结尾。风格句重申统一的真人报纸照片蒙太奇媒介。'
