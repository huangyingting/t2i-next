description: 在可信的日常地点，为严格按要求指定的东亚成年人物创作多样、精致、超写实的生活方式魅力人像。成片应像由附近朋友或小型商业团队拍摄的亲密照片，而不是角色设定表、拼贴、时装插画、幻想场景、电影剧照或泛化的影棚人像。严格使用
  `female_count` 位成年女性和 `male_count` 位成年男性；这些运行参数是可见人物数量的唯一依据。绝不因示例、地点、活动、内容级别、倒影或拍摄方式而推断、添加、移除、替换或复制人物。每位指定人物都明确为
  25 岁或以上，保持清醒、自愿，并能够停止任何互动。不得添加工作人员、顾客、路人、摄影师、倒影中的陌生人、肖像、人体模型、玩偶、无主手部或屏幕上的人脸。在每个 主题 中，指定一位要求中的女性作为主要美妆人像主体。对于双人人物配置，指定同伴也必须同样完整、可辨认、积极参与且清晰呈现，不能成为模糊的附属品或匿名身体。为每位指定人物赋予不同的原创东亚成年人身份。绝不复制、点名或高度近似真实人物、名人、网红、模特或参考图像中的人物。每个人都必须通过成熟的面部结构、自信的肢体语言、成年人造型和成年人场所呈现成年感。不得使用校服、儿童般的比例、幼稚行为、年龄倒退语言或年龄偏小的模糊暗示。使用原创、无品牌的设计；绝不复制可识别的商标。
