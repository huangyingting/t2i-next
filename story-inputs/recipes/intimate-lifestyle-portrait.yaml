id: intimate-lifestyle-portrait
cast:
  female_count: 1
requirements:
  female_count:
    min: 1
description: 在可信日常地点，为精确指定的东亚成年阵容创作精致、超写实的生活方式魅力人像，像附近朋友或小型商业团队拍摄的亲密照片，而非角色设定表、拼贴、插画、幻想、电影剧照或泛化影棚人像。保留 female_count 位女性和 male_count 位男性，不添加工作人员、顾客、路人、摄影师、倒影陌生人、肖像、人体模型、玩偶、无主手或屏幕人脸。指定一名女性为主要美妆主体；双人时同伴完整、清晰、可辨且积极参与，不是模糊附属品。每人保留独特原创面孔、成熟面部结构、自信肢体语言及稳定身份，服装与物品采用无品牌设计。
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 使用性感但不露骨的造型：运动胸衣、露肩衬衫、贴身连体衣、比基尼上装、深领口、敞开的外层、短裙、短裤或剪裁合体的性感男装。每个人的乳头和生殖器都保持完全遮盖。
      - 普通素面运动服或基础上衣加短裤组合是不够的。围绕装饰束身上衣、刺绣胸衣、镶宝石连体衣、露肩蕾丝衬衫、雕塑感缎面短上衣、华丽比基尼灵感上装，或同样精巧的原创中心单品，构建华丽、明显性感但完全遮盖的造型。允许深乳沟、侧面镂空、露背、裸肩、高开腿部剪裁、具有吊袜带灵感但保持遮盖的带饰、透明袖子，以及不透明遮盖之上的透明外层。添加垂坠丝绸衬衫、刺绣袍子、短款织锦夹克、羽毛披裹或镶宝石开衫作为第二层。
      - 活动可以亲昵、协作、俏皮、逗趣或安静浪漫。
      themes:
      - 优先采用亲切、俏皮、含蓄娇态、深情、慵懒、梦幻、自信和轻柔调情的表情。
      - 安排一个使用核心道具的普通活动。
      frames:
      - 造型保留中心单品、三种奢华工艺、三件配饰及私密部位的完整遮盖。
      - 从选定相机位置看，乳头和生殖器上的遮盖必须稳定且不透明。
    erotic:
      shared:
      - 采用明确私密或受控的时尚编辑情境。允许部分裸露上身、裸露乳房和可见乳头，或女性仍可由极低领口、敞开袍子、透明蕾丝、宽松裹衣或移位外层遮盖。选择一种有意设计的遮盖状态，并在同一 主题 内保持稳定。成年男性可以赤膊或穿敞开衬衫，但生殖器保持遮盖。双人人物配置可以进行自愿拥抱、亲吻、触碰脸部或头发、牵手、坐在腿上，或紧密协调的摆姿，但不得呈现生殖器接触、插入、玩具、体液或露骨性行为。
      - 活动可以亲昵、协作、俏皮、逗趣或安静浪漫。
      themes:
      - 表情可为逗趣邀约、感官满足、挑逗式自信、以嘴唇为重点的期待与慵懒调情。
      - 安排一个使用核心道具的普通活动。
    hardcore:
      shared:
      - 保留高调实景摄影、美感、时尚、表情和相机语言，呈现明确当前性行为。单女性为独自行为，一女一男或双女性为双方共同参与；解剖、接触点、手部动作与支撑清楚，不只摆姿。面孔、情绪、完整身份、华丽衣着、环境与梦幻真实光线仍重要，不缩减为解剖特写，不增加伴侣、离体部位或隐藏参与者。
      - 所要求的露骨行为取代普通核心道具动作，但保留确切的手部、支撑、视线、情绪和材料反应细节。
      themes:
      - 人物表情与当前互动相互回应，不以泛化色情脸替代具体情绪。
      frames:
      - 每幅画面清楚呈现符合精确阵容的当前性行为，不以裸露或摆姿代替；所有参与者完整入镜。
