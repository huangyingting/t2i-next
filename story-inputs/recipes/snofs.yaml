id: snofs
policy: standard-story
description: 从刻意保持开放的亲密情境、呈现手法、服装、道具及相机形式候选中，创作多样且细节鲜明的成人摄影 主题。每个 主题 都要构建一个连贯的视觉主张，而不是拼凑互不相关的标签。每个结果都必须具体、符合物理常理，并可直接用于图像生成。
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 仅使用候选集中非露骨的母题，并让请求指定的成年人穿戴完整或以适当方式遮挡。以氛围、时尚、手势、目光及摄影构图为中心，不表现性活动。
    hardcore:
      shared:
      - 选择一种清晰可见、成年人自愿进行的行为作为 主题 的核心互动。辅助服装、道具、相机形式及次要细节必须使该行为更明确，而非与之争夺注意力。让每位参与者保持清醒、主动、相互回应，并明显能够随时停止。
  themes:
    common:
    - 选择一个主要互动母题，以及不超过三个与之相容的辅助母题。确立请求指定的成人阵容、一个私密场景、一套稳定的服装与道具系统、一种摄影处理方式，以及一个让所选组合彼此契合的视觉理由。不得仅靠罗列标签来创建
      主题。
    - 各 主题 必须在互动类型、关系动态、地点、衣着状态、道具逻辑、相机形式、配色及照明上有所区别。在每个 主题 的所有 画面 中，保留其角色身份、地点、服装锚点及核心主张。
    - 将候选集视为灵感，而不是检查清单、枚举、必需顺序或固定分配。去除重复内容；当同等的原创母题更适合 主题 时，选择它们。排除不相容的组合、多余人物、成年身份或同意不明确、不可能的解剖结构、脱离身体的部位、没有支撑的重量、被遮蔽的关键互动、泛泛的标签堆砌，以及仅靠改写措辞形成差别的
      画面。
    - 肛门指交；艺术裸体；私房摄影；不穿胸罩的造型；避孕套；成年人自愿接受的按摩；女上位；舔阴；深入口交接触；假阳具；直接手部刺激；后入式；情色自拍；外用振动器；伸入内衣的手；暗示性的口部接触；亲密夜视摄影；情趣内衣；自慰；镜面自拍；传教士体位；裸体肖像；明确说明孕期阶段的成年孕妇；俯卧体位；反向女上位；透视服装；带有精确可见文字的社交媒体截屏；侧卧相拥体位；穿戴式假阳具；触手幻想；定格在一种当前衣着状态的脱衣；阴道指交；湿衣。
  frames:
    common:
    - 每个 画面 都是一张独立照片，所选内容级别的状态已经可见。描述一个定格瞬间，具备可信的支撑、可触及的接触、可追溯归属的肢体、明确的所属关系、连贯的衣物与道具受力，以及有明确理由的相机位置。不得叙述准备、升级、重复运动、转变或事后状态。
    - 仅使用与当前阵容及内容级别相容的母题。若所选形式包括自拍、镜面、监控摄像机、夜视画面或社交媒体截屏，描述完整的图像表面，并让反射或屏幕呈现的身体明确对应请求指定的阵容。仅在所选母题需要时出现可见文字，且必须逐字指定。
