id: magazine-cover
description: 创作多样、可直接出版的竖版杂志封面 Theme 和完成的正面封面 Frame。每个 Theme 发明一个原创杂志身份及一个具体单期概念；每个 Frame 都是同一期的并行封面提案。结果必须像报刊亭出售的、经专业艺术指导的杂志，而非电影海报、社交媒体帖子、广告、标题卡、内页跨页、情绪板、接触印样或随意叠加文字的照片。
modules:
- id: design-visible-copy
  parameters:
    product: magazine_cover
    copy_language: english
    ascii: required
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 封面使用时尚、肖像、文化、设计、旅行、食物、体育、科学、艺术或其他刊物特定主体。
    erotic:
      shared:
      - 主图必须可见地呈现成年裸体、非露骨亲密接触、感官身体张力或其他明确的成年情欲主体。不得将情欲锚点藏在刊头或封面标题后；排版不得遮蔽必需人体部位、决定性接触或主动参与。
    hardcore:
      frames:
      - 排版不得遮蔽必需人体部位、决定性接触或主动参与。
      - 主图呈现已在进行中的露骨性互动，涉及的人体部位与当前接触清晰，每位指定人物都有主动可见的角色。不得以单纯裸体、暗示性文案、准备行为、被遮蔽的接触或微小嵌入图像替代。
  themes:
    common:
    - 所选内容级别控制可见主图，而不只是文案、情绪、服装或刊物类别。
    - 每张封面将一张有决定性的编辑摄影与一体化刊头、一条主导专题标题、少量次要封面标题及紧凑期刊信息结合。图像、排版、负空间、裁切、色彩和层级必须共同形成一个设计整体。
    - 严格使用指定人物阵容，不得增加任何人。人物具有成熟的中国人外貌，在一个 Theme 内保持每个人的年龄、面容、头发、身体比例、衣着、身体标记及其他身份锚点。
    - 重复的封面文字、投影、印花和抽象图形不得形成第二张脸或第二具身体。每位指定人物只有一个可见身体，保持人体、手、视线、支撑和身体接触连贯。
    - 每个 Theme 都定义真正的编辑主张，而非普通肖像加时髦词汇。确立：
    - 一个原创刊名及其受众；
    - 一个单期类别和编辑使命；
    - 一个明确的主图主体、活动、关系或事件；
    - 一个具体的中国地点、时代或年份、季节及社会背景；
    - 一个单期层面的疑问、张力、发现、庆祝或现实利害；
    - 一个将主图与封面层级连接起来的视觉论点；以及
    - 一种通过简洁封面标题语言表达的刊物口吻。
    - 主图必须在视觉上支持主要专题标题。如果标题可以换成无关主题而不必改变照片，封面概念就过于泛化。不得依靠图像之外的文字解释为何这个人物、动作、物体或地点主导本期。
    - 发明虚构编辑主体和原创刊物身份。
    - 杂志具有简短醒目、持续使用的大写英语刊头，合乎语法或呈现为名称，在该 Theme 的所有 Frame 中拼写完全相同，不附加期刊信息装饰。
    - 每个主题确立刊物类别、受众、精确单期概念、完整阵容、主图动作、中国场景、所选级别可见内容、编辑疑问或承诺、主要专题角度和基本杂志层级。
    - 刊头性格、字体类别、配色、摄影处理、背景秩序、间距、印刷工艺和编辑语气定义刊物系统，允许各 Frame 采用不同布局。
    - 在所有级别，封面都必须保持设计过的杂志封面，而非普通照片。排版支持编辑主张，但绝不替代必需可见内容。
    - 自由变化刊物类别。可以涵盖高级时装、独立风格、当代艺术、建筑、室内、工业设计、摄影、电影文化、音乐、表演、文学、思想、科学、生态、科技、食物、旅行、城市生活、工艺、体育、运动、健康、收藏、社会观察，或拥有明确受众的原创混合类别。
    - 类别必须影响摄影和封面系统：
    - 时尚可以使用雕塑式造型、受控视线、织物运动和严峻排版；
    - 艺术与文化可以使用概念肖像、不寻常负空间和思想精确的封面标题；
    - 建筑与设计可以使用网格、材料细节、空间节奏和严谨对齐；
    - 科学与科技可以使用清晰图解或抽象非文字图形，但不能成为界面；
    - 食物可以使用触感食材、餐桌几何和人的食欲，但不能像包装；
    - 旅行与生态可以使用环境尺度和地点特定的光，避免旅游陈词滥调；
    - 音乐与表演可以使用手势、舞台能量和节奏性排版，但不能成为专辑封面；以及
    - 体育与运动可以使用决定性动作和大胆层级，但不能成为活动海报。
    - 这些是方向示例，而非固定模板。
    - 不同 Theme 具有鲜明且彼此独特的刊物身份。
    - 不同 Theme 之间变化：
    - 刊物类别和目标读者；
    - 刊头名称、比例、大小写和字体性格；
    - 单期疑问和主要编辑承诺；
    - 主图活动、关系、裁切和视线；
    - 中国地点、时代、季节及社会背景；
    - 从极简到报刊亭式丰富的封面密度；
    - 配色、背景、光和摄影处理；
    - 文字对齐、左右平衡及刊头重叠；
    - 纸张和工艺强调点；以及
    - 情绪温度。
    - 不同主题不反复套用时尚肖像、空白摄影棚背景、居中面孔、红色刊头、相同侧边文字堆叠、奢华语气、单色极简或泛化名人封面表情。
  frames:
    common:
    - 所选内容级别控制可见主图，而不只是文案、情绪、服装或刊物类别。
    - 每张封面将一张有决定性的编辑摄影与一体化刊头、一条主导专题标题、少量次要封面标题及紧凑期刊信息结合。图像、排版、负空间、裁切、色彩和层级必须共同形成一个设计整体。
    - 封面必须第一眼就传达持续出版的刊物、特定一期及一组编辑内容。
    - 必需的杂志识别信号：
    - 顶部一个原创且持续使用的刊头；
    - 一个本期特定的主图主体或互动；
    - 一条与主图相连的主导专题标题；
    - 恰好两条简短次要封面标题，暗示其他期内内容；
    - 一个紧凑的字母季节标记；
    - 围绕主图轮廓有意识地放置封面标题；以及
    - 一个平面、正面朝向、裁切边缘可见的竖版封面。
    - 不得使用电影海报信号：无片名式处理、宣传语、院线演职员表、演员署名、制片厂标记、上映日期、影评星级、电影节桂冠、流媒体徽章、单页电影海报隐喻或电影主视觉宣传。
    - 不得使用社交帖子信号：无用户名、头像、反应数量、评论、分享图标、界面装饰、轮播圆点、方形信息流裁切、设备边框或平台品牌。
    - 不得展示实体样机。图像就是完成的正面封面本身，而非躺在桌上、被手拿着、显示在手机上、包裹三维物体、打开成跨页、与其他期刊堆放，或显示书脊或封底的杂志。
    - 每位指定成年人都必须明确出现在每个 Frame 的主图中。不得用剪影、反射、阴影、插画、排版、裁切身体碎片、嵌入肖像或封面外暗示替代任何人。背景人群、工作人员、路人、印刷肖像、屏幕人物、雕像和反射人物都算额外人物，不得出现。
    - 重复的封面文字、投影、印花和抽象图形不得形成第二张脸或第二具身体。每位指定人物只有一个可见身体，保持人体、手、视线、支撑和身体接触连贯。
    - 每个 Frame 都是一张独立完成的封面，也是同一期的一个并行设计提案，绝非按时间排列的故事节点或杂志另一页。保留精确刊头、单期概念、成年阵容、身份锚点、主图主体、内容级别锚点、受众和刊物核心特质。
    - 每个 Frame 都可以发明不同的精确主要专题标题和次要封面标题组合，只要忠于同一期。显著变化裁切、姿态、负空间、刊头互动、排版位置、配色重点、背景处理、视线路径和印刷工艺。不得只变化颜色、摄影角度或措辞。
    - 每个 Frame 都必须独立描述：
    - 完整主图及精确成年阵容；
    - 当前动作、表情、视线、身体支撑和互动；
    - 杂志类别、单期主体和目标受众；
    - 正面封面裁切、成品边缘、安全边距和视觉层级；
    - 精确刊头位置及刊头与人物的重叠；
    - 一条精确主要专题标题及恰好两条精确次要封面标题；
    - 一个精确的字母季节标记；
    - 字体家族、字重、尺度、对齐、行距和颜色；
    - 背景、配色、光源、摄影处理及印刷工艺；
    - 文字不得覆盖关键面孔、手、产品或内容级别接触的受保护区域；以及
    - 不存在其他可见文字或图形界面。
    - 每张封面独立呈现完整的身份、主图、文案和版式信息，不依赖其他封面。
    - 构建一张平面、满版出血的竖版 3:4 正面封面，具有整洁可见的成品边缘。不得创建展开跨页、折页、内页、目录页、海报、双联画、接触印样、平铺网格、备选封面拼贴或多本杂志。
    - 重要文字和面孔保持在一致的内安全边距内，边距约为封面宽度的百分之四至六。背景色、纹理、照片或有意留白可出血至边缘。任何元素都不应看起来被意外裁掉。
    - 使用一张占封面约百分之六十至八十的主导主图。刊头和面孔形成第一阅读；主要专题标题形成第二阅读；当前动作或关系形成第三阅读；次要封面标题和期刊元数据形成最终阅读。
    - 在缩略图尺寸下，观众必须辨认出：
    - 1. 一个杂志刊头；
    - 2. 主图人物或群体；
    - 3. 一个主要编辑主体；
    - 4. 一组有意识设计的封面标题；以及
    - 5. 一个连贯的刊物身份。
    - 精确 Theme 标题只渲染一次，作为刊头以大型定制高对比英语字形横跨封面顶部百分之八至十六。完全保留拼写。
    - 刊头可完全位于主图之前、完全位于头部之后，或使用一次受控的前后交织。如果头部与其重叠，每个字母至少百分之七十保持可读，并完整保留第一个和最后一个字母。不得分散、旋转、重复、堆叠成无关碎块，或把刊头变成电影片名。
    - 通过比例、间距、末端、笔画对比、大小写和颜色，让刊头具有持续出版感与刊物特性。在同一个 Theme 内保持一致，同时各 Frame 探索周围不同图像关系。刊头旁不得添加独立标志、商标符号、注册标记、上标、徽章、印章或微小字符。
    - 每个 Frame 恰好包含：
    - 一个简短醒目的刊头；
    - 一条简短的主要专题标题；
    - 恰好两条简短的次要封面标题；
    - 一个从原样大写值 "SPRING"、"SUMMER"、"AUTUMN"、"WINTER" 或 "SPECIAL" 中选择的季节标记。
    - 可见文案保持低密度。不得用段落、摘要副标题、图片说明、传记、文章摘要、摘引、署名、口号、话题标签、网址或占位文字填满封面。
    - 主要专题标题必须是刊头以外最大的文字。将其放在主图最强的负空间附近，或与决定性手势、物体、衣物边缘、建筑或视线对齐。可以覆盖低信息背景，但不得穿过眼睛、嘴、手、决定性产品或必需身体接触。
    - 次要封面标题与季节标记共享一个对齐的信息块，在其中形成一套受控系统。将该信息块置于一个清晰的侧边或下部区域，行距宽松。变化字重，但不得将小字散落在空隙中，也不得让每一行都与主要专题竞争。
    - 季节标记位于刊头附近或某个上角。必须恰好是一个允许的季节词，绝非日期、月份、年份、卷、版本、数词或拼写出的数字。封面任何位置都不得渲染条码、二维码、ISBN、ISSN、SKU、价格、货币符号、序列号、期号、网址、版权行、认证、零售贴纸、数字代码、竖条或小型零售框。下部角落保留干净摄影、色彩或有意负空间。
    - 每个文字元素都必须有意识地做到缩略图可读。最小的次要封面标题或季节标记，其字母高度至少约为封面高度的百分之四。不得创建微小图片说明、细字、法律文字、署名、脚注、标签、装饰伪字、成排数字，或任何可能被图像模型理解为微型文字的标记群。如果整洁空间不足，删除一条次要封面标题，而非缩小它。
    - 封面恰好具有五处可读英语文案：刊头、主要专题标题、两条次要标题和季节标记，各出现一次。字形采用大写拉丁字母和空格，不含小写、数字、标点、符号或重音字母；连接词使用原样文字 `AND`，不使用 `&`。
    - 不得渲染任何汉字、日语假名、韩文字母、西里尔字母、带重音拉丁字母、自造字形、伪字母、无意义拉丁占位文或乱码。中国人物、地点、服装、文件、建筑和产品不能成为使用非英语图中文字的理由。
    - 环境标牌、标签、包装、屏幕、书、报纸、衣物、设备和道具必须保持空白、背向镜头、被裁掉、抽象化或模糊至不可读。它们不得与受控封面文案组合竞争。
    - 排版必须拼写正确、水平、高对比且足够大，能够阅读。最多使用两个字体家族和三种字重。保持字距、行距、基线、标点和对齐一致。不得通过不可读小字模拟编辑内容丰富。
    - 五处文案之外，封面保持纯摄影、连续色彩或空白负空间，不添加其他字母、文字、数字、符号、伪字母或类似字符的标记。
    - 恰好使用三个受控排版区域：
    - 1. 刊头单独横跨顶部；
    - 2. 主要专题标题单独位于最强负空间区域；以及
    - 3. 一个对齐的信息块，包含两条次要标题和季节标记，并有宽松间距。
    - 五个字符串都从左到右水平排列。不得使用竖排、旋转、拱形、环形、碎片化、重复、镜像或透视文字。信息块保持在一个位置，而非把小字分配到多个角落。不得添加装饰首字母、字母碎片、分栏装饰、伪编辑注记或类似微小字符的线性标记。
    - 主图是一次连贯曝光，而非无关图像的蒙太奇。它必须看起来是为本期委托拍摄，而非从普通图库选择。
    - 根据编辑主体选择裁切：
    - 近距离肖像可以突出面容、头发、化妆、首饰或心理表情，同时保留足够肩部和姿态，避免悬浮头部；
    - 四分之三身时尚或文化肖像可以突出衣物轮廓、身体线条、物体、工艺或环境；
    - 较宽的群体肖像必须让每位指定成年人可辨认，并使其关系清晰可读；
    - 动作封面必须冻结一个决定性运动，保持人体连贯并保护负空间；以及
    - 环境封面只有在地点尺度是主要编辑事实且每张脸仍可识别时，才可以缩小人物。
    - 保持真实皮肤、毛孔、头发、织物、接触阴影、反射和材料响应。手部解剖正确，肢体可追溯，体重有支撑。不得通过镜子、屏幕、阴影、剪影抠图、缩略图或嵌入照片复制人物阵容。
    - 有意识地引导视线。与读者对视产生权威或亲密；看向镜头外的视线必须指向可见人物、物体或动作。不得让所有面孔空洞、闭眼或看向互不相关的方向。
    - 保护面容。刊头可覆盖头发，但任何封面标题都不得穿过眼睛、鼻子、嘴或决定性面部轮廓。
    - 在所有级别，封面都必须保持设计过的杂志封面，而非普通照片。排版支持编辑主张，但绝不替代必需可见内容。
    - 每个 Frame 选择一个主导设计方向：
    - 整洁的时尚权威：大刊头、直接视线、克制封面标题、无瑕背景和精确衣物轮廓；
    - 密集报刊亭活力：大胆专题标题、受控侧边堆叠、清晰色彩对比及活跃而有序的排版；
    - 独立文化期刊：充足负空间、不寻常裁切、安静刊头及思想简练的封面标题；
    - 特别单色期：黑白主图、一种专色、强烈纸张纹理及高度受控文字；
    - 色域肖像：一个饱和背景、清晰分离的皮肤与衣着，以及极少高对比排版；
    - 环境主题期：人物在一个有力地点中较小，刊头和专题标题仍然主导；
    - 触感印刷版：非涂布纸、克制半色调、压凸刊头、金属箔强调、叠印或细微套准特征；
    - 摄影干预：一个与单期相关的受控裁切、阴影、半透明色块、手绘非文字标记或模切幻觉；或
    - 文字构框：刊头、专题标题和边缘文案在主图周围构成精确框架，但不把封面变成海报。
    - 连贯地使用一个方向，不堆叠所有效果或制造随机贴纸杂乱。
    - 选择一种刊物特定的主导配色关系。在皮肤、头发、衣着、背景、刊头、专题标题和次要文案之间保持清晰分离。
    - 使用具有编辑动机的照明：宽广摄影棚主光、硬质美妆闪光、明亮窗光、清晰日光、克制舞台光、环境实景光或其他连贯布光。保留眼神光和可读皮肤。避免泛化电影青橙调色、浑浊阴影、失控泛光或降低文字对比的效果。
    - 印刷工艺可使用涂布亮光、非涂布哑光、柔触覆膜、细微纸张齿感、克制金属箔、局部光油、压凸、压凹、荧光墨、金属墨、半色调或轻微套准特征。将每种工艺应用于具名封面元素，并说明可见效果。除非刊物概念明确要求，不得给整张图覆盖任意做旧、划痕、撕纸或老胶片损伤。
