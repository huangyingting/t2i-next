    - '- 臂钏为上臂的一至两个硬环，是唐代宫廷服饰的鲜明特征，半臂或大袖衫敞开时常可见；'
    - '- 可选腕部手镯、可见耳朵上的耳坠、裙带上的小香囊或指环；'
    - '- 当动作需要物件时，手中持纨扇、圆铜镜或杯。'
    - 金属保持为画出的金、银或玉色剪影，配少量内部线条，而非铬面高光。不得像佛像一样堆加璎珞，也不得添加现代手表、眼镜或手提包。
    - 唐代人物画偏好成熟、丰腴、有稳实重量的体态，盛唐宫廷女子尤然。不得默认采用后世的纤瘦或现代时装模特比例。
    - 女性：
    - '- 年满二十五岁，面部骨骼成熟，而非大身体配青少年脸；'
    - '- 饱满圆润的脸：圆形、椭圆形或柔和方形，脸颊适于施胭脂；略有双下巴符合历史且可取；'
    - '- 高开额、细小修长的丹凤眼或细眼、短至中等鼻长、小而闭合的樱桃嘴；不得使用动漫大眼、厚重西式眼睑或露齿笑；'
    - '- 短至中等颈长、圆肩、足以撑满诃子与高裙带的丰满胸部；'
    - '- 腰比宋明美人更粗，躯干连续，而非沙漏式内收；'
    - '- 上臂丰满、前臂圆润、手虽小但属成人，常笼袖，或以柔曲手指持扇、杯、簪或琵琶；'
    - '- 裙下髋部与大腿丰满，重量落于榻、墩或鞋上；'
    - '- 罗袜与高头履中是自然、未经束缚的成人足；脚趾及足长为普通成人尺寸，绝不缠足，不用宋清弓鞋，也不得成人身体配儿童尺寸双足；'
    - '- 身高中等成人范围；存在感来自体量与衣褶，而非高瘦四肢。'
    - 画出的三白可在粉底内将额、鼻梁和下颏提亮为三块浅色留区。这是面部绘画手法，而非西式修容。
    - 典型支撑：单足承重站立、披帛垂挂；坐榻时双腿折向一侧、裙摆堆落；坐墩时高头履可见；跪坐台上。不得默认现代椅坐的九十度屈膝、时尚对立式站姿、手叉腰招贴美人姿势或佛教莲花坐。
    - 男性：
    - '- 成熟面孔，下颌、鼻翼和眉清楚；官员脸可较宽，文人脸略长；'
    - '- 圆领袍内躯干稳实，既非健美体型，也非苇秆般纤瘦；'
    - '- 能持笏、杯或卷轴的成人手；'
    - '- 站立重量经靴承托，坐姿重量经榻承托；'
    - '- 自然成人足，绝不采用后世缠足式造型。'
    - 解剖须具人形并保持绘画性。关节在自然范围内弯曲。肩、胸廓、骨盆、膝和足必须与姿势一致。各主题间变化个体：一位女子更丰腴，另一位略紧实；一名男子方脸，另一名较窄。绝不能让整批结果变成相同娃娃脸、儿童头形、动漫眼、芭比腰或拉长的时装腿。
    - 唐代女子妆容是绘于绢上面孔的图形化、可辨识系统。将其描述为浅粉底上的矿物与有机颜料，而非现代修容妆。
    - 以以下层次构建每位成年女性的脸，所有层次均须在历史上与主题的时期风格相容：
    - '- 额、鼻梁和颊施铅粉或蛤白妆粉，留下哑光蛤粉白或暖浅底色，可选额、鼻、颏三白；'
    - '- 胭脂采用一种具名类别：桃花妆为浅花色红晕，飞霞妆为较宽玫瑰色罩染，酒晕妆为较浓酒红颊色；'
    - '- 眉采用一种唐代类别：盛唐阔眉或倒晕眉短、宽而柔和加深；或较窄风格的蛾眉、远山眉、柳叶眉；黛可略呈蓝黑；'
    - '- 开额上的花钿：梅花、桃花、金箔、翠羽镶嵌、彩绘鸟、钱形或小剪纸，明确置于眉间或额头上部；'
    - '- 斜红为外侧鬓边的弯月、新月或两道短红斜线，用于主题需要较强宫廷面妆时；'
    - '- 面靥为两侧嘴角附近各一小红点或金点；'
    - '- 较早或较保守的宫廷妆可选额黄，以浅黄额部罩染呈现；'
    - '- 唇为小而集中的樱桃或檀唇口形，用朱砂、胭脂或檀红，中心颜色最浓；晚唐时世妆可用更深乌膏，但须保持成人时尚，而非哥特风叠加。'
    - 花钿是粉面上的实体贴饰或绘制饰片，不是文身，也不是印度眉心点。斜红位于蝉鬓旁的鬓部，不是像现代腮红条痕一样画在颊上。眼睛保持细小、修长、细线勾描；不得添加眼影、假睫毛或上挑眼线。
    - 妆容不对称仅限细微的人性差异：一侧面靥略浓，一眉稍宽。不得将完整盛唐阔眉与现代雕刻眉、烟熏眼影、高光鼻影或渐变唇妆混合。男性可只具画出的健康肤色、不施其他妆，或让上朝官员施极薄粉；不得给男性花钿。
    - 面部仍是工笔面部：三种有边界肤色、精细眼线，以及平面颜料色形的妆容。胭脂为透明罩染；花钿为小块不透明色形或金色形；眉以纤细如发的反复笔触描绘。
    - 每个主题必须为每位成年人建立一张身份卡，并在各画面中保持不变。每个画面在细述家具或情绪前，必须按从左至右顺序重述这些卡片。信息密度应相当于服装设计表：姓名、年龄、阶层、脸、头发、饰物、妆容、体态和完整衣物层次，都作为可见事实呈现，而非事后脚注。
    - 为每个成年人锁定以下全部项目：
    - '- 符合唐代习惯的姓名（姓加名），并明确为女性或男性；'
    - '- 年龄为二十五岁或以上；'
    - '- 阶层与角色：属于所要求阵容的命妇、家中妻子、成年侍从、官员、文人或家中乐人；'
    - '- 主题的时期风格；'
    - '- 脸：形状、开额、眼形、眉类、嘴及完整妆容层次；'
    - '- 头发：髻类、义髻或自发、盘绕方向、蝉鬓；'
    - '- 每件饰物的材料与位置；'
    - '- 体态：丰腴程度、肩、腰、乳房或胸膛、手、自然足；'
    - '- 具名服装原型及从贴身向外的衣着，每层的织法、色系、纹样与垂态；'
    - '- 首饰及手持物件；'
    - '- 鞋履。'
    - 不得只将女子描述为“穿唐装”，或将男子描述为“穿袍”。同一主题若有两位女子，她们必须具有不同服装原型，而不只是髻、花钿、披帛颜色或裙色不同。重述符合所选内容级别的衣着状态，但不改变设计好的衣物。
    - 每个主题选择一种成人情境，并以原创人物调度呈现。不得重构具名名画。每个主题都必须在户外或旅途中。室内榻、卧房、琴房或封闭廊室均无效。
    - 优先采用的户外与出游类别：
    - '- 曲江或渭水游春：柳岸、以罩染色带呈现的荷塘水面、野餐席或胡床、扬起的披帛；成年人步行、坐着或倚栏。'
    - '- 骑马出游：每名骑者穿胡服窄袖袍、蹀躞带、锦靴；唐画中的马颈粗头小，鞍辔有装饰；一位成年人骑乘，另一位骑乘或在马肩旁执缰。'
    - '- 打马球：马球场、球杖、疾驰或转弯的马，以浅颜料而非摄影呈现尘土；必须穿胡服。'
    - '- 犊车或牛车停驻：柳下停歇的牛车；一位成年人位于车口，另一位在旁边地面或马背上。'
    - '- 骊山或郊亭：山径、台地亭阁、出行帷帽或幂篱。'
    - '- 柳堤并行：两位成年人沿堤步行，裙摆或袍摆随动作飘动，水与柳作为画的罩染，位于平面衣物色块之后。'
    - 梳妆、音乐或饮茶只能发生在户外停歇处：鞍旁手持镜、野餐席上琵琶、柳下胡床上的茶。
    - 马、牛和鹦鹉不得参与性接触，也不计入人物阵容。
    - 场景中的每个人都须属于所要求的人物阵容。若某场景类别通常暗含仆人，则要么让所要求的成年人担任此角色，要么选择无需额外人物的自足版本。
    - 使用少量完整、尺度合理的物件。描述构造，而非寻宝标签；不得引用考古窖藏或博物馆藏品编号。
    - 家具：有席和低栏的低榻；带可分开帘幕的床台；圆坐墩或筌蹄；胡床折凳；低案或几；绘鸟、园景或空白绢面的多扇屏风；衣架；砖砌或夯土台；朱柱与简朴斗拱。
    - 镜与梳妆：置于架上或手中的圆铜海兽葡萄镜；漆粉盒；梳与篦；簪盘。
    - 器皿：莲瓣高足杯；鸟首执壶；圆形三彩或素陶罐；酒壶与耳杯；茶鍑、碾和筛。
    - 灯与香：连枝灯、单盏铜灯、香炉或兽形香炉，火焰或烟以有边界的色块呈现，而非照明。
    - 音乐：梨形琵琶、箜篌、阮咸、筝、拍板、笙、琴。
    - 游艺：围棋盘、双陆、投壶、纨扇、团扇或折扇。
    - 园林与出游：牡丹、柳、莲、海棠、芭蕉；鞍、辔、马球杖、犊车、野餐席、草地上的胡床。
    - 每件物品都需支撑、相对于手或榻的尺度，以及在当前动作中的用途。不要用古董铺填满绢面。
    - 选择唐代人物画能在浅层空间中容纳的姿势：
    - '- 站立，单足承重，披帛垂挂，笼袖或一手搭栏；'
    - '- 沿路径或堤岸步行，裙摆或胡服下摆曳动，锦靴或高头履可见；'
    - '- 跨坐马背，一手执缰，一手扶鞍桥；'
    - '- 立于马肩旁，手持辔；'
    - '- 坐在犊车内或车口；'
    - '- 坐榻，双腿折向一侧，裙摆堆落；'
    - '- 坐墩，双足并拢或略分，鞋尖露出；'
    - '- 跪坐台上，脊柱直立；'
    - '- 倚朱栏，躯干相对画面呈四分之三侧向；'
    - '- 双手抬起，将钗或花插入义髻；'
    - '- 面旁持铜镜，另一手触蝉鬓或面靥；'
    - '- 琵琶横于躯干前，左手在琴颈，右手近弦；'
    - '- 双手置于琴或茶碾上；'
    - '- 一位成年人为另一位调整披帛、簪或裙带。'
    - 手有五指及明确任务。不得使用时尚对立式站姿、手叉腰招贴美人姿势、瑜伽或露齿大笑。骑乘姿势的躯干转动可比室内坐姿更大。
    - 情绪基调应亲密、沉静而细察，而非滑稽闹剧。围绕明确的成人情境构建每个主题：春日沿柳骑行、两位女子上马前比看牡丹簪、同伴在曲江停歇共饮茶，或马球间歇。这些是示例，而非固定模板。
    - 赋予每个成年人独立意图和可见的参与。避免让一名主动者搭配一具被动装饰性的身体。通过每位女子的目光、手的位置、姿态、对衣物的控制和回应，明确展现她的欲望、判断和自主性。绝不能从性别推断支配地位、职业或身份，也绝不能用地位不平等代替同意。
    - 使用一处正在发生的小型叙事痕迹，使画面具有生活感：落下的步摇、掉落的马球杖、啃食柳枝的马、勾在鞍上的披帛、渐冷的香，或留在野餐席旁的鞋。痕迹必须辅助成年人的动作，不得变成滑稽奇观或引入未要求的旁观者。
    - 主题或画面中提及的每个人都必须属于所要求的人物阵容，并且在画中可见。不得将不在场的配偶、主人、仆人、宾客、顾客、官员、观看者或其他画外人物作为背景故事、动机、暗示的见证者或信件收件人引入。私密情境须在所描绘的成年人之间自成完整。
    - 将唐代丝绸、纱、锦、绫和绣边作为主要图形结构。描述每个成年人的外层、内层、腰带或裙带、纹样、色系及衣着状态。以衣褶说明重力、重量、伸展范围和动作，而不是遮掩所选内容级别。
    - 保持人体解剖比例恰当、物理关系连贯。不得模仿其他情色传统中的器官放大、强烈透视缩短或怪诞夸张。使用成熟的圆脸、椭圆脸、方脸和长脸，多样丰腴体格，自然关节活动范围，以及各具特征的手、脚、发际线和表情。避免娃娃脸、千篇一律的美人、儿童比例、不可能的柔韧度和通用招贴美人姿势。
    - 将纤丝线法称为游丝描，铁丝线法称为铁线描。披帛使用铁线轮廓，眉和髻卷使用反复细如发丝的笔触，台基、柱、屏风和地面边缘使用规整直线。不得使用浮世绘主版、漫画勾墨、写意泼洒、西方排线、喷绘或数字线稿的均一性。宫廷衣褶应有序，而非夸张飞带表演。
    - 使用绢本重彩：不透明矿物色域，仅对肌肤、纱和红晕使用薄罩染。点明五至七个色系的调色方案：暖茶色绢底；烟墨；一至两种暖色，如胭脂、朱砂、赭石或藤黄；一至两种冷色，如石青或石绿；一种织物中性色，如月白、杏色或靛青；至多一种泥金或蛤粉白点缀。皮肤留在该调色方案内，严格三种有边界色调，加上脸部和马体肌肤可见的渲染。不得使用摄影渐变、电影式投影、霓虹色或锦绘逻辑。
    - 画面必须在同一绢面混合平面与画。任一层都不得消失。
    - 平面：衣物锦片、半臂、建筑、鞍皮及部分地面带，作为轮廓封闭的矿物色平涂，具有可辨剪影与铁线描。
    - 画：脸、手、披帛转折、马体、柳、水和远山，以湿渲染、浸墨及轻微罩染塑造转折。笔触必须可见。枝叶可趋向没骨。肌肤可在三色基底之外，以额外冷暖罩染表现转面，但仍须是绢上的颜料。
    - 每个主题须点明混合比例。各主题间变化：有的偏平面，有的偏画。拒绝没有渲染的100%海报式平涂色块，也拒绝西方油画体积、摄影、计算机生成图像、镜头光晕或深远幻真风景。
    - 使用散点透视及略高视角。优先采用横向手卷片段。灯或月是画出的母题，而非光源。
    - 不得生成可读汉字、伪书法、诗、说明文字、对话气泡、标题、签名、画家姓名、画坊名称、年款或仿题跋。题签必须留白。至多一至两枚小而褪色的抽象朱红收藏印形可接触画面下缘；不得含有可辨认或模拟的文字，也不得与脸、身体或界定内容的动作重叠。
    - 不得模仿、归属、点名、署名或复现已知历史构图或在世艺术家的风格。只将作品描述为匿名唐代绢本人物画幅。
    - 岁月痕迹在缩略图尺寸下可见，但不遮住脸或动作：不均匀暖茶色绢地；一处向内消散的断续茶褐边斑；一处磨损角；空白绢地或建筑上一道折痕；三处局部线索，如可见织纹、粉化石青、褪色胭脂或接触下缘的无字印形。不得使用全局棕褐、胶片颗粒、烧焦边、霉菌或伪龟裂。
    - 每个主题必须确立：
    - '- 精确的唐代年份、城市、季节、时刻和私密社会环境；'
    - '- 一种场景类别及其少量功能物件；'
    - '- 严格一致、反复出现的成年人阵容，每人都有完整身份卡：姓名、年龄、阶层、时期风格、脸、妆容、头发、饰物、体态、衣物层次、配饰和鞋履；'
    - '- 由当前可见动作和相互自主性证实的所选内容级别；'
    - '- 一套从画面左至右连贯的人体位置图，具有可信支撑、接触几何、伸展范围、遮挡和肢体归属；'
    - '- 一种近方形、横向、竖向、纨扇或手卷片段构图；'
    - '- 一套游丝描与铁线描线条层次，以及明确命名的平面/画混合；'
    - '- 户外出游、骑行、马球、柳岸或车驾停歇环境，绝非室内居室；'
    - '- 一套五至七个色系的矿物色调色方案，具有分层罩染表现；'
    - '- 一处克制的当下叙事痕迹及至多两个象征母题；'
    - '- 少量唐代家具、织物及功能物件；以及'
    - '- 一套覆盖整体画面的无边框古旧绢地结构，加上三至五处局部颜料、墨、纤维或经手线索。'
    - 变化出游与少量室内场景、城市、场景类别、季节、关系、姿态、衣着状态、织物纹样、家具、时期风格、发式类别、义髻高度、蝉鬓、饰物组合、臂钏及其他配饰、妆容类别、身体丰腴度、裙型、披帛垂态、前景线索、象征母题、画幅形式、观看高度、主要对角线、主色锚点、冷色点缀、留白形状和老化模式。跨主题不得重复同一卧房、榻上姿势或室内茶事。不得重新摆演著名的传世唐代构图。
