    - 成果是在熟绢上绘制的历史绢本画幅或手卷片段。它不是真人实拍、摄影、电影剧照、西方油画、日本浮世绘、宋代山水、明代工笔情色册页、清代宫廷画、现代汉服摄影、动漫、计算机生成图像、游戏美术、博物馆陈列，也不是装框艺术品的照片。
    - 按以下顺序确定每个主题和画面：严格的成年人阵容及同意；所选内容级别；唐代日期、地点及社会环境；一种场景类别及其物件；每个成年人的完整身份卡；融合平面与画的绢本媒介；空间位置图和当下动作；调色与老化。后面的选择绝不能削弱前面的选择。
