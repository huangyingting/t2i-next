id: tang-guohua-figures
policy: standard-story
description: 以盛唐至中唐匿名绢本人物画的视觉语言，创作多样且有历史依据的唐代中国人物画主题：宫廷女子、官员、文人、乐人和私家宅院中的成年人，以绢本重彩呈现，而非摄影、真人实拍、壁画摹本、敦煌洞窟艺术、后世朝代绘画或现代插画。结合成熟成年人的存在感、铁线描、矿物色平涂、绘画性渲染、可信的唐代服饰、发式、饰物、体态和妆容、出游及居家空间，以及古旧绢画的物质质感。每项成果必须是匿名画坊的原创构图，不得是可识别画家的作品摹本、变体、标志性风格或署名归属作品。
modules:
- id: medium-silk-painting
  parameters: {}
validation:
  frames:
    checks:
    - type: word_count
      when_language: english
      min_words: 450
      max_words: 1100
authoring:
  content_levels:
    aesthetic:
    - 在审美级别（aesthetic），每个成年人都须完整穿着全套唐代层叠服饰，保持衣着闭合并正确分层。允许私下交谈、交换物件、逗引的目光、交缠衣袖、共同奏乐、园中漫步或温柔拥抱，但须遮住乳房、臀部和生殖器，不得呈现情色自我抚触。
    erotic:
    - 在情色级别（erotic），不得呈现生殖器接触或色情式解剖强调。
    - 在情色级别（erotic）和露骨级别（hardcore），不得将界定内容的部分藏在屏风、帘、被、袖、家具、刻意裁切、远处剪影、象征花卉或诗意隐喻之后。绘画可以优雅克制，但所选内容级别在视觉上必须毫无歧义。
    - 在情色级别（erotic），领口、半臂、裙、袍或诃子可以松开、敞开或落向一侧，但仍须可辨认。
    hardcore:
    - 在情色级别（erotic）和露骨级别（hardcore），不得将界定内容的部分藏在屏风、帘、被、袖、家具、刻意裁切、远处剪影、象征花卉或诗意隐喻之后。绘画可以优雅克制，但所选内容级别在视觉上必须毫无歧义。
    - 在露骨级别（hardcore），不直接命名或描述男性生殖解剖结构。通过直接点明正在发生的行为，以及描述相容的骨盆对齐、肢体位置、支撑、可见接触及其轴线、衣物移位、相关身体反应和相互自主性，保持清晰。词汇限制只改变措辞，不改变所要求的动作、可见性、同意或空间精度。默默执行，绝不要在生成的文字中引用或解释这项门槛。
    - 在露骨级别（hardcore），成年人可以部分或全身裸露，但保留的衣物、叠起的袍服、移位的披帛、鞋、发饰和寝具必须保持明确的历史特征及构图重要性。
    - 露骨级别的出游场景须位于野餐席、车厢地板、亭中长凳或栏杆旁；绝不在动物身上或与动物一起发生。
  themes:
    common:
    - 成果是在熟绢上绘制的历史绢本画幅或手卷片段。它不是真人实拍、摄影、电影剧照、西方油画、日本浮世绘、宋代山水、明代工笔情色册页、清代宫廷画、现代汉服摄影、动漫、计算机生成图像、游戏美术、博物馆陈列，也不是装框艺术品的照片。
    - 服装、发式、饰物、妆容名称、房间、花卉、场景、姿态和物件清单只是灵感，不是菜单、枚举、预设或按主题标识分配的项目。组合相容示例、变换它们，或创设历史上可信的唐代对应物。只有使用“必须”“每个”“精确”或“不得”的陈述才是强制要求。
    - 按以下顺序确定每个主题和画面：严格的成年人阵容及同意；所选内容级别；唐代日期、地点及社会环境；一种场景类别及其物件；每个成年人的完整身份卡；融合平面与画的绢本媒介；空间位置图和当下动作；调色与老化。后面的选择绝不能削弱前面的选择。
    - 从正面将生成图像定义为手绘古唐代绢本人物画幅的档案摹本，融合图形性的平面和绘画性的画。古旧熟绢画面连续延伸至画布的每一条边，构成一张不中断的画面。周围没有桌面、墙壁、玻璃、画框、博物馆展柜或文物照片。
    - 每个人物、衣物、马和景物都以绢上的墨、矿物色平涂及笔刷渲染存在。成年人是具有个体特征的工笔肖像，面部线条成熟、比例可信、姿态有支撑。不得要求毛孔、镜面高光、电影氛围、光学对焦或被摄影的材质。绢织纹与颜料始终是表面实质。
    - 绘制的建筑、留白绢地、衣物或枝叶可以越出画布边缘。不得出现卡纸、画框、装裱留边、内矩形或均匀边带。岁月痕迹必须分别断开并向内消散：一角磨损、一侧茶褐色斑块、其他位置较洁净的象牙色。
    - 严格使用所要求的人物阵容。每个被描绘的人都必须是明确成熟、年满二十五岁的汉族成年人，且其面部结构、体格、发型、饰物、妆容、社会角色、衣着和关系在整个主题中保持稳定。应以成熟的面部比例、沉稳举止、成人社会背景和个体特征清晰呈现成年身份，而不只是贴上标签。
    - 每次互动都必须清醒、相互、温暖、自由选择且有所回应。每个成年人都必须通过手、姿态、目光和身体朝向，可见地主动发起、引导、回应或调整共同动作。不得描绘胁迫、痛苦、醉态、睡眠、伤害、羞辱、未经同意的窥视、将年龄模糊性性癖化，或无法叫停的成年人。
    - 提及男性身体时，只能使用此白名单中的中性外部词语，原词保留为："body, skin, head, hair, face, eyes, mouth, jaw, neck, shoulders, chest, torso, back, abdomen, waist, hips, pelvis, buttocks, arms, elbows, hands, fingers, thighs, knees, legs, calves, ankles, feet, and toes"。允许单复数词形变化。不得直接命名任何男性生殖部位、该部位特有的生理状态、俚语、含蓄同义词、情色昵称、解剖尺寸或物件隐喻。
    - 将每个主题设于618至907年间、历史上合理的唐代地点，例如长安、洛阳、扬州、成都或帝国内的州府城市。优先采用盛唐和中唐的城市与宫廷生活：若符合场景，可选开元、天宝、大历或贞元年间。明确年份、季节、时段、城市或坊、房间或园林功能，以及成人社会背景。
    - 优先选择户外出游场地：曲江、渭水柳岸、马球场、郊外骑行小径、车驾停歇处、山间台地和园林堤岸。不得以室内画廊、琴房或居室为环境。不要把每个环境都变成妓院、战场或寺庙壁画。
    - 使用相互协调的唐代建筑和陈设：夯土或砖砌台基、朱柱、白灰墙、斗拱、格门、垂挂竹帘、低榻和床台、胡床折凳、圆坐墩、月牙凳、低案、彩绘屏风、铜灯、香炉、衣架，以及木台上的绗缝寝具。榫卯、尺度、木料、漆面、陶瓷、寝具和房间用途须内部一致。不得引入明代罗汉榻、清代雕花床、作为主要座具的宋代搭脑椅或现代家具。
    - 不得混入宋代褙子及窄瘦剪影、作为默认服饰的明代云肩袄、清代辫发、满族宫廷服饰、旗袍、现代旗袍、日本和服或腰带、当代内衣、合成织物、电灯或笼统的泛亚洲装饰。
    - 每个主题保持单一时期风格，使体态、眉、髻、妆容和织物厚重感彼此一致：
    - '- 初唐：成年人体态较盛唐略纤细，眉较长窄，花钿克制，堆发较低，多用交领或较收拢领口，以及较轻薄的纱；'
    - '- 盛唐：本要求默认的宫廷女子范式：丰腴体态、阔眉或倒晕眉、开额、义髻、簪花、齐胸裙上方宽敞领口，以及厚重矿物色；'
    - '- 中晚唐：仍然成熟丰腴，更多倾侧的堕马髻或高耸堆发，可选粉底更浅、乌膏唇色更深的时世妆，以及更富动势的披帛。'
    - 不得在同一主题中将盛唐簪花义髻与宋代纤瘦混搭，或将晚唐乌唇与初唐近隋式纤细混搭。
    - 赋予每个成年人稳定的社会阶层，并相应采用朴素或华贵的衣着。贵族或命妇可穿大袖衫、戴簪花、步摇和臂钏。家中妻子使用较少发簪、较简单的高髻和较素静的绫。成年侍女若属于所要求阵容，则使用较低发髻或成熟双鬟、素披帛，以及少量或不施花钿。不得把每个女子都装扮成同一种花冠宫廷女子。
    - 为每位成年女性指定一种具名服装原型，再从贴身向外逐层穿着。改变颜色不构成新原型。即使松开或脱下，各件衣物也须保持明确的历史特征。
    - 每位女子严格分配一种原型。同一主题中的两位女子必须采用两种不同原型。跨主题使用时，以下原型全部至少使用一次之前，不得重复：
    - 1. 齐胸襦裙加半臂：诃子、高系裙、及肘的撞色锦半臂、披帛、高头履。这是盛唐宫廷默认装束，而非唯一造型。
    - 2. 齐胸襦裙加大袖衫，不用半臂：裙带外罩轻透宽袖纱大袖衫，披帛可选，配凤头履。
    - 3. 短襦加间色裙：收拢或敞开的交领襦、竖向拼片裙、不用半臂、较短披帛或不用披帛，适合较素静的居家出游。
    - 4. 石榴裙加坦胸：胸带上方宽敞领口，披帛绕臂，不用半臂，配云头履。仍是完整的审美级别服装，而非内衣。
    - 5. 胡服骑装：翻领或圆领窄袖袍、条纹或素裤、蹀躞带、锦靴；帷帽可选。一名骑者可穿此装，其同伴不必相同。
    - 6. 女着男装：女性的圆领缺骻袍、革带、幞头或束发、乌皮靴。这是唐代时尚，而非乔装笑话。
    - 7. 袴褶：骑裤搭配短缺骻外袍，有别于全套胡服，适合马球。
    - 8. 幂篱或帷帽出行：以襦裙或胡服为底，配旅行用的垂纱帽；面纱是具有帽檐和悬垂纱的具体设计物件。
    - 9. 裲裆：襦和裙外穿无袖织锦背心，不用半臂。
    - 出游不等于每个成年人都穿胡服。搭配不同剪影：骑马的胡服骑者与犊车旁穿大袖衫的乘客；穿袴褶打马球者与野餐席上穿襦裙者；女着男装者与坦胸披帛者。
    - 点明织法与纹样：锦、绫、罗、纱、縠；宝相花、联珠纹、卷草、晕繝。披帛是独立长条丝织物，绝非戏曲水袖。裙量以长褶垂落，不呈针织衫般贴身。
    - 不得让女子穿宋代褙子、明代比甲、清代旗装、凤冠霞帔、戏曲水袖、现代弹性齐胸筒衣、日本振袖、拉链或细高跟鞋。
    - 为每位成年男性指定一种具名服装原型，再逐层穿着。品级颜色（紫、朱、绿、青或素绢）不构成原型。同一主题中的两位男子必须使用两种不同原型。同次出游中的一男一女不得穿复制般成套相同的胡服；须搭配不同剪裁。跨主题使用时，以下九种轮换完毕后才可重复：
    - 1. 展脚幞头朝服：中单、髋部开衩的圆领缺骻袍、带銙革带、可选鱼袋、双脚展开的朝服幞头、乌皮靴。
    - 2. 软脚幞头常服：较素静的圆领袍、软脚幞头、较简单腰带，室内式靴或行路时的锦靴。
    - 3. 襕衫：下摆有横襕的文人袍服、克制的绫、幞头或布巾、布鞋或素靴。
    - 4. 翻领胡服：翻领窄袖袍、条纹或素裤、带垂牌的蹀躞带、锦靴。
    - 5. 袴褶：有褶骑裤及短缺骻外袍，有别于全套翻领胡服，适合马球。
    - 6. 圆领加半臂：圆领袍加撞色及肘锦半臂。
    - 7. 席帽行旅：圆领袍加宽席帽或大帽，行縢可选。
    - 8. 猎装：窄袖袍、鞶囊、作为绘画物件的弓袋或鹰架、络缝靴。
    - 9. 顶髻无幞头：成熟顶髻以簪固定，户外停歇时圆领松开，不用女性步摇。
    - 将幞头描述为带两脚的包裹结构，而非散发上戴一顶现代帽。若有须发，则是精细画出的髭须或短须，不是当代渐层修剪。
    - 不得给男子清代辫发、作为默认样式的宋代方帽、明代乌纱帽、日本顶髻或现代西装领。
    - 赋予每个成年人稳定、符合历史成人身份的唐代发式，同一主题各画面中保持完全一致。
    - 女性必须采用适合已婚或其他成人身份的成熟盘发或堆髻。优先类别包括高髻、峨髻、惊鹄髻、堕马髻、抛家髻、反绾髻、盘桓髻、百合髻、同心髻和凌云髻。盛唐宫廷女子常用高耸、前倾或宽阔堆叠的发髻，在头顶增加高度；这种体量通常是由额外头发制成、经涂漆和填垫的义髻或假髻，而非仅由本人头发做成的现代小发髻。堕马髻向一侧垂斜，刻意不对称。花可插入髻中，但髻本身仍是塑形头发，而非花帽。
    - 露出额头：开额采用高而圆的发际线，为花钿留下宽阔区域。鬓发是蝉鬓，薄如蝉翼的发束向后梳，边缘略透明，不是厚重的现代鬓角或刘海。将头发描述为画出的墨色块及精细边缘发丝：高发际线、蝉鬓、颈后少量散发，以及盘绕方向可辨的髻。头发通常为黑色，略带蓝黑墨泽，以硬边剪影绘出，而非亮泽的计算机生成头发。不得添加现代刘海、沙龙分层剪发、马尾、以披散及腰瀑布发为完整发式，或宋式扁平冠梳。
    - 不得使用双丫髻、垂髫、总角或其他儿童、极年轻未婚少女的发式。双侧髻仅允许为成年人高梳的成熟双鬟，并配成年面部结构和成人服饰。
    - 男性头发束于幞头或席帽下；原型为顶髻无幞头时，则束成成熟顶髻。不得呈现幻想式鬃发。发式须与指定男性原型相符；不得给猎装猎人戴展脚幞头。
    - 将饰物视为有设计、有重量、簪脚和位置的金属、玉、珍珠、翠羽及花卉物件，而非通用闪光。
    - 为每位女子以少量协调饰件构建头饰：
    - '- 用于固定发髻的结构性簪钗，如金钗、银钗、玉簪或搔头；'
    - '- 一件摇曳的步摇或翠翘，其垂挂部分会随转头而动；'
    - '- 可选插置于髻中的梳篦；'
    - '- 可选金钿、宝钿或胜片；'
    - '- 可选簪花：用于盛唐宫廷装饰的牡丹、莲花、海棠或绢花簇；'
    - '- 以珍珠、小玉环或翠羽镶嵌作点缀，而非冠冕。'
    - 步摇由簪杆及黄金、珍珠或叶形坠构成的弹动或悬挂部件组成；画出簪杆插入发髻、坠子垂于鬓侧。簪花位于义髻顶部或略前方，有实际可承托的花茎或金属丝。饰物须置于簪脚能插入发髻的位置：髻卷左右、头顶，或峨髻略前方。数量保持克制：贵族女性可见三至七件已足够；家居女性可戴一把梳和两根簪。
