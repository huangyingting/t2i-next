id: demon-lord
policy: standard-story
validation:
  frames:
    checks:
    - type: ascii
      when_language: english
    - type: word_count
      when_language: english
      min_words: 600
description: 根据所要求的精确成年人物阵容，创作一幅原创真人实拍黑暗奇幻长片图像。每个主题恰好包含一位核心恶魔君主：一位成年女性魔王或一位成年男性魔王。绝不在同一主题中同时安排女性和男性恶魔君主。严格使用所要求的成年女性和成年男性人数。恶魔君主计入所要求的一位女性或一位男性；不得在所要求的人物阵容之外额外添加君主。绝不添加第二位恶魔君主、守卫、仆人、俘虏、崇拜者、牧师、士兵、爪牙、小天使、尸体、人形雕像、倒影中的陌生人、背景剪影、离体手或额外身体碎片。只有所要求的精确人物阵容可以呈现人类或类人外形。"demon
  lord" 这一称号描述超自然主权，而非胁迫的许可。每位亲密互动参与者都清醒、能力未受损、自愿、会作出回应，并明显能够停止。呈现相互注视、自愿靠近、相互触摸、自主姿态、主动放置双手，或其他明确体现成年人自主意愿的迹象。绝不使用囚犯、奴隶、祭品、贡品、被俘新娘、被征服的受害者、无意识身体、受魔法强迫的伴侣、醉酒或药物影响下的伴侣、睡眠中的伴侣、恐惧的下属或无法离开的人。不得将威胁、惩罚、强制崇拜、占有、人口贩运、伤害或非自愿的权力失衡色情化。所有性解剖结构保持为与君主所声明性别相符的成年类人解剖结构。不得添加过大的奇幻生殖器、倒刺、结节、尖刺、触手、双重生殖器、非类人开口或为造成伤害而设计的解剖结构。每个人都具有二十五至七十九岁之间的人类等效外观年龄。说明每个人的精确外观年龄，并赋予每个人成熟面孔、成年身体结构、独特身高与体型、皮肤、头发、眼睛及稳定识别细节。跨越数百年的超自然年代信息只能出现在人类等效外观年龄之后，绝不能取代它。在主题和最终画面中，为每个人使用一个精确整数年龄。未先说明精确人类等效整数年龄时，绝不写三十五岁上下、四十出头、接近六十岁、左右、大约、无龄、古老外观或数百岁。即使超自然皮肤、角、眼睛、翅膀或盔甲改变了君主形象，也要在面部结构和造型中保留所要求的国籍特征。事件强大但受控。它绝不击打、灼烧、淹没、挤压、割伤、困住任何所要求的成年人，也绝不使其失去稳定。
authoring:
  content_levels:
    aesthetic:
    - '- 所有成年人穿完整不透明衣物；- 运用仪式权威、王座姿态、宫廷张力、仪式物件、目光、翅膀、角、建筑和光线；- 不允许裸体、裸露乳房或生殖器、性接触、恋物装置或暗示性行为；以及 - 保持图像适合作为肃穆黑暗奇幻王室肖像。'
    erotic:
    - 在 情色级 和 露骨级 级别，整个身体占据区域都干燥、处于室温、稳定、防滑、通风并充满可呼吸空气。水可形成不高于脚踝的浅薄反光层，但任何面孔、胸部、骨盆、性接触或呼吸通道都不得浸没。绝不在水下、完全淹没的室内、布满湿滑藻类或冰面的支撑面上，或落下的液柱下安排亲密互动。
    - 在 情色级 和 露骨级 级别，使用朝向远离所有面孔和身体的钝角、收回或圆钝的爪，以及静置在君主身后的不活动尾巴。任何参与者都不抓握、拉扯、骑乘或借力于角、翅膀或尾巴。亲密场景不得使用针尖、刀刃尾尖、带毒解剖结构、外露盔甲尖刺或尖锐礼仪饰物。
    - '- 允许成年人艺术裸体、裸露乳房或生殖器、轻透或敞开的礼仪服饰、感官自我触摸、相互抚摸、紧密拥抱、身体贴压，以及亲密的王座或高台姿势；以及 - 保持张力含蓄蓄势、具有电影感且不露骨，不滑向
      露骨级。'
    - 在 情色级 或 露骨级 级别，热金属、深水、坍落材料、尖锐冰块、运动机械、沉重门扉和猛烈天气必须保持在亲密身体区域之外。当身体需要密切接触时，使用移动光线、远方天气、帷幕、水面反光、冷却金属、飘灰或开启建筑等较平静事件。
    hardcore:
    - 在 情色级 和 露骨级 级别，整个身体占据区域都干燥、处于室温、稳定、防滑、通风并充满可呼吸空气。水可形成不高于脚踝的浅薄反光层，但任何面孔、胸部、骨盆、性接触或呼吸通道都不得浸没。绝不在水下、完全淹没的室内、布满湿滑藻类或冰面的支撑面上，或落下的液柱下安排亲密互动。
    - 在 情色级 和 露骨级 级别，使用朝向远离所有面孔和身体的钝角、收回或圆钝的爪，以及静置在君主身后的不活动尾巴。任何参与者都不抓握、拉扯、骑乘或借力于角、翅膀或尾巴。亲密场景不得使用针尖、刀刃尾尖、带毒解剖结构、外露盔甲尖刺或尖锐礼仪饰物。
    - '- 单人阵容使用可见的成年人自慰，以手或一个专为所描绘接触设计的身体安全玩具进行；- 多位成年人时，保持精确阵容可见，并赋予每个人主动、自愿、解剖关系可追溯的角色；-
      内容级别要求时，允许阴道或肛门插入、口部与生殖器接触、直接生殖器刺激、自慰、自愿群体性行为、射精和可见成年人性体液；以及 - 恶魔角、爪、翅膀、尾巴、盔甲、王座、魔法和建筑保持在插入及生殖器接触路径之外。'
    - 在 露骨级 级别，使用普通成年类人性解剖结构。绝不使用角、爪、尾巴、触手、武器、链条、魔法光束、王座部件或建筑物体进行插入或刺激。仅使用手、嘴、成年类人生殖器或明确对身体安全的性玩具。
    - 在 情色级 或 露骨级 级别，热金属、深水、坍落材料、尖锐冰块、运动机械、沉重门扉和猛烈天气必须保持在亲密身体区域之外。当身体需要密切接触时，使用移动光线、远方天气、帷幕、水面反光、冷却金属、飘灰或开启建筑等较平静事件。
  themes:
    common:
    - 创造宏伟、感官充沛、不祥的黑暗奇幻电影感，结合以下要素：
    - '- 一位威严的类人恶魔君主；- 大教堂尺度的地狱建筑或肃穆超自然宫廷；- 王座厅权威、仪式静止感或受控身体强度；- 真实的成年演员，具有自然皮肤纹理、毛孔、独立毛发、可信眼睛，以及克制的假体化妆之下普通人类解剖结构；-
      可实际穿戴的角、翅膀、盔甲、长袍和实体生物特效，具有可见重量、连接、接缝、磨损与材料反应；- 深沉的电影式明暗对照，由一道具有合理来源的下射光束或一片光区照明；- 有意采用低饱和度、暗调、高明度反差、窄色域配色，以炭黑、石墨、灰烬、风化棕土色、骨灰色、氧化金属、低饱和蓝绿色及失去光泽的琥珀色构成；以及
      - 高品质长片镜头的光学表现、受控高光过渡、自然景深、克制运动表现和细腻电影颗粒。'
    - 仅用所附参考理解广义视觉原则：巨角、深色端坐王座的剪影、亲密前景尺度、哥特式或地下建筑、下射蓝金光、黑色翅膀或盔甲映衬下的温暖皮肤、电影式边缘分离和肃穆竖向构图。将任何蓝金对比转化为低饱和蓝灰与失去光泽的柔和琥珀色，而非鲜艳互补色。
    - 不得复制参考中的恶魔设计、面孔、身体、王座、坐姿、性姿势、机位角度、手的位置、建筑、照明图案、配色分布或精确身体排列。不得再现、模仿、提名或唤起任何现有艺术家、插画家、游戏、电影、漫画、系列作品、角色、演员、艺术作品或封面图像。
    - 以独立特征创造每位君主。为每个主题提供原创角结构、面孔、皮肤体系、王冠或头部处理、翅膀或披肩设计、服装、王座或宫廷几何形态、象征材料和情绪温度。
    - 写作任何主题或画面之前，在内部为所要求的精确成年女性和精确成年男性分别建立人物记录。在所有角色、动作、姓名、解剖结构和代词中，保留每条记录的女性或男性身份。绝不将所要求的女性变为男性，将所要求的男性变为女性，以另一性别替换某一所要求性别，或用恶魔身份规避所要求的性别人数。
    - 按以下方式确定君主：
    - '- 有女性而无男性时，所要求的一位女性就是女性魔王；- 有男性而无女性时，所要求的一位男性就是男性魔王；- 混合阵容时，恰好选择所要求的一位成年人作为女性或男性魔王，使其余每位所要求的成年人都成为地位平等的王室配偶、对立君主、宣誓勇士、神秘使节或类似拥有自主权的成年对应人物；以及
      - 在混合阵容的一批主题中，平衡女性和男性君主，不按主题编号机械分配某一性别。'
    - 每位所要求的成年人都在可见情境中具有不可或缺的角色。多人场景中，明确每个人的位置、朝向、身体支撑、目光、表情、动作和关系。不得将所要求的成年人变成背景装饰，或将数位成年人合并成模糊的一团。
    - 其他成年人可以是王室配偶、平等者、对手、勇士、使节或自选情人。即使君主仍是最大的视觉中心，他们的身体与表情也必须传达同等叙事重要性。
    - 将角色视为推动动作、服装、道具、建筑和表情的可见动力，而非仅有头衔的装饰。君主可以是衡量不可能争端的地狱法官、从破败边境归来的战争君王、守护封存记忆的神秘档案管理员、火山锻炉女王、淹水神谕国王、日食天文学家、瘟疫医师君主、夜廷外交官、重新夺回空宫殿的流亡统治者、仪式狩猎首领、梦境收藏家、风暴导航员、葬仪建筑师、禁忌图书管理员或另一位原创成年权威人物。
    - 仅当所要求阵容包含额外成年人时，非君主成年人才能是平等的王室配偶、对立君主、宣誓勇士、神秘使节、战地医师、宫廷天文学家、炼金术士、档案管理员、导航员、建筑师、历史学家、使者、音乐家、盔甲匠、战略家或自选情人。赋予每位所要求的成年人可见专长和能改变构图的具体动作。
    - 在不同主题间变化君主的外观年龄、身高、体型、面部几何结构、皮肤体系、角类型、翅膀状态、头发、礼仪饰物、气质和统治职能。轮换魁伟、精瘦、紧凑、宽阔、雕塑般、饱经风霜、优雅、有疤痕、身体柔软和健壮的成年人，不将某一体型或审美标准设为默认。
    - 相邻主题不得重复相同统治者角色与对应人物角色。不要让每位女性君主都是魅惑女王，或每位男性君主都是披甲军阀。权威可以是智识、仪式、外交、艺术、预言、司法、军事、情欲或安静居家方面的。
    - 君主是实际存在的成年类人个体，不是云、鬼魂、骷髅、动物、空盔甲或遥远神祇。保留一个头、一条颈、一个躯干、两条手臂、两只手、两条腿和两只脚；除非在正确解剖连接处添加明确描述的一对翅膀和一条尾巴，否则不增加身体部件。
    - 角为可选，但通常值得采用。从上额、颞部或后颅生出一对协调一致的角，具有宽阔可信的基部、连续角蛋白生长、平衡重量和主题独有剪影。变化后掠野山羊弧形、向前冠状尖枝、带棱羚羊曲线、短断玄武岩角、分枝黑木结构或另一种原创设计。绝不创造悬浮角、不对称意外残桩、从眼睛或脸颊生出的角，或多于一对刻意设计的角。
    - 翅膀为可选。存在时，恰好使用一对匹配翅膀，连接于上背部和肩胛区域，具有清晰可辨的折叠关节、翼膜或羽毛结构、重量、投影及足够周边空间。翅膀绝不从颈部、下脊柱、手臂、王座或另一个人身上生出。避免额外翅膀、融合翅膀、装饰性翅膀碎片，或隐藏手臂和双手来源的翅膀。
    - 可选尾巴从骶骨连续伸出，遵循重力和身体平衡，并与腿、生殖器、织物及他人保持分离。不得使用触手、生殖器尾巴、多条尾巴，或将尾巴用作性工具。
    - 让面孔具有可辨认的成年外观和可读情绪。允许余烬般眼睛、深色巩膜、轻微尖牙、尖耳、仪式疤痕、矿物皮肤、灰烬皮肤、深棕土色皮肤、黑曜石纹样或克制深红底色，但要保留合理的颅骨、下颌、鼻子、嘴、眼睑、耳朵和颈部。避免长吻、兽吻、昆虫口器、暴露颅骨、血腥、融化血肉或被视觉杂乱遮住的脸。
    - 每只手都有五根清晰手指，关节层级自然。爪可以延长指甲，但绝不增加手指或合并指尖。脚保持跖行且来源可追溯，除非主题刻意始终使用一种协调一致的趾行解剖结构；绝不在同一个人身上混用蹄、人脚和兽爪。
    - 通过一种协调一致的材料体系建立君主权威：
    - '- 带活动关节与磨旧金镶嵌的层叠发黑板甲；- 肃穆礼服剪裁上的羽毛或鳞片披肩；- 黑曜石札甲、深色皮革、链条、天鹅绒及锤打青铜；- 带加重下摆和克制王冠的建筑感长袍；- 在所要求内容级别下，以仪式盔甲衬托裸露超自然皮肤；或
      - 另一种原创宫廷视觉语言，具有可信重量与扣合结构。'
    - 盔甲顺应身体，而非替代身体。肩甲为颈部和角的运动留出空间；胸甲顺应合理胸廓；护手保留五根手指；腰带围绕一个骨盆；胫甲与膝和踝对齐；翼孔融入背部结构。避免悬浮盔甲、不可能穿过血肉的尖刺、融合衣物、装饰杂乱或复制自现代系列作品的盔甲。
    - 为每位非君主成年人提供传达平等地位的完整原创外观：礼服剪裁、浅色仪式丝绸、深色宫廷盔甲、挺括皮革、金属线长袍或其他成人整套服装。使人物阵容协调，但不让所有衣服完全相同。
    - 选择一种能强化君主形象、协调一致的地狱环境：
    - '- 破损圆形天窗下的巨石玄武岩王座厅；- 透过蓝色水体或染色矿物玻璃照明的淹水大教堂墓室；- 缓慢火山光上方的黑曜石觐见厅；- 拥有巨柱与狭窄天窗的地下废墟大殿；- 由雕刻石肋围合的黑铁宫廷；-
      由矿物阶地和仪式台阶塑造的古老洞窟宫殿；- 尺度适合超自然君王的肃穆寝宫、浴室、圣物室、图书馆或作战室；或 - 其他原创黑暗奇幻权力中心。'
    - 轮换不同场景类型，而不只是改变墙壁材料：
    - '- 竖向神圣空间，例如淹水墓室、破损大殿、日食圣所、钟塔、矿石大教堂或地下礼拜堂；- 元素宫廷，例如火山露台、冰封黑冰大厅、风暴阳台、盐宫、灰烬花园或发光水体下的宫廷；- 私密王室内景，例如寝宫、浴室、更衣室、图书馆、观测台、餐厅、私人剧院或圣物室；-
      运作中的权力中心，例如地图室、锻炉厅、档案室、炼金实验室、医务室、议事厅、军械库或审判厅；- 户外领地，例如破败堤道、无月海岸线、山间关门、火山口边缘、石化森林、沙漠巨石或云桥；以及 - 原创过渡空间，例如楼梯井、仪式行进走廊、门槛、淹水隧道、升降笼、桥或废弃车站。'
