id: furry-mythic-interactions
policy: standard-story
validation:
  frames:
    checks:
    - type: ascii
      when_language: english
    - type: word_count
      when_language: english
      min_words: 600
description: 严格使用 `female_count` 和 `male_count` 所提供的成人性别名额，创作多样的真人实拍幻想摄影 主题。将这些请求指定的成年人中恰好一位分配为源自公版神话或原创幻想原型、具有智慧的拟人化兽人；将所有其余名额分配为外观真实的成年人类。兽人是有形且活生生的角色，绝不是吉祥物服装、卡通、游戏渲染、宠物或背景装饰。
  物种、神话、角色、场景、服装、物件、互动及视觉处理的列表是灵感，而不是菜单、预设或 主题 ID 分配。组合相容的示例、变换它们，或创造等效项。只有使用 "must,"（必须）、"every,"（每个）、"exact,"（精确）或
  "do not"（不得）的陈述才具有强制性。 仅使用：- 公版神话、宗教、民间传说或文学人物；- 不属于某一现代所有者的传统原型；- 完全原创的高幻想角色；- 完全原创的英雄、义警、宇宙或超人原型。
  孙悟空、猪八戒、牛魔王、铁扇公主及传统天庭或冥府官员等《西游记》人物，可依据公版小说及更早的民间传说加以诠释。八仙可依据传统传说加以诠释。传统天使、恶魔、镇尼、日本鬼、天狗、那伽、夜叉、福恩、萨堤尔、斯芬克斯、迦楼罗、狐妖、狼人、兽首神祇及类似存在，可依据其公版文化来源使用。
  不得复制来自《魔兽》、漫威、DC、现代游戏、现代漫画、电影、电视剧或其他受版权保护系列的角色、服装、徽记、武器、口头禅、地点、演员相貌、轮廓、配色或故事事件。不得仅通过更改名字、物种、颜色或一处服装细节来伪装受保护的角色。
  不得点名、模仿、唤起、组合或移用任何真实导演、摄影师、电影摄影师、美术指导、艺术家、演员、工作室、电影、电视剧、漫画或游戏的风格。每种视觉风格只能通过构图、镜头表现、布景构造、材质、配色、氛围及有来源依据的光线等可见选择来定义。
  当公版人物拥有著名的现代改编形象时，应回到更早的文本或民间传说属性，并创造新的服装、材质、配色、身体设计及戏剧情境。不得模仿现代改编版本或在世演员。 根据运行请求计算 `total_count` =
  `female_count` + `male_count`。这些是涵盖人类与兽人的全部可见成人角色名额，并非仅统计人类。每个 主题 和 画面 都严格保留 `female_count` 个女性名额及 `male_count`
  个男性名额。绝不添加请求指定名额以外的角色。 每个 主题 都设置 `furry_count` = 1 及 `human_count` = `total_count` - 1。若仅有一种请求指定性别的数量为正，兽人就占用该性别的一个名额。若
  `female_count` 和 `male_count` 均为正但不相等，则由较小的正数所对应性别提供兽人名额。若两个正数相等，则男性名额为兽人。其余每个请求指定名额均为人类。 因此，一名女性及零名男性对应一名女性兽人及零名人类；一名女性及一名男性对应一名人类女性及一名男性兽人；两名女性及一名男性对应两名人类女性及一名男性兽人；一名女性及两名男性对应一名女性兽人及两名人类男性；同性别群体包含一名该性别的兽人及同一性别的成年人类。这些是确定性的数量映射，而不是
  主题 预设：物种、身份、角色、场景、动作、衣着及姿势仍由模型生成。 一个请求指定名额对应一个身体，而不是一个人类加一个兽人。在单名额的 主题 或 画面 中，绝不写出 "one human woman"、"one
  human man"、"a human cast"、"a partner"、"a companion"、"another participant" 或第二个名字。绝不使用 "along with"、"alongside"、"together
  with" 或其他暗示第二个身体的短语。 每位分配为人类的角色始终是完整的人类。不得给人类身体添加兽耳、吻部、毛皮、尾巴、爪足、蹄、翅膀、鳞片、角或变身状态。以动物为灵感的服装不会改变此规则。不得使用公众人物、宗教领袖、历史名人、演员或其他真实人物的姓名、头衔、别名、面孔、生平或可识别的特征组合。
  不得在已分配的请求指定名额以外添加人群、守卫、崇拜者、仆人、受害者、肖像、雕像、倒影、屏幕人物、尸体或人形背景剪影。传统上完全是人类的公版神话人物，只有被分配到一个人类名额时才可出现；否则省略该人物，或创造其原创兽人诠释。
  恰好包含一名兽人，占用按确定性规则选出的请求指定名额。兽人必须是清醒、聪慧、能够说话或明显具备推理能力的成年人，拥有成熟的社会角色、独立姓名、物种、面孔、体格、衣着、动机，并主动参与这次相遇。 每名兽人占用一个请求指定的女性或男性名额。将兽人角色描述为成年拟人化存在，而不是人类，绝不把一个名额同时计为人类和兽人。
  兽人角色继承按确定性规则选出的请求指定名额的性别。在 主题 首次介绍时，以及每个 画面 中各自独立地介绍时，写明 "adult male anthropomorphic" 或 "adult female
  anthropomorphic"，并附上物种及姓名。 若仅 `female_count` 非零，每名兽人都是女性。若仅 `male_count` 非零，每名兽人都是男性。混合性别阵容须严格采用较小数量优先、相等时选男性的规则。不得依据物种、角色、解剖结构、衣着、性体位、主题
  ID 或模型偏好来选择名额。 选定后，在完整 主题 及其所有 画面 中保持姓名、性别、代词及性解剖结构一致。男性兽人使用 "he"、"him" 和 "his"，女性兽人使用 "she"、"her" 和
  "hers"。不得切换性别、使用 "it" 或 "they" 来回避说明性别、仅凭服装推断性别，或在同一角色身上组合相互矛盾的性解剖结构。 在构思任何性行为之前，先应用确定性的名额分配。请求一名女性及零名男性，意味着一名成年女性兽人及零名人类。请求零名女性及一名男性，意味着一名成年男性兽人及零名人类。对于更大的阵容，严格使用为该
  主题 选定的人类与兽人性别名额。绝不为了让偏好的行为更容易描述，而改变参与者所分配的物种类别、性别、国籍或数量。 全男性运行不包含阴道、外阴、阴蒂、女性兽人、人类女性，或 "she"、"her" 和
  "hers" 代词。为每名男性兽人赋予与其声明性别一致的普通成年类人男性解剖结构。当运行级别的两种性别均可用时，先选择每名兽人的性别，然后才选择与所有已锁定参与者相容的行为。 每名兽人必须以双足和类人姿态为主，具有直立的成年躯干、两条相连的手臂、两条相连的腿、灵活的手或适合该物种的可抓握前爪，以及明确的动物头部。只有在传统来源材料使其必不可少，且每个连接点在解剖上都可追溯时，才可出现翅膀、尾巴、角、鹿角或第二对神话手臂。
  不得描绘普通动物、野性四足兽、宠物、家畜、坐骑、动物园动物、人戴兽首面具、吉祥物扮演者、毛绒玩具、兽装、动物标本身体，或黏上耳朵及尾巴的人类。不得使用 "cub"、"pup"、"kitten"、"hatchling"、孩童般比例、幼年行为、学龄暗示或年龄模糊。
  为每名兽人赋予一套连贯的物种解剖结构。每个 画面 都保留吻部长度、耳形、眼睛颜色、毛皮图案、尾巴、手、脚、身高、体格、疤痕、角及其他锚点。不得随机混合物种部件，或在 画面 之间改变物种。 当 `female_count`
  = 2 且 `male_count` = 1 时，本规则优先于之后的每一项角色、解剖及动作选择。严格使用三个可见的成年身体：两名有姓名的人类女性及一名有姓名的成年男性拟人化兽人。`human_count`
  = 2 且 `furry_count` = 1。主题 或 画面 的任何位置都禁止出现短语 "human man" 和 "female furry"，且不存在第四个身体。 全女性运行不包含阴茎、阴囊、睾丸、精液、男性兽人、人类男性，或
  "he"、"him" 和 "his" 代词。为每名女性兽人赋予与其声明性别一致的普通成年类人女性解剖结构。不得仅为了制造插入性交而添加男性解剖结构。 所选级别改变亲密程度、服装、接触及场面调度；不改变已分配的阵容、兽人物种、神话、场景、核心目标或角色自主性。
authoring:
  content_levels:
    aesthetic:
    - 在 `aesthetic` 级别，让每位请求指定的成年人衣着完整，并使行动保持非情色。使用冒险、幽默、竞争、外交、友谊、敬畏、怀疑、救援、仪式或社会讽刺。
    erotic:
    - 在 情色级 或 露骨级 级别，仅在已指明的接触需要之处，才可敞开、松开、提起、解开或移开服装。让设计服装中另一个明确的部分保持可见且可辨读；绝不让兽人变成完全没有衣着、仅有毛皮的身体。服装必须避开关节、尾巴、翅膀、承重点、嘴及性接触路径。
    - 在 `erotic` 级别，每位参与者都必须保持明确成年、有智慧、双足且具有人类水平自主性及言语能力的人格主体。允许自愿的浪漫张力、部分裸体、裸露的成年皮肤或毛皮、相互拥抱、亲吻、感官性梳理或非露骨亲密接触。不得使用野兽姿态、所有权语言、繁殖语言、发情或求偶躁动、胁迫、插入、生殖器接触、性体液或普通动物。
    hardcore:
    - 在 情色级 或 露骨级 级别，仅在已指明的接触需要之处，才可敞开、松开、提起、解开或移开服装。让设计服装中另一个明确的部分保持可见且可辨读；绝不让兽人变成完全没有衣着、仅有毛皮的身体。服装必须避开关节、尾巴、翅膀、承重点、嘴及性接触路径。
    - 在 `hardcore` 级别，每位参与者都必须保持明确成年、有智慧、双足且具有人类水平自主性及可见停止能力的人格主体。展示一种已经发生的明确成年人自愿性行为，而不是打斗、仪式伤口、握手、救援、物件交换或仅仅强烈的非性相遇。
    - 所有性解剖结构都是适合该角色的普通成年类人解剖结构。成年兽人可具有可见毛皮、动物头、趾行腿、爪足、利爪、尾巴、角或翅膀，但性接触仅使用类人的嘴、舌、手、手指、阴茎、阴道、肛门、外阴或阴蒂。绝不使用吻部形态、喙、角、利爪、尾巴、翅膀、爪垫、触手、武器、魔法效果或环境物件进行插入或刺激。亲密接触时保持利爪收起，牙齿远离皮肤。
    - 绝不涉及野兽身体、普通动物、宠物关系、囚禁、所有权、繁殖、发情或求偶躁动、醉酒或药物影响、胁迫、暴力、血液、仪式切割、伤害或年龄模糊。在共同场景中，每位参与者都主动触碰另一位参与者或与其发生性互动；没有成年人仅在背景旁观。在独处场景中，仅展示兽人主角主动触碰她或他自己的解剖部位。
    - 在 露骨级 级别，仅选择与已锁定解剖结构相容的行为，例如直接用手接触外阴或阴蒂、头部解剖结构允许时的舔阴，或直接外阴对外阴接触。
  themes:
    common:
    - 每个 主题 都必须呈现一个原创情境，具有明确的动作、冲突、交易、考验、救援、仪式、调查、表演、旅程或逆转。指定一位请求中的成年人为主要主角，由其决定启动、转向、拒绝或解决行动。在单人运行中，唯一的成年兽人就是主角。
    - 按以下顺序确定每个 主题 和 画面：精确的请求指定性别名额；确定性的一名兽人分配；一名主要主角；允许的来源材料及原创设计；明确成年且具备智慧的兽人阵容；与每个锁定性别相容的解剖结构；所选内容级别；主角自主性；共同或独自行事；真人实拍生物的真实感；可辨读的身体及接触物理；场景及文化语境；衣着、道具、相机及光线。后面的选择绝不能削弱前面的选择。
    - 当 主题 使用原创高幻想或英雄原型时，以独立特征构建它。例如，创造将破碎誓言储存在瓷羽中的鹤档案员、对记忆征税的雪豹桥梁执法官、铠甲可展开成脚手架的犀牛救援工程师，或递送密封梦境的渡鸦夜间信使。绝不把原创人物描述为现有系列角色的替代品、对应者、版本、戏仿或相似者。
    - 在 主题 的全部 画面 中保留精确的人类与兽人分配、姓名、性别、物种及身份。不得使用 主题 ID 映射、交替更换兽人性别，或根据所选性行为重新解释分配。
    - 对于以下请求指定阵容，在每个 主题 前提及 画面 的第一句中，先逐字放入对应分配，再给参与者命名：
    - '- 一名女性及一名男性："exactly two visible adult bodies, human_count = 1, furry_count = 1: one named human
      woman and one named adult male anthropomorphic [species] furry, zero other bodies"；- 两名女性及零名男性："exactly
      two visible adult bodies, human_count = 1, furry_count = 1: one named human woman and one named
      adult female anthropomorphic [species] furry, zero other bodies"；- 三名女性及零名男性："exactly three visible
      adult bodies, human_count = 2, furry_count = 1: two named human women and one named adult female
      anthropomorphic [species] furry, zero other bodies"；- 一名女性及两名男性："exactly three visible adult bodies,
      human_count = 2, furry_count = 1: one named adult female anthropomorphic [species] furry and two
      named human men, zero other bodies"；- 两名女性及一名男性："exactly three visible adult bodies, human_count
      = 2, furry_count = 1, zero other bodies: two named human women and one named adult male anthropomorphic
      [species] furry"。'
    - 将每个方括号内的物种及每个 "named" 占位符替换为原创角色身份，同时保留每个数量、类别及性别词。不得改写分配、将一个数量拆分到多个分句，或先描述一个身体再于后文添加另一个身体。
    - 指定一名已分配的成年人为主要主角。每位请求指定的成年人都必须明确成熟且年满二十五岁。为每位角色赋予用 ASCII 拉丁字母书写的合理虚构姓名、明确性别、面部结构、体格、完整衣着状态、稳定识别细节、具体动机及主动角色。在整个
      主题 及每个 画面 中保留这些锚点。
    - 主要主角必须明显地发起、选择、拒绝、谈判、引导、救援、挑战、欺骗、保护、释放或完成核心行动。绝不把主角降为旁观者、战利品、俘虏、被动接受者、匿名相机视点或可替换的冒险者。
    - 每名兽人至少穿戴一件清晰可见、适应该物种的服装或经设计的可穿戴元素，用以表达角色的职业、文化、地位、当前任务及个人品味。模型依据 主题 自由构思服装，而非从预设服装清单中选择。不得将固定服装或服装类别绑定到物种、来源方向、主题
      ID、性别呈现或内容级别。
    - 允许实用工作服、剪裁合体的服装、长袍、外套、多层织物、礼服、旅行服、制服、围裙、腰带、束带、珠宝、防护装备，或同等具体的原创设计。这些是开放示例，而非必需类别。依据生成的角色及环境，变化轮廓、覆盖程度、材质、构造、扣件、磨损、颜色及配饰。
    - 将人类呈现为被拍摄的成年表演者，将每名兽人呈现为真实在场的电影生物，共享同一布景、镜头、光线、重力及接触阴影。
    - 使用可逐根看清且生长方向明确的毛发、覆盖柔软底绒的更密护毛、关节处自然结簇的毛发、长度及颜色的细微变化、仅在场景造成时出现的潮湿或灰尘、湿润反光的眼睛、半透明耳缘、有纹理的鼻部皮面、可信的胡须根部，以及符合物种的牙齿及舌头。
    - 通过合理的颅骨、吻部、脸颊、眉部、眼睑及颌骨结构构建面孔。表情必须能通过耳朵角度、眼睑、眉部、吻部张力、嘴唇、鼻孔、胡须及头部姿态辨读，而不是把脸变成覆盖毛皮的人脸。
    - 衣着必须贴合生物真实的解剖结构。领口容纳颈毛；袖子考虑手腕及前爪结构；裤子、长袍及铠甲适应趾行或跖行腿部，并设有尾部开口；帽子及头盔容纳耳朵、角或鹿角。展示压缩、被推开的毛、接缝、搭扣、重量、磨擦及接触，而不是悬浮的服装部件。
    - 优先采用实体生物特效、假体面部构造、细腻的机械仿生表现、真实织物、风化金属、雕木、皮革、陶瓷、羽毛及现场氛围。数字增强可以细化眼睛、口部活动、尾部平衡或翅膀，但必须从属于拍摄所得的物质真实感。
