    - 在段落的前三分之一内，展示主角以身体执行已完成的决定，并展示核心物件随之变化。把开头写成一次完整的首次呈现，不使用任何回指，也不引用另一 画面。
    - 不得使用动画、插画、漫画艺术或游戏计算机生成图像；不得让角色互不相关地并排摆姿势、混合缺乏连贯来源的文化元素，或用泛化铠甲、废墟、魔法光芒代替故事。各 画面 不得仅靠改写措辞形成差别。
    - 不得出现多余、缺失、重复、脱离、融合、反向或无所属者的肢体；逐一追溯左右肢体后才能用 "both legs"、"both knees"、"both feet"、"limbs" 或 "lower body" 总结。人类手臂与兽人前肢、人手与爪及各个接触处必须可区分。
    - 不得使用站立、压墙、抬起、悬吊、单脚、踮脚或高度不相容的插入姿势；尾巴不得借力、缠绕建筑或身体、与腿融合或朝向性接触。禁止用利爪、角、尾巴、翅膀、爪垫、喙、吻部形态、武器、魔法或环境物件进行插入或刺激。
    - 具有喙、扁喙、僵硬吻部、獠牙、大型尖牙或突出的动物颌部的兽人不得进行口部与生殖器接触。非口交行为中，手、手指、前爪、利爪、尾巴、服装及物件不得触碰或进入嘴，也不得把手摆在嘴唇上。
    - 保持所选内容边界、明确成年身份与自愿能力，不得胁迫；主题 前提不得重复或标注独立的 `style` 值。
    - 拒绝并重写任何未通过适用检查的 画面。
