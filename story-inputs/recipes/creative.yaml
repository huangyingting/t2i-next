      - '人物与内容级别：- "hardcore"：在被要求时，明确属于成年人的露骨性行为可以成为核心，同时解剖结构、接触、自主性、合理性以及高概念命题必须保持精确。'
  frames:
    common:
    - '不可妥协的输出要求：- 每个主题选择一个占主导地位的熟悉物件，或由两到五个熟悉物件构成的协调组合。'
    - '不可妥协的输出要求：- 在每个主题、画帧和区域中，每个人的身体都必须位于所有物件之外。'
    - '不可妥协的输出要求：- 让每个重要物件的完整形态及其日常身份都能被立即辨认。'
    - '不可妥协的输出要求：- 赋予人物主动与这一特定物件或物件关系互动的理由。'
    - '不可妥协的输出要求：- 为一个出人意料的命题构建六个视觉上明显不同的例证。'
    - '不可妥协的输出要求：- 无论 "frames_per_theme" 的值为何，每个叙事画帧都要呈现一个完整的竖幅 2 列 3 行网格。'
    - '不可妥协的输出要求：- 图像内不得渲染标题、图注、区域标签、文字排版、标志、水印、边框文字、界面元素或解释性图示。'
    - '日常使用的碰撞：物件必须主动发挥作用，不能只是只有微缩人物才会操作的废弃纪念碑。在六个区域中的至少两个区域里，外部常规尺度的手、身体、配套物件、环境力或真实机构，以一眼就能认出是日常使用的方式使用该物件。微缩人物始终留在外部，利用、改变方向、配合、打断或适应由此产生的力。'
    - '日常使用的碰撞：让介入方式贴合物件本身：外部常规尺度的使用者或作用力可以转动、折叠、倾倒、擦拭、卷绕、盖印、挤压、摇动、滚动、扣紧、穿戴、投掷、插接、充气、切割、打开、关闭，或以其他符合设计用途的方式使用物件。至少一次日常使用的碰撞必须成为概念板最有力的视觉包袱。在组合主题中，让一个物件的日常使用明显改变另一个物件以及人物。不要在不同主题中将同一种碰撞固定放在同一个区域。'
    - '仅限外部的尺度契约：每个人都位于所有物件表面朝向周围环境的一侧。人物可以横越外表面，在物件旁边或之间工作，操作从外部能够触及的部件，乘坐外部运动部件，改变向外流动的方向，或回应释放到周围空间的效应。'
    - '仅限外部的尺度契约：绝不将任何身体置于物件内部、空腔或容器空间内、外壳下方、剖切面后方，也不得越过通向内部的边缘、口部、接缝、舱口、口袋、袖筒、夹口间隙、开口或门槛。绝不使用内部视角。对于袋子、盒子、容器、衣物、家电、车辆及其他具有包围结构的物件，要么保持物件关闭，要么让每个人都明显远离开口并留在其外侧。日常使用绝不构成进入内部的许可。'
    - '仅限外部的尺度契约：不要将物件内部改造成建筑、房间、洞穴、隧道、舱室或自成一体的栖居地。物件外部及多个物件之间的普通环境可以充当微缩地形，但不得消解成无法辨认的泛化景观。打开、剥开、破损或切开的物件可以露出材质截面，但任何人都不得进入或占据暴露出来的空间。'
    - '仅限外部的尺度契约：单物件主题中，至少三个区域要展示其完整或接近完整的外轮廓。组合主题中，至少三个区域要展示完整的主要物件及至少一个能清楚辨认的次要物件。加入熟悉的外部尺度参照，使物件身份、物件之间的关系以及人物与物件的比例一目了然。'
    - '画帧阶段网格契约：无论 "frames_per_theme" 的值为何，每个叙事画帧都是一个完整的竖幅 2 列 3 行网格。区域是这一幅图像的分区，而不是独立的叙事画帧。多个画帧是同一主题的不同完整概念板提案。'
    - '画帧阶段网格契约：每个画帧都必须以下面两句原文逐字开头：'
    - '画帧阶段网格契约："A portrait 2-column by 3-row grid forms one image with six cleanly separated regions. Every person remains outside all colossal everyday objects throughout the board."'
    - '画帧阶段网格契约：随后依次使用原文提示词 "Region 1:" 至 "Region 6:" 引出所有展开描述。这些提示词用于组织提示语，不得作为文字渲染在图像中。绝不将一张概念板分散到多个画帧、为每个区域各用一个画帧、在另一个画帧中续写某一区域，或仅返回概念板的笼统梗概。'
    - '画帧阶段网格契约：落实每个主题种子，不得替换或弱化。在每个区域中，描述人物当前的目标、角色、动作、自主性和借力方式；物件外部尺度、相互关系和状态；可见的因果关系；真实的形变、位移、喷溅、张力、断裂、压缩、流动、反射、残留物或其他响应；场景；构图；机位；焦点；光线；以及色彩。'
    - '画帧阶段网格契约：每个画帧应足够简洁，能作为一条图像提示语使用，同时为全部六个区域提供具体的摄影细节。各区域之间要改变视觉动作、人物策略、社会关系、后果、景别和构图。不要将六个种子扩写为支撑、按压、抓握、平衡、摩擦、攀爬或让物质落在皮肤上的六种变体。'
    - '人物与内容级别：严格使用所要求数量的成年女性和成年男性。网格中的重复视图不增加人物数量。在主题的全部六个区域和所有画帧中，保持每个人明确的成年年龄、面孔、体型、头发、身体细节和造型一致。'
    - '人物与内容级别：通过所选的 "content_level" 诠释命题，不得让内容强度决定物件选择或替代创意。'
    - '人物与内容级别：不要将 "erotic" 或 "hardcore" 淡化成中性图像。每位成年人都保持清醒、自愿、有回应并且能够停止。'
    - '微缩世界的镜头语言：按照微缩世界的视觉逻辑拍摄每个区域。人物必须呈现为生活在巨大得压倒自身、却又熟悉的日常物件之间并与之互动的微小真实成年人，而不是站在抽象建筑旁的正常尺寸成年人。'
    - '微缩世界的镜头语言：采用近距离对焦的商业摄影，并在有助于强化尺度感时使用受控的移轴或微距式选择性对焦。让人物、准确的接触点和足够多可辨认的物件外部保持清晰，同时让前景与背景平面干净地虚化。不要过度模糊，以致面孔、动作、材质响应或完整物件身份无法辨认。'
    - '缩略图中的尺度层次：设计每个区域时，首先确保它在缩略图尺寸下清晰可读：一个占主导地位的熟悉物件、协调的物件组合或明确可辨的外部特征；一到两个明显微小而完整的成年身体；一个清晰的动作轮廓；以及一个简单的色彩对比。观众必须先理解“微小的人生活在巨大的日常物件之间”，然后才注意到情色细节、面部表情或材质微观纹理。'
    - '缩略图中的尺度层次：在每张六区域概念板中：'
    - '缩略图中的尺度层次：- 至少使用四个远景或中景，展示完整的成年身体，以及足以确立尺度的物件轮廓、相互关系或标志性几何形态；'
    - '缩略图中的尺度层次：- 用于近距离细节的区域不得超过两个，并为每个近景配上熟悉的超大特征或外部参照作为锚点；'
    - '缩略图中的尺度层次：- 成年人在视觉上应从属于物件布置，而不是像正常尺寸的时装模特一样占满画面；'
    - '缩略图中的尺度层次：- 大幅改变相对尺度，包括一个完整物件或物件组合的主视觉，其中成年人几乎像玩具一样微小，以及一个更近的互动视图，其中身体力学仍然清晰可辨；'
    - '缩略图中的尺度层次：- 避免将宽大而无特征的侧面当作墙壁或背景；应包含边缘、曲线、把手、接缝、按钮、凹槽、齿、标记体系、运动部件或其他能立即识别身份的几何形态；并且'
    - '缩略图中的尺度层次：- 不要让蒸汽、薄雾、烟、黑暗、反射、织物或浅景深掩盖人物与物件的比例。'
    - '缩略图中的尺度层次：醒目的印刷图案、模压标记、重复刻度、凹槽、圆点、凸棱和其他表面图形体系，即使其中的具体文字或数字无法读清，也可以强化尺度感。概念本身不得依赖对它们的阅读。'
    - '缩略图中的尺度层次：在六个区域中变化使用有效的微缩视角：沿物件表面的微缩人物眼平视角、让普通边缘显得宏伟的低角度、以完整轮廓衬托微小身体的高位斜视角、精确的俯拍布局，以及由可辨认的大尺度特征锚定的近距离细节视图。只有在能澄清尺寸时，才加入指尖、桌面纹理、织物织纹、地板接缝、器具、包装边缘、水滴、碎屑或五金件等日常外部尺度参照。'
    - '缩略图中的尺度层次：这是清晰利落的编辑式广告摄影，而不是电影剧照。不要使用电影化调色、青橙色调、死黑、浑浊暗部、棕褐色调、胶片颗粒、变形镜头炫光、戏剧化浓雾、烟雾氛围、黑色电影式明暗对照或含糊的大片奇观。'
    - '明亮洁净的色彩标准：使用明亮、洁净的高调色彩，让皮肤、物件、服装和背景清晰分离。优先采用清新的白色、明亮的日光、精致的粉彩、鲜艳的物件色彩、干净的原色以及有意设计的互补色对比。饱和度可以大胆，但必须保持高级、自然并符合材质特性，而非霓虹或人工合成感。'
    - '明亮洁净的色彩标准：在较为简洁且形成对比的背景上，为物件布置赋予一眼可读的主导色彩关系或图形纹样。物件允许时，优先采用彩色珐琅、染色塑料、涂漆、纸张、织物、食物色彩、半透明色彩或其他真实的明亮表面处理。对于天然中性色的金属、玻璃、木材或白色物件，使用大胆的周围色块和清晰的轮廓光，而非灰上加灰的写实处理。'
    - '明亮洁净的色彩标准：避免让不锈钢灰、米色、黑色、棕色、蒸汽白或低饱和度环境色主导概念板。不要让浅色皮肤、浅色服装、浅色物件和浅色背景处于同一色调区间。在保留所要求内容级别的同时，为人物配置能使身体与主体物件及背景都清晰分离的服装或配饰。'
    - '明亮洁净的色彩标准：像精心制作的商业桌面广告一样为概念板布光：宽广柔和的主光、清晰受控的高光、保留可见细节的通透暗部，以及将每个微缩身体牢牢落在表面上的小范围接触阴影。保持背景简洁，并在有助于画面时使用色块。每个主题可以选择不同的明亮配色，但同一画帧中的六个区域必须属于同一套洁净的广告视觉体系。'
    - '摄影材质标准：以高品质实拍摄影呈现不可能的景象，使重力、尺度、光学、皮肤、纤维、颗粒、反射、阴影、接触形变、外部纵深线索和材质微观纹理可信。即使用移轴对焦夸大尺度，也要保留真实的面孔与解剖结构。使用一套协调一致的广告视觉语言，同时提供足够的构图对比，使网格富有活力。避免奇幻薄雾、装饰性杂物、卡通物理、内部剖视、泛泛的奇观，以及六个几乎相同的视图。'
    - '最终创意优先项：返回之前，将以下事项作为创意优先项：'
    - '最终创意优先项：- 至少两个区域中，一个或多个物件正在经历可辨认的日常使用；'
    - '最终创意优先项：- 每个人都留在所有物件之外，任何物件内部都不变成可居住的世界；'
    - '最终创意优先项：- 任何概念都不依赖可读文字或解释性的背景设定；'
    - '最终创意优先项：- 每个区域在缩略图中都能清楚呈现巨大的熟悉物件、微小而完整的人物、清晰的动作和干净的色彩分离；'
    - '最终创意优先项：- 至少四个区域展示完整身体并有充分的尺度依据，而近景仍以标志性的物件几何形态为锚点；'
    - '最终创意优先项：- 每个画帧独立包含完整的无文字 2 列 3 行网格、逐字一致的开头，以及 "Region 1" 至 "Region 6"；并且'
    - '最终创意优先项：- 每个区域都使用微缩世界的尺度线索、明亮洁净的商业色彩、清晰可辨的接触，且不使用电影化处理；并且'
    - '最终创意优先项：- 人物构成、同意、内容级别、物理合理性和摄影品质均准确符合要求。'
    - '最终创意优先项：这些优先项用于指导筛选和修订，并非硬性质量门槛，不得阻止其他方面结构有效的结果通过。不可妥协的网格、人物构成、仅限外部、内容级别和数据模式契约仍属强制要求。'
    content_levels:
      aesthetic:
      - '人物与内容级别：- "aesthetic"：优雅、非露骨、适合公开刊载的身体感知与互动；'
      erotic:
      - '人物与内容级别：- "erotic"：明确属于成年人的性感张力、有意的暴露或遮掩、相互的亲密，以及强烈的身体张力，但不包含露骨性行为；'
      hardcore:
      - '人物与内容级别：- "hardcore"：在被要求时，明确属于成年人的露骨性行为可以成为核心，同时解剖结构、接触、自主性、合理性以及高概念命题必须保持精确。'
