    - '二维投影与表面可见性：- 对于口乳接触，使用侧面或四分之三侧向角度，展示动作执行者嘴部的侧面和被接触的近侧乳房。嘴部遮住唇下的中央区域；只描述可见的嘴唇、舌头、乳头边缘和周围乳房的反应。'
    - '二维投影与表面可见性：- 对于插入，使用侧向或四分之三侧向视角，透过近侧大腿间的空隙观看。只展示外部根部、接受方开口的近侧边缘和外部插入交界。在该交界处结束可见链条，省略内部部分。正前方或正后方视角不能穿过较近的骨盆暴露完整交界。'
    - '二维投影与表面可见性：- 对于托举插入，要么选择偏正面视角展示面部、胸部和外部骨盆交界，要么选择偏背面视角展示臀部和托举支撑。若要同时展示外部骨盆交界和一个臀部支撑点，应使用真正的侧向四分之三角度；远侧臀部和远侧支撑接触仍被遮挡。绝不声称双臀、两个臀下接触点、完整正面胸部及插入交界都能在一个直接视图中清晰可见。'
