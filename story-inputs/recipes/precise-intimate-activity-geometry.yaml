    - '动作接触链：被遮挡形式只提及一次活动，但省略隐藏的接触身体结构、接触运动和内部状态。绝不对同一动作混用可见和被遮挡两种形式。'
    - '动作接触链：使用具体的现在时动词：舔舐、吮吸、亲吻、按压、抚弄、打圈、摩擦、抓握、分开、握持、抬起、支撑、插入、接受、摇动、抽送或振动。每条接触链使用一个主要动词。'
    - '动作接触链：所需精确度示例：'
