    - '接触状态不变量：同一接触不能在同一画帧中处于两种状态。对于插入状态，只描述所属者、连续的近端部分和接受方边界；省略该边界以外的所有远端结构。不要为嘴内或身体开口内的身体结构命名、定位、布光、对焦或赋予运动。'
    - '接触状态不变量：每个接触边界的两侧共享同一画面位置和同一深度平面。每只支撑的手、脚、身体表面、墙面和家具接触点，都必须能由其相连关节到达，而不穿过另一个实心体积。若两侧在所述姿势下不能处于同一点，就在写正文前改变姿势或支撑。'
    - '接触状态不变量：对于阴茎口部活动，只能在两种方案中选择一种。外部舔舐使阴茎保持在嘴外，并展示舌头接触一个外表面。口腔插入只提及一次吮阴茎，将动作执行者头部与所属者骨盆对齐，将其接触边界指定为被遮挡状态，并省略该处局部身体结构。这两种方案绝不共存。任何手部接触都是独立动作链，不得取代或打断身体归属连续性。'
    - '动作接触链：根据接触边界在相机场景图中的状态，选择一种动作链形式。只在动作执行者的人物描述块中写一次该链。接受方的描述块可以说明可见的全身反应，但不重复接触身体结构，也不重新分配执行动作的肢体。对于可见边界，使用：'
