id: precise-intimate-activity-geometry
description: 为成年人之间明确、自愿的性活动创作独立的照片级写实图像提示词。用精确、简洁的空间语言描述可见动作。图像必须通过身体几何关系让人理解，而不是依赖情绪、委婉语或装饰性文辞。
generation:
  theme_count: 1
  frames_per_theme: 6
  output_language: english
  content_level: aesthetic
authoring:
  themes:
    common:
    - '主题种子门槛：每个主题的标题和设定只定义人物、房间、主要活动、基本身体排列和必要支撑。主题绝不定义相机位于哪一侧、镜头、取景、裁切、前景、可见性、遮挡或接触边界是否可见。画帧独自负责相机和可见性。若提供的主题包含相机或可见性表述，忽略这些表述，在画帧中重新建立一个相机场景图。'
    - '主题种子门槛：编写每个主题前，建立不可变的性别名额：恰好 female_count 个成年女性名额和恰好 male_count 个成年男性名额。每个名额只填入一个独一无二的姓名，并在每个画帧中保持相同的人物和性别。对于一女一男的请求，每个主题设定和每个画帧都必须指名恰好一名成年女性和恰好一名成年男性。绝不把请求中的男性换成女性、把女性换成男性，或添加旁观者。'
    - '性动作库：在不同主题间变化动作。选择一个明确的主要活动，至多再加两个次要接触：'
    - '性动作库：1. 在另一名自愿的成年人观察或引导下独自自慰；'
    - '性动作库：2. 由伴侣引导的自慰或相互手淫；'
    - '性动作库：3. 亲吻、舔舐、吮吸乳房，或用手刺激乳房；'
    - '性动作库：4. 舔阴或吮阴茎；'
    - '性动作库：5. 阴道或肛门插入；'
    - '性动作库：6. 使用手持外用振动器或假阴茎，并让其所属者可见；'
    - '性动作库：7. 由另一名成年人控制的穿戴式刺激；'
    - '性动作库：8. 面对面、后入、侧卧、坐姿、站姿或被托举时的性行为；'
    - '性动作库：9. 在手腕或脚踝使用带衬垫的束缚，同时进行手部、口部、玩具或插入式性行为；'
    - '性动作库：10. 自愿的打屁股、软拍、眼罩、高潮边缘控制、张开身体的姿势、跪姿臣服或对身体安全的绳缚。'
    - '性动作库：每名可见成年人都通过动作、支撑职责、控制、相互触碰或明确反应参与。若有三名或更多成年人，为每人分配独立动作和独立轮廓位置。说明谁触碰谁；不要把群体描述成一个混合整体。'
    - '外观与场景：几何关系完成后，仅使用相机场景图中的可见元素，为每名成年人写一个简洁的造型分句。先描述体型和可见皮肤，再仅在对应部位可见时描述面部、发型、仪容、妆容或表情；仅在脚可见时描述鞋履。服装始终与动作相容，移位的衣物占据一个可见且明确指名的位置。造型绝不重新引入被遮挡或画外部位。'
  frames:
    common:
    - '输出约定：每个画帧写成一个自然的英文段落，仅使用可打印 ASCII 字符。两名成年人以 280-450 词为目标，每增加一名成年人再增加 70-110 词。使用 8-14 个简短、直接的句子。前半部分交代人物、中心人物、性动作、身体位置和接触几何关系。其余句子用于外观、环境、光线、相机和简洁的道具描述。只返回正向的可见描述，不要标题、标签、列表、解释、备选方案或负面提示词语言。'
    - '精确人物构成与身体归属：以此原文开头："Exactly N adults belong to N coherent bodies in this image." 随后立即逐一列出每名请求中的成年人，注明不低于 25 岁的数字年龄、性别、国籍和独一无二的姓名。严格保持 female_count 和 male_count。每个可见的面部、头部、躯干、骨盆、手臂、手、腿、脚、乳房、嘴、舌头和生殖器结构都属于一名有姓名的成年人。'
    - '精确人物构成与身体归属：每名请求中的成年人都有一个连贯的身体：一个头部、一个躯干、一个骨盆、两条手臂、两只手、两条腿、两只脚和一套解剖一致的生殖器，无论全身可见还是部分位于画外。身体完整性是拓扑要求，不是全身取景要求。当可见肢体靠近同一区域时，说明左右。用可辨认的轮廓和小片负空间分隔可见的手、嘴、玩具、生殖器、支撑装置及重叠肢体。'
    - '精确人物构成与身体归属：只描述执行动作、承重或决定姿势的可见肢体。将每条此类肢体从其可见的身体连接处连续追踪至其可见的手、脚或画面边缘，并赋予一个职责。隐藏肢体和画外部位不需要清点，也不应获得文字描述。'
    - '中心人物锁定：只选择一名中心人物，并在第一句中写出其姓名。首先在一个人物描述块中最充分地描述这名成年人。说明：'
    - '中心人物锁定：1. 画面位置：画面中央、偏左中央、偏右中央、上部中央或下部中央；'
    - '中心人物锁定：2. 朝向：面向相机、背向相机、左侧面、右侧面或四分之三侧向；'
    - '中心人物锁定：3. 身体高低姿态与轴向：站立、跪姿、坐姿、仰卧、俯卧、侧卧、被托举、水平、垂直或斜向；'
    - '中心人物锁定：4. 每条可见身体链和每个指名的遮挡体积；'
    - '中心人物锁定：5. 精确动作、可见的动作执行部位和可见支撑点；'
    - '中心人物锁定：6. 仅在面部可见时描述表情和视线。'
    - '中心人物锁定：每条可见肢体的位置、支撑职责和主动接触，都只在其指名所属者的人物描述块中写一次。不要先分配被动位置，随后又把同一只手、脚、嘴或肢体移动到动作中。'
    - '中心人物锁定：将可见面部放在无遮挡的轮廓位置。为动作中心赋予相机场景图选定的可见或被遮挡状态。对于接触边界可见的明确生殖器动作，将骨盆保持在画面中部或中下部的三分之一区域。对于可见的口乳接触，将胸部和嘴保持在中间三分之一区域。对于托举姿势，让悬空骨盆、每个承重接触点以及托举者稳固支撑的躯干可见。'
    - '其他人物描述块：按由近到远或从左到右的顺序，用独立句子描述每名其他成年人。对每人说明画面位置、朝向、身体高低姿态、躯干轴向和骨盆位置，然后在此人唯一的人物描述块中只描述可见肢体链、可见支撑点、指名的遮挡体积和精确动作。仅在面部可见时说明头部角度、视线和表情。'
    - '其他人物描述块：每种支撑状态都应内部互斥。平放的脚，其脚跟、前脚掌和脚趾都接触表面。抬起脚跟时，只有前脚掌和脚趾接触表面。整只抬起的脚不接触任何表面。支在表面上的膝盖不能同时抬起，伸直的肘部也不能同时落在表面上充当支撑。为每只承重的手、膝盖或脚指明支撑表面。'
    - '其他人物描述块：然后用一个直接的句子说明与中心人物的关系：在旁边、后方、前方、上方、下方、双腿之间、胸部处、骨盆处、支撑背部或从下方托举。写出两人的姓名；当两个身体重叠时，绝不依赖含糊的 "he"、"she"、"they"、"partner"、"another person" 或 "someone"。'
    - '二维投影与表面可见性：将画帧视为从指定相机位置得到的单一不透明二维投影。只描述无遮挡视线能到达的身体结构和接触。身体体积、服装、家具和较近的成年人会遮挡后方表面；绝不把身体结构描述为透过另一表面可见。'
    - '二维投影与表面可见性：在第二句中锁定相机，紧接精确人物构成之后。该句必须在描述任何身体姿势之前，说明相机侧向位置、高度、观看方向、镜头、取景尺度和近侧可见表面。还必须指明遮挡主要接触的任何体积。绝不把相机描述拖到段落末尾，也不在后文改变视角。'
    - '二维投影与表面可见性：这个相机句建立全段使用的唯一可见性场景图。仅纳入其边界内可见的身体结构、接触边界、支撑点和道具，以及遮住任何被遮挡主要接触的、指名的较近体积。画外部位不在图中。姿势、动作、造型、光线和焦点均使用这张图，之后不得增加身体部位。若只剩侧面边缘可见，应将可见性分配给表面小片，而非整个身体部位。'
    - '二维投影与表面可见性：相机句为主要接触边界指定一种状态：可见，或被某个指名的近侧身体体积遮挡。当物理投影确实如此时，插入边界可以保持被遮挡；此时通过身体对齐关系让动作可读，而非虚构内部身体结构。可见性状态不可变：被指定为遮挡或位于画外的身体结构，之后不得被描述、对焦、描述为在视野内受到接触或称为可见。起草后，比较每处 "visible"、"occluded" 和 "hidden" 的用法；若同一身体部位或接触被赋予两种不同可见性状态，就重写。'
    - '二维投影与表面可见性：- 正面视角中，胸部和躯干前侧可以可见，但完整臀部和臀沟不可见；转向的边缘处只能略微露出臀部外轮廓。'
    - '二维投影与表面可见性：- 背面视角中，背部和臀部可以可见，但双乳、乳头、腹部和前侧生殖器不能完整可见。'
    - '二维投影与表面可见性：- 严格侧面视角中，只展示侧面轮廓和近侧肢体；不要声称前后身体结构同时完整可见。'
    - '二维投影与表面可见性：- 四分之三侧视角中，展示近侧的前表面或后表面，另加仅在解剖上合理的远侧边缘轮廓。绝不把完整正面胸部和双臀完整后视图结合起来。'
    - '二维投影与表面可见性：- 转头会改变面部可见性，但不会让躯干、骨盆、乳房或臀部转向相机。'
    - '二维投影与表面可见性：身体重叠时，明确说明近侧与远侧的遮挡顺序。若选定角度使主要接触藏在大腿、骨盆、躯干、手、衣物、坐垫或家具边缘之后，就移动相机或改变姿势。不要用透明身体、不可能的扭转、第二视角或未说明的镜子解决遮挡。已说明的镜子只能以一个物理一致的反射展示另一表面，并须具有自身明确的位置和反射角；直接视图和反射不得合并成一个身体。'
    - '二维投影与表面可见性：接触边界可见时，不要只声称其视线畅通。要通过指明观看窗口来证明：相机侧向位置、近侧身体边界、远侧身体边界，以及两者之间的接触边缘。应用以下针对动作的投影规则：'
