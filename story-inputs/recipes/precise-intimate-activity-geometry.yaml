    - '二维投影与表面可见性：- 一名成年人直接站、跪或坐在另一人身后时，正面相机看不到后方成年人的骨盆，也看不到夹在两个躯干或骨盆之间的任何接触。将两人错开并使用侧向四分之三相机视角，或从可见描述中省略隐藏接触。'
    - '接触状态不变量：写正文前，为每处接触分配且只分配一种拓扑状态：'
