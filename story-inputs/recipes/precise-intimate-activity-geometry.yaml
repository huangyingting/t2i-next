    - '动作接触链：- 手部刺激：Jun 的右肩连续连接到他弯曲的右肘、手腕、手掌以及两根可见手指，手指在 Mei 的阴蒂上打圈；Mei 的双腿保持张开，骨盆朝他的手倾斜。'
    - '动作接触链：- 被遮挡的口腔插入：An 跪在 Bo 张开的大腿之间，为其吮阴茎；侧后方相机使 An 的头部轮廓与 Bo 的耻部重叠，Bo 的近侧大腿遮住他们的接触边界，An 的双手都放在 Bo 的大腿上。'
    - '动作接触链：- 插入：插入部位与其所属者的骨盆保持可见连续；相连根部从该成年人的耻部伸出，接受方的耻部在同一接触平面与之相接，接受方开口的近侧边缘在外部插入交界处与阴茎体相接。说明躯干朝向、耻部对耻部接触、腿部位置、节奏和支撑。在接受方边界处结束可见描述，省略内部部分。绝不让插入部位终止于腹部、大腿、衣物、坐垫或空处。'
    - '动作接触链：- 玩具动作：指明握持或佩戴玩具的成年人、抓握玩具的手、玩具形状与朝向、被接触的身体结构、线缆或控制器位置，以及可见的材质反应。'
    - '动作接触链：一条肢体在全段中只承担一个物理职责。若一只手握住手腕，就不能同时支撑大腿。若肘部或前臂承受所属者的体重，该手臂就不能同时握持、按压、分开、抚弄或束缚另一名成年人。若嘴接触乳房，其舌头和嘴唇就保持在该乳房处。用独立短句描述同时发生的动作。'
    - '托举与支撑几何关系：当另一名成年人托举中心人物时，说明：'
    - '托举与支撑几何关系：- 谁在托举，从哪个画面位置托举；'
    - '托举与支撑几何关系：- 每条托举前臂和每只手在何处接触中心人物身体；'
    - '托举与支撑几何关系：- 哪个部位承重：上背部、胸廓、腰部、臀部、大腿外侧或膝盖；'
    - '托举与支撑几何关系：- 中心人物的身体轴向、弯曲关节、自由肢体、头发方向，以及距地板或家具的高度；'
    - '托举与支撑几何关系：- 托举者的站姿、双脚间距、屈膝程度、脊柱角度、平衡方式和视线；'
    - '托举与支撑几何关系：- 任何第二名支撑者及其独立承重点。'
    - '托举与支撑几何关系：示例：Tao 站在画面偏左中央，双脚与肩同宽，膝盖弯曲；他的右前臂穿过 Rui 近侧臀部下方，右手支撑她的远侧臀部，左前臂则横托她的上背部。Rui 面向 Tao，身体略呈斜向、直立地被举起，左臂环绕 Tao 的肩膀，右臂伸展，双大腿环绕他的髋部，双膝弯曲，双脚均离地。'
    - '托举与支撑几何关系：对于托举插入，使用力学相容的轴向。接受方保持垂直或斜向并面朝托举者，大腿环绕托举者髋部，双脚离地；托举者的一条前臂和手支撑双臀，另一条手臂支撑上背部。两人的耻部在双方腹部下方的一个可见接触平面相接。不要将被托举者描述为水平或横躺在托举者身上，同时又让双大腿环绕托举者腰部。'
    - '托举与支撑几何关系：对于束缚、悬吊、家具或机械支撑，将承重路径从指名的身体部位，经衬垫、束环、手臂、吊带或表面，追踪到可见的墙、床、地板或天花板锚点。展示触手可及的释放装置，保持颈部和气道不受阻碍。'
    - '外观与场景：使用完整的室内环境。指明房间、地板、墙壁、天花板、主要家具、入口、窗户或建筑开口，以及 3-6 件有明确位置的道具。说明有场景依据的光源、方向、柔和度、色彩特征，以及可见场景图元素上的高光和阴影，再说明三个景深层次。不要重述或改变第二句中确立的相机。按动作可读性选择取景。让每处主动接触和每条支撑链保持在画面内；省略选定取景之外的所有身体结构。'
    - '静默否决检查：若出现以下情况，在内部重写：人物或性别数量改变；中心人物未指名或未定位；可见姿势含糊；可见肢体、嘴、舌头、玩具或生殖器结构没有指名所属者；接触目标或运动含糊；一只手承担两个不相容职责；舌头悬浮在嘴外；阴茎脱离骨盆；支撑穿过动作中心；被托举的身体缺少完整承重路径；身体融合；肢体重复；同一肢体在后文改变职责；脚、膝盖或肘部的支撑状态矛盾；插入双方耻部位于不同接触平面；选为可见的接触缺少真实观看窗口；选为被遮挡的接触后来被描述为可见；阴茎口腔插入在接触边界被指定为遮挡后仍描述局部口部或生殖器结构；同一接触具有多种拓扑状态；正文提及插入边界以外的远端结构；次要手部动作打断身体归属连续性；正前方或正后方插入视角声称完整交界可见；取景排除主动接触或支撑链；正面几何关系暴露完整后表面；背面几何关系暴露完整前表面；转头错误地带动躯干或骨盆旋转；一个直接视图结合了不相容表面；相机句将接触标为遮挡，后文却称其可见；正面相机暴露夹在前后重叠骨盆之间的接触；正文描述选定取景外的身体结构；姿势、造型、光线或焦点添加相机场景图中不存在的元素；主题或画帧改变请求中的性别名额；仍有非 ASCII 字符；或装饰性描述长于动作几何描述。'
    - '最终顺序：1. 精确人物构成、中心人物、房间和主要活动。'
    - '最终顺序：2. 相机侧向位置、高度、方向、镜头、尺度和可见表面。'
    - '最终顺序：3. 中心人物的唯一人物描述块，包含可见姿势、肢体职责、主动接触链、支撑和反应。'
    - '最终顺序：4. 每名其他成年人的唯一人物描述块，采用同样不重复的结构。'
    - '最终顺序：5. 尚未说明的任何其余束缚、家具或装置承重路径。'
    - '最终顺序：6. 每名成年人的简洁可见造型。'
    - '最终顺序：7. 室内环境、有明确位置的道具、光线、景深层次和焦点，不改变锁定的相机。'
validation:
  themes:
    mode: report
  frames:
    mode: report
    checks:
    - type: ascii
requirements:
  output_languages:
  - english
