    - 批量 主题 均衡轮换交通工具、船舱、酒店、后台、商业空间、办公室、餐饮空间、运动水疗、仓储工业和住宅十类地点，不得连续使用车后备箱或衣柜。姿势至少均衡覆盖身体折叠、翘臀和大字型三大类，并轮换跪姿、俯卧、仰卧、侧卧、坐姿和站姿支撑。轮换
      25–34、35–49、50–64、65–79 岁以及丰满、肥胖、精瘦、宽壮、柔软和肌肉型成年人；年龄与体型不得成为羞辱理由。
    - 每个 主题 使用不同的主色、辅色、材质、季节、服装单品、透明度或褪下位置、鞋履、发型、妆容、配件、空间开口形状、围观者排列和详细表情组合。批量必须覆盖暖色、冷色、中性色、金属色与多色搭配，不得让黑色、红色或蕾丝垄断造型。围观者必须在视觉上属于同一场景，却通过服装颜色、站位和脸部特征相互区分。画面焦点始终是唯一主表演者，围观者不能遮住主表演者的头、骨盆、臀部、四肢关节或出口。
    - 16. 相邻 主题 重复同一场景编号、空间类别、姿势、配色、服装或围观者排列，或整批缺少身体折叠、翘臀与大字型任一类别。
  frames:
    common:
    - 每个 画面 必须控制在 400–680 个英文单词；四人场景优先控制在 420–540 个单词，每增加一人最多增加 30 个单词。若细节要求发生竞争，优先保留准确人数、主表演者完整姿势、真实空间、主光源、一个色彩钩子和每名围观者的一项独特反应，删除重复服装形容词、重复安全解释、第二次摄影参数和同义改写。
    - 每个 画面 的前 180 个英文单词内必须用一句具体构图句明确：完整开口内只出现主表演者、承重垫和内部表面；开口框架与占画面高度 8–15% 的连续外部地面带构成可见边界；每名围观者分别站在开口左右两侧或更远处的独立外部轮廓槽位，外部背景包围其轮廓三侧；开口中央、主表演者正后方和四肢间负空间保持为清楚可见的空内部背景。不得只写
      “spectators are outside”、“safe distance” 或 “visible gaps” 来代替这句二维构图说明。
    - 每个 画面 都从空白状态独立写成一张完整平行摄影方案，第一句直接写具体季节、时刻、地点和当前光线。不得使用 “the same”、“identical”、“again”、“remains unchanged”、“previously”、“has
      shifted”、“different angle”、“continues”、“earlier Frame” 或 “another view” 等后向连续性短语；不得描述前一刻动作、反应演变或视角从上一帧移动。提交前逐词扫描这些禁用短语，发现任一个就重写相关句子。每个围观者最多使用一个简洁句子，摄影参数集中在一个句子中，整段最多保留三个竞争视觉钩子。
    - 开头应完整地首次呈现场景，不向前文回指，也不引用另一幅画面。
    - 同一 主题 的全部 画面 保持地点、人物、年龄、体型、服装单品、透明度、主辅色、材质、鞋履、发型、妆容、配件、空间尺寸、出口状态、围观者站位和主要姿势不变。不同 画面 只改变一个真实可达的观察方向、主表演者视线、一个轻微手部调整或同一情绪基调内的表情强弱，不写时间推进，不让人物进入或离开。
    - 每个 画面 是一个 400–680 个英文单词的独立可渲染摄影段落。最终段落只写当前画面中可见的内容，不输出 `LOCK`、“schema”、公式、检查步骤、方括号占位符、否定合规清单或自我说明。把人数算术留在内部规划中，并在前两句自然写明准确总人数、一名女性主表演者，以及额外女性和男性围观者的准确人数；随后为每名人物指定明确成年年龄、独特外貌和可追踪站位。
    - 每个 画面 只呈现一个曝光瞬间、一个可建造空间和一个主要动作。先写真实地点、季节、时刻与可见光源，再写主表演者、狭小空间、围观者和摄影处理。所有句子服务于同一空间图，不重复完整约束，不把同一动作换词描述两遍。
    - 空间必须真实可建、可进入且尺寸关系明确。至少显示三个狭小证据：身体与左右边界的近距离、头顶或背部与上方结构的距离、手掌或膝脚压住的承重点、完全开启的门或舱口、外部正常尺度参照。主表演者拥有一条连续可读的头—颈—胸廓—脊柱—骨盆—四肢链，正常成人头身比和一致肢体长度；每只手和脚只承担一个清楚任务。
    - 三类核心姿势必须大胆但停留在可由健康成年人短时保持的范围内： - 身体折叠：髋膝深屈，胸腹贴近大腿，膝盖位于肋骨两侧但低于肩峰，脸在膝间或膝上方清楚可见，骨盆由软垫稳定支撑，脊柱保持连续自然曲线。
      - 抬高骨盆：两膝与两前臂形成宽而稳定的四点支撑，胸部接近软垫，骨盆明显高于肩线约半个躯干厚度，腰椎保持可见但不过度的生理弧度。 - 对角伸展：双手和双脚分别接触四个不同支撑区，肘膝保留自然轻屈，躯干形成清楚对角或
      X 形负空间，但不要求达到关节极限或同时触及最远角点。
