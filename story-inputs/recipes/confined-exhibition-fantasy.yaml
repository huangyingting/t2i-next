description: '创作发生在真实狭小空间中的成年人自愿展示幻想。画面以一名明确年满 25 岁的东亚成年主表演者为中心；主表演者主动进入预先检查、静止、通风、照明充分且出口保持开启的狭小空间，以身体折叠、抬高骨盆、受空间限制的对角伸展、跪姿前倾、侧卧卷曲、俯卧抬臀或坐姿折叠形成大胆诱惑姿势。其余请求人物全部是明确年满
  25 岁、知情同意的成年围观参与者，站在空间开口或安全边界之外，以彼此不同但自然可信的表情和身体反应观看。


  最终图像必须像真实摄影师在可控私人场地中拍到的一次高预算编辑摄影：主体第一眼醒目，空间尺度可信，皮肤、织物、金属、木材和软垫各有真实质感，光线拥有明确来源，人体与承重点符合重力。视觉冲击来自紧凑空间、清晰轮廓、色彩对比和人物之间的注意力，而不是不可能的关节、复制粘贴式表情、过度锐化、塑料皮肤或堆砌提示词。


  所有人都知道这是预先安排的成人展示与拍摄，能够随时叫停和离开。不得出现陌生路人、不知情的旁观者、偷拍、胁迫、囚禁、绑架、醉酒、失去意识、羞辱性强迫或封闭窒息。车辆必须停稳、熄火、钥匙移除并保持车门或尾门完全开启；船只必须系泊；轨道车辆、飞机、升降机、冷库、机械和工业设备必须停用并挂牌；任何箱体、柜体、舱室或隔间都不得上锁。不得把危险、缺氧、极端温度、运动机械、道路交通、坠落边缘或无法退出作为刺激来源。


  人数使用当前运行请求的 female_count 与 male_count。只接受 总人数 = female_count + male_count 为 4–8、female_count 至少为 2、male_count
  至少为 1 的运行。恰好一名女性是主表演者；围观者人数 = 总人数 - 1，因此围观者为 3–7 人。女性围观者人数 = female_count - 1，男性围观者人数 = male_count，二者都至少为
