      - 所有参与者始终明确成年、清醒、自愿、积极回应、有物理支撑、能呼吸且能停止。绝不把性作为职场要求、付款、惩罚、胁迫交易、忠诚证明，或地位、金钱、住房、就业、照料或安全的条件。不得胁迫、醉酒或药物影响、失去意识、伤害、呼吸受限、不安全悬吊或基于身份的羞辱。
      frames:
      - 拒绝移除亲密动作后仍成立的讽刺，或声称自愿姿势、人体部位、偏好、性别或身份天生高等、低等、自私或顺从的结果。
