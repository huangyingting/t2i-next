id: relationship-caricature
description: 创作关于普通成年人关系的原创、超写实社论式社会夸张讽刺主题。揭示恋爱、婚姻、职场等级、友谊、共同家务劳动、家庭期待、地位、关注、功劳、照料或琐碎日常摩擦中可辨认的矛盾。
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 每位成年人的主导高饱和色必须覆盖其可见衣物面积的至少一半。黑、灰、米、白、棕和低饱和海军蓝只可用于小面积鞋履、饰边、滚边、金属件或一件次要配饰；不得作为西装、休闲西装外套、连衣裙、连身服、衬衫、长裤、半身裙、大衣、长袍、内衣套装或其他主要衣物的主色。中性色西装配鲜亮衬衫、领带、里衬或口袋巾不符合此规则。
      - 乳房、臀部、生殖器和腹股沟保持完全不透明遮盖，且不作解剖描述；通过完整着装轮廓及衣物变形表现胸、髋、臀或腹股沟比例。
      - 每人以明确身体部位接触目标，力的方向和连续受力链可见。
      - 每位成年人穿完整不透明服装，共同互动不涉及性。让搬运、清洁、等待、倾听、打断、声称、花费、委派、安慰或拒绝等普通动作，以物理方式揭示劳动、关注、责任、功劳、准入或情感付出的不平等。
      frames:
      - 主要衣物以鲜明高饱和色主导，中性色仅作小面积点缀。
    erotic:
      shared:
      - 单人自我关系，或配偶、稳定伴侣、约会对象、情人及平等亲密伙伴的互动；主动性、缺陷、策略和反应由行为体现，关系不局限于嫉妒、恋爱、性别冲突或争夺。
      - 亲密身体接触和性姿势可直接传递力，因此身体本身可以是主要隐喻机构。此时不得添加无关象征物，去解释身体布局已经表现出的内容。
      - 裸露身体仍须通过头发、妆容、鞋履、每位成年人限一件醒目首饰，或一件连贯的半脱或移位衣物进行有意识的视觉造型。衣服、头发和配饰绝不能遮住脸、手、定义性接触、肢体连接、支撑点或锁定短语。它们不得有标志或文字，除非被选为锁定短语的自然载体而承载该短语。
      - 所有仍可见的衣物或配饰必须使用同一有意设计的鲜明配色，而非默认黑、灰或米色造型。具名衣物颜色须与其声明的主导色匹配；不得先写中性衣物再宣称它的大部分颜色鲜亮。
      - 乳房和臀部可作为成年人感官轮廓的一部分，明显放大、缩小、变宽、紧凑、拉长或显著突出，但生殖器保持非露骨且不是夸张焦点，不得进行露骨生殖器改变。
      - 当前非露骨自我触碰或相互接触，以及各人的施力部位、目标和支撑清晰。
      - 环境具有私密亲密场景的面貌。
      - 使用明确属于成年人的非露骨感官接触、有意暴露或遮掩、相互接近、凝视、触碰、支撑、靠近、退开或身体朝向，作为主动隐喻机构。感官布局必须揭示谁寻求关注、谁不予关注、谁表演吸引力、谁承担体力或情感付出，或表面竞争是否转变为联盟。不得显示露骨性行为或色情解剖接触。单人时必须有有意的感官自我接触，其努力或展示承载讽刺；多人时必须有涵盖所有人的相互感官接触。仅华丽服装、被动裸体、普通拥抱或浪漫氛围不能替代主动接触。
      - 人物相互回应、支撑明确，口鼻与呼吸通路不受遮挡。
      frames:
      - 亲密动作与关系隐喻不可分离，具体努力、关注和反应承载讽刺。
    hardcore:
      shared:
      - 单人自我关系，或配偶、稳定伴侣、约会对象、情人及平等亲密伙伴的互动；主动性、缺陷、策略和反应由行为体现，关系不局限于嫉妒、恋爱、性别冲突或争夺。
      - 亲密身体接触和性姿势可直接传递力，因此身体本身可以是主要隐喻机构。此时不得添加无关象征物，去解释身体布局已经表现出的内容。
      - 裸露身体仍须通过头发、妆容、鞋履、每位成年人限一件醒目首饰，或一件连贯的半脱或移位衣物进行有意识的视觉造型。衣服、头发和配饰绝不能遮住脸、手、定义性接触、肢体连接、支撑点或锁定短语。它们不得有标志或文字，除非被选为锁定短语的自然载体而承载该短语。
      - 所有仍可见的衣物或配饰必须使用同一有意设计的鲜明配色，而非默认黑、灰或米色造型。具名衣物颜色须与其声明的主导色匹配；不得先写中性衣物再宣称它的大部分颜色鲜亮。
      - 乳房、臀部与已有外生殖器的比例变化直接服务当前行为和关系隐喻，部位始终与主人连续相连。不改变孕肚或呈现怀孕笑料，身体不呈受伤、患病、残缺、肿胀、儿童化、非人或怪诞形态。
      - 当前定义性接触、各人的施力部位、目标、力的方向和支撑清晰。
      - 为每位成年人绘明定义当前行为的生殖器、口部或手部性接触，以及使几何关系安全可读所需的任何手、脚、肢体或支撑接触。只含手、脚、摆姿、支撑或近旁身体位置的
        接触图无效。
      - 环境具有私密亲密场景的面貌。
      - 清晰可见的性互动已经发生，参与部位、每人的主动角色和有支撑的精确接触几何明确，不以准备、暗示或事后状态替代。单人行为可呈现自我表演、完美主义、生产力压力、消费或吸引力焦虑；多人均在同一行为中主动给予、接受、支撑、引导接触或改变方向。
      - 位置、朝向、节奏、重量支撑、伸达、主动性、关注、可见努力、控制、互惠和愉悦分配承载社会隐喻。上下布局通过当前动作和反应显现不平等劳动或表演式支配，不仅靠上下、站坐跪或给予接受等位置本身赋予含义。
      - 人物相互回应、支撑明确，口鼻与呼吸通路不受遮挡。
      - 已有阴茎、睾丸、外阴或外生殖器区域可放大至至多正常尺寸的 1.5 倍、缩小至至少正常尺寸的 0.7 倍，或在这些限度内拉长、缩短、加宽、收窄、增粗或纤细化。
      frames:
      - 定义当前行为的接触与无遮挡空间关系直接可见，不以附近跪姿、拥抱、暗示姿势、即将接触、隐藏部位或单纯支撑手势替代。
  themes:
    common:
    - 扭曲面孔、表情、手势和身体比例，放大参与者通过行为表现的缺陷、防御、欲望或情绪反应。结果必须初看好笑、细想真实得令人不适。讽刺行为和关系模式，绝不讽刺性别、国籍、族裔、年龄、残障、体型或身份本身。
    - 每幅图像使用一个干净极简的社论式舞台或一个干净、可辨认的真实环境，一次主导互动，以及少量准确英文文案来说明核心对立。不得搭建杂乱的自然主义房间或散放许多象征道具。
    - 严格采用请求的成年女性数量和成年男性数量。不得推断、默认、硬编码、添加、遗漏、合并、克隆或替换人物。不得添加儿童、旁观者、助手、人群、肖像、倒影、屏幕人物、雕像、人体模型、影子人或类似另一个人的脱离身体碎片。
    - 中国人物与中国场景保持指定国籍设定，女性、男性和总人数准确且无额外人物。每人具有成熟外貌、独特面容、年龄、体格、发型、身体遮盖、社会角色、当前动作、夸张和反应；单一性别配置不暗示另一性别人物。
    - 突出展示每位请求人物的完整全身。每人恰有一个头部、一段连续躯干、两条连接的手臂、两只手、两条连接的腿和两只脚。尽管刻意改变夸张尺度，仍须保持肢体可追踪、归属明确、接触可达且支撑在物理上协调。
    - 夸张可以违背正常尺度，但绝不能违背人体拓扑或场景力学。将每个身体、物体、支撑、衣物、阴影和接触视为同一可作物理解释的瞬间的一部分。
    - '- 每位成年人保留恰好一个头部、一段连续躯干、两条肩—肘—腕—手链和两条髋—膝—踝—脚链。'
    - '- 所有关节保持连接，弯曲方向清晰可辨，手指属于正确的手，每条肢体都能追溯至其主人。'
    - '- 防止身体、肢体、衣物和实体物品互相穿过、融合或占据同一体积。'
    - '- 每个身体具有合理重心，经脚、膝、手、稳定物体或同伴通向地板或其他稳定表面的支撑路径连续。'
    - '- 每次倚靠、举起、跪下、斜躺、悬吊或抬起肢体，都须有可见配重和足以承受所示重量的支撑。'
    - '- 接触面在正确一侧相接，并显示符合受力的压缩、张力、抓握、位移或接触阴影。'
    - '- 每件物体的倾斜、弯曲、拉伸、压缩和运动方向都应由所述推力、拉力、载荷或扭矩引起；反作用力必须影响施力身体。'
    - '- 重力、头发方向、松散布料、阴影和任何移位衣物，须与同一身体朝向及地板或支撑平面一致。'
    - '- 除非所选概念明确提供可见悬吊或支撑机构，否则不得让人物或物品漂浮。'
    - '- 仅当肢体归属和完整人体结构仍毫无歧义时才使用遮挡；不得将手臂、手、腿或脚隐藏到看似缺失。'
    - 人体从头部到双手双脚连续可追踪，每个载荷从施加点经支撑到地板或稳定表面的路径完整。
    - 选择与实际请求阵容相容的关系前提。以下是优先方向，而非固定情节：
    - '- 一位成年人：家务劳动、自我形象、社会表演、消费、完美主义、拖延或独自承担一切；'
    - '- 两位成年人：伴侣、约会对象、亲属、朋友、室友、邻居、同事或上下级，在照料、劳动、功劳、关注、倾听、能力、地位或情感计较中存在不平等；'
    - '- 三位成年人：人为竞争、三角关系、联盟、不平等功劳、调停、把关、转移责任或地位认可；'
    - '- 单一性别群体：合适的友谊、家庭、家务、同伴、职场、地位、照料或功劳关系动态；以及'
    - '- 较大混合群体：一个连贯的关系网络，具有单一可读的劳动、关注、准入、责任或功劳分配。'
    - 人物关系和情境保持主题设定，衣着与接触符合所选级别的视觉状态。
    - 每个主题由一个不可分割的视觉等式构成：
    - 一种普通关系摩擦 + 一种不对等欲望或虚假表演 + 一次共同身体较量 + 一个由物体或身体布局构成的主导隐喻机构 + 一对对立英文短语 = 一个立即可读的社会真相
    - 矛盾无需解释即可见，且须具体对应所选行为。不得仅换道具而重复同一情节。
    - 不对等欲望促成身体动作，使共享物品或身体布局产生机械变化，继而引出其他人的具体夸张反应。每个人物、共享物和动作都是笑话不可替代的部分。
    - 每位请求的成年人都须参与一个闭合的动作与反应回路。优先采用一组强烈动词对立，例如拉/抵抗、给予/索取、推/阻挡、说/听、声称/承担、膨胀/泄气、展示/隐藏、委派/完成、靠近/退开或指责/辩护。
    - 在最能揭示矛盾的一瞬间展示动作。写明：
    - '- 发起者正在做什么；'
    - '- 涉及哪只手、哪只脚、躯干部位或视线；'
    - '- 力的方向；'
    - '- 另一参与者如何回应；'
    - '- 所选物体或身体姿态系统如何可见地弯曲、拉伸、倾斜、压缩、膨胀、泄气、滑动、转移重量或改变状态；以及'
    - '- 该变化如何将压力或后果返回发起者。'
    - 每位参与者都必须触碰、拉、推、支撑、承载、阻挡同一互动或改变其方向。仅有视线、面部反应、退缩、观察或象征性存在不足够：每位成年人必须以手、脚或有支撑的躯干直接接触所选隐喻物，或接触通过身体姿态系统传递力的另一参与者。不要把脱节旁观者称为“不可或缺”。不得让互不相连的人站在各自独立符号旁。表情必须对应当前作用力，不得像泛化微笑、惊讶或愤怒。
    - 为每位成年人赋予一组连贯的面部夸张，结合两到三项明显改变的特征。合适改变包括：
    - '- 双眼放大到至多正常尺寸的 1.4 倍，或眯窄到正常睁开幅度的 0.7 倍，并有一个确切视线目标；'
    - '- 不对称上挑、急剧下压或钩状眉毛；'
    - '- 整张嘴加宽至正常宽度的 1.5 倍、压缩至正常宽度的 0.7 倍，呈扩音器形、直线形、三角呐喊形、得意月牙形或心虚 O 形，嘴唇协调地增厚或变薄；'
    - '- 当讽刺对象是倾听、监视、闲话或选择性关注时，双耳放大到正常尺寸的 1.5 倍或缩小到 0.75 倍；'
    - '- 脸颊膨胀至正常体积的 1.5 倍、连贯地凹陷，或因可见肌肉用力而绷紧；'
    - '- 整个下颌加宽至正常宽度的 1.5 倍、收窄至 0.75 倍、拉长或缩短，同时保持连接于同一张脸；'
    - '- 整个鼻子在正常尺度的 0.75 到 1.5 倍之间拉长、缩短、加宽或压缩，鼻孔明显张开或挤紧；以及'
    - '- 强化反应的头发体积或方向。'
    - 情绪反差必须明确。有效搭配包括得意与暴怒、表演式欢快与疲惫、轻蔑与受伤、胜利与受困、自大与不信服，或操纵与新结盟。
    - 写明改变的特征、发生尺寸变化时的数值尺度，以及它们与动作的关系。不得只写“夸张表情”。保留一张连贯面孔，恰有两只眼睛、两只耳朵、一个鼻子、一张嘴和一个连续连接的下颌。不得独立放大孤立眼球或嘴唇、增加面部器官、分离五官、融化皮肤、创造面具，或让成年人看起来像儿童。
    - 考虑身体变形前，先让每位成年人在视觉上鲜明强化。头发、服装或身体遮盖造型、色彩、材质和表情都必须强化其角色和当前反应。避免普通写实、低调目录式造型、可互换灰西装、所有人都穿普通 T 恤和不鲜明的面孔。
    - 为每位成年人提供：
    - '- 一种独特夸张发型轮廓，例如刀锋般锐利的几何短发、高耸马尾弧线、雕塑般波浪发团、扇形辫、严厉后梳发冠、弹性卷发光环或风吹出的不对称造型；'
    - '- 一种适合共同配色的主导高饱和色和一种对比点缀色，中性色仅作辅助而非整体造型；'
    - '- 一种明确可辨的服装或身体遮盖轮廓，采用鲜明剪裁、放大衣领、不对称垂坠、大胆色块、非字母图形、结构化褶皱或位置有物理解释的移位衣物；'
    - '- 一种明确材质，例如漆面皮革、挺括棉布、亮面缎子、粗针织、覆盖不透明遮挡层的半透明欧根纱、金属感织物、哑光羊毛或罗纹功能面料；以及'
    - '- 一组在缩略图尺寸下可读的戏剧化面部夸张，其视线目标和肌肉张力与受力链相关。'
    - 头发可为鲜明黑色、银色、铜色、酒红、电蓝、紫罗兰色或其他与场景协调的颜色。适当时可在眼、眉、脸颊或嘴唇周围使用一处大胆图形化妆点缀，但必须保有摄影感，不能像脸部彩绘或额外面部器官。发型可通过造型、方向和颜色夸张，而不构成未声明的身体尺度改变；若发量按数值放大，须在身体图中声明该变化。
    - 为每位成年人赋予一项或多项协调的非面部比例改变，以揭示其在关系中的角色。当形状主动承载讽刺时，几乎所有已有身体区域均可放大、缩小、拉长、缩短、加宽、收窄、增粗或纤细化。从以下类别选择一项，或组合相容改变：
    - '- 整体轮廓：完整身体拉伸到正常高度的 1.5 倍、压缩到正常高度的 0.6 倍、加宽到正常宽度的 1.5 倍，或收窄到正常宽度的 0.65 倍；'
    - '- 头部和头发：完整头部与头发放大到正常尺寸的 1.5 倍、缩小到 0.75 倍，或头发体积扩展到正常体积的 2 或 3 倍；'
    - '- 颈和肩：颈部拉长至正常长度的 1.5 或 2 倍、缩短至 0.6 倍，肩宽扩至正常宽度的 1.5 或 2 倍，或收窄至 0.7 倍；'
    - '- 手臂和手：一条或两条完整连接的手臂拉长至正常长度的 2 或 3 倍、缩短至 0.6 倍、增粗至正常围度的 1.5 或 2 倍、纤细至正常围度的 0.6 倍，或两只连接的手放大到正常尺寸的
      2 或 3 倍，或缩小到 0.65 倍；'
    - '- 躯干和姿态：上躯干、胸廓、腹部、腰部或完整躯干加宽至正常宽度的 1.5 或 2 倍、压缩或收窄至 0.5 或 0.65 倍、拉长至正常长度的 1.5 倍，或缩短至 0.7 倍；'
    - '- 胸部、髋部和臀部：完整胸部平面、成对乳房、髋宽或成对臀部放大至正常体积的 1.5 或 2 倍、缩小至 0.65 倍、按同样尺度加宽或收窄，或重塑为一种连贯的宽阔、紧凑、修长或明显前突轮廓；'
    - '- 腿和脚：一条或两条完整连接的腿或大腿拉长至正常长度的 1.5 或 2 倍、缩短至 0.65 倍、增粗至正常围度的 1.5 或 2 倍、纤细至正常围度的 0.6 倍，或两只连接的脚放大到正常尺寸的
      1.5 或 2 倍，或缩小到 0.7 倍；'
    - '- 服装轮廓：围绕除此之外完整的身体，将一个连贯衣物区域膨胀、加宽、收窄、拉长、缩短、硬挺化或压缩到相关正常尺寸的 1.5、2 或 3 倍。'
    - 叠加改变可采用拉长已有手臂并放大相连手、宽肩配窄腰、放大髋部配粗大腿。仅改变已有部位，头、躯干、乳房、臀部、生殖器、手臂、手、腿、脚、关节和手指不增减、重复、分离、融合或替换。肩—肘—腕—手与髋—膝—踝—脚链连续，双腿双脚可见并有支撑；重量由支撑物或同伴承载时双脚无需承重。没有断裂关节、融化人体、身体恐怖或仅靠镜头透视的变化。
    - 每人的改变部位和数值尺度固定；未改变部位保持正常尺度，成对解剖完整，改变区域与所属身体连续连接，协调叠加不扩散为额外变化。
    - 所有人持续参与当前接触，在同一互动中传递、抵抗或改变力的方向。定义性接触与支撑可同时存在，近旁摆姿、指向、展示、观看、退缩、庆祝或举臂不替代实际接触。
    - 从两种背景模式中选择一种：
    - '- 搭建的社论式舞台，使用高饱和色域、平滑双色渐变、克制的图形色块或浅层雕塑几何；或'
    - '- 与关系摩擦直接相关的干净、稀疏、可辨认环境，例如整洁公寓厨房、有序洗衣角、极简用餐角、干净玄关、精简办公或会议区、空电梯厅、简单咖啡馆卡座、稀疏更衣区、私人卧室、克制的酒店房间或极简工作室阁楼。'
    - 每个背景都必须包含：
    - '- 一种主导颜色及建筑或表面系统；'
    - '- 浅或适中的受控纵深及清晰视线；'
    - '- 一个大型内置环境锚点和至多两个克制地点线索，或一个连贯的抽象舞台几何系统；'
    - '- 恰好一个全体人物共享的主要隐喻机构，由一个物品或人物自身的身体姿态与受力系统构成；以及'
    - '- 同一情境中至多一件小型辅助物品。'
    - 未被触碰的内置建筑属于背景，不是道具。如果柜台、门、床、椅子、桌子或其他环境元素支撑身体、承受力、承载文案或改变状态，则将其计作主要机构或唯一辅助物品。
    - 当物品承载主要隐喻时，它约占画布百分之 25 到 45，并在力学上参与动作。合适物品类别包括一份文件、绳子、秤、椅子、沙发、桌子、门、气球、电话、牙膏盖、闹钟、纸堆、伞、传送带、奖杯、镜子，或其他特定于所选矛盾的普通物品。当人物身体布局承载主要隐喻时，不使用独立象征物；可用床、沙发、椅子或平台等一个简单支撑建立安全接触，但它不得作为第二个隐喻争夺注意。
    - 只用识别地点所需的最少环境细节，例如一段连续柜台、一个关闭的橱柜平面、一张床及床头板、一条干净会议桌边、一个电梯门平面或一张咖啡馆长椅。不得有开放搁架、散落家用品、植物、墙上艺术、可见屏幕、附带家具、餐桌布置、零散洗漱品、文件堆、远处建筑、碎屑、装饰标牌、人群、反射人物或多个相互竞争的隐喻。仅允许一扇窗作为宽广光源，不得有可辨认城市细节、标牌或人形。中心互动周围保留至少百分之
      20 的干净负空间。
    - 环境必须与人物采用同一美术方向：在墙、地板、软包、橱柜、瓷砖或建筑平面中重复一到两种配色；匹配光线方向和接触阴影；并使一种材质呼应主要机构。绝不能把鲜亮造型人物粘进无关的图库照片房间。
    - 除两个锁定英文短语外，每个可见表面都不得有文字。支持配色且不会被误认作字母时，允许非字形的几何色块、条纹、格纹、圆点和材质纹理。不得用示意图、公式、手写字、图表、图标、界面标记、伪小字或装饰字母装饰纸张、书籍、报告、板、屏幕、服装、墙或道具。
    - 若所选物品通常含信息，包括日程表、报告、图表、写字夹板、电话、书、控制面板、日历、表格或包装，则除两个锁定短语外，其整个表面都呈空白。不得提及密集排版、文案行、列表条目、数据、控件、页面内容或图像模型可能视为额外文字的标记。
    - 报告、纸页、屏幕和包装除两个指定短语外均为空白，没有标题、题头、标签、章节、品牌或界面内容。
    - 丰富度必须来自造型、色彩、几何、材质、光、影和互动形状，而非额外物品或背景陈设。每个主题从以下每一维度选择一个强烈选项，并让它们构成统一美术方向：
    - '- 场景和几何：无缝弧形背景、浅阶梯平台、单拱、分色地板平面、斜面、半透明板、放射状地面镶嵌、干净厨房柜台与橱柜平面、仅有一张床及床头板的稀疏卧室、极简会议区、有序洗衣墙、空电梯厅、简单咖啡馆卡座、干净玄关或克制的酒店房间角落；'
    - '- 构图：平衡对峙、斜向受力链、三角张力、垂直堆叠、环形纠缠、压缩侧边群组、镜像不对称或刻意偏心失衡；'
    - '- 配色：钴蓝配橘色、洋红配蓝绿、酸黄配紫罗兰、珊瑚配群青、猩红配青色、祖母绿配亮粉，或另一种鲜明互补或分裂互补色系统；'
    - '- 灯光：硬质戏剧侧光、清晰顶部光池、互补色分区光、发亮背缘加正面补光、锐利图案阴影、低角度掠射光或干净高调商业光；'
    - '- 材质对比：哑光配漆面、缎面配原木、针织配金属、半透明亚克力配不透明布料、抛光铬配橡胶，或属于动作的另一对触感材质；以及'
    - '- 动势重点：定向掠过的头发、衣物张开、拉伸布料、压缩软包、绷紧绳子或肢体线、移位阴影、倾斜支撑，或受力链造成的可见物体变形；以及'
    - '- 情绪表演：糖衣敌意、脆弱优雅、夸张疲惫、得意炫示、笨拙温柔、共谋联盟、戏剧化牺牲姿态或克制惊慌。'
    - 使用有纪律的色彩层级：约百分之 60 为主导色域、百分之 30 为对比人物与机构、百分之 10 为高能点缀。相邻成年人衣服或造型色彩须明显不同，但仍属于同一配色。在有色光下保持肤色自然且可读。
    - 各主题的场景几何、构图、配色、布光、材质对、动势、发型和情绪表演丰富多样，干净真实环境与抽象社论舞台形成变化。缩略图中人体剪影与动作最突出，其次是隐喻机构，再是两个融入场景的短语，最后是表面细节。
    - 每个主题必须构思恰好两个简短对立英文短语，澄清图像中已经可见的行为。短语不是对不可见笑话的解释；它们标示当前互动中的两股力、主张、借口或真相。
    - 每个短语必须：
    - '- 简短、低密度，形成一眼可读的文案；'
    - '- 仅使用大写 ASCII 字母 A 到 Z、空格、撇号、问号或感叹号；'
    - '- 拼写正确、语法合规、具体且立即可读；'
    - '- 与另一个短语有实质区别；以及'
    - '- 避免姓名、品牌、话题标签、数字、缩写、小字，以及单独使用 GOOD、BAD、YES 或 NO 等泛化词。'
    - 将两个短语融入同一场景内载体的两个可读区域，该载体须已自然属于动作和环境。物品承载主要隐喻时，两个短语放在同一物品的两个区域；身体承载主要隐喻时，两个短语放在一个现有支撑物、地板或建筑表面的两个区域。优先采用盖印、绘制、雕刻、压纹、编织、缝合、印刷或投影到该载体上的文字。“同一载体”指同一个实体物品和材质基底：披在家具上的布、贴在墙上的纸或接触支撑物的衣物仍是独立载体，因而无效。不得仅为容纳文字而引入第二个载体或独立道具。不得使用悬浮社论说明块、对话气泡、字幕、界面叠层、脱离标语牌、漂浮纸张、无支撑标牌或悬空文字。
    - 文字必须继承载体的透视、曲率、褶皱、表面纹理、材质响应、光照方向、阴影和磨损程度，同时保持完全可读。字体处理和颜色必须属于场景配色，不能像事后粘贴。两个短语都保持在图像中央百分之 80 内，远离脸、手、身体轮廓且互相分开。使用大型粗体水平文字，材质对比须足以立即辨读。每个短语与其确切载体区域之间都须有强烈局部明暗或互补色相对比。绝不在白色或浅色区域放白色或浅色文字，在深色区域放深色文字，或将明度相近的颜色叠在一起。
    - 同一主题保持两个英文短语的准确文案、标点及对应载体区域一致。
    - 核心动作、接触几何、隐喻机构、表情、文案和社会矛盾必须构成同一视觉笑话。绝不能先创造普通关系讽刺，再追加裸体或性，也不能在象征道具旁安排无关情色场面；移除当前互动必须破坏视觉笑话。
    - 变换基于亲密关系的隐喻，而非默认采用上/下位置：
    - '- 谁安全支撑他人重量，可揭示隐形照料或不平等体力劳动；'
    - '- 谁伸手、转向或转身避开，可揭示追求、回避或不平等的联结尝试；'
    - '- 谁设定或适应节奏，可揭示沟通、不耐烦或单方面决策；'
    - '- 谁受到关注而另一人付出努力，可揭示单向互惠或表演式慷慨；'
    - '- 谁占据视觉中心而另一人构建支撑结构，可揭示对功劳、可见度或地位的攫取；'
    - '- 同步与不协调动作，可揭示倾听、协商、情感投入或计较得失；'
    - '- 请求的三人或以上阵容可揭示垄断关注、人为竞争、联盟、互助，或群体拒绝某位参与者的地位表演，但无人可成为旁观者；以及'
    - '- 单个成年人的姿态、自我触碰、无镜自我展示或重复努力，可揭示自我监视、完美主义、孤独、消费或展现吸引力的压力。'
    - 选择其中一个因果维度，或构思同样具体的替代项。不得组合多个信息，也不得跨主题重复同一种基于姿势的笑话。
    - 当前衣着、动作、每人的主动角色和有支撑的接触几何直接呈现关系对立，不用级别标签替代动作。
    - 每人具有夸张发型、衣装或遮盖轮廓、覆盖主要衣物的鲜明主色、对比点缀、明确材质和面部夸张。相邻人物造型不同，但与场景几何、构图、配色、照明、材质对比、动势和情绪协调。
    - 两个英文短语以高对比颜色和匹配材质的工艺，置于同一个有支撑自然载体的两个不同区域。没有第三段文案、文件标题、物品标签或伪文字。
    - 每个主题定义一个完整的夸张讽刺系统：
    - '- 请求的确切阵容及每位成年人的关系角色；'
    - '- 一种普通摩擦和一个令人不适的社会真相；'
    - '- 一个发起动作和一个闭合群体反应回路；'
    - '- 一个共享主要隐喻机构，采用一个物品或一个身体姿态系统，以及至多一个辅助物品；'
    - '- 每位成年人一组面部夸张；'
    - '- 每位成年人的全部数值化身体比例改变；'
    - '- 每位成年人的一个夸张发型、鲜明造型轮廓、主导色、对比点缀及材质特征；'
    - '- 一个干净、经过视觉设计且无杂乱的舞台或真实环境；'
    - '- 一对锁定简短英文短语，融入与场景相容的场景内载体；'
    - '- 以物理方式承载讽刺的可见衣着、动作及接触几何；'
    - '- 一种受控的全身镜头关系；以及'
    - '- 一套选定的场景几何、构图、配色、照明系统、材质对比和动势重点。'
    - 场景几何、构图、镜头、裁切、60/30/10 配色、灯光、材质对比、动势、摄影真实感和夸张讽刺质感构成统一设计；完整阵容、关系、动作、隐喻、比例改变与文案相互一致。
    - 各主题的关系类型、不对等欲望、互动动作、隐喻机构、面部反差、身体变形、文案对、发型、衣装轮廓、场景几何、配色、灯光、材质对比、动势、镜头与构图显著不同，不只更换道具重复同一家庭争吵。
  frames:
    common:
    - 扭曲面孔、表情、手势和身体比例，放大参与者通过行为表现的缺陷、防御、欲望或情绪反应。结果必须初看好笑、细想真实得令人不适。讽刺行为和关系模式，绝不讽刺性别、国籍、族裔、年龄、残障、体型或身份本身。
    - 每幅图像使用一个干净极简的社论式舞台或一个干净、可辨认的真实环境，一次主导互动，以及少量准确英文文案来说明核心对立。不得搭建杂乱的自然主义房间或散放许多象征道具。
