      - '接触映射的英文输出模板：“Contact map: force chain - [EACH ADULT''S BODY PART, TARGET, AND FORCE].”'
      - 每位成年人穿完整不透明服装，共同互动不涉及性。让搬运、清洁、等待、倾听、打断、声称、花费、委派、安慰或拒绝等普通动作，以物理方式揭示劳动、关注、责任、功劳、准入或情感付出的不平等。
      frames:
      - 拒绝服装以中性色为主的结果。
