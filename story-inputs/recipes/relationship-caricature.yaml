    - 除两个锁定英文短语外，每个可见表面都不得有文字。支持配色且不会被误认作字母时，允许非字形的几何色块、条纹、格纹、圆点和材质纹理。不得用示意图、公式、手写字、图表、图标、界面标记、伪小字或装饰字母装饰纸张、书籍、报告、板、屏幕、服装、墙或道具。
