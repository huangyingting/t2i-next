      - 乳房和臀部可作为成年人感官轮廓的一部分，明显放大、缩小、变宽、紧凑、拉长或显著突出，但生殖器保持非露骨且不是夸张焦点，不得进行露骨生殖器改变。
      - '接触映射的英文输出模板：“Contact map: sensual contact - [CURRENT NON-EXPLICIT SELF-CONTACT OR RECIPROCAL
        CONTACT]; force and support - [EACH ADULT''S BODY PART, TARGET, AND FORCE].”'
