    - 两个英文短语是唯一图中文字，准确、完整、大型、水平、无遮挡且清楚可读；没有汉字、拼音、双语文字、乱码、随机字母、数字、标志、小字或水印。
    - 主题与画面之间，不得翻译、转述、改变标点、改为复数或重设锁定文案样式。不得在文件、电话、时钟、服装、墙、标牌或道具上添加其他文字。
    - 核心动作、接触几何、隐喻机构、表情、文案和社会矛盾必须构成同一视觉笑话。绝不能先创造普通关系讽刺，再追加裸体或性，也不能在象征道具旁安排无关情色场面；移除当前互动必须破坏视觉笑话。
    - 变换基于亲密关系的隐喻，而非默认采用上/下位置：
