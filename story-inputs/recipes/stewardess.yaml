id: stewardess
policy: standard-story
description: '创作多样化、精致、超写实的成人空乘主题，以可信的民用航空环境为基础。在不同主题中，描绘与自动选择的不同国家和地区真实航空公司相关的原创成人客舱机组身份。每个主题都必须使用一家真实运营的航空公司；不得创造、改名、合并、戏仿或暗示虚构航空公司。


  以下所有列表均为灵感，而非菜单、枚举、预设库、固定序列或按 ID 分配的方案。可以组合相容的示例、加以变换或创作等效方案。只有使用“必须”（"must,"）、“每个”（"every,"）、“精确”（"exact,"）或“不得”（"do
  not"）的陈述才是强制要求。


  严格使用所要求的人物阵容，不得增加其他人。每个人都必须是明确成熟、年满 25 岁的成年人，具有原创面孔、清醒表情、稳定身份，以及清楚定义的客舱机组或相容私人旅行角色。整个主题中保持每个人的面孔、年龄、头发、体型、制服锚点、徽章逻辑和配饰一致。


  不得描绘名人、公众人物、未成年人、外貌年轻的虚构角色、真实航空公司雇员或可识别人物，也不得使角色与其相似。不得增加乘客、飞行员、地勤、人群、人形剪影、肖像、屏幕人物、人体模型或人的倒影。保持描绘的飞机区域封闭，且仅供精确要求的阵容私下使用。


  不得将强制劳动、客户服务、雇佣等级、纪律处分、考评、经济压力、移民身份或无法离开飞机的处境情色化。不得使用乘客利用工作人员、上级胁迫资浅机组、隐藏摄像机、公众暴露、醉酒或药物影响、睡眠、惊恐、颠簸危险、紧急情况中的脆弱状态、束缚或堵塞出口。


  仅当有助于图像时才使用自然语言的文化或地理描述。不得将旗帜置于私密人体部位。不得将神圣、仪式、原住民、军事或宗教服饰转为恋物服装。不得使用夸张口音、顺从国籍刻板印象、种族等级、肤色等级、异国情调化语言，或声称某个民族群体具有固定性格或体型。


  服务推车静止时必须锁定或明显制动。热液体、玻璃器皿、锋利餐具、松散行李和未固定设备必须位于身体路径之外。保持过道、出口、舱口和应急设备畅通。不得呈现飞行中不安全姿态、敞开舱门、松散重物或无视颠簸约束的情景。'
authoring:
  content_levels:
    aesthetic:
    - 在 aesthetic（美学）级别，每个人都必须完整且专业地穿着协调的客舱机组制服。聚焦从容的服务技艺、安全演示、机组协作、飞机建筑结构、目的地氛围和编辑肖像。图像必须呈现为高端航空摄影，而非将雇佣关系情色化。
    erotic:
    - 在 erotic（情色）级别，可在明确私密、下班、编辑大片、幻想或封闭片场背景中，使用部分或完整的成人艺术裸体、感官身体展示、亲密眼神接触或近距离自愿互动。保留足够的航空专属制服锚点和设备，使空乘概念明确无误：例如颈巾、符合航空公司的翼形胸针、圆筒帽、敞开穿着或搭放附近的剪裁外套、无可读身份的低突起名牌、服务手套、长袜、客舱鞋、机组腕表或固定服务推车。飞机内一个泛化的裸体人物并不满足本创作要求。
    - 在 erotic（情色）或 hardcore（硬核色情）级别，明确每位成年人都已下班，或在停放的训练客舱、私人包机布景、地面飞机摄影棚、机组休息室或其他受控私密环境中，参与自愿的封闭片场编辑幻想。制服单品用于视觉身份，而非权威或胁迫。每位参与者都必须清醒、主动自愿、相互回应并能够停止。
    - 在 erotic（情色）或 hardcore（硬核色情）级别，制服造型可包括敞开剪裁外套、松开但已固定的丝巾、解扣女衬衫、搭放附近的裙子或连衣裙、长袜、作为编辑服装造型的吊袜带，以及在部分或完整裸体时保留的帽子、手套、鞋或首饰。脱下的单品应整齐折叠、搭在固定折叠座椅上，或固定在打开的衣橱储物格内；不得将衣物散落在过道或出口。
    hardcore:
    - 保留明确的航空专属制服锚点、设备和周边环境。场景应为下班后，或位于停放、地面或摄影棚飞机环境内的自愿封闭片场，参与者自主意愿清晰，且不妨碍出口或安全设备。
    - 在 erotic（情色）或 hardcore（硬核色情）级别，明确每位成年人都已下班，或在停放的训练客舱、私人包机布景、地面飞机摄影棚、机组休息室或其他受控私密环境中，参与自愿的封闭片场编辑幻想。制服单品用于视觉身份，而非权威或胁迫。每位参与者都必须清醒、主动自愿、相互回应并能够停止。
    - 在 erotic（情色）或 hardcore（硬核色情）级别，制服造型可包括敞开剪裁外套、松开但已固定的丝巾、解扣女衬衫、搭放附近的裙子或连衣裙、长袜、作为编辑服装造型的吊袜带，以及在部分或完整裸体时保留的帽子、手套、鞋或首饰。脱下的单品应整齐折叠、搭在固定折叠座椅上，或固定在打开的衣橱储物格内；不得将衣物散落在过道或出口。
  themes:
    common:
    - 每个主题都必须通过专业设计的制服、飞机内饰、服务设备、安全硬件、机组姿态和航空专属活动，与客舱机组生活建立明确联系。只改变面孔、国籍标签、旗帜颜色或装饰图案并不能构成新主题。
    - 不得按照主题 ID、画面 ID 或序号分配国家、地区、制服、活动、相机角度或强度。
    - 每个主题的情境设定都必须在视觉上明确体现所要求的内容级别、精确成人阵容、当前身体遮盖与制服状态、客舱机组活动或私人航空背景，以及关系动态。不得将这些决定推迟至画面阶段。每个主题的风格都必须通过相机距离、构图、光线、材质呈现和视觉重点来强化所要求级别。
    - 在所要求的主题之间，审慎变化国家或地区设计灵感。以气候、剪裁历史、纺织工艺、航空时代、建筑、配色、服务物件设计、航线氛围和当代时尚为区分依据，而非刻板漫画化。
    - 国家和地区灵感可包括：当代中国剪裁，配克制红色与暖象牙白点缀；日本精密极简主义，采用靛蓝、珍珠灰和折纸般接缝；韩国现代剪裁，配干净粉彩几何与精致配饰；泰国丝绸风格色彩和谐，转译为现代非仪式制服；新加坡热带现代配色，配蜡染启发的抽象纺织节奏；印度当代剪裁，配宝石色滚边与非仪式编织细节；阿联酋豪华航空极简主义，采用沙色、珍珠色、勃艮第红和雕塑帽型；土耳其几何织物点缀，采用深蓝绿和暖铜色；法国高级时装式克制，以海军蓝、奶油色与一个醒目丝巾点缀构成；意大利现代主义剪裁，采用浓咖啡色、象牙白和建筑线条；英国传统风格剪裁，以无军衔徽章的方式现代化；西班牙温暖现代主义，采用藏红花色、黑色和流畅丝巾运动；斯堪的纳维亚功能极简主义，采用冰蓝、炭灰和自然纹理；荷兰图形现代主义，采用钴蓝与克制橙色点缀；德国精密工装，转译成优雅客舱剪裁；瑞士干净几何，配红色点缀与拉丝金属配饰；希腊海岛配色，采用白色、爱琴海蓝与轻盈夏季剪裁；摩洛哥当代织物几何，不使用仪式服装；肯尼亚现代设计，采用大地色和抽象串珠风格色块布局；南非当代剪裁，配大胆几何内衬；巴西现代主义色彩与流畅暖气候制服结构；墨西哥当代织物色彩，转译成克制航空图形；美国二十世纪中叶喷气时代剪裁，重新诠释为当代客舱服务装；加拿大实用优雅，采用冬季纹理并抽象运用枫叶红；澳大利亚海岸现代主义，采用桉树绿和沙色；新西兰功能性剪裁，配蕨叶般抽象接缝几何。
    - 为每个主题在内部自动选择一家真实且当前运营的客运航空公司。所选航空公司必须总部位于该主题选定国家或地区，或与之关联密切。优先选择资料充分、能有把握呈现其现用名称、所属地区、制服特征和客舱设计的航空公司。若不确定某公司是否真实或仍在运营，应选择另一家而非编造细节。
    - 在每个主题的情境设定中自然点明所选真实航空公司，并在每幅画面中完整重新确立该身份。整个主题中保持其身份一致。在视觉适宜处使用其当前可识别的制服轮廓、标志性配色、配饰逻辑、舱等、座椅材质、服务物件设计和品牌细节。不得将一家航空公司的制服与另一家的客舱、颜色、标志、航线身份或配饰混合。
    - 不得编造航空公司名称、变体拼写、替代标志、混合航空公司、虚构子公司、假航线图或想象的涂装。不得将图像呈现为官方广告、背书或真实员工的纪实记录。角色必须保持为原创虚构成年人，不得像可识别的航空公司工作人员。
    - 在所要求的主题之间，先选择不同真实航空公司，再重复某一家。主题还必须在国家或地区、制服轮廓、配色、材质、舱等、照明、航线氛围、活动和相机策略上具有实质区别，而不只是航空公司名称或丝巾颜色不同。
    - 真实航空公司示例：中国国际航空用于当代中国载旗航空公司剪裁与红色点缀；全日空用于日本精密感与蓝色客舱几何；日本航空用于日本红白克制风格与精致服务设计；大韩航空用于韩国天蓝标识与当代客舱造型；新加坡航空用于新加坡蜡染制服传统与温暖高端客舱；泰国国际航空用于泰国丝绸色彩与紫金客舱特征；印度航空用于印度当代图案与深红点缀；阿联酋航空用于阿联酋奶油色剪裁、红帽与高端宽体客舱；卡塔尔航空用于卡塔尔勃艮第红点缀与雕塑式长途内饰；土耳其航空用于土耳其红色标识与现代国际客舱；法国航空用于法国海军蓝剪裁与克制红色点缀；英国航空用于英国结构化剪裁与深蓝客舱特征；荷兰皇家航空用于荷兰蓝色制服与图形化当代内饰；汉莎航空用于德国海军蓝与黄色的精密感及功能客舱设计；瑞士国际航空用于瑞士红色点缀与干净几何剪裁；伊比利亚航空用于西班牙红黄暖意与现代客舱材质；意大利航空（ITA
      Airways）用于意大利蓝色剪裁与当代设计；爱琴海航空用于希腊蓝白克制风格与明亮地中海光线；摩洛哥皇家航空用于摩洛哥红绿点缀与当代织物细节；肯尼亚航空用于肯尼亚红色标识与温暖现代剪裁；南非航空用于南非色彩点缀与长途客舱设计；拉塔姆航空用于南美洋红与蓝色标识及现代宽体客舱；墨西哥航空用于墨西哥海军蓝剪裁与银色航空点缀；达美航空用于美国梅子红剪裁与当代客舱几何；加拿大航空用于加拿大黑红剪裁与冷色现代内饰；澳洲航空用于澳大利亚红色标识与精致长途造型；新西兰航空用于新西兰黑色剪裁与蕨叶启发的视觉标识。
    - 每个主题都必须定义：- 一种受某国家或地区启发的当代设计语言；- 一家从该国家或地区自动选出的真实运营航空公司；- 一处私人航空场景与当下实际进行的活动；- 一组精确成人阵容，具有稳定制服锚点；-
      一种符合内容级别的身体遮盖和互动状态；- 一套光源逻辑与配色；- 一条联系制服、客舱与服务设备的视觉规则；以及 - 一种情绪动态，例如沉着、伙伴情谊、俏皮自信、私密温柔、戏剧化魅力或安静威严。
    - 为每个主题赋予一个简洁原创标题。情境设定必须以不超过两句话描述精确成人阵容、当下航空情境、身体遮盖与制服逻辑、可见活动、关系和一个具体视觉张力。风格必须用一个完整流畅句子定义构图、镜头表现、光线、配色、客舱材质、制服呈现和最终质感。
    - 每套制服都必须明显为客舱服务而设计。使用相容组合，包括剪裁外套、女衬衫或针织内搭、及膝或中长裙、剪裁长裤、实用连衣裙、马甲、丝巾、帽子、袜装、平底或低跟稳固客舱鞋、服务手套、机组腕表、符合航空公司的胸针和贴身低突起名牌。
    - 制服必须允许伸手、弯腰、提举、过道移动和长时间穿着。采用固定好的丝巾、不易钩挂的闭合件、不透明职业面料、实用下摆、稳固鞋履和可闭合口袋。不得使用军衔、警徽、服务过程中危险的细高跟鞋、松散链条、拖曳布料、超大翼形饰物，或可能钩住客舱硬件的戏服部件。
    - 成人客舱机组呈现：姿态端正、剪裁形象一丝不苟的资深空乘；温暖自信的机组成员检查已固定的服务推车；两名成年空乘协调同步安全手势；成年乘务长置于厨房几何与协调客舱配色的框景中；下班成年机组肖像，外套搭在固定折叠座椅上；保留丝巾、帽子、手套和机组腕表的封闭片场编辑大片姿势；私人包机空乘布置受目的地启发的服务物件；成年机组同伴在空高端客舱中沉着对视；在停放飞机的关闭登机门旁自信独照；由重复座椅与过道几何组织的小组成年机组合影。
    - 航空场景：停放宽体飞机的头等舱，具有雕塑式隐私壳体；地面窄体训练客舱，安全硬件可见；私人包机内饰，采用克制的木材、皮革和拉丝金属；空的高端经济舱，头枕几何重复；飞机厨房，储物舱门扣紧且服务推车制动；机组休息室，铺位关闭、私人物品固定；受控航空摄影棚中的舱门训练模型；围绕真实客舱装置搭建的航空制服工作室；隔音玻璃外可见飞机的机场机组休息室；将停放的复古喷气时代客舱重建为精致摄影棚布景；安静蓝调时刻地面作业期间的长途商务客舱；充满漫射停机坪日光的明亮热带航线客舱。
    - 当前活动：做出精确的非紧急安全演示手势；摆拍客舱肖像前检查封闭储物舱；在稳定空客舱中展示精心设计的托盘；拍摄机组造型册前协调丝巾与外套细节；站在关闭的飞机舱门旁，一只手靠近预位面板；查看受航线启发的服务布置而无可读文件；在高端座椅壳体内摆放已固定的备品；在机组折叠座椅旁共享沉着的下班片刻；在摆拍通讯肖像中持内话话筒；以紧凑熟练姿态走过空过道；围绕作为建筑式中心的锁定服务推车摆姿；所有制服部件固定后，在私人机组休息室休息。
