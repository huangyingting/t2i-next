id: indoor-couple-pose-aesthetic
description: 创作美丽、精致、感性的室内伴侣摄影，以女性严格执行的指定姿态，以及男性与之互补的亲密位置为核心。
cast:
  female_count: 1
  male_count: 1
authoring:
  themes:
    common:
    - '阵容与关系：每幅图像恰好包含两名自愿互动的成年人和两具完整身体：一名年满 25 岁的中国女性与一名年满 25 岁的中国男性。每个主题前提和画面正文必须以下列原句开头：“Exactly two adults and two complete bodies occupy the entire image.”。随后为每名成年人写明数字年龄、性别和姓名。不得出现其他人物、身体、倒影、投影、人体模特、照片或人形背景形象。'
    - 严格保留所分配目录条目的姿态。不得遗漏、合并、改述成另一种姿态，或重复使用已分配姿态。
    - 主题标题应简洁写明姿态概念和室内场景。
  frames:
    common:
    - '阵容与关系：每幅图像恰好包含两名自愿互动的成年人和两具完整身体：一名年满 25 岁的中国女性与一名年满 25 岁的中国男性。每个主题前提和画面正文必须以下列原句开头：“Exactly two adults and two complete bodies occupy the entire image.”。随后为每名成年人写明数字年龄、性别和姓名。不得出现其他人物、身体、倒影、投影、人体模特、照片或人形背景形象。'
    - 阵容与关系：女性严格执行指定姿态。保留规定的身体朝向、脊柱形状、髋部高度、屈膝程度、腿部方向、脚的位置、手臂位置和支撑面。男性处于与她互补的亲密位置，可以在身旁、身后、上方、下方、近处跪立、近处站立或提供支撑。男性身体不得遮住女性定义姿态的关节、肢体、手、脚、腰部或轮廓。清楚描述男性的躯干、骨盆、双腿、双手、视线和支撑点。双方保持清醒、舒适、自愿，并通过目光交流、回触、共同握持、协调姿态或呼应表情展现彼此投入。
    - 风格与服装：创作美丽、精致、感性的室内摄影，而非临床记录。请求的内容级别控制裸露和亲密程度，但指定姿态始终是视觉优先项。分别描述每名成年人的体格、肤色、面部、发型、修饰或妆容、表情、服装状态、鞋履及一两件配饰。使用丝绸、缎面、雪纺、蕾丝、天鹅绒、细针织、抛光皮革、拉丝金属、半透明玻璃、亚麻或柔软棉布等优雅材料。衣物可按场景保持穿着、敞开、放松、披搭或放在附近可见位置。解剖、手脚和衣物边界保持连贯。
    - 室内环境：每幅图像均发生在室内。场景在精致卧室、精品酒店套房、阁楼、玻璃暖房、私人沙龙、艺术家工作室、图书室、音乐室、顶层休息厅、融合传统与现代的室内空间、更衣室、室内泳池、冬季花园、极简公寓和富有氛围的历史房间之间变化。描述地面、墙壁、天花板、窗或门、主要家具、织物，以及至少五件位置明确的道具。空间应具体且有生活气息，但不得杂乱遮挡人体。
    - 光线、镜头与美感：整批作品变化光线与视点。可用窗光、月光、阴天天光、漫射天窗光、烛光般的实景灯、柔和钨丝光、冷色建筑灯、泳池反射光、窗格投影、树叶投影或混合电影光源。写明光源位置、方向、柔硬、色温或色彩特征、衰减、高光和阴影表现。
    - 光线、镜头与美感：为每个场景选择优美的摄影或绘画感摄影风格，例如艺术编辑摄影、浪漫电影写实、明亮时装摄影、柔和明暗对照、当代私房摄影、古典构图、梦幻写实、优雅电影剧照、低饱和胶片色彩或精致高级时装极简主义。明确使用保留直线透视的 35-85 mm 镜头，并写明光圈、机位高度、拍摄侧向、取景、景深层次、焦点层级和色板。优先采用能够清楚展示指定姿态的中远景或全身构图。避免裁断肢体、鱼眼畸变、极端广角、混乱镜面、重复身体、畸形双手和融合的解剖结构。
    - 严格保留所分配目录条目的姿态。不得遗漏、合并、改述成另一种姿态，或重复使用已分配姿态。
    - 每幅画面正文是至少 450 个单词的自然英语段落。仅使用 U+0020 至 U+007E 范围的可打印 ASCII 字符。只返回肯定式可见描述，不得包含标题、标签、主题标识符、画面标识符、核对清单、备选方案、负面提示词或评论。返回前核验精确阵容、精确指定姿态、室内环境、完整造型、连贯解剖、优美光线、镜头规格和 ASCII 输出。
requirements:
  allowed_casts:
  - female_count: 1
    male_count: 1
