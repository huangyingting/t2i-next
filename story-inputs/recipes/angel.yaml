id: angel
description: 根据精确成年人物阵容，创作原创真人实拍黑暗奇幻长片图像，具有真实演员、实制服装与盔甲、实体翅膀、宏伟地点，以及合理摄影机与照明表现。每个主题恰好有一位核心天使，计入阵容，不额外添加；其性别为女性或男性，不同时安排两位核心天使。只有核心天使拥有恰好一对翅膀，其余人物均为普通无翼人类，没有羽毛、光环或其他超自然身体特征。一女一男阵容是一位有翼天使和一位无翼人类。只有指定阵容呈现人类或类人外形，不增加人群、倒影中的陌生人、背景剪影、替身、离体手、人形雕像、人物照片或屏幕人脸。每个人保留二十五至七十九岁之间的具体外观年龄、可见身体支撑和相互回应。环境事件具有强烈而受控的视觉力量。
authoring:
  level_refinements:
    aesthetic:
      shared:
      - '- 每位成年人均穿着完整不透明衣物；- 不得有裸体、裸露乳房、裸露生殖器、性接触、恋物装置或体液；- 通过真人实拍表演、角色、翅膀、盔甲、地点、环境事件、摄影机、运动、表情和受控明暗对照创造吸引力。'
      themes:
      - 变化以下动作：
      - '- 穿过圆形天窗下射光束，同时转向摄影机；- 以四分之三侧身站立，同时扣好一只实用护手；- 坐在石制王座上，双脚着地、翅膀放松；- 以独立保持平衡的翅膀运动走下宏伟台阶；- 俯身查看地图、仪器、桌子或设备箱；-
        单膝跪地检查实物，身体有稳定支撑；- 从关门、观测台、门口、干燥池边或柱廊迈出；- 在有净空的空间里将双翼受控地高举成 V 形；- 用一只可见的手调整连接在身上的羽毛；- 面对单一侧向风锋，一翼向前、一翼向后；-
        另一种发生在当前、可见且物理上可实现的真人实拍运动。'
      frames:
      - 每位成年人始终被完整的不透明衣物完全遮盖。雨、浸水、汗、雾和逆光绝不使 服装透明、半透明、露出皮肤或明确勾勒乳房或生殖器。
    erotic:
      shared:
      - 采用非露骨的成年人亲密互动：相互脱衣、拥抱、接吻、涂抹身体油、沐浴、斜躺、经同意的乳房或大腿触摸，以及平衡的贴近姿势。
      - 整个身体占据区域都干燥、处于室温、稳定、防滑、通风并充满可呼吸空气。水可在有支撑的亲密区域之外形成不高于脚踝的浅薄反光层，但任何面孔、胸部、骨盆、性接触或呼吸通道都不得浸没。绝不在水下、完全淹没的室内、布满湿滑藻类或冰面的支撑面上，或落下的液柱下安排亲密互动。
      frames:
      - 敞开、移位、半透明或脱下的衣物遵循姿势与重力，始终归属于其主人，绝不创造额外肢体或遮住关键身体连接。
      - 通过目光、触摸、姿态和动作使相互回应可见。
      themes:
      - 可选造型：以极简且可实际穿戴的礼仪饰物衬托裸露成年皮肤。
    hardcore:
      shared:
      - 呈现一项清晰可见、已在进行的成年人性行为，具有解剖上精确的接触、受支撑的体重、清晰可辨的双手与面孔、普通人类性解剖结构和实际可行的翅膀净空。翅膀、羽毛、盔甲、家具边缘和道具与性接触路径保持分离。
      - 整个身体占据区域都干燥、处于室温、稳定、防滑、通风并充满可呼吸空气。水可在有支撑的亲密区域之外形成不高于脚踝的浅薄反光层，但任何面孔、胸部、骨盆、性接触或呼吸通道都不得浸没。绝不在水下、完全淹没的室内、布满湿滑藻类或冰面的支撑面上，或落下的液柱下安排亲密互动。
      frames:
      - 仅描述可见的当前瞬间，并保留电影真实感。
      - 敞开、移位、半透明或脱下的衣物遵循姿势与重力，始终归属于其主人，绝不创造额外肢体或遮住关键身体连接。
      - 保留精确人物阵容、核心天使身份和参与动作的普通人类解剖结构。性交时，清楚呈现哪位成年人的阴茎位于哪位成年人的阴道或肛门内；口交或手部性行为时，清楚呈现哪张嘴或哪只手接触哪一生殖器。正在发生的接触及参与动作的解剖结构可见，不以裸体拥抱或暗示性身体对齐代替。
      - 通过目光、触摸、姿态和动作使相互回应可见。
      themes:
      - 可选造型：以极简且可实际穿戴的礼仪饰物衬托裸露成年皮肤。
  themes:
    common:
    - 让图像像一部大制作真人实拍黑暗奇幻长片中的完成版剧照：
    - '- 真实的成年演员，具有自然皮肤纹理、毛孔、细微面部毛发、独立发丝、可信的眼睛和普通人类解剖结构；- 实体制作的羽翼连接在上背部，具有可信的重量、关节、羽毛叠覆、接触阴影与运动；- 可实际穿戴的金属盔甲、剪裁服装或垂坠织物，具有真实的接缝、扣合结构、磨损、重力表现与材料厚度；-
      实搭或可信延展的宏伟地点，地面、墙壁、天气、空气氛围、道具以及前景、中景、背景尺度相互一致；- 深沉的电影式明暗对照，由一道具有合理来源的下射光束或一片光区照明，保留肤色、织物纹理、羽毛细节与金属反应；-
      有意采用低饱和度、暗调、高明度反差、窄色域的配色，以炭黑、石墨、灰烬、风化棕土色、骨灰色、氧化金属、低饱和蓝绿色及失去光泽的琥珀色构成；- 真实长片镜头的光学表现、审慎控制的景深、细微运动表现、受控的高光过渡、细腻电影颗粒及合理的镜头透视；以及
      - 即时的现在时动作，而非静态角色设计表。'
    - 保留精确女性与男性人数，以及每人稳定的外观年龄、面孔、性别解剖、角色、服装、动作和接触归属。
    - 按以下方式确定核心天使：
    - '- 有女性而无男性时，所要求的一位女性就是女性核心天使；- 有男性而无女性时，所要求的一位男性就是男性核心天使；- 混合阵容时，恰好选择所要求的一位成年人作为核心天使，并赋予其余每位所要求的成年人地位平等且可见的角色；以及
      - 在混合阵容的一批主题中，变化核心天使的性别，不使用机械的主题编号规律。'
    - 为每位核心天使赋予能在真人实拍场景中直观演出的角色：
    - '- 检查遭受风暴侵袭的山间关门的天界统帅；- 确保大教堂疏散路线安全的披甲救援指挥官；- 穿越巨大黑石觐见厅的外交使节；- 在无火把的地下医务室检查装备的战地医师；- 在淹水图书馆搬运无字圣物匣的禁忌档案管理员；-
      在破损圆形天窗下调节实体环架的日食导航员；- 在无月玄武岩露台测量风力的海岸哨卫；- 检查开裂矿石大殿的建筑修复师；- 在废弃地下车站旁等候的正式使者；- 在肃穆炼金实验室检查实物证据的调查员；-
      准备从堡垒堤道进行仪式飞行的有翼勇士；- 在远方风暴中守住门槛的皇家统帅；- 穿过冷却金属上方铁廊的锻炉庇护者；- 在灰暗温室照料浅色植物的夜间园丁；或 - 其他原创成年角色，以可见工具、自主目的以及物理上清晰可辨的当前动作为基础。'
    - 变化精确年龄、身高、体脂、肌肉、肩宽、脸型、鼻子、下颌、疤痕、雀斑、皮肤纹理、发质、发长、仪容和表情。不要让每位女性都是纤弱美人、每位男性都是肌肉战士、每位披甲天使都严厉，或每位长袍天使都温柔。
    - 选择一种物理上协调一致的成对翅膀类型：
    - '- 带石墨色阴影的修长风化象牙色鹰式飞羽；- 边缘柔和圆润的宽阔骨灰色鸮式翅膀；- 具有浓密叠覆覆羽的紧凑烟灰色鸽翼；- 具有狭窄流线型初级飞羽的氧化银色隼式翅膀；- 带较暗天然羽轴的暗淡香槟色羽毛；-
      初级飞羽尖端呈炭黑色的灰白翅膀；- 羽毛自然聚束的雨湿珍珠灰翅膀；- 羽轴修补过但仍有生命的旧象牙色翅膀；- 带细微骨灰色横斑的柔和棕土色翅膀；或 - 另一对采用可信有机角蛋白、受真实鸟类启发的翅膀。'
    - 变化翅膀尺度，从肩部至小腿的紧凑折叠，到两个身宽的宽阔翼展，再到能容纳于机库、中庭、露台、舞厅或大型户外场地的巨翼。变化姿态，包括紧密收拢、放松下垂折叠、侧向半展弧形、高举的 V 形、转身时一翼朝前一翼朝后，以及在地点有足够净空时完全水平伸展。
    - 不要默认每位天使都正面站立，背后白翼完全展开。不得创造六只翅膀、布满眼睛的翅膀、脱离身体的翅膀、翅膀光环、翅膀碎片、羽毛触手、机械翅膀、发光翅膀、透明能量翅膀、替代手臂的翅膀或额外装饰性翼形。
    - 每件服装都应看起来经过实体制造，且可供真人演员穿戴。呈现织物组织、衬里、接缝、衣边、扣件、系带、搭扣、衬垫、重量、褶皱，以及与身体和翼根的真实互动。
    - 选择一种协调一致的服装体系：
    - '- 灰色衬垫上带磨旧古金镶嵌的发黑活动板甲；- 深棕土色皮革与骨色亚麻上失去光泽的浅金色札甲；- 磨损克制、关节真实的风化古金色鳞甲；- 石墨色礼服剪裁外的氧化银色板甲；- 剪裁利落长外套上的炭黑银色半身甲；-
      具有暗淡金色扣合结构的厚重骨灰色建筑感长袍；- 带实用翼根系带的深色丝绸剪裁服装；- 带黑色皮革防护的石灰色旅行服；- 配极少氧化金属礼仪饰物的肃穆正装；- 围绕翅膀改制的风化专业野外制服；或
      - 其他结构可信的低饱和电影式整套服装。'
    - 欢迎使用金色盔甲，它应明确呈现为穿在身上的金属，而非仅是金色羽毛、道具、饰边或彩光。使用失去光泽的香槟金、烟熏暗淡浅金、磨旧古金或发黑金色。通过狭窄受控的高光、较暗关节凹槽、细微划痕、边缘磨损、氧化及中性反射保留真实金属反应。避免荧光黄、鲜橙色奇幻金、镜面般高光溢出、过度花丝装饰、不可能的悬浮甲片或与皮肤融合的盔甲。
    - 盔甲遵循真实解剖结构。肩甲保留颈部和翅膀的活动空间；胸甲顺应合理的胸廓；护手保留五根手指；腰带围住一个骨盆；胫甲与膝和踝对齐；背部开口有收边，并为两个翼根提供足够空间。
    - 选择一种能强化天使形象、协调一致的黑暗奇幻环境：
    - '- 破损圆形天窗下的巨石玄武岩大教堂；- 由深层矿物水透光照明的淹水钟墓；- 缓慢火山光上方的铁质觐见厅；- 拥有巨柱与狭窄天窗的地下废墟大殿；- 由雕刻肋架和肃穆扶壁围合的黑石圣所；- 由矿物阶地和仪式台阶塑造的古老洞窟宫殿；-
      实体环架围绕开放屋顶的风暴观测台；- 尺度适合有翼天界权威的肃穆寝宫、浴室、圣物室、图书馆、医务室或作战室；- 无月海岸堡垒、冰封关门、灰烬花园、盐宫、山间堤道、石化森林或火山口边缘瞭望塔；或
      - 其他原创宏伟权力中心，具有协调建筑、着地支撑和实际可行的翅膀净空。'
    - 使用门、窗、长凳、桌子、工具、窗帘、链条、配重、栏杆、楼梯、水道、水池或设备等实景细节。人物占用的表面必须能够实际建造，只在实搭前景和中景之外使用不可察觉的视觉特效延展。不得添加悬浮杂物、发光符号、随机魔法光束或无关奇观。
    - 每个地点都提供清晰尺度、地面支撑、翅膀净空和合乎逻辑的光源。不出现可读的标牌、屏幕、书籍、文件、车牌、标签、徽记、海报、铭文或伪文字。
    - 将环境视为活跃的视觉系统，而非静态房间。每个主题恰好选择一个在可见瞬间已发生的主导大型场面事件。事件必须改变光线、材料、剪影或身体运动，且不添加未要求的人物：
    - '- 巨大闸门开启，一道受控暗色水墙进入人物所处平台之外的阶梯庭院；- 悬吊锻炉坩埚在水道上方旋转，一股狭窄柔和的熔融金属流改变盔甲和石材上的光线方向；- 黑冰地面产生一道宽阔分叉裂缝，而所有成年人仍安全地支撑在稳定干燥区域；-
      实体观测环围绕开放圆形天窗转动，一片远方闪电揭示其尺度；- 灰烬花园在单一侧向风锋下弯折，推动布料、头发、翅膀和远处细灰沿同一个清晰可辨方向运动；- 矿物雨帘掠过户外露台，排水沟变成狭窄反光；-
      巨大的配重档案升降机停在玄武岩廊台之间，无字箱匣在固定牢靠的架子内移位；- 火山潮在堤道下退去，显露肋纹冷却岩石，而非随机火焰；- 淹水钟室受一道下行压力波扰动，使远处悬浮淤泥与反射光弯曲；-
      机械日食光圈在浅色天窗前闭合，将一道移动的硬边阴影投过庭院；- 巨大帷幕、闸门、桥段、观测台百叶窗或装甲门沿可见铰链、轨道、绳索或配重运动；或 - 其他原创且物理上清晰可辨的事件，只有一个原因、一个运动方向及一个可见材料后果。'
    - 选择清晰可辨的高潮瞬间：闸门开到一半、水触及第一级空台阶、闪电照亮远处穹顶、坩埚开始在远处倾注、帷幕伸展到最大程度，或日食边缘掠过核心天使的面孔。恰好使用一个主导事件，最多再有一个从属物理反应。不要将无关的火焰、闪电、坍塌、烟雾、武器、生物和粒子堆叠成游戏海报拼贴。
    - 每幅图像选择一种强有力的图形结构：竖直圆形天窗光束、硬朗的斜向闸门、圆形日食、翅膀与身体的三角层级、退向远处的柱廊、镜映水带或压缩的门口剪影。赋予主导事件一个清晰可辨的运动向量，让散发、织物、翅羽、雨、反射光或远处粒子顺应同一方向，而非随机散开。
    - 整幅图像保持暗调、低饱和度、高反差和窄色域。抑制色彩对比，同时保留强烈的亮度对比。可见图像至少百分之八十五采用近中性的烟炱黑、石墨色、灰烬灰、风化棕土色、暗铁色、烟蓝灰、骨灰色、柔和肤色、暗淡金色或旧象牙色。
    - 围绕一个具有合理来源的光源构建曝光：
    - '- 从破损圆形天窗落下的低饱和蓝灰光束；- 以冷石墨色补光平衡暗淡琥珀色火山下照光；- 映衬深色盔甲与风化翅膀的狭窄骨白色天光；- 蓝黑色大教堂穹顶下低置的暗淡干血色火盆光；- 穿过深水滤入淹水庭院的漫射灰青光；-
      经实体观测台孔口显现的远方闪电；或 - 另一种原创双色温设计。'
    - 让图像约百分之六十至七十五保留在深沉但可辨读的阴影中，同时让核心天使的面孔、两个翼根、羽毛边缘、双手、身体轮廓和当前接触获得决定性的聚焦高光。黑色区域保留材料区分；浅色羽毛保留羽枝细节；皮肤保留毛孔、受压表现、暖意与反射色；高光平滑掠过金属和人体结构，不使表面变成塑料或抛光蜡。
