    - 生成图像不得包含标题、说明文字、标签、标志、水印、签名、字幕、界面、可读书籍、文件、标牌、铭文、数字、二维码、海报、车牌、品牌标记或伪文字。空白纸张、书籍、屏幕、板片和标牌仅呈现纯粹材料或抽象非语言痕迹。
