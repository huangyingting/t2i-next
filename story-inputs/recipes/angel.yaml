    common:
    - 每幅画面是完成版真人实拍黑暗奇幻长片影像。保留精确人物阵容、低饱和高反差电影照明、解剖结构、动作、地点、构图、摄影机、服装、翅膀、材料、环境事件和身体支撑。
    - 这是摄影式黑暗奇幻电影真实感，而非奇幻插画。不得使用油画用语、绘画笔触、概念美术、数字插画、动漫、游戏美术、游戏界面、合成 CGI 光泽、3D 渲染术语、接景绘画、图像小说风格、宗教崇拜图像或泛化奇幻海报。
    - 天使可以超凡，但摄影机必须将演员、翅膀、服装、地点和光线视为实际存在。绝不把视觉画面解释为角色扮演、服装展会、舞台排练、幕后照片或特效测试。直接呈现为严肃完成版真人实拍电影中可信的一刻。仅对不可能的尺度、远景建筑、天气或安全超自然现象使用克制且不可察觉的视觉特效延展。最终图像内绝不描述绿幕、数字替身、合成图层、渲染通道或制作流程。
    - 精确可见阵容保留指定的中国成年女性与男性人数，并明确其中哪位是核心天使。
    - 多人阵容中的每位非核心人物均为无翼人类；不是翅膀位于画外、折叠、隐藏或被移除。
    - 单人阵容只呈现核心天使：中国成年男性单人或中国成年女性单人肖像，与指定性别一致。
    - 核心天使是普通成年类人个体，具有一个头、一条颈、一个躯干、两条手臂、两只各有五指的手、两条腿和两只脚，外加恰好一对匹配的翅膀，由一只左翼和一只右翼组成。
    - 将双翼连接在上背部和肩胛骨区域。呈现衣物开口下宽阔的肩胛翼根、合理的主关节、层叠覆羽、次级飞羽、初级飞羽、重量、弯曲、接触阴影、被推移的织物，以及足以容纳完整翼展的净空。翅膀绝不从头、颈、胸、腰、手臂、家具或另一个人身上生出。
    - 每个最终画面明确说明天使恰好有一对匹配翅膀，由一只左翼和一只右翼组成。分别描述左翼和右翼，包括连接、折叠或展开方向、净空、光线及可见羽毛表现。
    - 单人肖像中的翅膀梳理、测量或调整仅适用于天使身上两只可见且相连的翅膀。绝不添加散落的翅膀关节、备用翅膀、不可见翅膀、离体翅膀或暗示画外的病人。
    - 灰烬、尘土、淤泥、火星、雨、烟、蒸汽、矿物喷雾和松散碎屑不得进入口、眼、生殖器、性体液和直接接触区域。此类物质保持在远处背景、屏障之外或独立光束中。热金属、运动机械、深水、重型机构、尖锐冰块和坍落材料应距人物数个身长，并与人物实际隔离。
    - 每幅图像构建三个清晰可辨的层次。以前景台阶边缘、空栏杆、翼尖、帘边、水道或反光面作为边界；中景包含完整人物阵容及决定性动作；背景承载宏伟建筑和主导事件。
    - 保持核心天使的面孔、两个翼根、双手、完整身体支撑和决定性接触清晰可辨。通过明度、轮廓光、空气氛围和焦点，而非饱和色彩，将浅色羽毛边缘与骨灰色石材及深色盔甲区分开。
