id: surreal-conceptual-portrait
description: 为确切要求的成年人物阵容创作原创、博物馆级的超现实观念肖像。结合克制的时尚摄影、实体装置艺术、面无表情的戏剧布置，以及一个不可能但视觉连贯的隐喻。图像应显得安静、精确、诡异且情感可读，而非壮观、异想天开、装饰性或由特效驱动。
authoring:
  level_refinements:
    aesthetic:
      shared:
      - '- 使用完整不透光的成年人时装与非性互动。每件衣物保持适当扣合，肩、胸、骨盆、臀部和生殖器均由不透光织物完全覆盖。'
    erotic:
      shared:
      - 可使用薄透或敞开剪裁，以及感官性的身体—物件张力；不得直接刺激生殖器。
    hardcore:
      shared:
      - 装置为行为构框、呼应、计数或遮蔽外围，不进入、捆绑、悬挂、击打或机械操作身体。接触道具具有与可见接触相容的形状；重型悬挂物、绳索、框架、玻璃、锐边和动力机械位于身体与接触路径之外。
      frames:
      - 每个画面以一个行为为中心，观念装置仍对其意义不可或缺。直接命名正在参与的解剖部位和当前接触。
  themes:
    common:
    - 每个主题从一个简洁等式构建：
    - 一种成年人心理或社会处境 + 一个普通物件族 + 一种不可能的空间关系 = 一幅无声的观念肖像
    - 处境可以涉及记忆、工作、缺席、选择、身份、家庭秩序、私人抱负、情感距离、日常、旅行、继承、注意力或其他成年人经验。完全通过可见姿态、物件行为、距离、尺度、重复、悬挂、遮蔽和色彩表达。无需图注或解释。
    - 每幅图像都只有一个主导隐喻，而非一组不相关的超现实手法。移除人物必须破坏意义；将主角物件换成任意物件也必须破坏意义。成年人仅仅站在奇怪装饰旁边是不够的。
    - 严格使用所要求数量的成年女性和成年男性。不得添加旁观者、助理、操作员、人群、倒影中的陌生人、人形模特、人物肖像、屏幕人物、无躯体的手、多余影子，或暗示另一个人的身体碎片。
    - 人物保留指定国籍，默认中国人；年龄外貌、成熟面部与身体结构、不同体型、肤色、发型和衣着构成稳定身份，贯穿主题。
    - 面部可见时，赋予符合隐喻的平静、自持表情：面无表情的关注、适度好奇、内心决意、克制悲痛、镇定的不确定，或节制的反抗。避免时尚微笑、戏剧尖叫、空洞人偶表情、夸张恐惧或煽情表演。
    - 为每个要求的人物赋予不可或缺的构图作用。多人时，通过距离、镜像或对立姿态、交换物件、共享悬挂几何、对齐目光或一个合作动作，建立清晰关系。不得将任何人降格为背景装饰。
    - 超越以下开放式方向进行创造：
    - '- 一个人上方悬挂由普通私人物品构成的华盖或星群；'
    - '- 空衣物档案排列成天气、建筑或记忆的形态；'
    - '- 一个可穿戴的物件头，把身份转变为实体界面；'
    - '- 画框、盒箱、容器、工具或家居物件在一位坐姿或站姿成年人周围构成受控云团；'
    - '- 将床、椅、书桌、门口、行李系统或其他熟悉物件置于情感矛盾的环境；'
    - '- 缆索或线将思想、义务、记忆或选择转译为可见空间图；'
    - '- 重复物件在身体周围一条精确边界处停止；'
    - '- 仅当物件的普通功能对隐喻仍不可缺少时，将一个物件放大或增殖；'
    - '- 两位成年人由平行、但绝不实际合并的物件系统连接；或'
    - '- 基于平衡、缺席、替代、容纳或不可能秩序的原创实体幻象。'
    - 这些是构思引擎，而非菜单。相邻主题间不得重复相同的悬挂衣橱、遮头、档案云、沙漠床、黑色虚空或坐姿侧面。
    - 偏好正式剪裁、朴素连衣裙、雕塑感大衣、挺括衬衫、百褶裙、克制针织衣物、长手套、擦亮鞋履，或同样精确的成年人衣着。由剪影、接缝、褶皱及材料对比承载时尚语言。衣着可为白叠白、黑叠黑、炭灰、石色、奶油色，或中性色域中的一种饱和点缀。
    - 为每个人提供符合前提的完整一致造型。各主题间变化剪裁年代、剪影、衣摆、肩线、布料厚重度、鞋履与配饰。避免每幅图像都穿泛化黑西装、奇幻戏服、品牌服装、具有年轻人暗示的制服，或复制参考图的造型。
    - 保留摄影式皮肤、头发、织物受压及自然不对称。超现实来自物件关系与空间设计，而非融化解剖、合成皮肤、不可能衣物或扭曲身体。
    - 每个主题使用一个受控环境：
    - '- 浅色无缝摄影棚或建筑房间，地板与墙面有细微分隔；'
    - '- 带可见地面的深黑舞台或虚空；'
    - '- 简化至必要家具的稀疏家庭室内；'
    - '- 盐滩、干湖、雾原、海岸或其他开放景观；'
    - '- 清空至只剩象征性要素的画廊式房间、档案室、候车室、办公室、卧室、工作坊或交通空间；或'
    - '- 其他功能能加强隐喻的原创地点。'
    - 约保留画面的百分之四十至七十作为平静负空间。有意把密度集中于一个华盖、柱体、云团、地平线、竖向堆叠或紧凑人—物群组。地面、地平线、墙面接缝或舞台边缘须足够可辨，以锚定尺度。
    - 不得用随机道具、雾、粒子、鸟、装饰织物、文字排版或次要符号填满空白。避免泛化奢华室内、废墟、赛博朋克巷道、幻想景观及繁忙电影美术设计。
    - 每个主题选择一种严谨配色：
    - '- 暖白、粉笔白、骨白，及一种琥珀或铁锈色点缀；'
    - '- 炭灰、墨黑、石墨色，及一小处银色高光；'
    - '- 冷灰、米白、深色木材，及一种柔和红色；'
    - '- 沙色、象牙白、浅蓝，及一种棕色皮革点缀；'
    - '- 单色加一种克制的材质色；或'
    - '- 其他最多使用两种主导色相加一种点缀的原创系统。'
    - 使用真实材料反应：压烫羊毛、起皱亚麻、漆面、拉丝金属、磨砂玻璃、哑光塑料、旧纸、木材、皮革、棉绳、陶瓷或涂漆石膏。高光克制、黑色有层次、白色有纹理。避免彩虹配色、霓虹奇观、过度光泽、幻想光辉、液态铬或不加区分的薄雾。
    - 在每个所要求的内容等级中保持同样克制的观念肖像语言。
    - 每个主题定义：
    - '- 一种原创成年人处境或关系；'
    - '- 一个具有必要象征功能的普通物件族；'
    - '- 一种不可能但通过实体布置实现的空间关系；'
    - '- 具有稳定身份与衣着的确切所要求人物阵容；'
    - '- 一个受控地点、负空间结构、配色和材料系统；'
    - '- 一种安全实体装置方法；'
    - '- 一种相机与照明语法；以及'
    - '- 一个在所有所要求画面中持续有用的简洁视觉论点。'
    - 主题须通过前提、物件族、空间机制、人物关系、衣着剪影、密度位置、配色、环境、相机及情绪基调区分。不得创作仅替换一个悬挂物件或点缀色的变体。
    - 浅色高调与深色低调环境、悬挂系统、落地布局和可穿戴头部处理形成多样变化；衣着剪影、密度结构、情绪与物件族不同，不让一种物件、头部处理、配色、姿态或地点主导整组。
  frames:
    common:
    - 宏大负空间、正式成熟人物、悬挂日常物件、身份遮蔽、稀疏舞台建筑、有限色彩与实体制作质感共同构成超现实视觉。
    - 严格使用所要求数量的成年女性和成年男性。不得添加旁观者、助理、操作员、人群、倒影中的陌生人、人形模特、人物肖像、屏幕人物、无躯体的手、多余影子，或暗示另一个人的身体碎片。
    - 每个最终画面明确说明场景中只有这组确切可见人物，没有额外人物或人体部位。出现空衣物、画框、屏幕、影子或人形大小物件时，这点仍须毫不含糊。
    - 面部可见时，赋予符合隐喻的平静、自持表情：面无表情的关注、适度好奇、内心决意、克制悲痛、镇定的不确定，或节制的反抗。避免时尚微笑、戏剧尖叫、空洞人偶表情、夸张恐惧或煽情表演。
    - 为每个要求的人物赋予不可或缺的构图作用。多人时，通过距离、镜像或对立姿态、交换物件、共享悬挂几何、对齐目光或一个合作动作，建立清晰关系。不得将任何人降格为背景装饰。
    - 悬挂服装、行李、画框、工具、家居物件、纸张、家具部件或雕塑形态必须构成一个可辨剪影，以及一种与人物的有意关系。使用变化的高度、尺度、间隔、重叠和密度，而非均匀装饰网格。
    - 展示纤细但可信的支撑线向上延伸至画外天花网架、顶部桁架、隐藏导轨或其他稳定建筑锚点。每件重物都有自己的可信承重路径，在重力下垂直悬挂。缆索受力处保持绷紧、投下符合逻辑的阴影，且绝不终止于空处。
    - 悬挂物须位于安全身体路径上方或旁边。不得通过人的头发、皮肤、颈部、生殖器或衣物悬挂任何东西。重物不得接触头部，也不得在没有防护的身体上方保持平衡。当可见尺度本来会不安全时，使用轻质戏剧复制道具。
    - 空衣物必须在衣架或不可能像人的内部服装支架上明显保持空置。框内图像包含景观、建筑、物件或抽象色调域，绝不包含可辨人脸或身体。每个包含空衣物的最终画面都须明确命名其可见衣架或平面非人形支撑。衣橱档案只包含成人尺寸衣物，不含婴儿服、儿童尺寸衣物、校服或其他具有未成年暗示的衣物。
    - 任何悬挂物与人物上方垂直区域重叠时，须将其描述为超轻空心戏剧复制道具，并在完整身体剪影上方保留开放安全间隙。真实家具、玻璃、陶瓷、钟表、工具、行李及其他刚性或沉重物件须位于人物旁边，绝不可直接在头顶。
    - 面部遮蔽是可选而非必需。仅在身份、注意力、记忆、角色、匿名或沟通是主题核心时使用。
    - 物件头是围绕一个现有人物真实头部的可穿戴雕塑头饰，绝非斩首、漂浮替代头、第二个头或脱离颈部。保持颈部至躯干的解剖连续。为头饰提供可信开口、内部净空、平衡重心以及独立于颈部的可见支撑。
    - 合适头部处理包括无品牌空白显示面、浅盒、半透明外壳、柔软包裹体积、建筑式遮阳面罩、框架物件群或其他原创形态。鼻口须不受实体压迫，呼吸不受限制。绝不使用紧塑料、粘性包裹、勒颈绳、密闭织物、巴拉克拉法面罩、封闭头罩、麻袋、伤害、痛苦或束缚。
    - 环绕头部的任何结构均使用轻质防碎亚克力、泡沫、织物、卡纸、薄木材或圆润聚合物。绝不在面部、头骨或颈部周围或上方放置真实玻璃、陶瓷、脆性材料、锋利金属边缘或重部件。
    - 每个使用面部遮蔽的最终画面都必须可见地描述两项：宽敞的下半脸呼吸间隙或鼻口前方的通风通道，以及绕过颈部的独立承重路径。任何附加缆索、线或物件都由顶部支撑或宽阔躯干安装框架承载，绝不由头饰、头、头发、喉咙或衣物承载。
    - 空白屏幕仅展示一个未点亮或抽象色调表面，没有界面、人脸、标志、文字、符号、静电噪点图案或可读图像。线与缆索可从受支撑头饰中伸出，但绝不穿透皮肤或让头部承重。镜子与反光头饰只能反射空建筑、光或抽象色彩。绝不反射、重复、切碎或增殖人物的脸、眼、头、身体或肢体。
    - 偏好正式剪裁、朴素连衣裙、雕塑感大衣、挺括衬衫、百褶裙、克制针织衣物、长手套、擦亮鞋履，或同样精确的成年人衣着。由剪影、接缝、褶皱及材料对比承载时尚语言。衣着可为白叠白、黑叠黑、炭灰、石色、奶油色，或中性色域中的一种饱和点缀。
    - 保留摄影式皮肤、头发、织物受压及自然不对称。超现实来自物件关系与空间设计，而非融化解剖、合成皮肤、不可能衣物或扭曲身体。
    - '- 浅色无缝摄影棚或建筑房间，地板与墙面有细微分隔；'
    - '- 带可见地面的深黑舞台或虚空；'
    - '- 简化至必要家具的稀疏家庭室内；'
    - '- 盐滩、干湖、雾原、海岸或其他开放景观；'
    - '- 清空至只剩象征性要素的画廊式房间、档案室、候车室、办公室、卧室、工作坊或交通空间；或'
    - '- 其他功能能加强隐喻的原创地点。'
    - 约保留画面的百分之四十至七十作为平静负空间。有意把密度集中于一个华盖、柱体、云团、地平线、竖向堆叠或紧凑人—物群组。地面、地平线、墙面接缝或舞台边缘须足够可辨，以锚定尺度。
    - 不得用随机道具、雾、粒子、鸟、装饰织物、文字排版或次要符号填满空白。避免泛化奢华室内、废墟、赛博朋克巷道、幻想景观及繁忙电影美术设计。
    - '- 暖白、粉笔白、骨白，及一种琥珀或铁锈色点缀；'
    - '- 炭灰、墨黑、石墨色，及一小处银色高光；'
    - '- 冷灰、米白、深色木材，及一种柔和红色；'
    - '- 沙色、象牙白、浅蓝，及一种棕色皮革点缀；'
    - '- 单色加一种克制的材质色；或'
    - '- 其他最多使用两种主导色相加一种点缀的原创系统。'
    - 使用真实材料反应：压烫羊毛、起皱亚麻、漆面、拉丝金属、磨砂玻璃、哑光塑料、旧纸、木材、皮革、棉绳、陶瓷或涂漆石膏。高光克制、黑色有层次、白色有纹理。避免彩虹配色、霓虹奇观、过度光泽、幻想光辉、液态铬或不加区分的薄雾。
    - 偏好正面或近正面的博物馆记录式清晰度、严格侧面、审慎的四分之三视角、居中对称、有意偏心平衡或低密度环境肖像。使用标准或肖像透视，通常为等效 40-105 毫米，保持竖线垂直且畸变很小。
    - 各主题间变化全身、坐姿全身、四分之三肖像、双人场景、环境广角与受控近距肖像。让完整观念关系清晰可读。不得裁掉必需支撑、物件来源、身体连接或让隐喻可读的负空间。
    - 使用一个连贯照明系统：
    - '- 宽广冷调摄影棚日光，配柔和地面阴影；'
    - '- 一束顶部光池渐隐入黑色舞台；'
    - '- 产生长条图形阴影的硬质侧向阳光；'
    - '- 浅淡阴天景观光，配细微地平线分隔；'
    - '- 哑光表面前克制的正面闪光；或'
    - '- 其他具有明确方向与衰减、来源合理的设计。'
    - 照明必须揭示缆索路径、物件纵深、衣物纹理、身体轮廓和地面。避免泛化电影青橙色、过曝白色虚空、无细节压黑、随机轮廓光、戏剧彩烟，以及抹去装置的美容光。
    - 每个身体须在解剖上普通且可追溯。每条可见肢体连续连接到一个人的躯干，遵循自然关节，并有一个相容任务或支撑。不得通过物件重叠、黑暗、镜子、画框、屏幕、影子或悬挂衣物创造额外、脱离、重复、融合或无来源的解剖。
    - 每只站立脚都须有稳定地面接触，每个坐姿身体都须有宽阔承重椅、长凳、床或地板。人物不承载悬挂装置、不充当结构柱、不在狭窄道具上平衡，也不做杂技姿势。绳索可组织空间，但绝不束缚手腕、脚踝、颈部、气道或性器官。
    - 尽可能以清晰负空间分开物件边缘和身体剪影。重叠必不可少时，保留每条肢体、缆索、衣物及物件的来源与延续。
    - 在每个所要求的内容等级中保持同样克制的观念肖像语言。
    - 同一主题中的画面是平行的完成肖像，而非时间顺序步骤。每个画面独立重述完整人物阵容、当前姿态、物件系统、实体支撑、环境、配色、相机、光线和当前内容等级动作。绝不引用另一画面，也不暗示物件、衣物、姿态或动作在图像之间发生变化。
    - 保留主题的同时，至少变化以下四项：相机距离、视点、身体朝向、负空间分布、物件密度、前景层、目光回路、支撑可见性、光线几何和材料重点。
    - 渲染图像不含标题、图注、标签、标志、品牌标记、水印、界面、字幕、海报、可读屏幕、印刷句子、数字、二维码或装饰伪文字。只通过人物、物件、姿态、尺度、间隔、材料、颜色、阴影和光传达概念。每个最终画面都明确重申所渲染场景不含可读文字、标志、界面、水印或人物图像。
    - 纸张、信件、信封、文件、标签、吊牌、书籍、屏幕和标牌须为空白表面或抽象非语言色调域。绝不描述为手写、印刷、写有地址、打字、编号、带标签，或带褪色或不可辨文字。
    - 每幅画面独立完整，保留人物身份、年龄外貌、姿态、地点、衣着、表情和目光，以及主角物件族、不可能空间关系、可信装置支撑、物件分隔、身体支撑、肢体连续性和当前互动。
    - 环境保留百分之四十至七十的负空间，相机、光线、配色与材料反应协调。只有指定人物，没有其他人物图像、可读文字、标志、界面或水印；观念关系直接可见，不被黑暗、裁切、雾或特效隐藏。
