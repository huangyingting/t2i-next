    - 每个身体须在解剖上普通且可追溯。每条可见肢体连续连接到一个人的躯干，遵循自然关节，并有一个相容任务或支撑。不得通过物件重叠、黑暗、镜子、画框、屏幕、影子或悬挂衣物创造额外、脱离、重复、融合或无来源的解剖。
    - 每只站立脚都须有稳定地面接触，每个坐姿身体都须有宽阔承重椅、长凳、床或地板。人物不承载悬挂装置、不充当结构柱、不在狭窄道具上平衡，也不做杂技姿势。绳索可组织空间，但绝不束缚手腕、脚踝、颈部、气道或性器官。
    - 尽可能以清晰负空间分开物件边缘和身体剪影。重叠必不可少时，保留每条肢体、缆索、衣物及物件的来源与延续。
    - 在每个所要求的内容等级中保持同样克制的观念肖像语言。
    - 同一主题中的画面是平行的完成肖像，而非时间顺序步骤。每个画面独立重述完整人物阵容、当前姿态、物件系统、实体支撑、环境、配色、相机、光线和当前内容等级动作。绝不引用另一画面，也不暗示物件、衣物、姿态或动作在图像之间发生变化。
    - 保留主题的同时，至少变化以下四项：相机距离、视点、身体朝向、负空间分布、物件密度、前景层、目光回路、支撑可见性、光线几何和材料重点。
    - 渲染图像不含标题、图注、标签、标志、品牌标记、水印、界面、字幕、海报、可读屏幕、印刷句子、数字、二维码或装饰伪文字。只通过人物、物件、姿态、尺度、间隔、材料、颜色、阴影和光传达概念。每个最终画面都明确重申所渲染场景不含可读文字、标志、界面、水印或人物图像。
    - 纸张、信件、信封、文件、标签、吊牌、书籍、屏幕和标牌须为空白表面或抽象非语言色调域。绝不描述为手写、印刷、写有地址、打字、编号、带标签，或带褪色或不可辨文字。
    - 每个最终画面以所要求语言写成一个流畅的自然语言段落，可直接用作图像生成提示词。以可见人物阵容、姿态、物件关系和地点开头。随后以最自然的阅读顺序整合衣着、装置几何、支撑路径、负空间、相机、光线、配色和材料反应。
    - 英文画面约使用十二至十六句，按以下详细顺序：
    - 1. 人物阵容、年龄、身份、主要姿态、地点、衣着、表情及目光；
    - 2. 主角物件族与不可能的空间关系；
    - 3. 可信装置支撑、物件分隔、身体支撑、肢体连续性和当前互动；
    - 4. 受控环境及其百分之四十至七十的负空间；
    - 5. 相机、光线、配色和必要材料反应；以及
    - 6. 确切人物阵容独处，以及无文字图像约定。
    - 将这六个方面展开至完整句数预算，不要把每个方面限制为一句。使用长短变化的直接完整句子。最后一句必须明确包含短语 "Only the specified cast is present"、"negative space" 和 "no readable text, logo, interface, watermark, or human image"。
    - 英文画面至少 600 个单词，或在所要求的其他语言中使用等量细节。起草以 650-900 个单词为工作范围。返回每个英文画面前，按空白分隔计算单词数；若不足 600，增加新的可成像空间、材料、衣着、照明、支撑或相机细节，直至达到最低要求。英文画面只使用 ASCII 字符，包括直引号和普通连字符，而非智能标点。发布前扫描英文画面每个字符，把所有汉字、带重音字母、智能标点或其他非 ASCII 符号替换为纯英文 ASCII。不输出标题、标签、项目列表、替代版本、实现备注、参考图讨论、艺术家姓名或合规说明。
    - 在具体可见图像描述后结束。不得附加材料清单、象征阐释、哲学总结、隐喻解释，或重述提示词中已可见细节的第二段。
    - 返回前，拒绝并重写任何符合以下情况的主题或画面：
    - 1. 复制参考构图或可辨识艺术作品；
    - 2. 人数多于或少于要求；
    - 3. 使用多个无关超现实手法，而非一个隐喻；
    - 4. 任意替换主角物件后仍保留相同意义；
    - 5. 把负空间变为装饰杂乱；
    - 6. 创造无支撑重物或没有承重路径的缆索；
    - 7. 让空衣物、画框、影子或屏幕暗示另一个人；
    - 8. 描绘斩首、窒息、勒颈、捆绑、伤害或不安全悬挂；
    - 9. 创造脱离、重复、融合或不可追溯的解剖；
    - 10. 通过黑暗、裁切、雾或特效隐藏观念关系；
    - 11. 违反所要求的内容等级；
    - 12. 在亲密接触路径中使用危险装置；
    - 13. 渲染可读文字或界面；或
    - 14. 面部遮蔽没有可见呼吸路径及独立于颈部的支撑；或
    - 15. 解释隐喻，而非使其可见；
    - 16. 把空白纸面称为手写、印刷、写有地址或带标签；或
    - 17. 包含少于 600 个英文单词，或附加冗余阐释段落；或
    - 18. 英文画面包含任何非 ASCII 字符。
