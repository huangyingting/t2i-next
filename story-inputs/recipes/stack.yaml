id: stack
policy: standard-story
description: '创作多样化、精致、超写实的成人群像主题，围绕严密组织的身体几何排列展开。贯穿其中的视觉语言应俏皮、雕塑化、亲密且一眼可辨：成年人组成放射环、分层轮廓、嵌套弧线、人体吊灯、花朵状簇群、有支撑的金字塔、螺旋和其他精确的集体形状，同时相机采用大胆的低位、高位、背面或中心视点。


  以下所有列表均为灵感，而非菜单、枚举、预设库或固定序列。可以组合相容的示例、加以变换或创作等效方案。只有使用“必须”（"must,"）、“每个”（"every,"）、“精确”（"exact,"）或“不得”（"do
  not"）的陈述才是强制要求。


  严格使用所要求的人物阵容，不得增加其他人。每个人都必须是明确成熟、年满 25 岁的中国成年人，保持清醒、主动自愿、相互回应，并能够离开该排列。赋予每位成年人独特的原创面孔、发型、体型和稳定的视觉锚点。


  不得描绘或点名名人、公众人物、未成年人、外貌年轻的虚构角色或可识别的真实人物，也不得使角色与其相似。不得添加旁观者、助手、人群、人体模型、肖像、屏幕上的人物图像、镜子，或可能产生含混额外人物的反射。


  阵容可以看似堆叠、分层、悬吊或交错连接，但任何成年人都不得用头、颈、脊柱、肋骨、腹部、骨盆、下背部或无支撑的关节承受另一位成年人的重量。不得将膝盖、脚、肘或硬质道具压在别人的背部或躯干上。不得将人体用作台阶、平台、桥梁、凳子或承重建筑结构。


  用可见的安全工程构造高处或看似不可能的排列：透明亚克力层架、隐藏高度的软垫基座、宽阔软包平台、固定于地面的摆姿方台、顶部人体安全吊带、独立腰部支撑、置于身体路径之外的刚性布景骨架，或让每位成年人均有独立支撑的合成影像。支撑硬件必须边缘柔软、接触面宽、带有快拆装置，并且不对颈部或胸部施压。


  每位成年人都必须只支撑自己的身体，或得到独立支撑。手可以触碰肩膀、手臂、腰、髋部外侧或附近安全结构，以表达联系，但不得拉头发、压迫气道、锁住关节或产生疼痛性杠杆作用。任何依赖无法解释的平衡、危险挤压、隐藏压迫力或不可能人体力量的排列，都必须拒绝并重写。'
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 使用连贯的雕塑式时装、合身摄影棚服装、不透明连体衣、协调舞服或建筑式服装。身体亲近可以温暖而俏皮，但图像首先必须呈现为正式群像和身体几何研究。
    erotic:
      shared:
      - 每个情色主题都必须通过身体遮盖、近距离肌肤相贴、刻意展示、富于表现力的目光、可感的挤压或其他非露骨情色信号，明确建立成人感官意图。普通着装摆姿、随意友谊、遥远剪影或中性的舞蹈几何本身不满足所要求的明确感官意图。
    hardcore:
      shared:
      - 每个硬核色情主题都必须通过背景、身体遮盖和互动，使场景的性性质毫无歧义。
  themes:
    common:
    - 将视觉原理抽象成新概念，而不是重复一幅已经完成的图像。每个主题都必须创造不同的群体几何、支撑系统、相机关系、裁切节奏、配色和情绪张力。
    - 不得按照主题 ID、画面 ID 或序号分配概念、位置、相机角度或强度。
    - 每个主题都必须定义一个完整的肖像系统：- 一个原创的集体几何构想；- 一处私密封闭摄影棚、舞台或搭建室内空间；- 一套连贯的服装或艺术裸体逻辑；- 一种安全支撑方法；- 一种主导相机关系；-
      一套配色和具有动因的照明系统；以及 - 一种俏皮、温柔、戏剧化或带支配感的群体动态。
    - 为每个主题赋予一个简洁标题。情境设定必须以不超过两句话描述完整阵容、当前几何排列、可见支撑逻辑，以及该排列为何在视觉上出人意料。风格必须用一个流畅句子定义构图、镜头表现、裁切、配色、光线、表面呈现和最终质感。
    - 集体几何：围绕空中心向内的放射环；由头部和肩部形成层叠花瓣的玫瑰花簇；在透明独立层架上受支撑的香槟塔轮廓；每位成年人各置于独立吊带环中的垂直人体吊灯；由低前景到高背景排列的嵌套新月弧；身体环绕中央布景柱形成的螺旋；向镜头展开的扇形队列；由各自受支撑的斜躺对角线构成的对称菱形；面孔、肩膀和相连前臂组成的同心圆；在宽阔隐藏高度软垫基座上的阶梯轮廓；以独立腰部吊带悬吊的倒置水滴构图；交替躯干角度与同步手臂曲线构成的波浪队列；不同头部向外辐射的紧凑花束构图；围绕非承重布景框架构建的建筑拱门错觉；由透明亚克力板层隔开的堆叠肖像圆章；在独立平台上坐姿与站姿轮廓构成的之字链；两个相对身体簇形成狭窄负空间走廊；不使用镜子或重复人物的人体万花筒图案。
    - 群体连接：前臂相连形成连续环链；手轻放在邻近者肩上；手掌在放射构图中心相接；头向内倾而身体向外斜；背部贴近对齐但不承重；肩膀在紧密但可自由呼吸的簇群中接触；手放在自己的肋部、腰、肩或髋部外侧；成对成年人隔着几何空隙彼此相对；交替看向相机和邻近成年人；协调微笑沿环形排列传递；平静直接的眼神接触塑造有统领感的集体肖像；严格队列中的俏皮不对称表情；具有明确独立支撑的柔和侧向肌肤接触；前臂交织且每只手和每处手腕均完整可见。
    - 姿势节奏：直立与斜向躯干交替；高度和方向不同的重复拱线；紧凑蜷曲轮廓展开成长伸展；镜像手臂曲线框住不同面孔；错位肩膀形成下降视觉节奏；头部在画面中排列成精确弧线；髋部和肩膀反向扭转以明确分离身体；腿在独立支撑上形成平行对角线；朝外的脚环绕空的中心空间；向内折叠的膝盖由可见平台边缘分隔；修长脊柱线条与紧凑手臂形状平衡；不对称身体层级归结为一个稳定外轮廓。
    - 场景：看不到地平线的纯净粉彩无缝弧形背景；配透明亚克力摆姿层架的柔白摄影棚；配软包几何基座的粉蓝摄影棚；墙面无缝弯曲的暖桃色肖像室；具有独立圆形光池的黑匣子剧场；每个身体附近使用哑光板的银色反光舞台；配有超大圆润造型的糖果色雕塑布景；仅有一副非承重布景骨架的极简象牙白画廊；悬挂织物云朵的柔薰衣草色摄影棚；配宽阔软垫平台和受控阴影的深红舞台；具有半透明台阶与漫射逆光的薄荷绿房间；地面发光线条勾勒群体几何的深靛蓝空间。
    - 照明：大面积顶部柔光带来柔和雕塑式阴影过渡；对称侧光勾勒每条重叠身体边缘；粉彩正面补光配窄光晕逆光；高位柔光箱产生清晰皮肤纹理和轻柔接触阴影；低位环形漫射灯照亮朝上构图；顶部光被几何纱幕图案切分；暖主光与冷色轮廓分离形成对照；珍珠白美人光配克制的水润高光；从玫瑰色到青色渐变的彩色侧光；柔和舞台聚光分别照亮各个独立受支撑层级；明亮无缝照明呈现细微毛孔与自然色调变化；背景深度衰减，面孔发亮且轮廓清晰。
    - 最终质感与材质细节：精致编辑大片写实感，带细微毛孔与自然光泽；柔和粉彩分色与干净中性高光；水润缎面皮肤呈现而不作塑料般磨皮；不透明织物触感，接缝和受压状态可见；透明亚克力边缘捕捉细白高光；仅在安全宽阔支撑接触皮肤处有轻微压痕；柔和色调过渡保留亮部与暗部细节；重叠身体之间精确的边缘分离；克制颗粒增加纹理而不遮蔽人体结构；干净摄影棚成片，不含文字、边框或图形叠加。
    - '- 每个主题都必须使用真正不同的集体几何和支撑逻辑。- 优先采用尚未使用的相机、裁切、配色和群体动态组合，再重复某一种。- 不得反复默认金字塔、向内圆环、低角度、粉彩背景或一位占主导的中心成年人。-
      不得复制示例的固定人数、排数、发型分配、姿势、镜头、配色或身体部位焦点。- 不得让裸体替代有力的几何概念。- 不得让整个构图集中于乳房、臀部、生殖器或其他孤立的人体特征。- 拒绝任何一旦缺少不安全人体承重就会坍塌的画面排列。-
      拒绝任何人数含混、人体融合、多余肢体、重复人物、无法解释的支撑或内容级别低于要求的画面。- 保留俏皮、雕塑化、精致的群像特征，同时使每幅最终图像成为原创视觉构想。'
    - 每个主题的情境设定都必须说明当前身体遮盖逻辑、集体排列、物理支撑系统，以及定义内容级别的互动。每个主题的风格都必须通过裁切、相机距离、照明、皮肤或布料呈现和构图来强化该级别。
  frames:
    common:
    - 同一主题内的画面是同一总体视觉构想的平行备选，而非按时间推进的步骤。姿势、衣物状态、裁切、道具位置和支撑状态均不在画面之间继承。每幅画面必须独立成立，完整重述精确阵容及排列，并使用不同但相容的相机策略、轮廓节奏或表情模式。
    - 以所要求语言将每幅最终画面写成一个不分段的自然语言段落。不得输出剧本、镜头表、标签列表、指导性解释、可见标题、图注、标签、标志、水印或界面元素。
    - 每位所要求的成年人都必须在图像中明确出现且恰好一次。通过彼此分离的头部、发型、面孔或清晰可追踪的侧脸、躯干和肢体路径，使完整人数可核对。裁切可以隐藏人物的一部分，但不得让人数或身体归属含混。
    - 呈现正常人体结构、自然关节和正确的手脚指趾。每只可见的手、脚和每条肢体只安排一项相容任务。每条肢体都可从肩部或髋部追踪至末端。不得创造脱离身体的部位、融合躯干、共用肢体、多余的手、重复头部、重复身体、不可能的弯折或跨人物皮肤连续。
    - 身体重叠时，通过不同头发、肤色变化、衣物颜色、轮廓光、焦点、姿势方向或可见空隙将其分离。每个可识别的身体片段都必须明确连接到其所属人物。
    - 相机关系：穿过放射环向上拍摄的极低中心视角；显露完整分层轮廓的低位后侧四分之三视角；将阵容压成平面图形几何的垂直俯视；强调精确对称和人数的平视正面；展示支撑工程与队列纵深的广角角落视图；对齐各自受支撑身体层级的压缩长焦视图；中心近景肖像，外围成年人被裁成刻意的片段；保留每位成年人完整轮廓的中广角视图；使透明平台近乎消失的贴地侧视；将稳定队列转为动态对角线的轻微倾斜视角；穿过前景肢体望向视觉主导人物的深焦视图；中心面孔浅焦，同时保留不同的外围头发与侧脸锚点。
    - 裁切与视觉层级：一位中心成年人占主导，而每位外围成年人仍可计数；完整群体轮廓占主导，面孔排列为次级节奏；手与相连前臂构成首先可辨的几何图案；不同发型围绕中心形成多彩光环；前景肩膀框住锐利的中心面孔；重复躯干曲线引向一个富于表情的凝视；身体之间的负空间成为中心符号；平台边缘与身体对角线形成一套建筑网格；细节尚未显现时，排列在缩略图尺度已清楚可辨；最近的身体仍保持自然透视而无极端畸变。
    - 每幅画面开篇时就必须已能看见定义该级别的状态，不得以准备、预期升级、事后或更温和的替代状态取代。
