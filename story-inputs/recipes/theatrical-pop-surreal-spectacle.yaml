id: theatrical-pop-surreal-spectacle
policy: standard-story
description: 以原创的戏剧化波普超现实视觉语言，创作多样、获奖水准、超写实的成年人广告静帧。每个主题发明一个完整的人体尺度舞台场景，让熟悉的消费品、服务、典礼或社会仪式变成奢华实体布景，包含一眼可读的视觉矛盾。
authoring:
  themes:
    common:
    - 结果应像在真实摄影棚拍摄的奢华编辑制作：饱和色彩、雕塑感人体、精致实体布景、光亮商业表面、不敬的象征碰撞，以及一个决定性冻结动作。不得命名、引用、再现或模仿任何在世艺术家，或任何可辨识的既有艺术作品、广告活动、照片、服装、布景或构图。依据本说明中的具体原则建立全新视觉身份。
    - 以此等式构建每个主题：
    - 普通欲望或社会仪式 + 宏大消费生态 + 一个道德或物理上的反讽逆转 = 一个原创波普超现实广告命题
    - 消费生态不止一个放大的物件。将其可辨识的包装、机制、原料、废弃物、工具、副产物、服务角色和材料状态用作一个连贯场景的组成部分。人物必须主动操作、抵抗、庆祝、演绎或转化该系统。
    - 单靠尺度不是概念。巨物旁站着人物的设计无效。物件必须获得新的社会功能，人物动作必须明显揭露逆转。偏好无需图注、标志或预先知识即可理解的命题。
    - 除非故事描述明确要求其他尺度，否则人物保持普通人体尺度。在他们周围搭建全尺寸戏剧布景。不要默认微型人住在包装、机器、家电、管道、容器、食物、化妆品或解剖腔体内。
    - 布景是象征性舞台，而非微型生存模拟。当物流运作成为主要构思时，拒绝庇护所、市政设施、维修社会、阀门控制工作、缆索运输、临时工作坊、压力系统、家用基础设施，以及人操作巨大机械的设计。机械只能作为更大人类仪式中视觉从属的一部分出现。
    - 每幅图像首先须能读作一个醒目图标式场景：一种人类欲望、公共仪式、华丽灾难、人造天堂或道德碰撞。小型机制与世界构建细节支持这个图标，绝不替代它。
    - 有效逆转示例包括奢侈变成公共劳动、洁净产生可见过剩、便利要求荒诞仪式、虔诚充当客户服务、庆祝变成维护、美丽制造自己的天气、丰裕产生精确短缺，或私人欲望变为市政基础设施。这些是机制，而非固定题材清单；发明不相关的命题，而非改述示例。
    - 这是选集，而非一个连续宇宙。
    - 每个主题必须在以下方面与其他所有主题不同：
    - '- 主角生态及其普通现实功能；'
    - '- 人物目标与社会仪式；'
    - '- 反讽逆转；'
    - '- 地点类型与建筑剪影；'
    - '- 主导配色与次要点缀；'
    - '- 材料行为；'
    - '- 照明设计；'
    - '- 情绪基调；以及'
    - '- 相机语法。'
    - 不要让多个主题收敛为相同夜总会、礼拜堂、美容院、超市、泳池、宴会、工厂、卧室或废墟。不要反复依赖巨型食物、巨型花朵、液体浴、织物迷宫、宗教姿态、微型文明、机械内部或人物只是攀爬物体。
    - 返回主题前，默默与当前批次其他主题比较。如果仅交换主角物件、配色或衣着后相同命题仍成立，则替换该主题。
    - 每个主题必须建立一个能产生所要求数量、视觉各异画面的广告命题。
    - 标题简洁、生动且原创。不包含艺术家姓名、内容等级、相机术语、工作流术语或解释。
    - 前提不超过两句：
    - 1. 第一句确立明确国家、精确地点、时代或年份、反复出现的成年人物阵容、宏大主角生态，以及人物的共同目标。
    - 2. 第二句说明唯一的反讽运作法则、使其可见的决定性物理机制，以及将人物与之绑定的代价、欲望或矛盾。
    - 前提必须为每位反复出现的人物提供稳定、紧凑的身份：国籍、明显成年的二十五岁或以上年龄、肤色、体型、面部结构和头发。严格使用所要求的人物阵容。同一阵容的重复视图不增加人数。
    - 风格字段必须用具体摄影属性而非艺术家参考描述原创制作语言。包括：
    - '- 糖果般饱和的主导配色，至少一种刻意刺眼的互补碰撞，而非雅致邻近色；'
    - '- 精致广告表面与具触感的破败、残留、自然、身体存在或天气之间的密集对比；'
    - '- 宽广正面照明或清脆硬闪光，辅以彩色侧光、发光实景灯源，以及精确分离的肤色；'
    - '- 全尺寸摄影棚或搭建场地逻辑，包含前景、中景和背景事件；'
    - '- 广角或标准镜头，保持场景纵深可读；当面部与身体承载全部象征碰撞时，也可使用严控的肖像镜头；'
    - '- 受巴洛克对角线、祭坛式对称、时尚编辑精度及音乐视频即时感影响的雕塑群像调度，但不复制已知构图；以及'
    - '- 将狂喜的商业精致感与末日、荒诞、精神渴望、环境不安或喜剧断裂平衡的视觉节奏。'
    - 不要在前提中放画面姿势清单。主题定义深厚的视觉系统；每个画面在其中发现不同的决定性图像。
    - 象征材料必须来自主题的社会仪式与主角生态。不得将圣物、民族服装、残障、贫困、灾难、战争或政治苦难贴入场景作为装饰性冲击。不得再现可辨识的经文场景、名画、名人肖像、音乐视频、广告或时尚广告活动。
    - 主题使用典礼、虔诚、加冕、游行、忏悔、朝圣、献祭、洗礼或圣像式姿态时，发明具有原创物件与手势的虚构世俗仪式。让其实际功能在消费生态中可见。
    - 严格使用所要求数量的成年女性和成年男性。所有人都明显至少二十五岁、清醒、自愿、相互回应，并明显能够停止或离开。同一主题的全部画面沿用相同人物阵容；重复倒影、屏幕、雕像、包装肖像、影子或身体碎片不得暗示额外人物。
    - 在一个主题内保留身份、身体细节、头发、身体标记与造型逻辑。只有主题命题明显导致衣着变化时，衣着才可变化。为每个人安排不可或缺的动作；任何参与者都不得充当装饰性背景家具。
    - 除非构图有意近裁，否则展示完整、解剖连贯的身体。手部保持可辨、关节自然、重心有支撑，各个身体占据彼此分开的物理空间。反射与镜面必须匹配人物阵容、姿态、布景几何和相机。
    - 严格通过所要求的内容等级诠释命题。所选等级改变裸露与亲密程度，不改变概念雄心、制作复杂度或人物自主性。
    content_levels:
      aesthetic:
      - 在 aesthetic 等级，使用可安全刊发的身体意识、时尚张力与非露骨互动。不添加性活动。
      erotic:
      - 在 erotic 等级，对命题有用时，使用明确成年人的裸体或遮蔽、非露骨亲密接触、相互凝视、主动回应及强烈身体张力。不引入露骨性活动。
      - 不得把 erotic 或 hardcore 请求净化为中性健康意象，也不得将性强度提高到所选等级之上。最终标题、前提、风格或正文中绝不写出等级名称或解释合规。
      hardcore:
      - 在 hardcore 等级，露骨且自愿的成年性活动可以居于核心，而且该等级生成的每个画面都必须明显包含已经进行中的露骨、自愿成年性行为。仅裸体、色情姿态、隔着障碍物施压、近乎接触、准备、遮蔽、沐浴、身体展示或冻结瞬间之外暗示的性行为均无效。同一露骨互动必须执行主题的社会功能或反讽法则，而非位于无关奇观旁边。决定性接触保持在画面中央的一半内，让每位参与者都主动支撑、执行或回应同一互动；没有参与者操作独立机器或从脱离互动的位置旁观。解剖、接触、支撑、自主性及物理可信度必须明确无误。每位参与者都须保持清醒、回应且能够停止。不得使用伤害、胁迫、醉酒或药物影响、呼吸受限、危险悬挂、失控机械、身体附近的锋利物件或违背解剖的接触。
      - 不得把 erotic 或 hardcore 请求净化为中性健康意象，也不得将性强度提高到所选等级之上。最终标题、前提、风格或正文中绝不写出等级名称或解释合规。
  frames:
    common:
    - 结果应像在真实摄影棚拍摄的奢华编辑制作：饱和色彩、雕塑感人体、精致实体布景、光亮商业表面、不敬的象征碰撞，以及一个决定性冻结动作。不得命名、引用、再现或模仿任何在世艺术家，或任何可辨识的既有艺术作品、广告活动、照片、服装、布景或构图。依据本说明中的具体原则建立全新视觉身份。
    - 除非故事描述明确要求其他尺度，否则人物保持普通人体尺度。在他们周围搭建全尺寸戏剧布景。不要默认微型人住在包装、机器、家电、管道、容器、食物、化妆品或解剖腔体内。
    - 布景是象征性舞台，而非微型生存模拟。当物流运作成为主要构思时，拒绝庇护所、市政设施、维修社会、阀门控制工作、缆索运输、临时工作坊、压力系统、家用基础设施，以及人操作巨大机械的设计。机械只能作为更大人类仪式中视觉从属的一部分出现。
    - 每幅图像首先须能读作一个醒目图标式场景：一种人类欲望、公共仪式、华丽灾难、人造天堂或道德碰撞。小型机制与世界构建细节支持这个图标，绝不替代它。
    - 有效逆转示例包括奢侈变成公共劳动、洁净产生可见过剩、便利要求荒诞仪式、虔诚充当客户服务、庆祝变成维护、美丽制造自己的天气、丰裕产生精确短缺，或私人欲望变为市政基础设施。这些是机制，而非固定题材清单；发明不相关的命题，而非改述示例。
    - 每个叙事画面都是一张独立、满画幅的照片，而非故事板、接触印样、拼贴、分屏或多面板布局。它必须可直接用作文本生成图像提示词，且无需另一个画面即可理解。
    - 每个画面必须自然重述：
    - '- 国家、精确地点、时代或年份及当前时刻；'
    - '- 具有稳定成年人身份的完整重复人物阵容；'
    - '- 每个人确切的姿态、目光、动作、杠杆作用、支撑和回应；'
    - '- 主角生态的尺度、部件、运作功能及物理状态；'
    - '- 作为可见当前因果的主题反讽法则；'
    - '- 前景、中景、背景与负空间组织；'
    - '- 相机距离、高度、角度、镜头特性、焦点层级与纵深；'
    - '- 主光、补光、轮廓光、实景光源、反射、阴影和溢色；以及'
    - '- 每个重要接触点的真实材料反应。'
    - 以视觉情境而非风格标签开头。写成一个流畅正文段落，不含标题、项目符号、字段名、图注或合规语言。不得提及主题、画面、提示词、内容等级、请求设置或指令。
    - 每个画面冻结一个决定性瞬间。使用主动的现在时接触与可见后果：压缩、张力、拖曳、反冲、位移、喷溅、泡沫、断裂、凝结、反射、残留、褶皱、指纹、粉末、液滴或其他适合所选主角的材料反应。不依赖不可见自动化、画外原因、未来事件、书面解释或动作序列。
    - 同一主题内的画面共享人物身份、主角生态、运作法则、地点逻辑和整体制作语言。但它们必须是真正不同的广告主视觉。
    - 任意两个画面之间至少改变以下四项：
    - '- 主角部件或材料状态；'
    - '- 人物动作与分工；'
    - '- 反讽法则的可见后果；'
    - '- 布景区域或建筑尺度；'
    - '- 前景遮挡或取景构框手段；'
    - '- 相机距离或角度；'
    - '- 镜头特性或对焦策略；'
    - '- 主导光线方向；'
    - '- 配色平衡；以及'
    - '- 情绪基调。'
    - 在六画面的主题中，寻求宏大、亲密、动感、庄严、喜剧和诡异等灵活节奏。这些不是固定位置。不得强行安排按时间顺序的开头—中间—结尾，也不得给某个画面编号预留特定叙事角色。
    - 至少一个画面必须包含扎根于主角生态、打破类别的事件：实体材料天气、全尺寸典礼服务、舞台外介入、具有社会角色的包装部件、由产品物流构成的大规模仪式，或同样有力的发明。
    - 多数人物动作必须产生后果。若画面的主要动作只能概括为站立、凝视、触摸、倚靠、躺卧、摆姿、行走、沐浴或攀爬，则拒绝该画面。
    - 偏好：
    - '- 极强饱和的青、品红、猩红、钴蓝、酸黄、祖母绿、紫外紫、瓷白、金属金和发亮肉色之间的碰撞，同时保留可信肤色；'
    - '- 结合人造天堂与可见衰败的全尺寸实体布景：热带植物对模压塑料、花朵对残骸、铬对泥、奢华软垫对洪水残留，或无瑕包装对身体污乱；'
    - '- 汗、残留、凹痕、径流、指纹、碎屑、撕裂箔片、烟、压碎花瓣或其他真实瑕疵打断光亮商业完美；'
    - '- 祭坛式正面对称或金字塔群像剪影，被一条强势巴洛克对角线、下落元素、伸出肢体或材料涌动打破；'
    - '- 拥挤但有层级的场景，决定性身体在缩略图尺度仍可辨，每件背景物体都加强同一象征冲突；'
    - '- 低位英雄角度、直接眼平对峙、正式中广景、受控俯拍和选择性美容特写，而非泛化电影取景；'
    - '- 宽广明亮正面曝光、清脆硬闪光、光亮镜面高光、饱和彩色边缘光、戏剧光束及在布景内始终具有合理物理来源的实景光源；'
    - '- 摆拍戏剧性与真正不稳定的当前瞬间相结合：水横过光洁地面、花朵塌落、包装裂开、化妆品色粉喷发、人造天气进入布景，或搭建的天堂明显失效；'
    - '- 即使在灾难中仍保持雕塑剪影、可读手部、富于表情的面孔、有目的视线及时尚编辑控制；'
    - '- 奢华坎普美学、视觉反讽、人造天堂、消费过剩、精神严肃性、环境不安、明星级魅力，以及没有犬儒疏离的情感真诚；以及'
    - '- 一个主导标志性表达、两个次要象征结构，以及布置丰富但不随机的背景。'
    - 避免泛化霓虹薄雾、空洞夜总会照明、随机宗教符号、装饰杂乱、失重幻想粒子、塑料皮肤、泛化奢华、灰色工业室内、黑暗机械隧道、临时生存装备、蒸汽朋克阀门网络、微型基础设施、没有后果的时尚姿势，以及同一机位的六种变体。
    - 人物占据视觉和情感中心。在中广景画面中，面部、手、躯干、接触和目光保持立即可辨，而非被机械或建筑压得微不足道。主题内至少三分之二画面必须把主要身体置于图像中央的三分之二内，并以足够大的尺度呈现，使其承载象征事件。
    - 为人物赋予强化但具体的情绪状态：狂喜信念、庄严虔诚、华丽反抗、喜剧式自以为重要、疲惫狂喜、公开脆弱，或过剩之中的平静接受。避免泛化微笑、放松、被动惊叹、例行协作和中性专注。
    - 场景应显得刻意布置，但拍到的材料事件必须令人感到真实。对峙能加强命题时，让目光直视镜头；否则在人物与决定性物件之间建立有目的视线闭环。
    - 严格使用所要求数量的成年女性和成年男性。所有人都明显至少二十五岁、清醒、自愿、相互回应，并明显能够停止或离开。同一主题的全部画面沿用相同人物阵容；重复倒影、屏幕、雕像、包装肖像、影子或身体碎片不得暗示额外人物。
    - 除非构图有意近裁，否则展示完整、解剖连贯的身体。手部保持可辨、关节自然、重心有支撑，各个身体占据彼此分开的物理空间。反射与镜面必须匹配人物阵容、姿态、布景几何和相机。
