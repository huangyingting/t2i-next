id: layout-multiview
kind: layout_multiview
authoring:
  themes:
    common:
      - 显式版式参数决定允许的区域数量和网格尺寸。规划一个连贯的整体构图，保留配方规定的区域用途、视觉层级和允许的版式变化。
    content_levels:
      aesthetic: []
      erotic: []
      hardcore: []
  frames:
    common:
      - 每幅完整图像严格采用已选定数量的互不重叠区域，且数量须符合已声明的视图上下界。声明了行数和列数时，必须严格保持对应网格。区域数量表示一幅图像的内部划分，不是叙事画面数量。
      - 每个视图保持在自己的区域内。人体、肢体、家具、建筑和背景绝不能跨区域边界融合、拉伸或连续延伸。
      - 重复的人物视图呈现同一组已确立的身份，不增加阵容人数。在这些视图中保持身份、外貌，以及配方锁定的衣物、配饰和材质事实；不含人体的细节区域仍不得包含人体。
    content_levels:
      aesthetic: []
      erotic: []
      hardcore: []
