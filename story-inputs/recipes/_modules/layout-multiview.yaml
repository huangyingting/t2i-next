id: layout-multiview
kind: layout_multiview
authoring:
  themes:
    common:
      - 布局采用给定的区域数量和网格尺寸，形成连贯的整体构图，保留各区域的用途、视觉层级和允许的版式变化。
  frames:
    common:
      - 每幅完整图像由规定数量的互不重叠区域组成，数量符合给定的视图上下界，网格保持规定的行数和列数。所有区域共同位于这一幅图像的整体边界内。
      - 每个视图保持在自己的区域内。人体、肢体、家具、建筑和背景绝不能跨区域边界融合、拉伸或连续延伸。
      - 重复的人物视图呈现同一组已确立的身份，不增加阵容人数。在这些视图中保持身份、外貌，以及配方锁定的衣物、配饰和材质事实；不含人体的细节区域仍不得包含人体。
