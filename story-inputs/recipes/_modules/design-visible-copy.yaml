id: design-visible-copy
kind: visible_copy
authoring:
  themes:
    common:
      - 画内文案采用语法正确的英文，字符限无重音的 ASCII 拉丁字母、阿拉伯数字、空格和标准标点。为每处文案确定实际载体、位置与排版；文案语言不决定描述性提示词的语言。
  frames:
    common:
      - 每处可见文案都有确定的内容、准确的物理载体、画内位置和排版方式。同一文案在多个位置重复出现时，各处文字内容保持一致，载体、位置和排版分别清楚可辨。
      - 画内每个可读词语都必须是语法正确的英文，只使用无重音符号的 ASCII 字母、阿拉伯数字、空格和标准 ASCII 标点，并遵守配方更严格的文案规则。不得呈现非英文文字系统、带重音的字母、伪字母、自造字形、占位乱文、占位符、畸形词语或乱码。人物、地点、年代和物件均不构成使用当地语言文字的许可。
      - 承载文字的表面只出现已确定的文案。其余表面保持空白、背向镜头、被裁出画面、抽象化，或仅呈现不可读的材料纹理，不引入额外文字。文案逐行清晰，不使用填充段落或不可读的微小文字。
      - 槽位数量、重复出现的位置、允许的载体、排版区域和产品版式均保持配方规定的设计。文案语言与字符集约束的是可见画内文字，而不是描述性提示词的语言。
