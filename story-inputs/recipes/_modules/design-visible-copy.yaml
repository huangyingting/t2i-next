id: design-visible-copy
kind: visible_copy
authoring:
  frames:
    common:
      - 专用画内文字片段是所有可见画内文案的唯一来源，必须位于 Frame 的末尾。所有确切文案都只能在该片段中出现。此前的描述只能使用通用的印刷角色名称，不得拼写、引用、翻译或改述任何可见字符串。
      - '对于可见字符串的每一次实际出现，说明其准确的物理载体、画内位置和排版方式，添加字面 ASCII 字符 `: `，写出确切文案，并以字面 ASCII 字符 `;` 结束。不得用引号包围文案，也不得写出单词 `colon` 或 `semicolon`。Frame 的最后一个字符必须是 `;`。'
      - 画内每个可读词语都必须是语法正确的英文，只使用无重音符号的 ASCII 字母、阿拉伯数字、空格和标准 ASCII 标点，并遵守配方更严格的文案规则。不得呈现非英文文字系统、带重音的字母、伪字母、自造字形、占位乱文、占位符、畸形词语或乱码。人物、地点、年代和物件均不构成使用当地语言文字的许可。
      - 所有承载可读文字的表面都必须使用末尾片段中声明的确切文案。未声明的表面须保持空白、背向镜头、被裁出画面、抽象化，或仅呈现不可读的材料纹理；不得引入额外文字。使用逐行完整指定的文案，不得使用填充段落或不可读的微小文字。
      - 可见文案的序列化不得改变产品设计。槽位数量、重复出现的位置、允许的载体、排版区域和产品版式均由配方规定。文案语言与字符集约束的是可见画内文字，而不是描述性提示词的语言。
