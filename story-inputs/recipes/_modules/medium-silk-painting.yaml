id: medium-silk-painting
kind: silk_painting
authoring:
  themes:
    common:
      - 使用无边框的满幅出血构图。
      - 以细密墨线勾勒轮廓：皮肤与五官采用游丝般细腻的线条，衣物与家具采用铁线般稳定的线条，头发与织物边缘采用发丝般细的重复笔触，建筑采用界画直线。
      - 在熟绢上使用矿物颜料设色，以轮廓围合固有色块，并施以薄染。可见的绢织纹理须贯穿留白与薄色染层；画面表面由线条和颜料界定，而不是由摄影式材质或照明塑造。
