id: post-layout
policy: standard-story
description: 为完成的竖版海报设计创建多样、可直接使用的图像提示词，采用具有触感的二十世纪中叶电影式摄影蒙太奇视觉语言。每个结果可以宣传虚构电影、人物、产品、活动、服务或文化主题，但必须将其转化为一张完整定稿的模拟媒介拼贴海报，而非整洁的广告、情绪板、分镜、流程展示页或备选方案集合。
generation:
  output_language: english
requirements:
  output_languages:
  - english
modules:
- id: design-visible-copy
  parameters:
    product: poster
    copy_language: english
    ascii: required
validation:
  frames:
    checks:
    - type: ascii
    - type: word_count
      max_words: 400
authoring:
  content_levels:
    aesthetic:
    - 在 aesthetic 级别，主导照片必须明确保持非露骨，同时直接呈现 Theme 的主要主体和动作。使用常规遮蔽和非性互动，除非源故事明确要求成年裸体或亲密关系；如确有此要求，表现仍须从属于既定主体。
  themes:
    common:
    - 所选内容级别分支是摄影内容必须遵守的视觉约束，而非情绪、主题名称、文字语气、服装建议或可选的辅助细节。
    - 在任一阶段返回前，将 U+2018 和 U+2019 替换为直撇号，将 U+201C 和 U+201D 替换为直双引号，将 U+2013、U+2014 和 U+2011 替换为普通连字符，将 U+00B7 替换为逗号，将 U+00A0 替换为普通空格；改写所有剩余的非 ASCII 字符。
    - 生成 Theme 时，标题、前提和风格也必须使用仅含 ASCII 字符的英语。
    - 下列示例是灵感，而非预设、配额或固定顺序。组合相容的想法，或发明等效方案。只有使用“必须”“每个”“精确”或“不得”等措辞的陈述才是强制要求。
    - 如果请求包含人物，严格使用指定的人物阵容，不得增加任何人。每位人物都必须明显是至少 25 岁的成熟中国成年人，清醒、自愿、能够回应且随时可以停止。在一个 Theme 内保持身份、年龄、面容、头发、身体比例、衣着及其他锚点不变。
    - 排版、海报文案、单纯裸体、表情、颜色或微小辅助碎片都不能满足所选内容级别。任何纸块、照片裁切、撕边、标题、阴影或重叠碎片都不得隐藏决定性的接触、必需的人体部位、主动参与或内容级别可见性锚点。保留足够的面部与身体信息，同时展现成年身份、人物身份、自愿和回应。
    - 每个 Theme 确立一个设计课题：具体的主体、目的、情境、精确标题、配色家族和视觉身份。
    - 有意识地使用 Theme 结构：`title` 是一至六个词的原创合乎语法的英语标题，每个 Frame 都必须原样重现；`premise` 定义共同主体、情境及一个内容级别可见性锚点，明确每个 Frame 必须呈现的当前互动或非露骨表现；`style` 用一句简洁的话锁定配色家族、材料语言和视觉身份。不得翻译标题。绝不能用情绪、口号、未来动作、准备行为或排版替代可见性锚点。
    - 在不同 Theme 之间变化主体类别、地点、受众、情绪温度、年代、材料语言、配色和版式潜力。返回一批 Theme 前，逐对比较；若任何一对共享相同的前提家族、场景功能、年代或风格体系，则改写它们。不得为同一个虚构故事生成多个宣传活动。
    - 各 Frame 是同一个 Theme 的并行完成版海报提案，绝非按时间排列的阶段。保持 Theme 的具体主体、精确标题、内容级别可见性锚点、专色家族、印刷材料语言及身份锚点。保持竖版海报形式，同时让每个 Frame 的拼贴结构、主图裁切、标题几何、碎片位置、重叠节奏、焦点层级及图文关系都显著不同。仅改变颜色、摄影角度或装饰不算新布局。独立完整地描述每个 Frame，不得使用“相同”“仍然”“再次”或其他省略连续信息的措辞。
    - 生成 Theme 时，仅返回共同设计概念、其必须包含的内容级别可见性锚点，以及一句简洁的风格描述。不得包含 Frame 草稿、字段模板、数量值、备选版式或后续阶段指令。
    - 所有 Theme 都须属于模拟媒介电影式摄影蒙太奇家族，同时根据主体、受众和目的形成独特版本。选择克制的奶油色与黑色基底、一至三种专色、一种主导纸张关系、一种摄影处理及一种印刷年代取向。除非用可见选择明确其含义，否则避免“高端”“电影感”“现代”或“奢华”等泛泛表述。
    - 通过纪实新闻纸、丝网印刷色块、严峻的凸版印刷、电影档案纸品、复印反文化、接触印样摄影或其他相容的模拟印刷方向变化处理方式。不得偏向整洁的企业极简风、光亮的三维广告、精致界面设计、泛化数字渐变或无关的未来主义图形。不得模仿具名艺术家、现有宣传活动、受版权保护的角色或可识别品牌。
    - 将每种痕迹放在有物理依据的位置：半色调属于复制摄影，油墨扩散属于印刷文字，套准偏差属于专色图层，折痕磨损属于外露纸脊，胶水阴影属于粘贴边缘，胶片齿孔属于摄影条带。不得给整张图统一套用复古滤镜，也不得仅为制造年代感而堆叠无关损伤。
  frames:
    common:
    - 所选内容级别分支是摄影内容必须遵守的视觉约束，而非情绪、主题名称、文字语气、服装建议或可选的辅助细节。
    - 将主体、场景、构图、风格、文字、细节及输出作为七项内部规划关注点，而非逐字输出格式。按照这个概念顺序涵盖七项内容，将它们整合为一个紧凑、自然、可直接成像的提示词。不得输出这些关注点名称、字段标签、前缀、标题、模板、规划笔记、解释或可选分支。
    - 生成图像中的每个可读词都必须是以 ASCII 拉丁字母书写、合乎语法的英语，包括主标题、副标题、标签、署名、引文、日期、徽章、注释、报纸、文件、票券、包装、标牌、衣物、胶片条及环境图形。
    - 报纸和档案碎片不得包含密集生成的段落。使用空白分栏纹理和半色调线条，或仅使用在图中文字段落中连同位置明确声明的简短精确英语片段。若某个词未在该段落中明确声明，则不得在图像任何位置可读。
    - 在任一阶段返回前，将 U+2018 和 U+2019 替换为直撇号，将 U+201C 和 U+201D 替换为直双引号，将 U+2013、U+2014 和 U+2011 替换为普通连字符，将 U+00B7 替换为逗号，将 U+00A0 替换为普通空格；改写所有剩余的非 ASCII 字符。
    - 无论请求的输出语言为何，Frame 全文必须使用英语。完整 Frame 的每个字符都必须位于 ASCII 码点 0 至 127。
    - '可见文案的序列化不得改变海报设计。字符串数量和排版区域数量不固定。不得删除或简化编辑碎片、署名、引文、日期、场地细节、徽章、注释、档案材料、载体多样性、竖排或旋转文字、实验性排版。精确撰写每个可读字符串，使用完整指定的文字行，而非填充文字、乱码、畸形文字或不可读微小文字。每个最终条目在文案前使用字面字符 `: `，在文案后使用 `;`；绝不能写出单词 "colon" 或 "semicolon"，也不得用引号包围文案。Frame 的最后一个字符是 `;`。'
    - 下列示例是灵感，而非预设、配额或固定顺序。组合相容的想法，或发明等效方案。只有使用“必须”“每个”“精确”或“不得”等措辞的陈述才是强制要求。
    - 每个 Frame 都必须在视觉上属于同一个模拟媒介编辑海报家族：
    - 一张主导的单色摄影主图，裁切必须足够宽，承载所选内容级别的主体、关系和决定性的身体互动，而非将其缩减为一张脸；
    - 两至四个较小的纪实、环境、物体、剪影或胶片条图像碎片，丰富主体但不与主图竞争；
    - 一个超大的窄体标题，拼装于撕裂纸块上，融入中部或下部的视觉层级；
    - 少量简短英语编辑片段、署名、引文块、日期或场地细节，或类似评论的摘句，作为真实印刷品排列，每项均逐字声明并标明精确物理位置；
    - 重叠的撕纸，具有不规则毛边、粘贴接缝、轻微卷曲、胶水阴影和可见层次深度；
    - 温暖老化的奶油色纸张、浓黑油墨，以及克制的一至三种饱和专色，如朱红、钴蓝或芥末黄；
    - 半色调网点、复印颗粒、粗糙新闻纸、油墨扩散、轻微套准偏差、折痕磨损、擦痕及偶尔出现的胶片齿孔；以及
    - 非对称但受控的阅读路径，仿佛由果断的印刷设计师组装，而非随机散落。
    - 参考仅确立这套设计语法。不得复现其中的人物、标题、引文、语言、电影、精确位置或可识别艺术作品。为每个 Theme 创作原创内容。
    - 排版、海报文案、单纯裸体、表情、颜色或微小辅助碎片都不能满足所选内容级别。任何纸块、照片裁切、撕边、标题、阴影或重叠碎片都不得隐藏决定性的接触、必需的人体部位、主动参与或内容级别可见性锚点。保留足够的面部与身体信息，同时展现成年身份、人物身份、自愿和回应。
    - 撰写最终正文前，按下列概念顺序，通过七项关注点组织可见设计。它们的名称仅供内部创作提示，不得作为标签、标题或前缀出现在回答中：
    - 1. 确立主要主体、决定性外观、所选内容级别可见性锚点、当前动作或功能，以及必须主导识别的一项特征。
    - 2. 确立具体场景、目标受众、使用情境及叙事或信息背景。
    - 3. 定义裁切或拍摄距离、拼贴结构、焦点层级、位置、阅读路径和受保护的留白，不得重复宽高比。
    - 4. 通过材料、照明、色彩、年代、纹理和编辑语气定义一套连贯的视觉语言。
    - 5. 将精确英语 Theme 标题及所有其他可见字符串规划在特定海报区域的具体纸张层或物体上，暂不写出文案。最终在图中文字段落中序列化每个计划字符串，每个字符串使用一个说明载体和位置的冒号条目。
    - 6. 只添加能强化主要构想的少量辅助物体、提示标注、纸张层或装饰元素。
    - 7. 以图像质量、边缘处理、文字保真度、印刷工艺和最终可读性要求收尾，不指定输出尺寸或宽高比。
    - 写成一个紧凑流畅的段落，而非七行带标签文字。让七项关注点塑造信息流，但不暴露模板。最终提示词中不得残留括号、占位符、实现笔记或多选式措辞。无论请求何种输出语言，完整 Frame 正文都必须是仅含 ASCII 字符的英语。
    - 以一个主导拼贴结构构建每个竖版 4:5 海报 Frame。自由变化结构：主图可偏重顶部、居中裁切、推至边缘、被标题纸块截断、从纸张裂口露出，或被斜带穿过；辅助碎片可锚定角落、形成胶片条、构成纪实底部，或与标题形成配重。这些是构图手法，而非固定槽位。
    - 主导照片应占据海报约一半面积，但不能变成整洁的满版出血肖像。使用一个主要焦点、一个有力的标题区、从属图像碎片及清晰的阅读路径。撕裂和重叠造成的刻意遮挡只能位于所选内容级别可见性锚点之外。保留决定性的面容、手势、身体接触、必需人体部位、产品特征或事件线索。当所选级别依赖互动时，使用足够宽的裁切，在一个能够立即读懂的碎片内展现所有参与者的主动角色及完整的决定性接触。确保主图和标题在缩略图尺寸下仍清晰可读。
    - 必须进行有意识的拼贴，但须形成一个完整海报提案。同一主角的重复摄影裁切可以作为印刷来源碎片使用，不算增加人物。不得在海报中呈现备选布局、使用六个等大方格、给所有碎片相同视觉权重、让元素无纸张支撑地悬浮，或把标题作为干净的数字覆盖层。
    - 将文字视为拼贴内部的实体印刷材料，而非事后添加的说明。在一个 Theme 内锁定精确英语标题。辅助文案必须少量、有目的、完整指定且仅使用英语；绝不让模型自行编造填充段落。对每个精确字符串，说明其印在标题纸块、粘贴碎纸、票券、照片边缘、署名条、徽章、标牌或其他具体载体上，并在最终图中文字段落中标明精确海报位置。文字可以辅助所选内容级别，但绝不能承载或替代必需的身体证据。专用图中文字段落之外不得重复可见字符串，不得暗示额外环境文案。禁止中文或其他文字系统、乱码、伪字母、假标志、水印、无意义拉丁占位文及不可读微小文字。
    - 指定字号、字重、对齐、间距、对比、实体纸张基材，以及与相邻撕边和照片的关系，不得指名受版权保护的视觉身份。标题必须使用超大窄体块状字，具有可信油墨纹理；辅助文案可以使用紧凑的无衬线体、粗衬线体或打字机式印刷。确保标题立即可读，额外文字层级最多两个。
    - 通过纪实新闻纸、丝网印刷色块、严峻的凸版印刷、电影档案纸品、复印反文化、接触印样摄影或其他相容的模拟印刷方向变化处理方式。不得偏向整洁的企业极简风、光亮的三维广告、精致界面设计、泛化数字渐变或无关的未来主义图形。不得模仿具名艺术家、现有宣传活动、受版权保护的角色或可识别品牌。
    - 将每种痕迹放在有物理依据的位置：半色调属于复制摄影，油墨扩散属于印刷文字，套准偏差属于专色图层，折痕磨损属于外露纸脊，胶水阴影属于粘贴边缘，胶片齿孔属于摄影条带。不得给整张图统一套用复古滤镜，也不得仅为制造年代感而堆叠无关损伤。
    - 将每个 Frame 视为由不同印刷照片、纸张形状及文字元素组装而成的最终实体合成品。每个摄影碎片内，每个人物或物体都须拥有一个连贯的位置、尺度、朝向、支撑和相容功能。保持人体自然、产品几何完整、印刷层透视一致、粘贴边缘阴影可信，并让重复裁切可识别地关联同一来源身份。
    - 以足够对比和整洁空间保护所有必需文字。不得让重要文案穿过复杂的面部、手部、人体、反光高光、深褶皱或透视表面，除非周围的构图描述明确保证这种整合仍然可读。
    - 写成一个紧凑流畅的英语段落。目标为 220 至 320 个英语单词，绝不超过 400 个。每个短语都必须控制可见内容、拼贴层级、精确文字、纸张层、印刷痕迹或工艺。以采用冒号和分号条目的专用图中文字段落结尾。
    - 返回前确认：正文是一个自然的 ASCII 英语段落，无七部分标签或前缀；七项内容关注点均按概念顺序涵盖；仅应用请求的内容级别分支；Theme 的内容级别可见性锚点直接出现在主导照片中，而非文字、情绪、准备行为、单纯裸体或微小碎片中；该分支所需的每位参与者、动作、接触和人体细节都可见且无遮挡；精确英语 Theme 标题、主体和专色不变；构图及最终输出质量措辞不含重复宽高比或尺寸要求；每个可见字符串在最终专用图中文字段落中出现一次，位于 ASCII 冒号之后、ASCII 分号之前，并明确实体载体和海报位置；可见文案外围无引号；所有字符串仅使用允许的 ASCII 英语字符；其他段落不写出或引入可读文案；生成海报任何位置都没有非英语字形；主导单色主图、撕裂标题纸块、从属摄影碎片、编辑碎纸、实体纸张深度和模拟印刷痕迹都可见；主要视觉与标题层级在缩略图下仍成立；每个承诺出现的词都可读；结果仅描述一张完成的海报。改写任何未通过检查的 Frame。删除重复形容词、背景故事、象征解释、观众反应及无助于层级或可渲染性的细节。
    content_levels:
      erotic:
      - 在 erotic 级别，每个 Frame 都必须在主导照片中明确可见地呈现非露骨的成年亲密互动。将成年裸体、亲密接触或明确的身体张力作为当前身体主体，而非普通着装肖像、分开摆姿、准备行为、暗示性排版或单纯气氛。多人参与时，每位指定成年人都须通过视线、姿态或主动接触表现出自愿、回应和投入，同时不显示生殖器接触或露骨性行为。
