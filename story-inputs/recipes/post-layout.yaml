id: post-layout
description: 为完成的竖版海报设计创建多样、可直接使用的图像提示词，采用具有触感的二十世纪中叶电影式摄影蒙太奇视觉语言。每个结果可以宣传虚构电影、人物、产品、活动、服务或文化主题，但必须将其转化为一张完整定稿的模拟媒介拼贴海报，而非整洁的广告、情绪板、分镜、流程展示页或备选方案集合。
modules:
- id: design-visible-copy
  parameters:
    product: poster
    copy_language: english
    ascii: required
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 主导照片必须明确保持非露骨，同时直接呈现 Theme 的主要主体和动作。使用常规遮蔽和非性互动，除非源故事明确要求成年裸体或亲密关系；如确有此要求，表现仍须从属于既定主体。
    erotic:
      frames:
      - 每个 Frame 在主导照片中呈现非露骨的亲密互动，以裸体、亲密接触或明确身体张力作为当前主体，而非普通着装肖像、分开摆姿、准备行为、暗示性排版或单纯气氛。多人参与时，每位指定人物通过视线、姿态或主动接触表现回应和投入，不显示生殖器接触或露骨性行为。
      - 对于 Frame，至少一个较小摄影碎片必须通过不同且有意义的裁切或视角强化同一个所选级别互动，不得编造第二个事件。所有其他包含参与者的碎片都必须保持相同身份、衣着状态、关系和当前互动情境，不得以中性或完全脱节的描绘与主图矛盾。
    hardcore:
      frames:
      - 每个 Frame 将直接露骨的互动置于主导照片中，涉及的人体部位与当前精确接触清晰，每位指定人物的动作和回应明确。不得用肖像、单纯裸体、分离身体、准备行为、对位、暗示、文字或微小辅助碎片代替。
      - 对于 Frame，至少一个较小摄影碎片必须通过不同且有意义的裁切或视角强化同一个所选级别互动，不得编造第二个事件。所有其他包含参与者的碎片都必须保持相同身份、衣着状态、关系和当前互动情境，不得以中性或完全脱节的描绘与主图矛盾。
  themes:
    common:
    - 所选内容级别分支是摄影内容必须遵守的视觉约束，而非情绪、主题名称、文字语气、服装建议或可选的辅助细节。
    - 如果请求包含人物，严格使用指定阵容，不得增加任何人。人物具有成熟的中国人外貌，在一个 Theme 内保持身份、年龄、面容、头发、身体比例、衣着及其他锚点不变。
    - 排版、海报文案、单纯裸体、表情、颜色或微小辅助碎片不能替代所选级别的可见内容。纸块、照片裁切、撕边、标题、阴影或重叠碎片不得隐藏决定性接触、必需人体部位或主动参与；面部、人物身份和身体回应保持清晰。
    - 每个 Theme 确立一个设计课题：具体的主体、目的、情境、精确标题、配色家族和视觉身份。
    - 每个 Theme 具有简短、合乎语法的原创英语标题，在每个 Frame 的画面中原样重现；共同主体、情境、当前互动或非露骨表现、配色家族、材料语言和视觉身份保持一致。情绪、口号、未来动作、准备行为或排版不能替代当前可见内容。
    - 不同 Theme 变化主体类别、地点、受众、情绪温度、年代、材料语言、配色和版式，不反复呈现同一个虚构故事的宣传活动。
    - 各 Frame 是同一个 Theme 的并行完成版海报提案，绝非按时间排列的阶段。保持 Theme 的具体主体、精确标题、内容级别可见性锚点、专色家族、印刷材料语言及身份锚点。保持竖版海报形式，同时让每个
      Frame 的拼贴结构、主图裁切、标题几何、碎片位置、重叠节奏、焦点层级及图文关系都显著不同。仅改变颜色、摄影角度或装饰不算新布局。每个 Frame 独立呈现完整视觉信息。
    - 所有 Theme 都须属于模拟媒介电影式摄影蒙太奇家族，同时根据主体、受众和目的形成独特版本。选择克制的奶油色与黑色基底、一至三种专色、一种主导纸张关系、一种摄影处理及一种印刷年代取向。除非用可见选择明确其含义，否则避免“高端”“电影感”“现代”或“奢华”等泛泛表述。
    - 通过纪实新闻纸、丝网印刷色块、严峻的凸版印刷、电影档案纸品、复印反文化、接触印样摄影或其他相容的模拟印刷方向变化处理方式。不得偏向整洁的企业极简风、光亮的三维广告、精致界面设计、泛化数字渐变或无关的未来主义图形。
    - 将每种痕迹放在有物理依据的位置：半色调属于复制摄影，油墨扩散属于印刷文字，套准偏差属于专色图层，折痕磨损属于外露纸脊，胶水阴影属于粘贴边缘，胶片齿孔属于摄影条带。不得给整张图统一套用复古滤镜，也不得仅为制造年代感而堆叠无关损伤。
  frames:
    common:
    - 所选内容级别分支是摄影内容必须遵守的视觉约束，而非情绪、主题名称、文字语气、服装建议或可选的辅助细节。
    - 生成图像中的每个可读词都必须是以 ASCII 拉丁字母书写、合乎语法的英语，包括主标题、副标题、标签、署名、引文、日期、徽章、注释、报纸、文件、票券、包装、标牌、衣物、胶片条及环境图形。
    - 报纸和档案碎片保持低文字密度，使用空白分栏纹理、半色调线条或简短精确的英语片段。
    - 文案数量和排版区域数量不固定。保留编辑碎片、署名、引文、日期、场地细节、徽章、注释、档案材料、多样载体、竖排或旋转文字及实验性排版；可读文案使用完整清晰的文字行，而非填充文字、乱码、畸形文字或不可读微小文字。
    - 每个 Frame 都必须在视觉上属于同一个模拟媒介编辑海报家族：
    - 一张主导的单色摄影主图，裁切必须足够宽，承载所选内容级别的主体、关系和决定性的身体互动，而非将其缩减为一张脸；
    - 两至四个较小的纪实、环境、物体、剪影或胶片条图像碎片，丰富主体但不与主图竞争；
    - 一个超大的窄体标题，拼装于撕裂纸块上，融入中部或下部的视觉层级；
    - 少量简短英语编辑片段、署名、引文块、日期、场地细节或类似评论的摘句，以清晰字形和明确位置作为真实印刷品排列；
    - 重叠的撕纸，具有不规则毛边、粘贴接缝、轻微卷曲、胶水阴影和可见层次深度；
    - 温暖老化的奶油色纸张、浓黑油墨，以及克制的一至三种饱和专色，如朱红、钴蓝或芥末黄；
    - 半色调网点、复印颗粒、粗糙新闻纸、油墨扩散、轻微套准偏差、折痕磨损、擦痕及偶尔出现的胶片齿孔；以及
    - 非对称但受控的阅读路径，仿佛由果断的印刷设计师组装，而非随机散落。
    - 排版、海报文案、单纯裸体、表情、颜色或微小辅助碎片不能替代所选级别的可见内容。纸块、照片裁切、撕边、标题、阴影或重叠碎片不得隐藏决定性接触、必需人体部位或主动参与；面部、人物身份和身体回应保持清晰。
    - 主体、具体场景、目标受众、当前动作、裁切距离、拼贴结构、焦点层级、阅读路径、留白、材料、照明、色彩、年代与编辑语气形成连贯设计。少量辅助物体、纸张层和装饰服务主导构想。
    - 以一个主导拼贴结构构建每个竖版 4:5 海报 Frame。自由变化结构：主图可偏重顶部、居中裁切、推至边缘、被标题纸块截断、从纸张裂口露出，或被斜带穿过；辅助碎片可锚定角落、形成胶片条、构成纪实底部，或与标题形成配重。这些是构图手法，而非固定槽位。
    - 主导照片应占据海报约一半面积，但不能变成整洁的满版出血肖像。使用一个主要焦点、一个有力的标题区、从属图像碎片及清晰的阅读路径。撕裂和重叠造成的刻意遮挡只能位于所选内容级别可见性锚点之外。保留决定性的面容、手势、身体接触、必需人体部位、产品特征或事件线索。当所选级别依赖互动时，使用足够宽的裁切，在一个能够立即读懂的碎片内展现所有参与者的主动角色及完整的决定性接触。确保主图和标题在缩略图尺寸下仍清晰可读。
    - 必须进行有意识的拼贴，但须形成一个完整海报提案。同一主角的重复摄影裁切可以作为印刷来源碎片使用，不算增加人物。不得在海报中呈现备选布局、使用六个等大方格、给所有碎片相同视觉权重、让元素无纸张支撑地悬浮，或把标题作为干净的数字覆盖层。
    - 文字是拼贴内部的实体印刷材料，而非事后添加的说明。同一 Theme 的精确英语标题保持不变，辅助文案少量且仅使用英语。每段文案印在位置明确的标题纸块、粘贴碎纸、票券、照片边缘、署名条、徽章或标牌上，不以文字替代必需身体内容。画面不含其他文字系统、乱码、伪字母、假标志、水印、占位文或不可读微小文字。
    - 字号、字重、对齐、间距、对比、实体纸张基材及相邻撕边与照片的关系明确。标题使用超大窄体块状字和可信油墨纹理；辅助文案可使用紧凑无衬线体、粗衬线体或打字机式印刷。标题立即可读，额外文字层级最多两个。
    - 通过纪实新闻纸、丝网印刷色块、严峻的凸版印刷、电影档案纸品、复印反文化、接触印样摄影或其他相容的模拟印刷方向变化处理方式。不得偏向整洁的企业极简风、光亮的三维广告、精致界面设计、泛化数字渐变或无关的未来主义图形。
    - 将每种痕迹放在有物理依据的位置：半色调属于复制摄影，油墨扩散属于印刷文字，套准偏差属于专色图层，折痕磨损属于外露纸脊，胶水阴影属于粘贴边缘，胶片齿孔属于摄影条带。不得给整张图统一套用复古滤镜，也不得仅为制造年代感而堆叠无关损伤。
    - 将每个 Frame 视为由不同印刷照片、纸张形状及文字元素组装而成的最终实体合成品。每个摄影碎片内，每个人物或物体都须拥有一个连贯的位置、尺度、朝向、支撑和相容功能。保持人体自然、产品几何完整、印刷层透视一致、粘贴边缘阴影可信，并让重复裁切可识别地关联同一来源身份。
    - 以足够对比和整洁空间保护所有必需文字。不得让重要文案穿过复杂的面部、手部、人体、反光高光、深褶皱或透视表面，除非周围的构图描述明确保证这种整合仍然可读。
