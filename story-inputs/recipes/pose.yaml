    - 无文字参考板：不得呈现标题、姿势名称、区域标签、数字、字母、测量标记、箭头、图解、标志、说明文字、伪文字、水印或签名。姿势类别名称和区域位置仅用作内部创作参考。
    - 风格、背景与光线：采用超写实成人专题姿势摄影，人体结构清晰、支撑可信、材质明确。选择一种克制的视觉体系：精确摄影棚风格、温暖私人套房专题风格、雕塑感单色、柔和日光闺房、极简戏剧布景，或原创的等效风格。
    - 风格、背景与光线：整张参考板使用同一共享背景和同一套具有合理光源依据的照明。六个区域的肤色、服装颜色、材质响应、阴影方向与曝光保持一致。家具必须实际支撑某种所选姿势，而不是充当装饰性杂物。
    - 风格、背景与光线：共享背景仅指在同一幅画面内共享。不要求不同画面或主题重复使用相同场合、房间、背景、家具设计、时段或照明设置。每幅新画面都必须先重新建立其自身单一、自洽的环境，再描述六个区域。
    - 风格、背景与光线：光线必须揭示关节、肢体分离、支撑接触点、骨盆朝向、肌肉张力、面料挤压及轮廓。避免手脚处死黑的阴影、皮肤过曝高光、抹去人体结构的修图、塑料皮肤，或令姿势含糊的戏剧化效果。
    - 画面阶段输出：写成一个可直接成像的段落，不设固定字数或词数。不得提及 `theme.title`、用作标签的姿势名称、库条目、随机选择、内部区域、内容级别或生成指令。
    - 画面阶段输出：每幅画面是一条自足的输出记录，在发布的提示词文件中恰好占一个物理行。将参考板概述和全部六个区域的完整描述放在该画面的一个连续自然语言段落中，不得换行。请求多幅画面时，每幅画面都必须独立重新描述一张完整的六区域参考板。绝不可将一张参考板分散到多幅画面、每个区域单占一幅画面，或在下一幅画面中延续上一张参考板或区域。
    - 画面阶段输出：开头自然说明一张精致、无文字的女性六姿势参考板铺满横向画布。随后确立女性的稳定身份，符合内容级别的确切服装与配饰单品及其材质、颜色、合身度、扣合方式、鞋履和遮盖，以及共享的场合、地点、背景、网格层级与具有合理光源依据的照明。让场合在视觉上具体明确，而不只是称作摄影棚、房间或室内。不得仅因可穿戴造型已在主题设定中出现就将其省略。先描述主导区域，再按清晰的空间顺序描述五个辅助区域。每个区域都须说明完整的保持姿势、支撑接触点、各肢体独立的几何关系、躯干与骨盆力学、头部与视线、表情、服装响应、确切镜头方位、最近的可见身体侧面、机位高度、俯仰角、透视及全身构图。使用诸如从左侧髋部高度取前侧四分之三视角并适度仰拍的具体措辞，不得使用动态角度或电影感视角等模糊标签。
    - 画面阶段输出：只描述最终可见的参考板。不得叙述过渡、比较不同姿势、解释姿势选择、提供备选方案，或包含负面提示词字段。
    - 最终验证：任何主题或画面只要未通过一项检查，就须在内部重写：
    - 最终验证：1. 反复描绘的恰好是一位年满25岁的中国女性；六个身体均是她的参考描绘，不得出现或暗示其他人。
    - 最终验证：2. 从至少四个姿势类别中，不按顺序选出了恰好六种不同的静态姿势蓝图。
    - 最终验证：3. 分配了恰好六种不同的镜头角度蓝图，使用至少四种方位类别、至少三个高度或俯仰角度带，且没有重复或镜像等效的角度组合。
    - 最终验证：4. 参考板包括偏前方、正侧面或近正侧面，以及偏后方视角，每个区域都明确说明方位、最近的身体侧面、机位高度、俯仰角和透视。
    - 最终验证：5. 每种姿势都通过身体力学独立达到性意图门槛，而非仅凭裸体、内衣、表情或镜头角度。
    - 最终验证：6. 任何姿势都未偏离为中性的舞蹈、瑜伽、健身、康养、时装、人像、睡眠或随意斜倚。
    - 最终验证：7. 任意两种姿势都不得在轮廓、身体层位、躯干方向、骨盆朝向、肢体几何关系或支撑方式上近似重复。
    - 最终验证：8. 每种姿势都有宽大可见的支撑、可信的重心、可追踪的脊柱与关节、左右肢体各自的分工、完整的手脚，以及一个物理上能够保持的状态。
    - 最终验证：9. 每个分配的镜头角度都让关键骨盆线索、大腿几何关系、脊柱曲线、面部及所有承重接触点清晰可读，不出现孤立身体部位裁切或极端透视畸变。
    - 最终验证：10. 所选内容级别控制服装、遮盖、自我触碰、表情、裁切与露骨程度，不消除性暗示，也不引入伴侣或多步骤性行为序列。
    - 最终验证：11. 主题及每幅画面都点明具体可穿戴造型，其确切服装、配饰、材质、颜色、合身度、扣合方式、鞋履与遮盖满足所选内容级别；服装绝不隐含、不泛化，也不以裸体一词代替。
    - 最终验证：13. 身份、头发、服装、遮盖、鞋履、配饰、妆容及身体比例在全部六个区域中保持一致。
    - 最终验证：14. 一个主导区域与五个辅助区域组成整洁、不重叠的横向网格；每个区域都以有参考价值的尺度展示一个从头至脚完整的身体。
    - 最终验证：15. 没有身体跨过区域间隔、与其他视角融合、多出人体部位，或因裁切、头发、衣物、阴影而失去承重接触点。
    - 最终验证：16. 整张参考板采用统一的背景、镜头逻辑、配色和照明设置。
    - 最终验证：17. 每幅画面都点明六个区域共享的一个具体场合与地点，而不同画面和主题采用明显不同的环境类别，不重复某一个泛化摄影棚、酒店或公寓。
    - 最终验证：18. 符合环境的支撑物保留主题层级的每项支撑几何结构、身体接触点、重心和轮廓，不在同一参考板内混合无关地点。
    - 最终验证：19. 完成的参考板没有可见标题、姿势名称、区域标签、数字、字母、图解、说明文字、标志或伪文字。
    - 最终验证：20. 每幅画面都独立包含参考板概述及全部六个区域的展开描述；没有任何画面只是一个区域、参考板片段或另一幅画面的延续。
    - 最终验证：21. 最终输出使用所请求的语言，写成位于一个物理行上的一个流畅段落，且仅包含完成图像的描述。
    - 将服装尺度与身体遮盖视为严格的暴露程度递进。不得仅改变形容词就重复使用同一种连体衣、长袍、束身衣或束带设计。若某造型的遮盖可能被误认为属于另一内容级别，须在内部将其淘汰。
    - 每幅画面都必须在描述区域之前，用可见图像语言完整重述所选造型；不得依赖主题设定作为省略的上下文。每个区域内须说明与该姿势有关的任何可见褶皱、张力、移位或遮盖，不得虚构、移除、打开或重新排列任何单品。
