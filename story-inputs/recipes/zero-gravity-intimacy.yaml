id: zero-gravity-intimacy
policy: standard-story
description: '创作多样化、精致、超写实且具有电影感的成人浪漫主题，场景位于零重力航天器内部。每个主题都必须围绕精确要求的阵容，呈现自愿且符合内容级别的失重亲密互动。将航天器、漂浮物、变化的身体朝向、惯性、抓握点、光线、面部表情、身体遮盖、肌肤接触、衣物或可穿戴设备的运动，以及天体景观具体化，使其足以直接用于文生图。


  每个人都保持明确成熟、清醒、主动自愿、相互回应并能够停止。不得包含胁迫、羞辱、受伤、惊恐、醉酒或药物影响、无助或不安全行为。


  以下所有列表均为灵感，而非菜单、枚举、预设库或多项选择指令。可以组合相容的示例、加以变换或创作新的等效方案。只有使用“必须”（"must,"）、“每个”（"every,"）、“精确”（"exact,"）或“不得”（"do
  not"）的陈述才是强制要求。


  每件衣物和可穿戴设备都必须属于航天器场景。采用贴身、不易钩挂的结构；固定的闭合件；短线缆；柔软边缘；以及可见的快拆点。任何物品都不得拖入舱口、遮挡抓握点、限制呼吸、造成缠绕危险，或将维系生命的关键设备改作束缚工具。脱下的松散衣物必须固定在储物网中，而非在舱内漂浮。'
authoring:
  content_levels:
    aesthetic:
    - 在 aesthetic（美学）级别，使阵容完整或大部分穿着协调的航天服装。聚焦温柔、协调漂移、富于表情的面孔、手、轮廓和航天器环境，而非裸体。
    erotic:
    - 裸体成年人可以保留航天器专用可穿戴设备，如生物传感贴片、遥测腰带、柔软快拆系绳束带、腕部显示屏、通讯耳机、医疗监测导线或紧凑环境控制颈圈。每个情色主题都必须通过部分或完整裸体、持续的肌肤相贴身体接触、强烈亲密的失重配置或其相容组合，确立明确的成人感官状态。完整着装的拥抱、普通亲吻、遥远剪影或浪漫情绪本身不足以满足情色级别。
    hardcore:
    - 在 hardcore（硬核色情）级别，每个主题和每幅画面都呈现一种已经在发生且清晰可见的自愿成人性互动。保持可信的零重力接触几何、相互身体反应、主动控制、畅通呼吸，以及即时可及的抓握点或个人快拆可穿戴设备。不得将维系生命的关键航天器设备用作束缚，也不得让露骨互动遮蔽航天器、漂浮状态或阵容的自主意愿。
  themes:
    common:
    - 主题阶段必须直接遵守所要求的内容级别；不得将内容强度推迟到后续画面生成。每个主题的情境设定必须说明当前互动、身体遮盖状态和航天器可穿戴设备逻辑，并在视觉上符合所要求级别。每个主题的风格必须通过相机距离、构图、光线、轮廓和材质细节来强化该级别，且不与情境设定矛盾。
    - 每个主题必须使用不同的航天器区域、天体背景、漂浮物系统、关系动态、情绪张力、照明逻辑和零重力运动模式。主题之间不得只有相机角度不同。
    - 为每个主题赋予一个简洁且有电影感的标题。情境设定必须确立成人阵容、航天器内私密地点、共享的情绪情境，以及一种物理上可理解的失重互动。风格必须用一个流畅句子定义构图、配色、光源、材质呈现、镜头表现，以及使主题可识别的视觉规则。
    - 航天器地点：带面向地球全景窗的圆形观测舱；两侧布满扶手与软垫面板的狭窄转移通道；配两个壁挂睡袋的安静睡眠舱；装有密封仪器和样品容器的紧凑实验室；由导航显示屏照亮的指令舱；具有外露管道、储物网和检修灯的维护舱；带漂浮叶片与系固植物的温室舱；由深色结构框架环绕的穹顶窗；设备整齐固定的气闸准备区；重复圆形舱口贯穿的长圆柱形生活舱；笼罩于暗红应急灯光中的走廊；带温暖可调照明的极简私人舱室。
    - 天体背景：在航天器下方缓慢移动的蓝色地球弧线；地球上方破晓，带一层薄金色大气；夜面地球遍布零星城市灯光；明亮月球悬于观测窗外；绝对黑暗衬托的密集星野；沿行星极区边缘发亮的极光；远处风暴系统在海洋上旋转；窗外太阳能板上闪过阳光；航天器由白昼进入轨道黑夜；柔和反射地球光将舱内染蓝。
    - 漂浮物：映出微小变形面孔的圆水滴；在舱内缓慢翻转的散页纸张；端对端翻滚漂移的银色笔；在空中形成柔软曲线的细安全带；在观测窗附近旋转的小照片；描画微弱气流方向的布带；带柔性吸管的密封饮料袋；从储物袋中逸出的小检查卡；漂浮在伴侣之间的轻便耳机；捕捉彩色显示屏光的透明样品球；缓缓展开如花的折叠布；从系绳脱落的小型人造植物叶片；一双朝相反方向旋转的软手套；穿过光束时闪烁的金属环。
    - 航天服装与可穿戴设备：带平整接缝与固定口袋的合身蓝色舱内制服；集成生物识别贴片的柔软灰色保暖内层；配低突起任务硬件的轻便白色飞行服；关节部位具有柔性拼片的深色极简航天器服装；带刺绣任务徽章与腕部显示屏的橙色飞行服；配磁性闭合件和紧凑遥测腰带的海军蓝工作服；带柔软快拆腰部系绳的舒适长袖舱内服装；有反光安全滚边的浅银色零重力服装；配柔软胸部遥测带和腕部显示屏的部分艺术裸体；配低调生物传感贴片和腰部系绳的完整艺术裸体；非承重快拆监测束带横过裸露皮肤；裸体配紧凑环境控制颈圈与通讯耳机；沿躯干贴合而不遮蔽自然身体轮廓的极简传感网衣；在髋部固定的敞开飞行服，内配航天器专用监测穿戴装备；保暖衣物折入附近储物网，同时生物传感器仍贴附；大腿与上臂佩戴柔软遥测带，线缆短且贴身。
    - 头发状态：长发向外展开成失重光环；短发轻轻离开头皮；辫子漂成缓慢弯曲的线；松散卷发在脸周围漂移；马尾随每次转身向后摆动；旋转时柔软发丝掠过眼睛；蓝色地球光从后方照亮头发；极短发强调变化的面部朝向。
    - 符合内容级别的亲密互动：身体相遇前双手跨越空隙伸向彼此；手指相扣以停止失控漂移；双方缓慢旋转时额头相贴；观测窗附近轻柔的面对面拥抱；抓住扶手固定时短暂温柔亲吻；一方引导另一方穿过圆形舱口；由安全带稳定的背贴胸拥抱；轨道黑夜时面颊贴靠肩膀；身体漂远时掌心相抵；双方绕共同质心转动时手臂相连；一方抓住另一方手腕并拉近；安静对视映在漂浮水滴中；意外轻旋后的保护性拥抱；从舱段相对两端漂来后的缓慢重聚；两名成年人均脱离所有表面漂浮时的全身肌肤拥抱；裸身胸贴胸接触，髋部错开且柔软腰部系绳在后方拖曳；一名裸体成年人相对另一方倒置时的长吻；裸露大腿围绕共同中心交织而不突出人体部位；一名成年人双腿绕住另一方腰部，双方缓慢共同旋转；紧密的裸体背贴胸拥抱，两具身体沿同一轨道弧线运动；手张开放在肩胛、腰部与髋部外侧，控制共同漂移；泛红面孔与微张双唇相互贴近，裸露皮肤上的生物传感灯脉动。
    - 零重力身体配置：面对面，双方身体斜穿舱内；一方相对相机直立而另一方看似倒置；双方横于走廊且彼此平行；双方朝相反方向而双手相连；并排漂移、肩膀轻触；背贴胸对齐并漂离软垫墙；脚朝向相对墙面，面孔处于同一高度；身体围绕共同抓握点形成宽
      V 形；一方被腰部系绳定在中心，另一方沿缓慢圆形轨道移动；双方轻轻蜷曲于共同质心周围；圆形舱口两侧的镜像姿势；交织手臂形成稳定旋转的一对；裸身胸贴胸对齐而髋部明显错开；双方围绕共同中心蜷曲，裸腿松松交织；一名裸体成年人倒置于另一方上方，面孔与躯干贴近；双腿绕住伴侣腰部，双方身体都完全悬浮；在开放舱内空间旋转至垂直的紧密勺式贴合；不对称全身拥抱，一方躯干随失重动量弓起。
    - 运动模式：双方松开扶手后继续缓慢共同旋转；横向轻缓漂过舱段整个宽度；围绕固定扶手受控转半圈；从狭窄走廊相对两端逐渐靠近；任一身体触及表面前，成对腰部系绳止住共同翻滚；一方由松弛系绳定于中心，另一方沿弧线靠近；缓慢分开后借助伸出的手重聚；同步穿过多个圆形舱口；连续翻滚交换表观天花板与地板；轻拉手部系绳进行微调，逐渐使双方身体对齐；双方抓住同一条带子后旋转停止；舱内转暗时安静漂向窗边。
    - 照明：冷白舱内灯混合反射的蓝色地球光；暖私人舱灯对照黑暗窗户；细薄金色日出光横过伴侣面孔；暗红应急光投下长而柔软的阴影；导航显示屏染出青色与琥珀色高光；硬阳光被窗框切成条带；近乎黑暗，仅有地球与仪表板照亮；柔和月光勾出漂浮头发的浅色轮廓；轨道日出时明暗交替；柔和逆光使伴侣化为剪影。
    - 声音与氛围：低沉持续的通风嗡鸣；来自航天器结构远处的机械轻响；安静舱室放大的柔软布料沙沙声；封闭舱段内听得见的平静呼吸；微弱无线电通话渐归寂静；漂浮物触壁时的轻敲；亲密时刻之前结束的安静警示音；姿态控制机动产生的细微振动；持续轨道运动中情绪完全静止；低闷设备噪声与私人交谈形成对照。
    - 情绪弧线：俏皮好奇转为安静温柔；最初的笨拙变为协调信任；短暂分离后安心重聚；对地球的惊叹加深为爱意；轻笑沉淀为沉思的安静；引导的手安抚紧张；职业克制与真诚拥抱相平衡；身体亲近柔化共同孤独；共同旋转凝于彼此照顾的一刻；外部浩瀚使内部联结显得珍贵。
    - 结尾图像：伴侣化为蓝色地球前的小剪影；远处穿过圆形舱口的视图中，两人相握的手居中；漂浮照片停在两人之间而不碰到任何一人；两滴水合并，伴侣在后方漂出焦点；旋转的舱室几何环绕他们静止的拥抱；日出在白金色窗前勾勒面孔；两人的倒影清晰停留在黑暗观测窗中；安全带围绕远处两人形成松散圆环；最后可见物件是安静舱内仍在转动的银色笔；航天器窗占满画面，环抱位于边缘的两人剪影。
    - '- 绝不重复同一组地点、运动、相机角度和结尾。- 避免将零重力处理为普通行走、坠落、躺下或站立。- 每幅画面中，每具身体都必须完全离开所有宽阔支撑表面。- 确保能从周围扶手、舱口、窗户、带子和漂浮物理解每具身体的朝向。-
      交替使用开阔观测窗主题和局促内部主题。- 变化情绪基调，同时保持每段关系自愿且相互关爱。- 亲密行为精确符合所要求内容级别，同时保留电影感成人浪漫摄影。- 最终文字中不得将类别名称或选定示例写成列表。-
      拒绝并重写任何具有不可能支撑、矛盾动量、重复人体结构、人数被遮蔽、不安全碰撞或缺乏可见失重证据的画面。'
    - 身体遮盖、姿势强度、身体接触、相机距离和视觉重点都必须符合该设定。
  frames:
    common:
    - 身体遮盖、姿势强度、身体接触、相机距离和视觉重点都必须符合该设定。
    - 画面阶段必须在每条生成提示词中保持相同内容级别。每幅画面开篇时定义该内容级别的状态就必须可见，不得以准备、暗示、预期升级、事后、远景氛围或更温和互动取代。拒绝并重写任何可见结果低于所要求级别的主题或画面。
    - 同一主题内的画面是同一总体时刻的平行视觉备选，而非按时间推进的章节。动作、道具位置、衣物状态或身体朝向均不在画面间继承。每幅画面都必须独立成立，完整重述全部阵容与航天器背景，保持稳定身份和服装锚点，并呈现不同的当前配置、相机策略和情绪重点。
    - 不得按照画面 ID 或序号分配相机策略、身体配置、地点或情绪节拍。在所要求的画面之间，从下方相机语言候选池中以非顺序方式抽取，最大化对比。优先使用尚未采用的策略再重复，包括中远景建立镜头、俯视、低角度、滚转侧视、穿过圆形舱口的纵深视图，以及天体窗前剪影。仅选择所要求数量的备选，不得暗示必须存在额外画面。
    - 每幅画面都必须遵守可信的失重力学：- 没有天然的上或下；- 每次推力都产生相反方向漂移；- 未固定身体会持续移动，直到接触改变其运动；- 头发、布料、液滴、纸张和松散物件独立漂浮；- 扶手、带子、软垫墙和舱内把手提供锚定点；-
      运动保持缓慢受控，除非刻意推力制造旋转；- 伴侣之间的接触改变双方轨迹；以及 - 无人像存在普通重力那样站立、躺卧、下落、跪下或承重。
    - 每位所要求人物都必须在每幅画面中明显漂浮。呈现躯干、骨盆、腿和脚完全悬空，与每个类似地面的平面、墙、天花板、床、座椅、平台、睡袋或宽阔舱内表面之间都有清楚可辨的间隙。任何人都不得站、坐、跪、蹲、躺、斜卧、倚靠、撑住，或将体重搁在航天器内饰上。
    - 手或指尖可以轻握专用扶手、舱内把手或另一位成年人的手来转向，柔软系绳可以连接腰部束带，但这些控制方式必须让身体明显悬浮，而非贴锁于表面。脚、膝盖、髋部、臀部、背部、肩膀和头部不得成为支撑接触点。通过介于其间的漂浮物、投影、视差及整个轮廓周围可见空隙证明悬浮。如果任何人可能被读为着地、站在表面上、躺在表面上或被家具支撑，必须拒绝并重写整幅画面。
    - 每幅画面必须呈现至少三个清晰可见的漂浮物，来自至少两个物件类别。每幅画面还必须通过舷窗、观测窗、反射或对齐舱口包含一处外部天体景观。每个人只描述一个当前姿势和一种当前运动状态。不得在一幅图像中叙述一系列姿势。
    - 用所要求语言撰写最终画面文字。每幅画面必须是一个不分段的自然语言段落，而非剧本、镜头表、标签列表或多节拍故事。将精确景别、相机高度或角度、构图、纵深、光向、颜色、完整成人阵容、面部反应、可及接触、控制性抓握、衣物状态、漂浮道具和可见因果整合为连贯静态图像。
    - 所有肢体保持可追踪，每处触碰都处于自然可及范围内。利用周围扶手、舱口、窗户、带子和漂浮物，使每具身体朝向一目了然。每段以强烈的可见图像结束，而不是解释、说教或未来动作。
    - 相机语言：显示双方伴侣及周围舱室的中远景；穿过两个对齐圆形舱口的广角建立镜头；从天花板朝舱段中心俯视；从地面位置仰视，前景有漂浮物；匹配伴侣缓慢漂移的侧向跟拍；越肩望向观测窗；围绕圆形舱口居中的对称正面构图；缓慢相机滚转，消除任何稳定上下感；前景液滴与远处人物同时呈现的深焦镜头；明亮地球弧线前的剪影镜头；压缩狭窄通道的长焦视图；围绕伴侣共同中心轻缓环绕的相机；相机固定广角，人物旋转穿过画面；反向角度揭示两人身后的天体景观。
