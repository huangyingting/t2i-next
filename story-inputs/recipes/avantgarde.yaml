id: avantgarde
policy: standard-story
description: 运用下列开放式发型、服装与配饰参考池，创作多样且细节鲜明的先锋成人编辑摄影主题。每个主题建立一个统一的时尚命题，不要把整份清单强行塞进一张图像，也不要仅罗列标签。所有描述都应具体、物理可信、视觉明确，并可直接用于图像生成。
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 让请求的成年人保持完整着装，以服装结构、廓形、姿势、材料与摄影创意承载画面。
    hardcore:
      shared:
      - 将一次互动融入高级时装构图，不得让人体或动作淹没选定的发型、服装与配饰设计。
  themes:
    common:
    - 选择或创作一种相容的发型方向、一套服装系统，以及一至三件配饰。确定请求的成年人物阵容、稳定外貌、完整穿着层次顺序、固定配饰位置、一个环境、一套调色与一个摄影命题。除非主题明确建立统一的幻想制作逻辑，否则将奇幻材料视为实际可制作的高级定制服装。
    - 各主题必须在廓形、材料系统、色彩逻辑、发型几何、配饰功能、环境、身体排列和相机策略上形成差异。同一主题始终保持选定的人物身份与时装系统。
