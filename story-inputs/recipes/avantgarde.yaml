    - 每个 Frame 都是一张独立的编辑摄影照片，所选内容级别的完整状态已经直接可见。重新完整描述选定的时装系统、当前服装状态、配饰位置、成年阵容、正在发生的互动、环境、姿势、支撑、相机和光线。所有衣物连接、可见肢体、接触、反射和道具都必须物理连贯。不得叙述穿衣、变形、强度升级或一连串姿势。
    - 这些参考池提供灵感，而不是菜单、配额、固定组合或按标识符进行的分配。当能形成更好的设计时，可以转化条目或创作等效方案。拒绝不相容的年代或材料、普通婚纱目录图像、无关配饰堆叠、被遮蔽的时装锚点、重复人物、畸形倒影、不可能成立的服装、无支撑姿势，以及只在相机角度或措辞上不同的
      Frame。
