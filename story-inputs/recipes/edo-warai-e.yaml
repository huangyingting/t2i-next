    - 采用类似 chūban 的紧凑竖幅比例、类似 ōban 的竖幅或横幅比例，或其他历史可信的 ukiyo-e 图像比例。每个画面开头须命名规格与方向，但以表演场景本身填满图像：不出现版画边框、装框作品、书籍样机、画廊陈列、接触印样或被拍摄的历史图像。
    - 不得添加技术拍摄规格、美容处理、摄影棚制作术语或现代调色语言。通过画面比例、视点、裁切、重叠、负空间、主导对角线及色块层级描述取景。照明仅描述可见的江户时代光源及其产生的图形化明暗区域。
    - 在缩略图尺寸和正常观看距离下，每个画面都必须先读作平面 nishiki-e 构图，然后才显现成年表演者。图像须恰好组织为三条与画面平面平行的浅叠画带：一条裁切的下方道具条带、以成年人互动为主导的中央画带，以及一条稀疏的上方
      shoji、墙面、屏风或建筑条带。条带之间不得产生深远后退。
    - 以发块、衣物边缘、肢体、家具横杆、屏风和宽阔阴影边界建立主导性的平面剪影。每块主要皮肤、织物、tatami、漆器、纸张和建筑色域仅使用一至两个接近的明度，并以深色滚边、清晰重叠或有界图形阴影分隔。人体解剖保持连贯，但由剪影和色域而非圆润明暗塑造形体。
    - 不使用体积明暗塑形、写实投影、光学景深模糊、空气透视、汇聚的室内透视、油亮皮肤高光或绕体光。把江户光源表现为一个浅色底域和一个深色图形区域，而非自然主义照明。
    - Bokashi 仅限一个背景平面，即上方的 shoji、墙面、天空或屏风条带。不得用其塑造成年人皮肤、家具、下方条带、中央场景或空间纵深。所有其他主要区域在远看时仍为平坦、分隔的色块。
    - 近看时，可通过个性化的成熟脸型、连贯的外侧关节轮廓、有支撑的姿态、明确的手部归属、接触对齐、有界服装接缝以及套准的织物图案辨认真人表演者。这些近看线索绝不能推翻远看的平面印象、引入摄影美容渲染或破坏三条带
      nishiki-e 构图。不得添加微观身体细节、连续表面纹理或此限定列表之外的任何近看线索。
    - 每个主题的风格及每个画面都必须明确命名一个江户 nishiki-e 配色，并通过平坦、分隔的色块使其可见。总共使用四至六种颜色：一种深色基调，如 ai 靛蓝或 sumi 墨黑；一至两种暖色颜料，如
      beni 红、朱红、柿色、藏红花色或雌黄色；一种浅色未漂白 washi 或暖奶油色底色；至多一种冷色矿物点缀，如孔雀石色。普鲁士蓝仅限于 1820 年代及之后的场景；更早场景必须使用符合时代的
      ai 靛蓝。
    - 每个画面必须描述一道横跨上方 shoji、墙面、天空或屏风条带的 bokashi 风格渐变。将服装、漆器、纸张、tatami 和建筑组织为大块、平坦且彼此分隔的色块，在缩略图尺寸仍清晰可读。一个浅色哑光区域确立底色，深色边缘保护靛蓝或
      sumi 基调，一小块有界高光形状激活暖色颜料或矿物点缀。不得使用青橙配色、泛化琥珀蓝对比、粉彩生活方式色彩、米色中性调、宽泛彩虹色或无关现代配色。
    - 皮肤在 nishiki-e 色彩层级内使用一种暖色哑光底色，最多加一处有界腮红点缀。面部、裸露皮肤和决定性接触始终通过轮廓与重叠保持可辨，绝不依靠渐变的明暗塑形。
    - 不得渲染可读日文、伪书法、字幕、对话气泡、现代标签、签名、出版标记或仿制艺术家印章。如题签状形态能加强构图，应将其制作为布景中的空白实体纸板或无字负空间块。
    - 近看时，通过成熟脸型差异、连贯的外侧关节轮廓、有支撑姿态、可见手部归属、对齐接触、服装接缝以及套准织物图案确认成年表演者。每个线索都应渲染为从属于宽阔平面色彩设计的有界哑光细节，绝非微观解剖、连续纹理、圆润明暗、光学反射或合成三维表面。
    - 通过实体物件而非全局滤镜承载版画工艺特征：屏风和空白题签中的可见 washi 纤维、矿物妆容或织物丝线中类似云母的微光、抛光漆面、盲压凸纹纸张，以及将类似 baren 压痕的纹样转化为锦缎浮纹或压缩织物。整体图像并非真正的木版画；不得添加全局纸纹、渗墨、横跨皮肤的套准错误、褐斑、毛边或扫描纸张外观。
    - 为每个主题和画面的实体服装、道具及布景表面赋予克制的江户时代材质旧痕。在不同材料上使用三至五种具体的日常老化与使用迹象：植物染 ai 靛蓝、beni 或柿色在外露褶皱处略微褪色，而受保护接缝处仍较浓；常被触摸的漆器边缘磨得光滑并带少量细划痕；青铜或铜配件轻微氧化；木材或
      shoji 框被烟熏黑；受压且稍不平整的 tatami；变软且精心缝补的 kimono 衣摆；磨损的丝绒、松线、打蜡木材，或实际屏风或空白纸板上局部泛黄的 washi。
    - 让房间保持有人居住、受到维护且历史可信，而非破败荒废。按触摸、摩擦、烟、湿气与日晒分配磨损，不要均匀做旧每个表面。保留清晰的 nishiki-e 颜料层级：旧痕可柔化选定的材质表面，但不得使整幅图像变成棕色、米色、灰色或去饱和。
    - 这是江户时代材料旧痕，而非旧图像滤镜。不得使用全局棕褐或泛黄偏色、摄影颗粒、横跨画面的划痕、暗角、褪色胶片效果、纸裂、霉斑、水渍、虫孔、褐斑、普遍污垢、人造渗墨、套准错误或扫描版画损坏。成年人的皮肤须保持为暖色、有界哑光色域，具有清晰轮廓边缘和至多一处腮红点缀，绝不可呈纸质、龟裂、染污、人为风化、油亮或体积明暗塑形。
    - 允许在鼓起的袖子、层泻织物、超大扇子、倾斜屏风、受惊宠物和戏剧表情中进行诙谐夸张，但人体解剖须保持连贯，遮盖程度须精确符合所选内容等级。
    - '每个画面都是同一主题中独立演绎的 ukiyo-e 戏剧静态场景，而非故事板、接触印样、拼贴、分屏、常规自然主义图像、真正木版画、动漫画面、计算机生成渲染或博物馆复制品。每个画面必须以下列四句原文开头，仅替换方括号内选项："Flat,
      borderless nishiki-e theatrical picture plane in a [chūban-like or ōban-like] [vertical or horizontal]
      proportion, enacted by real adult performers. Exactly three shallow stacked picture bands: a lower
      prop strip, a central adult tableau, and an upper architectural strip, all parallel to the image
      surface. Adult faces, limbs, garments, and furniture read as contour-enclosed matte color shapes
      with crisp overlaps and two-step values; contour and flat shadow shapes carry all form. Edo-period
      material patina appears only as bounded wear on physical costumes, props, and set surfaces."'
    - 不得在这四句之间或之前放置场景细节。其后立即接一个最多 70 个英文单词的空间位置图句子。将每位成年人放在画面左侧、中央或画面右侧；所有成年人都留在中央画带。命名支撑表面、躯干与骨盆朝向、次级支撑肢体和可见手部任务。主要肢体须平行于画面平面，不得仅依靠姿势名称。
    - 空间位置图之后，立即写一个独立的当前动作句，直接说明可见行为、衣着状态及相互回应，不先报告内容类别。
    - 用可见动作、衣物状态、接触几何及相互回应补全此句，以证明所选等级。
    - 当前动作句后立即重复此确切平面媒介锁定句："All visible bodies, garments, props, and room planes return immediately to
      contour-enclosed matte color shapes on the same flat three-band nishiki-e surface." 不得在此重复锁定句之前插入细节。
    - 重复锁定句后，恰好写六个描述句：
    - 1. 结合精确日期、地点、季节、时刻、完整成年人物阵容、成熟面部差异、时代发型、符合等级的衣物状态、表情、视线及其余可见手部任务；
    - 2. 结合喜剧插曲、裁切的下方道具条带、中央成年人场景、稀疏上方建筑条带及每条带的必要物件；
    - 3. 结合主导平面剪影、轮廓来源、清晰重叠、近乎统一的尺度、平行主要肢体、负空间、裁切和一条图形对角线；
    - 4. 结合明确命名的四至六色江户颜料层级、轮廓围合的哑光色域、一种暖色皮肤底色加一处有界腮红点缀，以及恰好一道限于上方条带的 bokashi 风格渐变；
    - 5. 结合恰好两种近看表演者线索，仅可从成熟脸型、连贯外侧关节轮廓、可见手部归属、服装接缝或套准织物图案中选择，再加实体布景工艺及恰好三至五种具有可信成因的局部材料旧痕线索；以及
    - 6. 以此确切句子结尾："The complete image remains a flat, borderless, three-band nishiki-e theatrical picture
      plane; adult performers are recognizable only through mature faces, coherent joints, hand tasks,
      support, and contact, while every form stays within matte contour fields on one shallow picture
      surface."
    - 任何描述句不得超过 85 个英文单词；分号分隔的分句仍计入该句限制。对每项必需物件、轮廓来源和旧痕材料仅使用一个决定性例子，不用目录、背景故事、传记或重复解剖描述。
    - 每个画面须独立作为图像生成提示词，同时保持简洁。目标为 700 至 900 个英文单词，绝不超过 1000 个英文单词；若要求其他语言，则采用等量信息密度。返回前计数。若草稿超限，通过删除次要装饰、背景故事、重复空间事实、重复解剖及冗余材料解释来重写，同时保留人物阵容、动作、平面画面结构、配色、幽默与旧痕。
    - 每个画面开头即须使所选等级的定义性状态已经可见。不得替换为准备、正在脱衣、预期升级、事后状态、遮掩、远景建立镜头或更温和的互动。
    - 各画面之间改变决定性瞬间与图形布局：发现、忍笑、协调补救、玩笑责怪或平静事后状态。保留身份与环境，同时变化身体几何、视线、织物节奏、裁切、主导对角线、负空间、下方条带线索及插曲状态。至少一个画面必须仅通过手势就让幽默可读，至少一个画面必须让服装图案成为主导图形结构，而不把成年人降格为装饰。
    - 同时核验没有任何画面看似普通编辑摄影、真正木版画、墨绘、动漫画面、计算机生成渲染、被拍摄的印刷作品或泛化摄影棚布景。成年表演者仍可通过成熟面部结构、连贯关节、手部任务、支撑及接触辨认，而 nishiki-e
      设计主导色彩、轮廓、比例、重叠和负空间。拒绝任何遗漏明确命名的 nishiki-e 配色、符合时代的颜料族、平坦分隔色块、一道 bokashi 风格渐变或类似主版线条轮廓分隔，或以泛化现代自然主义替代它们的画面。拒绝任何远看呈现圆润体积身体、写实投影、深远室内后退、空气透视、油亮美容高光或皮肤上的
      bokashi 渐变的画面。拒绝任何遗漏局部江户材料旧痕，或用全局旧图像、旧照片、做旧纸张、扫描版画效果替代的画面。拒绝任何空间位置图句子未为每位成年人提供字面上的 "image-left"、"center"
      或 "image-right" 位置、中央画带位置、明确命名支撑表面或躯干及骨盆方向的画面。同时拒绝随机伪日文、复制的历史构图、畸形或多余肢体、模糊肢体归属、矛盾左右方向、无支撑重量、相交身体或道具、不可能接触轴线、脱离情境的性感招贴姿态，或与可见动作无关的幽默。最后，不区分大小写扫描每个输出字段；如使用了男性身体词汇限制之外的词语，须重写。
    - 仅返回正面描述所描绘场景的正文。默默执行所有规则：绝不讨论指令、规则、限制、验证、合规、所要求人物阵容、内部内容等级、词汇限制或输出不包含什么。每个词都必须属于图像生成描述，除已确立的日本名称和艺术术语外，每个自然语言词都必须使用所要求的输出语言。
