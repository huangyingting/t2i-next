    - 图像必须不依赖图注便传达精确的当下故事。用汇聚视线、中断手势、移位物件、织物张力、受压坐垫、脚印、洒出的茶或移动屏风连接原因与反应。每只可见的手都必须有清楚、解剖上合理的任务。面部须彼此不同且富于表情，而非相同面具、泛泛微笑或空洞魅力姿态。
    - 恰好构成三条与画面表面平行的浅条带：裁切的下方道具条带、占主导中央画带中的成年人互动，以及补完笑点的稀疏上方建筑或季节条带。各条带间尺度近乎统一，以清晰重叠而非纵深后退组织。局部遮挡应有意使用，绝不可造成意外的解剖混乱。避免只展示服装、没有共同动作、决定或喜剧后果的泛化斜倚人物。
    - 每个画面先构建一个物理可信但视觉扁平化的布局，再添加装饰细节。以画面左侧、中央、画面右侧以及下方、中央、上方画带建立固定的构图相对位置图；解剖上的左、右仅用于指明某个人物自己的肢体。每个主要位置只陈述一次，后文不得矛盾。
    - 将每位成年人与每件家具落实到明确命名的表面，所有成年人始终位于中央画带。躯干、骨盆与主要肢体须大致平行于画面表面。为每位成年人指定面部转向、承载体重的宽阔表面，以及提供次级支撑的膝、脚、前臂、手、髋、背或肩。每个重心都必须落在可信支撑基面之上。tatami、futon、地板、墙壁、长凳或其他结实的时代表面可承重；松散衣袍、屏风、灯笼、动物和手持道具不可承重。
    - 每个身体须单一且可追溯：每位成年人一个头、两条手臂、两只手、两条腿和两只脚，每条可见肢体从肩或髋到末端均有不中断的路径。身体重叠时，用归属者及解剖侧别识别手。为每只可见手和脚安排一个相容的任务；绝不让一条肢体在支撑重量的同时穿过另一个身体、衣物或实体物件。
    - 对任何亲密或露骨接触，两位成年人须在高度、距离、关节活动范围、骨盆角度和接触轴线上相容。通过动作、骨盆对齐、肢体位置与支撑描述完整可见接触路径，不命名男性生殖解剖。不得使用依赖不可见悬浮、不可能的脊柱旋转、髋肩脱臼、反向膝肘、相交骨盆、实体家具被压缩或身体穿过布料弯曲的姿势。
    - 仅在隐藏部分的延续可由可见来源身体明确推知时使用遮挡。衣袍必须围绕身体包裹、堆积、拉伸、垂落和压缩，而不是穿过身体。坐垫和 futon 在真实重量下变形；tatami 和木材保持刚性。宠物、屏风、扇子、灯笼、发饰和漆器必须保有各自有界剪影，不与人相交，也不遮住决定性接触。
    - 结果是由真实成年表演者演绎的全尺寸戏剧静态场景，以 nishiki-e 图形设计主导整体第一印象。利用深色衣物滚边、清晰剪影边缘、漆器边框、发块及分界鲜明的哑光区域，建立类似主版线条的轮廓分隔。将表演者、织物、tatami、shoji、家具和道具压缩为宽阔平坦的色域。采用正面或高位斜视的
      ukiyo-e 布局、平行叠置的条带、裁切形状、图案化负空间、有节奏的对角线和交叠衣袍，而非常规自然主义编辑摄影的取景。
