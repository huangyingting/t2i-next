id: edo-warai-e
policy: standard-story
description: 创作多样、具有历史依据的戏剧化主题，以 ukiyo-e warai-e 的诙谐视觉语言呈现日本江户时代场景。结合真实成年表演者、华美服饰、亲密陪伴、戏剧性夸张、日常幽默以及精湛
  nishiki-e 设计的图形纪律。每个结果首先都应呈现为由成年表演者演绎的平面、无边框 nishiki-e 戏剧画面，而非真正的木版画、常规自然主义编辑摄影、动漫画面、计算机生成渲染、博物馆复制品或可辨识历史作品的复制。
validation:
  frames:
    checks:
    - type: word_count
      when_language: english
      max_words: 1000
authoring:
  level_refinements:
    aesthetic:
      shared:
      - 让每位成年人完整穿着多层时代服饰。身体可以相倚、拥抱、交换调侃目光、整理衣袍或分享私密笑话；使用松开的领口、交叠褶皱、受压坐垫、纠缠衣袖、移位发饰及近距离身体间隔，但衣物与构图须完全遮住乳房、臀部及生殖器，不呈现色情自抚。
      frames:
      - 当前动作句直接描述完整穿着的成年人正在进行的非情色互动，不添加模板化引导语。
    erotic:
      shared:
      - 不描绘生殖器接触或色情化的解剖强调。
      - 不得用屏风、扇子、被褥、衣袖、家具、策略性裁切、遥远剪影或喜剧插曲隐藏定义性内容。每位成年人都须清醒、自愿、回应且能够停止。不得描绘胁迫、痛苦、醉酒或药物影响、睡眠、暴力、未经同意的窥视、恋物化的年龄模糊，或动物参与性接触。
      - 衣袍可以敞开、从肩或髋滑落，或放在近旁，但必须保留足够可见的时代织物、obi、衣袖、发饰或花纹内袍作为场景依据。
      frames:
      - 当前动作句直接描述可见的感官亲密互动，保持非露骨边界，不添加模板化引导语。
    hardcore:
      shared:
      - 面部、自主性、时代环境、织物设计、幽默及 ukiyo-e 美术指导须与行为同等重要。不得模仿、命名、署名或复制任何知名 ukiyo-e 艺术家的构图。
      - 不得用屏风、扇子、被褥、衣袖、家具、策略性裁切、遥远剪影或喜剧插曲隐藏定义性内容。每位成年人都须清醒、自愿、回应且能够停止。不得描绘胁迫、痛苦、醉酒或药物影响、睡眠、暴力、未经同意的窥视、恋物化的年龄模糊，或动物参与性接触。
      - 通过说出行为而非受限解剖词保持视觉明确：插入已经发生、口部接触已经发生、手动刺激已经发生，或成年人维持直接对齐的骨盆接触。使用动作层面的语言、相容的姿态几何、可见接触、相关身体结果和相互回应，不命名、放大、测量或单独描述男性生殖解剖。通过年龄、面部、体型、头发、姿态、目光、骨盆、肢体、支撑与回应识别男性。词汇限制只改变措辞，不改变所要求的内容等级、同意、动作、可见性或空间精度。生成输出中绝不解释或引用此词汇规则。
      - 成年人可部分或完全裸体，但保留或放在近旁的服装必须仍具构图重要性和历史特异性，而非变为普通丢弃布料。
      frames:
      - 当前动作句直接说明正在发生的、双方自愿的成年人明确性行为，不添加模板化引导语。
      - 当前动作句须直接说出正在发生的行为，且不得超过 70 个英文单词。
      - 在每个画面中保留主题的露骨行为，同时变化姿态几何、画带布局、织物节奏和喜剧反应。
  themes:
    common:
    - 每位人物都必须是明显成熟、年满二十五岁的日本成年人。严格使用所要求的成年人物阵容，并为每位反复出现的人物设定稳定的面容、体型、发型、社会角色和 kimono。所有互动都必须显得相互回应、清醒、温暖且出于自由选择。
    - 提及男性身体时，仅使用以下许可列表中的中性外部词语："body, skin, head, hair, face, eyes, mouth, jaw, neck, shoulders, chest,
      torso, back, abdomen, waist, hips, pelvis, buttocks, arms, elbows, hands, fingers, thighs, knees,
      legs, calves, ankles, feet, and toes"。这些许可词语的单数或复数屈折形式均可接受。不得直接说出任何男性生殖部位、其特有的生理状态、俚语、色情昵称、含蓄同义词或物体隐喻。此要求不区分大小写，适用于每个主题的标题、前提、风格字段、画面正文、画内文字和起草备注。
    - 不得通过含蓄的物体隐喻、解剖尺寸、颜色、静脉、表面描述或间接文字游戏规避限制。
    - 每个主题均设定于 1603 至 1868 年间的日本江户时代。明确具体年份或子时期、季节、时刻以及可信地点，例如江户商人町屋、京都茶屋房间、大阪书商楼上、东海道旁的旅舍、游廓更衣室或节庆夜晚的河畔亭阁。建筑、tatami
      布局、shoji、灯具、寝具、漆器、陶瓷、发型、织物、日用品和社会角色都必须符合所选时间与地点。不得混入明治、当代、中国或泛化幻想元素。
    - 布景、服装、道具、发型与妆容均须通过实体搭建和真人表演实现，但所描绘的世界内不得出现现代物件。制作设备、电缆、现代闭合件、看似合成材料的道具及布景外环境均须留在画外。
    - 以华美服饰作为主要的感官与图形手段。根据所选等级，让多层 kosode 或 kimono、obi、内袍、图案衣摆、长袖与精致时代发型保持清晰可辨。以受控的多样性呈现织物图案：符合人物与季节的时令花卉、流水、云朵、扇子、鹤、几何格纹或吉祥纹样。
    - 不要默认一人主动、另一人被动充当装饰。通过手部、姿态、目光以及对物件或衣物的控制，赋予每位成年人可辨的意图与回应。出现女性时，必须使她的愉悦、机智与自主性在视觉上明确无误：她可以主动拥抱、转移笑点、扶住倾倒的屏风、藏起情书、夺回腰带，或平等地迎接另一位成年人的目光。
    - 根据所要求的人物阵容变化成年人的关系：分享私密笑话的老夫老妻、在旅舍相聚的久别恋人、互赠节庆礼物的两名女性、因衣着意外发笑的两名男性，或一小群互相信任的同伴。这些是开放式示例，而非固定模板。绝不可仅凭性别推断支配地位、职业或社会阶层，也不可用地位不平等替代可见的相互自愿。
    - 每个主题都围绕一个改变构图的亲昵喜剧插曲展开：猫偷走腰带、狗用鼻子拱过屏风、宠物鼠逃出盒子、仆人在房外通报送茶、纸灯笼在不合时宜时倾斜、折叠屏风开始倒下、袖子勾住发簪，或其他原创且符合时代的意外。成年人应以各不相同的愉快表情、手势和视线回应。幽默必须赋予场景人情味，而不是羞辱任何人。
    - 不得安排未经同意的隐蔽窥视者。如有旁观者，该人必须属于所要求的成年人物阵容，其在场须被公开知晓，并参与共同的笑话。
    - 部分主题可以用一个温和且符合时代的民俗插曲替代宠物或家居意外：狐狸面具出现在错误的箱子里、画在纸上的幽灵从屏风垂下、小小的伞妖扯住袖子，或 tanuki 造型的茶壶似乎在眨眼。保持事件究竟是超自然现象还是恶作剧的一部分这一点模糊。民俗元素必须幽默、无威胁，并在视觉上从属于成年人物；不得加入恐怖、接触身体的怪物、触手、附身或身体变形。
    - 结果是由真实成年表演者演绎的全尺寸戏剧静态场景，以 nishiki-e 图形设计主导整体第一印象。利用深色衣物滚边、清晰剪影边缘、漆器边框、发块及分界鲜明的哑光区域，建立类似主版线条的轮廓分隔。将表演者、织物、tatami、shoji、家具和道具压缩为宽阔平坦的色域。采用正面或高位斜视的
      ukiyo-e 布局、平行叠置的条带、裁切形状、图案化负空间、有节奏的对角线和交叠衣袍，而非常规自然主义编辑摄影的取景。
    - 不得以远近尺度变化或向外伸出的透视缩短肢体打破平面。手、脚、面部、躯干与骨盆须靠近画面平面；可辨识的成年人体来自成熟面部结构、比例、关节位置、表情和可见手部任务，而非圆润光照、皮肤纹理或光学纵深。
    - 不得添加技术拍摄规格、摄影棚制作术语、美容处理或现代调色语言。通过画面比例、视点、裁切、重叠、负空间、主导对角线及色块层级描述取景。照明仅描述可见的江户时代光源及其产生的图形化明暗区域。
    - 以发块、衣物边缘、肢体、家具横杆、屏风和宽阔阴影边界建立主导性的平面剪影。每块主要皮肤、织物、tatami、漆器、纸张和建筑色域仅使用一至两个接近的明度，并以深色滚边、清晰重叠或有界图形阴影分隔。人体解剖保持连贯，但由剪影和色域而非圆润明暗塑造形体。
    - 不使用体积明暗塑形、写实投影、光学景深模糊、空气透视、汇聚的室内透视、油亮皮肤高光或绕体光。把江户光源表现为一个浅色底域和一个深色图形区域，而非自然主义照明。
    - Bokashi 仅限一个背景平面，即上方的 shoji、墙面、天空或屏风条带。不得用其塑造成年人皮肤、家具、下方条带、中央场景或空间纵深。所有其他主要区域在远看时仍为平坦、分隔的色块。
    - 近看时，可通过个性化的成熟脸型、连贯的外侧关节轮廓、有支撑的姿态、明确的手部归属、接触对齐、有界服装接缝以及套准的织物图案辨认真人表演者。这些近看线索绝不能推翻远看的平面印象、引入摄影美容渲染或破坏三条带
      nishiki-e 构图。不得添加微观身体细节、连续表面纹理或此限定列表之外的任何近看线索。
    - 每个主题的风格及每个画面都必须明确命名一个江户 nishiki-e 配色，并通过平坦、分隔的色块使其可见。总共使用四至六种颜色：一种深色基调，如 ai 靛蓝或 sumi 墨黑；一至两种暖色颜料，如
      beni 红、朱红、柿色、藏红花色或雌黄色；一种浅色未漂白 washi 或暖奶油色底色；至多一种冷色矿物点缀，如孔雀石色。普鲁士蓝仅限于 1820 年代及之后的场景；更早场景必须使用符合时代的
      ai 靛蓝。
    - 皮肤在 nishiki-e 色彩层级内使用一种暖色哑光底色，最多加一处有界腮红点缀。面部、裸露皮肤和决定性接触始终通过轮廓与重叠保持可辨，绝不依靠渐变的明暗塑形。
    - 不得渲染可读日文、伪书法、字幕、对话气泡、现代标签、签名、出版标记或仿制艺术家印章。如题签状形态能加强构图，应将其制作为布景中的空白实体纸板或无字负空间块。
    - 为每个主题和画面的实体服装、道具及布景表面赋予克制的江户时代材质旧痕。在不同材料上使用三至五种具体的日常老化与使用迹象：植物染 ai 靛蓝、beni 或柿色在外露褶皱处略微褪色，而受保护接缝处仍较浓；常被触摸的漆器边缘磨得光滑并带少量细划痕；青铜或铜配件轻微氧化；木材或
      shoji 框被烟熏黑；受压且稍不平整的 tatami；变软且精心缝补的 kimono 衣摆；磨损的丝绒、松线、打蜡木材，或实际屏风或空白纸板上局部泛黄的 washi。
    - 让房间保持有人居住、受到维护且历史可信，而非破败荒废。按触摸、摩擦、烟、湿气与日晒分配磨损，不要均匀做旧每个表面。保留清晰的 nishiki-e 颜料层级：旧痕可柔化选定的材质表面，但不得使整幅图像变成棕色、米色、灰色或去饱和。
    - 这是江户时代材料旧痕，而非旧图像滤镜。不得使用全局棕褐或泛黄偏色、摄影颗粒、横跨画面的划痕、暗角、褪色胶片效果、纸裂、霉斑、水渍、虫孔、褐斑、普遍污垢、人造渗墨、套准错误或扫描版画损坏。成年人的皮肤须保持为暖色、有界哑光色域，具有清晰轮廓边缘和至多一处腮红点缀，绝不可呈纸质、龟裂、染污、人为风化、油亮或体积明暗塑形。
    - 允许在鼓起的袖子、层泻织物、超大扇子、倾斜屏风、受惊宠物和戏剧表情中进行诙谐夸张，但人体解剖须保持连贯，遮盖程度须精确符合所选内容等级。
    - 每个主题必须建立：
    - '- 精确的江户时代日期、日本地点、季节、时刻及社会环境；'
    - '- 具有稳定视觉身份与关系的准确重复成年人物阵容；'
    - '- 直接确立所要求内容等级的身体遮盖、衣物状态、当前互动以及可见内容等级证据；'
    - '- 一个私密、相互亲昵的情境，其中每位成年人都明显主动发起或回应；'
    - '- 一个内部一致、相对于构图的身体位置图，具备可信支撑、伸及范围、遮挡、接触对齐及明确肢体归属；'
    - '- 一个符合时代、具有可见原因与反应的喜剧插曲；'
    - '- 一个每位成年人都有自主性和必要作用的决定性动作；'
    - '- 一个组织构图的织物纹样和一件日用品；以及'
    - '- 一个符合时代的江户 nishiki-e 配色，包括其颜料层级、平面色块方案、bokashi 风格平面、ukiyo-e 画面比例、类似主版线条的轮廓方案、恰好三条浅叠条带、主导平面剪影、焦点层级和图形化明暗设计；另加三至五个局部且材料特定的旧痕线索，其物理成因清楚可见且不削弱配色。'
    - 各主题在阶层环境、房间类型、季节、喜剧机制、情绪基调、关系、主导织物图案、配色、画幅比例、画带布局、裁切、明暗图案和构图上变化。轮换家庭、旅行、节庆、艺术、商业、戏剧和文学社会环境，不刻板描绘其中人物。不得重复同一卧室、猫的笑料、拥抱姿态、倒落屏风、下方条带物件或主导身体布局。应在
      ukiyo-e 色彩限制内变化主导颜料与点缀的关系，而非放弃这一共同色彩语言。
