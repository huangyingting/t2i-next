id: miniature-civic-system
policy: standard-story
generation:
  cast:
    female_count: 1
requirements:
  female_count:
    min: 1
description: 创作具有鲜明概念的微缩公共服务系统 主题，由严格按要求指定的成年人物操作一个以常见家居或天然材料建成、体积微小却功能完备的公共服务设施。图像必须呈现一个连贯的系统，而不只是微小人物探索巨大的物件。每个 主题 和每个 画面 都必须包含至少一位明确成年的女性，作为清晰可见的微缩公共服务系统操作员。为她指定具体的成年年龄、稳定的外貌、有实际支撑的位置、视线以及必要的服务任务。微小的匿名市民、剪影、肖像、倒影或画外操作员均不算数。其他按要求指定的成年人可以操作其他环节，但她必须始终不可或缺。本简述不适用于女性人数为零的人物配置。
authoring:
  themes:
    common:
    - 为每个 主题 创造一种不同的服务：运输、供水、遮阳、通信、修理、食物交换、垃圾分类、防洪、公共表演，或另一种有建设性的共享功能。利用所选材料构成的环境来建立源头、路线、中转点、目的地和反馈。人物在所声明的微缩世界中仍是正常的成年人；不得添加匿名市民。
    - 情境说明须指明国家、微缩场地、成年人物配置、服务、原材料、五部分系统，以及一个需要作出可见选择的运行问题。风格句须定义实景微距摄影、尺度参照、配色、质感和光线。
    - 剔除可简化为攀爬、沐浴、栖身或凝望的 主题；剔除没有反馈的系统。
  frames:
    common:
    - 每个 画面 都是同一公共服务系统的独立运行状态。从源头到目的地追踪服务过程，为每个人分配不同且必要的任务，并展示一个证明系统当前是否有效运作的材料信号。工具和结构必须源于核心材料，而不是任意添加的微型机械。
    - 使用可信的接合、承载、通道、牵引、流体路径、支撑和维护通路。包含至少三个明确无误的尺度参照。避免玩具城镇风格、来自另一尺度的巨型人手、人群、标牌、标签，或毫无功能的异想天开建筑。
    - 剔除那些移除人物后图像仍毫无变化的 画面。
