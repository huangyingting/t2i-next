    - '选集多样性：4. 一个列车、车站、渡轮、机场、公路停靠点或其他旅行场景；以及'
    - '选集多样性：5. 一个商店、办公室、工作室、实验室、作坊、服务柜台、专业厨房或其他工作场所。'
    - '选集多样性：五主题批次中，每种类别恰好使用一次。使用五种明显不同的源类型，其中至少一个是低位电视或影院银幕，其腰部高度开口后方可见地保留穿出者的骨盆和双腿。不要用第二个商店、办公室、工作室、画廊、茶馆或其他工作场所替换某个类别。其他批次规模也按比例尽量拉大同样的社会场景差异。改变职业或零售商品并不会创造新的社会世界。'
    - '选集多样性：不要按主题 ID 分配源类型、情绪、姿势、调色或地点。将示例视为创作推动，而非按顺序用完的列表。否决由长发人物、电视、影院、恐怖、蓝光、正面爬行、相同震惊表情、掉落爆米花或对称成排目击者主导的批次。'
    - '最终静默检查：- 主题没有先把完整请求人物阵容放在源外，然后又从源内引入另一人；'
    - '最终静默检查：- 各主题在源、场景、机制、情绪、门槛、反应、相机、光线和成像质感方面有显著差异；以及'
    - '最终静默检查：- 五主题批次对五种强制场景类别各使用恰好一次，并且工作场所、零售、实验室、办公室、工作室、画廊、作坊、服务柜台或专业厨房合计恰好一个场景；以及'
  frames:
    common:
    - '核心视觉等式：每个主题和画帧都必须让以下等式可见：'
    - '核心视觉等式：一个可辨认的源 + 一次解剖连续的穿越 + 一处边界明确的源内后半身视图 + 一条人类反应链 = 一次决定性的不可能到来'
    - '核心视觉等式：穿出是主要事件，而非背景装饰。至少一名请求中的成年人必须可见地占据同一门槛的两侧：足够多的身体在外，使其可读为到来，同时一条不间断的解剖路径仍将人物连接到源开口。图像必须展示此人从哪里来、正进入哪里。'
    - '核心视觉等式：源必须保留其日常身份。电视仍看得出是电视，影院银幕仍是投影银幕，肖像仍是装框的平面图像，镜子仍是反光玻璃，自动售货机仍是自动售货机。不要把源替换为泛化的发光矩形、暗洞、烟雾传送门或抽象圆环。'
    - '核心视觉等式：源内部居于次要地位，并严格受源物件边界约束。可以在骨盆和双腿后方展示一个简单的地面、房间、风景、天气、季节或光照条件，但绝不能成为第二个完整构图。人物在两侧保持相同的自然皮肤、头发、服装、体积和照片写实感。'
    - '人物与角色约定：严格使用请求中的人物，不增加任何人。每人必须是明显成熟、年龄不低于 25 岁、具有原创面孔的成年人。在整个主题中保持每人的年龄、面部、头发、体型、衣物及其他视觉锚点。'
    - '人物与角色约定：穿出者与目击者合起来就是请求中的完整人物阵容：'
    - '人物与角色约定：穿出女性 + 目击女性 = 请求的女性；穿出男性 + 目击男性 = 请求的男性；所有穿出者 + 所有目击者 = 请求的总人数'
    - '人物与角色约定：绝不把请求中的人物全部当作目击者后，再添加穿出者。对于两女一男的请求，有效分配包括一名女性穿出、另一名女性和一名男性目击，或一名男性穿出、两名女性目击。三名目击者再加第四名穿出者无效。'
    - '人物与角色约定：完整人物阵容只介绍一次，立即将穿出角色绑定到这些已指名人物中的一人。对于两女一男的请求，使用“女性 A 穿出，女性 B 和男性 C 目击”或“男性 A 穿出，女性 B 和女性 C 目击”的结构逻辑。绝不使用“两名女性和一名男性正在做某事，此时另一名女性或男性穿出”的结构逻辑。访客、演员、舞者、肖像模特、旅行者、游泳者、微型居民或来自源内的人等词，都描述已经计数、已经指名的一名请求中的成年人，绝不是新角色。'
    - '人物与角色约定：构思每个主题前，在内部建立人物台账，每名请求中的成年人占一行：稳定身份、性别、年龄以及穿出者或目击者角色。分别清点请求中的女性和男性。即使总人数正确，只要任一性别数量与请求不同，主题就无效。不要为适应概念而将请求中的女性改为男性，或将男性改为女性。返回每个画帧前，重新检查同一份内部台账；不要打印或描述台账本身。'
    - '人物与角色约定：每个可见或暗示存在的人都计入人物数量，包括背景顾客、工作人员、路人、观众、人群、剪影、源内图像中的人、肖像、屏幕人物、倒影、雕像、人体模型和人形阴影。除请求中的穿出者和目击者外，不展示这些人形内容。改用空座椅、建筑、植物、车辆、物件、光线、天气或抽象非人图像充实纵深。'
    - '人物与角色约定：为每名请求中的人物在同一次到来中分配一个不可或缺的角色：'
    - '人物与角色约定：- 一人或多人正在穿过源向外出现；'
    - '人物与角色约定：- 其余所有人都是直接目击者，其姿态、视线、手部和附近移位的物件让惊讶可见；以及'
    - '人物与角色约定：- 多人穿出时，各身体使用独立通行空间或简单可读的先后排列，不重叠，也不造成解剖混乱。'
    - '人物与角色约定：若请求中只有一人，就只让此人处于穿越中心，并通过其自己的回望、支撑的手、警觉表情以及环境的物理反应表达惊讶。不要虚构目击者。有两人或更多人时，至少一名目击者必须直接对穿出者作出反应，而不是看向相机。'
    - '人物与角色约定：反应必须具体且多样，而非一排相同的张嘴表情。可采用悬停在爆米花桶上方的手、双脚仍稳站但肩膀后缩、手指紧抓影院座椅、购物袋掉在鞋旁、饮料倾斜却尚未洒出、拉低眼镜再看一眼、一名目击者本能地扶稳另一人、怀疑地向开口探身、欣喜大笑或震惊地静止。这些是灵感，不是菜单。'
    - '人物与角色约定：优先选择惊讶、难以置信、好奇、欣喜、喜剧式惊慌、敬畏或诡异的认出感。不要描绘踩踏、暴乱、持武器应对、攻击、真正的恐惧、受伤、胁迫、无助或无法离开的人。每名成年人都保持清醒警觉、身体安全且能自主控制。'
    - '内容等级指引：在所有等级中，穿越始终是概念中心，每名请求中的成年人都具有主动、可读的角色。'
    - '半入半出轮廓：将源视为通向纵深的真实开口，而非印在完整前景人物上的图像。穿出者具有一个连续、有体积且垂直于源平面的身体。外侧半身向房间和相机伸出；内侧半身退入屏幕、图画、镜子、容器壁或孔口后方边界明确的源内部。'
    - '半入半出轮廓：有力的爬行布局将低位电视、影院银幕、装框图像、柜体开口或其他门槛放在穿出者后方。头部、头发、肩膀、双臂、胸部及可能的腹部已经在房间内；双掌或一掌一前臂按在外侧宽阔稳定的地面或台沿上；脊柱向前倾斜；腰或髋部穿过屏幕开口；骨盆、双膝、小腿和双脚留在屏幕后方、边界明确的源内部。躯干后方可见边框，外侧身体朝目击者投下真实阴影。'
    - '半入半出轮廓：站立布局使一只脚和大部分躯干处于外侧，骨盆跨过门槛，后腿留在内侧。探身布局使手臂、肩膀、胸部和腹部处于外侧，髋部和双腿留在内侧。每种布局中，身体约百分之四十至六十处于每一侧，使图像立即可读为穿越，而非肖像、投影、倒影、材质变形或站在源前方的人。'
    - '半入半出轮廓：对于电视、影院银幕、绘画、照片、海报、镜子或广告牌等平面源，图像表面只在腰部或髋部像深孔一样分开。屏幕图像在身体后半部分后方继续存在。不要把完整人物贴在图画上，不要让全身半透明，也不要用液态玻璃扭曲包围整个人物。'
    - '参考爬行编排：使用以下原创、通用的电视出口作为最清晰的空间原型：一台低位、无品牌阴极射线管电视位于穿出者后方；屏幕是通向可见房间或风景的开口。成年人头朝前、垂直于屏幕爬出。其头部、头发、肩膀、胸部、双臂和双手已经进入真实房间。双掌按在电视前方较远处的真实地板上，肘部和肩膀承担前半身重量。腹部穿过屏幕中央，腰部周围的边框保持完整可见，而骨盆、弯曲双膝、小腿和双脚以正常三维形态留在边界明确的电视内部。前半身在地板上投下阴影；后半身只接受电视屏幕内部的光线。目击者站在两侧，直视腰部穿越处。'
    - '参考爬行编排：这是几何参考，不是强制要求的恐怖情绪、服装、发型、角色、电视或复制场景。将同样的头朝前爬行、探身退出或单腿在外的空间逻辑应用于原创源和情感基调。'
    - '单场景渲染约定：最终图像包含一个相机、一个连续外侧地点，以及该地点内的一个源物件。外侧地点占据画面大部分。源内部只出现在电视屏幕、影院银幕、画框、镜框、窗户、舱口或开口的精确限定区域内。尽可能展示平面源的四条边，使其有限尺寸明确无误。'
    - '单场景渲染约定：源内部绝不扩展到目击者后方，不替换外侧背景，不成为门口大小的第二套布景，也不以并排面板出现。不要创建分屏、双联画、拼贴、剖视图、前后对比、平行场景、反射复制体或第二相机视图。目击者、穿出者外侧半身和源物件都共享同一外侧地板、透视、镜头和光照空间。'
    - '单场景渲染约定：源内部保持视觉简洁：一个地板或地面平面、一种背景颜色或浅层环境，除穿出者后半身外没有其他人。其存在只为证明骨盆和双腿仍在门槛后方。避免只有天空的背景、复杂的第二房间、远方全景、繁密景观或与外侧地点争夺注意力的源内场景。'
    - '单场景渲染约定：对于镜子，完全抑制普通倒影。镀银镜面在一个腰部大小开口周围保持不透明且可辨认；只有该开口展示身体后半部分。不要展示第二个全身倒影、目击者的另一个副本，或用门口替换镜子。'
    - '单场景渲染约定：对于主要穿出者，头、颈、肩、躯干、骨盆及可见肢体必须可追踪为一个连续身体。每只手和脚赋予一个明确功能：抓握安全框架、按压柔性表面、伸向目击者、在宽阔源台沿上保持平衡，或落在外侧地板上。关节保持自然活动范围，重叠肢体彼此分开。'
    - '单场景渲染约定：人物外侧部分必须伸出足够远，以投下可信阴影、带动空气或松散材料，并占据目击者的物理空间。内侧部分必须仍可见地连接在边界明确的源内部。展示穿越处的腰或髋部，使相当一段躯干位于外侧，骨盆加至少一条完整相连的腿位于内侧。暗腔、暗示隐藏的身体、被裁切的开口、仅露颈部的洞、悬浮上半身，或仅在文字中声称不可见身体在内部延续，都不合格。源内侧身体必须仍是可辨认的人体结构：至少展示骨盆和一条完整相连的腿。内侧半身可以接受源内部限定的光线和天气，但皮肤、服装、关节和体积仍应像普通实拍现实。不要把内侧半身压平、绘画化、像素化、溶解、剪影化、混合、嵌入、熔合或转化为源材质。不要用地图线路、数据线、图示箭头、雾、阴影、文字、抽象图案、笔触或空白源背景替换骨盆、腿、躯干或肢体。声称与源图形 "connected to"、"interwoven with"、"merged into" 或 "formed from" 等措辞，不能证明身体连续。不透明食物、盒子、墙壁和封闭容器作为源均无效，除非宽敞敞开的正面、透明部分或清晰呈现的源内部使内侧躯干或下半身直接可见。不要展示脱离的上半身、截断的轮廓、重复人物、悬浮躯干、缺失骨盆、多余肢体、不可能的弯折，或贴在源上的人。'
    - '单场景渲染约定：每人只使用一种身体状态。倒影、照片、屏幕图像、影子或海报不得创造穿出者的第二个副本，除非它是同一姿势的物理正确反射。不要同时展示内侧版本和外侧克隆体。'
    - '单场景渲染约定：不要依靠完全不透明的传送门光辉、烟云、水花、布料、前景物件、目击者身体或浅景深来遮蔽穿越处。源边缘、穿出身体结构、支撑点、目击者面部和视线关系必须同时可读。'
    - '安全实体奇观：将不可能事件渲染为在真实布景中拍摄的高级实体特效。刚性源具有宽裕圆润的通行空间、宽阔承重台沿、隐藏摄影棚加固结构和稳定地面接触。柔性源可以围绕服装或宽阔身体轮廓形变，但不能压迫颈部、胸部、腹部、骨盆或肢体。'
    - '安全实体奇观：使用完好的安全玻璃、亚克力、柔软布景泡沫、布料、纸、水、光，或看似可脱落但明显无害的材料。不要使用碎玻璃、裸露电力、锋利框边、靠近身体的火、不稳定电器、运转机械、密封容器、挤压门、危险高度、深水、受限呼吸或失控坠落。'
    - '安全实体奇观：电器或车辆源是搭建的舞台外壳，具有可见通行空间，没有运作中的危险机构。不要把身体放入真实运作的烤箱、洗衣机、售货机构、发动机、行车道或其他不安全封闭空间。'
    - '安全实体奇观：材质效果必须符合定格瞬间。布料从可见接触处拉伸，纸沿有支撑的折痕弯曲，水遵循重力，投影光落在表面上，头发和宽松衣物沿同一气流运动，每道投影都与光向一致。不要用任意魔法火花、能量环、闪电或失重碎屑代替专属于源的证据。'
    - '画帧约定：每个画帧都是一张独立的满画幅照片，是同一主题的一种备选诠释，而非时间线中的情节节点。姿势、物件、洒落物、衣物状态或穿出程度都不从另一画帧延续。不要使用 "before"、"after"、"next"、"again"、"still"、"finally"、"further"、"continues" 或同等的连续性语言。'
    - '画帧约定：每个画帧都必须独立重述：'
    - '画帧约定：- 完整请求成年人阵容、女性与男性各自的精确数量，以及稳定外观锚点；'
    - '画帧约定：- 将主题中已经计数的同一角色作为穿出者，使用该角色现有姓名和性别，而非添加源内角色；'
    - '画帧约定：- 可辨认的源及足以识别它的日常周边环境；'
    - '画帧约定：- 哪些人穿出、哪些人目击；'
    - '画帧约定：- 一个精确、解剖连续的门槛姿势；'
    - '画帧约定：- 一个连续外侧地点，源内部仅在源物件边界明确的开口内可见；'
    - '画帧约定：- 每名目击者独特的视线、手部动作、平衡姿态和面部反应；'
    - '画帧约定：- 源边缘的材质表现，以及每个可见支撑点；'
    - '画帧约定：- 相机距离、角度、镜头表现、纵深、照明、调色和成像质感；'
    - '画帧约定：- 一个明确的前景到背景层级；以及'
    - '画帧约定：- 不渲染解释性文字。'
    - '画帧约定：每个画帧开头先写穿出者姓名和真实半入半出几何关系，再描述装饰：指明源、外侧头部、手臂和躯干、单一腰部或髋部交点，以及留在边界明确开口内的骨盆和双腿。然后围绕其安排目击者和环境反应。每句话都必须控制可见内容或摄影执行。'
    - '画帧约定：每个画帧以一个简洁的几何锁定句结尾，重述以下全部可见事实：一个外侧地点、一个边界明确的源物件、一个连续人物、上半身在外、腰部与源只相交一次、骨盆和双腿在内、没有重复人物，也没有分割场景。'
    - '画帧约定：同一主题内的画帧必须至少在四个有意义的维度上变化，维度可选相机高度、相机侧向位置、距离、穿出姿态、目击者排列、反应基调、源边缘形变、外侧活动线索、源内部证据、前景锚点、光线几何和纵深结构。它们保持同一源、人物身份、角色分配、地点、时代、概念驱动机制和电影感基因。'
    - '画帧约定：不要通过将到来过程从头部推进到躯干再到脚、更换源物件、增加人物，或用改写的反应重复同一构图来实现变化。每个画帧都展示完全可读的决定性穿越。'
    - '相机与视觉层级：第一视觉关注点是穿出者的面部和身体，第二是门槛边缘，第三是最近目击者的反应，第四是小而边界明确的源内部。使用视线、手部指向、座椅排、建筑、投影光、倒影或移位的松散物件，将这些关注点结合成一个构图。'
    - '相机与视觉层级：优先使用标准镜头或克制的广角镜头，无畸变地展示身体连续性和目击者间距。只有在源身份和至少一个完整反应仍明显可辨时才使用近景。避免鱼眼畸变、极端透视缩短、压平穿越的陡峭俯拍、严重倾斜机位、裁断关键关节，或让面部和门槛处身体结构消失的远距离广角全景。'
    - '相机与视觉层级：人脸保持清晰且只有一个。运动只可出现在爆米花、水滴、发梢、票、帷幕边缘或掉落围巾等次要松散材料中，并具有一个明确物理原因。不要模糊、复制穿出者身体、目击者身体、面部、手或门槛边缘，也不要给它们加拖影。'
    - '相机与视觉层级：边界明确的源内部光线可以不同于外侧地点，同时保持可信肤色。屏幕光、投影溢光、镜面反射光、柜内实景灯、日光、钨丝灯具、招牌灯泡、画廊射灯、街道反光或家用灯具可作为这一区域性分隔的依据。源内部光线止于源边缘，落在穿出者身体上的部分除外。避免泛化的传送门光辉、无细节黑暗、浓雾以及抹去材质身份的色彩效果。'
    - '无文字图像约定：渲染图像中不得包含标题、说明文字、对话气泡、字幕、标志、品牌、水印、界面、可读海报文案、可读屏幕文案或解释性排版。源为报纸、地图、广告、书、票、控制面板或显示屏时，使用抽象图形标记、图画、色块和不可辨读的纹理。概念必须不依赖文字也可读。'
    - '无文字图像约定：不要先承诺有文字，再在别处否定。时刻表没有可读目的地、时间或数字；白板没有词语、标签、箭头或数据图；购物袋和产品没有店铺标记或标志；杂志和海报没有标题；屏幕没有界面。这些表面只描述非语言的颜色、几何、纹理和图画。'
    - '最终静默检查：返回任何主题或画帧前，确认：'
    - '最终静默检查：- 出现的成年女性数量严格符合请求；'
    - '最终静默检查：- 出现的成年男性数量严格符合请求；'
    - '最终静默检查：- 每名请求中的成年人恰好具有一个稳定身份，没有额外的人；'
    - '最终静默检查：- 穿出者加目击者等于请求总人数，而非在完整目击者阵容外添加穿出者；'
    - '最终静默检查：- 每个画帧复用主题中已指名的穿出角色，不虚构新人类身份；'
    - '最终静默检查：- 背景、源图像、倒影、人群、剪影、雕像、人体模型或人形装饰都没有引入另一个人；'
    - '最终静默检查：- 至少一名原创成年人可见地穿过一个可辨认的源边界；'
    - '最终静默检查：- 源、开口、外侧身体、内侧延续和解剖路径同时可读；'
    - '最终静默检查：- 源平面恰好在腰、髋部或大腿上部与身体相交一次，而非描边或覆盖整个人；'
    - '最终静默检查：- 大约一半身体伸到外侧，而骨盆和至少一条完整相连的腿仍以三维形态留在边界明确的源内部；'
    - '最终静默检查：- 内侧延续直接可见，而非藏在不透明物件、暗腔、裁切之外，或仅靠解释性断言；'
    - '最终静默检查：- 源内侧的骨盆、躯干和相连肢体仍是可辨认的身体结构，具有正常皮肤和服装，而非变成线路、数据、墨水、颜料、像素、文字、雾、阴影或抽象图形；'
    - '最终静默检查：- 没有全身波纹、半透明叠层、轮廓描边或表面扭曲，使完全在外的人看起来像贴在源上；'
    - '最终静默检查：- 身体在源平面两侧具有相同的自然皮肤、服装、体积和真人实拍写实感；'
    - '最终静默检查：- 一个连续外侧地点占据画面大部分，源内部仅出现在源物件可见且明确的边界内；'
    - '最终静默检查：- 没有分屏、第二套布景、反射复制体、并排世界、拼贴、剖视图或扩展的源背景；'
    - '最终静默检查：- 没有穿出者脱离、重复、相互穿插、无支撑、受困或被遮蔽；'
    - '最终静默检查：- 每名非穿出者都有独特且指向源的反应；'
    - '最终静默检查：- 专属于源的对比无需世界观背景或文字即可见；'
    - '最终静默检查：- 更换源后，主要概念不会原样成立；'
    - '最终静默检查：- 一次定格曝光中没有时间推进或备选姿势；'
    - '最终静默检查：- 所选内容等级准确，并融入同一画面；'
    - '最终静默检查：- 所有身体、支撑、材料、反射、阴影和效果都物理一致且安全；'
    - '最终静默检查：- 图像是原创场景，而非重现可辨认角色、艺术作品、电影或广告活动；'
    - '最终静默检查：- 画帧始终是同一主题内的平行备选；'
    - '最终静默检查：- 没有渲染文字。'
    - '最终静默检查：任何输出只要未通过其中一项检查，就静默重写。'
