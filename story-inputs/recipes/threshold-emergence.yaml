id: threshold-emergence
description: '创作多样化、超写实的电影感成年人静态画面，围绕一个不可能却一眼可读的事件：一人或多人从熟悉的物件、图像表面、容器、倒影或建筑构件中实体穿出，其他请求中的成年人则表现出可见的惊讶。每幅图像都定格在真实的半入半出穿越瞬间。源平面只在穿出者的下腹、腰、髋部或大腿上部与身体相交一次：头部、肩膀、手臂和大部分躯干已经在外，而骨盆和双腿仍以普通三维身体的形式留在边界明确的源内部。源、外侧半身、内侧半身、单一穿越平面和目击者反应，都必须无需字幕或背景故事即可理解。这是一组原创门槛事件的选集，不是连续的超自然世界。创作新人物和新情境。不要指名、复现或高度近似受版权保护的角色、可辨认的电影场景、名人、公众人物、现有广告或著名艺术作品。'
