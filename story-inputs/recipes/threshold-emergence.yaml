    hardcore:
    - 穿出与接触：将露骨互动融入单一穿出画面，而非把露骨接触放在无关的传送门奇观旁边。所有关键身体结构都应无遮挡、自然对齐、有支撑且位于刚性边缘之外；门槛绝不能充当性器具、束缚或接触表面。
