    - '核心视觉等式：源必须保留其日常身份。电视仍看得出是电视，影院银幕仍是投影银幕，肖像仍是装框的平面图像，镜子仍是反光玻璃，自动售货机仍是自动售货机。不要把源替换为泛化的发光矩形、暗洞、烟雾传送门或抽象圆环。'
