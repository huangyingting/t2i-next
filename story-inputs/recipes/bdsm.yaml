id: bdsm
description: '创作多样化、超写实的成人 BDSM 摄影主题。每个主题均发生在中国境内的私密、受控场所。医疗角色扮演、冰冷金属束缚器具、湿润反光材质和监控式电影摄影均为可选方向，绝非要求或默认项。赋予每个主题连贯的环境、关系动态、视觉语言和 BDSM 情境；详细的变化规则见下文。


  严格使用所要求的角色阵容。所有呈现的人物均为年满 25 岁、自愿参与的中国成年人，具有原创面孔和明确成熟的面部结构。不得描绘、提及、暗示任何未成年人、青少年、学龄人士、外貌年轻的虚构角色、名人、演员、公众人物或其他可识别的真实人物，也不得使角色与其相似。


  每位参与者均已事先明确同意角色扮演、姿势、玩具、液体、插入行为和摄影。任何表面上的支配、臣服、捕获、惩罚、审讯、监视或无助，都必须明显是由保持清醒、能够沟通和随时停止的成年人共同表演。不得使用失去意识、醉酒或药物影响、受伤、出血、惊恐、真正哭泣、无法解除的束缚、被迫无助、因拒绝而受罚或无法撤回同意的情境。


  任何监控视角都只是私密封闭片场中的电影摄影手法。


  每只可见的手、每处束缚、每件道具和玩具，以及每处身体接触，都必须明确属于或连接到所要求的参与者；绝不暗示画外操作者。束缚必须明显受控、经过安排、可解除，并提供支撑。充分呈现每位被要求的成年人，使其身份、参与情况和自愿意愿能够通过姿态、目光、触碰或沟通得到确认。不得添加所要求阵容之外的侍从、摄影人员、病人、背景人物、倒影中的人物或额外的手。


  不得使用针头、刀刃、武器、电击、掐颈、呼吸限制、接触皮肤的火焰、不安全悬吊、受伤、出血或破损皮肤。绝不只依靠颈部、手腕、脚踝或关节悬吊或倒置身体。每个束缚点、倒置支撑、拍打玩具、温度道具、夹具、笼子和支撑物，都必须有可见或可触及的解除装置。'
authoring:
  themes:
    common:
    - '为每个主题选择不同的私密地点或封闭片场：地牢、仓库或阁楼式空间、隔音工作室、酒店或顶层套房、别墅、地下室、阁楼、后台房间、摄影棚、澡堂或瓷砖淋浴间、营业时间以外的私人俱乐部、画廊、图书馆、传统中式室内空间、剧院舞台、酒窖、屋顶温室、货运电梯、车库、雕塑工作室、台球室、列车包厢布景、镜面舞蹈室，或可选的医疗角色扮演布景。各类别轮换一遍后再重复。绝不默认使用床或检查台，也不得使用正在营业的公共场所、真正的病患照护环境、不知情的旁观者或真实偷拍摄像机。'
    - '为每个地点赋予可信的建筑结构、家具、束缚点、表面、实用物件和受控使用的痕迹。轮换主要固定支撑物：带软垫的地面平台、墙面横杆、姿态扶杆、厚重座椅、立式束缚架、圣安德鲁十字架、肢体固定枷、颈手枷、束缚木马、结实台面、瓷砖淋浴墙、笼子、低台、地垫或其他专用支撑物。避免相邻主题重复使用；道具和设备必须符合场景及自愿角色扮演。'
    - '变化运用纪实、编辑大片、工业风、现场光、明暗对照、摆拍监控、直射闪光和破损质感高 ISO 等影像处理。使用荧光灯、暖灯、窗光、霓虹、硬质聚光灯、水面反射光或深影。保持皮肤、布料、皮革、绳索、金属、液体、冷凝水和环境磨损清晰可辨。'
    - '服装可包括原创成人恋物装束、皮革或乳胶单品、束带、紧身胸衣、长袜、手套、靴子、高跟鞋、剪裁服装、晚装、内衣、部分穿着、裸体或符合场景的角色扮演服装。带有明确成人护士风格帽子和合身白色制服元素等医疗角色扮演服装是可选项。绝不得像校服或某个特定受版权保护的角色。在同一主题内保持每位成年人的身体、面孔、头发、身高、比例和服装稳定；不同主题之间变化原创外貌与造型。'
    - '围绕符合所要求内容级别的不同自愿互动构建每个主题。选择一个清晰可辨的主要设备类别，以及一小组协调的辅助物品；两者均应先变化再重复。绝不默认采用插入、肛门玩法、肛珠或其他可插入玩具，也不添加成堆未使用的设备作为装饰。'
    - '设备库：成人宠物扮演项圈、犬式牵引绳、身体束带、姿态项圈、带衬垫的腕铐、脚踝束缚器、可锁手套、皮带、绳索、日式绳缚、透气束缚包裹、束缚胶带、分腿杆、链条、快拆登山扣、眼罩、软质口塞、隔音耳罩、耳机、保持气道通畅的头罩、带软垫的乳头夹、相连夹子、晾衣夹、磁性施压件、多尾鞭、拍板、马鞭、软鞭、藤条、羽毛、纹理手套、人体安全蜡、冰、抛光冷金属、镜子、遥控器、计时器、笼子、透明围箱、束缚椅、束缚木马、圣安德鲁十字架、肢体固定枷、颈手枷、立式框架、承托身体的吊带、地面环、姿态扶杆、墙面横杆、棒式振动器、可穿戴振动器、假阴茎、吸盘玩具、肛塞、肛珠、阵容允许时使用的阴茎环，以及其他人体安全的成人玩具。仅使用与阵容、动作、姿势和地点相容的设备。'
    - '玩法结构：成人宠物扮演；对称或不对称的绳索几何；保持气道通畅、胸部可活动、双手和解除装置可触及的透气包裹束缚；框架或吊带承托躯干与髋部的支撑式倒置；可自行解开的束缚谜题；伴侣镜像姿势；受控拍打节奏；带有自愿信号的感官剥夺；温度与触感对比；遥控互动；透明围箱；旋转平台；反射动作；或融入建筑和家具的设备。'
    - '将液体玩法视为经过有意设计的视觉类别。在润滑液、汗水、唾液、自愿互动中的精液、阴道液、清水、道具液体以及体外尿液或尿液玩法之间轮换。对于适合以液体为主导的主题，应主动考虑以尿液玩法为主要动作，而不是默认汗水、唾液或润滑液。优先考虑瓷砖淋浴间、澡堂、湿区、防水地牢或带排水设施的摄影棚。追踪来源、方向、体积、接触表面、重力、喷射锥面、液滴、流痕、积液、浸湿布料、反射和连续性。用硬闪光凝固水流或断续弧线，用慢快门拉出液滴拖影，用彩色逆光使喷雾发亮，或以低视角突出反射和涟漪。'
    - '在不同主题之间变化地点类别、建筑结构、主要固定支撑物、主要设备类别、辅助道具组合、服装、原创成人外貌、关系动态、有支撑的姿势、决定性的露骨互动、机位、焦距、摄影风格、照明、配色和环境纹理。分配具有实质差异的场所和影像处理；医疗角色扮演及监控影像均为可选项，不得占主导。不要重复房间描述、家具朝向、身体姿势、照明或道具组合。'
  frames:
    common:
    - '赋予每幅画面实体模拟影像的质感，而不是干净的数字渲染。明确一种处理方式和主导色调：增感 35mm 颗粒、中画幅负片纹理、过期胶片、反转片交叉冲洗、混合光下的钨丝灯型胶片、跳漂、欠曝阴影、过度显影的高光、光晕、化学色偏、漏光、灰尘、划痕或闪光泛光。'
    - '使用强烈配色：病态琥珀色配青黑色；钨丝橙配石油蓝；钠灯黄配污绿色；猩红配漆黑；紫罗兰配电光青；洋红配冷钢色；酸绿配深紫；蓝绿配焦橙；银蓝配炽红；或多色颗粒中的乳白。让一个主色调主导，并以一个强调色贯穿皮肤、服装、设备、建筑、反射、薄雾和镜头伪影。'
    - '拒绝雅致中性、光滑的商业化皮肤、均衡白光、克制的对比度和现代数字锐度。使颗粒、色彩污染、泛光高光、不稳定曝光和不完美对焦成为有意且有触感的表现，同时保持面孔、设备路径、接触点和自愿信号可辨。'
    - '每幅画面都需要直接的视觉冲击，而不是干净、被动的目录摄影。选择数种相容的表现手法，并变化其组合：'
    - '- 在黑暗房间中使用猛烈的机顶直射闪光，在浅色皮肤、白色布料、抛光金属、液滴或湿润表面形成局部溢出高光。- 压黑阴影细节，在深色皮肤、木墙板、房间角落和身体深轮廓中形成浓密的多色高 ISO 传感器噪点。- 强烈的绿色、紫罗兰色、青色或琥珀色镜头眩光；内部反射；光晕；严重红眼；色差；或病态混合色偏。- 由手持不稳、摆动头发、移动肢体、振动束缚器、空中液滴、布料或突然倾斜的相机产生的定向运动模糊。- 镜头上或紧贴镜头前方的液滴、冷凝水、指纹、炫光或圆形失焦高光。- 极端广角畸变、侵入式近距离、低位仰视、地面视角、陡峭俯视、大幅荷兰角、偏心裁切，或主体戏剧性地挤向一侧边缘。- 硬轮廓、锐利投影、重复束缚线条、汇聚建筑线、反光碎片，或制造图形张力的主导前景道具。- 后帘同步闪光、慢快门拖影、摇摄、闪光凝固的面孔和躯干结合肢体重影轨迹，或短暂掠过镜头的移动前景元素。- 甩镜涂抹、闪光双影、局部双重曝光、径向变焦光条、倾斜片门边缘、类似齿孔的边缘漏光，或从拖影背景中迸出的锐利主体。'
    - '图像可以显得破损、不稳定、过度强化、夸张且富有对抗感，但必须保持互动、阵容、设备和人体结构清晰。强化透视：让前景靴子、手、束缚器、摆动道具或湿润反光表面显得庞大，而身体与建筑沿强烈对角线退向深处。使用极端远近对比、倾斜地平线、横穿画面的透视压缩肢体、强硬裁切和爆发性的偏心平衡。不要堆叠所有缺陷；在不同画面中分配猛烈闪光、低照度高 ISO、强烈运动模糊，以及极低、俯视或倾斜的机位。'
    - '绝不让成年人仅手持设备而静止摆拍。通过自愿的成人表演、主动的身体紧张、撑稳姿态、强劲而受控的运动、飞扬头发、拉伸布料、绷紧绳索、振动设备、液滴和不稳定的相机动势表现强度。大多数画面应捕捉清晰的运动峰值：可见的重心转移、受控地拉扯束缚、转身或旋转、跪下或起身的过渡、接触前后摆动的安全拍打玩具、牵引绳或绳索形成的方向线、在空中运动的衣物或头发、定向液滴，或对运动产生反应的家具和设备。'
    - '围绕一个运动方向及强烈的对角线、螺旋或曲线构建每幅动态画面。在纵深上分离身体，让裁切的前景肢体或道具贴近镜头掠过，并沿运动方向留下不对称空间。用闪光凝固面孔、自愿信号和关键接触，同时让较慢曝光为次要肢体、头发、液滴、设备和背景形成拖影。使用摇摄、甩镜运动、后帘同步闪光、闪光凝固的双重轮廓，或曝光过程中的相机倾斜。让运动具有爆发性，而非装饰性。变化朝向镜头、远离镜头和横越镜头的运动；不要只更换角度便重复静态跪姿、斜躺或俯身姿势。'
    - '让面部表情与动作、照明和设备一样强烈；避免通用美人表情。明确眼睛、眉毛、下颌、嘴、舌头、呼吸、肌肉紧张、潮红皮肤、汗水、唾液和注意力。选项包括坚定的眼神接触、强烈专注、绷紧下颌、微张双唇、挑衅凝视、带支配感的咧嘴笑、挑逗性的期待、主动快感、兴奋、明显自愿的臣服，或有意识表演的阿嘿颜风格表情：刻意对眼或向上翻眼、张嘴、伸舌、唾液丝、脸颊泛红和颤动的下颌，同时该成年人保持清醒、能回应并能够停止。'
    - '在多数画面中保留清楚可辨的面孔，并在表情成为视觉中心时使用较近景别。背面和俯视画面可通过刻意转头、侧脸、镜子、抛光金属反射或前后景分层来保留动作和表情。通过眼神接触、相互关注、同步紧张感或明确的自愿信号，将参与者各不相同的反应联系起来。'
    - '用直射闪光、红眼、汗水和唾液高光、运动凝固的面部肌肉、晕开的妆容、风吹乱发、近距离广角透视或锐利的面部反射强化表情。保持身份和面部解剖结构连贯。对眼或翻眼必须通过主动姿态或其他自愿信号显得是在表演，绝不能表现为恐惧、惊恐、真正哭泣、解离、无法聚焦、失去意识、失控的痛苦、残酷，或无法沟通或停止。'
    - '让新颖形式保持清晰：说明身体支撑、束缚路径、道具控制、可用的解除方式和决定性互动。通过协调组合、空间设计、运动、视角和成人角色扮演创造新意，而非危险束缚或不可能的设备堆叠。'
    - '尿液玩法必须明显由清醒成年人协商同意，仅限体外，并且只接触完整皮肤、头发、衣物、靴子、人体安全设备或可清洗的无孔表面。呈现引导尿流者和接收者、主动的自愿信号，以及合理的液流路径、飞溅、流下和积聚。绝不瞄准眼睛、嘴、开放性伤口、食物或饮用容器，也不描绘摄入行为。不得使用血液、粪便、呕吐物、感染、非自愿羞辱或身体痛苦。每种液体都需要可见来源。'
    - '对于肛珠，描述一串连贯的珠子，数量和尺寸递进可见，连接件柔软，金属取出环可触及。说明哪些珠子已插入或仍可见；绝不重复珠串、取出环、手或人体结构。适用时使用润滑液和可信的湿润反射。精液及其他性分泌液必须源于可见互动，并在解剖与空间上保持连贯。'
    - '使用适合地点与设备、可信且平衡的姿势：跪在软垫表面、俯身撑在结实家具上、骨盆安全定位的坐姿或斜躺、倚靠稳定墙壁或框架站立、一条腿得到支撑的侧卧，或固定在专门设计的束缚设备上。高跟鞋必须接触稳定地面，否则脱掉。保持膝盖、髋部、脊柱、肩膀、手腕、手指、骨盆、生殖器、肛门、玩具路径、重力、束缚张力和家具接触合理。避免不可能的插入路径、重复肢体、折断关节、无支撑的重量、不安全悬吊、极端变形、脱垂、撕裂、瘀伤或可见伤害。'
    - '在不同主题和画面之间变化方向与高度：正后方、后侧四分之三、完整侧面、前侧四分之三、俯视、高位斜视、平视、门口视角、反射视角、腰高近景、地面仰视，以及可选的天花板角落监控角度。混合使用广角建立镜头、中等身体构图和选择性近景，同时保持所要求的阵容可识别。'
    - '保持决定性互动清晰可辨。通过身体、家具、束缚线条、建筑、设备、反射和光池引导注意；绝不让头发、衣物、手、床上用品、道具、黑暗、眩光或景深遮蔽关键接触。有意运用透视，但不怪异地放大人体结构，也不将独特地点化为通用模糊背景。'
    - '在同一主题内，保持成年人、身份、地点、服装逻辑、设备位置和协商好的关系动态一致。将画面视为同一场自愿拍摄中的独立完成照片，而非准备、升级、高潮、受伤或事后。每幅画面都包含符合所要求内容级别的完整、明确、可独立成立的成人互动，并具有不同的姿势、相机方向、高度、裁切和视觉中心。'
    - '撰写每段文字前核验：全篇使用英语；主要和辅助设备均明显正在发挥作用；明确的身体或道具运动；数种相容的冲击性表现手法；每位成年人均有强烈且可辨的表情和自愿信号；精确的中国人物阵容；以及有别于上一主题的中国地点。缺少任一项即重写。'
