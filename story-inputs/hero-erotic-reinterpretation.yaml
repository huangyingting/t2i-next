id: hero-erotic-reinterpretation
description: |
  BRIEF

  创作一批以二〇〇二年中国武侠电影《英雄》为分析起点、但在人物、事件、场面和镜头上完全原创的成人情色电影剧照。提取原作的高层电影语法：战国想象中的中国武侠世界、同一事件的多重主观叙述、以红白蓝绿黑组织不同情绪真相、巨大宫殿与空旷自然形成的尺度对比、书法与剑术共享的身体节奏，以及忠诚、欺骗、牺牲和私人欲望之间的冲突。每个 Theme 必须把这些抽象方法转化为一部从未存在过的原创成人武侠电影中的决定性静帧。

  《英雄》及其主创信息只作为作品层面的分析来源。每个 Frame 只在第一分句使用一次“张艺谋执导的二〇〇二年中国武侠电影《英雄》”这一准确作品署名，用于明确参考对象；Theme 标题、premise、style 及 Frame 的其余部分不得再次写出电影名、导演名、演员名、原角色名或原片对白。不得复制演员面孔、标志性服装、独特道具、原片动作设计、场面调度、叙事顺序或可逐镜对应的构图。不得声称重拍、续写、改编或模仿原片。经典性必须来自重新发明后的电影语法，不得来自受保护元素的辨识度。

  SOURCE TRANSFORMATION

  每个 Theme 从原作的一种高层视觉或叙事机制出发，并改变全部具体事实。重新发明人物姓名与身份、人物关系、行动目标、秘密、地点细节、服装结构、武器设计、当前事件、情色互动和镜头位置。不得让观众能够把人物、动作或画面一一对应回原片。

  可以使用但不限于以下开放式转译方向：

  - 将多重主观叙述转化为彼此不同、互不连续的成人关系真相；
  - 将书法与剑术的共同节奏转化为双方自愿的贴身身体指导；
  - 将宫廷礼仪与刺杀压力转化为私密侧殿中的秘密联盟；
  - 将湖面、荒漠、雨幕、庭院、书馆和巨大殿堂转化为原创地点；
  - 将缴械、包扎、换衣、避雨、练字、试剑或守夜转化为情色接触的直接因果；
  - 将颜色从装饰性滤镜转化为人物关系、服装、建筑、天气、实景光源和材质共同建立的叙事系统。

  这些方向不是菜单、配额或固定顺序。每个 Theme 必须选择、组合、改变或发明适合自身原创故事的方法。

  SOURCE-FILM VISUAL DNA LOCK

  每个 Theme 和每个 Frame 都必须首先呈现一部二〇〇〇年代初中国单色章节式诗性武侠史诗的强烈视觉身份，而不是普通古装写实、考古复原、历史电视剧或泛化的武侠摄影。Frame 开头的作品署名只负责明确参考对象，不得代替可见风格描述；这种身份仍必须由画面自身证明。

  每个 Theme 从红、白、蓝、绿、黑五个核心色彩家族中选择一个主导色。主导色必须占据约三分之二至五分之四的可见画面，并同时控制人物服装、建筑或自然环境、实景光线、空气介质与关键道具；只允许一个受控的次要强调色。不同 Theme 可以重复同一色彩家族，但必须改变关系动力、空间几何、天气、动作和强调色。不得使用赭石工坊、灰褐废墟、杂色商帐或综合色调逃避单色章节要求。

  每个 Frame 必须同时清楚呈现以下七项视觉 DNA 中至少五项：

  1. 红、白、蓝、绿或黑之一形成压倒性的单色章节，颜色存在于真实衣料、墙面、植物、天空、水体、沙地、纸张、漆器或光线中，而不是后期滤镜；
  2. 纪念碑式轴线、严格对称、重复柱列、巨大留白或水平镜像构图，使人物与宏大空间形成清楚比例；
  3. 人物调度具有仪式性的静止、克制和精确距离，情色接触成为打破秩序的唯一动作焦点；
  4. 剑、书法笔势、长袖、帷幔、雨线、水纹、落叶、沙尘或发丝形成一条清楚的书法性运动轨迹，但人物身体保持单一可读状态；
  5. 丝、麻、漆木、竹、纸、墨、水、石或金属使用少量而高度纯化的材质关系，不出现杂乱生活道具；
  6. 大远景的史诗尺度与近距离的面孔、手、衣料和皮肤触感形成强烈对照，即使单个 Frame 只选择其中一个距离，也必须暗示另一尺度；
  7. 成片具有洁净、饱和、层次分明的院线胶片质感，色彩分离明确，高光克制，阴影有密度，皮肤真实，不使用粗粝脏污、灰雾去饱和或低成本电视剧质感。

  Theme 的 style 必须先创造一个简短、可复述、不含电影名、导演名或演员名的原创视觉风格名称，再把所选主导色、构图秩序、人物尺度、书法性运动元素、主要材质、实景光源和院线胶片效果写进同一个可见的风格句。该精确风格名称是同一 Theme 所有 Frame 必须逐字复述的稳定视觉锚点。

  每个 Frame 的第一分句必须采用以下语义结构，并把尖括号内容替换为当前 Theme 的事实：

  “这是一帧以张艺谋执导的二〇〇二年中国武侠电影《英雄》为作品层面视觉参考的原创成人武侠电影剧照，采用<Theme 的精确原创风格名称>，以<红、白、蓝、绿或黑>为压倒性主色，并由<轴线、对称、柱列、镜面水平线或巨大留白>建立纪念碑式构图；”

  英文输出使用等效的自然英文结构，并必须明确包含 `using the 2002 Chinese wuxia film Hero, directed by Zhang Yimou, as a work-specific visual reference`、`an original adult wuxia feature-film still`、Theme 的精确原创风格名称、主导色与构图秩序。开篇声明是描述性 prose，不是标题、字段标签、画内文字或实现说明。第一分句之后立即建立当前人物与完成态动作，不得先写人物履历、地点历史、任务背景或抽象评论。

  CAST, ADULTHOOD, AND CONSENT

  使用请求指定的准确人物数量，不得增加、删除、替换或复制人物。不得添加群众、士兵、侍从、摄影师、服务人员、镜中人物、画外参与者或没有身体来源的手与身体部位。

  每个人都必须是外观明确二十五岁以上、清醒、自愿、能够停止并对互动主动回应的中国成年人。为每名人物建立稳定的精确成年年龄、面孔、体型、肤色、发型、服装、配饰、身份、武艺特征和可见身体标记，并在同一 Theme 的所有 Frame 中保持一致。人物可以存在权力、身份、任务或武艺差异，但情色互动不得依赖恐惧、胁迫、醉酒、昏迷、俘虏状态或无法安全退出的处境。

  THEME CONTRACT

  每个 Theme 必须建立一个与其他 Theme 明显不同的原创成人武侠电影世界，包括：

  - 一个明确的战国灵感时代位置，但不冒用具体史实人物；
  - 一个功能、尺度、材质、天气和出入口清楚的中国地点；
  - 完整的请求人物阵容及每个人的身份、外貌与服装锚点；
  - 一段独特的人物关系以及双方当前自愿参与的理由；
  - 一个正在发生、可以直接看见的武侠事件；
  - 一个改变关系平衡的决定性成人亲密瞬间；
  - 一种由色彩、空间、服装、表演、光源、镜头和成片媒介共同证明的原创电影视觉命题。

  每个 Theme 将一种色彩叙事转化为一种不同的成人关系动力。红色可以表现双方主动释放的嫉妒、竞争或欲望；白色可以表现礼仪和克制被共同打破；蓝色可以表现平静表面下的相互试探；绿色可以表现旧日亲密关系被重新确认；黑色可以表现权力空间中的秘密联盟。颜色必须由可见的衣料、墙面、土地、植物、天气、火焰、天光、灯具和材质反射形成，不得只是覆盖全画面的单色滤镜，也不得改用赭石、金色、灰紫或杂色系统削弱五种核心色彩家族。

  情色改写必须发生在原创武侠事件之中。书法训练可以在双方同意下变成贴身握腕与身体校正，剑术对峙可以在自愿缴械后转为持续亲吻，宫殿礼仪可以在安全私密的侧殿中被双方主动打破，湖边切磋可以停在相互支撑的贴身姿态，雨中避险可以让湿透衣料与直接亲密触碰同时成立。武侠动作、成人接触、人物表情和环境必须构成同一个因果明确的当前瞬间，不得把武侠当背景，再把无关情色动作叠加到人物身上。

  为每个 Theme 创建一个简洁原创标题、一个具体 premise 和一个原创电影风格名称。premise 必须让人物、地点、关系、当前武侠事件、情色动力和决定性瞬间成立。style 必须通过空间几何、色彩关系、主要光源、镜头距离、人物调度、服装与环境材质定义该风格，不得使用现成电影、导演、演员或泛泛的“电影感”作为风格名称。style 中定义的精确原创风格名称必须能够原样嵌入每个 Frame 的第一分句。

  FRAME CONTRACT

  同一 Theme 的多个 Frame 是同一宽泛前提下彼此独立的平行静帧，不是连续剧情、动作步骤、真相揭晓顺序或故事板。不得让服装、武器、伤痕、液体、姿势或情色接触状态从另一个 Frame 延续，也不得使用“同一”“此前”“随后”“再次”“仍然”“下一刻”“前一帧”“上一帧”“已经更”“完全转为”或其他跨 Frame 连续性与升级措辞。

  人物身份、地点功能、服装逻辑、关系动力和至少五项视觉 DNA 在同一 Theme 中保持稳定。每个 Frame 必须从零建立一个完成态的独立方案，服装覆盖状态、武器位置、姿势与情色强度在该 Frame 内自行成立，不得比另一个 Frame 更早或更晚。每个 Frame 在决定性动作、人物调度、身体接触、取景距离、观察方向、前景关系或书法性运动元素上形成明显不同的方案。只改变调色、镜头裁切、衣物脱落程度或形容词不构成有效差异。

  每个 Frame 只呈现一个物理成立的当前瞬间。第一分句先用准确作品署名明确《英雄》是作品层面的视觉参考，再声明这是原创成人武侠电影剧照，并逐字复述 Theme 的原创风格名称、主导色和纪念碑式构图秩序；随后建立时代、具体地点和当前事件，再完整描写所有可见人物的成熟外貌、发型、服装状态、姿态、视线、表情与主动回应，并融入最重要的武侠动作、成人身体接触、接触造成的直接可见结果、环境层次、镜头位置、焦距倾向、景深、主要光源和成片质感。

  所有句子都必须能转化为可见或可摄影控制的信息。不得解释象征意义，不得讲述无法看见的背景历史，不得告诉观众应该感受什么，不得将 Theme 写成文学梗概、武侠对白或情色小说段落。

  CONTENT LEVEL

  准确遵循请求选择的 content level，不得提高、降低、延后或改名。

  在 aesthetic 级别，所有人物保持完整且不透明的成人武侠服装，通过距离、礼仪、身体方向、剑术调度、眼神和空间压力表现感官张力，不出现裸体或性接触。

  在 erotic 级别，每个 Frame 从第一帧到最后一帧都必须直接呈现与故事相容的成人情色完成态：可见但非露骨的成人裸露、衣物明确滑落或半褪、持续发生的亲密触碰、贴身拥抱、亲吻、主动自我触碰、相互压迫但可随时停止的身体关系、姿态张力以及双方清楚可见的情绪回应。不得只用眼神、呼吸、暧昧光线、伸手接近、“即将触碰”、未完成的解衣动作或事后痕迹代替画面中的实际成人亲密内容。

  在 hardcore 级别，遵循请求级别对明确成人行为的要求，但仍必须让行为成为原创武侠事件的直接结果，并保持单一静态动作、准确人物数量、主动参与、可信支撑和清楚可见的相互同意。不得添加请求之外的参与者或画外身体部位来提高强度。

  WUXIA PRODUCTION DESIGN

  让每个 Frame 具有完整院线武侠长片的尺度。优先使用巨大的轴线宫殿、空旷侧殿、重复柱列庭院、纯色书法馆、镜面静水亭台、单色竹林、被风塑造的沙漠、被落叶覆盖的林间平台、纯化帷幔室或高墙围合的练武场。使用可信的庭院与室内边界、极少而精确的陈设、符合时代想象的服装与器物、明确的前景—动作层—背景关系、受控遮挡、动机清楚的实景光源和塑造人物关系的调度。近景也必须通过门框、柱列、帷幕、书案、窗格、远处庭院、天气或自然元素暗示更大的世界。

  跨 Theme 轮换宫殿侧殿、纯色书法馆、竹林平台、空旷沙漠帷帐、镜面静水亭台、雨中轴线庭院、高墙练武场、落叶林间台地和山谷中的纯化行宫等原创中国地点。不得使用废弃工坊、灰窑、仓房、杂乱商队帐篷、潮湿洞穴、破败民居、锈铁空间或堆满日常器物的粗粝场景。所有亲密互动必须发生在封闭、受控或明确无普通公众进入的空间，不得在公开广场、正在通行的驿道或普通人群面前展示裸体或性行为。

  武器、书写工具、家具和建筑只能承担物理兼容的任务。利刃必须入鞘、放置在安全距离或由没有进行亲密接触的手稳定控制；不得让刀锋压住皮肤、让人物跌向尖锐器物，或把危险武器当作性接触工具。墨、水、雨、血迹、汗与其他液体必须有可见来源并遵循重力，不得为了情色效果虚构无法解释的液体。

  CAMERA, LIGHT, AND MATERIAL

  相机必须同时服务人物关系、武侠动作和情色接触的可读性。可使用克制广角、标准镜头、肖像距离或横向变形镜头语言，并在不同 Theme 与 Frame 中变化机位高度、人物相对距离、轴线、景深和负空间。避免鱼眼、偷窥视角、监控画面、任意荷兰角、严重透视畸变、切断关节的裁切、空洞大全景或让关键接触被衣料、武器和前景完全遮挡。

  光线必须来自可信的天光、月光、火盆、灯笼、烛台、门窗、雨幕反射或其他可见与可推断来源。明确光线方向、人物与背景分离、阴影密度、高光响应和织物反射。不要把所有画面退化为红蓝霓虹、无来源轮廓光或均匀柔光。

  保留真实成年皮肤的毛孔、细毛、汗意、压力痕迹和温度变化，以及丝、麻、皮革、漆木、石材、竹、纸、墨和金属的准确材质反应。避免塑料皮肤、过度磨皮、梦幻泛光、廉价成人视频截图、现代影楼古装照、舞台烟雾堆积和无动机的综合色污染。

  ANATOMY, CONTACT, AND SINGLE STATE

  每位人物只能出现一个连贯身体实例。所有可见肢体必须能从肩或髋追踪到末端，每只手、脚、嘴和承重肢体只承担一个相容任务。人物位置、躯干方向、骨盆方向、目光目标、接触点和重量支撑必须清楚；身体重量由可信的地面、墙面、床榻、坐榻、书案边缘、柱体或其他固定结构承担。

  亲密接触必须处于自然可达范围。服装和武器必须避开决定性接触与承重点，不得穿透身体、悬浮或在同一静态画面中同时处于互相矛盾的穿着状态。镜面、漆面、水面、阴影、帷幕和多重叙述不得生成额外人物、重复身体或第二个动作状态。

  VARIATION AND REJECTION RULES

  跨 Theme 轮换五种核心色彩家族、叙事机制、地点功能、人物身份、社会关系、情色动力、武侠活动、服装轮廓、构图系统、镜头语言、主要光源、天气、材质和成片媒介。每个 Theme 都必须保留单色章节、纪念碑式秩序和书法性动作，但不得让整批结果被红衣、飞叶、雨水、纱帘、床榻、拔剑、背光剪影、同一种男女组合或同一种支配关系垄断。

  静默拒绝并重写以下结果：

  - 能够辨认出原电影、演员、角色或具体镜头；
  - 使用电影名、导演名、演员名、角色名、原片对白或版权标志；
  - 仅靠服装、道具、颜色滤镜或地点名称区别 Theme；
  - 把情色内容延迟到画外、准备阶段或事后；
  - 把多个 Frame 写成前后连续动作或不同版本的真相顺序；
  - 增加请求之外的人物、倒影、影子人物或身体部位；
  - 出现胁迫、恐惧、昏迷、失去判断能力或无法退出的互动；
  - 让危险武器接触裸体、承重身体或情色接触点；
  - 人体结构、支撑、接触轴线、镜像、武器或服装状态互相矛盾；
  - 使用废弃工坊、灰窑、仓库、粗陶杂物、锈铁废墟、灰褐商帐或肮脏洞穴作为主要视觉身份；
  - 缺少压倒性的红、白、蓝、绿或黑单色章节，或者缺少纪念碑式轴线、对称、巨大留白与人物尺度关系；
  - 成片像普通历史电视剧、考古复原、灰暗写实古装片、海报、广告、剧本、分镜表、幕后照、影楼古装照或低成本成人视频截图。

  OUTPUT

  每个最终 Frame 必须是一个无换行、无字段标签、可独立渲染的自然语言段落。第一分句必须准确且仅一次写明以张艺谋执导的二〇〇二年中国武侠电影《英雄》为作品层面的视觉参考，明确声明这是原创成人武侠电影剧照，逐字复述 Theme 的精确原创风格名称，并说明红、白、蓝、绿或黑主导色与纪念碑式构图秩序；缺少其中任何一项都必须静默重写。除这一开篇作品署名外，不得包含其他真实电影片名、演员名、导演名、版权角色、原片对白，也不得包含标题、编号、Logo、字幕、水印、画内说明文字、备选方案、创作解释或实现指令。

  中文 Frame 目标长度为四百五十至六百个汉字，不得超过七百个汉字；英文 Frame 目标长度为二百二十至三百词，不得超过三百五十词。返回前删去重复锚点、背景故事、抽象评价和次要装饰，并检查准确人物数量、成年身份、主动同意、单一动作状态、武器安全、人体结构、接触可达性、地点边界、色彩叙事和原创性。
