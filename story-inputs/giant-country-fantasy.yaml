  最后镜头句还必须逐字复制“live-action photorealistic location photography captured from sufficient distance with a real 35–50 mm camera”，并写真实演员、皮肤毛孔、布料、实景道具、自然曝光与一致阴影中的至少三项。
  只用自然英文简单现在时。NEVER OUTPUT THESE TOKENS IN ANY CONTEXT: previous frame, same, identical, unchanged, still, again, now, remains, then, afterward, next, about to, will, normal-human-sized, open palm, open-palm, extended index finger, pointing finger, dangling finger, measuring finger. 每帧独立重述锁定事实。正文只用英文标点。最终扫描：U+2019 改为 ASCII apostrophe，U+2010、U+2011 和 U+2012 改为 ASCII hyphen，U+2014 改为逗号，除精确“35–50 mm”外的 U+2013 改为逗号；任何 CJK 词完整改写为英文。输出前确认 S2、S3、S3A、S3B、S3C、S4、S4A、S5、S5A、S5B、S6 顺序正确，最后写“The visitors retain an unmistakable finger-length miniature scale without any measuring hand or finger in the composition, while both giant hands share one natural size and depth plane.”再写最终摄影句。

  VARIATION AND REJECTION RULES

  发现以下任一问题就简化并重写，不要解释：
  0. Ledger 任一实体缺少唯一 owner、parent、state、support、depth、slot 或 task，或跨句改变状态。
  1. 人数、性别、成人身份或工位数错误；出现额外人物、第二巨人、玩偶、儿童或人物融合。
  2. 巨人不是最大视觉质量；访客群不小于巨人头、访客不短于巨人脸、物件与访客等高、透视假尺度、两手异尺或第二巨人。
  3. 身体图不连通、器官不属于 single pelvis、出现第三条腿、第二骨盆或混合器官；GENITAL/RELEASE STATE 改变、不兼容或流体来自错误器官；家具切断身体链；缺少 S5A/S5B。
  4. 缺少唯一 S4A；衣物拥有两个状态、裤腰、closure 或位置；closure 类型改变；裤子消失；暴露不是最小必要访问；缺少可见 privacy condition；发生偶然或公开暴露。
  5. Necessity Chain 缺任一环，无法回答七个 why，限制损害同意能力，或未通过 Counterfactual Necessity Test；VISIBLE CONSTRAINT 未在 S5 可见或 S6 改写；Trigger Source Path 缺少 source、medium 或 target，或触发源从未物理接触目标；trigger 来自设备故障、损伤或器官进入设备；Need-Target Identity Lock 断裂；S6 少于四次 the contact point itself；需求、作用或结果转移到相邻区域；出现 instrumental exposure；或任一因果环节可删除。
  6. Signature Mechanism 无地点来源、传力链、承重、唯一输出端或可见结果；三名访客角色可互换；体液无来源与落点；BDSM 缺安全释放或形成第二行为。
  7. 内容等级错误、行为停在准备、出现未分配接触、第二行为、访客彼此性活动或有人旁观。
  8. 缺少夸张表情、访客信号或会改变接触的巨人动作；巨人被动旁观，或访客互相身体接触。
  9. 地点不可识别、风格重复；机位不适配姿势、巨人不主导最长轴、裁掉身体链、极端透视或失去实拍质感。
  10. 未按 S1–S5A–S5B–S6 句序，缺少固定句，出现禁词、CJK、非法 Unicode、数字倍率或错误摄影短语。
