  S3C GIANT DOMINANCE：紧接 S3B 逐字写“The sole giant is the frame's overwhelmingly largest visual mass from head to feet along its longest axis, the complete visitor group and interaction deck form a secondary cluster smaller than the giant's head, and each visitor's full height is visibly shorter than the giant's face from chin to hairline.”
