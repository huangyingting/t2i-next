  S3 描述锚点时只能逐字写“the selected giant-scale everyday anchor functions as an ordinary everyday object for the giant”，不得在 S3 使用 held、worn、lying、resting、remains 或其他位置状态词；锚点的唯一位置状态只在 S3A 和 S5 写。S3 必须明确包含一个最低台阶、门槛、路缘或支撑底座高过访客全身，不得用家具或第二件日用品替代环境高度证明。
