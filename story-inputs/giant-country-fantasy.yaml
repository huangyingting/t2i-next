  后续句只补体毛、流体与环境，最后以指定真人实拍镜头句结束。

  每个 Frame 组成一个英文段落。物理第一句必须点名具体 real-world giant-country setting，并以“At [specific real-world giant-country setting], exactly [total] separate adult bodies are visible in total:”开头，不能只写 generic interior、outdoors 或 giant country。total = 1 + female_count + male_count。随后写 finger-length miniature-scale 访客人数、左到右工位、纯文字 finger-length 尺度、巨人身份、地点原生机制、35–50 mm 机位和选定摄影风格。
