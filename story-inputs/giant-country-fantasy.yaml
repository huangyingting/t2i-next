  整体是 live-action photorealistic location or constructed-set photography：真实成年演员、皮肤毛孔与体毛、布料、实体道具、可信光学和一致阴影。允许广告级布光、粉彩、奢华材质与彩色灯光；禁止 magic、levitation、illustration、painting、anime、comic、CGI look、3D render、塑料皮肤和镜像、复制或融合身体。

  THEME CONTRACT

  Theme premise 简短写明：具体日常地点和可见 PRIVACY CONDITION；选定摄影风格；finger-length miniature-scale 访客人数和性别；巨人身份和体型；纯文字 finger-length 尺度；日用品证明；LOCATION TRIGGER、GIANT NEED、VISIBLE CONSTRAINT、SCALE ADVANTAGE、LOCATION AFFORDANCE、EXPOSURE NECESSITY、逐人 ROLE DEPENDENCY、CONTENT-LEVEL SOLUTION、VISIBLE RESULT 和 RECIPROCAL RESPONSE；并回答全部七个 why。超自然地点仅在输入主题明确要求时使用。
  同一 Theme 的多个 Frame 是同一个已发生主要行为在不同机位下的独立重演，不是前后发展的故事。每帧开场直接处于接触之中。
  同一 Theme 的全部 Frame 锁定巨人的支撑姿势、骨盆旋转、双腿位置、目标器官轴向、访客姿势、装置位置和接触方向；只能改变摄像机高度、方位和构图，不能把站、坐、跪、躺互换。
  先为每个 Theme 写一次不可变的 S2–S6 subject block，再复制到全部 Frame；食指参照手侧、fingertip-to-base-knuckle 身高关系、日用品证明、内容等级、因果前提、访客工位、行为和巨人回应都属于不可变 block。配对 Frame 只改变相机方位和最终镜头句。

