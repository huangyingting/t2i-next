id: indoor-couple-pose-aesthetic
description: |
  BRIEF

  Create exactly 100 standalone English text-to-image prompts. Each Theme and its
  single Frame must use the pose assigned to its Theme ID in the POSE MAP below.
  Never reorder, omit, merge, paraphrase into a different pose, or reuse poses.

  CAST AND RELATIONSHIP

  Every image contains exactly two consenting adults and two complete bodies:
  one Chinese woman aged 25 or older and one Chinese man aged 25 or older. Begin
  every Theme premise and Frame with: Exactly two adults and two complete bodies
  occupy the entire image. Then give each adult a numeric age, gender, and name.
  No other person, body, reflection, projection, mannequin, photograph, or
  human-shaped background figure appears.

  The woman performs the assigned pose exactly. Preserve the stated body
  orientation, spine shape, hip level, knee bend, leg direction, foot placement,
  arm position, and support surface. The man occupies a complementary intimate
  position beside, behind, above, below, kneeling near, standing near, or
  supporting her. His body must not obscure the woman's pose-defining joints,
  limbs, hands, feet, waist, or silhouette. Describe his torso, pelvis, legs,
  hands, gaze, and support points clearly. Both adults remain alert, comfortable,
  voluntary, and mutually engaged through eye contact, returned touch, a shared
  grip, coordinated posture, or matched expression.

  STYLE AND WARDROBE

  Create beautiful, refined, sensual indoor photography rather than clinical
  documentation. The requested content level controls nudity and intimacy, but
  the assigned pose remains the visual priority. For each adult separately,
  describe body build, skin tone, face, hairstyle, grooming or makeup, expression,
  wardrobe state, footwear, and one or two accessories. Use elegant materials
  such as silk, satin, chiffon, lace, velvet, fine knit, polished leather, brushed
  metal, translucent glass, linen, or soft cotton. Clothing may remain worn,
  opened, loosened, draped, or placed visibly nearby as appropriate. Keep anatomy,
  hands, feet, and garment boundaries coherent.

  INDOOR ENVIRONMENT

  Every image takes place indoors. Vary the setting across sophisticated
  bedrooms, boutique hotel suites, lofts, glass conservatories, private salons,
  artist studios, libraries, music rooms, penthouse lounges, traditional modern
  interiors, dressing rooms, indoor pools, winter gardens, minimalist apartments,
  and atmospheric historic rooms. Describe the floor, walls, ceiling, windows or
  doors, principal furniture, textiles, and at least five located props. Keep the
  space inhabited and specific without cluttering the bodies.

  LIGHT, CAMERA, AND BEAUTY

  Vary light and viewpoint across the batch. Use window light, moonlight,
  overcast daylight, diffused skylight, candle-like practicals, soft tungsten,
  cool architectural light, reflected pool light, patterned window shadows,
  projected foliage, or mixed cinematic sources. State source position,
  direction, softness, color temperature or color character, falloff, highlights,
  and shadow behavior.

  Use a beautiful photographic or painterly-photographic style selected for each
  scene: fine-art editorial, romantic cinematic realism, luminous fashion
  photography, soft chiaroscuro, contemporary boudoir, classical composition,
  dreamlike realism, elegant film still, muted analog color, or polished
  high-fashion minimalism. Specify a rectilinear 35-85 mm lens, aperture,
  camera height, camera side, framing, depth planes, focus hierarchy, and color
  palette. Prefer medium-wide or full-body compositions that clearly show the
  assigned pose. Avoid cropped limbs, fisheye distortion, extreme wide angle,
  confusing mirrors, duplicate bodies, malformed hands, and merged anatomy.

  OUTPUT

  Each Frame is one single-line natural English paragraph of at least 450 words.
  Use printable ASCII U+0020 through U+007E only. Return positive visible
  description only, with no headings, labels, Theme IDs, Frame IDs, checklists,
  alternatives, negative prompts, or commentary. Theme titles should name the
  pose concept and indoor setting concisely. Before returning, verify exact cast,
  exact assigned pose, indoor environment, complete styling, coherent anatomy,
  beautiful light, camera specification, and ASCII output.

  POSE MAP

